<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=5">
<meta name="theme-color" content="#1F4D3D">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="321以弗所書講義">
<meta name="application-name" content="321以弗所書講義">
<meta name="description" content="321以弗所書講義：全書六章逐節原文解經、講章逐字稿與321生命應用。">
<title>321以弗所書講義</title>
<link rel="manifest" id="MF" href="./manifest.webmanifest">
<style>
:root{
  --ink:#12181B; --paper:#EEF0EB; --card:#FFFFFF; --line:#D6DAD2;
  --pine:#1F4D3D; --pine2:#2E6B55; --brass:#9C6B18; --clay:#8C3A2E; --dusk:#54636B;
  --fs:17px; --r:14px;
  --hl-gold:rgba(156,107,24,.32);
  --hl-green:#CFE6CC; --hl-blue:#CFDFF4; --hl-pink:#F7D3DC; --hl-purple:#E3D5F1;
  --hl-maroon:#EBD0D0; --hl-brown:#E9D9BF; --hl-charcoal:#DBDAD4;
  --hb-green:#5E9E63; --hb-blue:#5583C7; --hb-pink:#DB7A90; --hb-purple:#9377C0;
  --hb-maroon:#8C4A4E; --hb-brown:#8A6740; --hb-charcoal:#54534E;
  --hl-now:#FFE9A8;
  --sans:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
  --serif:"Noto Serif TC","Source Han Serif TC","Songti TC",serif;
  --mono:"SF Mono",ui-monospace,Menlo,monospace;
}
html[data-dark="1"]{
  --ink:#E8EDE9; --paper:#0E1412; --card:#161E1A; --line:#28332D;
  --pine:#7FBFA4; --pine2:#9BD3BA; --brass:#D6A250; --clay:#D98A78; --dusk:#93A29A;
  --hl-gold:rgba(214,162,80,.34);
  --hl-green:#22402A; --hl-blue:#1F3350; --hl-pink:#45222E; --hl-purple:#332A48;
  --hl-maroon:#3D2525; --hl-brown:#3B3020; --hl-charcoal:#34342F;
  --hb-green:#7BC28C; --hb-blue:#7FA0DE; --hb-pink:#E58FA0; --hb-purple:#A48AC9;
  --hb-maroon:#C08084; --hb-brown:#B99168; --hb-charcoal:#8E8D86;
  --hl-now:#4A3C16;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  background:var(--paper); color:var(--ink);
  font-family:var(--sans); font-size:var(--fs); line-height:1.85;
  padding-bottom:calc(66px + env(safe-area-inset-bottom));
  -webkit-font-smoothing:antialiased;
}
.wrap{max-width:720px;margin:0 auto;padding:0 18px}

/* ── 頁首 ── */
header.top{
  position:sticky;top:0;z-index:40;background:var(--paper);
  border-bottom:1px solid var(--line);
  padding-top:env(safe-area-inset-top);
}
header .bar{display:flex;align-items:center;gap:8px;height:52px;max-width:720px;margin:0 auto;padding:0 12px}
header h1{font-family:var(--serif);font-size:17px;font-weight:700;margin:0;flex:1;letter-spacing:.01em;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ico{
  width:40px;height:40px;border:0;background:transparent;color:var(--ink);
  font-size:17px;border-radius:10px;cursor:pointer;display:grid;place-items:center;flex:0 0 auto;
}
.ico:active{background:var(--line)}
.ico.hide{display:none}
.ico.lang{font-family:var(--serif);font-size:16px;font-weight:700;letter-spacing:0}
.ico.lang.on{color:var(--pine)}

/* ── 分頁 ── */
nav.tabs{
  position:fixed;left:0;right:0;bottom:0;z-index:50;display:flex;
  background:var(--card);border-top:1px solid var(--line);
  padding-bottom:env(safe-area-inset-bottom);
}
nav.tabs button{
  flex:1;border:0;background:transparent;color:var(--dusk);
  font-family:var(--sans);font-size:11px;padding:8px 0 7px;cursor:pointer;line-height:1.3;
}
nav.tabs button b{display:block;font-family:var(--serif);font-size:17px;font-weight:600;margin-bottom:1px}
nav.tabs button.on{color:var(--pine)}

/* ── 通用 ── */
.eyebrow{
  font-size:11px;letter-spacing:.22em;color:var(--dusk);
  margin:0 0 6px;text-transform:none;font-weight:600;
}
h2.big{font-family:var(--serif);font-size:25px;line-height:1.5;margin:0 0 14px;font-weight:700}
h3.sec{font-family:var(--serif);font-size:19px;margin:26px 0 10px;font-weight:700;color:var(--pine)}
.sect{padding:20px 0}
.card{
  background:var(--card);border:1px solid var(--line);border-radius:var(--r);
  padding:16px;margin:12px 0;
}
.muted{color:var(--dusk)}
.sm{font-size:calc(var(--fs) * .82)}
.xs{font-size:calc(var(--fs) * .74)}
.btn{
  display:inline-block;border:1px solid var(--line);background:var(--card);color:var(--ink);
  padding:9px 14px;border-radius:10px;font:inherit;font-size:14px;cursor:pointer;
}
.btn.pri{background:var(--pine);border-color:var(--pine);color:#fff}
html[data-dark="1"] .btn.pri{color:#0E1412}
.btn:active{transform:translateY(1px)}
.bigbtn{
  display:block;width:100%;text-align:left;background:var(--pine);color:#fff;
  border:0;border-radius:var(--r);padding:16px 18px;cursor:pointer;font:inherit;
}
html[data-dark="1"] .bigbtn{color:#0E1412}
.bigbtn small{display:block;font-size:12px;opacity:.82;letter-spacing:.1em}
.bigbtn b{display:block;font-family:var(--serif);font-size:19px;margin:5px 0 0;line-height:1.5}
.row{display:flex;gap:8px;flex-wrap:wrap}
.pill{
  border:1px solid var(--line);background:var(--card);color:var(--dusk);
  border-radius:999px;padding:5px 12px;font-size:12.5px;cursor:pointer;font:inherit;
}
.pill.on{background:var(--pine);border-color:var(--pine);color:#fff}
html[data-dark="1"] .pill.on{color:#0E1412}

/* ── 地形圖（招牌元素）── */
.terrain{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:12px 10px 6px;margin:6px 0 0}
.terrain svg{display:block;width:100%;height:auto}
.tlab{font-family:var(--mono);font-size:8.5px;fill:var(--dusk)}
.tlab.hi{fill:var(--brass);font-weight:700}
.tpath{fill:none;stroke:var(--pine);stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.tdot{fill:var(--brass)}
.tdot.low{fill:var(--clay)}
.tnow{fill:none;stroke:var(--ink);stroke-width:1.5}

/* ── 章清單 ── */
.chrow{
  display:flex;gap:12px;align-items:flex-start;width:100%;text-align:left;
  background:var(--card);border:1px solid var(--line);border-radius:12px;
  padding:13px 14px;margin:8px 0;cursor:pointer;font:inherit;color:inherit;
}
.chn{
  font-family:var(--mono);font-size:12px;color:var(--dusk);
  min-width:26px;padding-top:3px;letter-spacing:-.04em
}
.chrow b{font-family:var(--serif);font-size:17px;display:block;line-height:1.45}
.chrow .s{font-size:13px;color:var(--dusk);display:block;margin-top:2px;line-height:1.6}
.chrow .done{color:var(--pine);font-size:12px}

/* ── 經文 ── */
.vs{
  display:flex;gap:9px;padding:7px 0 7px 10px;border-left:2px solid transparent;
  cursor:pointer;align-items:flex-start;
}
.vs:active{background:var(--card)}
.vs.has{border-left-color:var(--pine)}
.vs.star{border-left-color:var(--brass);border-left-width:3px}
.vs.warn{border-left-color:var(--clay);border-left-width:3px}
.vn{font-family:var(--mono);font-size:11.5px;color:var(--dusk);min-width:20px;padding-top:5px;text-align:right}
.vt{flex:1;line-height:1.95}
.vs .flag{font-size:11px;color:var(--clay);margin-left:4px}

/* ── 六層 ── */
.layer{border-top:1px solid var(--line);padding:12px 0}
.layer:first-child{border-top:0}
.lh{
  display:flex;align-items:center;gap:8px;cursor:pointer;font-size:12px;
  letter-spacing:.14em;color:var(--dusk);font-weight:600;user-select:none
}
.lh .n{font-family:var(--mono);color:var(--pine)}
.lh .caret{margin-left:auto;font-size:11px;opacity:.6}
.lb{margin-top:8px}
.lb.grk{font-family:var(--serif);font-size:16px;line-height:2.05;color:var(--pine)}
.lb.lit{font-family:var(--serif)}
.kw{
  display:inline-block;border:1px solid var(--line);border-radius:8px;
  padding:3px 9px;margin:3px 5px 3px 0;font-size:13px;cursor:pointer;background:var(--card)
}
.kw i{font-style:normal;font-family:var(--serif);color:var(--pine)}

/* ── 表 ── */
table{width:100%;border-collapse:collapse;font-size:14px;margin:8px 0}
th,td{border-bottom:1px solid var(--line);padding:7px 6px;text-align:left;vertical-align:top}
th{color:var(--dusk);font-weight:600;font-size:12.5px}

/* ── 軌跡 ── */
.track{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:15px;margin:10px 0}
.track .gk{font-family:var(--serif);font-size:22px;color:var(--pine)}
.stops{margin:12px 0 4px;padding-left:0;list-style:none}
.stop{display:flex;gap:10px;align-items:baseline;padding:5px 0}
.stop .r{font-family:var(--mono);font-size:12px;min-width:44px;color:var(--dusk)}
.stop .d{width:8px;height:8px;border-radius:50%;flex:0 0 auto;background:var(--dusk);margin-top:6px}
.stop.dark .d{background:var(--clay)} .stop.light .d{background:var(--brass)}
.insight{border-left:3px solid var(--brass);padding:8px 0 8px 12px;margin:10px 0 0;font-family:var(--serif);font-size:16px}

/* ── 爭議 ── */
.iss{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:15px;margin:10px 0}
.pos{border:1px solid var(--line);border-radius:10px;padding:11px;margin:8px 0;font-size:14px}
.pos b{color:var(--pine)}
.consensus{background:rgba(156,107,24,.09);border-radius:10px;padding:11px;margin:10px 0;font-size:14px}
.say{border-left:3px solid var(--pine);padding-left:12px;margin:10px 0;font-family:var(--serif)}

/* ── 分級 ── */
.lv{display:inline-block;font-size:11px;padding:2px 7px;border-radius:6px;font-weight:700;margin-right:6px}
.lv.g{background:rgba(31,77,61,.13);color:var(--pine)}
.lv.y{background:rgba(156,107,24,.16);color:var(--brass)}
.lv.r{background:rgba(140,58,46,.14);color:var(--clay)}

/* ── 打卡 ── */
.chk{display:flex;gap:11px;align-items:flex-start;padding:10px 0;border-bottom:1px solid var(--line);cursor:pointer}
.chk:last-child{border-bottom:0}
.box{
  width:21px;height:21px;border:1.5px solid var(--line);border-radius:6px;flex:0 0 auto;margin-top:3px;
  display:grid;place-items:center;font-size:13px;color:#fff
}
.chk.on .box{background:var(--pine);border-color:var(--pine)}
.chk.on .t{color:var(--dusk);text-decoration:line-through}
.chk .t{flex:1;font-size:15px;line-height:1.7}

/* ── 底部抽屜 ── */
.sheet{
  position:fixed;inset:0;z-index:90;background:rgba(10,16,14,.42);
  display:none;align-items:flex-end;
}
.sheet.on{display:flex}
.sheet .inner{
  background:var(--paper);width:100%;max-height:88vh;overflow:auto;
  border-radius:20px 20px 0 0;padding:8px 18px calc(28px + env(safe-area-inset-bottom));
  animation:up .22s ease;
}
@keyframes up{from{transform:translateY(24px);opacity:.5}}
.grab{width:38px;height:4px;border-radius:2px;background:var(--line);margin:6px auto 12px}
.sheet h4{font-family:var(--serif);font-size:20px;margin:4px 0 2px}

/* ── 其他 ── */
.toast{
  position:fixed;left:50%;bottom:88px;transform:translateX(-50%);
  background:var(--ink);color:var(--paper);padding:9px 16px;border-radius:999px;
  font-size:13.5px;z-index:120;opacity:0;transition:.2s;pointer-events:none;white-space:nowrap
}
.toast.on{opacity:1}
.note{
  width:100%;border:1px solid var(--line);border-radius:10px;background:var(--card);
  color:inherit;font:inherit;font-size:15px;padding:11px;min-height:88px;resize:vertical
}
.q{font-family:var(--serif);font-size:var(--fs);line-height:1.75;margin:0 0 4px}
.tip{font-size:calc(var(--fs) * .8);color:var(--dusk);background:rgba(31,77,61,.07);border-radius:9px;padding:9px 11px;margin-top:8px}
.blank i{font-style:normal;color:var(--clay);letter-spacing:.05em}

/* ── 教學講義逐字稿（長文閱讀）── */
.les p{font-family:var(--serif);font-size:var(--fs);line-height:1.95;margin:0 0 15px;text-align:justify}
.les h4{
  font-family:var(--serif);font-size:calc(var(--fs) * 1.18);font-weight:700;color:var(--pine);
  margin:30px 0 12px;padding-top:14px;border-top:1px solid var(--line);scroll-margin-top:64px
}
.les h4:first-child{margin-top:6px;padding-top:0;border-top:0}
.les p.dec{color:var(--pine);font-weight:600;margin-bottom:9px}
/* 想更深：收起來的一問一答 */
.les details.deeper{
  border:1px solid var(--line);border-radius:12px;background:var(--card);
  padding:10px 13px;margin:0 0 16px
}
.les details.deeper summary{
  font-family:var(--serif);font-size:calc(var(--fs) * .92);line-height:1.65;color:var(--pine);
  font-weight:600;cursor:pointer;list-style:none
}
.les details.deeper summary::-webkit-details-marker{display:none}
.les details.deeper summary::before{content:"＋　";opacity:.6}
.les details.deeper[open] summary::before{content:"−　"}
.les details.deeper[open] summary{margin-bottom:8px}
.les .deeper-a p{font-size:calc(var(--fs) * .95);line-height:1.9;margin:0;color:var(--dusk)}
/* 三個化 */
.les p.t3s{
  font-family:var(--serif);font-size:calc(var(--fs) * 1.06);font-weight:700;color:var(--pine);
  margin:26px 0 10px
}
.les p.t3t{font-family:var(--serif);font-size:calc(var(--fs) * .95);font-weight:700;color:var(--brass);margin:16px 0 6px}
.les p.t3m{
  font-size:calc(var(--fs) * .85);line-height:1.8;color:var(--dusk);background:rgba(31,77,61,.07);
  border-radius:11px;padding:10px 13px;margin:0 0 13px;text-align:left
}
.les p.t3n{margin:0 0 12px}
.toc button{
  display:block;width:100%;text-align:left;border:0;background:transparent;color:inherit;
  font-family:var(--serif);font-size:16px;line-height:1.6;padding:7px 0;cursor:pointer;
  border-bottom:1px solid var(--line)
}
.toc button:last-child{border-bottom:0}
.toc button:active{color:var(--pine)}
.hr{height:1px;background:var(--line);margin:22px 0}
.center{text-align:center}
a{color:var(--pine)}
.foot{padding:26px 0 8px;font-size:12px;color:var(--dusk);line-height:1.9}

/* ── 全螢幕模式（講台／小組）── */
.full{position:fixed;inset:0;z-index:200;background:var(--paper);display:none;flex-direction:column}
.full.on{display:flex}
html[data-tele="1"]{--paper:#0C1210;--ink:#EDF2EE;--card:#141C18;--line:#26332C;--dusk:#8FA098;--pine:#7FBFA4;--brass:#D9A94F;--clay:#D98A78}
.fbar{display:flex;align-items:center;gap:10px;padding:calc(8px + env(safe-area-inset-top)) 14px 8px;border-bottom:1px solid var(--line)}
.fbar .clock{font-family:var(--mono);font-size:15px;color:var(--dusk);letter-spacing:-.02em}
.fbar .clock.over{color:var(--clay)}
.fbar b{font-family:var(--serif);font-size:15px;flex:1;text-align:center}
.fbody{flex:1;overflow:auto;padding:22px 20px 30px;-webkit-overflow-scrolling:touch}
.ffoot{display:flex;gap:8px;padding:10px 14px calc(12px + env(safe-area-inset-bottom));border-top:1px solid var(--line)}
.rail{height:3px;background:var(--line)}
.rail i{display:block;height:3px;background:var(--brass);width:0;transition:width .3s}
/* 提詞機 */
.tele p{font-size:calc(var(--fs) * 1.45);line-height:2.05;margin:0 0 20px;font-weight:600}
.tele .qq{font-family:var(--serif);color:var(--brass);border-left:3px solid var(--brass);padding-left:14px}
.tele h5{font-family:var(--serif);color:var(--pine);font-size:calc(var(--fs) * 1.1);margin:34px 0 18px;letter-spacing:.04em}
.tele .pause{color:var(--dusk);font-family:var(--mono);font-size:13px;letter-spacing:.2em;margin:26px 0;text-align:center}
.tele .pause b{color:var(--brass)}
/* 小組 */
.live h5{font-family:var(--serif);font-size:15px;color:var(--pine);letter-spacing:.1em;margin:0 0 18px}
.live .qq{font-family:var(--serif);font-size:calc(var(--fs) * 1.5);line-height:1.85;margin:0 0 20px}
.live .tipbox{background:rgba(156,107,24,.12);border-radius:12px;padding:14px;font-size:15px;line-height:1.8}
/* 搜尋 */
.sbox{width:100%;border:1px solid var(--line);border-radius:12px;background:var(--card);color:inherit;font:inherit;font-size:16px;padding:12px 14px}
mark{background:rgba(156,107,24,.3);color:inherit;padding:0 2px;border-radius:3px}

/* ── 品牌與啟動畫面 ── */
.brand{width:26px;height:26px;border-radius:7px;flex:0 0 auto;display:block}
.brand.hide{display:none}
#splash{
  position:fixed;inset:0;z-index:300;background:#12305E;color:#fff;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;
  transition:opacity .45s ease;
}
#splash.gone{opacity:0;pointer-events:none}
#splash img{width:132px;height:132px;border-radius:28px;box-shadow:0 12px 40px rgba(0,0,0,.4);margin-bottom:20px}
#splash h2{font-family:var(--serif);font-size:25px;margin:0;letter-spacing:.06em;font-weight:700}
#splash p{margin:4px 0 0;font-size:15px;opacity:.85;letter-spacing:.3em}
#splash small{margin-top:26px;font-size:11.5px;opacity:.55;letter-spacing:.16em}

/* ── 畫線與領受 ── */
.vs.hl .vt{background:linear-gradient(transparent 58%, rgba(156,107,24,.32) 58%)}
.mkw{margin:0 0 14px}
.mks{
  cursor:pointer;border-radius:5px;transition:background .12s;
  -webkit-tap-highlight-color:transparent;box-decoration-break:clone;-webkit-box-decoration-break:clone
}
.mks:active{background:var(--line)}
.mks.hl{background:linear-gradient(transparent 60%, var(--hl-gold) 60%)}
.mks.hl[data-c="green"]{background:linear-gradient(transparent 60%, var(--hl-green) 60%)}
.mks.hl[data-c="blue"]{background:linear-gradient(transparent 60%, var(--hl-blue) 60%)}
.mks.hl[data-c="pink"]{background:linear-gradient(transparent 60%, var(--hl-pink) 60%)}
.mks.hl[data-c="purple"]{background:linear-gradient(transparent 60%, var(--hl-purple) 60%)}
.mks.hl[data-c="maroon"]{background:linear-gradient(transparent 60%, var(--hl-maroon) 60%)}
.mks.hl[data-c="brown"]{background:linear-gradient(transparent 60%, var(--hl-brown) 60%)}
.mks.hl[data-c="charcoal"]{background:linear-gradient(transparent 60%, var(--hl-charcoal) 60%)}
/* 正在朗讀的那一句 */
.spk-now{
  background:var(--hl-now)!important;border-radius:4px;
  box-shadow:0 0 0 3px var(--hl-now);transition:background .2s
}
.les h4 .spk-now,.les details.deeper.spk-now{box-shadow:none}
.les details.deeper.spk-now{background:var(--hl-now)!important}
.mkp{cursor:pointer;border-radius:5px;transition:background .12s}
.mkp.hl{background:linear-gradient(transparent 62%, var(--hl-gold) 62%)}
.mkp.hl[data-c="green"]{background:linear-gradient(transparent 62%, var(--hl-green) 62%)}
.mkp.hl[data-c="blue"]{background:linear-gradient(transparent 62%, var(--hl-blue) 62%)}
.mkp.hl[data-c="pink"]{background:linear-gradient(transparent 62%, var(--hl-pink) 62%)}
.mkp.hl[data-c="purple"]{background:linear-gradient(transparent 62%, var(--hl-purple) 62%)}
.mkp.hl[data-c="maroon"]{background:linear-gradient(transparent 62%, var(--hl-maroon) 62%)}
.mkp.hl[data-c="brown"]{background:linear-gradient(transparent 62%, var(--hl-brown) 62%)}
.mkp.hl[data-c="charcoal"]{background:linear-gradient(transparent 62%, var(--hl-charcoal) 62%)}
.mknote{display:block}
.mknote{
  border-left:3px solid var(--brass);background:rgba(156,107,24,.08);
  border-radius:0 10px 10px 0;padding:10px 12px;margin:8px 0 12px;font-size:calc(var(--fs) * .85);line-height:1.8
}
.mknote[data-c="green"]{border-left-color:var(--hb-green)}

window.__booted = false;
function bootReset(){
  try {
    if (window.caches) caches.keys().then(ks => Promise.all(ks.map(k => caches.delete(k)))).then(go);
    else go();
  } catch(e){ go(); }
  function go(){
    if (navigator.serviceWorker && navigator.serviceWorker.getRegistrations)
      navigator.serviceWorker.getRegistrations().then(rs => {
        Promise.all(rs.map(r => r.unregister())).then(() => location.reload(true));
      }).catch(() => location.reload(true));
    else location.reload(true);
  }
}

<script id="DATA" type="application/json">{"ch":[{"n":1,"t":"都在基督裡面同歸於一","sub":"選、印、首","lv":"A","arc":"坐","sec":[["1:1--2","寫信給在以弗所的聖徒：恩惠、平安"],["1:3--6","在基督裡揀選了我們：父的揀選"],["1:7--12","我們藉這愛子的血得蒙救贖：子的救贖與同歸於一"],["1:13--14","受了所應許的聖靈為印記：靈的印記"],["1:15--23","照明你們心中的眼睛：使他為教會作萬有之首"]],"serm":{"pts":[["父揀選、子救贖、靈印記","1:3--14","「使他榮耀的恩典得著稱讚」——一句兩百多字的頌讚，三次落在同一個終點：神的榮耀"],["同歸於一","1:7--12","「使天上、地上、一切所有的都在基督裡面同歸於一」——神的計畫不只是救幾個人，是把萬有重新歸在一位元首底下"],["心中的眼睛","1:15--23","「照明你們心中的眼睛」——保羅不為他們求更多知識，是求心裡的眼睛打開，看見那位「為教會作萬有之首」的基督"]]},"q":"你記不記得小學體育課分組？兩個隊長輪流挑人，名字一個一個被叫走，最後剩下的那幾個站在場邊，假裝不在乎。長大以後，這一幕換了樣子：落榜的通知、面試後再也沒有回音的電話、裁員名單、父母比較疼的那一個孩子、群組裡沒有被邀請的那一場聚餐。\n我們嘴上說無所謂，心裡卻一直在問：有沒有人會選我？我要做到甚麼程度，才會被留下來？\n這一章要問的是：如果在你還沒有做對任何事、也還沒有做錯任何事以前，就有一位在基督裡揀選了你——你還需要靠被人挑中，來證明自己是誰嗎？","truth":"神在基督裡已經把天上各樣屬靈的福氣賜給我們：父在創立世界以前因愛揀選、子用血救贖、聖靈蓋印作憑據，全都是為了「使他榮耀的恩典得著稱讚」（1:6）。\n這不是給幾個人的私人禮物，是神要把天上地上一切所有的都重新歸在基督這一位元首底下的計畫；教會是今天已經先歸在他底下的那一群人，所以我們求的，是心中的眼睛被照明，看見這一位。","mv":{"t":"要照所安排的，在日期滿足的時候，使天上、地上、一切所有的都在基督裡面同歸於一。","r":"弗1:10"},"card":["這一章是一個戴著鎖鍊的人寫的一首頌讚，加上一個為別人跪下的禱告。頌讚說：父揀選，子救贖，靈印記，三次落在「使他的榮耀得著稱讚」；正中間是神全部的計畫——使天上、地上、一切所有的都在基督裡面同歸於一（1:10）。禱告說：求神照明你們心中的眼睛，看見那位從死裡復活、坐在父右邊、為教會作萬有之首的基督。一句話：你已經被賜福，只是還要被開眼。","這一章幾乎每一個動詞的主詞都是神：他賜福（1:3），他揀選（1:4），他預定（1:5），他在愛子裡把恩典賜給我們（1:6），他充充足足地賞給（1:8），他叫我們知道旨意的奧祕（1:9），他蓋上聖靈的印記（1:13），他叫基督從死裡復活、坐在自己的右邊（1:20），他把萬有服在基督腳下，又把這一位賜給教會作頭（1:22）。人在這一章只做了三件事：聽見，相信，讚美。","1:5「得兒子的名分」，原文是一個字 υἱοθεσίαν（huiothesian），「兒子」加上「安放」——把一個人安放到兒子的位分上，就是收養。在羅馬，被收養的人歸入新父親的權下，舊家的權柄不再管他，他改用新的名字，成為完全的繼承人；屋大維就是被凱撒收養，才承接了整個帝國。這改變今天的讀法：神不是把我們留在門口打工還債，是把我們改名、入籍、寫進遺囑。那個一直覺得「我是撿來的」「我是被挑剩的」的人，在神家裡有一個正式的名分。","這一章照出來的我，是一個一直在等被挑中的人。我用考績、按讚數、被不被邀請、父母誇不誇我，來決定今天的我值多少；一次沒有被選上，就覺得整個人被否定。另一面是，當我真的被選上了，我又很快開始看不起還站在場邊的人，連「蒙揀選」都可以變成一種優越感。兩種樣子都是同一個病：我不相信自己早已在基督裡被愛，所以不是拚命求人選我，就是拿被選來壓人。","「又因愛我們」（1:5）。全章最該被記住的，是揀選前面這四個字。保羅講的不是一張冷冰冰的名單，是一個動機：神揀選，是因為愛；而且是在「創立世界以前」——那時你還沒有表現，也還沒有失敗。翻過來讀，它把所有「我要做到甚麼才會被留下」的焦慮連根拔起：你不是因為夠好才被選，是因為被愛才被選；揀選的目的，是讓你在他面前成為聖潔，也讓他的恩典得著稱讚。","這一週，學保羅「不住地感謝」（1:16）：選定一位你身邊的弟兄姊妹、同事或家人，在週三晚上以前，寫一則訊息或一張卡片給他，具體說出你在他身上看見的一份信、一份愛（1:15），最後加上一句：「我為你感謝神。」不附帶任何請求，也不講道理。再選一天晚上，把你這一陣子最怕的那一個「名字」——一份診斷、一張帳單、一位主管、一個算命的說法——寫在紙上，讀一次 1:21，然後把紙摺起來，對主說：它在你的腳下。","最終整合：以弗所，一間家庭教會，晚上。\n推基古從羅馬來，帶著一卷信。他說，這一卷讀完，還要抄一份，送到老底嘉，送到歌羅西。\n屋裡坐著一位婦人。兩年前，她把家裡的法術書抱到廣場上，和眾人的書一起燒了；她頸上原本掛著一個刻著以弗所咒字的小護身符，也一起丟進了火裡。\n她旁邊是一個奴僕，主人就坐在他對面；角落裡是一位猶太老人，手上還握著會堂裡用的經卷袋。\n信開始讀了。一句接一句，停不下來：揀選，救贖，印記。\n讀到「又因愛我們」，那個奴僕抬起頭——從來沒有人用這幾個字說過他。\n讀到「同歸於一」，猶太老人閉上了眼睛，嘴唇在動，好像在數他一生等過的日子。\n然後讀信的人念：「遠超過一切執政的、掌權的、有能的、主治的，和一切有名的」（1:21）。\n婦人的手不自覺地摸了一下頸子。那裡空空的。\n兩年來，每到夜裡，她偶爾還會想：沒有那個護身符，我會不會出事？\n今晚她聽見了：那些名字，沒有一個高過坐在父右邊的那一位。她不是空著脖子走路的人，是被聖靈蓋了印的人。\n信讀完了。主人先站起來，把燈挪近一點，讓奴僕看得見抄寫的字。\n沒有人說話，可是那一間小屋子，已經先歸在那一位元首底下了。\n如果你今夜也摸著一個空的地方——一個失去的位子、一張沒有被選上的名單、一個你不敢再求的東西——\n請你再聽一次：在你還沒有做對、也還沒有做錯任何事以前，他已經因愛揀選了你。\n那個空的地方，有印記。"],"self":"這一章照出來的「有己」，第一個樣子是一個一直在等被挑中的我：我的價值掛在別人的選擇上——升不升、被不被邀、有沒有人回訊息、父母誇不誇我；一次落選，就證明我果然不夠好，於是更拚命地表現，好讓自己被留下。\n第二個樣子是一個把揀選當成勳章的我：我是選民、我是核心同工、我的教會比較屬靈，揀選在我手上變成看不起人的理由，卻忘了揀選的動機是愛、目的是聖潔與讚美。兩種樣子的中心都是我——一個要靠被人選中站立，一個要靠比人優越站立，都還沒有用心中的眼睛看見那位早已揀選我的基督。","t321":{"k":"耶穌是我的榜樣：以弗所書說神「從創立世界以前」在基督裡揀選了我們（1:4）；主耶穌自己在被賣的那一夜禱告說：「因為創立世界以前，你已經愛我了」（約 17:24）。他一生就是從這份「先被愛」活出來的：他不必靠群眾的歡呼證明自己，也不怕被人棄絕；約翰說，耶穌「知道父已將萬有交在他手裡」（約 13:3），下一個動作卻是拿一條手巾束腰，蹲下來洗門徒的腳。萬有在他手裡，他卻拿起了手巾。學他，不是學一種不在乎別人的冷，是學一種確知被愛、所以能放下身段的自由。","g":"讓耶穌作王：1:22「又將萬有服在他的腳下，使他為教會作萬有之首」是全卷最直接的讓耶穌作王。這一章要人讓出來的第一個位置，是「別人的選擇」在我心裡的寶座：主管、父母、考試、按讚數，都不再有權決定我是誰；第二個位置，是一切我暗暗害怕或暗暗依靠的「名字」——命盤、生肖運勢、擇日、護身符，也包括存款數字和人脈。讓耶穌作王，不是叫我不要努力，是讓那一位坐在父右邊的作頭。可以自己檢查：這一週我最焦慮的那一刻，是誰坐在我心裡的寶座上？","p":"建立屬神的體系：1:10 是這個體系最大的一幅圖——神要使天上、地上、一切所有的都在基督裡面同歸於一；1:22--23 是它的地址——教會是他的身體。所以體系的中心不是組織圖，是一位元首。落在一間教會裡有三件事：第一，每一次作決定，先問「頭的心意是甚麼」，用禱告開始，而不是用投票或資歷開始；第二，用 1:15 的兩條線檢查健康——向上的信、向眾聖徒的愛，不只看人數與奉獻；第三，這是一封傳閱信，同一卷信在幾間教會之間傳來傳去，所以同一座城裡的教會要彼此代禱、分享資源、一起服事城市，而不是互相比較、互相搶人。這樣建起來的，是一群先歸在基督底下的人。"},"grp":["【一、破冰】學生時代分組或選隊的時候，你通常是最先被挑走的、在中間的，還是最後剩下的那幾個？說一個你還記得的場面：那是哪一年、哪一堂課，你當時心裡在想甚麼？","【二、扎心】保羅求神「照明你們心中的眼睛」（1:18）。說出這一週最佔據你眼睛的一件看得見的事（房貸、考績、孩子的成績、某一個人的訊息、身體的一份報告）：你最常在哪一個時間、哪一個地方想到它？如果心中的眼睛被打開，你覺得自己會在那件事旁邊看見甚麼？","【三、福音】經文說神「又因愛我們，就按著自己的意旨所喜悅的，預定我們藉著耶穌基督得兒子的名分」（1:5）。說一個具體的時刻：哪一年、在哪裡、透過誰，你第一次覺得「神收我作兒女，不是因為我夠好」？知道自己在神家裡有正式的名分，讓你在誰面前比較不需要證明自己了？","【四、行動】說出一位你這一週要寫信或傳訊息感謝的人（名字或關係），說出你在他身上看見的一份信或一份愛（1:15），以及你打算哪一天、用甚麼方式（卡片、訊息、當面）告訴他「我為你感謝神」。也說出一位你這一週要為他禱告、並找機會分享福音的朋友。","【五、代禱】為三種人指名禱告：一位最近落榜、被裁員、或在家裡覺得自己是被比下去的那一個的人，求主讓他知道自己在基督裡早已被愛、被揀選；一位活在算命、擇日、護身符的懼怕裡的親友，求主照明他心中的眼睛，看見基督遠超過一切有名的；我們城裡另一間教會（說出名字），求主祝福他們，也讓我們彼此相連，不互相比較。"],"prac":{"main":"這一週，不再等別人挑我——因為在創立世界以前，神已經因愛在基督裡揀選了我。","items":["對神：每天早上打開手機以前，先讀一次 1:22，說出今天最可能坐上你心裡寶座的那一件事（一個會議、一筆帳、一個人的評價），對主說：「主啊，你是萬有之首，今天這一件也在你腳下。」晚上回想：今天有沒有一個時刻，我真的讓他作頭？","對自己：這七天，每當你發現自己因為沒有被邀請、沒有被回覆、沒有被肯定而失落，就記下時間、場合與你當下對自己說的那一句話；然後把它換成 1:4--5 的話讀一次。週末把這張單子帶到主面前，不是責備自己，是承認「別人的選擇還在作王」，求主接手。","對人：照 1:15--16，寫一則具體的感謝給一位弟兄姊妹、同事或家人，說出你在他身上看見的信與愛，告訴他你為他感謝神；另外留意一位常常被冷落、被挑剩的人，主動約他一起吃一頓飯，坐在他旁邊。","對生活：檢查你的家和手機——有沒有一樣東西是你仍然在「求」或在「怕」的：平安符、光明燈、生肖運勢的推播、算命的紀錄、擇日的習慣？屬於你自己的，帶著禱告處理掉；屬於家人的，不強行丟棄，先用尊重的態度說明你為甚麼不再需要它。不必怕，也不必再拜。","對使命：揀選從來不攔阻傳福音。寫下一位你這一週要為他禱告、並邀請他來聚會或一起讀經的朋友；並為你所在城市裡另一間教會指名代禱一次，若有機會，和他們一起參與一項服事城市的工作。"]},"safe":["① 把 1:4--5、11 的預定講成宿命論：「神早就定好了，傳不傳福音都一樣」「得救不得救，人怎麼做都沒有用」。","同一段緊接著說「你們既聽見真理的道……也信了基督」（1:13）：人的聽見與相信是真的，保羅也在信末求人為他禱告，好放膽講明福音的奧祕（6:19）。講成宿命論，等於拿揀選的教義去攔阻揀選要成就的事（紅線四，全卷立場見 ISS00_2）。","檢驗標準：會眾聽完，是更想去傳福音、更有盼望地為未信的家人禱告，還是覺得反正都定好了？","② 對任何人說「你可能沒有被揀選」，或用預定解釋一場悲劇、一個孩子的夭折、一位親人沒有信主就過世。","保羅寫 1:4 不是在法庭上宣讀名單，是在監牢裡唱頌讚；揀選是給相信的人的安慰，不是給門外的人的恐嚇。用預定解釋悲劇，是替神說了他沒有說的話，也把最痛的人推得更遠（紅線四）。","檢驗標準：一位正為「萬一我不是選民」而失眠的人坐在台下，聽完是被帶到基督面前，還是更害怕了？你有沒有說出「到我這裡來的，我總不丟棄他」（約 6:37）？","③ 把「蒙揀選」講成優越感：「我們是神特別揀選的一群，別的教會、別的人不一樣」，或用它看不起還沒有信主的人。","揀選是「在基督裡」的，動機是「又因愛我們」，目的是「使我們在他面前成為聖潔」（1:4）；一個知道自己是白白被選的人，沒有理由站在場邊嘲笑別人。第 2 章會說這一切「免得有人自誇」（2:9）。","檢驗標準：會眾聽完，是更謙卑、更感恩，還是更覺得自己比別人高一等？","④ 用處境取消原則：「這是一封寫給一世紀亞細亞教會的傳閱信，和今天的我們沒有直接關係」；或反過來，把「在以弗所」的古卷問題搬上講台，講成考據課，讓會眾以為聖經不可靠。","書信三問要走完：處境是偶像、法術、族群隔閡之城裡的外邦人教會；原則是神在基督裡賜福、揀選、救贖、蓋印，要萬有歸在基督底下；今天的以弗所，就是每一座有廟、有算命攤、有族群分隔的華人城市。古卷問題講台一句帶過：這是寫給每一間教會的信（全卷立場見 ISS00_1、ISS00_6）。","檢驗標準：你有沒有具體說出今天的「以弗所」在哪裡？會眾聽完，是覺得這封信寫給了自己，還是對聖經多了一層疑惑？","⑤ 把「天上各樣屬靈的福氣」（1:3）講成成功神學：「信主就會發財、升官、身體不生病，沒有得著就是信心不夠」。","保羅說的是「屬靈的」福氣，「在天上」，「在基督裡」；寫這一句的人手上正綁著鎖鍊。把福氣講成物質保證，會讓正在受苦、失業、生病的人以為自己被神漏掉了。","檢驗標準：一位剛被裁員、或剛拿到一份壞消息的人聽完，是知道自己仍然在基督裡富足，還是覺得自己沒有被祝福？","⑥ 把 1:13--14 的印記講成「反正已經蓋印了，怎麼活都可以」；或反過來，用「你這樣會失去聖靈」來恐嚇軟弱的人。","印是神蓋的，訂金是神付的，盼望建立在付錢的那一位身上；同一卷信又說「不要叫神的聖靈擔憂；你們原是受了他的印記，等候得贖的日子來到」（4:30）。印記是一份要被珍惜的關係，不是放肆的執照，也不是隨時會被撕掉的貼紙。","檢驗標準：你有沒有把 1:13--14 和 4:30 放在一起講？會眾聽完，是更安心、也更想討主喜悅，還是更放縱或更恐懼？","⑦ 用 1:17「賜人智慧和啟示的靈」宣稱自己領受了高過聖經的新啟示，或對人說「神給我啟示，你應該嫁給誰、辭掉哪份工作、搬到哪裡」。","這一節求的是「使你們真知道他」，對象是神自己；聖靈把已經啟示的真理照進心裡，不是另外頒布新的經文。用「啟示」替人作人生決定，是屬靈控制的入口（全卷立場見 ISS00_5；屬靈權柄回指哥林多後書立場三）。","檢驗標準：你講的「啟示」，會眾可以拿聖經來檢驗嗎？聽完的人，是更認識神，還是更依賴某一個人的話？","⑧ 用 1:21 把一切不順都講成鬼的攻擊、在台上表演趕鬼、教人點名捆綁地域邪靈；或反過來，說「執政掌權的只是古人的比喻，今天不必理會」。","基督已經坐在「遠超過一切執政的、掌權的、有能的、主治的」位置上，勝負在第 1 章已經定了；不必怕鬼月、風水、廟宇，但也不拜、不求、不戴護身符；身心困擾同時尋求醫療。果效是平安，不是恐慌（紅線三，全卷立場見 ISS00_4）。","檢驗標準：會眾聽完，是更平安地活在基督的得勝裡，還是更怕、更愛追問「這是不是邪靈」？","⑨ 把 1:22「使他為教會作萬有之首」講成教會或領袖有權管轄一切：牧師坐頭的位子、教會要掌握社會的權力，或「教會說的就是基督說的」。","經文說的是基督為教會作首，不是教會作萬有之首；頭只有一個，教會是身體。把領袖放在頭的位置，或把教會的權力和基督的主權畫上等號，正好是 1:22 要拆掉的東西（屬靈權柄回指哥林多後書立場三）。","檢驗標準：你講完 1:22，會眾記得的是「基督是頭」，還是「我們要聽某某的」？你有沒有說出「教會裡沒有一個人可以坐那個位子」？","⑩ 把 1:10「同歸於一」講成「最後所有的人都會得救、信不信都一樣」，或講成「所有宗教最後都是同一條路」。","萬有歸一的中心是「在基督裡面」，同一章三次說是藉著他、在他裡面；1:13 說人要聽見、相信。把同歸於一講成普救論或宗教合一，就把福音的邀請變成不必回應的通知。","檢驗標準：你講完 1:10，會眾是更看見基督是萬有的中心、更想把人帶到他面前，還是覺得信不信都無所謂？","⑪ 先講 321 的「一個目的・建立屬神的體系」或「用心靠聖靈」，再拿 1:10、1:18 來印證；或把同歸於一講成「團契的異象」「教會的增長策略」。","1:10 是神自己的計畫，不是任何一個團契的口號；1:18 是保羅跪著為別人的禱告。先有神要把萬有歸在基督底下，321 才在末端接上去；倒過來，就是把經文當成 321 理念的插圖（鐵律五）。","檢驗標準：你講到 321 之前，會眾有沒有先聽見 1:10 與 1:18 自己的話？他們記得的是一個口號，還是一位元首？","⑫ 把「心中的眼睛」（1:18）講成反智：「讀書、查考、思想都是用腦靠自己，只要感覺就好」。","同一個禱告先求「賜人智慧和啟示的靈」，使人「真知道他」（1:17）；聖經裡的「心」是思想、意志、抉擇的中心，不只是情緒。用心靠聖靈不是不用頭腦，是頭腦也被聖靈照亮；講成反智，會讓會眾放下查考聖經的責任。","檢驗標準：會眾聽完，是更想打開聖經、用心思想神的話，還是更只想追求一種感覺？","⑬ 把 1:20、22 講成「應驗了詩 110:1」「應驗了詩 8:6」。","保羅在這裡沒有明說引用；這兩處只能說「這使我們想起」「學者觀察到」。把經文沒有作的連結說成應驗，等於替保羅加字，也會讓會眾以後分不清聖經自己說的和講員說的（本卷「應驗」規定）。","檢驗標準：你提到詩篇的時候，用的是「這使我們想起」，還是「應驗」？","⑭ 把「坐」講成消極不作為：「基督徒只要坐著享受，甚麼都不必做」；或把保羅講成戴鎖鍊仍得勝的屬靈英雄，讓會眾更佩服保羅。","基督坐下，是救贖已經成就；我們與他同坐，是從得勝的位置出發，2:10 緊接著說「為要叫我們行善」。保羅停不下來的頌讚，焦點是神做了甚麼，不是他自己有多剛強（鐵律七）。","檢驗標準：會眾聽完，是更確知自己已經和基督一同坐在天上、也更願意起來行，還是更佩服保羅、或更理直氣壯地不動？"]},{"n":2,"t":"拆毀了中間隔斷的牆","sub":"坐、牆、殿","lv":"A","arc":"坐","sec":[["2:1--3","你們死在過犯罪惡之中：從前"],["2:4--7","然而，神既有豐富的憐憫：一同活過來、一同坐在天上"],["2:8--10","你們得救是本乎恩，也因著信：我們原是他的工作"],["2:11--13","你們從前遠離神的人：如今得親近了"],["2:14--18","拆毀了中間隔斷的牆：造成一個新人"],["2:19--22","是神家裡的人了：漸漸成為主的聖殿"]],"serm":{"pts":[["然而，神","2:1--10","「然而，神既有豐富的憐憫」——死人沒有辦法自救；從前到如今中間，主詞是神"],["拆毀的牆","2:11--18","「拆毀了中間隔斷的牆」——聖殿的隔牆寫著外邦人越過者死；基督用自己的身體把兩下造成一個新人"],["神的家","2:19--22","「你們不再作外人和客旅」，「是神家裡的人了」——住在隔壁的人，變成家裡的人；這個家是神自己要住的聖殿"]]},"q":"你在哪裡當過外人？也許是嫁進一個大家族的第一個除夕，滿桌的人用你聽不懂的方言說笑；也許是到別的國家打工，雇主一家在飯廳吃飯，你在廚房等他們吃完；也許是調到新部門，才發現群組裡還有一個你不在的小群組。\n再反過來問：在你身邊，誰一直是外人？家裡那位外籍看護、公司裡那位說話有口音的同事、教會裡坐了一年還叫不出名字的那一位。你沒有趕他走，只是從來沒有請他進來。\n這一章要問的是：一個曾經死在過犯罪惡之中、被神白白救活、白白帶近的人，怎麼還能心安理得地守著一道牆？","truth":"從前到如今之間，主詞是神：他叫死人與基督一同活過來、一同坐在天上，本乎恩、也因著信，連那份信都包在他的禮物裡，而且為要叫我們行他所預備的善（2:4–10）。\n同一位基督用自己的身體拆毀了中間隔斷的牆，把遠的、近的造成一個新人，建成神藉著聖靈居住的所在——被白白接進家裡的人，不能再替神守門。","mv":{"t":"因他使我們和睦，將兩下合而為一，拆毀了中間隔斷的牆；","r":"弗2:14"},"card":["這一章從一座墳墓走到一座聖殿。開頭是死人：「你們死在過犯罪惡之中」（2:1），隨從風俗、順服首領、本為可怒之子；接著是兩個字「然而，神」——死人被救活、被安置在天上，本乎恩、也因著信，為要行神預備的善。下半章，同一位基督拆毀了猶太人與外邦人中間的牆，把兩下造成一個新人；全章收在一座用從前的外人蓋成、神藉著聖靈居住的殿。","這一章幾乎每一個重要的動詞，主詞都是神或基督。是神「既有豐富的憐憫」，叫我們活過來、復活、同坐；是神預備了我們要行的善；是基督用自己的身體拆牆、滅冤仇、造新人，又親自來傳和平；是神把石頭一塊一塊建造起來，再藉著聖靈住進去。人在這一章裡幾乎只做了兩件事：從前死著，如今被帶近。連那一份信，也是從他手裡接過來的。","2:18 說我們「得以進到父面前」，「進到」原文是 προσαγωγὴν（prosagōgēn），宮廷裡的字：一個平民不能自己走到王面前，要有人領他進去、替他開口引見。華人社會最懂這件事——要見一個有分量的人，先要找關係、找門路、找一個肯替你說一句話的人。保羅說，在父面前，引見你的是子，陪你進去的是聖靈，而且猶太人和外邦人走的是同一道門。這改變今天的讀法：禱告不必先找門路，你也不必再當別人的門檻。","這一章照出來的我，常常站錯兩個位置。一個太低：我仍然活得像個死人，覺得過去已經定了我的一生，聽見「一同坐在天上」只覺得遙遠，好像那是別人的事。另一個太高：我忘了自己本為可怒之子、和別人一樣，在心裡把人分成自己人和外人，悄悄替神決定誰可以靠近。前一種忘了「然而，神」，後一種忘了「和別人一樣」。","「你們從前遠離神的人，如今卻在基督耶穌裡，靠著他的血，已經得親近了。」（2:13）全章最該被記住的，是「從前」與「如今」中間那個「卻」。距離不是我走完的，是被帶近的；帶近的代價不是我的努力，是他的血。翻過來，這一句也是一把尺：既然我是被血帶近的，我就沒有資格去量別人離神多遠——那位我覺得還很遠的人，同一道血也是為他流的。","這一週，找出你生活裡的一位外人：家裡或鄰居的外籍看護、公司裡從外地調來的同事、教會裡來了很久卻沒有人約的那一位。選定一天，先學會把他的名字念對，問他家鄉在哪裡、家裡有誰；然後為他做一件只有家人才會做的事——記住他的生日、請他坐上你家的飯桌、在小組裡為他遠方的家人指名禱告。","最終整合：以弗所，推喇奴學房附近的一間屋子，晚上。\n推基古從羅馬帶回一捲信。屋裡坐著的，有從會堂出來的猶太弟兄，有當年把法術書搬出來燒掉的人，有從前在亞底米廟前做銀龕的工匠，還有幾個奴僕，靠著門邊站著。\n如果那天晚上，特羅非摩也在——那位以弗所人，那個在耶路撒冷被人看見和保羅走在一起、讓保羅被捉拿的外邦人——\n他大概會坐在最後一排。寫這封信的人，是因為他才戴上鎖鍊的。\n信讀到「你們死在過犯罪惡之中」，屋子很安靜。讀到「然而，神」，有人抬起頭來。\n然後讀信的人放慢了聲音：\n「因他使我們和睦，將兩下合而為一，拆毀了中間隔斷的牆」（2:14）\n那位猶太弟兄轉過身，看著最後一排。\n耶路撒冷那道矮牆還立著，石碑上的字還在。可是在這間屋子裡，牆已經不在了。\n讀信的人繼續念：「你們不再作外人和客旅，是與聖徒同國，是神家裡的人了」（2:19）。\n沒有人說話。有人把身子往旁邊挪了一點，空出一個位子。\n特羅非摩走過去，坐下來。\n那一晚，猶太人和外邦人，奴僕和工匠，一同跪下，「藉著他被一個聖靈所感，得以進到父面前」（2:18）。\n死人坐上了寶座，外人坐上了飯桌，神搬進了這間小小的屋子。\n如果你今夜坐在某一道牆的這一邊，請記得：你自己也是被帶進來的。\n然後，把旁邊的位子空出來。"],"self":"這一章照出來的「有己」，第一個樣子是自救：我以為自己只是病了、累了、走偏了，再努力一點就會好；連得救這件事，我也想在裡面放一點自己的功勞——我比較用心、我比較早信、我信得比較用力。\n第二個樣子是守門：被白白接進家裡以後，我卻開始替神看門，用口音、學歷、背景、政治立場、屬靈資歷，把人分成自己人和外人。兩種樣子的中心都是我——一個不肯承認自己曾是死人，一個忘了自己曾是外人。","t321":{"k":"耶穌是我的榜樣：主耶穌在聖殿裡推倒兌換銀錢之人的桌子時，說的是「我的殿必稱為萬國禱告的殿」（可 11:17）——被買賣佔滿的，正是外邦人唯一可以禱告的外院。他在井邊向一位撒馬利亞婦人要水喝，那時「猶太人和撒馬利亞人沒有來往」（約 4:9）；他說「我另外有羊，不是這圈裡的；我必須領他們來」（約 10:16）。他拆牆不是靠辯論贏人，最後是用自己的身體，在十字架上擋下了冤仇。學他，是在每一道牆前面，先替被擋在外面的人留出一個禱告、喝水、坐下的地方。","g":"讓耶穌作王：這一章要人讓出來的第一個位置，是「救自己的人」——2:1 說我是死的，2:9 說連自誇的餘地都沒有；讓耶穌作王，就是承認那個轉折詞的主詞不是我，是神。第二個位置是「守門的人」——基督自己是我們的和睦，牆是他拆的，家是他的，鑰匙在他手上，我不再有權決定誰是外人。讓耶穌作王不是叫我甚麼都不做，2:10 說還有神預備的善等著我去行，只是走在前面的不再是我。可以自己檢查：這一週我最後一次把某人歸成「他們那邊的」，是誰在我心裡作王？","p":"建立屬神的體系：第 2 章給教會的不是一張組織圖，是一座正在長大的殿，石頭是從前的外人。第一，接待不停在門口：一位新朋友、一位外籍弟兄姊妹、一個新移民家庭，從被歡迎、被認識、到被邀請上場服事，要有人一路陪著走，不讓任何人永遠當客人。第二，讓不同族群、語言、世代的人一起坐在作決定的桌子旁，不只是一起出現在節慶的照片裡。第三，讓見證成為教會的日常：常常讓弟兄姊妹說自己的「然而，神」，好叫整個群體記得，我們都是從墳墓裡、從牆外面被帶進來的。這樣建起來的，才是神藉著聖靈居住的所在。"},"grp":["【一、破冰】說一次你當外人的經驗：第一次去另一半家裡吃年夜飯、剛搬到一個新城市、剛轉學或換工作……那時候是誰、用甚麼方式，讓你覺得自己被接進去了？","【二、扎心】經文說：「你們不再作外人和客旅，是與聖徒同國，是神家裡的人了」（2:19）。說出一個具體的人（不必說全名）：在你的家、公司、社區或教會裡，誰到今天還被你當作外人？你們中間那道牆是甚麼材料砌的——口音、背景、立場，還是一次舊的傷？","【三、福音】「你們得救是本乎恩，也因著信；這並不是出於自己，乃是神所賜的」（2:8）。說一個你仍然想「賺」神喜悅的地方——讀經的天數、服事的時數、不再犯某一個錯。你上一次因為做不到而覺得離神很遠，是甚麼時候、在哪裡？如果連你的信都是禮物，那一刻的你其實站在哪裡？","【四、行動】說出一位這一週你要主動接近的外人（名字或關係）；說出哪一天、在哪裡、你要做哪一件只有家人才會做的事（請他到家裡吃飯、記住他的生日、陪他去辦一件事、在小組裡為他的家人禱告）。也說出你預計會在哪一個時刻想退回牆後，以及你打算怎樣留下來。","【五、代禱】為三種人指名禱告：一位在本地工作、生活的外籍移工或新移民，求主讓他在教會裡找到一個家；一位在家族或教會裡因為背景、口音或過去而一直被當作外人的人，求主讓他知道自己是神家裡的人；一位覺得自己太壞、不敢來到神面前的人，求主讓他聽見「然而，神」，也讓我們成為替他開門的人。"],"prac":{"main":"這一週，把一位外人當家人——因為我自己，也是被他的血從遠處帶近的人。","items":["對神：每天早上用 2:4–6 禱告，把一件你最近覺得「沒救了」的事，放在「然而，神」後面說出來；然後感謝他：「主啊，我已經與你一同坐下，今天不必搶任何位子。」每晚回想：今天有沒有哪一刻，我是從「已經坐下」的地方出發去做事的？","對自己：這七天，每當你發現自己在心裡說「他們那種人」「他們那邊的」，就記下時間、對象和那道牆的材料（口音、背景、立場、舊傷）；週末把這張單子帶到主面前，承認自己從前也和別人一樣，是被白白救活、白白帶近的，求主拆掉你心裡重新砌起來的那一段。","對人：主動接近一位身邊的外人——外籍看護、新同事、新移民鄰居、教會裡少有人約的人；學會正確念出他的名字，問一次他的家鄉和家人，為他做一件只有家人會做的事。若你和某位弟兄姊妹之間因舊事立了一道牆，這一週先在主面前把報復的權利交出去；若彼此之間是安全的，再主動問候他。","對生活：檢查你的手機和行事曆——你的群組、你的飯局、你的假日，是不是只剩下和你一樣的人？這一週刻意加進一位不一樣的人：一頓飯、一次散步、一通電話。在網上談論政治與社會議題時先停一停，問自己：我這一句話是在說理，還是在把一位弟兄姊妹砌到牆的另一邊？","對使命：在小組或事工團隊裡提出一個具體安排——邀請一位外籍或新移民的弟兄姊妹分享他的見證與家鄉的代禱事項，或和另一個語言堂、另一個世代合辦一次聚餐與禱告；並為一位還在「遠處」的家人、同事或鄰居每天指名禱告，求主也把他帶近。"]},"safe":["① 把 2:8–9「本乎恩」「不是出於行為」講成「行為不重要，反正得救了，怎麼活都可以」。","保羅沒有在 2:9 停筆，下一句就是「為要叫我們行善，就是神所預備叫我們行的」（2:10）；2:9 的「行為」和 2:10 的「善」原文是同一個字，一個被趕出門外當作條件，一個從另一扇門回來當作目的。只讀兩節，就把恩典講成了放縱的許可證（紅線五；回指加拉太書立場二）。","檢驗標準：你有沒有把 2:8、2:9、2:10 三節一口氣讀完？會眾聽完，是更自由地愛人行善，還是更自由地放過自己？","② 反過來，把 2:10 講成「你得救是恩典，可是要靠行善才保得住；善行不夠，救恩就會失去」。","2:8「你們得救」是完成式被動，已經發生、效力持續，施救的是神；行善是神「預備叫我們行的」——是恩典結出來的果子，不是補交的學費。把行善講成保住救恩的條件，等於在 2:9 剛剛關上的門外，又替自誇開了一扇後門（紅線五）。","檢驗標準：你講行善的時候，用的是「因為你已經得救，所以……」，還是「如果你不……，你就會失去……」？","③ 把 2:1–3「死在過犯罪惡之中」「本為可怒之子」講成「你一文不值」，或拿來指著會眾、指著不信的家人罵。","保羅在 2:3 從「你們」換成「我們」，說「和別人一樣」——這是一份人人平等的診斷書，不是一根指著別人的手指；說人是死的，是為了讓 2:4 的「然而，神」有分量，不是要把人踩低。人在罪中無法自救，卻仍是神按著形像所造、神大愛所愛的人。","檢驗標準：你講到「可怒之子」時，說的是「他們」還是「我們」？台下一位自卑的人聽完，是更絕望，還是更想來到那位有豐富憐憫的神面前？","④ 把 2:2「空中掌權者的首領」講成凡事見鬼：病痛、憂鬱、家庭衝突都是邪靈作祟，不必看醫生，只要趕出去；或反過來，說那只是古人的比喻。","經文說這個首領真實地「在悖逆之子心中運行」，同一封信也說基督已經遠超過一切執政掌權的；在基督裡的人已經不在他手下。講成凡事見鬼會叫人恐慌、延誤醫療，講成比喻會叫人輕忽（紅線三；全卷立場見 ISS00_4）。","檢驗標準：你有沒有同時說到「身心的困擾要看醫生，也要禱告」？會眾聽完，是更平安地坐在基督裡，還是更害怕鬼月、風水和黑暗？","⑤ 把 2:6「一同坐在天上」講成「你已經坐在天上，所以應該健康、富足、凡事順利；不順利就是你沒有活出你的地位」。","2:7 說神的恩典是要「顯明給後來的世代看」——已經坐下，還沒有完全顯明；保羅寫這句話的時候，自己正戴著鎖鍊坐在羅馬的監裡。把「已然」講成「全然」，會叫正在受苦的人以為自己被神擱在一邊。","檢驗標準：一位剛被診斷出重病、或剛失業的弟兄姊妹聽完，是覺得自己仍然和基督一同坐著，還是覺得自己不夠屬靈？","⑥ 用「然而，神」對正在受苦的人說：「只要你信心夠，神一定會在這一件事上翻轉；還沒有翻轉，是你信得不夠。」","2:4 的「然而，神」說的是神叫死人活過來、把我們帶到他面前——最深的翻轉已經發生了；它不是保證每一件難事都在我們期待的時間照我們的方式翻過來。拿它催逼受苦的人，是把恩典又變成了另一種要交出來的成績。","檢驗標準：你有沒有分清楚「神已經作成的」和「我們盼望他作的」？一位禱告多年還沒有看見改變的人聽完，是被安慰，還是被定罪？","⑦ 把 2:11–22 講成「教會已經取代了以色列，神和猶太人的事已經結束了」，或在講台上輕看、嘲笑猶太人。","2:12 的清單以以色列為中心：國民的身分、諸約、應許原是他們的；外邦人是被接進來的，不是取而代之的——「不是你托著根，乃是根托著你」（羅 11:18）。新人是猶太人與外邦人一同被造，不是一方吃掉另一方；輕看猶太人，等於在教會裡另砌一道牆。","檢驗標準：一位猶太裔的朋友、或一位信主的猶太人坐在台下，聽完會覺得被尊重，還是被當成過時的人？","⑧ 反過來，把「與聖徒同國」講成外邦信徒要守猶太節期、飲食、安息日，才算真正進入以色列的福分；或說猶太人不需要耶穌也能得救。","牆拆了，不是叫外邦人先變成猶太人，也不是叫猶太人繞過基督；2:18 說「我們兩下藉著他」才得以進到父面前——兩下，同一位中保，同一道門。把某種文化記號重新當成入門條件，正是 2:15 被廢掉的那一套規條。","檢驗標準：你講完，會眾心裡多了一張要守的清單，還是更清楚猶太人和外邦人都只有基督這一道門？","⑨ 把 2:15「廢掉……記在律法上的規條」講成「舊約已經作廢，十誡和道德要求都不必理會」。","被廢的是律法被當作隔牆、當作入門條件的那一套功能，不是神要人誠實、聖潔、相愛的心意；本卷 4:25 仍引亞 8:16，6:2 仍引十誡，耶穌也說「我來不是要廢掉，乃是要成全」（太 5:17）。講成道德作廢，就把拆牆講成了拆家。","檢驗標準：你有沒有說清楚被廢的是甚麼、沒有被廢的是甚麼？會眾聽完，是更願意讀舊約，還是覺得舊約和他無關了？","⑩ 用「牆已經拆了」「要合一」叫受害者和傷害他的人坐在一起，或叫被欺壓的一群人不要再說出不公平。","基督拆的是冤仇與敵意，不是人保護自己安全的界線；2:16 的和好是在十字架上，以真實的悔改為路，不是叫受傷的人假裝沒事。饒恕是把報復的權利交給神，和好需要對方悔改、需要安全（回指哥林多後書立場四）。","檢驗標準：你有沒有明說「合一不等於要你回到不安全的地方」？一位正在受傷害的人聽完，是更願意求助，還是更不敢開口？","⑪ 用處境取消原則：「那是一世紀猶太人和外邦人的問題，和我們無關」；或把處境硬搬，把今天某一個族群、某一種政治立場直接等同於當年的外邦人或猶太人。","書信三問要走完：處境是聖殿的隔牆與割禮的名號把人分成兩邊；原則是基督自己是我們的和睦，已經用身體把兩下造成一個新人；今天的落點是族群、方言、世代、階級、政治立場在教會裡砌起來的牆，但講台不替任何一方背書，也不把弟兄姊妹打成對立的兩邊（全卷立場見 ISS00_1）。","檢驗標準：你有沒有具體說出你的教會今天哪一道牆最高？會眾聽完，是更想走向牆那一邊的人，還是更確定自己站在對的一邊？","⑫ 把 2:20「使徒和先知的根基」講成「今天還有新的使徒、先知在打新的根基，你要在他們的遮蓋底下」。","根基只打一次；新約的使徒和先知見證了復活的主，把福音的根基立好了，房角石是基督自己。開拓、勸勉的功能今天仍然需要，但沒有人可以自封為新的根基，拿頭銜要求絕對順服，或宣稱有高過聖經的新啟示（紅線六；全卷立場見 ISS00_5）。","檢驗標準：你講完，會眾更清楚整座房子要對齊的是基督，還是更在意自己站在哪一位領袖的遮蓋底下？","⑬ 先講 321 的「無己才能合一」，再拿 2:14–16 來印證；或把合一講成「只要大家都無己一點、努力一點，牆就會倒」。","經文的主詞是基督：「他」使我們和睦，「他」拆毀了牆，「他」以自己的身體廢掉冤仇——合一不是我們造出來的，是他造好了交給我們保守。先講口號再引經文，就把經文當成 321 理念的插圖（鐵律五）；把合一講成努力的成果，會叫會眾更佩服會合一的人，而不是更愛那位拆牆的主。","檢驗標準：你講到 321 之前，會眾有沒有先看見十字架上的那個身體？321 是最後才接上去的嗎？","⑭ 把 2:12「沒有指望，沒有神」講成嘲笑拜拜的家人、長輩：「他們拜的都是假的，他們就是可怒之子。」","保羅說「我們從前也都在他們中間」（2:3），他描寫的是一個人人都住過的地方，不是一群可以被看不起的人；華人信徒的父母、祖父母多半在這樣的城市裡長大，他們需要的不是被嘲笑，是被一位有豐富憐憫的神帶近。","檢驗標準：一位家人還在拜拜的弟兄姊妹聽完，是更想回家愛他的父母，還是更想回家和他們辯論？"]},{"n":3,"t":"基督的愛是何等長闊高深","sub":"囚、跪、深","lv":"A","arc":"坐","sec":[["3:1--7","為你們外邦人作了基督耶穌被囚的：奧祕的執事"],["3:8--13","我本來比眾聖徒中最小的還小：藉著教會顯明神百般的智慧"],["3:14--19","我在父面前屈膝：長闊高深"],["3:20--21","但願他在教會中：頌讚"]],"serm":{"pts":[["被囚的人與奧祕","3:1--7","「這奧祕就是外邦人在基督耶穌裡，藉著福音，得以同為後嗣，同為一體，同蒙應許」——一個戴鎖鍊的人，看守著一個打開的祕密"],["比最小的還小","3:8--13","「我本來比眾聖徒中最小的還小」——最懂奧祕的人，把自己放在最低處；神百般的智慧要「藉著教會」被天上看見"],["跪下來的禱告","3:14--21","「能以和眾聖徒一同明白基督的愛是何等長闊高深」——不是一個人量得完的愛；「但願他在教會中，並在基督耶穌裡，得著榮耀」"]]},"q":"你現在被困在哪裡？也許不是監牢——是醫院的陪病床、一位失智的母親、一份走不掉的工作、一個簽證或一筆債，或是一段你說不清楚、也離不開的關係。你等了很久，那條鍊子還在。\n被困久了，人會開始改口：從「神為甚麼還不開門」，慢慢變成「我大概已經沒有用了」。禱告越來越短，最後只剩一句：主啊，讓它快點過去。\n這一章的作者也戴著鍊子。他沒有求鍊子斷，卻跪下來，為別人求一份量不完的愛。這一章要問的是：在你走不出去的地方，你的禱告還能不能大過你的處境？","truth":"神從萬世以前所定的奧祕，是要外邦人在基督裡同為後嗣、同為一體、同蒙應許，並且藉著這一群人，把他百般的智慧和他的榮耀顯明出來（3:6、10、21）。\n所以被囚的不是被丟棄，最小的不是無用，跪下的不是軟弱：神照著運行在我們心裡的大力，正在一群人身上成就超過我們所求所想的事。","mv":{"t":"能以和眾聖徒一同明白基督的愛是何等長闊高深，","r":"弗3:18"},"card":["這一章是一個被囚的人說到一半停下來、岔開去講奧祕、最後跪下來的一章。保羅先說他手上的職分：神把一個藏了萬世的奧祕交給他——外邦人在基督裡「同為後嗣，同為一體，同蒙應許」（3:6）；再說他自己是「比眾聖徒中最小的還小」（3:8）；然後屈膝為眾人求一份量不完的愛，最後抬頭頌讚：榮耀要在教會中、在基督耶穌裡，直到永遠。","這一章作工的一直是神：是他把奧祕「用啟示」叫保羅知道（3:3）；是他「賜恩」給一個最小的人（3:8）；是他從萬世以前在基督裡定了旨意（3:11）；是他要藉著教會，叫天上的執政掌權者看見他百般的智慧（3:10）；是他按著豐盛的榮耀，藉著他的靈叫人裡面剛強；也是他能照著運行在我們心裡的大力，成就超過所求所想的。保羅的每一個身分——囚犯、管家、執事——都是被神放進去的。","3:13「不要……喪膽」，原文 ἐγκακεῖν（enkakein），是累到洩氣、撐不下去而放手的字；耶穌講「常常禱告，不可灰心」（路 18:1）用的是它，保羅說「受了這職分，就不喪膽」（林後 4:1）也是它。請你看下一節：保羅一說完不要喪膽，馬上說「我在父面前屈膝」（3:14）。這改變今天的讀法：喪膽的解藥不是叫自己再撐一下，是跪下來。灰心的人最想停止的那件事，正是他最需要做的那件事。","這一章照出來的我，有兩個方向的不對勁。一是在困境裡縮小：鍊子一上身，我就認定自己出局了，禱告只剩下自己，眼睛只看見那條鍊子。二是在順境裡放大：服事久了、頭銜多了、懂得多了，我不知不覺把託付當成產業，把鑰匙當成權柄，把別人的掌聲當成自己的榮耀。保羅剛好反過來——在鍊子裡看見最大的奧祕，在最懂的時候把自己放在最低處。","「但願他在教會中，並在基督耶穌裡，得著榮耀」（3:21）。全章最該被記住的，是這一句的主詞與地點。主詞不是保羅、不是教會，是「他」；地點不是講台、不是我的成就，是一群同為一體的人。翻過來讀，它把我從兩個重擔裡放出來：我不必靠自己發光，也不必一個人去成就甚麼。我只要站在那一群人中間，讓光從基督身上照過來。","這一週，把 3:16–19 抄在一張卡上，寫上一位正被困住的人的名字——在陪病、在失業、在一段走不出去的關係裡的人。每天早上照著這段經文為他禱告一次，把「你們」換成他的名字：求他裡面剛強、基督住在他心裡、他的愛心有根有基、他能和眾聖徒一同明白基督的愛。週末傳一句話給他：「我這一週天天為你這樣求。」","最終整合：一封信，從一座城走到另一座城。\n它沒有寫給誰的名字。推基古把它帶到以弗所，讀完了，有人抄下一份，交給往老底嘉去的人。\n在老底嘉，一間染坊的後屋，一個奴僕和他的主人坐在同一張長凳上，聽到「同為後嗣，同為一體，同蒙應許」。\n主人沒有看他，奴僕也沒有看主人，可是兩個人都低下了頭。\n在希拉波立，一位寡婦聽到「比眾聖徒中最小的還小」，第一次覺得，原來最低的地方，有人先坐在那裡。\n在歌羅西，一個剛把護身符燒掉的年輕人，聽到「放膽無懼，篤信不疑地來到神面前」，哭了。\n每一間屋子，量到的都只是一面。有的量到闊，有的量到深，有的量到長，有的量到高。\n沒有一間屋子量完。所以信還要往下傳。\n兩千年過去，抄本換成了印刷，換成了手機上的一行字。\n今天，它傳到了你手上。\n你也許正坐在一張陪病床邊，或者坐在一份走不掉的工作裡，手上也有你的鍊子。\n請你慢慢讀那一句：「能以和眾聖徒一同明白基督的愛是何等長闊高深」（3:18）。\n你量到的那一面，別人沒有；別人量到的那一面，你也還沒有見過。\n所以不要一個人讀完它。把它傳下去，把你的那一面說出來。\n等到天上地上的各家都坐齊了，那位父會讓我們看見：這份愛，比每一條鍊子都長。"],"self":"這一章照出來的「有己」，第一個樣子是困境裡的自憐：鍊子一上身，世界就縮成我的病、我的債、我的委屈，我的禱告單上只剩下自己，連別人的難處都覺得是打擾。我以為這是軟弱，其實也是一種以自己為中心。\n第二個樣子是順境裡的佔有：神託付我的小組、職位、恩賜、一群人的信任，我慢慢當成是我的，交棒時捨不得，被忽略時不甘心，連榮耀歸主的話都說得很順，心裡卻在等人記得我。保羅的「比最小的還小」把兩個樣子一起拆掉：不是看輕自己，是看見基督以後，不再需要自己很大。","t321":{"k":"耶穌是我的榜樣：在客西馬尼，主耶穌「離開他們約有扔一塊石頭那麼遠，跪下禱告」（路 22:41）——那一夜他知道自己要被捆綁，卻跪在父面前；被捆以後，他沒有求自己的鍊子斷開，反倒在十字架上為釘他的人代求。他在最後的晚餐「拿一條手巾束腰」（約 13:4），親手洗門徒的腳——萬有的主把自己放在最低處。他也為還沒有信的人禱告，求「使他們都合而為一」（約 17:21）。保羅在牢裡的跪下、比最小的還小、為眾人的合一代求，都是從這一位身上學來的。學他，是在被困的地方仍然為別人跪下。","g":"讓耶穌作王：這一章要人讓出來的第一個位置，是「處境」在我心裡的寶座。保羅不說自己是羅馬的囚犯，說是「基督耶穌被囚的」——誰決定我的身分，誰就在作王；讓耶穌作王，就是不再讓病房、職場、債務替我下定義。第二個要讓出來的，是「鑰匙的主人」那個位置：神託付的職分是管家的差事，讓耶穌作王，就是隨時願意交鑰匙、交棒、讓別人上場。可以自己檢查：我手上哪一把鑰匙，如果明天要交出去，我會最捨不得？","p":"建立屬神的體系：第 3 章說，神百般的智慧要「藉著教會」被看見，榮耀要「在教會中」被看見——神的作品不是一個英雄，是一群同為一體的人。第一，讓不同族群、世代、背景的人同在一個小組，定期彼此分享「基督的愛在我身上是哪一面」，因為長闊高深要和眾聖徒一同明白；第二，建立代禱的體系：每一位被困住的肢體（住院、失業、照顧者、在監的）都有人固定為他禱告、探望；第三，每一個職分都有交棒的計畫，管家不永遠握著鑰匙。這樣建起來的，是一幅繡滿不同顏色、卻同一幅圖的教會。"},"grp":["【一、破冰】你最記得的一次「被困住」是甚麼時候？塞車、停電、颱風天出不了門、在機場等了一整夜……那時候你做了甚麼打發時間？身邊有誰陪著你？","【二、扎心】保羅說：「我求你們不要因我為你們所受的患難喪膽，這原是你們的榮耀。」（3:13）說出你現在最接近「喪膽」的一件事：是哪一件事、從甚麼時候開始、你最近一次想要放手是在哪裡？那個時候，你的禱告變成了甚麼樣子？","【三、福音】保羅說，我們「放膽無懼，篤信不疑地來到神面前」（3:12），不是靠表現，是「在他裡面」。說一個具體的時刻：哪一年、在哪裡，你第一次覺得可以像家裡的孩子一樣走到神面前，而不是像在面試？那一次是誰、或哪一段經文讓你知道的？","【四、行動】說出一位你這一週要用 3:16–19 為他禱告的人（名字或關係），他被困在甚麼處境裡；說出你每天在甚麼時間、甚麼地點為他禱告，以及這一週哪一天你會傳訊息、打電話或去探望他。再說出你手上一把可以開始交棒的鑰匙，你打算找誰一起做。","【五、代禱】為三種人指名禱告：一位被困在病床、陪病或照顧家人裡的人，求主叫他裡面的力量剛強起來；一位在職場或家中長期被不公平對待的人，求主保護他，讓他身邊有人陪他找到安全與幫助，而不是叫他忍；一位服事很久、手上握著很多鑰匙的同工，求主讓他越服事越小，也找到可以交棒的人。"],"prac":{"main":"這一週，在你被困住的地方，為別人跪下——那份量不完的愛，比你的鍊子更長。","items":["對神：每天選一個固定的時間，先安靜讀 3:14–21，再用這段經文為自己禱告一次、為一位被困住的人禱告一次；禱告的時候先說「父啊」，記得自己是家裡的人，不是來面試的。晚上回想：今天有沒有一刻，我的禱告大過了我的處境？","對自己：寫下你現在的「鍊子」——一件你改變不了的處境；在它旁邊寫一句「我是基督耶穌的」。再列出你手上的三把鑰匙（職位、群組、恩賜、一份信任），在每一把旁邊寫上：這是誰託付的、將來要交給誰。","對人：照著 3:16–19，為一位正在陪病、失業、或走不出一段關係的人每天禱告；週末傳一句具體的話給他，說你為他求了甚麼。若他正在受傷害，不要勸他忍，陪他找到信得過的人與專業協助。","對生活：這一週，在一件你很想抱怨的事上停一下——塞車、加班、照顧家人的夜晚——把它當成跪下的時間，用一分鐘為身邊的一個人代禱。若你的處境需要求助（醫療、法律、財務），這一週踏出一步去問，跪下禱告和尋求幫助並不衝突。","對使命：在你的小組或事工裡，提出一次「量愛的聚會」：邀請不同年紀、族群、背景的人，各說一段基督的愛在他身上是哪一面；並建立一張代禱名單，讓每一位住院、在監、失業或照顧家人的肢體都有人固定代禱與探望。"]},"safe":["① 把 3:20「超過我們所求所想的」講成禱告保證：只要信心夠，神一定給你更大的房子、更高的收入、病一定好。","寫這一句的人手上還扣著鍊子，亞細亞的教會也沒有因此發財；神充充足足成就的，是 3:16–19 的內容——裡面剛強、基督定居、一同明白基督的愛、被神充滿。講成成功神學，會叫禱告沒有照樣成就的人以為是自己信心不夠。","檢驗標準：你有沒有把 3:20 和前面四節禱告連著讀？一位禱告多年、病沒有好的弟兄聽完，是被定罪，還是被安慰？","② 用 3:13「患難……原是你們的榮耀」叫人忍受不公義：家暴、職場霸凌、屬靈控制下的受害者「為主受苦是榮耀」。","保羅的苦是「為你們」、為福音而受的，不是為了保護加害者；苦本身不是好的，受害不等於背十字架。把受害講成榮耀，是用十字架替不義辯護，也讓人不敢求助（饒恕與受害者回指哥林多後書立場四）。","檢驗標準：你有沒有明說「為福音受苦」和「被人傷害」不一樣，並告訴會眾遇到傷害可以向誰求助？","③ 把 3:8「比最小的還小」講成自我貶低：「你要覺得自己一文不值」「越討厭自己越謙卑」。","保羅說這句話的同一口氣，說神「還賜我這恩典」，叫他傳基督測不透的豐富；他的小，是看見基督的大以後的位置，不是自我厭惡。講成貶低自己，會壓傷本來就低自尊的人，也把謙卑變成另一種表演。","檢驗標準：會眾聽完，是更看見基督的豐富，還是只更看見自己的不好？你有沒有把「最小的」和「賜我這恩典」放在一起講？","④ 領袖用「我比最小的還小」作修辭，嘴上自稱最小，實際上要人順服、不許質疑。","謙卑的話可以變成更精緻的權柄：說得越低，越難被提醒。保羅的謙卑落在行動上——他稱自己是管家、是端盤子的執事，鑰匙不是他的。講台上自稱卑微，教會裡卻沒有人可以說「不」，就是把 3:8 拿來作面具（屬靈權柄回指哥林多後書立場三）。","檢驗標準：你的團隊裡，最年輕或最資淺的人，最近一次對你說「我覺得你錯了」是甚麼時候？","⑤ 用 3:5「啟示他的聖使徒和先知」自封或封人為使徒、先知，宣稱今天仍有新的啟示要眾人順服。","3:5 的使徒和先知是根基（2:20），根基只打一次；先知性、使徒性的功能今天仍需要，但不以頭銜要求順服、不發布高過聖經的新啟示。講台上一句帶過，指向議題頁（全卷立場見 ISS00_5）。","檢驗標準：你講完，會眾是更回到聖經與群體察驗一切，還是更期待某一個人說「神對你說」？","⑥ 用 3:10「天上執政的、掌權的」講成教會要去點名地域邪靈、表演屬靈爭戰；或反過來說執政掌權者只是比喻。","3:10 說的是教會的存在本身就是宣告：一群本來彼此隔絕的人同為一體，讓天上看見神百般的智慧。勝負已定（1:21–22），不必恐慌，也不必迷信；講台上一句帶過（全卷立場見 ISS00_4）。","檢驗標準：會眾聽完 3:10，是更想去捆綁甚麼，還是更想和那位不一樣的弟兄姊妹合一？","⑦ 把 3:14「屈膝」講成禱告的規條：「不跪下就不夠誠心」，或在聚會裡要求所有人一同下跪。","經文記的是保羅的姿勢，不是對眾人的命令；聖經裡有站著、坐著、俯伏、舉手的禱告。把姿勢變成標準，會叫年長、行動不便、身體有傷的人覺得自己不夠屬靈，也把心的謙卑換成外表的動作。","檢驗標準：一位坐輪椅的弟兄聽完，會覺得自己的禱告被接納，還是被比下去？你講的是心的姿勢，還是膝蓋的角度？","⑧ 把 3:17「使基督住在你們心裡」講成「你還沒有真正得救，要再接受基督一次」，或「基督住在我心裡，所以我的感覺就是神的意思」。","收信人已經信了（1:13），保羅求的是基督在他們心裡定居、作主；講成第二次得救，會攪擾得救的確據。反過來把個人感覺等同基督的心意，就是取消了 3:18「和眾聖徒一同」的察驗。","檢驗標準：會眾聽完，是更確定基督已經在他們裡面、也更願意讓他作主，還是更懷疑自己有沒有得救？","⑨ 把 3:18「長闊高深」講成屬靈經歷的等級：「你只到闊，我已經到深」；或把四個方向寓意成十字架四端、四種恩賜，當作經文本來的意思。","保羅的重點是「和眾聖徒一同明白」，而且這愛「過於人所能測度的」——沒有人量完，更沒有人可以拿來分高低。寓意的應用可以說「這使我們想起」，不可說成經文的定義。","檢驗標準：會眾聽完，是更想跟別人比自己量到哪裡，還是更想坐下來聽別人量到的那一面？","⑩ 把 3:6「外邦人……同為後嗣」講成「教會取代了以色列，猶太人已經被丟棄」。","奧祕是外邦人「同」為後嗣、「同」為一體、「同」蒙應許——是加進來，不是頂替；應許原是給以色列的，外邦人是被接進去同享。講成取代論，就在牆被拆毀之後，又築了一道新的牆。","檢驗標準：一位信主的猶太朋友坐在台下，聽完是覺得自己被接納為一家人，還是被說成過時的人？","⑪ 用處境取消原則：「那是一世紀猶太人和外邦人的問題，今天教會早就不分了」；或只講原則，不落到今天的處境。","書信三問要走完：處境是亞細亞的外邦人教會，在偶像與族群隔閡之城裡作神的家；原則是在基督裡同為後嗣、同為一體；今天的處境是本地人與新移民、不同語言堂、不同階層在教會裡看不見彼此（全卷立場見 ISS00_1）。","檢驗標準：你有沒有具體說出，在你的教會裡，那三個「同」字最常被打折扣的是哪一群人？","⑫ 先講 321 的「謙卑」「讓耶穌得榮耀」，再拿 3:8、3:21 來印證；或把保羅的跪下講成 321 理念的插圖。","3:8 是在一個被囚的管家說到奧祕時自然流出來的，3:21 是一段為眾人代求之後的頌讚；抽出來當口號，就失去了那條鍊子、那個奧祕和那段禱告（鐵律五）。321 要在經文自己講完之後才接上去。","檢驗標準：你講到 321 之前，會眾有沒有先看見那條鍊子、聽見那三個「同」、跟著保羅跪下？","⑬ 把 3:2「職分」講成「神把這間教會、這個位置交給我，所以別人不可以碰」，用託付為長期把持辯護。","οἰκονομία（oikonomia）是管家的差事：鑰匙在手上，家產不是自己的；管家要向主人交帳，也要準備交棒。把託付講成產業，會讓職分變成地盤，讓年輕的一代永遠上不了場。","檢驗標準：你講完，會眾是更珍惜手上的託付、也更願意交棒，還是更想守住自己的位置？","⑭ 把保羅講成坐監也不動搖的屬靈英雄，叫會眾佩服他、學他的堅強，卻看不見他跪下的那一位。","保羅自稱比最小的還小，他的力量是「藉著他的靈」、照著運行在心裡的大力；講成英雄，會叫在困境裡軟弱的人更自責，也讓會眾更佩服作者，卻沒有更愛主（鐵律七）。","檢驗標準：會眾聽完，記得的是保羅有多堅強，還是基督的愛有多長闊高深？","⑮ 把 3:19「便叫神一切所充滿的，充滿了你們」講成人可以變成神、或今生可以達到不再犯罪的完全。","原文是被動的，充滿的是神自己的豐盛，人仍然是受造的器皿；同一卷書第 4 章還在勸人脫去舊人、不可叫聖靈擔憂。講成成神或無罪完全，會叫人驕傲，也叫還在掙扎的人絕望。","檢驗標準：會眾聽完，是更渴慕把空間讓給神，還是以為自己已經到了、或永遠到不了？"]},{"n":4,"t":"建立基督的身體","sub":"行、職、新","lv":"A","arc":"行","sec":[["4:1--6","行事為人就當與蒙召的恩相稱：七個一"],["4:7--10","他升上高天的時候：將各樣的恩賜賞給人"],["4:11--16","為要成全聖徒，各盡其職：建立基督的身體"],["4:17--24","脫去你們從前行為上的舊人：穿上新人"],["4:25--32","生氣卻不要犯罪：彼此饒恕"]],"serm":{"pts":[["與恩相稱","4:1--6","「行事為人就當與蒙召的恩相稱」——全卷的「所以」：坐下來的人開始走路，第一步是「竭力保守聖靈所賜合而為一的心」"],["各盡其職","4:7--16","「為要成全聖徒，各盡其職，建立基督的身體」——職分是升天的基督賜下的禮物，目的是讓每一個人上場：「百節各按各職」"],["脫去與穿上","4:17--32","「並且穿上新人」——新人落在一句誠實話、一個不過夜的怒氣、一次饒恕上"]]},"q":"你在教會裡是甚麼？有人一聽到「五重職份」，心裡就開始排座位：誰是使徒、誰是先知、我排在第幾；也有人坐在最後一排，覺得這一章跟自己無關，服事是台上那幾個人的事。\n回到家，你也許有一個怒氣已經放了好幾個日落，有一句誠實話一直不敢說出口，有一個人你說你已經饒恕了，可是一想起他，胸口還是發緊。\n這一章要問的是：一個已經和基督一同坐在天上的人，站起來走路的第一步，是往台上走，還是往人中間走？","truth":"升天的基督把恩賜分給每一個人，把職分賜給教會，為要成全聖徒、各盡其職——身體只有一個頭，每一個關節都要供應。\n被這樣恩待的人，脫去有己的舊人，穿上神所造的新人；新人不在異象裡，在一句誠實話、一個不過夜的怒氣、一次饒恕裡。","mv":{"t":"為要成全聖徒，各盡其職，建立基督的身體，","r":"弗4:12"},"card":["這一章是以弗所書的樞紐：坐了三章的人，站起來走路了。保羅先數七個「一」，把共同的根擺在前面；再說升天的基督把恩賜量給「各人」，把職分賜給教會，為要成全聖徒、各盡其職；最後叫每一個人脫去舊人、穿上新人。合一、職分、新人，三件事說的是同一個身體怎樣長大——不是幾個人站上台，是每一個關節都動起來。","這一章的主詞，常常是神。合一是聖靈「所賜」的，神已經造好，交到我們手上；一神是眾人的父，超乎、貫乎、也住在眾人之內；基督先降後升，把各樣的恩賜賞給人，又親自「賜」下使徒、先知、傳福音的、牧師和教師；新人是照著神的形像「造」的；聖靈蓋了印記，會擔憂，卻沒有離開；神在基督裡饒恕了我們。人在這一章的每一個動作——保守、盡職、穿上、饒恕——都接在神先做的事後面。","第 32 節「彼此饒恕」，原文 χαριζόμενοι（charizomenoi），字根就是 χάρις（charis）——恩典。保羅沒有用一個算帳的字說「免債」，而是用恩典的字說「施恩」：給對方他不配得的。同一節的後半，這個字又出現一次：神在基督裡「饒恕了」你們，ἐχαρίσατο（echarisato）。這改變今天的讀法：饒恕不是我咬著牙擠出來的美德，是我先領受過的恩典，從我手上再遞出去；所以它可以慢，可以先在神面前開始，卻從來不是從我的力氣開始。","這一章照出來的我，常常想要一個位子。讀到第 11 節，我先找自己在哪一格；被看見的時候很熱心，沒有頭銜就退到最後一排。另一面，我很會維持表面的和氣：該說的誠實話吞下去，怒氣收進抽屜，過了好幾個日落還在；嘴上說饒恕了，心裡一筆一筆記著帳。想坐上台的我，和不肯說真話的我，其實是同一個舊人——都在保護自己。","「為要成全聖徒，各盡其職」（4:12）。全章最大的翻轉在這裡：職分的成績，不看有職分的人做了多少，看聖徒被接好了多少。「成全」是補網、接骨的字；接骨的醫生不替病人走路，他讓病人自己走。教會最常見的倒置，是幾個人做到累垮、其他人坐著打分數；這一節把它扳回來：有職分的人退一步，好讓每一個人上場。","這一週做一件事：把你在教會裡「被服事」的一件事，換成「去服事」。若你常是坐在台下的人，問你的小組長一句：「這個月有哪一件事我可以接手？」接一件具體的小事——排椅子、帶一段禱告、陪一位新朋友吃飯。若你是一直在做的人，反過來，把一件事交出去，花時間教一個人做，他做得不如你，也不搶回來。各盡其職，一半是上場，一半是讓位。","最終整合：以弗所城外，一間家庭教會，夜裡。\n推基古從羅馬帶來一封信。油燈下，有人一句一句念出來。\n念到「他所賜的，有使徒，有先知，有傳福音的，有牧師和教師」，屋裡的人都轉過頭，看向那幾個常常站在前面的人。\n念信的人停了一下，接著念：「為要成全聖徒，各盡其職，建立基督的身體」。\n那幾個人低下頭，把大家的目光，還給了整個屋子。\n角落裡，一個在碼頭扛貨的奴隸，從來沒有在聚會裡開過口；\n他身邊，一個上個月才把法術書抱去燒掉的年輕人，還不知道自己能做甚麼。\n「百節各按各職」——原來他們也是關節。\n那天下午吵過架的兩個姊妹，太陽下山以前已經在門口說開了，此刻並肩坐著，分一塊餅。\n散會的時候，沒有人被請上台，可是每一個人手上都拿著一點東西：\n一盞要送回去的燈，一籃要分給缺乏人的餅，一句明天要對鄰舍說的實話。\n屋樑上沒有刻著誰的名字。\n只有一位頭，在諸天之上；他先降下來過，又升上去了；\n他把戰利品分給每一個人，\n也把每一個人，一節一節，接回他的身體裡。"],"self":"這一章照出來的「有己」，第一個樣子是要位子：讀到五重職份，我先問自己是哪一種、排第幾；服事要有頭銜才肯上場，被人取代就受傷；或者反過來，我把自己藏在最後一排，說「我甚麼都不是」，其實是不肯被人要求、不肯被人看見軟弱。\n第二個樣子是護己：為了面子，誠實話當面不說、背後再說；怒氣不處理，收著過夜，慢慢發成苦毒；嘴上說饒恕，心裡記帳。要位子的我和護己的我，都是那個隨著私慾的迷惑漸漸變壞的舊人。","t321":{"k":"耶穌是我的榜樣：這一章的職分，是從一位先降後升的主手上賜下來的。他有一切的權柄，卻先降到地上——道成肉身，走上十字架，被放進墳墓；他在門徒爭論誰為大的那一晚說：「我在你們中間如同服事人的。」（路 22:27）他會發怒——在會堂裡「怒目周圍看他們，憂愁他們的心剛硬」（可 3:5），可是他的怒氣從不過夜去報復；被釘的時候，他把審判交給神，禱告說「父啊！赦免他們」（路 23:34）。他把職分賜給人，不是要人站得比別人高，是要人學他彎下腰，把別人接起來。","g":"讓耶穌作王：這一章要人讓出「頭」的位置。「連於元首基督」（4:15）——身體只有一個頭；有職分的人是關節，不是頭。講台上的人要讓出被依賴、被絕對順服的那個位子，不以使徒、先知、遮蓋自居；坐在台下的人也要讓出另一個位子——「我只是來聽的」那個旁觀者的座位。在饒恕上，讓耶穌作王，就是把報復的權利交還給他：審判是他的，我不必再替自己討回公道。可以自己檢查：這一週，我在哪一件事上，還在當自己的頭？","p":"建立屬神的體系：經文說完了它自己的話，321 才接上來。4:12「建立基督的身體」是「建立屬神的體系」的本文；4:11 是「235」裡那個「5」的出處——開拓的、說造就的話的、傳福音的、牧養的、教導的，五種功能彼此配搭，不是五張名片，也沒有誰是誰的遮蓋。量這個團隊的尺在 4:16：每一個關節都在供應嗎？所以團契的每一次檢討，不先問台上的人做得多好，先問：這個月有幾個新的關節開始供應？有沒有人被裝備、被差出去？衝突有沒有在日落以前處理？說誠實話的人有沒有被保護？一個健康的體系，是每一個人都上場、元首只有基督的身體。"},"grp":["【一、破冰】你身上有沒有一個關節曾經扭傷或卡住過——腳踝、膝蓋、手指、腰？那幾天生活有甚麼不方便？那時候你才發現它平常默默在替你做甚麼？","【二、扎心】「生氣卻不要犯罪；不可含怒到日落，」（4:26）說一件具體的事：現在你心裡有沒有一個怒氣，已經放過好幾個日落？它是從哪一天、哪一句話開始的？這些日子，它在你心裡長成了甚麼——冷淡、躲避，還是背後的幾句話？","【三、福音】「正如神在基督裡饒恕了你們一樣。」（4:32）說一個時刻：哪一年、在哪裡，你清楚知道神饒恕了你一件你自己都放不下的事？那份被饒恕的經驗，後來怎樣改變了你看某一個人？","【四、行動】說出這一週你在教會、小組或團契裡可以接手的一件具體小事（排椅子、帶一段禱告、陪一位新朋友吃飯、接送一位長輩），你要向誰說、在哪一天開始；若你一直是做很多的人，說出你要交出去的那一件事，以及你要親自教會的那一個人的名字。","【五、代禱】為三種人指名禱告：一位坐在教會很多年、從來沒有人邀請他上場的人，求主讓他知道自己也是一個關節；一位曾經被「屬靈權柄」或「先知性的話」傷害、從此不敢再信任教會的人，求主醫治、也求教會配得他的信任；一位心裡有很深的傷、身邊的人一直催他饒恕的人，求主先保護他、陪伴他，讓饒恕在安全的地方慢慢發生。"],"prac":{"main":"這一週，從坐著的位置站起來：在身體裡找到自己的那一節，在日落以前處理怒氣。","items":["對神：每天早上讀一次 4:4–6，慢慢數那七個「一」，用一句話告訴主：「今天我是你身體裡的一節，不是頭。」晚上讀 4:32，回想主在基督裡饒恕了你的一件事，為它感謝。","對自己：這七天，抓出一個你心裡收著過夜的怒氣，寫下它的日期和起因；在神面前說出來，再問自己：我要的是對方被處理，還是我自己被醫治？同時寫下一句你為了面子一直吞下去、該用愛心說出口的誠實話。","對人：在家裡或公司，選一個你一直用沉默或客套迴避的人，這一週用愛心對他說一句誠實話——先說事實，再說感受，不翻舊帳，也不在群組裡說；若對方曾經傷害你、而且並不安全，就不必去找他，只把這件事交給一位你信得過的屬靈同伴陪你禱告。","對生活：照 4:28 從「拿」轉到「給」，檢查你的錢包和時間：這一週有沒有一筆收入、一段空檔，本來只想著自己，可以分一點給缺乏的人？具體做一件——請一位手頭吃緊的同學吃飯、捐一筆給團契的關懷基金、替一位單親家長接一次孩子。","對使命：在你的小組或服事團隊裡，列出所有固定在做事的人名；看看哪一件事一直是同一個人在做，這一週邀請一位還沒有上場的人一起做，並且由原本做的人親手教他。各盡其職，不是把事分出去，是把人接起來。"]},"safe":["① 把 4:11 的五重職份講成頭銜與層級：自封或封人為「使徒」「先知」，或把五重講成升遷的階梯——「你現在是教師，將來可以升到使徒」。","4:11 的主詞是「他」、動詞是「賜」：職分是升天的基督給教會的禮物，目的寫在 4:12 是成全聖徒、各盡其職；新約使徒的根基職分只打一次（2:20），今天需要的是功能，不是名片（紅線六，全卷立場見 ISS00_5）。","檢驗標準：會眾聽完，是更想知道自己能得到哪一個頭銜，還是更清楚自己可以怎樣上場服事？","② 用「遮蓋」「屬靈權柄」要求絕對順服、奉獻或忠誠，或用一句「先知性的話」替人決定婚姻、工作、搬遷。","4:15 說元首只有基督，4:14 警告的「人的詭計」正是打著屬靈旗號的操控；任何「神對你說」都要被聖經與群體察驗，把禮物變成權柄，就是把升天之主的凱旋改成了自己的遊行（紅線六；回指哥林多後書立場三）。","檢驗標準：一位曾被「遮蓋」綁住的人聽完，是更依賴某一位領袖，還是更能直接來到元首基督面前、也更自由地服事？","③ 把這一章講成 321 的插圖：先講「235」的五重職份團隊，再拿 4:11 來印證，或把團隊講成五個坐在台上的人。","次序是經文先講：七個「一」、升天的基督賜恩賜、4:12 成全聖徒、4:16 百節各按各職，然後 321 才在末端接上；五重職份團隊是五種功能的配搭，量它的尺是有多少關節開始供應（鐵律五）。","檢驗標準：會眾聽完，記住的是一套團契的組織圖，還是那位先降後升、把恩賜分給每一個人的基督？","④ 把 4:12 讀成「牧師甚麼都要做，會眾來接受服事」，或反過來講成「牧者不必講道探訪，只要開會分派」。","「成全」是補網、接骨，做工的是聖徒；但補網的人自己也要坐下來補，牧者的講道、教導與牧養正是裝備的主要方式。兩種倒置都讓身體長不大：一種把牧者燒盡，一種把牧養變成管理。","檢驗標準：你有沒有同時說出「聖徒要上場」和「裝備需要牧者親手教」？一位疲憊的牧者和一位旁觀的會友聽完，是不是都被扳回正位？","⑤ 用 4:3「竭力保守聖靈所賜合而為一的心」要人對錯誤教導、權力濫用或傷害沉默：「不要講了，會破壞合一」。","合一是聖靈所賜，建立在 4:4–6 七個「一」上；同一章又說要長大「不再作小孩子」、要「用愛心說誠實話」。用合一掩蓋傷害，保守的是表面的和氣，不是聖靈所賜的合一（全卷立場見 ISS00_9）。","檢驗標準：一位指出問題的弟兄姊妹聽完，是覺得自己被當成破壞合一的人，還是覺得用愛心說出誠實話正是在保守合一？","⑥ 把 4:26「生氣卻不要犯罪」講成「基督徒不可以生氣」，叫會眾把怒氣吞下去、表面平靜，否則就是不屬靈。","這句是詩篇第 4 篇七十士譯本的原句，經文沒有禁止生氣，它限定生氣：要處理，不要收藏；壓抑的怒氣不會消失，只會沉下去變成 4:31 的苦毒，這正是講章說的「表面平靜，裡面發炎」（紅線八）。","檢驗標準：一位從小被教導「生氣就是罪」、一直把委屈吞下去的人聽完，是覺得可以把怒氣帶到神面前，還是又多一個要壓下去的理由？","⑦ 反過來，用 4:26 替發怒背書：「保羅都說可以生氣」「我這是義怒」，在家裡、群組或講台上罵人有理。","經文的重點在後半句「卻不要犯罪」：怒氣有日落的期限，不可給魔鬼留地步，而且 4:31 要除掉忿怒、嚷鬧、毀謗；主耶穌的怒氣是為了別人、為了神的家，從不為自己的面子過夜報復（紅線八）。","檢驗標準：會眾聽完，是更敢理直氣壯地發脾氣，還是更警醒自己的怒氣是為誰、有沒有在日落以前處理？","⑧ 用 4:32「彼此饒恕」逼受害者和好：「你饒恕了就要回家」「為了孩子忍一忍」「你不饒恕，神也不饒恕你」，尤其對家暴、性侵或長期受欺壓的人。","饒恕是放下報復的權利、把審判交給神，可以先在神面前開始，也可能需要很長的時間；和好是關係的恢復，需要對方真實的悔改，也需要安全（路 17:3）。遇到暴力，教會的第一件事是保護人的安全，不是勸人回去（紅線八；回指哥林多後書立場四）。","檢驗標準：一位正處在暴力或傷害中的人聽完，是知道自己可以先求助、先安全，還是覺得要回到傷害裡才算順服神？","⑨ 把「不可含怒到日落」講成字面的時限：「今晚一定要和對方談完、一定要和好」，否則就是犯罪。","日落是一個畫面：怒氣不可收藏、累積，要儘快帶到神面前處理；它沒有要求在一天之內完成和好，更沒有要求受傷的人當晚面對傷害他的人。逼人當晚和好，常常是第二次傷害（紅線八）。","檢驗標準：你有沒有說清楚「今天就開始處理」和「今天就要和好」不是同一件事？","⑩ 把 4:27「不可給魔鬼留地步」講成「你一生氣就被鬼附了」，或把家裡的每一次衝突都講成鬼的攻擊、要趕鬼。","τόπος 是一塊地方：沒有處理的怒氣是讓出一塊地，不是被附身；保羅的對策是處理怒氣、說實話、饒恕，不是驅鬼儀式。情緒困擾若已影響生活，要同時尋求專業協助（全卷立場見 ISS00_4）。","檢驗標準：會眾聽完，是更警醒自己的怒氣，還是更害怕、更會把責任推給鬼？","⑪ 把 4:22–24 講成「你還有舊人的樣子，表示你根本沒有得救」，或反過來說「那是我的舊人做的，不是我」。","這三個動詞是「你們已經脫去了，所以要活出已經脫去的樣子」（對照西 3:9–10；羅 6:6）；新人是神造的，心志的更新是天天的事。講成恐嚇會壓垮誠實的人，講成推卸會讓舊人繼續作主。","檢驗標準：一位還在掙扎的人聽完，是更有把握自己已經穿上新人、也願意今天就脫去一件舊衣，還是更恐慌或更放心地推卸？","⑫ 用 321「舊人有己、新人無己」替別人貼標籤：「你就是有己」「他還是舊人」，在小組或同工會裡拿來壓人。","4:22–24 是保羅叫每一個人對自己說的話，前後文是說實話、不含怒、彼此饒恕；拿這兩個詞去量別人，本身就是有己的舊人在說話。新人是一群人在基督裡被造成的，不是一把量人的尺。","檢驗標準：會眾聽完，是更會指出別人的有己，還是先看見自己身上哪一件舊衣還沒有脫下來？","⑬ 用 4:15「用愛心說誠實話」替刻薄開門：「我只是說實話」，或反過來為了面子把一切真話都吞下去、背後再說。","ἀληθεύοντες 是在愛中持守真實：只有真理沒有愛會傷人，只有愛沒有真理會害人；華人的面子文化常讓我們在兩頭擺盪，經文要的是「說他需要聽的話，用他接得住的方式」。","檢驗標準：你講完這一節，會眾是更敢在群組裡直言傷人，或更會沉默，還是更知道怎樣當面、溫和、具體地說出真話？","⑭ 用 4:30「不要叫神的聖靈擔憂」恐嚇人：「你再這樣，聖靈就要離開你了」。","同一節說「你們原是受了他的印記，等候得贖的日子來到」：印記已經蓋上，聖靈擔憂，卻沒有離開；這一節的力量是被愛而不忍心，不是怕被拋棄。","檢驗標準：一位很怕自己已經失去聖靈的人聽完，是更有得救的確據、更想回到神面前，還是更恐慌？","⑮ 用處境取消原則：「4:11 是第一世紀的教會架構，與今天無關」；或反過來，把 4:11 直接當成今天每一間教會都要照抄的組織圖、五個職稱缺一不可。","書信三問的第三問要走完：原則是升天的基督賜下各樣恩賜與職分，為要成全每一個聖徒、建立一個身體，元首只有基督；處境是亞細亞眾教會在法術與偶像之城裡的家庭教會。今天它落在我們的同工團隊、小組與團契裡——判斷的理由要說出來（全卷立場見 ISS00_1）。","檢驗標準：你有沒有具體說出，這一章的原則今天在你的教會落在哪裡，並且說出判斷的理由？"]},{"n":5,"t":"乃要被聖靈充滿","sub":"愛、光、滿","lv":"A","arc":"行","sec":[["5:1--7","也要憑愛心行事：效法神"],["5:8--14","行事為人就當像光明的子女：睡著的人當醒過來"],["5:15--20","要愛惜光陰：乃要被聖靈充滿"],["5:21--24","又當存敬畏基督的心，彼此順服：妻子與丈夫"],["5:25--33","正如基督愛教會，為教會捨己：極大的奧祕"]],"serm":{"pts":[["憑愛心行事","5:1--7","「也要憑愛心行事，正如基督愛我們，為我們捨了自己」——效法神，不是模仿一套規矩，是像蒙慈愛的兒女學父親"],["光明的子女","5:8--20","「從前你們是暗昧的，但如今在主裡面是光明的」——不是換了環境，是換了本質；所以「乃要被聖靈充滿」"],["彼此順服","5:21--33","「又當存敬畏基督的心，彼此順服」——家裡每一條命令都在敬畏基督底下；對丈夫說的是「正如基督愛教會，為教會捨己」"]]},"q":"你家的群組裡，最近一次讓大家都笑出來的，是一句甚麼樣的話？你的手機裡，最常打開的，是聖經、看盤軟體、購物網站，還是追劇平台？你最近一次覺得自己「被灌滿了」——被酒、被情緒、被工作、被別人的眼光——是在甚麼時候？\n也許你在教會很屬靈，回到家，卻是全家最不能被頂撞的那一個；也許你一直默默在家裡吞忍，以為那就叫作「順服」。\n這一章要問的是：一個在基督裡已經變成光的人，回到餐桌旁、辦公室、群組裡，到底被甚麼充滿？他的家，是讓人越來越自由，還是越來越害怕？","truth":"我們從前是暗昧，如今在主裡面是光；神先像父親一樣愛了我們，基督先為我們捨了自己，所以我們能效法神、憑愛心行事。\n被聖靈充滿不是一陣高潮，是一種天天讓他作主的生活：嘴裡有感謝，心裡有歌，家裡有彼此順服與捨己的愛。","mv":{"t":"不要醉酒，酒能使人放蕩；乃要被聖靈充滿。","r":"弗5:18"},"card":["這一章講一個已經在基督裡坐上寶座的人，怎樣在地上走路：像蒙慈愛的兒女那樣憑愛心走，像光明的子女那樣在光中走，像智慧人那樣把時機買回來走。三段路最後都走進同一扇門——家門。被聖靈充滿的人，最後的證據不在聚會的台前，而在餐桌旁的彼此順服，和一位丈夫為妻子捨己的愛。","這一章每一個命令前面，都先站著神做成的事。神先愛我們，我們才是「蒙慈愛的兒女」；基督「為我們捨了自己」，當作馨香的祭獻給神；是主把暗昧的人變成光；是基督要「光照你」；是聖靈來充滿——那是被動語態，作工的是他。基督愛教會、洗淨教會、保養顧惜教會，把她獻給自己。人在這一章做的每一件事，都是回應：被愛的人才捨得，被照亮的人才發光。","第 4 節「戲笑的話」原文是 εὐτραπελία（eutrapelia），本來是「轉得很快」——一種很機靈、甚麼話都能轉成雙關的口才；保羅緊接著說「總要說感謝的話」，εὐχαριστία（eucharistia），兩個字聲音相近。他不是叫人變得無趣，是叫那條很會轉的舌頭換一個方向轉：從把人變成笑料，轉成把恩典說出來。下一次群組裡有人丟出那種笑話，你的機靈可以轉向別的地方。","這一章照出來的我，常常把罪分成兩種：淫亂是大罪，貪心卻是「理財」。我很警覺別人的性醜聞，卻每天被帳戶的數字牽著走，買了還想再買。我也常常被別的東西灌滿——酒、追劇、怒氣、別人的評價——然後說我沒有時間被聖靈充滿。回到家，我很會要求別人順服我，卻很少想到「彼此」也包括我。","「又當存敬畏基督的心，彼此順服。」（5:21）全章最大的翻轉在這裡：被聖靈充滿的人，不是變得更有權柄，而是變得更願意讓。家裡最先被敬畏的不是丈夫、不是父母、不是賺最多錢的那一個，是基督；正因為基督在上面，誰都不可以拿順服當作控制人的工具，也誰都不必拿強勢保護自己。這一句不是削弱婚姻，是把婚姻放回它真正的主人手裡。","這一週做一件事：每天晚餐（或一天中全家第一次碰面的時候），由你先說一句具體的感謝——謝謝誰做了甚麼，而不是泛泛的「辛苦了」。再找一件你平常一定要照自己意思的小事（遙控器、週末去哪裡、菜怎麼煮、錢怎麼花），這一週讓家人決定一次。如果你是家裡一直在吞忍、甚至害怕的那一個，這一週的功課不是更順服，是找一位信得過的人說出來。","最終整合：亞細亞，一間家庭教會，晚上。\n推基古從羅馬帶來的信，在燈下被打開。讀信的人清了清喉嚨，屋裡二十幾個人都安靜下來。\n燈是主人的妻子點的。油是她早上去買的，價錢她記得，可是今晚她沒有算。\n讀到「從前你們是暗昧的，但如今在主裡面是光明的」，角落裡一位老人低下頭——他從前是在亞底米廟前賣銀龕的。\n讀到「不要醉酒」，有人想起上個月城裡的節慶，滿街的人都醉了，醒來甚麼也沒有。\n讀到「乃要被聖靈充滿」，沒有人倒下，也沒有人喊叫；有人開始輕聲唱起一首大家都會的詩，旁邊的人跟著唱，唱給彼此聽。\n然後讀信的人停了一下，因為下一句是對妻子說的。屋裡的女人們抬起頭：從來沒有一封信，直接對她們說話。\n再下一句是對丈夫說的，而且很長很長。主人坐在那裡，聽見「正如基督愛教會，為教會捨己」，他把手伸過去，握住了點燈的那隻手。\n門邊站著兩個奴僕，他們還不知道，這封信再過一會兒，也要對他們說話。\n燈一直亮著。不是因為油很多，是因為有人一直在添。\n原來被充滿，不是一個人在台前發光，\n是一屋子從前是黑暗的人，在同一盞燈底下，學著彼此讓、彼此唱、彼此謝；\n原來作頭，不是坐得最高，\n是第一個彎下腰、第一個把自己交出去的人——\n就像那位先為我們捨了自己的主，\n今夜也在這間小屋裡，看著他的新婦，一直沒有轉開眼睛。"],"self":"這一章照出來的「有己」，第一個樣子是「拿」：基督把自己交出去，我卻把不屬於我的拿過來——一個眼神、一筆錢、一段不該有的關係、一句把人當笑料的話。我替淫亂找刺激的理由，替貪婪找理財的名字，替醉酒找應酬的藉口。\n第二個樣子是「坐在上面」：在家裡，我要別人順服我，卻不覺得「彼此」也包括我；我會引用第 22 節，卻跳過第 21 節和第 25 節。或者反過來，我把害怕叫作順服，把不敢說話叫作溫柔——兩種樣子，都還沒有讓基督坐在家的中間。","t321":{"k":"耶穌是我的榜樣：主耶穌是第一位被聖靈充滿的人——「耶穌被聖靈充滿，從約旦河回來」（路 4:1），聖靈卻把他引到曠野，不是引到舞台。他被充滿的樣子，是在被賣的那一夜，「拿起餅來，祝謝了」（林前 11:23--24）——最黑的夜裡，他還在感謝。他是教會的頭，作頭的方式是在十字架上還記掛著母親，對門徒說「看，你的母親」（約 19:27），替她找一個家。學他，就是在最該被服事的位置上，先把自己交出去；在最有理由抱怨的夜裡，先說感謝。","g":"讓耶穌作王：這一章要人讓出三個位置。第一個是「被別的東西灌滿」的位置：酒、看盤、追劇、怒氣，那些我累了就伸手去拿的東西，讓出來給聖靈。第二個是「家裡的王」的位置：5:21 說存敬畏基督的心——家裡坐在最高處的是基督，不是我，也不是任何一位家人；所以我不能用順服控制人，也不必用強勢保護自己。第三個是「我自己的錢」的位置：貪心就是拜偶像，把帳戶的主權交還給主。可以自己檢查：這一週我在家裡最後一次堅持照自己意思的時候，基督有沒有被我請到桌邊？","p":"建立屬神的體系：第 5 章給教會四根柱子。第一，敬拜是「彼此對說」的：小組裡唱詩，不只是一個人在台上唱，而是讓每一個人的歌也被別人聽見。第二，教會要有光：財務公開、同工的責任清楚，暗中的事不在教會裡有藏身的地方（5:11--13）。第三，教會要像一個家，也要保護家裡最軟弱的人：婚前輔導、資深夫妻陪伴新婚夫妻，並且事先預備好一套面對家暴的流程——誰接案、怎樣保密、怎樣轉介庇護與專業協助。第四，單身、喪偶、離婚的弟兄姊妹在這個家裡不是旁聽者，他們同樣是那位新郎所愛的新婦的一部分。"},"grp":["【一、破冰】小時候在你家，吃飯時誰最後一個坐下？誰負責添飯、誰負責洗碗？現在回想起來，那個人在你心裡是甚麼樣的位置？","【二、扎心】「有貪心的，就與拜偶像的一樣。」（5:5）說一件具體的事：最近一次你很想買、很想賺、很想多要一點的東西是甚麼？那一刻，它在你心裡占的位置，比神大還是小？你一天打開看盤或購物軟體幾次，打開聖經幾次？","【三、福音】「從前你們是暗昧的，但如今在主裡面是光明的。」（5:8）說一個你生命裡「從前」與「如今」的對照：哪一年、在甚麼地方，你發現自己不再是那個樣子了？那一次的改變，是你自己努力出來的，還是主做的？","【四、行動】說出你家裡一件你平常一定要照自己意思的小事（遙控器、週末行程、錢怎麼花、菜怎麼煮），以及這一週你打算在哪一天、對哪一位家人（說出稱呼或名字），讓他決定一次；再說出這一週你要在哪一餐，對誰說出一句具體的感謝。","【五、代禱】為四種人指名禱告：一對正在冷戰或常常爭吵的夫妻，求主讓他們學會彼此順服與捨己；一位被酒、賭、或網路色情綁住的人，求聖靈充滿他；一位單身、喪偶或離婚、在「家庭主日」特別孤單的弟兄姊妹；以及一位可能正在家裡受傷、還不敢說出來的人——求主保守他的安全，也讓他身邊有一位可以求助的人。"],"prac":{"main":"這一週，讓聖靈充滿我，而不是被別的東西灌滿——嘴裡多一句感謝，家裡多一次彼此讓。","items":["對神：每天早上用一句話禱告：「主啊，今天請你充滿我。」晚上睡前讀一次 5:18--21，回想今天哪一刻有對說、唱、讚美、感謝、彼此順服其中一樣，為它感謝；若一樣也沒有，也照實告訴主。","對自己：這七天記下一件你「累了就伸手去拿」的東西——一杯酒、一個購物網站、一部劇、看盤軟體、一個發洩怒氣的對象。記下你每天打開它幾次；週末把那張紀錄帶到主面前，選一個時段，用一首詩歌或一段經文取代它。","對人：每天晚餐（或全家第一次碰面的時候）先說一句具體的感謝；這一週在一件小事上讓家人決定一次。若你是丈夫或家裡最強勢的那一位，問一次對方：「最近我有沒有哪一句話、哪一個決定，讓你覺得被壓著？」只聽，不辯解。","對生活：檢查你的群組與聚會：這一週若有人丟出黃色笑話或拿人當笑料，不跟著按讚，換一句別的話；若有應酬，事先想好怎樣得體地不被灌醉。若你在家裡正受著威脅或暴力，這一週先找一位信得過的人或專業單位說出來。","對使命：為你的小組或教會提一件「光」的事：財務是不是公開？同工的責任是不是清楚？教會有沒有一套面對家暴的求助流程與轉介名單？挑一件，這一週向負責的同工提出具體建議。"]},"safe":["① 把 5:22--24 講成男尊女卑或家暴的護身符：「聖經說妻子要凡事順服，他打你，你要更順服、更禱告」。","5:22 原文沒有動詞，順服借自 5:21「彼此順服」，而 5:21 是 5:18 被聖靈充滿的結果；同一段要丈夫「為教會捨己」（5:25）、「愛妻子便是愛自己了」（5:28）。順服絕不包括忍受暴力、虐待、控制或被迫犯罪；遇到家暴，教會第一件事是保護人的安全（紅線一，全卷立場見 ISS00_3）。","檢驗標準：你有沒有從 5:18、5:21 讀起，讀到 5:25？一位正在受暴的姊妹聽完，是更願意求助，還是更不敢說？","② 在講台上明說了「順服不包括忍受暴力」，會後卻對前來求助的人說「回去多禱告、為了孩子忍一忍」，或安排她與施暴者一起作婚姻協談。","受暴者最危險的時候，常常是她說出來之後；在暴力仍在進行時作夫妻協談，可能讓她回家後付出代價。教會要先確認她和孩子的安全，協助她尋求專業協助、庇護與法律保護，再談其他。","檢驗標準：你的教會有沒有一份事先準備好的求助流程與轉介名單？接案的同工知不知道第一句話該說甚麼、不該說甚麼？","③ 把 5:18「被聖靈充滿」講成某一種外在現象的唯一標記：「沒有倒地、沒有發抖、沒有說方言，就是沒有被充滿」。","5:18 是現在式、被動、命令：持續的、讓他作的、每一個信徒都要的；經文自己列出的果效是 5:19--21 的對說、唱、讚美、感謝、彼此順服。某些現象在教會歷史上出現過，但經文沒有把任何一種當作唯一記號（紅線七，回指哥林多前書立場三）。","檢驗標準：會眾聽完，是更渴望某一種台前的經歷，還是更想知道自己回到家，有沒有感謝、有沒有彼此順服？","④ 反過來，因為怕情緒化、怕靈恩爭議，就把「被聖靈充滿」講成「讀經禱告、作個好人」，或乾脆跳過不講。","這是一個命令句；避而不談不是謹慎，是不順服。保羅把醉酒和被聖靈充滿放在一起，正是說：人一定會被某樣東西充滿，問題只是被甚麼充滿。把它講成道德努力，等於把被動語態改成主動語態。","檢驗標準：你有沒有清楚邀請會眾向聖靈打開、天天求他充滿？會眾聽完，是覺得又多一項功課，還是知道可以把自己交給他？","⑤ 把 5:23「丈夫是妻子的頭」講成丈夫有權替妻子決定一切、管她的錢、管她見誰、檢查她的手機。","經文自己替「頭」下了定義：「他又是教會全體的救主」；基督作頭的方式是為身體捨命、洗淨她、保養顧惜她。頭怎樣理解，互補派與平等派並陳，但兩派都不接受「頭」等於控制（全卷立場見 ISS00_3；回指哥林多前書立場二、加拉太書立場四）。","檢驗標準：會眾裡的丈夫聽完，是更覺得自己有權柄，還是更覺得自己要先上十字架？","⑥ 用 5:5「在基督和神的國裡都是無分的」恐嚇會眾：「你看過色情影片、你貪過一次財，就沒有份了」。","保羅說的是以這些事為生活方式、不肯回頭的人；5:8 立刻說「從前你們是暗昧的」——這張清單描寫的，是福音把人救出來的地方。這一句不可刪去，因為它擋住放縱；也不可拿來使痛悔的人懷疑自己的得救。","檢驗標準：一位正在和網路色情或賭博掙扎、心裡很痛的人聽完，是更敢回到主面前、找人同行，還是更想藏起來？","⑦ 講 5:3--5 只講性，略過「貪婪」；或者講貪婪時只罵別人，卻在同一場聚會裡推銷「奉獻越多、蒙福越多」。","保羅把貪婪和淫亂並列，又說「有貪心的，就與拜偶像的一樣」；成功神學把神當作致富的工具，正是把貪婪包上屬靈的外衣。華人城市裡拜財神的心，也可能只是換了一個講台。","檢驗標準：會眾聽完，是更警醒自己對錢的心，還是更想用奉獻向神換回報？","⑧ 把 5:14「所以主說」講成「以賽亞書的預言在這裡應驗了」，或憑空斷定它出自某一節舊約。","舊約沒有完全相同的句子，它很可能是早期教會的詩歌；這使我們想起「興起，發光」（賽 60:1）與「睡在塵埃的啊，要醒起歌唱」（賽 26:19），但經文沒有作「應驗」的連結。把「這使我們想起」講成「應驗」，是替保羅說他沒有說的話。","檢驗標準：你講這一節時，有沒有說出「出處不明」這四個字？有沒有把重點放回「基督就要光照你」？","⑨ 用 5:18「不要醉酒」宣告「喝一口酒就是犯罪」，把滴酒不沾當作進教會或作同工的條件；或反過來說「只要沒醉，喝多少都可以」。","經文禁止的是醉酒，因為「酒能使人放蕩」；全面禁酒或節制飲酒是基督徒的自由與智慧，不可升格為得救或被接納的條件，也不可忽略軟弱的弟兄與酒癮者（回指加拉太書立場三；議題頁並陳）。","檢驗標準：一位剛戒酒的人和一位在婚宴上舉杯的人都聽完，是都被保護、都被尊重，還是一個被絆倒、一個被定罪？","⑩ 用 5:20「凡事要……常常感謝」要求正在哀哭的人：「你要感謝神讓你失去孩子」「不感謝就是沒有信心」。","原文是「為一切事」感謝父神，但寫這句話的人手上綁著鎖鍊，說的是在一切事上相信父沒有離開，不是假裝苦難是好的；聖經同樣有哀歌，主耶穌也在墳前哭了。逼人感謝，會讓受苦的人連眼淚都要藏起來。","檢驗標準：一位剛經歷失落的人聽完，是覺得可以帶著眼淚來到父面前，還是覺得連難過都是不屬靈？","⑪ 用 5:11「倒要責備行這事的人」鼓勵在群組或講台上公開揭發、點名羞辱人，或反過來拿「不要論斷」掩蓋教會裡的性侵、作帳與權勢濫用。","5:13 說揭露的主體是光：光把暗中的事照出來，是為了醫治與保護，不是為了看熱鬧；責備有次序（這使我們想起太 18:15），但涉及傷害他人、觸犯法律的事，不可以用「私下處理」把受害者的聲音關掉。","檢驗標準：教會面對暗中的事，最先保護的是受害者與真相，還是教會的面子與某一位同工的名聲？","⑫ 用處境取消原則：「妻子順服是第一世紀的家規，跟今天無關」；或反過來，把某一種文化裡的家庭分工直接說成就是 5:22--33。","書信三問的第三問要走完：原則是在敬畏基督底下彼此順服，每一組關係都雙向，對上面那一方要求更重；處境是希羅家規與亞細亞的城市。今天它落在家務、財務、決策、婆媳、照顧長輩上——判斷的理由要說出來（全卷立場見 ISS00_1、ISS00_3）。","檢驗標準：你有沒有具體說出，這一段的原則今天在你的會眾家裡落在哪裡，並且說出判斷的理由？","⑬ 把 5:22--33 講成只有已婚者的事，或在「家庭主日」把婚姻講成人生的完成，讓單身、喪偶、離婚的人覺得自己是不完整的。","保羅說「這是極大的奧祕，但我是指著基督和教會說的」——原版是基督與教會，每一個信徒都在那個婚姻裡；保羅自己也是單身。把婚姻講成偶像，與把婚姻講成枷鎖一樣，都偏離了這段經文。","檢驗標準：一位單身或喪偶的弟兄姊妹聽完，是覺得這段經文也是寫給他的，還是覺得自己今天只是旁聽者？","⑭ 用 5:31「人要離開父母」鼓勵新婚夫妻不理父母，或反過來用孝道要求小家庭凡事聽長輩安排、婆婆管兒媳的家。","「離開」是盟約優先次序的改變，不是斷絕孝敬；6:2「孝敬父母」是一生的責任，但婚姻的決定是在主面前由夫妻自己負責（全卷立場見 ISS00_3）。","檢驗標準：一對夾在父母與配偶之間的新婚夫妻聽完，是知道怎樣同時孝敬父母、又守住婚姻，還是只覺得要選邊站？","⑮ 把這一章講成 321 的插圖：先講「捨己」，再拿 5:2、5:25 來印證；或把「被聖靈充滿」講成團契的一套操練步驟。","次序是經文先講：蒙慈愛的兒女、暗昧變成光、一個命令帶出五個分詞、彼此順服、基督與教會；321 的「捨己」才在末端接上——那是基督先為我們捨了自己（鐵律五）。","檢驗標準：會眾聽完，記住的是一套團契的術語，還是那位先為他捨了自己的主？"]},{"n":6,"t":"還能站立得住","sub":"家、甲、站","lv":"A","arc":"站","sec":[["6:1--4","要在主裡聽從父母：不要惹兒女的氣"],["6:5--9","好像服事主，不像服事人：僕人與主人"],["6:10--13","要穿戴神所賜的全副軍裝：還能站立得住"],["6:14--20","所以要站穩了：六件軍裝與禱告"],["6:21--24","所有誠心愛我們主耶穌基督的人：不朽壞的愛"]],"serm":{"pts":[["家裡的前線","6:1--9","「他們和你們同有一位主在天上」——兒女與父母、僕人與主人，每一條命令都是雙向的，因為頭上都有一位主"],["站立得住","6:10--17","「要穿戴神所賜的全副軍裝，就能抵擋魔鬼的詭計」——勝負已定，所以爭戰的方式是站，不是衝；軍裝是真理與品格，不是口訣"],["禱告與不朽壞的愛","6:18--24","「靠著聖靈，隨時多方禱告祈求」——軍裝穿上以後是禱告；全卷最後一句祝福給「所有誠心愛我們主耶穌基督的人」"]]},"q":"你在家裡是兒女，也可能是父母；在公司裡是下屬，也可能是主管。你有沒有發現，同一個人，換一個位置，就換了一副臉：在上司面前很會聽話，回到家對孩子卻一句也聽不進；在長輩面前很孝順，在下屬面前卻很會擺架子？\n也許你讀到「魔鬼的詭計」，心裡想的是鬼月、風水、半夜的怪聲；也許你根本不太相信有這回事，覺得那只是古人的說法。\n這一章要問的是：一個和基督一同坐在天上的人，回到家門口、走進辦公室、碰上磨難的日子，要靠甚麼站得住？站住以後，他還愛主嗎？","truth":"勝負已經定了，所以我們不是靠自己衝出一條路，而是靠著主、倚賴他叫基督復活的大能大力，在家裡、在職場、在磨難的日子裡站立得住。\n站住的人不停地禱告，為眾聖徒守夜；而這一切的盡頭，是用一份不朽壞的愛，愛我們的主耶穌基督。","mv":{"t":"所以，要拿起神所賜的全副軍裝，好在磨難的日子抵擋仇敵，並且成就了一切，還能站立得住。","r":"弗6:13"},"card":["這一章講一個人怎樣站得住。保羅先看家：兒女與父母、僕人與主人，每一組都頭上有主；再看靈界：真正的對手不是屬血氣的人，所以要穿上神所賜的軍裝，站住，不必衝；最後是禱告，和一句給愛主之人的祝福。前三章坐，第四、五章行，這一章站——先坐，才會行；會行，才站得住；站住的人，最後被問的是愛。","這一章裡，力量是神加給的：「要靠著主，倚賴他的大能大力作剛強的人」（6:10），命令是被動的。軍裝是「神所賜的」，連寶劍都是「聖靈的」。神是家裡與職場上那一位更高的主，他記得每一件沒有人看見的善事，並且「並不偏待人」（6:9）。人在這一章要做的事是站、穿、拿、禱告，可是沒有一樣東西是人自己造的。","第 9 節「他並不偏待人」，原文 προσωπολημψία（prosōpolēmpsia）是「取人的臉」：看你是誰，再決定怎樣待你。華人最熟悉這件事，叫作看面子——有關係的先升遷，嘴甜的先被看見，老闆的親戚遲到沒人敢說。保羅說，在主那裡沒有這回事。這改變今天的讀法：考績、排班、分紅包、選同工，都在這一節裡；神不看臉，我們也不必再演一張臉給人看。","這一章照出來的我，常常是一個看位置換臉的人。在比我大的人面前，我很會順服，甚至委屈自己；在比我小的人面前——孩子、下屬、新來的同工——我卻很快拿出權柄。另一面，碰到看不見的爭戰，我不是甚麼都怕，就是甚麼都不信；把配偶、同工、老闆當成敵人，卻從來沒有想過要為他們禱告。","「他們和你們同有一位主在天上」（6:9）。全章最大的翻轉在這裡：保羅把站在上面的人拉下來，和站在下面的人排在同一排。父親頭上有主，老闆頭上有主，牧者頭上也有主。所以聽從的人不必害怕，因為他最終向主負責；握權的人不可以威嚇，因為他也要向同一位主交帳。權柄不是位置，是一份要交回去的託付。","這一週做一件事：找出你手上握有一點權柄的一個地方——家裡的餐桌、公司的部門、小組的群組——在那裡問一個人：「我最近有沒有哪一句話，讓你很生氣卻不敢說？」聽完先不解釋，只說謝謝。然後每天晚上，叫著那個人的名字，為他禱告一句。站得住的人，是先在自己握權的地方，把威嚇放下的人。","最終整合：以弗所城，一間家庭教會的晚上。\n推基古到了，風塵僕僕，從羅馬帶來一卷信。\n屋裡擠滿了人：有主人，也有他家的奴僕；有父親，也有那個上個月才被他打過的兒子；\n牆角坐著一位老人，多年前，他把自己的法術書抱到廣場上燒了。\n燈點起來，信一句一句地讀下去。\n讀到「要靠著主，倚賴他的大能大力」，那位父親低下頭——原來剛強不是更大聲，是更靠著主。\n讀到「還能站立得住」，那位老人點了點頭。他不必再買護身符了；他只要站在那一位已經得勝的主裡面。\n讀到「隨時多方禱告」，主人和奴僕同時跪下，叫著彼此的名字，一直禱告到燈油快乾。\n最後一句讀完：「並願所有誠心愛我們主耶穌基督的人都蒙恩惠！」\n推基古說，誠心這兩個字，保羅原來寫的是「不朽壞」。\n大家安靜了很久。\n軍裝會舊，燈油會乾，寫信的人也會老去；\n可是有一種愛不會朽壞，因為它是從那位不朽壞的主那裡來的。\n靠著主，站住；跪下，禱告；\n然後用一生，愛他。"],"self":"這一章照出來的「有己」，第一個樣子是用位置換臉：對上順服，是因為怕；對下嚴厲，是因為可以。我把孝順掛在嘴上，卻用「我是你媽」「我是你主管」叫別人不能說話；我在老闆面前認真，老闆一走就鬆掉——兩種樣子，中心都是我的安全和面子。\n第二個樣子是自己打仗：不是靠自己咬牙撐住每一個磨難的日子，就是把每一個難處都歸給鬼，或者乾脆不信有爭戰；而且一忙起來，最先被丟掉的就是禱告，最後被忘記的，是我原來是因為愛主才站在這裡。","t321":{"k":"耶穌是我的榜樣：主耶穌十二歲留在聖殿，說他「應當以我父的事為念」；可是緊接著，路加寫他「同他們下去，回到拿撒勒，並且順從他們」（路 2:51）。他知道自己最終聽從的是天父，所以能甘心順從地上的父母；他在十字架上，還把母親託付給門徒（約 19:26--27），孝敬到最後一刻。面對魔鬼的試探，他沒有表演，也沒有念咒，三次用經上的話站住；在客西馬尼園，他禱告到汗珠如血點。學他，就是知道頭上有一位父，所以在地上的家裡站得住、在試探裡站得住、在禱告裡站得住。","g":"讓耶穌作王：這一章要人讓出三個位置。第一個是「家裡的最高權柄」：父母不是兒女的主，老闆不是員工的主，牧者也不是會眾的主——「同有一位主在天上」。第二個是「自己的力量」：我不再靠咬牙撐住磨難的日子，而是承認力量是他一直加給我的。第三個是「恐懼的主權」：鬼月、風水、半夜的不安，都不再替我決定能不能搬家、能不能結婚、能不能睡覺。可以自己檢查：這一週最後一次我感到害怕時，是誰在作王——那份恐懼，還是那位已經得勝的主？","p":"建立屬神的體系：第 6 章給教會三根柱子。第一，教會裡每一個握有權柄的位置——家長、小組長、執事、牧者——都要被提醒「不要威嚇」，並且有一條讓下面的人可以說話、可以申訴的路；遇到職場霸凌、家庭暴力的肢體，教會先保護人。第二，屬靈爭戰的方式寫進教會的文化：不表演、不點名、不販賣恐懼；有人身心困擾，同時陪他就醫、為他禱告。第三，代禱是一個網，不是一個人的事：小組有輪流守夜的代禱名單，為眾聖徒，也為傳福音的人求開口的膽量。還要有推基古這樣的人——把消息帶到、把安慰帶到的那一節。這樣建起來的，是一群站在一起、跪在一起、愛主愛得久的人。"},"grp":["【一、破冰】小時候，家裡有沒有一句你最怕聽到的話？例如「你看人家某某」「等你爸回來」「再哭就不要你了」。你現在當了大人，有沒有哪一次發現自己也說出了同一句？","【二、扎心】「你們作父親的，不要惹兒女的氣，只要照著主的教訓和警戒養育他們。」（6:4）說一件具體的事：最近一次你在家裡、公司或小組裡，讓一個比你小、比你低的人很生氣卻不敢說，是甚麼時候？你那時候說了甚麼？","【三、福音】保羅說「要靠著主，倚賴他的大能大力作剛強的人」（6:10），這股力量就是叫基督從死裡復活的力量，而且是加給我們的。說一個時刻：哪一年、在甚麼處境裡，你明明撐不住了，卻發現自己還站著？是誰的禱告、哪一節經文陪你站住的？","【四、行動】說出這一週你要做的一件事：在你握有一點權柄的地方（說出是家裡、公司或教會的哪裡），找一個人（說出關係或名字）問一句「我有沒有讓你很生氣卻不敢說」；或在你沒有被看見的那個時段（說出是哪一天、幾點），做一件事只給主看。","【五、代禱】為三種人指名禱告：一位被父母以孝為名、卻在婚姻或信仰上被逼得喘不過氣的成年兒女；一位在職場被霸凌、被要求作假，卻怕丟了飯碗不敢說的人；一位被恐懼綁住、或正在身心困擾中的肢體，求主賜他平安，也賜他願意就醫、願意被陪伴的心。"],"prac":{"main":"這一週，靠著主站住：在家放下威嚇，在職場不只做給人看，每天叫著名字為一位肢體禱告。","items":["對神：每天早上讀一次 6:10，用一句話告訴主：「今天我的力量不是自己擠出來的，是你加給我的。」晚上讀 6:24，回想今天哪一刻是因為愛主才站住的，為它感謝。","對自己：這七天，抓出一個你心裡的恐懼——怕某個日子、某個方位、某個人的一句話、某種病——把它寫下來，旁邊寫上 6:13「還能站立得住」；若這份恐懼已經影響睡眠或生活，這一週就找一位信任的人說出來，需要時去看醫生，這不是信心不夠。","對人：若你是兒女，打一通電話給父母，只問候，不辯論；若你是父母，這一週為一件事向孩子道歉。若你的父母正在替你決定婚姻、工作或信仰，溫柔地說出一句「我會在主面前負責」，同時不撤回對他們的尊敬。","對生活：在工作上，挑一個沒有人看見的時段（遠距開會關掉鏡頭的時候、主管出差的那一天），照樣把事情做好，心裡說一句「這是給主看的」。若你是主管，這一週檢查一次考績或排班，有沒有「看面子」。","對使命：在小組裡建立一張輪流代禱的名單，每人每天為兩位肢體叫名禱告；並為一位正在傳福音的人（宣教士、同事中的基督徒、教會的同工）具體求「放膽開口」，這一週傳訊息告訴他你在為他禱告。"]},"safe":["① 把 6:12 講成要去「捆綁地域邪靈」、點名鬼魔、畫屬靈地圖的屬靈戰術，或在講台上表演趕鬼。","6:10--18 沒有一句叫人去點名、繪製或驅趕某地的邪靈；保羅的戰術只有站住、穿上真理與品格、禱告與傳福音。把注意力放在鬼的名字上，等於把舞台讓給魔鬼，也把會眾帶進恐懼（紅線三，全卷立場見 ISS00_4）。","檢驗標準：會眾聽完，是更清楚自己站在得勝的基督裡，還是更想知道這座城的邪靈叫甚麼名字？","② 把 6:5「僕人要聽從主人」講成員工要無條件服從老闆、忍受職場霸凌、性騷擾，或聽命作假帳、違法。","「好像聽從基督一般」同時是界線：基督不會叫人說謊、違法；6:9 又要求主人「不要威嚇他們」。向公司申訴、尋求法律協助、必要時離職，都不違背這一節（紅線二，全卷立場見 ISS00_3）。","檢驗標準：一位正在職場被霸凌、被要求作假的人聽完，是覺得自己可以求助，還是覺得忍下去才算屬靈？","③ 用 6:1--3 以孝道為名操控成年兒女：「要聽父母的話」，所以婚姻、工作、信仰、呼召都要由父母決定。","「聽從」是對在家受養育的兒女說的，「孝敬」才是一生的責任；「在主裡」也是界線，成年兒女的婚姻、信仰、呼召在主面前自己負責（5:31「人要離開父母」）（紅線二）。","檢驗標準：一位被父母逼婚、或因信主被家人施壓的成年兒女聽完，是知道怎樣孝敬又怎樣持守，還是只多了一層罪咎？","④ 反過來，用 6:1 的「在主裡」替不孝找理由：「我父母不信主，所以我不必聽他們，也不必奉養」。","6:2 的孝敬沒有附帶「父母信主」的條件；主耶穌責備用「各耳板」逃避奉養父母的人。華人孝道與 6:2 相合的部分，基督徒要做得比不信的人更好。","檢驗標準：你有沒有同時說出「成年兒女可以溫柔地拒絕那一件事」和「仍然要尊敬、照顧、奉養父母」？","⑤ 用 6:4 只對兒女講管教，或把「不打不成器」講成聖經的教訓，替羞辱、比較、失控的打罵辯護。","6:4 對父親說的第一句是「不要惹兒女的氣」；ἐκτρέφετε 是基督保養教會的同一個字。造成傷害的體罰與言語暴力就是兒虐，教會要先保護孩子，必要時通報（紅線二，全卷立場見 ISS00_3）。","檢驗標準：一位從小被打罵長大、現在正在當父母的人聽完，是看見另一條養育的路，還是覺得自己的童年被合理化了？","⑥ 用處境取消原則：「6:5--9 是古代奴隸制，跟今天的職場無關」；或反過來，說「聖經支持奴隸制」，所以整段不可信。","書信三問要走完：處境是第一世紀以弗所的家庭與奴隸；原則是每一組都雙向、頭上同有一位主、主不偏待人；今天落在雇主與員工、主管與下屬、長執與同工上——判斷的理由要說出來（全卷立場見 ISS00_1、ISS00_3）。","檢驗標準：你有沒有具體說出，這一段的原則今天落在會眾的哪一間辦公室、哪一個群組，並且說出判斷的理由？","⑦ 只對下面那一方講道：講兒女要聽從、僕人要聽從，略過 6:4 與 6:9；或只對上面那一方講，煽動員工與老闆、兒女與父母對立。","保羅同時對兩方說話，而且對握有權柄的一方要求更重；只講一半，不是成了壓迫的工具，就是成了鬥爭的口號。兩者都忘了「他們和你們同有一位主在天上」（6:9）。","檢驗標準：台下的老闆和員工、父母和兒女，是不是都聽見了這一章對自己說的話？","⑧ 凡事見鬼：把憂鬱症、焦慮、思覺失調、失眠、孩子叛逆、婚姻衝突都講成邪靈攻擊，叫人只要趕鬼、不必就醫。","魔鬼的詭計是真的，可是把每個問題都講成鬼，會延誤醫療、傷害病人，也讓家屬背上「信心不夠」的重擔。身心困擾要同時尋求醫療與專業協助，並為他禱告，兩者不衝突（紅線三，全卷立場見 ISS00_4）。","檢驗標準：一位正在服藥治療的肢體聽完，是覺得被接納、可以繼續治療，還是覺得自己的病是屬靈失敗？","⑨ 反過來，把屬靈爭戰講成只是比喻或心理學：「執政掌權的只是壞制度、壞習慣，沒有甚麼魔鬼」。","6:11「魔鬼的詭計」、6:16「那惡者一切的火箭」都是真的；把它講成比喻，會眾就看不見爭戰，也不會禱告。本講義的立場是：主要是靈界勢力，也透過人間的結構運作（全卷立場見 ISS00_4）。","檢驗標準：你有沒有同時說出「爭戰是真的」和「勝負已定、不必恐慌」？","⑩ 把全副軍裝講成每天早上的口訣或儀式：「沒有逐件禱告穿上，今天就沒有保護」；或把 6:17 講成拿經文當咒語、念得越多越有力。","六件軍裝是真理、公義、平安的福音、信德、救恩、神的道——是品格與真理，不是護身符；以弗所人燒掉的正是那種靠念誦得力量的法術書（徒 19:19）。把經文當咒語，等於把法術換一個名字帶回教會。","檢驗標準：會眾聽完，是更想背一套禱詞，還是更想在家說真話、在職場行公義、在試探裡相信神的話？","⑪ 用 6:12 叫會眾怕鬼月、風水、廟宇、拜拜的食物，或反過來說求平安符、擇日、看風水「只是文化，沒關係」。","在基督裡的人不在黑暗權勢底下，不必怕；但也不拜、不求、不戴護身符、不擇日，因為那是把信靠交給別的力量。製造迷信式的恐懼，正違反了本章的果效：平安，不是恐慌（全卷立場見 ISS00_4）。","檢驗標準：一位家裡長輩仍在拜拜的新信徒聽完，是更平安、也知道怎樣尊重家人，還是更害怕或被放任？","⑫ 把 6:12「不是與屬血氣的爭戰」講成可以把配偶、同工、異議者妖魔化：「他是被魔鬼利用的」「這是屬靈攻擊」。","這一節的意思正好相反：人不是你的敵人；把人當成敵人，正中了魔鬼的詭計。用「屬靈攻擊」標籤一個提出批評的人，會讓教會失去說誠實話的空間（4:15）。","檢驗標準：會眾聽完，是更會給人貼「被鬼利用」的標籤，還是更願意為傷害自己的人禱告？","⑬ 把 6:18「靠著聖靈」講成專指方言禱告，暗示不說方言的人禱告沒有力量；或把 6:18 講成要禱告得越久越長才算數。","ἐν πνεύματι 在本卷多次出現，範圍比方言寬，包括一切靠聖靈的禱告（方言回指哥林多前書立場三）；「隨時多方」講的是不間斷、為眾聖徒，不是時數的比賽。","檢驗標準：一位不說方言、每天只能擠出五分鐘禱告的上班族聽完，是更想禱告，還是覺得自己被排除在外？","⑭ 用 6:24 與啟 2:4 恐嚇會眾：「你們已經離棄起初的愛心了，主要把燈臺挪去」，或把「誠心愛主」講成要量自己的熱度。","6:24 是一句祝福，不是一份評分表；啟示錄沒有引用以弗所書，兩者並讀是「這使我們想起」。不朽壞的愛，根源是主不朽壞的愛，我們的愛是回應，不是靠自己守住的成績。","檢驗標準：會眾聽完，是更想回到主的愛裡，還是更焦慮自己愛得夠不夠熱？","⑮ 把這一章講成 321 的插圖：先講「得勝者」與「235」，再拿全副軍裝和推基古來印證，或把軍裝排成團契的七堂課。","次序是經文先講：雙向的家規、勝負已定、站立與禱告、不朽壞的愛，然後 321 才在末端接上；「得勝的定義是站住」是從 6:13 長出來的，不是拿 6:13 去證明一套術語（鐵律五）。","檢驗標準：會眾聽完，記住的是一套團契的術語，還是那位叫我們靠著他站住、並且愛他的主？"]}],"txt":{"1":["奉神旨意，作基督耶穌使徒的保羅，寫信給在以弗所的聖徒，就是在基督耶穌裡有忠心的人。","願恩惠、平安從神我們的父和主耶穌基督歸與你們！","願頌讚歸與我們主耶穌基督的父神！他在基督裡曾賜給我們天上各樣屬靈的福氣：","就如神從創立世界以前，在基督裡揀選了我們，使我們在他面前成為聖潔，無有瑕疵；","又因愛我們，就按著自己的意旨所喜悅的，預定我們藉著耶穌基督得兒子的名分，","使他榮耀的恩典得著稱讚；這恩典是他在愛子裡所賜給我們的。","我們藉這愛子的血得蒙救贖，過犯得以赦免，乃是照他豐富的恩典。","這恩典是神用諸般智慧聰明，充充足足賞給我們的；","都是照他自己所預定的美意，叫我們知道他旨意的奧祕，","要照所安排的，在日期滿足的時候，使天上、地上、一切所有的都在基督裡面同歸於一。","我們也在他裡面得了基業；這原是那位隨己意行、做萬事的，照著他旨意所預定的，","叫他的榮耀從我們這首先在基督裡有盼望的人可以得著稱讚。","你們既聽見真理的道，就是那叫你們得救的福音，也信了基督，既然信他，就受了所應許的聖靈為印記。","這聖靈是我們得基業的憑據，直等到神之民被贖，使他的榮耀得著稱讚。","因此，我既聽見你們信從主耶穌，親愛眾聖徒，","就為你們不住地感謝神。禱告的時候，常提到你們，","求我們主耶穌基督的神，榮耀的父，將那賜人智慧和啟示的靈賞給你們，使你們真知道他，","並且照明你們心中的眼睛，使你們知道他的恩召有何等指望，他在聖徒中得的基業有何等豐盛的榮耀；","並知道他向我們這信的人所顯的能力是何等浩大，","就是照他在基督身上所運行的大能大力，使他從死裡復活，叫他在天上坐在自己的右邊，","遠超過一切執政的、掌權的、有能的、主治的，和一切有名的；不但是今世的，連來世的也都超過了。","又將萬有服在他的腳下，使他為教會作萬有之首。","教會是他的身體，是那充滿萬有者所充滿的。"],"2":["你們死在過犯罪惡之中，他叫你們活過來。","那時，你們在其中行事為人，隨從今世的風俗，順服空中掌權者的首領，就是現今在悖逆之子心中運行的邪靈。","我們從前也都在他們中間，放縱肉體的私慾，隨著肉體和心中所喜好的去行，本為可怒之子，和別人一樣。","然而，神既有豐富的憐憫，因他愛我們的大愛，","當我們死在過犯中的時候，便叫我們與基督一同活過來。你們得救是本乎恩。","他又叫我們與基督耶穌一同復活，一同坐在天上，","要將他極豐富的恩典，就是他在基督耶穌裡向我們所施的恩慈，顯明給後來的世代看。","你們得救是本乎恩，也因著信；這並不是出於自己，乃是神所賜的；","也不是出於行為，免得有人自誇。","我們原是他的工作，在基督耶穌裡造成的，為要叫我們行善，就是神所預備叫我們行的。","所以你們應當記念：你們從前按肉體是外邦人，是稱為沒受割禮的；這名原是那些憑人手在肉身上稱為受割禮之人所起的。","那時，你們與基督無關，在以色列國民以外，在所應許的諸約上是局外人，並且活在世上沒有指望，沒有神。","你們從前遠離神的人，如今卻在基督耶穌裡，靠著他的血，已經得親近了。","因他使我們和睦，將兩下合而為一，拆毀了中間隔斷的牆；","而且以自己的身體廢掉冤仇，就是那記在律法上的規條，為要將兩下藉著自己造成一個新人，如此便成就了和睦。","既在十字架上滅了冤仇，便藉這十字架使兩下歸為一體，與神和好了，","並且來傳和平的福音給你們遠處的人，也給那近處的人。","因為我們兩下藉著他被一個聖靈所感，得以進到父面前。","這樣，你們不再作外人和客旅，是與聖徒同國，是神家裡的人了；","並且被建造在使徒和先知的根基上，有基督耶穌自己為房角石，","各房靠他聯絡得合式，漸漸成為主的聖殿。","你們也靠他同被建造，成為神藉著聖靈居住的所在。"],"3":["因此，我－保羅為你們外邦人作了基督耶穌被囚的，替你們祈禱。","諒必你們曾聽見神賜恩給我，將關切你們的職分託付我，","用啟示使我知道福音的奧祕，正如我以前略略寫過的。","你們念了，就能曉得我深知基督的奧祕。","這奧祕在以前的世代沒有叫人知道，像如今藉著聖靈啟示他的聖使徒和先知一樣。","這奧祕就是外邦人在基督耶穌裡，藉著福音，得以同為後嗣，同為一體，同蒙應許。","我作了這福音的執事，是照神的恩賜，這恩賜是照他運行的大能賜給我的。","我本來比眾聖徒中最小的還小，然而他還賜我這恩典，叫我把基督那測不透的豐富傳給外邦人，","又使眾人都明白，這歷代以來隱藏在創造萬物之神裡的奧祕是如何安排的，","為要藉著教會使天上執政的、掌權的，現在得知神百般的智慧。","這是照神從萬世以前，在我們主基督耶穌裡所定的旨意。","我們因信耶穌，就在他裡面放膽無懼，篤信不疑地來到神面前。","所以，我求你們不要因我為你們所受的患難喪膽，這原是你們的榮耀。","因此，我在父面前屈膝，（","天上地上的各家，都是從他得名。）","求他按著他豐盛的榮耀，藉著他的靈，叫你們心裡的力量剛強起來，","使基督因你們的信，住在你們心裡，叫你們的愛心有根有基，","能以和眾聖徒一同明白基督的愛是何等長闊高深，","並知道這愛是過於人所能測度的，便叫神一切所充滿的，充滿了你們。","神能照著運行在我們心裡的大力充充足足地成就一切，超過我們所求所想的。","但願他在教會中，並在基督耶穌裡，得著榮耀，直到世世代代，永永遠遠。阿們！"],"4":["我為主被囚的勸你們：既然蒙召，行事為人就當與蒙召的恩相稱。","凡事謙虛、溫柔、忍耐，用愛心互相寬容，","用和平彼此聯絡，竭力保守聖靈所賜合而為一的心。","身體只有一個，聖靈只有一個，正如你們蒙召同有一個指望。","一主，一信，一洗，","一神，就是眾人的父，超乎眾人之上，貫乎眾人之中，也住在眾人之內。","我們各人蒙恩，都是照基督所量給各人的恩賜。","所以經上說：他升上高天的時候，擄掠了仇敵，將各樣的恩賜賞給人。（","既說升上，豈不是先降在地下嗎？","那降下的，就是遠升諸天之上要充滿萬有的。）","他所賜的，有使徒，有先知，有傳福音的，有牧師和教師，","為要成全聖徒，各盡其職，建立基督的身體，","直等到我們眾人在真道上同歸於一，認識神的兒子，得以長大成人，滿有基督長成的身量，","使我們不再作小孩子，中了人的詭計和欺騙的法術，被一切異教之風搖動，飄來飄去，就隨從各樣的異端；","惟用愛心說誠實話，凡事長進，連於元首基督，","全身都靠他聯絡得合式，百節各按各職，照著各體的功用彼此相助，便叫身體漸漸增長，在愛中建立自己。","所以我說，且在主裡確實地說，你們行事不要再像外邦人存虛妄的心行事。","他們心地昏昧，與神所賜的生命隔絕了，都因自己無知，心裡剛硬；","良心既然喪盡，就放縱私慾，貪行種種的污穢。","你們學了基督，卻不是這樣。","如果你們聽過他的道，領了他的教，學了他的真理，","就要脫去你們從前行為上的舊人，這舊人是因私慾的迷惑漸漸變壞的；","又要將你們的心志改換一新，","並且穿上新人；這新人是照著神的形像造的，有真理的仁義和聖潔。","所以，你們要棄絕謊言，各人與鄰舍說實話，因為我們是互相為肢體。","生氣卻不要犯罪；不可含怒到日落，","也不可給魔鬼留地步。","從前偷竊的，不要再偷；總要勞力，親手做正經事，就可有餘分給那缺少的人。","污穢的言語一句不可出口，只要隨事說造就人的好話，叫聽見的人得益處。","不要叫神的聖靈擔憂；你們原是受了他的印記，等候得贖的日子來到。","一切苦毒、惱恨、忿怒、嚷鬧、毀謗，並一切的惡毒，都當從你們中間除掉；","並要以恩慈相待，存憐憫的心，彼此饒恕，正如神在基督裡饒恕了你們一樣。"],"5":["所以，你們該效法神，好像蒙慈愛的兒女一樣。","也要憑愛心行事，正如基督愛我們，為我們捨了自己，當作馨香的供物和祭物，獻與神。","至於淫亂並一切污穢，或是貪婪，在你們中間連提都不可，方合聖徒的體統。","淫詞、妄語，和戲笑的話都不相宜；總要說感謝的話。","因為你們確實地知道，無論是淫亂的，是污穢的，是有貪心的，在基督和神的國裡都是無分的。有貪心的，就與拜偶像的一樣。","不要被人虛浮的話欺哄；因這些事，神的忿怒必臨到那悖逆之子。","所以，你們不要與他們同夥。","從前你們是暗昧的，但如今在主裡面是光明的，行事為人就當像光明的子女。","光明所結的果子就是一切良善、公義、誠實。","總要察驗何為主所喜悅的事。","那暗昧無益的事，不要與人同行，倒要責備行這事的人；","因為他們暗中所行的，就是提起來也是可恥的。","凡事受了責備，就被光顯明出來，因為一切能顯明的就是光。","所以主說：你這睡著的人當醒過來，從死裡復活！基督就要光照你了。","你們要謹慎行事，不要像愚昧人，當像智慧人。","要愛惜光陰，因為現今的世代邪惡。","不要作糊塗人，要明白主的旨意如何。","不要醉酒，酒能使人放蕩；乃要被聖靈充滿。","當用詩章、頌詞、靈歌彼此對說，口唱心和地讚美主。","凡事要奉我們主耶穌基督的名常常感謝父神。","又當存敬畏基督的心，彼此順服。","你們作妻子的，當順服自己的丈夫，如同順服主。","因為丈夫是妻子的頭，如同基督是教會的頭；他又是教會全體的救主。","教會怎樣順服基督，妻子也要怎樣凡事順服丈夫。","你們作丈夫的，要愛你們的妻子，正如基督愛教會，為教會捨己。","要用水藉著道把教會洗淨，成為聖潔，","可以獻給自己，作個榮耀的教會，毫無玷污、皺紋等類的病，乃是聖潔沒有瑕疵的。","丈夫也當照樣愛妻子，如同愛自己的身子；愛妻子便是愛自己了。","從來沒有人恨惡自己的身子，總是保養顧惜，正像基督待教會一樣，","因我們是他身上的肢體。","為這個緣故，人要離開父母，與妻子連合，二人成為一體。","這是極大的奧祕，但我是指著基督和教會說的。","然而，你們各人都當愛妻子，如同愛自己一樣。妻子也當敬重她的丈夫。"],"6":["你們作兒女的，要在主裡聽從父母，這是理所當然的。","「要孝敬父母，使你得福，在世長壽。」這是第一條帶應許的誡命。","〔和合本與上節合譯，見 6:2〕","你們作父親的，不要惹兒女的氣，只要照著主的教訓和警戒養育他們。","你們作僕人的，要懼怕戰兢，用誠實的心聽從你們肉身的主人，好像聽從基督一般。","不要只在眼前事奉，像是討人喜歡的，要像基督的僕人，從心裡遵行神的旨意。","甘心事奉，好像服事主，不像服事人。","因為曉得各人所行的善事，不論是為奴的，是自主的，都必按所行的得主的賞賜。","你們作主人的，待僕人也是一理，不要威嚇他們。因為知道，他們和你們同有一位主在天上；他並不偏待人。","我還有末了的話：你們要靠著主，倚賴他的大能大力作剛強的人。","要穿戴神所賜的全副軍裝，就能抵擋魔鬼的詭計。","因我們並不是與屬血氣的爭戰，乃是與那些執政的、掌權的、管轄這幽暗世界的，以及天空屬靈氣的惡魔爭戰。","所以，要拿起神所賜的全副軍裝，好在磨難的日子抵擋仇敵，並且成就了一切，還能站立得住。","所以要站穩了，用真理當作帶子束腰，用公義當作護心鏡遮胸，","又用平安的福音當作預備走路的鞋穿在腳上。","此外，又拿著信德當作盾牌，可以滅盡那惡者一切的火箭；","並戴上救恩的頭盔，拿著聖靈的寶劍，就是神的道；","靠著聖靈，隨時多方禱告祈求；並要在此警醒不倦，為眾聖徒祈求，","也為我祈求，使我得著口才，能以放膽開口講明福音的奧祕，","（我為這福音的奧祕作了帶鎖鍊的使者，）並使我照著當盡的本分放膽講論。","今有所親愛、忠心事奉主的兄弟推基古，他要把我的事情，並我的景況如何全告訴你們，叫你們知道。","我特意打發他到你們那裡去，好叫你們知道我們的光景，又叫他安慰你們的心。","願平安、仁愛、信心從父神和主耶穌基督歸與弟兄們！","並願所有誠心愛我們主耶穌基督的人都蒙恩惠！"]},"blk":{"1":[{"a":1,"z":1,"star":2,"grk":"<p lang=\"grc\">Παῦλος ἀπόστολος Χριστοῦ Ἰησοῦ διὰ θελήματος θεοῦ τοῖς ἁγίοις τοῖς οὖσιν ἐν Ἐφέσῳ καὶ πιστοῖς ἐν Χριστῷ Ἰησοῦ·</p>","lit":"<p>保羅，基督耶穌的使徒，藉著神的旨意，給那些在以弗所的聖徒，也就是在基督耶穌裡忠信的人：</p>","key":"<table><tr><th>原文</th><th>音譯</th><th>字面</th><th>在這裡</th></tr><tr><td>ἀπόστολος Χριστοῦ Ἰησοῦ</td><td>apostolos Christou Iēsou</td><td>基督耶穌的使徒</td><td>被差的人，屬於差他的那一位</td></tr><tr><td>διὰ θελήματος θεοῦ</td><td>dia thelēmatos theou</td><td>藉著神的旨意</td><td>不是自薦，是被神的旨意放上去</td></tr><tr><td>τοῖς ἁγίοις τοῖς οὖσιν</td><td>tois hagiois tois ousin</td><td>給那些是聖徒的</td><td>「聖徒」是身分，不是成績</td></tr><tr><td>[ἐν Ἐφέσῳ]</td><td>en Ephesō</td><td>在以弗所</td><td>SBLGNT 加方括號：最早的抄本沒有</td></tr><tr><td>καὶ πιστοῖς ἐν Χριστῷ Ἰησοῦ</td><td>kai pistois en Christō Iēsou</td><td>也是在基督耶穌裡忠信的</td><td>全卷第一個「在基督裡」</td></tr></table>","gram":"<p><strong>1:1 有一個古卷問題：「在以弗所」三份最早的抄本沒有。</strong></p><p>SBLGNT 把 ἐν Ἐφέσῳ（en Ephesō） 放在方括號裡，表示編者對這兩個字有保留。理由很具體：現存最早的保羅書信抄本 P46（約主後 200 年），以及四世紀的西乃抄本、梵諦岡抄本，原文都沒有這兩個字（後兩者是後來的手在旁邊補上）；第三世紀的俄利根讀的經文也沒有，他只好把 τοῖς ἁγίοις τοῖς οὖσιν（tois hagiois tois ousin） 解成「給那些『是』的聖徒」。另一方面，其餘幾乎所有的抄本與古譯本都有「在以弗所」，二世紀以來的教父也一致稱它為「致以弗所人書」。</p><p>兩種讀法各有學者。<strong>一說原本就有「在以弗所」</strong>：句子少了地名，τοῖς οὖσιν（tois ousin） 懸空，文法很彆扭。<strong>一說這是一封傳閱信</strong>：原件留空或不寫地名，由送信人推基古（6:21）帶著在亞細亞各城宣讀，以弗所是首府，最後抄本以它定名。支持傳閱信說的還有內證：保羅在以弗所住了將近三年（徒 20:31），信裡卻沒有一句個人問安，還說「我既聽見你們信從主耶穌」（1:15）的口氣，像是寫給一些他沒見過面的人；西 4:16 提到「從老底嘉來的書信」，有學者認為就是這一封。</p><blockquote><p>本講義的判斷：照和合本「在以弗所」解經；同時接受傳閱信說是最能解釋古卷與內證的看法——這封信先到以弗所，也到亞細亞眾教會。講台上只講一句：<strong>這是寫給每一間教會的信</strong>。另外，πιστοῖς（pistois） 可以譯「忠心的」，也可以譯「相信的」；καὶ（kai） 很可能是解說，「聖徒」就是「在基督耶穌裡忠信的人」，一群人，兩個名字。</p></blockquote>","exp":"<p>〔背景〕徒 19:1--10（使徒行傳講義第 19 章）</p><p>使徒行傳講義第 19 章講過保羅在以弗所的日子：先在會堂講了三個月，被毀謗，就轉到推喇奴的學房天天辯論，「這樣有兩年之久，叫一切住在亞細亞的，無論是猶太人，是希臘人，都聽見主的道」（徒 19:10）。以弗所是亞細亞的首府，港口、大道、亞底米神廟都在這裡。一個人在學房裡講了兩年，整個省份都聽見了。這封信很可能就是沿著同樣的路傳下去的：從以弗所出發，一城一城被宣讀。</p><p>保羅一開口先交代自己是誰：「奉神旨意，作基督耶穌使徒的保羅」（1:1）。他沒有說自己多會講、走過多少地方；他的權柄只有一個來源，神的旨意。寫這封信時他正坐在羅馬的監獄裡（3:1；4:1），是「帶鎖鍊的使者」（6:20）。鎖鍊沒有改變他的身分，因為身分不是羅馬給的。</p><p>收信人的名字也值得慢讀：他們是「聖徒」，又是「在基督耶穌裡有忠心的人」（1:1）。聖徒不是一群特別成熟的人，是被神分別出來、歸給神的人；這個身分寫在信的第一行，比任何命令都早。以弗所書的次序從這裡就定了：先說你是誰，後說你要怎麼活。</p><p>古卷的問題反倒替今天的讀者開了一扇門。不論原件有沒有寫「在以弗所」，它都在亞細亞各城被讀過；今天的以弗所，就是每一座有廟、有算命攤、有族群分隔的城市。你的城市，可以填進那個空白。這封信寫給以弗所，也寫給你所在的那一間教會。</p>"},{"a":2,"z":2,"star":1,"grk":"<p lang=\"grc\">χάρις ὑμῖν καὶ εἰρήνη ἀπὸ θεοῦ πατρὸς ἡμῶν καὶ κυρίου Ἰησοῦ Χριστοῦ.</p>","lit":"<p>恩典給你們，並平安，從神我們的父和主耶穌基督。</p>","key":"","gram":"<p><strong>χάρις ὑμῖν καὶ εἰρήνη（charis hymin kai eirēnē） 是保羅改寫過的問安。</strong></p><p>希臘書信的慣例是一個字 χαίρειν（chairein），「問好」；保羅換成發音相近的 χάρις（charis），恩典。猶太人的問安是「平安」（shalom），保羅也收進來，成了 εἰρήνη（eirēnē）。一個問候裡，希臘世界和猶太世界並排坐著——這正是第 2 章要講的事：兩下合而為一。ἀπὸ θεοῦ πατρὸς ἡμῶν καὶ κυρίου Ἰησοῦ Χριστοῦ（apo theou patros hēmōn kai kyriou Iēsou Christou） 用一個介系詞 ἀπὸ（apo） 管兩位：恩惠平安的源頭，父與子同列，這是一句沒有展開的基督論。εἰρήνη（eirēnē） 是本卷關鍵字追蹤的第一站，在 2:14 會變成「他使我們和睦」，在 6:15 成為軍裝裡的鞋。</p>","exp":"<p>「願恩惠、平安從神我們的父和主耶穌基督歸與你們」（1:2）。這句話保羅每封信都寫，讀的人很容易一眼掃過。可是在以弗所書，它不是客套，是全卷的兩條根。</p><p>恩惠在前，平安在後，次序不能倒。人常想先有平安——環境順了、關係好了、心裡安了——再來感謝恩典。保羅的次序相反：先有神白白的恩典，才有與神、與人的和好。第 2 章會把這兩個字拉開來講：「你們得救是本乎恩，也因著信」（2:8）；接著是那道被拆毀的牆，基督「使我們和睦」。恩典解決人與神之間的問題，平安解決人與人之間的牆。</p><p>這兩樣東西有一個共同的來源：「從神我們的父和主耶穌基督」。它不是從一個安定的環境來的，也不是從一個好脾氣來的。保羅寫這句話時人在監牢，卻把平安送給在亞細亞的人；可見平安不是他擁有的條件，是他經手的禮物。</p><p>一封要談揀選、救贖、合一、屬靈爭戰的信，第一句祝福就是恩惠與平安。最深的道理，從一個問安開始。</p>"},{"a":3,"z":3,"star":3,"grk":"<p lang=\"grc\">Εὐλογητὸς ὁ θεὸς καὶ πατὴρ τοῦ κυρίου ἡμῶν Ἰησοῦ Χριστοῦ, ὁ εὐλογήσας ἡμᾶς ἐν πάσῃ εὐλογίᾳ πνευματικῇ ἐν τοῖς ἐπουρανίοις ἐν Χριστῷ,</p>","lit":"<p>當受頌讚的是神，就是我們主耶穌基督的父，那位已經在天上的領域、在基督裡，用各樣屬靈的祝福祝福了我們的，</p>","key":"<table><tr><th>原文</th><th>音譯</th><th>字面</th><th>在這裡</th></tr><tr><td>Εὐλογητὸς</td><td>Eulogētos</td><td>當受頌讚的</td><td>句首無動詞，像詩篇的開頭</td></tr><tr><td>ὁ εὐλογήσας ἡμᾶς</td><td>ho eulogēsas hēmas</td><td>那祝福了我們的</td><td>不定過去式：已經給了</td></tr><tr><td>ἐν πάσῃ εὐλογίᾳ πνευματικῇ</td><td>en pasē eulogia pneumatikē</td><td>用各樣屬靈的祝福</td><td>同字根三次：頌讚、祝福、福氣</td></tr><tr><td>ἐν τοῖς ἐπουρανίοις</td><td>en tois epouraniois</td><td>在天上的領域</td><td>全卷五次（1:3、20；2:6；3:10；6:12）</td></tr><tr><td>ἐν Χριστῷ</td><td>en Christō</td><td>在基督裡</td><td>1:3--14 這個片語一再出現</td></tr></table>","gram":"<p><strong>1:3--14 在原文是一句話，兩百零二個字，是全本新約最長的句子之一。</strong>這一段的 gram 先把整句的骨架畫出來。</p><p>句子以 Εὐλογητὸς（Eulogētos） 起頭，沒有動詞，是猶太人禱告「願頌讚歸於……」的格式。接著三個「同字根」連在一起：神是「當受頌讚的」、他是 ὁ εὐλογήσας ἡμᾶς（ho eulogēsas hēmas）「那祝福了我們的」、用的是 ἐν πάσῃ εὐλογίᾳ πνευματικῇ（en pasē eulogia pneumatikē）「各樣屬靈的祝福」。我們頌讚他，因為他先祝福了我們。</p><p>整句的主幹分三層，按三一神的次序：</p><blockquote><p><strong>父揀選</strong>（1:3--6）：καθὼς ἐξελέξατο（kathōs exelexato）、προορίσας（proorisas）……收在 εἰς ἔπαινον δόξης τῆς χάριτος αὐτοῦ（1:6）<br><strong>子救贖</strong>（1:7--12）：ἐν ᾧ ἔχομεν τὴν ἀπολύτρωσιν（en hō echomen tēn apolytrōsin）……收在 εἰς ἔπαινον δόξης（1:12）<br><strong>靈印記</strong>（1:13--14）：ἐσφραγίσθητε τῷ πνεύματι τῆς ἐπαγγελίας τῷ ἁγίῳ（esphragisthēte tō pneumati tēs epangelias tō hagiō）……收在 εἰς ἔπαινον τῆς δόξης αὐτοῦ（1:14）</p></blockquote><p>三次 εἰς ἔπαινον（eis epainon） 像三次副歌，把每一層都帶回同一個終點：神的榮耀。中間串連的是 ἐν Χριστῷ（en Christō）、ἐν αὐτῷ（en autō）、ἐν ᾧ（en hō）——十多次「在基督裡」「在他裡面」。保羅不是在列清單，他是在一口氣裡唱完。分詞、關係子句、介系詞片語一個接一個，句子停不下來，因為讚美停不下來。</p><p>ὁ εὐλογήσας（ho eulogēsas） 是不定過去式：福氣已經給了，不是正在申請。ἐν τοῖς ἐπουρανίοις（en tois epouraniois） 是本卷特有的片語，1:20 基督坐在那裡，2:6 我們與他同坐在那裡，3:10 與 6:12 的執政掌權者也在那裡——天上的領域是寶座所在，也是爭戰所在。</p>","exp":"<p>以弗所書不是從問題開始的。哥林多前書一開口就要處理分黨，加拉太書一開口就說「希奇」；以弗所書卻先唱了一首兩百多字的歌。沒有人要辯論，沒有亂子要收拾，保羅只是把神已經做的事數一遍。</p><p>「願頌讚歸與我們主耶穌基督的父神！他在基督裡曾賜給我們天上各樣屬靈的福氣」（1:3）。這一節有三個要點。第一，福氣是「曾賜給」的，已經在帳上，不是吊在前面的胡蘿蔔。第二，福氣是「各樣」的——不是缺了某一樣，要靠別的方法補。第三，福氣是「在基督裡」的：不是神把一包禮物丟給我們，是把我們放進基督裡面，祂有的，我們就有。</p><p>「屬靈的福氣」不是說它不真實，是說它出於聖靈、屬於天上那個領域。今世的福氣可以被搶走；這裡的福氣被存放在基督坐著的地方，保羅坐牢也拿不走。</p><p>這一節是全卷「坐」的起點。前三章幾乎沒有命令句，全是神做的事；到 4:1 才說「行事為人就當與蒙召的恩相稱」（4:1）。基督徒的一生不是從「我要努力得福」開始，是從「我已經被祝福」開始。很多人信主多年，還在用乞丐的姿勢禱告；以弗所書第一句話就把帳本攤開：你已經是富足的，只是還沒看見。所以保羅在本章末了才會禱告，求神照明他們「心中的眼睛」（1:18）。</p><p>頌讚是對這一切最自然的反應。人不是先頌讚才得福，是看見福氣才頌讚。321 說「讓耶穌得著一切的榮耀」，這句長長的頌讚三次落在同一個終點，就是答案：數算恩典的人，榮耀自然歸給神。</p>"},{"a":4,"z":4,"star":3,"grk":"<p lang=\"grc\">καθὼς ἐξελέξατο ἡμᾶς ἐν αὐτῷ πρὸ καταβολῆς κόσμου, εἶναι ἡμᾶς ἁγίους καὶ ἀμώμους κατενώπιον αὐτοῦ ἐν ἀγάπῃ,</p>","lit":"<p>正如他在他裡面揀選了我們，在世界的奠基以前，要我們在他面前成為聖潔、沒有瑕疵，在愛裡，</p>","key":"<table><tr><th>原文</th><th>音譯</th><th>字面</th><th>在這裡</th></tr><tr><td>καθὼς ἐξελέξατο ἡμᾶς</td><td>kathōs exelexato hēmas</td><td>正如他揀選了我們</td><td>關身語態：為自己揀選</td></tr><tr><td>ἐν αὐτῷ</td><td>en autō</td><td>在他裡面</td><td>揀選的所在：基督</td></tr><tr><td>πρὸ καταβολῆς κόσμου</td><td>pro katabolēs kosmou</td><td>在世界奠基以前</td><td>揀選比人的一切表現都早</td></tr><tr><td>ἁγίους καὶ ἀμώμους</td><td>hagious kai amōmous</td><td>聖潔且沒有瑕疵</td><td>祭物的用語：可以獻給神</td></tr><tr><td>ἐν ἀγάπῃ</td><td>en agapē</td><td>在愛裡</td><td>可連上句，也可連下句</td></tr></table>","gram":"<p>καθὼς（kathōs） 把 1:3 的福氣展開：第一樣福氣是揀選。ἐξελέξατο（exelexato） 是關身語態，帶著「為自己」的意味——神揀選我們歸他自己。時間是 πρὸ καταβολῆς κόσμου（pro katabolēs kosmou），「在世界奠基以前」，在任何人做出任何事以前。所在是 ἐν αὐτῷ（en autō），在基督裡。目的是不定詞 εἶναι ἡμᾶς ἁγίους καὶ ἀμώμους（einai hēmas hagious kai amōmous）：揀選的目的不是一張名單，是一群聖潔的人。ἀμώμους（amōmous） 在七十士譯本常指沒有殘疾的祭牲，5:27 又用在被基督洗淨的教會身上。</p><p>句末的 ἐν ἀγάπῃ（en agapē） 該連哪裡，有兩種讀法。<strong>一說連上句</strong>：「在他面前聖潔無瑕，在愛裡」，愛是聖潔的內容（和合本的標點近此）。<strong>一說連下句</strong>：「在愛裡，預定我們……」，愛是預定的動機（多數近代譯本與 SBLGNT 的標點都把逗號放在 ἐν ἀγάπῃ（en agapē） 之後、1:5 之前，和合本則把「又因愛我們」譯進 1:5）。本講義跟和合本讀成「又因愛我們」（1:5），兩說都不改變一件事：揀選被包在愛裡面。</p>","exp":"<p>「就如神從創立世界以前，在基督裡揀選了我們，使我們在他面前成為聖潔，無有瑕疵」（1:4）。這一節進入一個兩千年的討論：揀選與預定。本講義先讓經文自己說四件事，再陳列各家。</p><p>第一，<strong>揀選是在基督裡</strong>。神不是在基督以外翻一本名冊，是在基督裡揀選。要問「我在不在裡面」，答案不在名冊上，在基督身上。第二，<strong>揀選的動機是愛</strong>——下一節說「又因愛我們」（1:5）。這不是冷冰冰的命定，是一位父親的心意。第三，<strong>揀選的目的是聖潔</strong>。神揀選人，不是讓人放心地隨便活，是要人「在他面前成為聖潔，無有瑕疵」。第四，<strong>揀選沒有取消人的回應</strong>：同一句話走到 1:13 就說「你們既聽見真理的道……也信了基督」（1:13）。</p><p>各家怎樣讀？加爾文派說，神照自己的旨意無條件地揀選個人；阿米念派與衛斯理宗說，神預知誰會相信而揀選；群體揀選說則指出，這裡的「我們」是複數，神揀選的是「在基督裡」的群體，個人藉著信進入這個群體。這是敬虔的人爭了兩千年的題目，本講義不替讀者決定，全卷立場見 ISS00_2。</p><p>但各家都同意一件事：人得救全是恩典。「創立世界以前」的意思是，神愛你，比你做對任何事都早，也比你做錯任何事都早。所以揀選是安慰，不是恐嚇。我們絕不對任何人說「你可能沒有被揀選」——那是誤讀這一節；保羅寫這句話是為了讓已經相信的人放心，不是讓還沒有相信的人絕望。想知道自己有沒有被揀選，不是去猜一張名單，是來到基督面前；主自己說過：「到我這裡來的，我總不丟棄他」（約 6:37）。</p>"},{"a":5,"z":6,"star":2,"grk":"<p lang=\"grc\">προορίσας ἡμᾶς εἰς υἱοθεσίαν διὰ Ἰησοῦ Χριστοῦ εἰς αὐτόν, κατὰ τὴν εὐδοκίαν τοῦ θελήματος αὐτοῦ,</p><p lang=\"grc\">εἰς ἔπαινον δόξης τῆς χάριτος αὐτοῦ ἧς ἐχαρίτωσεν ἡμᾶς ἐν τῷ ἠγαπημένῳ,</p>","lit":"<p>預先定下了我們，進入兒子的名分，藉著耶穌基督歸於他自己，照著他旨意的美意，</p><p>歸於他恩典之榮耀的稱讚，就是他在那蒙愛者裡所恩待我們的恩典；</p>","key":"<table><tr><th>原文</th><th>音譯</th><th>字面</th><th>在這裡</th></tr><tr><td>προορίσας</td><td>proorisas</td><td>預先定下</td><td>字根是「劃定邊界」：把終點先畫好</td></tr><tr><td>εἰς υἱοθεσίαν</td><td>eis huiothesian</td><td>進入兒子的名分</td><td>羅馬法的收養用語</td></tr><tr><td>κατὰ τὴν εὐδοκίαν τοῦ θελήματος αὐτοῦ</td><td>kata tēn eudokian tou thelēmatos autou</td><td>照著他旨意的美意</td><td>神樂意這樣做</td></tr><tr><td>ἐχαρίτωσεν</td><td>echaritōsen</td><td>恩待了</td><td>與「恩典」同字根，全本新約只有兩次</td></tr><tr><td>ἐν τῷ ἠγαπημένῳ</td><td>en tō ēgapēmenō</td><td>在那蒙愛者裡</td><td>完成式分詞：一直被愛的那一位</td></tr></table>","gram":"<p>προορίσας（proorisas） 是不定過去式分詞，說明 ἐξελέξατο（exelexato） 的方式。字根 ὁρίζω（horizō） 是「劃界、定界」，加上 πρὸ（pro），是「預先畫好界線」。這裡預定的「內容」不是誰得救、誰滅亡，而是 εἰς υἱοθεσίαν（eis huiothesian）——成為兒子。υἱοθεσία（huiothesia） 是希臘羅馬世界的收養用語：被收養的人得到新的姓氏、新的產業權，舊債一筆勾銷。全本新約只有保羅用這個字（羅 8:15；加 4:5；弗 1:5）。</p><p>1:6 εἰς ἔπαινον δόξης τῆς χάριτος αὐτοῦ（eis epainon doxēs tēs charitos autou） 是第一次副歌。ἐχαρίτωσεν（echaritōsen） 與 χάρις（charis） 同字根，直譯是「他把恩典恩待給我們」，像中文的「恩上加恩」。ἐν τῷ ἠγαπημένῳ（en tō ēgapēmenō） 是完成式被動分詞，「那位已被愛、一直被愛的」，就是基督；這使我們想起受洗時天上的聲音：「這是我的愛子，我所喜悅的」（太 3:17）。和合本把它譯成「愛子」，又在 1:7 開頭重複「藉這愛子」，把兩節接起來。</p>","exp":"<p>「又因愛我們，就按著自己的意旨所喜悅的，預定我們藉著耶穌基督得兒子的名分」（1:5）。預定這個詞嚇過很多人，可是保羅寫它的時候，重點落在終點：神預先定下的，是要我們作他的兒女。</p
