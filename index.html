ὶ διὰ πάντων καὶ ἐν πᾶσιν</p>","lit":"<p>一個身體和一個靈，正如你們也是在你們呼召的一個盼望中被召的；</p><p>一位主，一個信，一個洗；</p><p>一位神，也是眾人的父，那在眾人之上、貫穿眾人、也在眾人之內的。</p>","key":"<table><tr><th>原文</th><th>音譯</th><th>字面</th><th>在這裡</th></tr><tr><td>ἓν σῶμα</td><td>hen sōma</td><td>一個身體</td><td>中性的「一」</td></tr><tr><td>ἓν πνεῦμα</td><td>hen pneuma</td><td>一個靈</td><td>聖靈；與身體並列</td></tr><tr><td>ἐν μιᾷ ἐλπίδι</td><td>en mia elpidi</td><td>在一個盼望裡</td><td>陰性的「一」</td></tr><tr><td>εἷς κύριος</td><td>heis kyrios</td><td>一位主</td><td>陽性的「一」；初期教會的認信</td></tr><tr><td>μία πίστις</td><td>mia pistis</td><td>一個信</td><td>所信的內容，也是信的行動</td></tr><tr><td>ἓν βάπτισμα</td><td>hen baptisma</td><td>一個洗</td><td>歸入基督的洗</td></tr><tr><td>εἷς θεὸς καὶ πατὴρ πάντων</td><td>heis theos kai patēr pantōn</td><td>一位神，眾人的父</td><td>七個「一」的頂點</td></tr></table>","gram":"<p><strong>4:4–6 沒有動詞，七個「一」像鼓點一樣排開：身體、靈、盼望；主、信、洗；神與父。</strong></p><p>希臘文的「一」有三種性：中性 ἕν（hen）、陰性 μία（mia）、陽性 εἷς（heis）。保羅讓三種性輪流出現：ἓν σῶμα καὶ ἓν πνεῦμα（hen sōma kai hen pneuma），μιᾷ ἐλπίδι（mia elpidi）；εἷς κύριος（heis kyrios）, μία πίστις（mia pistis）, ἓν βάπτισμα（hen baptisma）；εἷς θεὸς（heis theos）。讀出聲來，是一段節奏分明的頌詞，許多學者認為保羅引用或改寫了初期教會的認信或洗禮宣告。</p><p>七個「一」照三一神排列：第一組圍繞聖靈（身體、靈、盼望），第二組圍繞主耶穌（主、信、洗），第三組歸於父。合一的根基不在教會的組織，在神自己的本性。最後一句用三個介系詞說父與眾人的關係：ὁ ἐπὶ πάντων καὶ διὰ πάντων καὶ ἐν πᾶσιν（ho epi pantōn kai dia pantōn kai en pasin）——在上、貫穿、在內；超越而又臨在。</p><p>4:4 的 καθὼς καὶ ἐκλήθητε（kathōs kai eklēthēte） 再次回到 4:1 的「蒙召」：κλῆσις（klēsis） 在三節之內出現第三次。μία πίστις（mia pistis） 可指所信的內容（4:13「真道」），也可指信靠的行動；這裡與「一主」「一洗」並列，較偏所信的對象與內容。</p>","exp":"<p>〔林前〕林前 12:12--13（哥林多前書講義第 12 章）</p><p><strong>「身體只有一個，聖靈只有一個，正如你們蒙召同有一個指望。」（4:4）在保羅談恩賜的多樣之前，他先數了七個「一」。</strong></p><p>本系列哥林多前書講義第 12 章講過一個身體與許多肢體：「就如身子是一個，卻有許多肢體」（林前 12:12）。那時的哥林多人因為恩賜而互相比較，保羅從身體的多樣講到合一。以弗所書的次序剛好倒過來：先講七個「一」，4:7 才講「各人」。先有共同的根，才談不同的枝子；先確認我們屬於同一個身體，各人的不同才不會變成分裂的理由。</p><p>這七樣都不是我們投票決定的。身體是基督的，聖靈是神所賜的，盼望是蒙召時一同領受的；主只有一位，所信的福音只有一個，歸入基督的洗只有一種；神是「眾人的父」。我們可以在許多事上看法不同，但這七樣不是談判桌上的籌碼。</p><p>「一洗」常被問到：浸禮還是點水？嬰兒可以受洗嗎？各宗派在方式上的分歧是真實的，議題頁會並陳；但保羅在這裡的重點不是方式，而是所有信徒都受洗歸入同一位主。把「一洗」講成分開教會的理由，就正好讀反了。</p><p>對一個華人教會林立的城市，這三節是一面鏡子：不同的語言堂、不同的宗派，我們常常活得像幾個身體。保羅會說：身體只有一個，你們只是還沒有活出來。</p>"},{"a":7,"z":7,"star":2,"grk":"<p lang=\"grc\">Ἑνὶ δὲ ἑκάστῳ ἡ ῶν ἐδόθη ἡ χάρις κατὰ τὸ μέτρον τῆς δωρεᾶς τοῦ Χριστοῦ.</p>","lit":"<p>但恩典被賜給我們每一個人，是照著基督恩賜的量度。</p>","key":"<table><tr><th>原文</th><th>音譯</th><th>字面</th><th>在這裡</th></tr><tr><td>Ἑνὶ δὲ ἑκάστῳ</td><td>Heni de hekastō</td><td>但給每一個人</td><td>δὲ 從「眾人」轉到「每一個」</td></tr><tr><td>ἐδόθη</td><td>edothē</td><td>被賜下</td><td>神性被動；不定過去式</td></tr><tr><td>ἡ χάρις</td><td>hē charis</td><td>恩典</td><td>這裡是為服事而賜的恩</td></tr><tr><td>κατὰ τὸ μέτρον</td><td>kata to metron</td><td>照著量度</td><td>μέτρον 本章三見：4:7、13、16</td></tr><tr><td>τῆς δωρεᾶς τοῦ Χριστοῦ</td><td>tēs dōreas tou Christou</td><td>基督的恩賜</td><td>白白的禮物</td></tr></table>","gram":"<p><strong>4:7 的 δὲ（de） 是一個轉身：前六節講「一」，這一節講「每一個」。</strong></p><p>句首 Ἑνὶ δὲ ἑκάστῳ（Heni de hekastō） 把「每一個人」放在最前面強調：沒有一個肢體被漏掉。動詞 ἐδόθη（edothē） 是被動，沒有說出施與者，是猶太人表達神作為的慣用法；不定過去式指向一個已經完成的賜予。主詞 ἡ χάρις（hē charis） 在這裡不是使人得救的恩典（那是 2:8），而是為服事而賜的恩——3:7–8 保羅說自己「照他運行的大能賜給我的恩賜」，同一個概念。</p><p>κατὰ τὸ μέτρον τῆς δωρεᾶς τοῦ Χριστοῦ（kata to metron tēs dōreas tou Christou）：μέτρον（metron） 是量尺。這個字在本章出現三次，串起一條線：4:7 基督量給各人的恩賜，4:13 基督長成的身量，4:16 各體的功用「按量度」運作。量尺握在基督手裡；分配的不同不是偏心，是設計。δωρεά（dōrea） 強調白白賜予，與 4:8 引詩篇的 δόματα（domata） 互相呼應。</p>","exp":"<p>〔林前〕林前 12:4--11（哥林多前書講義第 12 章）</p><p><strong>「我們各人蒙恩，都是照基督所量給各人的恩賜。」（4:7）教會裡沒有一個人是空手的。</strong></p><p>哥林多前書講「恩賜原有分別，聖靈卻是一位」（林前 12:4），強調分配的是聖靈；以弗所書說量給恩賜的是基督。兩處合起來，是同一位三一神把禮物分給祂的家人。本系列哥林多前書講義第 12 章已經處理過恩賜的清單；以弗所書不列清單，只說一句：每一個人都有。</p><p>這句話對兩種人說。對覺得自己沒用的人，它說：你也在「各人」之內，你手上有基督量給你的那一份，不必等到有頭銜才開始服事。對覺得自己很重要的人，它說：你手上的也是被「量給」的，不是你自己長出來的；量的人是基督，你沒有甚麼可誇的。</p><p>「量給」也意味著不一樣。有人多、有人少，有人顯眼、有人隱藏。比較是恩賜最大的殺手：多的人驕傲，少的人嫉妒，兩種人都忘了禮物是送的。神家裡最健康的眼光，不是問「為甚麼他比我多」，而是問「基督給我的這一份，我用了沒有」。</p><p>接下來保羅要說明，這些恩賜是從哪裡來的——從一場得勝的凱旋。</p>"},{"a":8,"z":8,"star":2,"grk":"<p lang=\"grc\">διὸ λέγει· Ἀναβὰς εἰς ὕψος ᾐχμαλώτευσεν αἰχμαλωσίαν, ἔδωκεν δόματα τοῖς ἀνθρώποις.</p>","lit":"<p>所以他說：「他升到高處的時候，擄掠了被擄的，把恩賜給了人。」</p>","key":"<table><tr><th>原文</th><th>音譯</th><th>字面</th><th>在這裡</th></tr><tr><td>διὸ λέγει</td><td>dio legei</td><td>所以他說</td><td>引經的公式；主詞未明說，指聖經或神</td></tr><tr><td>Ἀναβὰς εἰς ὕψος</td><td>Anabas eis hypsos</td><td>升到高處</td><td>不定過去式分詞；凱旋登高</td></tr><tr><td>ᾐχμαλώτευσεν αἰχμαλωσίαν</td><td>ēchmalōteusen aichmalōsian</td><td>擄掠了被擄的</td><td>同字根受詞：擄掠了一群俘虜</td></tr><tr><td>ἔδωκεν δόματα τοῖς ἀνθρώποις</td><td>edōken domata tois anthrōpois</td><td>把恩賜給了人</td><td>詩篇原文是「受了」；保羅作「給了」</td></tr></table>","gram":"<p><strong>4:8 是本章唯一的舊約明文引用之一：詩 68:18。保羅把一首凱旋詩，用在升天的基督身上。</strong></p><p>詩篇 68 篇描寫神從西奈山出發，得勝地登上錫安。和合本譯自希伯來文：「你已經升上高天，擄掠仇敵；你在人間，就是在悖逆的人間，受了供獻」（詩 68:18）。七十士譯本（詩 67:19）也作「受」：ἔλαβες δόματα（elabes domata）。保羅卻寫 ἔδωκεν δόματα τοῖς ἀνθρώποις（edōken domata tois anthrōpois），「給了」。學者的解釋有三：①有猶太傳統（後來寫成的詩篇亞蘭文意譯本）同樣讀作「給」，保羅可能採用了這個讀法；②得勝的君王收下戰利品，正是為了分賞給跟隨他的人，「受」與「給」是同一場凱旋的兩面；③保羅在基督的光中讀這首詩，看見升天的那一位是賜予者。本講義認為三者可以並存，第二點最貼近凱旋的畫面。</p><p>ᾐχμαλώτευσεν αἰχμαλωσίαν（ēchmalōteusen aichmalōsian） 是同字根受詞，字面「擄掠了擄掠」，指一群俘虜被帶在凱旋行列中。被擄的是誰？可指被征服的敵對勢力（1:21；6:12），也有人讀作被基督從罪中贖回、成為祂隨從的人。前者較合詩篇原意。διὸ（dio） 是推論詞：4:7 說恩賜是基督量給的，「所以」經上這樣說。</p><p>這是以弗所書自己作的連結，可以講滿：保羅明說詩篇這一句說的是升天的基督。</p>","exp":"<p><strong>一位得勝的王凱旋回城，身後押著俘虜；他登上高處，把戰利品分給百姓——這是 4:8 的畫面。</strong></p><p>「所以經上說：他升上高天的時候，擄掠了仇敵，將各樣的恩賜賞給人。」（4:8）古代的凱旋式，得勝的將軍站在車上，敵軍的俘虜被帶著遊行，然後他把戰利品分給軍隊與百姓。保羅說：基督升天，就是這樣一場凱旋。1:20–22 說神叫祂「坐在自己的右邊」，「又將萬有服在他的腳下」；仇敵已經被擄掠了。</p><p>這徹底改變我們看恩賜的方式。恩賜不是天生的才幹，也不是我們修來的屬靈等級，而是得勝者分下來的戰利品。每一樣恩賜背後都有一場戰爭——十字架與復活的戰爭。你在教會裡教主日學、彈琴、關懷人，用的不是自己的本事，是基督打勝仗得來、分給你的那一份。</p><p>所以恩賜不屬於拿到的人。戰利品是王分的，用來慶祝王的得勝；誰若把分到的拿來建立自己的名聲，就是把王的凱旋改成了自己的遊行。</p><p>和合本在這一節末尾開了一個括號，把 4:9–10 放進去：保羅停下來解釋「升上」兩個字。下一段我們就跟著他岔開這一小步。</p>"},{"a":9,"z":10,"star":2,"grk":"<p lang=\"grc\">τὸ δὲ Ἀνέβη τί ἐστιν εἰ μὴ ὅτι καὶ κατέβη εἰς τὰ κατώτερα μέρη τῆς γῆς;</p><p lang=\"grc\">ὁ καταβὰς αὐτός ἐστιν καὶ ὁ ἀναβὰς ὑπεράνω πάντων τῶν οὐρανῶν, ἵνα πληρώσῃ τὰ πάντα.</p>","lit":"<p>那「他升上」是甚麼意思呢？豈不是說他也降到了地的更低的部分嗎？</p><p>那降下的，他也就是那升到遠超一切諸天之上的，為要充滿萬有。</p>","key":"<table><tr><th>原文</th><th>音譯</th><th>字面</th><th>在這裡</th></tr><tr><td>τὸ δὲ Ἀνέβη</td><td>to de Anebē</td><td>那「他升上」</td><td>冠詞把一個動詞當作引文來討論</td></tr><tr><td>κατέβη</td><td>katebē</td><td>他降下</td><td>SBLGNT 無 πρῶτον；和合本「先降」</td></tr><tr><td>εἰς τὰ κατώτερα μέρη τῆς γῆς</td><td>eis ta katōtera merē tēs gēs</td><td>到地的更低的部分</td><td>屬格的讀法決定「地下」是哪裡</td></tr><tr><td>ὁ καταβὰς αὐτός ἐστιν</td><td>ho katabas autos estin</td><td>那降下的就是他</td><td>降下與升上是同一位</td></tr><tr><td>ὑπεράνω πάντων τῶν οὐρανῶν</td><td>hyperanō pantōn tōn ouranōn</td><td>遠在一切諸天之上</td><td>1:21 同一個介系詞 ὑπεράνω</td></tr><tr><td>ἵνα πληρώσῃ τὰ πάντα</td><td>hina plērōsē ta panta</td><td>為要充滿萬有</td><td>追蹤字 πληρόω</td></tr></table>","gram":"<p><strong>4:9 用冠詞 τὸ（to） 把動詞 Ἀνέβη（Anebē） 當作一個詞來討論：「這『他升上』是甚麼意思？」這是拉比解經的手法，從經文的一個字推出它的前提。</strong></p><p><strong>◆ 經文鑑別。</strong>SBLGNT 作 κατέβη（katebē），沒有 πρῶτον（prōton）；拜占庭傳統的抄本（RP）作 κατέβη πρῶτον（katebē prōton），「先降下」。較早的抄本多半沒有 πρῶτον（prōton），批判本都不收；和合本「先降」與 RP 相同，也可能只是中文為了語意順暢而補的字。本講義的判斷：原文很可能沒有「先」字，但保羅的邏輯本身已經含有先後——說「升上」，就預設他原本不在高處。所以和合本的「先」沒有扭曲意思，只是把隱含的次序說了出來；它的副作用是比較排除了下面第三種讀法。</p><p>εἰς τὰ κατώτερα μέρη τῆς γῆς（eis ta katōtera merē tēs gēs） 有三種讀法：①同位屬格——「更低的部分，就是地」：指道成肉身，從天降到地上（包括死與埋葬）；②部分或比較屬格——「比地更低的部分」：指基督死後降到陰間（使徒信經的「降在陰間」，這使我們想起彼前 3:19）；③指升天之後的降下，即五旬節聖靈帶著恩賜降臨。本講義取第一種：本段的對比是「地」與「遠升諸天之上」，與腓 2:7–9 先降卑、後升高的路線一致；第二種不必排除，但不是這段經文的重點。是否下到陰間，議題頁另述。</p><p>4:10 的 ὁ καταβὰς αὐτός ἐστιν καὶ ὁ ἀναβὰς（ho katabas autos estin kai ho anabas）：同一位。ἵνα πληρώσῃ τὰ πάντα（hina plērōsē ta panta） 回到 1:23「那充滿萬有者」——追蹤字 πληρόω（plēroō） 在此站點，4:13 收成 πλήρωμα（plērōma）。</p>","exp":"<p><strong>「既說升上，豈不是先降在地下嗎？那降下的，就是遠升諸天之上要充滿萬有的。」（4:9–10）賜恩賜的那一位，先走過最低的路。</strong></p><p>保羅在講恩賜的半途停下來，像一位老師在黑板旁加了一個註腳：你們聽見「升上」，別忘了祂是從哪裡升上去的。在以弗所的城裡，人們熟悉從天而降的神明故事，那些神明下凡是為了享樂或懲罰；這一位降下，是為了死。</p><p>主耶穌說過：「除了從天降下、仍舊在天的人子，沒有人升過天。」（約 3:13）道路的方向是先降後升。祂降到人間，降到十字架，降到墳墓；然後升到「諸天之上」。所以，充滿萬有的那一位，也是走過萬有最低處的那一位。沒有一個角落低到祂不曾去過。</p><p>這兩節夾在「恩賜」中間，不是離題。它告訴我們：恩賜的源頭是一位先降卑的主。若有人用恩賜往上爬、拿職分壓人，就走了和賜恩者相反的方向。這使我們想起腓立比書的那條路：「自己卑微，存心順服，以至於死」（腓 2:8），然後「上帝將他升為至高」（腓 2:9）。下一節要列出的那些職分，都必須走這條先降後升的路。</p><p>對一位在低處的信徒——病床上、失業中、被誤解時——這兩節也是安慰：你所在的低處，主去過；而且祂從那裡升上去，是「要充滿萬有」，包括充滿你此刻所在的這一處。</p>"},{"a":11,"z":11,"star":3,"grk":"<p lang=\"grc\">καὶ αὐτὸς ἔδωκεν τοὺς μὲν ἀποστόλους, τοὺς δὲ προφήτας, τοὺς δὲ εὐαγγελιστάς, τοὺς δὲ ποιμένας καὶ διδασκάλους,</p>","lit":"<p>而他自己賜下了：一些是使徒，一些是先知，一些是傳福音的，一些是牧者和教師，</p>","key":"<table><tr><th>原文</th><th>音譯</th><th>字面</th><th>在這裡</th></tr><tr><td>αὐτὸς ἔδωκεν</td><td>autos edōken</td><td>他自己賜下了</td><td>αὐτὸς 強調；ἔδωκεν 接 4:8 的「給了恩賜」</td></tr><tr><td>τοὺς μὲν ἀποστόλους</td><td>tous men apostolous</td><td>一些是使徒</td><td>被差遣的人；2:20 根基</td></tr><tr><td>τοὺς δὲ προφήτας</td><td>tous de prophētas</td><td>一些是先知</td><td>3:5 與使徒並列</td></tr><tr><td>τοὺς δὲ εὐαγγελιστάς</td><td>tous de euangelistas</td><td>一些是傳福音的</td><td>新約只出現三次</td></tr><tr><td>τοὺς δὲ ποιμένας καὶ διδασκάλους</td><td>tous de poimenas kai didaskalous</td><td>一些是牧者和教師</td><td>兩個名詞共用一個冠詞</td></tr></table>","gram":"<p><strong>4:11 的主詞是 αὐτὸς（autos）——「他自己」。動詞 ἔδωκεν（edōken） 直接接回 4:8 的 ἔδωκεν δόματα（edōken domata）：升天的基督所給的恩賜，在這裡是一群人。</strong></p><p>句子用 τοὺς μὲν（tous men）……τοὺς δὲ（tous de）……的結構，字面是「一些作使徒，一些作先知……」。前三項各有自己的冠詞：τοὺς μὲν ἀποστόλους（tous men apostolous）, τοὺς δὲ προφήτας（tous de prophētas）, τοὺς δὲ εὐαγγελιστάς（tous de euangelistas）；最後兩項卻共用一個冠詞：τοὺς δὲ ποιμένας καὶ διδασκάλους（tous de poimenas kai didaskalous）。這個冠詞怎樣讀，產生兩種主要讀法：</p><p><strong>五重</strong>：五個不同的名詞，牧養與教導是兩種恩賜；許多靈恩與五旬節派教會的「五重職事」由此而來。<strong>四重</strong>：共用冠詞表示同一群人的兩個面向——牧者就是教導的人；許多改革宗與福音派註釋採此讀法。多數近代註釋取兩者之間：Granville Sharp 規則不適用於複數名詞，共用冠詞只表示兩者緊密相連、大幅重疊——每一位牧者都要教導，但不是每一位教師都是牧者。本講義取這個「四重而重疊」的讀法，同時並不因此否定「五種功能」的說法：數目不是重點，目的才是（4:12）。</p><p>ποιμένας（poimenas） 是全本新約唯一一次用「牧人」這個名詞稱呼教會的領袖（動詞「牧養」見徒 20:28；彼前 5:2）。使徒與先知已在 2:20、3:5 出現，是教會的「根基」；這份清單與林前 12:28 不完全相同，可見保羅不是在畫組織圖，而是舉例說明基督怎樣把人當作禮物賜給教會。</p>","exp":"<p><strong>「他所賜的，有使徒，有先知，有傳福音的，有牧師和教師」（4:11）——讀這一節之前，要先記得我們是怎樣走到這裡的。</strong></p><p>保羅沒有從職分開始。他先講七個「一」（4:4–6），再講「我們各人蒙恩」（4:7），再講得勝的基督分賞戰利品（4:8），再講祂先降後升（4:9–10）。到了 4:11，主詞仍然是「他」：職分是基督賜給教會的禮物，不是教會頒給某些人的頭銜；是給眾人的，不是給個人的。</p><p>五種人各有其工：使徒是被差遣去開拓的人，新約的使徒見過復活的主、被祂親自差遣（徒 1:21–22；林前 9:1），他們的根基職分不可重複；先知說造就、安慰、勸勉人的話（林前 14:3）；傳福音的把好消息帶到教會以外；牧師和教師餵養、看顧、教導已經在羊圈裡的人。今天還有使徒與先知嗎？止息論、溫和延續論、新使徒改革運動各有主張，本講義的全卷立場見 ISS00_5：根基的職分不再有，開拓與造就的功能今天仍需要，但不以頭銜要求順服、不發布高過聖經的新啟示。</p><p>這一節最容易被誤用。有人說「我是神膏立的使徒，你們要在我的遮蓋底下」；有人用「先知性的話」替人決定婚姻、工作、搬家；有人把五重職份畫成一座金字塔。這些都把禮物變成了權柄。講台上不自封、也不封人為使徒或先知；不以職分要求絕對的順服、奉獻或忠誠。檢驗很簡單：一個職分讓你更依賴他，還是讓你更能自己站起來服事？</p><p>321 的「235」裡，「5」就是從這一節取名的五重職份團隊：開拓的、說造就的話的、傳福音的、牧養的、教導的，五種功能彼此配搭。它不是五張名片，也不是五個坐在台上的人；它存在的理由寫在下一節：「為要成全聖徒，各盡其職」（4:12）。</p>"},{"a":12,"z":12,"star":3,"grk":"<p lang=\"grc\">πρὸς τὸν καταρτισμὸν τῶν ἁγίων εἰς ἔργον διακονίας, εἰς οἰκοδομὴν τοῦ σώματος τοῦ Χριστοῦ,</p>","lit":"<p>為了聖徒的裝備，以致服事的工作，以致基督身體的建造，</p>","key":"<table><tr><th>原文</th><th>音譯</th><th>字面</th><th>在這裡</th></tr><tr><td>πρὸς τὸν καταρτισμὸν τῶν ἁγίων</td><td>pros ton katartismon tōn hagiōn</td><td>為了聖徒的裝備</td><td>καταρτισμός：補網、接骨；新約只此一次</td></tr><tr><td>εἰς ἔργον διακονίας</td><td>eis ergon diakonias</td><td>以致服事的工作</td><td>介系詞換了：πρός → εἰς</td></tr><tr><td>εἰς οἰκοδομὴν τοῦ σώματος τοῦ Χριστοῦ</td><td>eis oikodomēn tou sōmatos tou Christou</td><td>以致基督身體的建造</td><td>追蹤字 οἰκοδομή：聖殿的建造變成身體的建造</td></tr></table>","gram":"<p><strong>4:12 有三個介系詞片語：πρὸς τὸν καταρτισμὸν τῶν ἁγίων（pros ton katartismon tōn hagiōn），εἰς ἔργον διακονίας（eis ergon diakonias），εἰς οἰκοδομὴν τοῦ σώματος τοῦ Χριστοῦ（eis oikodomēn tou sōmatos tou Christou）。怎樣把它們連起來，決定了牧者在做甚麼。</strong></p><p>舊的讀法（英王欽定本在三個片語之間都加了逗號）把三者並列，都是職分的工作：成全聖徒、做服事的工、建立身體——事工全在牧者身上。近代多數註釋注意到介系詞的變化：第一個是 πρὸς（pros），後兩個是 εἰς（eis）。這使三者成為一條鏈：職分的人裝備聖徒，好叫聖徒去做服事的工作，結果是基督的身體被建立。和合本「為要成全聖徒，各盡其職，建立基督的身體」採的正是這條鏈——「各盡其職」的主詞是聖徒。少數學者認為兩種讀法的差別被誇大了，但介系詞的變化與 4:16「百節各按各職」的上下文，都支持第二種。</p><p>καταρτισμός（katartismos） 在新約只出現這一次，它的動詞 καταρτίζω（katartizō） 卻很常見：雅各和約翰「在船上補網」（可 1:19），原文就是 καταρτίζοντας τὰ δίκτυα（katartizontas ta diktya）；加 6:1 把跌倒的人「挽回過來」用的是 καταρτίζετε（katartizete）；古代醫學用它說接回脫臼的骨頭。成全，就是把破的補好、把錯位的接回去，叫它能發揮原有的功能。</p><p>διακονίας（diakonias） 不是神職人員的專利：「服事的工作」屬於眾聖徒。οἰκοδομή（oikodomē） 是追蹤字：2:21 說聖殿「漸漸成為主的聖殿」，這裡說身體被建立，4:16 與 4:29 還會再出現。</p>","exp":"<p><strong>「為要成全聖徒，各盡其職，建立基督的身體」（4:12）——這是 321「一個目的・建立屬神的體系」的本文，也是牧者這份工作的說明書。</strong></p><p>想像加利利湖邊的漁夫，天亮前坐在船上補網。網破了，魚就漏走；補網的人不是去替網抓魚，而是讓網重新能用。保羅說，使徒、先知、傳福音的、牧師和教師，就是補網的人：他們的工作是把聖徒「接好」，讓聖徒自己去服事。</p><p>許多華人教會的實況卻正好相反：牧師講道、探訪、帶查經、修水管、主持婚喪，會眾坐在台下評分。牧者累垮了，會眾也沒有長大。這不是牧者太忠心，是把 4:12 讀錯了。好的牧者像球隊的教練，他不必自己踢每一個位置；他的成就不是自己進了幾個球，而是場上的每一個人都會踢。牧者的工作是做事工，還是裝備人做事工？議題頁展開，但經文的方向已經很清楚。</p><p>這也是紅線六的防線。職分的目的若是「成全聖徒」，它就不可能是頭銜與層級：一個要人永遠依附在他「遮蓋」底下的領袖，正好在做和補網相反的事。成全的終點是聖徒能自己站立、自己服事，而且彼此建立。</p><p>321 的「235」五重職份團隊，在這裡被量了一次：這個團隊有沒有讓每一個人上場？321 的改變觀念八大步驟以「繁殖」作結，經文就在這裡——繁殖不是生出更多聽眾，而是生出更多上場的人。如果一個團隊只剩幾個人在台上忙碌，其他人在台下觀看，它就已經離開了以弗所書。「建立基督的身體」，是讓每一個肢體都動起來。</p>"},{"a":13,"z":14,"star":2,"grk":"<p lang=\"grc\">μέχρι καταντήσωμεν οἱ πάντες εἰς τὴν ἑνότητα τῆς πίστεως καὶ τῆς ἐπιγνώσεως τοῦ υἱοῦ τοῦ θεοῦ, εἰς ἄνδρα τέλειον, εἰς μέτρον ἡλικίας τοῦ πληρώματος τοῦ Χριστοῦ,</p><p lang=\"grc\">ἵνα μηκέτι ὦμεν νήπιοι, κλυδωνιζόμενοι καὶ περιφερόμενοι παντὶ ἀνέμῳ τῆς διδασκαλίας ἐν τῇ κυβείᾳ τῶν ἀνθρώπων ἐν πανουργίᾳ πρὸς τὴν μεθοδείαν τῆς πλάνης,</p>","lit":"<p>直到我們眾人都抵達那信仰的合一和對神兒子的認識，抵達一個成熟的人，抵達基督豐滿之身量的量度，</p><p>好使我們不再是嬰孩，被一切教訓之風翻騰、帶來帶去，在人的擲骰詭詐中，在狡猾裡，朝向迷惑的詭計；</p>","key":"<table><tr><th>原文</th><th>音譯</th><th>字面</th><th>在這裡</th></tr><tr><td>μέχρι καταντήσωμεν οἱ πάντες</td><td>mechri katantēsōmen hoi pantes</td><td>直到我們眾人抵達</td><td>目標是「眾人」一起到達</td></tr><tr><td>εἰς τὴν ἑνότητα τῆς πίστεως</td><td>eis tēn henotēta tēs pisteōs</td><td>到信仰的合一</td><td>4:3 的 ἑνότης 再現</td></tr><tr><td>εἰς ἄνδρα τέλειον</td><td>eis andra teleion</td><td>到一個成熟的人</td><td>單數：眾人合成一個成年人</td></tr><tr><td>εἰς μέτρον ἡλικίας τοῦ πληρώματος τοῦ Χριστοῦ</td><td>eis metron hēlikias tou plērōmatos tou Christou</td><td>到基督豐滿之身量的量度</td><td>追蹤字 πλήρωμα 的收點</td></tr><tr><td>νήπιοι</td><td>nēpioi</td><td>嬰孩</td><td>複數；與單數的「成人」對照</td></tr><tr><td>κλυδωνιζόμενοι</td><td>klydōnizomenoi</td><td>被浪翻騰</td><td>κλύδων：海浪</td></tr><tr><td>ἐν τῇ κυβείᾳ τῶν ἀνθρώπων</td><td>en tē kybeia tōn anthrōpōn</td><td>在人的擲骰之中</td><td>κυβεία：擲骰子、作弊</td></tr><tr><td>πρὸς τὴν μεθοδείαν τῆς πλάνης</td><td>pros tēn methodeian tēs planēs</td><td>朝向迷惑的詭計</td><td>6:11 同一個字：魔鬼的詭計</td></tr></table>","gram":"<p><strong>4:13 用 μέχρι（mechri） 帶出目標，接著三個 εἰς（eis）：到信仰的合一、到成熟的人、到基督長成的身量。</strong></p><p>注意單複數的對照：εἰς ἄνδρα τέλειον（eis andra teleion） 是單數——「一個成年男子」；4:14 的 νήπιοι（nēpioi） 是複數——「一群嬰孩」。成熟的不是一個個屬靈偉人，而是眾人一同長成一個人，這呼應 2:15「一個新人」。嬰孩是許多個，各自哭鬧、各自漂流；成人是一個，四肢協調。</p><p>ἑνότης（henotēs） 在 4:3 是「保守」聖靈已賜的合一，在 4:13 是要「到達」的信仰的合一：合一既是禮物，也是目標。εἰς μέτρον ἡλικίας τοῦ πληρώματος τοῦ Χριστοῦ（eis metron hēlikias tou plērōmatos tou Christou） 是本章第二次 μέτρον（metron），也是追蹤字 πλήρωμα（plērōma） 的收點：1:23 教會是基督的豐滿，這裡教會要長到那豐滿的身量。ἡλικία（hēlikia） 可指年齡，也可指身高，兩者都是「成熟」的圖像。</p><p>4:14 的圖像從陸地轉到海上：κλυδωνιζόμενοι καὶ περιφερόμενοι（klydōnizomenoi kai peripheromenoi），被浪拋起、被風帶著轉圈。κυβεία（kybeia） 是擲骰子，引申為作弊、詐騙；μεθοδεία（methodeia） 是有計畫的手段，6:11 用同一個字說「魔鬼的詭計」——人的詭計背後，有更深的一雙手。</p>","exp":"<p><strong>「直等到我們眾人在真道上同歸於一，認識神的兒子，得以長大成人，滿有基督長成的身量」（4:13）——成全聖徒的終點，不是一間熱鬧的教會，是一間長大的教會。</strong></p><p>這是本章的高處。保羅給教會的身高量尺，不是某一位屬靈偉人，而是基督自己。這把尺讓每一間教會都謙卑：沒有一間已經量到頂；也讓每一間教會都有盼望：量尺掛在那裡，表示神打算讓我們長到那麼高。</p><p>長大的反面是「小孩子」。嬰孩的特徵不是無知，而是容易被帶走：今天跟這位網紅牧師，明天跟那套成功神學，後天被一個異端的查經班拉走。保羅用海上的畫面形容：小船沒有錨，每一陣風都能把它吹得團團轉。「人的詭計和欺騙的法術」原文是擲骰子的人在作弊——有些教導看起來是屬靈的，其實背後在算計你的錢、你的時間、你的忠誠。</p><p>解藥不是反智，也不是關起門來甚麼都不聽，而是長大：「認識神的兒子」，在真道上紮根。這就是為甚麼 4:11 的職分中有「牧師和教師」——教導不是可有可無的點綴，它是一間教會的錨。</p><p>還要留意，長大是「我們眾人」一起的事。一個人很難獨自長成熟；被浪捲走的，往往是離開身體、單獨漂流的那一個。下一節保羅要告訴我們，長大的方式是什麼：用愛心說誠實話。</p>"},{"a":15,"z":16,"star":2,"grk":"<p lang=\"grc\">ἀληθεύοντες δὲ ἐν ἀγάπῃ αὐξήσωμεν εἰς αὐτὸν τὰ πάντα, ὅς ἐστιν ἡ κεφαλή, Χριστός</p><p lang=\"grc\">ἐξ οὗ πᾶν τὸ σῶμα συναρμολογούμενον καὶ συμβιβαζόμενον διὰ πάσης ἁφῆς τῆς ἐπιχορηγίας κατʼ ἐνέργειαν ἐν μέτρῳ ἑνὸς ἑκάστου μέρους τὴν αὔξησιν τοῦ σώματος ποιεῖται εἰς οἰκοδομὴν ἑαυτοῦ ἐν ἀγάπῃ.</p>","lit":"<p>但在愛中持守真實，我們要在萬事上長進，長到他裡面，他就是那頭——基督；</p><p>從他，全身藉著每一個供應的關節被接合、被聯結，照著每一部分按量度的運作，使身體增長，在愛中建造自己。</p>","key":"<table><tr><th>原文</th><th>音譯</th><th>字面</th><th>在這裡</th></tr><tr><td>ἀληθεύοντες δὲ ἐν ἀγάπῃ</td><td>alētheuontes de en agapē</td><td>但在愛中持守真實</td><td>動詞化的「真理」：說真話，也活真實</td></tr><tr><td>αὐξήσωμεν εἰς αὐτὸν τὰ πάντα</td><td>auxēsōmen eis auton ta panta</td><td>在萬事上長到他裡面</td><td>生長的方向是元首</td></tr><tr><td>ἡ κεφαλή</td><td>hē kephalē</td><td>那頭</td><td>1:22 萬有之首；元首只有一位</td></tr><tr><td>συναρμολογούμενον καὶ συμβιβαζόμενον</td><td>synarmologoumenon kai symbibazomenon</td><td>被接合、被聯結</td><td>現在式被動：持續被接合；2:21 聖殿同字</td></tr><tr><td>διὰ πάσης ἁφῆς τῆς ἐπιχορηγίας</td><td>dia pasēs haphēs tēs epichorēgias</td><td>藉著每一個供應的關節</td><td>ἁφή：關節、接觸點</td></tr><tr><td>ἐν μέτρῳ ἑνὸς ἑκάστου μέρους</td><td>en metrō henos hekastou merous</td><td>照著每一部分的量度</td><td>本章第三次 μέτρον</td></tr><tr><td>εἰς οἰκοδομὴν ἑαυτοῦ ἐν ἀγάπῃ</td><td>eis oikodomēn heautou en agapē</td><td>在愛中建造自己</td><td>以「在愛中」收尾</td></tr></table>","gram":"<p><strong>4:15 的 ἀληθεύοντες（alētheuontes） 不是「說」加「真理」兩個字，而是一個動詞：「真理化」——說真話，也活在真實裡。</strong></p><p>ἀληθεύοντες δὲ（alētheuontes de） 用 δὲ（de） 與 4:14 的詭計對立：人的詭計是作弊，聖徒的方式是真實。ἐν ἀγάπῃ（en agapē） 在這一小段出現兩次，4:15 開頭、4:16 結尾，像書擋一樣把整個身體的生長夾在愛裡；4:2 也已經說過「用愛心互相寬容」。真理與愛在保羅筆下從不分家。</p><p>4:16 是一個醫學化的長句。ἐξ οὗ（ex hou）：生長從頭而來；αὐξήσωμεν εἰς αὐτὸν（auxēsōmen eis auton）：也向著頭長去。兩個現在式被動分詞 συναρμολογούμενον καὶ συμβιβαζόμενον（synarmologoumenon kai symbibazomenon） 說身體一直在被接合、被聯結；συναρμολογέω（synarmologeō） 在 2:21 說「各房聯絡得合式」，聖殿與身體用同一個字。ἁφή（haphē） 是關節，ἐπιχορηγία（epichorēgia） 是供應——這個字源自古代出資供應合唱團的人。</p><p>ἐν μέτρῳ ἑνὸς ἑκάστου μέρους（en metrō henos hekastou merous） 是本章第三次 μέτρον（metron）：4:7 基督量給各人，4:13 基督的身量，4:16 每一部分的量度。最後 τὴν αὔξησιν τοῦ σώματος ποιεῖται εἰς οἰκοδομὴν ἑαυτοῦ（tēn auxēsin tou sōmatos poieitai eis oikodomēn heautou）：身體自己使自己增長、建造自己。職分的人在 4:11 出現，到 4:16 卻是全身在動。</p>","exp":"<p>〔林前〕林前 12:12--27（哥林多前書講義第 12 章）</p><p><strong>「惟用愛心說誠實話，凡事長進，連於元首基督」（4:15）——在一個看重面子的文化裡，這是一句很難的經文。</strong></p><p>華人的人際常常在兩端擺盪：為了和氣，甚麼都不說，背後再說；或者忍到受不了，一次把話說盡，話像刀子。保羅兩樣都不要。只有真理沒有愛，是開刀不打麻藥；只有愛沒有真理，是只打麻藥不開刀。「用愛心說誠實話」是兩樣一起：為了對方好，說他需要聽的話，用他接得住的方式。合一不靠不說真話來維持（4:3），長大也不靠不顧感受的直言。</p><p>然後是全段的頂點：「全身都靠他聯絡得合式，百節各按各職，照著各體的功用彼此相助，便叫身體漸漸增長，在愛中建立自己。」（4:16）本系列哥林多前書講義第 12 章講過，「頭也不能對腳說：我用不著你」（林前 12:21）。以弗所書再補一句：每一個關節都在供應。身體的增長不是靠幾個大器官，而是靠每一個關節把養分傳下去。</p><p>這兩節是紅線六的另一道防線。頭只有一個——「元首基督」；沒有一個使徒、先知、牧師可以站在頭的位置上。4:11 的職分在 4:16 消失在「全身」之中：他們是關節，不是頭。</p><p>321 的五重職份團隊要用 4:16 來檢驗：每一個關節都在供應嗎？團隊的成功不是五個人做了多少，而是全身有多少肢體被接上、開始彼此相助。這也是「人比事重要」最具體的樣子：建造的是身體，不是工程。</p>"},{"a":17,"z":19,"star":1,"grk":"<p lang=\"grc\">Τοῦτο οὖν λέγω καὶ μαρτύρομαι ἐν κυρίῳ, μηκέτι ὑμᾶς περιπατεῖν καθὼς καὶ τὰ ἔθνη περιπατεῖ ἐν ματαιότητι τοῦ νοὸς αὐτῶν,</p><p lang=\"grc\">ἐσκοτωμένοι τῇ διανοίᾳ ὄντες, ἀπηλλοτριωμένοι τῆς ζωῆς τοῦ θεοῦ, διὰ τὴν ἄγνοιαν τὴν οὖσαν ἐν αὐτοῖς, διὰ τὴν πώρωσιν τῆς καρδίας αὐτῶν,</p><p lang=\"grc\">οἵτινες ἀπηλγηκότες ἑαυτοὺς παρέδωκαν τῇ ἀσελγείᾳ εἰς ἐργασίαν ἀκαθαρσίας πάσης ἐν πλεονεξίᾳ.</p>","lit":"<p>所以我說這話，並在主裡作見證：你們不要再行走，像外邦人也在他們心思的虛空中行走那樣，</p><p>他們在悟性上是被弄暗了的，與神的生命隔絕，是因為在他們裡面的無知，因為他們心的剛硬；</p><p>他們這些已經失去痛覺的人，把自己交給了放蕩，在貪婪中去做各樣污穢的事。</p>","key":"<table><tr><th>原文</th><th>音譯</th><th>字面</th><th>在這裡</th></tr><tr><td>Τοῦτο οὖν λέγω καὶ μαρτύρομαι</td><td>Touto oun legō kai martyromai</td><td>所以我說並作見證</td><td>第二個 οὖν，接回 4:1</td></tr><tr><td>μηκέτι ὑμᾶς περιπατεῖν</td><td>mēketi hymas peripatein</td><td>你們不要再行走</td><td>追蹤字 περιπατέω</td></tr><tr><td>ἐν ματαιότητι τοῦ νοὸς αὐτῶν</td><td>en mataiotēti tou noos autōn</td><td>在他們心思的虛空中</td><td>νοῦς：心思；4:23 被更新的正是它</td></tr><tr><td>πώρωσιν τῆς καρδίας</td><td>pōrōsin tēs kardias</td><td>心的剛硬</td><td>πώρωσις：結了繭、長了硬皮</td></tr><tr><td>ἀπηλγηκότες</td><td>apēlgēkotes</td><td>已經失去痛覺</td><td>完成式：麻木成了狀態</td></tr><tr><td>ἀσελγείᾳ</td><td>aselgeia</td><td>放蕩</td><td>不顧羞恥的放縱</td></tr><tr><td>ἐν πλεονεξίᾳ</td><td>en pleonexia</td><td>在貪婪中</td><td>要更多</td></tr></table>","gram":"<p><strong>4:17 的 οὖν（oun） 是本章第二個「所以」：4:1 起了頭，4:4–16 談教會，現在保羅回到「行」，從群體轉向個人。</strong></p><p>λέγω καὶ μαρτύρομαι（legō kai martyromai） 是加重語氣，「並且在主裡鄭重作證」。μηκέτι ὑμᾶς περιπατεῖν（mēketi hymas peripatein）：追蹤字 περιπατέω（peripateō） 第二次出現，這次是否定的「不要再」。收信人本是 2:11 所說的 τὰ ἔθνη（ta ethnē），保羅卻把他們和「外邦人」分開：他們的身分已經轉移了。</p><p>4:17–19 是一條往下的鏈：心思虛空，ματαιότητι τοῦ νοὸς（mataiotēti tou noos）；悟性昏暗，ἐσκοτωμένοι τῇ διανοίᾳ（eskotōmenoi tē dianoia）；與神的生命隔絕；因為無知；因為心的剛硬，πώρωσιν τῆς καρδίας（pōrōsin tēs kardias）；麻木，ἀπηλγηκότες（apēlgēkotes）；交出自己，ἑαυτοὺς παρέδωκαν（heautous paredōkan）；最後是放蕩、污穢、貪婪。πώρωσις（pōrōsis） 原指骨折處長出的骨痂或皮膚的厚繭。ἀπηλγηκότες（apēlgēkotes） 是完成式分詞，「已經不再覺得痛」。羅 1:24 說神「任憑」他們；這裡說他們把自己交出去——兩面都是真的。</p>","exp":"<p><strong>「良心既然喪盡，就放縱私慾，貪行種種的污穢。」（4:19）這是本章的谷底。</strong></p><p>保羅描寫的不是一群特別邪惡的人，而是一條人人都可能滑下去的斜坡。起點很不起眼：心思「虛妄」，也就是空。一顆空的心，很快就昏暗；昏暗久了，就與神的生命隔絕；隔絕久了，心長出厚繭；長繭的心不再覺得痛；不覺得痛的人，就甚麼都敢做。</p><p>「良心喪盡」原文是失去痛覺。痛是身體的警報，麻瘋病人最危險的不是傷口，而是感覺不到傷口。罪也是這樣：第一次說謊會心跳，第十次就很自然。以弗所城有亞底米神廟的廟妓、有法術書、有夜夜的宴樂，那是一個麻木成了常態的城市。今天的城市也一樣，只是換了螢幕。</p><p>但保羅寫這一段的目的，不是讓讀者看不起外邦人，而是說「不要再」。他們從前就是這樣（2:1–3），如今已經不同了。下一節的轉折只有兩個字：「你們……卻不是這樣」。從谷底往上的路，不是靠更努力地不墮落，而是靠學一個人。</p>"},{"a":20,"z":21,"star":1,"grk":"<p lang=\"grc\">ὑμεῖς δὲ οὐχ οὕτως ἐμάθετε τὸν Χριστόν,</p><p lang=\"grc\">εἴ γε αὐτὸν ἠκούσατε καὶ ἐν αὐτῷ ἐδιδάχθητε, καθώς ἐστιν ἀλήθεια ἐν τῷ Ἰησοῦ,</p>","lit":"<p>但你們學基督，不是這樣學的，</p><p>如果你們確實聽過他，也在他裡面受過教導，正如真理是在耶穌裡面的，</p>","key":"<table><tr><th>原文</th><th>音譯</th><th>字面</th><th>在這裡</th></tr><tr><td>ὑμεῖς δὲ οὐχ οὕτως</td><td>hymeis de ouch houtōs</td><td>但你們不是這樣</td><td>ὑμεῖς 強調；與外邦人對照</td></tr><tr><td>ἐμάθετε τὸν Χριστόν</td><td>emathete ton Christon</td><td>你們學了基督</td><td>受詞是一個人，不是一套道理</td></tr><tr><td>αὐτὸν ἠκούσατε</td><td>auton ēkousate</td><td>你們聽過他</td><td>不是「聽過關於他」</td></tr><tr><td>ἐν αὐτῷ ἐδιδάχθητε</td><td>en autō edidachthēte</td><td>在他裡面受教</td><td>在基督裡面的學校</td></tr><tr><td>καθώς ἐστιν ἀλήθεια ἐν τῷ Ἰησοῦ</td><td>kathōs estin alētheia en tō Iēsou</td><td>正如真理在耶穌裡</td><td>全卷唯一單用「耶穌」之名</td></tr></table>","gram":"<p><strong>4:20 的 ὑμεῖς δὲ（hymeis de） 是一個急轉彎：「但你們」。ὑμεῖς（hymeis） 本可省略，寫出來就是強調。</strong></p><p>ἐμάθετε τὸν Χριστόν（emathete ton Christon） 是新約獨特的說法：「學」的受詞通常是一件事、一門學問，這裡卻是一個人。猶太拉比的門徒學的是「妥拉」，保羅說你們學的是「基督」。4:21 的 εἴ γε（ei ge） 字面是「如果真的」，但它不是懷疑，而是帶著肯定的提醒（3:2 用同樣的語氣）：你們既然確實聽過……</p><p>αὐτὸν ἠκούσατε（auton ēkousate），受詞也是「他」：不是聽過關於他的道理，而是透過傳道者的口，聽見了他。ἐν αὐτῷ ἐδιδάχθητε（en autō edidachthēte）：在他裡面受教，基督不只是課程，也是課堂。最後 καθώς ἐστιν ἀλήθεια ἐν τῷ Ἰησοῦ（kathōs estin alētheia en tō Iēsou）：以弗所書通常說「基督」「基督耶穌」「主耶穌基督」，只有這裡單用「耶穌」——那位歷史上走過加利利的人。真理不是一個抽象觀念，它住在一個有名字的人身上。</p>","exp":"<p><strong>「你們學了基督，卻不是這樣。」（4:20）基督徒學的不是一套道理，是一個人。</strong></p><p>一個學生可以把一本教科書背得滾瓜爛熟，生活卻毫無改變；一個學徒跟著師傅三年，連走路的樣子都像了。保羅說的「學基督」是後者。主耶穌自己就是這樣邀請人的：「你們當負我的軛，學我的樣式」（太 11:29）。</p><p>這解釋了為甚麼外邦人的那條斜坡，不能只靠道德教育來阻止。規條告訴你哪裡不能去，一個人卻能帶你去另一個地方。從麻木的心回轉過來，靠的是與基督同行，看他怎樣待人、怎樣禱告、怎樣受苦，然後慢慢地像他。</p><p>「真理是在耶穌裡」這句話也是一個提醒：在一個追求知識、講求方法的時代，我們很容易把信仰變成一套觀念、一個系統，甚至一份課程。321 說「耶穌是我的榜樣」，這是基礎的第一條，也正是這兩節的意思——不是先有一套理念再找耶穌來印證，而是先學耶穌，理念才有生命。</p><p>接下來的三節，保羅要說明這位老師教了甚麼：脫去、更新、穿上。</p>"},{"a":22,"z":24,"star":3,"grk":"<p lang=\"grc\">ἀποθέσθαι ὑμᾶς κατὰ τὴν προτέραν ἀναστροφὴν τὸν παλαιὸν ἄνθρωπον τὸν φθειρόμενον κατὰ τὰς ἐπιθυμίας τῆς ἀπάτης,</p><p lang=\"grc\">ἀνανεοῦσθαι δὲ τῷ πνεύματι τοῦ νοὸς ὑμῶν,</p><p lang=\"grc\">καὶ ἐνδύσασθαι τὸν καινὸν ἄνθρωπον τὸν κατὰ θεὸν κτισθέντα ἐν δικαιοσύνῃ καὶ ὁσιότητι τῆς ἀληθείας.</p>","lit":"<p>就是你們要照著從前的生活方式，脫去那舊人，就是那照著迷惑的私慾正在敗壞的，</p><p>又要在你們心思的靈裡被更新，</p><p>並且穿上那新人，就是那照著神、在真理的公義和聖潔中被造的。</p>","key":"<table><tr><th>原文</th><th>音譯</th><th>字面</th><th>在這裡</th></tr><tr><td>ἀποθέσθαι</td><td>apothesthai</td><td>脫去</td><td>不定過去式：一次斷然的脫下</td></tr><tr><td>τὸν παλαιὸν ἄνθρωπον</td><td>ton palaion anthrōpon</td><td>那舊人</td><td>屬亞當、屬從前的那個人</td></tr><tr><td>τὸν φθειρόμενον</td><td>ton phtheiromenon</td><td>正在敗壞的</td><td>現在式被動：漸漸腐爛</td></tr><tr><td>κατὰ τὰς ἐπιθυμίας τῆς ἀπάτης</td><td>kata tas epithymias tēs apatēs</td><td>照著迷惑的私慾</td><td>ἀπάτης 與 4:24 的 ἀληθείας 對照</td></tr><tr><td>ἀνανεοῦσθαι</td><td>ananeousthai</td><td>被更新</td><td>現在式：持續不斷；新約只此一次</td></tr><tr><td>τῷ πνεύματι τοῦ νοὸς ὑμῶν</td><td>tō pneumati tou noos hymōn</td><td>在你們心思的靈裡</td><td>4:17 虛空的那個 νοῦς</td></tr><tr><td>ἐνδύσασθαι</td><td>endysasthai</td><td>穿上</td><td>不定過去式：一次斷然的穿上</td></tr><tr><td>τὸν καινὸν ἄνθρωπον</td><td>ton kainon anthrōpon</td><td>那新人</td><td>2:15 的「一個新人」</td></tr><tr><td>τὸν κατὰ θεὸν κτισθέντα</td><td>ton kata theon ktisthenta</td><td>照著神被造的</td><td>新創造；2:10 同一個動詞</td></tr></table>","gram":"<p><strong>4:22–24 由三個不定詞組成：脫去 ἀποθέσθαι（apothesthai），被更新 ἀνανεοῦσθαι（ananeousthai），穿上 ἐνδύσασθαι（endysasthai）。頭尾兩個是不定過去式，中間一個是現在式。</strong></p><p>時態本身就是一篇講道：脫去與穿上是斷然的、一次性的換衣服；夾在中間的更新卻是持續的、天天的。ἀνανεοῦσθαι（ananeousthai） 在新約只出現這一次，可讀作被動（被更新）或關身（使自己更新），多數註釋取被動：更新是神做的，我們是被更新的。</p><p>這三個不定詞的語法角色有爭議：①它們是 4:21「受教」的內容，屬間接引述——「你們所受的教導是：你們已經脫去了舊人」，配合西 3:9 的不定過去式分詞 ἀπεκδυσάμενοι τὸν παλαιὸν ἄνθρωπον（apekdysamenoi ton palaion anthrōpon），「已經脫去」，與羅 6:6「我們的舊人和他同釘十字架」，說的是信主時已經發生的事；②它們帶命令的意思——「要脫去」，和合本「就要脫去」即採此讀法；③兩者兼有：你們已經脫去了，所以要活出已經脫去的樣子。本講義取第三種，這也是保羅「先直說、後命令」的一貫模式。</p><p>對照組非常工整：舊人照著迷惑的私慾漸漸敗壞，κατὰ τὰς ἐπιθυμίας τῆς ἀπάτης（kata tas epithymias tēs apatēs）；新人照著神被造，κατὰ θεὸν（kata theon），「在真理的公義和聖潔裡」。ἀπάτης（apatēs） 對 ἀληθείας（alētheias），迷惑對真理。τὸν καινὸν ἄνθρωπον（ton kainon anthrōpon） 與 2:15 的 εἰς ἕνα καινὸν ἄνθρωπον（eis hena kainon anthrōpon） 是同一個片語：第 2 章是猶太人與外邦人合成的群體，第 4 章是每一個人穿上的新人。τῷ πνεύματι τοῦ νοὸς ὑμῶν（tō pneumati tou noos hymōn） 的「靈」多數註釋讀作人的靈，即心思最深處的取向；也有人讀作聖靈。</p>","exp":"<p><strong>「就要脫去你們從前行為上的舊人……又要將你們的心志改換一新，並且穿上新人」（4:22–24）——保羅用的是衣服的比喻。</strong></p><p>初期教會的洗禮，受洗的人脫下舊衣下水，上來時穿上一件新的白衣。保羅的讀者可能就經歷過這個儀式。脫去，是對從前那個人說「不」；穿上，是接受神親手裁好的新衣。新人不是自己縫的，是「照著神的形像造的」——這使我們想起創造之初：「神就照著自己的形像造人」（創 1:27）。救恩是一次新的創造。</p><p>舊人的特徵是「漸漸變壞」。罪的可怕不在一夕崩塌，而在慢慢腐爛，像一件被蟲蛀的衣服。它靠「私慾的迷惑」運作：私慾總是說謊，它應許滿足，給的卻是更深的空虛。新人的特徵是「真理的仁義和聖潔」，連形容詞都在對照：舊人活在謊言裡，新人活在真理裡。</p><p>中間那一句最常被忽略：「將你們的心志改換一新」。換衣服很快，心思的更新卻天天進行。基督徒還有舊人嗎？各家的說法不同，議題頁並陳；經文的重點是，舊人已經被定罪、被脫下，但它的習慣還想爬回身上，所以我們每天回到更新的源頭。羅馬書說得一樣：「只要心意更新而變化」（羅 12:2）。</p><p>讓經文說完之後，321 在這裡接上：321 所說「舊人有己的生命變成新人無己的生命」，兩個詞就是從這裡來的。舊人的核心是「己」——以自己為中心的慾望；新人是照著神造的，以神為中心。而「改變觀念就改變生命」的原文，正是 4:23 的「心志改換一新」：生命的改變從心思開始，不是從行為的修剪開始。還要記得 2:15：新人從來不只是一個人的修養，一個人脫去有己的舊人，才擠得進那一個新人——基督的身體——裡面。</p>"},{"a":25,"z":27,"star":2,"grk":"<p lang=\"grc\">Διὸ ἀποθέμενοι τὸ ψεῦδος λαλεῖτε ἀλήθειαν ἕκαστος μετὰ τοῦ πλησίον αὐτοῦ, ὅτι ἐσμὲν ἀλλήλων μέλη.</p><p lang=\"grc\">ὀργίζεσθε καὶ μὴ ἁμαρτάνετε· ὁ ἥλιος μὴ ἐπιδυέτω ἐπὶ παροργισμῷ ὑμῶν,</p><p lang=\"grc\">μηδὲ δίδοτε τόπον τῷ διαβόλῳ.</p>","lit":"<p>所以，既脫去了謊言，你們要各人與他的鄰舍說真實，因為我們是彼此的肢體。</p><p>你們要生氣，卻不要犯罪；太陽不要落在你們的惱怒上，</p><p>也不要給魔鬼地方。</p>","key":"<table><tr><th>原文</th><th>音譯</th><th>字面</th><th>在這裡</th></tr><tr><td>ἀποθέμενοι τὸ ψεῦδος</td><td>apothemenoi to pseudos</td><td>既脫去了謊言</td><td>4:22 的「脫去」落到第一件具體的事</td></tr><tr><td>λαλεῖτε ἀλήθειαν</td><td>laleite alētheian</td><td>要說真實</td><td>引亞 8:16</td></tr><tr><td>ἀλλήλων μέλη</td><td>allēlōn melē</td><td>彼此的肢體</td><td>說謊的理由被身體神學否定</td></tr><tr><td>ὀργίζεσθε καὶ μὴ ἁμαρτάνετε</td><td>orgizesthe kai mē hamartanete</td><td>要生氣，卻不要犯罪</td><td>逐字引詩 4:5 七十士譯本</td></tr><tr><td>ὁ ἥλιος μὴ ἐπιδυέτω</td><td>ho hēlios mē epidyetō</td><td>太陽不要落下</td><td>第三人稱命令</td></tr><tr><td>ἐπὶ παροργισμῷ ὑμῶν</td><td>epi parorgismō hymōn</td><td>在你們的惱怒上</td><td>被激起的怒氣</td></tr><tr><td>τόπον τῷ διαβόλῳ</td><td>topon tō diabolō</td><td>給魔鬼一塊地方</td><td>τόπος：地方、立足點</td></tr></table>","gram":"<p><strong>從 4:25 起，保羅把「脫去／穿上」落到具體的生活：每一條都是「不要……要……因為……」的三段式。</strong></p><p>Διὸ ἀποθέμενοι τὸ ψεῦδος（Dio apothemenoi to pseudos）：ἀποθέμενοι（apothemenoi） 與 4:22 的 ἀποθέσθαι（apothesthai） 同一個動詞，舊人的第一件衣服是謊言。λαλεῖτε ἀλήθειαν ἕκαστος μετὰ τοῦ πλησίον αὐτοῦ（laleite alētheian hekastos meta tou plēsion autou） 幾乎逐字取自亞 8:16 七十士譯本，和合本作「各人與鄰舍說話誠實」（亞 8:16）。理由是 ὅτι ἐσμὲν ἀλλήλων μέλη（hoti esmen allēlōn melē）：撒迦利亞的「鄰舍」，在保羅手中成了「肢體」。</p><p>4:26 的 ὀργίζεσθε καὶ μὴ ἁμαρτάνετε（orgizesthe kai mē hamartanete） 逐字是詩 4:5 的七十士譯本；和合本詩篇譯自希伯來文，作「你們應當畏懼，不可犯罪」（詩 4:4），希伯來字可指因憤怒或恐懼而顫抖。ὀργίζεσθε（orgizesthe） 是命令式，怎樣讀？①真正的命令：要生氣，對罪惡發義怒；②許可或讓步：生氣可以，但不要犯罪；③條件式：若生氣，不要讓它變成罪。多數註釋取②或③，本講義從之：經文沒有命令我們生氣，也沒有禁止生氣，它限定生氣。下一句的 παροργισμός（parorgismos） 不是一般的 ὀργή（orgē），而是被激起、受刺激而有的惱怒。</p><p>ὁ ἥλιος μὴ ἐπιδυέτω（ho hēlios mē epidyetō） 是第三人稱命令：「不要讓太陽落下」。4:27 μηδὲ δίδοτε τόπον τῷ διαβόλῳ（mēde didote topon tō diabolō），現在命令式加否定，意思是「不要繼續給」。τόπος（topos） 是一個地方、一塊地；διάβολος（diabolos） 字面是「毀謗者」。</p>","exp":"<p><strong>「所以，你們要棄絕謊言，各人與鄰舍說實話，因為我們是互相為肢體。」（4:25）說謊傷的不是別人，是自己身上的肢體。</strong></p><p>想像眼睛對腳說謊：前面沒有坑。腳踩下去，摔斷的是整個身體。保羅給「不可說謊」的理由，不是「會被抓到」，而是「我們是一體的」。這就是 321 所說「人比事重要，關係比東西重要」：謊言也許保住了一件事，卻傷了一段關係，而那段關係就是你自己的身體。</p><p>接著是全章最被誤讀的一句：「生氣卻不要犯罪；不可含怒到日落」（4:26）。有人讀成「基督徒不可以生氣」，於是把怒氣吞下去，表面平靜，裡面發炎。也有人讀成「我這是義怒」，於是罵人有理。保羅兩樣都不說。他允許生氣——神自己也會發怒，主耶穌也曾怒視（可 3:5）；但他畫了一條線：太陽下山以前。</p><p>這條線的意思不是時鐘，而是不要累積。有些事一天處理不完，有些傷需要時間，「不能隔夜」不是要人在半夜逼著對方談判。它是說：怒氣要被處理——向神傾訴、說出來、尋求協助——不要被收藏起來，一天天發酵。雅各說得好：「慢慢地動怒，因為人的怒氣並不成就神的義」（雅 1:19–20）。</p><p>為甚麼這麼急？因為「也不可給魔鬼留地步」（4:27）。「地步」原文是一塊地方。沒有處理的怒氣，就像在自己家裡讓出一個房間給仇敵住。屬靈爭戰最常見的戰場，不在神祕的異象裡，而在一個沒有處理的怒氣裡（全卷立場見 ISS00_4）。魔鬼不必破門而入，我們自己就把鑰匙交了出去。</p>"},{"a":28,"z":30,"star":1,"grk":"<p lang=\"grc\">ὁ κλέπτων μηκέτι κλεπτέτω, μᾶλλον δὲ κοπιάτω ἐργαζόμενος ταῖς ἰδίαις χερσὶν τὸ ἀγαθόν, ἵνα ἔχῃ μεταδιδόναι τῷ χρείαν ἔχοντι.</p><p lang=\"grc\">πᾶς λόγος σαπρὸς ἐκ τοῦ στόματος ὑμῶν μὴ ἐκπορευέσθω, ἀλλὰ εἴ τις ἀγαθὸς πρὸς οἰκοδομὴν τῆς χρείας, ἵνα δῷ χάριν τοῖς ἀκούουσιν.</p><p lang=\"grc\">καὶ μὴ λυπεῖτε τὸ πνεῦμα τὸ ἅγιον τοῦ θεοῦ, ἐν ᾧ ἐσφραγίσθητε εἰς ἡμέραν ἀπολυτρώσεως.</p>","lit":"<p>那偷竊的，不要再偷，倒要勞苦，用自己的手做那美善的事，好使他有可以分給那有需要的人。</p><p>一切腐爛的話都不要從你們的口出來，倒要是那為了需要的造就而好的話，好叫它把恩典給那些聽的人。</p><p>也不要使神的那聖靈憂傷，你們在他裡面被蓋了印，直到救贖的日子。</p>","key":"<table><tr><th>原文</th><th>音譯</th><th>字面</th><th>在這裡</th></tr><tr><td>ὁ κλέπτων μηκέτι κλεπτέτω</td><td>ho kleptōn mēketi kleptetō</td><td>偷竊的不要再偷</td><td>現在分詞：習慣偷竊的人</td></tr><tr><td>κοπιάτω ἐργαζόμενος</td><td>kopiatō ergazomenos</td><td>要勞苦做工</td><td>κοπιάω：做到疲累</td></tr><tr><td>ἵνα ἔχῃ μεταδιδόναι</td><td>hina echē metadidonai</td><td>好使他有可分給人的</td><td>目標不是自足，是分享</td></tr><tr><td>λόγος σαπρὸς</td><td>logos sapros</td><td>腐爛的話</td><td>σαπρός：壞掉的魚、爛掉的果子</td></tr><tr><td>πρὸς οἰκοδομὴν τῆς χρείας</td><td>pros oikodomēn tēs chreias</td><td>為了需要的造就</td><td>追蹤字 οἰκοδομή 第三站</td></tr><tr><td>ἵνα δῷ χάριν</td><td>hina dō charin</td><td>好把恩典給人</td><td>話語也能「施恩」</td></tr><tr><td>μὴ λυπεῖτε</td><td>mē lypeite</td><td>不要使……憂傷</td><td>現在命令式；聖靈有位格</td></tr><tr><td>ἐσφραγίσθητε</td><td>esphragisthēte</td><td>你們被蓋了印</td><td>1:13 同一個動詞</td></tr></table>","gram":"<p><strong>4:28–30 延續三段式：不要偷，要做工，好分給人；不要說爛話，要說造就的話，好給人恩典；不要叫聖靈擔憂，因為你們受了祂的印記。</strong></p><p>ὁ κλέπτων（ho kleptōn） 是現在分詞，指仍在偷、習慣偷的人；保羅不只說 μηκέτι κλεπτέτω（mēketi kleptetō），還要求 κοπιάτω ἐργαζόμενος ταῖς ἰδίαις χερσὶν（kopiatō ergazomenos tais idiais chersin）——用自己的手勞苦做工。目的子句 ἵνα ἔχῃ μεταδιδόναι τῷ χρείαν ἔχοντι（hina echē metadidonai tō chreian echonti） 把倫理推到最高：從拿取別人的，變成給予別人的。</p><p>4:29 的 σαπρός（sapros） 用來形容壞樹的壞果子（太 7:17 同一個字）。與它對照的是 ἀγαθὸς πρὸς οἰκοδομὴν τῆς χρείας（agathos pros oikodomēn tēs chreias）：追蹤字 οἰκοδομή（oikodomē） 第三次出現（4:12、16、29），身體的建造落到一句話上。ἵνα δῷ χάριν（hina dō charin）：話語可以「給恩典」。</p><p>4:30 μὴ λυπεῖτε τὸ πνεῦμα τὸ ἅγιον τοῦ θεοῦ（mē lypeite to pneuma to hagion tou theou）：λυπέω（lypeō） 是使人憂傷，只能用在有位格的對象上。這使我們想起賽 63:10「他們竟悖逆，使主的聖靈擔憂」（賽 63:10）。ἐν ᾧ ἐσφραγίσθητε（en hō esphragisthēte） 是不定過去式，回到 1:13：印記已經蓋上，εἰς ἡμέραν ἀπολυτρώσεως（eis hēmeran apolytrōseōs），直到得贖的日子。</p>","exp":"<p><strong>「從前偷竊的，不要再偷；總要勞力，親手做正經事，就可有餘分給那缺少的人。」（4:28）新人的改變，不只是停止壞事，而是方向倒轉。</strong></p><p>一個小偷不偷了，還只是一個失業的人；他開始勞力做工，是一個誠實的人；他做工是為了分給缺乏的人，才是一個新人。從「拿」到「給」，這是福音在一個人的錢包上留下的痕跡。對今天的職場也是一樣：工作不只是為了養活自己，也是為了能夠祝福人。</p><p>話語也是如此。「污穢的言語一句不可出口，只要隨事說造就人的好話，叫聽見的人得益處。」（4:29）爛話像壞掉的食物，吃下去會病；好話像及時的一碗湯，「隨事」就是看對方此刻需要甚麼。一句話可以建造一個肢體，也可以拆毀一個人。</p><p>然後保羅放進一句很溫柔的話：「不要叫神的聖靈擔憂」（4:30）。聖靈不是一股能力，而是一位會傷心的朋友。前後文說明了甚麼事讓祂擔憂：謊言、含怒、偷竊、爛話、苦毒——全是人際關係的破口。聖靈有情感嗎？議題頁會展開；經文的語氣已經告訴我們，祂是一位與我們同住、會因我們傷害彼此而憂傷的神。</p><p>但同一句話也說「你們原是受了他的印記」。聖靈擔憂，卻不離開；印記蓋上了，就一直蓋到得贖的日子。我們不是因為怕被丟棄而不叫祂擔憂，而是因為被這樣愛著，不忍叫祂傷心。</p>"},{"a":31,"z":32,"star":2,"grk":"<p lang=\"grc\">πᾶσα πικρία καὶ θυμὸς καὶ ὀργὴ καὶ κραυγὴ καὶ βλασφημία ἀρθήτω ἀφʼ ὑμῶν σὺν πάσῃ κακίᾳ.</p><p lang=\"grc\">γίνεσθε εἰς ἀλλήλους χρηστοί, εὔσπλαγχνοι, χαριζόμενοι ἑαυτοῖς καθὼς καὶ ὁ θεὸς ἐν Χριστῷ ἐχαρίσατο ὑμῖν</p>","lit":"<p>一切苦毒、暴怒、忿怒、喧嚷、毀謗，都要從你們身上被除去，連同一切惡毒（或譯：陰毒）。</p><p>你們要彼此成為恩慈的、心腸柔軟的，彼此饒恕，正如神在基督裡也饒恕了你們。</p>","key":"<table><tr><th>原文</th><th>音譯</th><th>字面</th><th>在這裡</th></tr><tr><td>πικρία</td><td>pikria</td><td>苦毒</td><td>內裡的苦汁，清單的第一項</td></tr><tr><td>θυμὸς καὶ ὀργὴ</td><td>thymos kai orgē</td><td>暴怒和忿怒</td><td>一陣爆發與長存的怒氣</td></tr><tr><td>κραυγὴ καὶ βλασφημία</td><td>kraugē kai blasphēmia</td><td>喧嚷和毀謗</td><td>從心裡走到嘴上</td></tr><tr><td>ἀρθήτω</td><td>arthētō</td><td>要被除掉</td><td>不定過去式被動命令</td></tr><tr><td>χρηστοί</td><td>chrēstoi</td><td>恩慈的</td><td>可以用、對人有益的</td></tr><tr><td>εὔσπλαγχνοι</td><td>eusplanchnoi</td><td>心腸柔軟的</td><td>字面是「好的內臟」</td></tr><tr><td>χαριζόμενοι ἑαυτοῖς</td><td>charizomenoi heautois</td><td>彼此饒恕</td><td>χαρίζομαι：施恩、白白給</td></tr><tr><td>ἐχαρίσατο</td><td>echarisato</td><td>他饒恕了</td><td>不定過去式：神在基督裡已經做了</td></tr></table>","gram":"<p><strong>4:31 列了六樣要除掉的，4:32 列了三樣要穿上的；最後一個比較子句 καθὼς καὶ（kathōs kai） 把一切都放在神的饒恕底下。</strong></p><p>六項的次序像一條從裡到外的路：先是 πικρία（pikria），心裡的苦汁；再是 θυμὸς καὶ ὀργὴ（thymos kai orgē），一陣爆發的暴怒與長存的忿怒；然後 κραυγὴ καὶ βλασφημία（kraugē kai blasphēmia），怒氣上了嘴，成了喧嚷與毀謗；最後總括為 σὺν πάσῃ κακίᾳ（syn pasē kakia），一切惡毒（cu89t 註：或譯陰毒）。ἀρθήτω（arthētō） 是不定過去式被動命令：讓它們被拿走，斷然地。</p><p>4:32 用 γίνεσθε（ginesthe）「要成為」帶出三個詞：χρηστοί（chrēstoi）、εὔσπλαγχνοι（eusplanchnoi）、χαριζόμενοι ἑαυτοῖς（charizomenoi heautois）。χαρίζομαι（charizomai） 與 χάρις（charis） 同字根，饒恕就是「施恩」：給對方他不配得的。學者觀察到 χρηστοί（chrēstoi） 與 Χριστός（Christos） 在當時讀音相近，初期信徒可能聽得出這個呼應。</p><p>καθὼς καὶ ὁ θεὸς ἐν Χριστῷ ἐχαρίσατο ὑμῖν（kathōs kai ho theos en Christō echarisato hymin）：καθὼς（kathōs） 同時是標準與理由——照著神饒恕的樣式，也因為神已經饒恕了。ἐχαρίσατο（echarisato） 是不定過去式，指十字架上完成的事。西 3:13 有同樣的話：「主怎樣饒恕了你們，你們也要怎樣饒恕人」（西 3:13）。5:1–2 緊接著說「效法神」「憑愛心行事」。</p>","exp":"<p><strong>「一切苦毒、惱恨、忿怒、嚷鬧、毀謗，並一切的惡毒，都當從你們中間除掉」（4:31）——苦毒是含怒過夜長出來的。</strong></p><p>4:26 說不可含怒到日落，4:31 讓我們看見若過了日落會怎樣：怒氣沉下去，變成苦毒；苦毒發酵，變成爆發的惱恨與長存的忿怒；然後上了嘴，變成嚷鬧與毀謗。保羅要我們在第一站就處理，不要等到它長成一整片荊棘。</p><p>取代它們的是：「並要以恩慈相待，存憐憫的心，彼此饒恕，正如神在基督裡饒恕了你們一樣。」（4:32）饒恕的力量不是來自我們心胸寬大，而是來自我們被饒恕過。一個知道自己欠了一萬兩銀子被免了的人，才放得下別人欠他的十兩。</p><p>但這一節必須讀清楚，因為它常被拿來傷害受傷的人。饒恕與和好不是同一件事。饒恕是放下報復的權利，把審判交給神，可以單方面在神面前開始，也可能需要很長的時間；和好是關係的恢復，需要對方真實的悔改，也需要安全。主耶穌說：「若是你的弟兄得罪你，就勸戒他；他若懊悔，就饒恕他。」（路 17:3）一位受暴的姊妹被要求「你要饒恕他，所以今天就回家」，這不是 4:32，是第二次傷害。先保護人的安全，饒恕可以在安全的地方慢慢發生；本講義回指哥林多後書立場四。</p><p>321 的「920」裡，那個「2」，就是我要以恩慈相待的人。這一節是 920 的原型：恩慈、憐憫、饒恕，三樣都從「神在基督裡饒恕了你們」流出來。舊人含怒過夜，新人在日落前把怒氣帶到神面前；舊人記帳，新人想起自己的帳已經被十字架付清了。第 5 章會從這裡接下去：「所以，你們該效法神」（5:1）。</p>"}],"5":[{"a":1,"z":2,"star":3,"grk":"<p lang=\"grc\">γίνεσθε οὖν μιμηταὶ τοῦ θεοῦ, ὡς τέκνα ἀγαπητά,</p><p lang=\"grc\">καὶ περιπατεῖτε ἐν ἀγάπῃ, καθὼς καὶ ὁ Χριστὸς ἠγάπησεν ἡμᾶς καὶ παρέδωκεν ἑαυτὸν ὑπὲρ ἡμῶν προσφορὰν καὶ θυσίαν τῷ θεῷ εἰς ὀσμὴν εὐωδίας.</p>","lit":"<p>所以你們要成為神的效法者，像蒙愛的兒女，</p><p>並且要在愛中行走，正如基督也愛了我們，並且為我們把自己交出去，作為獻給神的供物和祭物，成為馨香的氣味。</p>","key":"<table><tr><th>原文</th><th>音譯</th><th>字面</th><th>在這裡</th></tr><tr><td>γίνεσθε οὖν</td><td>ginesthe oun</td><td>所以你們要成為</td><td>οὖν 接回 4:32 神在基督裡的饒恕</td></tr><tr><td>μιμηταὶ τοῦ θεοῦ</td><td>mimētai tou theou</td><td>神的效法者</td><td>保羅書信唯一一次直說效法神</td></tr><tr><td>τέκνα ἀγαπητά</td><td>tekna agapēta</td><td>蒙愛的兒女</td><td>效法的根據：先是被愛的孩子</td></tr><tr><td>περιπατεῖτε ἐν ἀγάπῃ</td><td>peripateite en agapē</td><td>要在愛中行走</td><td>4:1 起「行」的第三個命令</td></tr><tr><td>παρέδωκεν ἑαυτὸν</td><td>paredōken heauton</td><td>把自己交出去</td><td>不定過去式：十字架；5:25 再用一次</td></tr><tr><td>ὀσμὴν εὐωδίας</td><td>osmēn euōdias</td><td>馨香之氣</td><td>七十士譯本燔祭蒙悅納的用語</td></tr></table>","gram":"<p><strong>5:1 的 οὖν（oun） 接回上一節：「正如神在基督裡饒恕了你們一樣。」（4:32）效法神，就從饒恕開始。</strong></p><p>γίνεσθε（ginesthe） 是現在命令式，「要一直成為」。μιμηταὶ τοῦ θεοῦ（mimētai tou theou） 在保羅書信中只此一次——他常說「效法我」（林前 4:16；11:1），這裡卻直接把標竿放在神身上。ὡς τέκνα ἀγαπητά（hōs tekna agapēta） 是效法的根據：不是學徒模仿師傅，是孩子像父親。ἀγαπητά（agapēta） 是「蒙愛的」，帶著被動的意味：先被愛，才效法。</p><p>第 2 節的 καὶ（kai） 把效法具體化成 περιπατεῖτε ἐν ἀγάπῃ（peripateite en agapē）。περιπατέω（peripateō） 是本卷「行」的追蹤字：2:2、2:10 寫從前與預備，從 4:1 起轉成命令（4:1、4:17、5:2、5:8、5:15），撐起第 4–5 章。καθὼς καὶ（kathōs kai） 同時帶出榜樣與根據：基督的愛既是尺度，也是動力。ἠγάπησεν（ēgapēsen） 與 παρέδωκεν（paredōken） 都是不定過去式，指向十字架那一次的成就。προσφορὰν καὶ θυσίαν（prosphoran kai thysian） 是「供物和祭物」的雙詞，ὀσμὴν εὐωδίας（osmēn euōdias） 是七十士譯本描寫燔祭蒙悅納的固定說法（這使我們想起利 1:9；出 29:18）。5:25 會用同一組動詞說丈夫：ἠγάπησεν（ēgapēsen）……ἑαυτὸν παρέδωκεν（heauton paredōken）。全章首尾，由同一個捨己的愛扣住。</p>","exp":"<p><strong>「所以，你們該效法神，好像蒙慈愛的兒女一樣。」（5:1）這是新約裡最大膽的一句命令，也是最溫柔的一句。</strong></p><p>大膽，因為對象是神。保羅沒有說效法某位屬靈偉人，也沒有說遵守一套規矩；他把標竿放到最高。溫柔，因為理由不是「你做得到」，而是「你是被愛的孩子」。小孩學爸爸走路，不是因為讀了說明書，是因為天天跟在他身邊。效法神的人，先是被神抱過的人。</p><p>效法甚麼？上一節剛說完：神在基督裡饒恕了你們。效法神，第一件事是像神那樣饒恕人。接著保羅說得更具體：「也要憑愛心行事，正如基督愛我們，為我們捨了自己」（5:2）。神是怎樣的？看十字架就知道。愛不是一種感覺，是一個動作：把自己交出去。</p><p>「行事」原文是行走。從 4:1 起，保羅一再用這個字：與蒙召的恩相稱地行（4:1），不再像外邦人那樣行（4:17），在愛中行（5:2），像光明的子女行（5:8），謹慎地行（5:15）。前三章是坐，坐在基督所成就的裡面；從這裡起是行，一步一步把那個身分走出來。先坐，才會行。</p><p>「馨香的供物和祭物」借用舊約燔祭的語言：祭物在壇上燒盡，香氣上升，神就悅納。基督的捨己是那一次完全的祭；我們的愛是從那裡流出來的回應（這使我們想起羅 12:1；腓 4:18）。321 所說的「捨己」，就以這一節為榜樣：不是先求自己被愛夠了才去愛，是因為已經被愛，所以能捨。</p><p>這兩節也替全章定了調。5:25 會用幾乎一樣的字眼對丈夫說話：「正如基督愛教會，為教會捨己。」（5:25）整章從效法神的愛開始，在夫妻的愛裡收尾；家裡的每一條命令，都要放回這一節來讀。</p>"},{"a":3,"z":4,"star":2,"grk":"<p lang=\"grc\">Πορνεία δὲ καὶ ἀκαθαρσία πᾶσα ἢ πλεονεξία μηδὲ ὀνομαζέσθω ἐν ὑμῖν, καθὼς πρέπει ἁγίοις,</p><p lang=\"grc\">καὶ αἰσχρότης καὶ μωρολογία ἢ εὐτραπελία, ἃ οὐκ ἀνῆκεν, ἀλλὰ μᾶλλον εὐχαριστία.</p>","lit":"<p>至於淫亂和一切污穢或貪婪，在你們中間連被提名都不可，正如合乎聖徒的，</p><p>還有可恥的事、愚妄的話或下流的俏皮話，這些是不相宜的，反倒要感謝。</p>","key":"<table><tr><th>原文</th><th>音譯</th><th>字面</th><th>在這裡</th></tr><tr><td>Πορνεία</td><td>porneia</td><td>淫亂</td><td>一切婚姻盟約以外的性關係</td></tr><tr><td>ἀκαθαρσία πᾶσα</td><td>akatharsia pasa</td><td>一切污穢</td><td>4:19 已與貪婪並列</td></tr><tr><td>πλεονεξία</td><td>pleonexia</td><td>貪婪</td><td>「要得更多」：對性、對錢都適用</td></tr><tr><td>μηδὲ ὀνομαζέσθω</td><td>mēde onomazesthō</td><td>連提都不可</td><td>現在命令式被動：不要讓它被當成名號叫出來</td></tr><tr><td>εὐτραπελία</td><td>eutrapelia</td><td>戲笑的話</td><td>原是「機靈」，在這裡是下流的雙關</td></tr><tr><td>εὐχαριστία</td><td>eucharistia</td><td>感謝</td><td>與前一個字聲音相呼的對照</td></tr></table>","gram":"<p><strong>5:3 的 δὲ（de） 是轉折：上一節是基督的捨己，這一節是人的貪取。愛是給出去，淫亂與貪婪是拿過來。</strong></p><p>Πορνεία δὲ καὶ ἀκαθαρσία πᾶσα ἢ πλεονεξία（Porneia de kai akatharsia pasa ē pleonexia）：三個名詞，前兩個屬於性的範圍，第三個 πλεονεξία（pleonexia） 字面是「要得更多」。4:19 已經把它與污穢連在一起：「良心既然喪盡，就放縱私慾，貪行種種的污穢。」（4:19）「貪行」原文正是 ἐν πλεονεξίᾳ（en pleonexia）。學者觀察到，πλεονεξία（pleonexia） 在這裡可能特指性上的貪求，侵佔別人的配偶（帖前 4:6），也可能泛指一切貪得；5:5 把貪心等同拜偶像，看來兩者都包括在內。μηδὲ ὀνομαζέσθω（mēde onomazesthō） 是現在命令式被動，語氣誇張：不只是「不要去做」，而是「連被提名都不可」。καθὼς πρέπει ἁγίοις（kathōs prepei hagiois） 給出理由：這不合聖徒的身分。</p><p>第 4 節列出三種話：αἰσχρότης（aischrotēs） 是可恥的事，μωρολογία（mōrologia） 是愚妄的話，εὐτραπελία（eutrapelia） 是輕佻、下流的俏皮話。ἃ οὐκ ἀνῆκεν（ha ouk anēken） 說它們不相宜。然後是 ἀλλὰ μᾶλλον εὐχαριστία（alla mallon eucharistia）——εὐτραπελία（eutrapelia） 與 εὐχαριστία（eucharistia） 字形相近、聲音相呼，保羅用一個文字遊戲，把舌頭轉了方向。</p>","exp":"<p><strong>保羅談性與錢，不繞彎子；他要的不是更委婉的說法，是一個不一樣的群體氣氛。</strong></p><p>「至於淫亂並一切污穢，或是貪婪，在你們中間連提都不可，方合聖徒的體統。」（5:3）「連提都不可」不是說教會不能談性、不能指出罪；保羅自己現在就在談。意思是：這些事不可以在你們中間成為一個「名號」——不可以被當成正常，被當成取樂的話題，被默許成大家都在做的事。以弗所城有亞底米神廟，宗教與情慾糾纏在一起；在那樣的城市裡，教會要成為一個連空氣都不一樣的地方。</p><p>把貪婪放在淫亂旁邊，是保羅的洞見。兩者的根是同一個：要更多，要不屬於我的。今天的教會，對淫亂常常很警覺，對貪婪卻很寬容；有人用投資與房價填滿團契時間，有人為了多賺一點把家人與聚會都擠掉，大家不覺得有甚麼不對。保羅把兩者寫在同一行。</p><p>第 4 節轉到舌頭：「淫詞、妄語，和戲笑的話都不相宜；總要說感謝的話。」（5:4）保羅不是反對幽默，他反對的是以貶低人、挑逗人為樂的笑話。取代的辦法不是沉默，是感謝。一個常常感謝的人，很難同時用話語去佔有、去貶低；因為感謝承認一切都是領受的，貪婪卻以為一切都該是我的。5:20 會再回到感謝：被聖靈充滿的人，「凡事要奉我們主耶穌基督的名常常感謝父神」（5:20）。</p>"},{"a":5,"z":7,"star":1,"grk":"<p lang=\"grc\">τοῦτο γὰρ ἴστε γινώσκοντες ὅτι πᾶς πόρνος ἢ ἀκάθαρτος ἢ πλεονέκτης, ὅ ἐστιν εἰδωλολάτρης, οὐκ ἔχει κληρονομίαν ἐν τῇ βασιλείᾳ τοῦ Χριστοῦ καὶ θεοῦ.</p><p lang=\"grc\">Μηδεὶς ὑμᾶς ἀπατάτω κενοῖς λόγοις, διὰ ταῦτα γὰρ ἔρχεται ἡ ὀργὴ τοῦ θεοῦ ἐπὶ τοὺς υἱοὺς τῆς ἀπειθείας.</p><p lang=\"grc\">μὴ οὖν γίνεσθε συμμέτοχοι αὐτῶν·</p>","lit":"<p>因為這一點你們要知道、認清：凡淫亂的、或污穢的、或貪婪的——這就是拜偶像的——在基督和神的國裡沒有產業。</p><p>不要讓任何人用空洞的話欺騙你們；因為由於這些事，神的忿怒正臨到悖逆之子身上。</p><p>所以你們不要成為他們的同夥；</p>","key":"<table><tr><th>原文</th><th>音譯</th><th>字面</th><th>在這裡</th></tr><tr><td>ἴστε γινώσκοντες</td><td>iste ginōskontes</td><td>你們要知道、認清</td><td>兩個「知道」疊在一起，加重語氣</td></tr><tr><td>πλεονέκτης</td><td>pleonektēs</td><td>貪心的人</td><td>與 5:3 的貪婪同字根</td></tr><tr><td>εἰδωλολάτρης</td><td>eidōlolatrēs</td><td>拜偶像的</td><td>貪心是把東西放在神的位置上</td></tr><tr><td>κληρονομίαν</td><td>klēronomian</td><td>產業</td><td>1:14 聖靈是得基業的憑據</td></tr><tr><td>κενοῖς λόγοις</td><td>kenois logois</td><td>空洞的話</td><td>聽起來有道理，裡面沒有東西</td></tr><tr><td>συμμέτοχοι</td><td>symmetochoi</td><td>同夥</td><td>3:6 外邦人同蒙應許，用的是同一個字</td></tr></table>","gram":"<p><strong>5:5 以 γὰρ（gar） 解釋上文為甚麼「連提都不可」；ἴστε γινώσκοντες（iste ginōskontes） 是兩個「知道」的疊用，像在說：你們要知道，而且清清楚楚地知道。</strong></p><p>這一節的 ὅτι（hoti） 在 SBLGNT 原檔被轉檔拆壞，本講義的原文欄已修回。三類人與 5:3 的三個名詞一一對應：πόρνος（pornos） 對 Πορνεία（Porneia），ἀκάθαρτος（akathartos） 對 ἀκαθαρσία（akatharsia），πλεονέκτης（pleonektēs） 對 πλεονεξία（pleonexia）。關係子句 ὅ ἐστιν εἰδωλολάτρης（ho estin eidōlolatrēs） 只掛在最後一個字上：貪心的人就是拜偶像的人（並見西 3:5）。ἐν τῇ βασιλείᾳ τοῦ Χριστοῦ καὶ θεοῦ（en tē basileia tou Christou kai theou） 用一個冠詞統管基督和神，基督與神同有一個國度。</p><p>第 6 節 Μηδεὶς ὑμᾶς ἀπατάτω（Mēdeis hymas apatatō） 是第三人稱命令式：「不要讓任何人欺騙你們」。τοὺς υἱοὺς τῆς ἀπειθείας（tous hyious tēs apeitheias） 回指 2:2 的悖逆之子；ἔρχεται（erchetai） 是現在式，忿怒正在臨到。第 7 節 μὴ οὖν γίνεσθε συμμέτοχοι αὐτῶν（mē oun ginesthe symmetochoi autōn）：οὖν（oun） 收結，所以不要成為他們的同夥。</p>","exp":"<p><strong>「有貪心的，就與拜偶像的一樣。」（5:5）這句話把一個很體面的罪，放進一個很難看的類別裡。</strong></p><p>拜偶像，在以弗所人心裡是很具體的畫面：亞底米的神像，銀匠做的小神龕（徒 19:24）。保羅說，貪心也是這一類。偶像不一定是一尊像；凡是你盼望它給你安全、意義與快樂，以致取代了神的，都是偶像。一個人不燒香，卻天天為帳戶的數字焦慮、興奮，他其實也在拜。主耶穌說：「你們不能又事奉神，又事奉瑪門。」（太 6:24）</p><p>「在基督和神的國裡都是無分的」（5:5）讀起來很重。要讀清楚：保羅不是說一個基督徒曾經跌倒在這些罪裡，就永遠失去救恩；他說的是以這些為生活方式、不肯悔改的人，他們的方向不在神的國裡。這正是 2:1–3 的「從前」：那是我們從前的樣子，不再是如今的樣子。</p><p>「不要被人虛浮的話欺哄」（5:6）。虛浮的話往往說得很漂亮：神是愛，不會在意這些；時代不一樣了。保羅說，神的忿怒必臨到悖逆之子；神的愛從來不是對罪的放任。所以「你們不要與他們同夥」（5:7）。這不是叫人離開世界，而是不要在罪上合夥。</p>"},{"a":8,"z":10,"star":3,"grk":"<p lang=\"grc\">ἦτε γάρ ποτε σκότος, νῦν δὲ φῶς ἐν κυρίῳ· ὡς τέκνα φωτὸς περιπατεῖτε,</p><p lang=\"grc\">ὁ γὰρ καρπὸς τοῦ φωτὸς ἐν πάσῃ ἀγαθωσύνῃ καὶ δικαιοσύνῃ καὶ ἀληθείᾳ,</p><p lang=\"grc\">δοκιμάζοντες τί ἐστιν εὐάρεστον τῷ κυρίῳ·</p>","lit":"<p>因為你們從前是黑暗，但如今在主裡是光；要像光的兒女行走，</p><p>因為光的果子在於一切良善、公義和真實之中，</p><p>察驗甚麼是主所喜悅的；</p>","key":"<table><tr><th>原文</th><th>音譯</th><th>字面</th><th>在這裡</th></tr><tr><td>ἦτε γάρ ποτε σκότος</td><td>ēte gar pote skotos</td><td>你們從前是黑暗</td><td>不是「在」黑暗裡，是「是」黑暗</td></tr><tr><td>νῦν δὲ φῶς ἐν κυρίῳ</td><td>nyn de phōs en kyriō</td><td>如今在主裡是光</td><td>從前／如今；光的來源是在主裡</td></tr><tr><td>τέκνα φωτὸς</td><td>tekna phōtos</td><td>光的兒女</td><td>希伯來式說法：帶著光的性質</td></tr><tr><td>ὁ καρπὸς τοῦ φωτὸς</td><td>ho karpos tou phōtos</td><td>光的果子</td><td>單數：一個果子，三種滋味</td></tr><tr><td>δοκιμάζοντες</td><td>dokimazontes</td><td>察驗</td><td>試驗金屬的字：驗過、認可</td></tr><tr><td>εὐάρεστον</td><td>euareston</td><td>所喜悅的</td><td>羅 12:2 同一組字</td></tr></table>","gram":"<p><strong>5:8 的 γάρ（gar） 說明上文「不要與他們同夥」的理由：因為你們已經不是從前那樣的人了。</strong></p><p>ἦτε γάρ ποτε σκότος（ēte gar pote skotos）, νῦν δὲ φῶς ἐν κυρίῳ（nyn de phōs en kyriō）——兩個述語都是名詞：不是「你們從前在黑暗裡」，是「你們從前是黑暗」；不是「你們如今在光中」，是「你們如今是光」。ποτε（pote）……νῦν δὲ（nyn de） 是本卷從前與如今的對照（2:1–6；2:13；2:19），在這裡最尖銳。ἐν κυρίῳ（en kyriō） 限定了光的來源：光不是我們的本性，是在主裡得的。接著才是命令：ὡς τέκνα φωτὸς περιπατεῖτε（hōs tekna phōtos peripateite）。直說在前，命令在後。</p><p><strong>◆ 經文鑑別 5:9。</strong>SBLGNT、NA28 讀 ὁ γὰρ καρπὸς τοῦ φωτὸς（ho gar karpos tou phōtos），「光的果子」，有西奈抄本、亞歷山大抄本、梵蒂岡抄本等早期抄本支持；拜占庭傳統（RP）讀 πνεύματος（pneumatos），「聖靈的果子」。和合本「光明所結的果子」跟批判本。判斷：φωτὸς（phōtos） 較可取。上下文一路都在講光（5:8、13、14），而 πνεύματος（pneumatos） 很可能是抄寫者受加 5:22 ὁ δὲ καρπὸς τοῦ πνεύματος（ho de karpos tou pneumatos） 的影響改的。所以這一節不是加 5:22；保羅在這裡說的是光所結的果子。</p><p>第 9 節是插入句，第 10 節的分詞 δοκιμάζοντες（dokimazontes） 接回第 8 節的 περιπατεῖτε（peripateite）：光明的子女怎樣行？一面走，一面察驗。δοκιμάζω（dokimazō） 原指試驗金屬，驗過而後認可；羅 12:2 同樣把察驗與喜悅放在一起。</p>","exp":"<p>〔加〕加 5:22--23（加拉太書講義第 5 章）</p><p><strong>「從前你們是暗昧的，但如今在主裡面是光明的，行事為人就當像光明的子女。」（5:8）不是換了環境，是換了本質。</strong></p><p>保羅不說「從前你們在黑暗裡」，他說「你們是黑暗」。黑暗不只是外面的環境，是我們裡面的樣子。同樣，如今不只是走到光裡，而是「是光」。這是 2:1–6 再說一遍：從前是死人，如今與基督一同活過來。這也是 321 所說舊人與新人的分界（4:22–24）：基督徒不是一個努力發光的黑暗，而是一個已經被點亮、要學會照亮的人。</p><p>可是要留意「在主裡面」四個字。光不是我們自己的。月亮會亮，是因為對著太陽；人一轉身背向主，就又暗下去。主耶穌說：「我是世界的光。跟從我的，就不在黑暗裡走，必要得著生命的光。」（約 8:12）我們是光，因為他是光。</p><p>光明所結的果子是「一切良善、公義、誠實」（5:9）。本系列加拉太書講義第 5 章講過「聖靈所結的果子」（加 5:22）：那裡是九樣，這裡是三樣，都是單數的果子，都是生命自然長出來的，不是釘上去的裝飾。良善是對人的，公義是對事的，誠實是對真理的。一個人在辦公室不作假帳、在家裡不說兩套話、在教會不假裝屬靈，就是光在結果子。</p><p>「總要察驗何為主所喜悅的事。」（5:10）光明的子女不是靠一本規則手冊過日子，而是一面走、一面問：主喜悅的是甚麼？很多事經文沒有明文規定：看甚麼節目、怎麼用錢、怎麼回應同事。察驗就是把這些事拿到主面前試一試。這需要一顆被更新的心（羅 12:2），也需要群體一起分辨。</p>"},{"a":11,"z":13,"star":1,"grk":"<p lang=\"grc\">καὶ μὴ συγκοινωνεῖτε τοῖς ἔργοις τοῖς ἀκάρποις τοῦ σκότους, μᾶλλον δὲ καὶ ἐλέγχετε,</p><p lang=\"grc\">τὰ γὰρ κρυφῇ γινόμενα ὑπʼ αὐτῶν αἰσχρόν ἐστιν καὶ λέγειν·</p><p lang=\"grc\">τὰ δὲ πάντα ἐλεγχόμενα ὑπὸ τοῦ φωτὸς φανεροῦται,</p>","lit":"<p>也不要參與黑暗那些不結果子的作為，反倒更要揭露它們；</p><p>因為那些被他們暗中所行的事，就是說出來也是可恥的；</p><p>但一切被揭露的事，都被光顯明出來，</p>","key":"<table><tr><th>原文</th><th>音譯</th><th>字面</th><th>在這裡</th></tr><tr><td>μὴ συγκοινωνεῖτε</td><td>mē synkoinōneite</td><td>不要參與</td><td>一起入股、合夥</td></tr><tr><td>τοῖς ἀκάρποις</td><td>tois akarpois</td><td>不結果子的</td><td>對照 5:9 光的果子</td></tr><tr><td>ἐλέγχετε</td><td>elenchete</td><td>揭露、責備</td><td>把隱藏的拉到光底下</td></tr><tr><td>κρυφῇ</td><td>kryphē</td><td>暗中</td><td>與被顯明相對</td></tr><tr><td>φανεροῦται</td><td>phaneroutai</td><td>被顯明</td><td>現在式被動</td></tr></table>","gram":"<p><strong>5:11 用對照組收束上文：光有 καρπὸς（karpos），黑暗只有 ἔργοις τοῖς ἀκάρποις（ergois tois akarpois），不結果子的作為。</strong></p><p>μὴ συγκοινωνεῖτε（mē synkoinōneite） 是現在命令式，「不要一起入夥」，呼應 5:7 的 συμμέτοχοι（symmetochoi）。μᾶλλον δὲ καὶ ἐλέγχετε（mallon de kai elenchete）：「反倒更要揭露」。ἐλέγχω（elenchō） 可以是口頭的責備，也可以是光把東西照出來；5:13 τὰ δὲ πάντα ἐλεγχόμενα ὑπὸ τοῦ φωτὸς φανεροῦται（ta de panta elenchomena hypo tou phōtos phaneroutai） 顯示後者是主調：揭露的主體是光。第 12 節的 γὰρ（gar） 交代理由：τὰ γὰρ κρυφῇ γινόμενα ὑπʼ αὐτῶν（ta gar kryphē ginomena hyp' autōn） 連說出來都可恥。κρυφῇ（kryphē） 與 φανεροῦται（phaneroutai） 是一組反義字，整段在藏與顯之間擺動。</p>","exp":"<p><strong>「那暗昧無益的事，不要與人同行，倒要責備行這事的人」（5:11）——光有兩種反應：不參與，也不裝作看不見。</strong></p><p>「無益」原文是不結果子。黑暗的事看起來熱鬧，最後甚麼也長不出來。保羅給的第一個命令是消極的：不要入股，不要合夥。第二個是積極的：要揭露。</p><p>揭露不是到處去抓別人的錯。「凡事受了責備，就被光顯明出來」（5:13），主角是光。基督徒最有力的揭露，常常不是指責，而是活出另一種樣子：當全辦公室都在灌水報銷，有一個人照實報，帳目的黑暗就被照出來了。主耶穌說：「凡作惡的便恨光，並不來就光，恐怕他的行為受責備。」（約 3:20）</p><p>「他們暗中所行的，就是提起來也是可恥的」（5:12），所以講台不需要繪聲繪影地描述罪，讓解經變成另一種八卦。但必要時也要指名不義：教會裡的性侵、財務舞弊，不可以為了面子掩蓋；把事情帶到光中，交給該處理的人處理，是保護受害者，也是保護教會。</p>"},{"a":14,"z":14,"star":2,"grk":"<p lang=\"grc\">πᾶν γὰρ τὸ φανερούμενον φῶς ἐστιν. διὸ λέγει· Ἔγειρε, ὁ καθεύδων, καὶ ἀνάστα ἐκ τῶν νεκρῶν, καὶ ἐπιφαύσει σοι ὁ Χριστός.</p>","lit":"<p>因為凡被顯明的就是光。所以他說：醒起來，那睡著的人，從死人中站起來，基督就要照亮你。</p>","key":"<table><tr><th>原文</th><th>音譯</th><th>字面</th><th>在這裡</th></tr><tr><td>διὸ λέγει</td><td>dio legei</td><td>所以他說</td><td>沒有主詞；4:8 引詩篇也用這兩個字</td></tr><tr><td>Ἔγειρε</td><td>Egeire</td><td>醒起來</td><td>現在命令式</td></tr><tr><td>ὁ καθεύδων</td><td>ho katheudōn</td><td>那睡著的人</td><td>現在分詞：正睡著</td></tr><tr><td>ἀνάστα ἐκ τῶν νεκρῶν</td><td>anasta ek tōn nekrōn</td><td>從死人中站起來</td><td>復活的語言，回指 2:5–6</td></tr><tr><td>ἐπιφαύσει</td><td>epiphausei</td><td>要照亮</td><td>新約只出現這一次</td></tr></table>","gram":"<p><strong>5:14 上半 πᾶν γὰρ τὸ φανερούμενον φῶς ἐστιν（pan gar to phaneroumenon phōs estin） 是上一段的收結，和合本把它併入 5:13 翻譯：凡被光照出來的，自己也成了光。</strong></p><p>下半以 διὸ λέγει（dio legei） 引出三行韻文：Ἔγειρε（Egeire）／ὁ καθεύδων（ho katheudōn）／καὶ ἀνάστα ἐκ τῶν νεκρῶν（kai anasta ek tōn nekrōn）／καὶ ἐπιφαύσει σοι ὁ Χριστός（kai epiphausei soi ho Christos）。λέγει（legei） 沒有主詞，和合本補上「主」。同樣的引語在 4:8 用來引詩 68:18；但這裡舊約沒有一句完全相同的話。各家看法：有人認為是幾處以賽亞書經文的意譯（這使我們想起賽 26:19；60:1）；更多學者認為是早期教會的詩歌，可能在洗禮時吟唱，因為醒來、復活、光照正是洗禮的意象。本講義判斷：出處不明，最可能是早期教會的詩歌，不可說成舊約的應驗。三個動詞的次序很清楚：前兩個是命令，醒、起；最後一個是應許，照亮，而照亮的主詞是基督。</p>","exp":"<p><strong>「所以主說：你這睡著的人當醒過來，從死裡復活！基督就要光照你了。」（5:14）這可能是第一代信徒唱的歌。</strong></p><p>想像一場在以弗所的洗禮。一個從前拜亞底米的人從水裡起來，眾人唱：醒過來吧，睡著的人；從死裡起來吧；基督要照亮你。這段歌詞的來源我們不能確定，但它的內容完全是以弗所書的：2:1 說我們從前死在過犯罪惡之中，2:5 說神叫我們與基督一同活過來，5:8 說我們如今是光。這首歌把整封信唱成三行。</p><p>它放在這裡，是對信徒說的，不只是對外人說的。基督徒也會睡著：不是失去救恩，而是對罪變得麻木，對光變得遲鈍。屬靈的打瞌睡最危險的地方在於，睡著的人不知道自己睡著了。所以需要有人喊一聲。</p><p>注意次序：醒過來、站起來，然後基督光照你。人要醒來，光卻不是自己產生的。這也回答了上一段的難處：揭露黑暗的力量從哪裡來？從基督的光照來。被照過的人，才能照別人。</p><p>這一節的出處，議題頁會陳列各家；講台上只需一句：保羅引用一段大家熟悉的話，可能是當時教會的詩歌，這使我們想起以賽亞書「興起，發光」的呼召（賽 60:1）。</p>"},{"a":15,"z":17,"star":2,"grk":"<p lang=\"grc\">Βλέπετε οὖν ἀκριβῶς πῶς περιπατεῖτε, μὴ ὡς ἄσοφοι ἀλλʼ ὡς σοφοί,</p><p lang=\"grc\">ἐξαγοραζόμενοι τὸν καιρόν, ὅτι αἱ ἡμέραι πονηραί εἰσιν.</p><p lang=\"grc\">διὰ τοῦτο μὴ γίνεσθε ἄφρονες, ἀλλὰ συνίετε τί τὸ θέλημα τοῦ κυρίου·</p>","lit":"<p>所以你們要仔細看你們怎樣行走，不要像不智慧的人，而要像智慧的人，</p><p>把時機買回來，因為日子是邪惡的。</p><p>因此不要成為無知的人，而要明白主的旨意是甚麼。</p>","key":"<table><tr><th>原文</th><th>音譯</th><th>字面</th><th>在這裡</th></tr><tr><td>Βλέπετε οὖν ἀκριβῶς</td><td>Blepete oun akribōs</td><td>所以要仔細看</td><td>精確、一絲不苟</td></tr><tr><td>πῶς περιπατεῖτε</td><td>pōs peripateite</td><td>你們怎樣行走</td><td>第 4–5 章最後一個「行」</td></tr><tr><td>ἄσοφοι</td><td>asophoi</td><td>不智慧的</td><td>對照智慧的</td></tr><tr><td>ἐξαγοραζόμενοι τὸν καιρόν</td><td>exagorazomenoi ton kairon</td><td>把時機買回來</td><td>市場用語：搶購、贖回</td></tr><tr><td>ἄφρονες</td><td>aphrones</td><td>糊塗人</td><td>不用心思的人</td></tr><tr><td>συνίετε</td><td>syniete</td><td>明白</td><td>把事情合在一起看懂</td></tr></table>","gram":"<p><strong>5:15 的 οὖν（oun） 開出新的一段；περιπατεῖτε（peripateite） 在第 4–5 章最後一次出現，這次加上 ἀκριβῶς（akribōs），「仔細地」。</strong></p><p>Βλέπετε οὖν ἀκριβῶς πῶς περιπατεῖτε（Blepete oun akribōs pōs peripateite）：「要仔細看你們怎樣行」，看的是走路的方式。μὴ ὡς ἄσοφοι ἀλλʼ ὡς σοφοί（mē hōs asophoi all' hōs sophoi） 是對照組。第 16 節的分詞 ἐξαγοραζόμενοι τὸν καιρόν（exagorazomenoi ton kairon） 說明怎樣才算智慧：ἐξαγοράζω（exagorazō） 是市場用語，「買下、贖回」，加拉太書用它說基督贖出我們（加 3:13；4:5）；這裡是中間語態，為自己把時機買下。τὸν καιρόν（ton kairon） 不是一般的鐘點，是時機、機會（西 4:5 同一句話）。ὅτι αἱ ἡμέραι πονηραί εἰσιν（hoti hai hēmerai ponērai eisin） 給理由：日子是邪惡的，機會會被偷走。</p><p>第 17 節 διὰ τοῦτο（dia touto） 再推一步：μὴ γίνεσθε ἄφρονες（mē ginesthe aphrones）, ἀλλὰ συνίετε τί τὸ θέλημα τοῦ κυρίου（alla syniete ti to thelēma tou kyriou）。5:10 是察驗，5:17 是明白，光明的子女是用心思的人。</p>","exp":"<p><strong>「你們要謹慎行事，不要像愚昧人，當像智慧人。」（5:15）智慧不是知道很多，是走路的時候看得清楚。</strong></p><p>「要愛惜光陰」（5:16）原文是把時機買回來。這是市場的畫面：好東西擺出來，不搶就沒了。保羅的理由是「現今的世代邪惡」（5:16）——不是叫人悲觀，而是提醒：時間不是中性的，你不用，別的東西就會替你用掉。手機會用，焦慮會用，無止境的工作也會用。</p><p>買回來做甚麼？上下文告訴我們：做主所喜悅的事（5:10），明白主的旨意（5:17）。愛惜光陰不是把行事曆塞滿，而是把重要的時刻留給重要的事：和孩子吃一頓不看手機的飯，對一位慕道的同事說一句真誠的話，在一天開始時先安靜在主面前。保羅在另一封信用同一句話說待人：「你們要愛惜光陰，用智慧與外人交往。」（西 4:5）</p><p>「不要作糊塗人，要明白主的旨意如何。」（5:17）神的旨意不是藏起來讓人猜的謎語。大部分已經寫在經文裡：本章就說了效法神、憑愛心行事、遠離淫亂貪婪、被聖靈充滿。明白已經寫明的部分，再求聖靈在具體的選擇上引導，這是智慧人走路的方式。5:10 說察驗，這裡說明白，兩者都要人用心思；被聖靈充滿的人不是不用頭腦的人，下一節正要說明這一點。</p>"},{"a":18,"z":18,"star":3,"grk":"<p lang=\"grc\">καὶ μὴ μεθύσκεσθε οἴνῳ, ἐν ᾧ ἐστιν ἀσωτία, ἀλλὰ πληροῦσθε ἐν πνεύματι,</p>","lit":"<p>也不要被酒灌醉，在其中有放蕩；而要在靈裡被充滿，</p>","key":"<table><tr><th>原文</th><th>音譯</th><th>字面</th><th>在這裡</th></tr><tr><td>μὴ μεθύσκεσθε οἴνῳ</td><td>mē methyskesthe oinō</td><td>不要被酒灌醉</td><td>現在命令式：不要讓酒持續掌控</td></tr><tr><td>ἀσωτία</td><td>asōtia</td><td>放蕩</td><td>「無可救藥」：浪子揮霍的生活</td></tr><tr><td>ἀλλὰ πληροῦσθε</td><td>alla plērousthe</td><td>而要被充滿</td><td>現在式、被動、命令、複數</td></tr><tr><td>ἐν πνεύματι</td><td>en pneumati</td><td>在靈裡／藉著聖靈</td><td>內容或途徑之爭</td></tr><tr><td>πληρόω</td><td>plēroō</td><td>充滿</td><td>1:23；3:19；4:10、13 的同一個字</td></tr></table>","gram":"<p><strong>5:18 是一組對照：μὴ μεθύσκεσθε οἴνῳ（mē methyskesthe oinō）……ἀλλὰ πληροῦσθε ἐν πνεύματι（alla plērousthe en pneumati）。不是「少喝一點」對「多一點屬靈」，是兩種掌控的對比。</strong></p><p>πληροῦσθε（plērousthe） 有四個文法特徵，每一個都有分量。<strong>現在式</strong>：持續的、一再的，不是一生一次的經歷。<strong>被動語態</strong>：不是自己製造的，是讓神來作。<strong>命令語氣</strong>：不是少數人的特權，是每一個信徒的責任。<strong>複數</strong>：對整個教會說，不只對個人說。對照使徒行傳的 ἐπλήσθησαν（徒 4:31），那是不定過去式的敘述，記錄某個時刻聖靈的工作；這裡是現在式的命令，描述信徒持續的生活。</p><p>ἐν πνεύματι（en pneumati） 怎麼讀，各家不同。πληρόω（plēroō） 通常用屬格表示「用甚麼充滿」，這裡卻是 ἐν（en） 加間接受格。一說是被聖靈充滿，聖靈是內容；一說是藉著聖靈被充滿，聖靈是途徑，內容是本卷一再說的「神一切所充滿的」（3:19；並見 1:23；4:13）。本講義判斷：後者較貼近以弗所書的用字，但兩說的牧養意義一致——是聖靈在作，結果是我們越來越被神自己充滿。</p><p>原文 5:18 一個命令之後，帶出五個分詞：5:19 λαλοῦντες（lalountes）、ᾄδοντες（adontes）、ψάλλοντες（psallontes）；5:20 εὐχαριστοῦντες（eucharistountes）；5:21 ὑποτασσόμενοι（hypotassomenoi）。這五個分詞是被聖靈充滿的果效，下兩段逐一展開。</p>","exp":"<p><strong>「不要醉酒，酒能使人放蕩；乃要被聖靈充滿。」（5:18）保羅把兩種「被灌滿」放在一起比較。</strong></p><p>以弗所一帶盛行酒神的崇拜，醉酒與宗教的狂熱連在一起，人以為喝醉了就更接近神明。保羅說：不是這樣。醉酒的結果是放蕩，原文是揮霍、無可救藥的生活，路加寫浪子時用了同一個字根：「在那裡任意放蕩，浪費資財。」（路 15:13）被聖靈充滿的結果，卻是對說、唱、讚美、感謝、順服——人不是失去自己，而是成為真正的自己。</p><p>這一節是命令，不是建議。現在式：天天需要，昨天的充滿不夠今天用。被動：你不能靠意志力把自己充滿，只能打開、交出、順服，讓聖靈來作。複數：這是給整個教會的，不是給少數屬靈精英的。</p><p>要特別小心兩種偏差。一種是把聖靈充滿限定成某一種外在現象：倒地、發抖、說方言、大笑。這些現象在教會歷史上出現過，有的是真實的經歷；但經文自己沒有把任何一種當作唯一的記號，不可以用它衡量誰比較屬靈。另一種是因為怕情緒化，乾脆不談聖靈充滿。可是這是神的命令，避而不談不是謹慎，是不順服。恩賜與方言的爭議，回指哥林多前書立場三。</p><p>那麼記號是甚麼？經文自己列出來：對說、唱、讚美、感謝、彼此順服（5:19–21）。被聖靈充滿的第一個證據，不在聚會最熱烈的那一刻，而在回家以後：對配偶說話的口氣，對孩子的耐心，肯先低頭的那一下。這是 321「用心靠聖靈」的落點：不是追求一種感覺，是讓聖靈一天一天掌管我的口、我的心、我的關係。</p><p>至於基督徒可不可以喝酒，經文在這裡禁止的是醉酒，議題頁另有陳列；但原則很清楚：不讓任何東西取代聖靈對我的掌控。</p>"},{"a":19,"z":20,"star":2,"grk":"<p lang=\"grc\">λαλοῦντες ἑαυτοῖς ψαλμοῖς καὶ ὕμνοις καὶ ᾠδαῖς πνευματικαῖς, ᾄδοντες καὶ ψάλλοντες τῇ καρδίᾳ ὑμῶν τῷ κυρίῳ,</p><p lang=\"grc\">εὐχαριστοῦντες πάντοτε ὑπὲρ πάντων ἐν ὀνόματι τοῦ κυρίου ἡμῶν Ἰησοῦ Χριστοῦ τῷ θεῷ καὶ πατρί,</p>","lit":"<p>用詩篇、頌歌和屬靈的歌彼此說話，用你們的心向主歌唱、彈奏讚美，</p><p>為一切事常常奉我們主耶穌基督的名感謝父神，</p>","key":"<table><tr><th>原文</th><th>音譯</th><th>字面</th><th>在這裡</th></tr><tr><td>λαλοῦντες ἑαυτοῖς</td><td>lalountes heautois</td><td>彼此對說</td><td>第一個分詞：向彼此</td></tr><tr><td>ψαλμοῖς καὶ ὕμνοις καὶ ᾠδαῖς πνευματικαῖς</td><td>psalmois kai hymnois kai ōdais pneumatikais</td><td>詩章、頌詞、靈歌</td><td>三個詞重疊，不宜硬分類</td></tr><tr><td>ᾄδοντες καὶ ψάλλοντες</td><td>adontes kai psallontes</td><td>歌唱、彈奏</td><td>第二、三個分詞：向主</td></tr><tr><td>τῇ καρδίᾳ ὑμῶν</td><td>tē kardia hymōn</td><td>用你們的心</td><td>和合本「口唱心和」</td></tr><tr><td>εὐχαριστοῦντες πάντοτε ὑπὲρ πάντων</td><td>eucharistountes pantote hyper pantōn</td><td>為一切常常感謝</td><td>第四個分詞：向父神</td></tr></table>","gram":"<p><strong>5:19–20 是 5:18 的 πληροῦσθε（plērousthe） 帶出的前四個分詞，方向分別是向人、向主、向父。</strong></p><p>λαλοῦντες ἑαυτοῖς（lalountes heautois）：敬拜有一個橫向的面，詩歌是會眾彼此對說的。ψαλμοῖς καὶ ὕμνοις καὶ ᾠδαῖς πνευματικαῖς（psalmois kai hymnois kai ōdais pneumatikais） 三個詞，有人分成舊約詩篇、讚美基督的頌歌、聖靈感動的即興之歌；但三個字在當時的用法多有重疊，πνευματικαῖς（pneumatikais） 也可能修飾全部三者。學者多半認為保羅要的是豐富，不是分類（西 3:16 有同樣的三個詞）。ᾄδοντες καὶ ψάλλοντες τῇ καρδίᾳ ὑμῶν τῷ κυρίῳ（adontes kai psallontes tē kardia hymōn tō kyriō）：ψάλλω（psallō） 原指撥弦，τῇ καρδίᾳ（tē kardia） 可讀作工具或處所，「用心」「在心裡」都可；和合本「口唱心和」譯得傳神。</p><p>第 20 節 εὐχαριστοῦντες πάντοτε ὑπὲρ πάντων（eucharistountes pantote hyper pantōn）：「常常」與「為一切」是同字根的兩個字並列，把感謝擴到時間與範圍的全部。感謝的對象是 τῷ θεῷ καὶ πατρί（tō theō kai patri），途徑是 ἐν ὀνόματι τοῦ κυρίου ἡμῶν Ἰησοῦ Χριστοῦ（en onomati tou kyriou hēmōn Iēsou Christou）——一節之內有父、有子，加上 5:18 的聖靈，三位一體都在場。</p>","exp":"<p><strong>「當用詩章、頌詞、靈歌彼此對說，口唱心和地讚美主。」（5:19）被聖靈充滿的教會，是一個會唱歌的教會。</strong></p><p>注意「彼此對說」。我們唱詩，不只是唱給神聽，也是唱給身邊的弟兄姊妹聽。當你唱主是我的平安，坐在旁邊那位剛失業的弟兄聽見了；你在對他說話。所以敬拜不是一群人各自待在個人的泡泡裡，而是一個身體一起宣告真理。</p><p>詩章、頌詞、靈歌三個詞，與其爭論哪一種才合法，不如看見保羅要的是豐富。傳統聖詩與現代詩歌之爭，議題頁另有陳列；這一節給的檢驗是：歌詞把真理說清楚了嗎？是用心唱的嗎？是向著主唱的嗎？一首老聖詩可以唱得心不在焉，一首新歌也可以唱得滿有真理。</p><p>「凡事要奉我們主耶穌基督的名常常感謝父神。」（5:20）「凡事」是最難的兩個字。保羅寫這封信的時候在監獄裡（3:1；4:1）。為一切感謝，不是假裝苦難是好的，而是相信在一切事上，父神都沒有離開。另一封信說：「凡事謝恩」（帖前 5:18）。抱怨像是另一種醉酒——被情緒灌滿；感謝是被聖靈充滿最日常的記號。</p><p>從 5:4 的感謝的話到 5:20 的常常感謝，保羅把舌頭帶回它被造的用途。</p>"},{"a":21,"z":21,"star":3,"grk":"<p lang=\"grc\">ὑποτασσόμενοι ἀλλήλοις ἐν φόβῳ Χριστοῦ.</p>","lit":"<p>在對基督的敬畏中彼此順服。</p>","key":"<table><tr><th>原文</th><th>音譯</th><th>字面</th><th>在這裡</th></tr><tr><td>ὑποτασσόμενοι</td><td>hypotassomenoi</td><td>順服</td><td>第五個分詞，仍掛在 5:18 的被充滿底下</td></tr><tr><td>ἀλλήλοις</td><td>allēlois</td><td>彼此</td><td>雙向：每一個人對每一個人</td></tr><tr><td>ἐν φόβῳ Χριστοῦ</td><td>en phobō Christou</td><td>在對基督的敬畏中</td><td>新約只此一處「敬畏基督」</td></tr><tr><td>ὑποτάσσω</td><td>hypotassō</td><td>順服</td><td>字面「排在……之下」；中間語態：自願的歸位</td></tr></table>","gram":"<p><strong>5:21 是全章的鉸鏈：文法上屬於 5:18，是第五個分詞；內容上開啟 5:22–6:9 的家庭段。</strong></p><p>ὑποτασσόμενοι（hypotassomenoi） 是現在分詞，與 λαλοῦντες（lalountes）、ᾄδοντες（adontes）、ψάλλοντες（psallontes）、εὐχαριστοῦντες（eucharistountes） 同屬 πληροῦσθε（plērousthe） 之下。它是中間語態：不是被人壓下去，是自己願意把自己排在別人之下。ὑποτάσσω（hypotassō） 由「在下面」與「安排、排列」組成，原是軍事用語，在新約多指自願的歸位。有些版本把 5:21 歸上段，有些歸下段；和合本歸上段。本講義按文法把它當作鉸鏈。</p><p>ἀλλήλοις（allēlois） 是這一節的重心。有學者認為它在這裡等於「某些人對某些人」，指下文妻子對丈夫、兒女對父母、僕人對主人；多數學者則認為，「彼此」這組字在本卷一貫是相互的（4:2、25、32），5:21 是真正的彼此順服，下文三組是它的具體例子。本講義取後者：5:21 是總綱，涵蓋家中每一個人。</p><p>ἐν φόβῳ Χριστοῦ（en phobō Christou） 是新約唯一的「敬畏基督」，給順服一個更高的參照：順服人，是因為敬畏基督；也正因為敬畏基督，任何人的權柄都不是絕對的。和合本把 5:21 放在上段末尾、5:22 另起一段，中文讀者容易從 5:22 讀起；本講義的家庭段從 5:21 開始。</p>","exp":"<p><strong>「又當存敬畏基督的心，彼此順服。」（5:21）家庭段的第一句，不是對妻子說的，是對每一個人說的。</strong></p><p>這一節是整段的標題。原文 5:22 沒有動詞，「順服」從這一節借過去；所以讀 5:22 一定要從這裡讀起，而這一節又是 5:18 被聖靈充滿的第五個果效。次序是：被聖靈充滿，然後彼此順服，然後才是妻子、丈夫、兒女、父母、僕人、主人。家裡的每一條命令，都是聖靈充滿的人在家裡的樣子，不是一方向另一方索取的權利。</p><p>「彼此」二字推翻了那個時代的家規。希臘羅馬的家規只對下面的人下命令：妻子要服從，兒女要服從，奴隸要服從，家主在上面不受約束。保羅說：在基督的家裡，每一個人都要把自己放在別人之下。這是「造成一個新人」（2:15）落到家庭裡的樣子，也是「各人看別人比自己強」（腓 2:3）的同一顆心。</p><p>順服的根據是敬畏基督。我們不是因為對方值得、對方比我強、對方有權，才順服；是因為基督。這同時劃出界線：既然是敬畏基督，就沒有任何人可以用順服的名義要求我違背基督。順服絕不包括忍受暴力、虐待、控制或被迫犯罪。</p><p>那麼，彼此順服在家裡長甚麼樣子？父母肯向孩子說對不起，丈夫肯聽完妻子的意見再作決定，妻子肯信任丈夫的帶領，成年的兒女肯聽年老父母的心聲。不是誰贏誰輸，是每一個人都先問：我怎樣成全對方？</p><p>這也是 321 所說舊人有己、新人無己最實際的試金石（4:22–24）。在教會順服容易，因為每週只見一次；在家裡順服難，因為天天見面，每一個習慣都看得見。被聖靈充滿是否真實，最先在家裡被檢驗。全卷立場見 ISS00_3。</p>"},{"a":22,"z":24,"star":3,"grk":"<p lang=\"grc\">Αἱ γυναῖκες τοῖς ἰδίοις ἀνδράσιν ὡς τῷ κυρίῳ,</p><p lang=\"grc\">ὅτι ἀνήρ ἐστιν κεφαλὴ τῆς γυναικὸς ὡς καὶ ὁ Χριστὸς κεφαλὴ τῆς ἐκκλησίας, αὐτὸς σωτὴρ τοῦ σώματος.</p><p lang=\"grc\">ἀλλὰ ὡς ἡ ἐκκλησία ὑποτάσσεται τῷ Χριστῷ, οὕτως καὶ αἱ γυναῖκες τοῖς ἀνδράσιν ἐν παντί.</p>","lit":"<p>妻子們，對自己的丈夫，如同對主，</p><p>因為丈夫是妻子的頭，正如基督也是教會的頭，他自己是身體的救主。</p><p>然而，正如教會順服基督，妻子們也要這樣在凡事上對丈夫。</p>","key":"<table><tr><th>原文</th><th>音譯</th><th>字面</th><th>在這裡</th></tr><tr><td>Αἱ γυναῖκες τοῖς ἰδίοις ἀνδράσιν</td><td>Hai gynaikes tois idiois andrasin</td><td>妻子們，對自己的丈夫</td><td>沒有動詞：順服借自 5:21</td></tr><tr><td>ὡς τῷ κυρίῳ</td><td>hōs tō kyriō</td><td>如同對主</td><td>動機與界線：主在丈夫之上</td></tr><tr><td>κεφαλὴ</td><td>kephalē</td><td>頭</td><td>權柄或源頭之爭；經文以救主來定義</td></tr><tr><td>σωτὴρ τοῦ σώματος</td><td>sōtēr tou sōmatos</td><td>身體的救主</td><td>只用在基督身上</td></tr><tr><td>ὑποτάσσεται</td><td>hypotassetai</td><td>順服</td><td>本段唯一明寫的動詞，主詞是教會</td></tr><tr><td>ἐν παντί</td><td>en panti</td><td>凡事</td><td>受「如同對主」限定：不包括犯罪</td></tr></table>","gram":"<p><strong>5:22 原文沒有動詞：Αἱ γυναῖκες τοῖς ἰδίοις ἀνδράσιν ὡς τῷ κυρίῳ（Hai gynaikes tois idiois andrasin hōs tō kyriō），直譯「妻子們，對自己的丈夫，如同對主」。「順服」是從 5:21 的分詞 ὑποτασσόμενοι（hypotassomenoi） 借來的。</strong></p><p><strong>◆ 經文鑑別 5:22。</strong>SBLGNT、NA28、WH 都沒有動詞，最早的蒲草紙抄本 P46 與梵蒂岡抄本支持；其他抄本補上動詞，形式不一：拜占庭傳統（RP）加 ὑποτάσσεσθε（hypotassesthe），第二人稱命令，與西 3:18 相同；西奈抄本、亞歷山大抄本等加 ὑποτασσέσθωσαν（hypotassesthōsan），第三人稱命令，Tregelles 採此。判斷：無動詞的讀法較可取——它較短、較難，而補上的動詞形式各不相同，正顯出抄寫者覺得句子缺了東西，才各自補上。和合本補「當順服」是合理的翻譯，但讀者要知道：這個動詞在 5:21。</p><p>這個文法決定了全段的意思：妻子的順服是 5:21 彼此順服的一個例子，而 5:21 又是 5:18 被聖靈充滿的果效。ὡς τῷ κυρίῳ（hōs tō kyriō） 同時是動機與界線：出於對主的順服，所以不能高過對主的順服。</p><p>5:23 的 κεφαλὴ（kephalē） 有兩派讀法：一說是權柄、帶領，一說是源頭、生命的供應。保羅立刻用 αὐτὸς σωτὴρ τοῦ σώματος（autos sōtēr tou sōmatos） 補充：基督作頭的方式是作救主。5:24 以 ἀλλὰ（alla） 開頭，ὡς ἡ ἐκκλησία ὑποτάσσεται τῷ Χριστῷ（hōs hē ekklēsia hypotassetai tō Christō）……ἐν παντί（en panti）；這是本段唯一明寫的順服動詞，主詞是教會，對象是基督。ἐν παντί（en panti） 受前面 ὡς τῷ κυρίῳ（hōs tō kyriō） 的限定，不包括犯罪。</p>","exp":"<p><strong>「你們作妻子的，當順服自己的丈夫，如同順服主。」（5:22）這一節不能單獨讀；它的動詞在 5:21「彼此順服」，它的另一半在 5:25「為教會捨己」。</strong></p><p>中文聖經把「當順服」寫進 5:22，又在 5:21 之後分段，讀者很容易從這裡開始讀，彷彿保羅一開口就對妻子下命令。原文不是這樣。保羅先說「乃要被聖靈充滿」（5:18），再說「又當存敬畏基督的心，彼此順服」（5:21），然後說：妻子們，對自己的丈夫，如同對主。妻子的順服是全家彼此順服的一部分，是聖靈充滿的果子，不是丈夫可以拿來要求的權利。</p><p>在第一世紀，這段話其實是革命性的。當時的家規只對家主說話，把妻子當成被管理的對象；保羅卻直接對妻子說話，把她當成一個能夠自己回應基督、有道德責任的人。而且他對丈夫說的話，比對妻子的長了三倍（5:25–33）。</p><p>「丈夫是妻子的頭，如同基督是教會的頭」（5:23）。「頭」怎樣理解，有不同看法：互補派認為夫妻在神面前完全平等，但有不同的角色，丈夫的帶領是捨己的帶領；平等派認為 5:21 的彼此順服是原則，5:22–24 是保羅在當時處境中的應用。兩派都是敬重聖經權威的福音派，本講義並陳，不替每一個家庭決定分工（性別角色回指哥林多前書立場二、加拉太書立場四；全卷立場見 ISS00_3）。但經文自己替「頭」下了定義：「他又是教會全體的救主」（5:23）。基督怎樣作頭？他為教會死。凡用「我是頭」來壓制、控制配偶的，已經離開了經文說的那位頭。</p><p>「凡事順服」（5:24）的凡事也有界線：5:22 說的是如同順服主。順服丈夫，是在主裡、在彼此順服的框架之下；不包括犯罪，因為「順從神，不順從人，是應當的」（徒 5:29）。</p><p><strong>兩派都必須同意的底線：順服絕不包括忍受暴力、虐待、控制或被迫犯罪。</strong>遇到家暴，教會的第一件事是保護受害者的安全——必要時協助報警、尋求專業協助與庇護——不是勸她回家更順服一點，也不是叫她為了孩子忍一忍。丈夫若引 5:22 而不行 5:25，他已經先離開了這段經文。</p>"},{"a":25,"z":27,"star":3,"grk":"<p lang=\"grc\">Οἱ ἄνδρες, ἀγαπᾶτε τὰς γυναῖκας καθὼς καὶ ὁ Χριστὸς ἠγάπησεν τὴν ἐκκλησίαν καὶ ἑαυτὸν παρέδωκεν ὑπὲρ αὐτῆς,</p><p lang=\"grc\">ἵνα αὐτὴν ἁγιάσῃ καθαρίσας τῷ λουτρῷ τοῦ ὕδατος ἐν ῥήματι,</p><p lang=\"grc\">ἵνα παραστήσῃ αὐτὸς ἑαυτῷ ἔνδοξον τὴν ἐκκλησίαν, μὴ ἔχουσαν σπίλον ἢ ῥυτίδα ἤ τι τῶν τοιούτων, ἀλλʼ ἵνα ᾖ ἁγία καὶ ἄμωμος.</p>","lit":"<p>丈夫們，你們要愛妻子，正如基督也愛了教會，並且為她把自己交出去，</p><p>為要使她成聖，用在話語中的水的洗濯把她潔淨，</p><p>為要他自己把教會呈獻給自己，是榮耀的，沒有斑點或皺紋或任何這類的東西，而是要她成為聖潔、沒有瑕疵的。</p>","key":"<table><tr><th>原文</th><th>音譯</th><th>字面</th><th>在這裡</th></tr><tr><td>ἀγαπᾶτε τὰς γυναῖκας</td><td>agapate tas gynaikas</td><td>要愛妻子</td><td>現在命令式：持續地愛</td></tr><tr><td>ἑαυτὸν παρέδωκεν ὑπὲρ αὐτῆς</td><td>heauton paredōken hyper autēs</td><td>為她把自己交出去</td><td>與 5:2 同一個動詞</td></tr><tr><td>ἁγιάσῃ</td><td>hagiasē</td><td>使她成聖</td><td>第一個目的子句</td></tr><tr><td>τῷ λουτρῷ τοῦ ὕδατος</td><td>tō loutrō tou hydatos</td><td>水的洗濯</td><td>洗禮或新娘婚前沐浴的意象</td></tr><tr><td>παραστήσῃ αὐτὸς ἑαυτῷ</td><td>parastēsē autos heautō</td><td>他自己獻給自己</td><td>新郎親自迎娶</td></tr><tr><td>σπίλον ἢ ῥυτίδα</td><td>spilon ē rhytida</td><td>玷污、皺紋</td><td>污點與老化：都要除去</td></tr><tr><td>ἁγία καὶ ἄμωμος</td><td>hagia kai amōmos</td><td>聖潔沒有瑕疵</td><td>回指 1:4 揀選的目的</td></tr></table>","gram":"<p><strong>5:25 Οἱ ἄνδρες（Hoi andres） 是主格當呼格用，接著一個真正的命令動詞 ἀγαπᾶτε（agapate）——5:22 沒有動詞，對丈夫的這一句卻有一個清清楚楚的命令。</strong></p><p>ἀγαπᾶτε（agapate） 是現在命令式，持續地愛。保羅沒有說丈夫要叫妻子順服，也沒有說丈夫要作頭；給丈夫的命令只有一個：愛。尺度是 καθὼς καὶ ὁ Χριστὸς ἠγάπησεν τὴν ἐκκλησίαν καὶ ἑαυτὸν παρέδωκεν ὑπὲρ αὐτῆς（kathōs kai ho Christos ēgapēsen tēn ekklēsian kai heauton paredōken hyper autēs），與 5:2 的字眼幾乎一樣：ἠγάπησεν（ēgapēsen）、παρέδωκεν ἑαυτὸν（paredōken heauton）。效法神的愛（5:1–2），在婚姻裡的形狀就是捨己。</p><p>接著是一串目的子句：ἵνα αὐτὴν ἁγιάσῃ（hina autēn hagiasē）……ἵνα παραστήσῃ（hina parastēsē）……ἵνα ᾖ ἁγία καὶ ἄμωμος（hina ē hagia kai amōmos）。καθαρίσας τῷ λουτρῷ τοῦ ὕδατος ἐν ῥήματι（katharisas tō loutrō tou hydatos en rhēmati） 的「水的洗」，各家看法：一說指洗禮，一說借用古代新娘婚前沐浴的習俗（這使我們想起結 16:9）；ἐν ῥήματι（en rhēmati） 指傳講的福音之道，或洗禮時的宣認。παραστήσῃ αὐτὸς ἑαυτῷ（parastēsē autos heautō） 有兩個反身代名詞，強調新郎親自迎娶，不假手他人。ἁγία καὶ ἄμωμος（hagia kai amōmos） 回到 1:4：揀選的目的是「成為聖潔，無有瑕疵」（1:4）。</p>","exp":"<p><strong>「你們作丈夫的，要愛你們的妻子，正如基督愛教會，為教會捨己。」（5:25）對丈夫的命令，不是「要管」，是「要死」。</strong></p><p>保羅對妻子說了三節，對丈夫說了九節。他給丈夫的不是權利清單，而是一個沒有上限的標準：像基督那樣愛。基督怎樣愛教會？不是在天上發號施令，而是降卑、受苦、上十字架。主耶穌說：「人子來，並不是要受人的服事，乃是要服事人，並且要捨命作多人的贖價。」（可 10:45）作頭的人，是第一個捨命的人。</p><p>這是 321「捨己」最貼身的一處。在職場可以捨己給客戶，在教會可以捨己給事工，回到家卻要求被服事；保羅把捨己的戰場定在餐桌旁。丈夫若讀 5:22 而跳過 5:25，就是只讀了自己喜歡的那一半。</p><p>基督的愛有方向：「要用水藉著道把教會洗淨，成為聖潔，可以獻給自己，作個榮耀的教會」（5:26--27）。他愛教會，是要她更美好，不是要她更依附。這給丈夫一個檢驗：我的愛使妻子更自由、更成長、更像基督嗎？還是使她更害怕、更縮小？真正的頭使身體興旺，不是使身體萎縮。</p><p>這一段也回答了 5:23「頭」的問題。保羅沒有用一句話告訴丈夫怎樣行使權柄；他用三節說基督怎樣為教會捨己、洗淨她、把她獻給自己。對丈夫來說，作頭的定義就寫在這三節裡。在家裡只講權柄、不講捨己的，是把十字架從頭上拿走了。</p><p>「毫無玷污、皺紋等類的病」（5:27）是新娘的畫面。保羅在另一封信說，他把教會「如同貞潔的童女，獻給基督」（林後 11:2）。婚姻的終點不在人間；基督要迎娶一個榮耀的新娘（這使我們想起啟 19:7–8）。每一個家庭裡捨己的愛，都是那一天的預演。</p>"},{"a":28,"z":30,"star":2,"grk":"<p lang=\"grc\">οὕτως ὀφείλουσιν καὶ οἱ ἄνδρες ἀγαπᾶν τὰς ἑαυτῶν γυναῖκας ὡς τὰ ἑαυτῶν σώματα· ὁ ἀγαπῶν τὴν ἑαυτοῦ γυναῖκα ἑαυτὸν ἀγαπᾷ,</p><p lang=\"grc\">οὐδεὶς γάρ ποτε τὴν ἑαυτοῦ σάρκα ἐμίσησεν, ἀλλὰ ἐκτρέφει καὶ θάλπει αὐτήν, καθὼς καὶ ὁ Χριστὸς τὴν ἐκκλησίαν,</p><p lang=\"grc\">ὅτι μέλη ἐσμὲν τοῦ σώματος αὐτοῦ</p>","lit":"<p>照樣，丈夫們也應當愛自己的妻子，如同愛自己的身體；那愛自己妻子的，就是愛自己。</p><p>因為從來沒有人恨過自己的肉身，反倒餵養它、顧惜它，正如基督也這樣待教會，</p><p>因為我們是他身體的肢體。</p>","key":"<table><tr><th>原文</th><th>音譯</th><th>字面</th><th>在這裡</th></tr><tr><td>ὀφείλουσιν</td><td>opheilousin</td><td>應當</td><td>欠債的字：丈夫欠妻子一份愛</td></tr><tr><td>ὡς τὰ ἑαυτῶν σώματα</td><td>hōs ta heautōn sōmata</td><td>如同自己的身體</td><td>不只比較，也是身分</td></tr><tr><td>ἐκτρέφει καὶ θάλπει</td><td>ektrephei kai thalpei</td><td>保養顧惜</td><td>餵養與溫暖</td></tr><tr><td>θάλπω</td><td>thalpō</td><td>顧惜</td><td>帖前 2:7 乳母抱孩子的字</td></tr><tr><td>μέλη ἐσμὲν</td><td>melē esmen</td><td>我們是肢體</td><td>4:25 互相為肢體</td></tr></table>","gram":"<p><strong>5:28 的 οὕτως（houtōs） 承上啟下：基督怎樣愛教會，丈夫也要照樣。ὀφείλουσιν（opheilousin） 是欠債的字，丈夫對妻子的愛不是施捨，是欠下的。</strong></p><p>ὡς τὰ ἑαυτῶν σώματα（hōs ta heautōn sōmata） 的 ὡς（hōs） 不只是比喻，像愛身體那樣；也指身分，妻子就是他的身體。下半句 ὁ ἀγαπῶν τὴν ἑαυτοῦ γυναῖκα ἑαυτὸν ἀγαπᾷ（ho agapōn tēn heautou gynaika heauton agapa） 把這點說破。第 29 節的 γάρ（gar） 給理由：沒有人恨自己的 σάρκα（sarka），而是 ἐκτρέφει καὶ θάλπει（ektrephei kai thalpei）。θάλπω（thalpō） 在新約只出現兩次，另一次是帖前 2:7 乳母顧惜孩子——非常溫柔的字。καθὼς καὶ ὁ Χριστὸς τὴν ἐκκλησίαν（kathōs kai ho Christos tēn ekklēsian） 再一次把丈夫拉回基督的樣式。</p><p><strong>◆ 經文鑑別 5:30。</strong>SBLGNT、NA28 讀 ὅτι μέλη ἐσμὲν τοῦ σώματος αὐτοῦ（hoti melē esmen tou sōmatos autou） 就結束；拜占庭傳統（RP）與一些較晚的抄本加上 ἐκ τῆς σαρκὸς αὐτοῦ καὶ ἐκ τῶν ὀστέων αὐτοῦ（ek tēs sarkos autou kai ek tōn osteōn autou），和合本註腳說有古卷加「就是他的骨他的肉」。P46、西奈抄本原筆、亞歷山大抄本、梵蒂岡抄本都沒有。判斷：較短的讀法可取；加添的字很像抄寫者受下一節引創 2:24 的影響，從創 2:23 亞當的話借進來。兩種讀法的意思並無衝突。</p>","exp":"<p><strong>「丈夫也當照樣愛妻子，如同愛自己的身子；愛妻子便是愛自己了。」（5:28）保羅不是在說自私，他在說一體。</strong></p><p>有人讀到「愛妻子便是愛自己」，以為保羅退了一步：從像基督那樣捨己，降到像愛自己那樣。其實不是。他是在說，婚姻裡的兩個人已經是一個身體，傷害妻子就是傷害自己，就像一個人打自己的手一樣荒謬。</p><p>「從來沒有人恨惡自己的身子，總是保養顧惜」（5:29）。「保養」是餵養，「顧惜」是給溫暖，保羅另一次用這個字，是說乳母抱著孩子（帖前 2:7）。這是一幅非常具體的畫面：問她吃飽了沒有、累不累、心裡冷不冷。丈夫的愛不只在大事上捨命，也在每天的小事上照顧。冷漠也是一種不愛。</p><p>「正像基督待教會一樣，因我們是他身上的肢體。」（5:29--30）每一句話保羅都拉回基督。基督怎樣餵養教會？用他的道、他的聖靈、他的身體。他從不嫌棄自己的身體，即使這個身體軟弱、常常讓他傷心。這是丈夫的榜樣，也是教會每一個肢體彼此相待的榜樣（4:16、25）。</p><p>反過來說，若有人在家裡以言語羞辱、以拳頭威嚇、以金錢控制配偶，這不是一件家務事，是對一體的背叛。教會要站在受害的一方，先保護人的安全。</p>"},{"a":31,"z":32,"star":3,"grk":"<p lang=\"grc\">ἀντὶ τούτου καταλείψει ἄνθρωπος τὸν πατέρα καὶ τὴν μητέρα καὶ προσκολληθήσεται τῇ γυναικὶ αὐτοῦ, καὶ ἔσονται οἱ δύο εἰς σάρκα μίαν.</p><p lang=\"grc\">τὸ μυστήριον τοῦτο μέγα ἐστίν, ἐγὼ δὲ λέγω εἰς Χριστὸν καὶ εἰς τὴν ἐκκλησίαν.</p>","lit":"<p>為此，人要離開父親和母親，並要黏合他的妻子，兩個人要成為一個肉身。</p><p>這奧祕是大的，但我是指著基督和教會說的。</p>","key":"<table><tr><th>原文</th><th>音譯</th><th>字面</th><th>在這裡</th></tr><tr><td>ἀντὶ τούτου</td><td>anti toutou</td><td>為這個緣故</td><td>七十士譯本創 2:24 作 ἕνεκεν τούτου</td></tr><tr><td>καταλείψει</td><td>kataleipsei</td><td>要離開</td><td>未來式：一個必要的決定</td></tr><tr><td>προσκολληθήσεται</td><td>proskollēthēsetai</td><td>連合</td><td>黏合、緊貼；未來被動</td></tr><tr><td>εἰς σάρκα μίαν</td><td>eis sarka mian</td><td>成為一體</td><td>一個肉身：生命的完全結合</td></tr><tr><td>τὸ μυστήριον τοῦτο μέγα ἐστίν</td><td>to mystērion touto mega estin</td><td>這奧祕是極大的</td><td>本卷的關鍵字之一</td></tr><tr><td>ἐγὼ δὲ λέγω</td><td>egō de legō</td><td>但我是說</td><td>保羅自己作的連結</td></tr></table>","gram":"<p><strong>5:31 幾乎逐字引自七十士譯本創 2:24，只把開頭的 ἕνεκεν τούτου（heneken toutou） 換成 ἀντὶ τούτου（anti toutou），意思相同。這是保羅明文引用的舊約。</strong></p><p>三個未來式：καταλείψει（kataleipsei）、προσκολληθήσεται（proskollēthēsetai）、ἔσονται（esontai）。離開、連合、成為，一個比一個深。προσκολληθήσεται（proskollēthēsetai） 是黏上，像兩張紙用膠黏在一起，撕開必定兩敗俱傷。εἰς σάρκα μίαν（eis sarka mian） 的 εἰς（eis） 帶出結果：兩個人成為一個肉身。主耶穌談婚姻時也引這一節，接著說：「神配合的，人不可分開。」（太 19:6）</p><p>5:32 τὸ μυστήριον τοῦτο μέγα ἐστίν（to mystērion touto mega estin） 的 μυστήριον（mystērion） 在本卷是關鍵字（1:9；3:3、4、9；6:19），指從前隱藏、如今在基督裡顯明的神的計畫。ἐγὼ δὲ λέγω εἰς Χριστὸν καὶ εἰς τὴν ἐκκλησίαν（egō de legō eis Christon kai eis tēn ekklēsian）：主詞 ἐγὼ（egō） 明寫出來，語氣很重——「但我說的是基督和教會」。這是保羅自己作的連結：創 2:24 的婚姻，指向基督與教會的合一。經文既已明說，本講義可以把這層意思講足。</p>","exp":"<p>〔創〕創 2:24--24（創世記講義第 2 章）</p><p><strong>「為這個緣故，人要離開父母，與妻子連合，二人成為一體。這是極大的奧祕，但我是指著基督和教會說的。」（5:31--32）保羅把伊甸園的第一場婚禮，和十字架連在一起。</strong></p><p>本系列創世記講義第 2 章講過這一節：神看那人獨居不好，為他造了配偶；亞當醒來，說出人類第一首情詩。主耶穌談離婚時，也回到這一節（太 19:5–6）。保羅在這裡更進一步：神設立婚姻的時候，心裡已經有一幅更大的圖畫——基督與教會。婚姻不只是基督與教會的比喻；基督與教會才是原版，婚姻是神放在人間的一張複製畫。</p><p>「離開父母」在華人處境特別需要說清楚。這不是不孝，下一章立刻要說「孝敬父母」（6:2）。離開是指一個新家庭的成立：夫妻成為彼此最優先的關係，重大的決定由兩人在主面前一起負責，不由上一代代為決定。孝敬是一生的責任，但婚姻不是父母的延伸（全卷立場見 ISS00_3）。</p><p>「連合」與「一體」說的是全人的結合：身體、心思、財務、未來。這也是為甚麼 5:3 對淫亂說得那樣重：性是一體的印記，只屬於這樣的盟約。</p><p>「這是極大的奧祕」（5:32）。奧祕在以弗所書不是猜不透的謎，而是神從前隱藏、如今顯明的計畫（3:3–6）：猶太人與外邦人在基督裡成為一個身體。現在保羅說，每一對在主裡的夫妻，都在宣講同一個奧祕：基督怎樣為教會捨己，教會怎樣在愛中回應基督。一個捨己的丈夫、一個彼此順服的家，就是一篇活的福音。這也是 1:10 同歸於一在最小單位裡的樣子。</p><p>所以婚姻的目的不只是兩個人的幸福。單身的弟兄姊妹也不缺甚麼：每一個信徒都是那位新娘的一部分，都在等候最後的婚筵（這使我們想起啟 19:7）。</p>"},{"a":33,"z":33,"star":1,"grk":"<p lang=\"grc\">πλὴν καὶ ὑμεῖς οἱ καθʼ ἕνα ἕκαστος τὴν ἑαυτοῦ γυναῖκα οὕτως ἀγαπάτω ὡς ἑαυτόν, ἡ δὲ γυνὴ ἵνα φοβῆται τὸν ἄνδρα.</p>","lit":"<p>只是你們也要每一個人，各自這樣愛自己的妻子如同愛自己；而妻子要敬畏丈夫。</p>","key":"","gram":"<p><strong>5:33 以 πλὴν（plēn） 開頭，「然而、總而言之」，把剛剛升到基督與教會的話，拉回每一個家庭的廚房。</strong></p><p>ὑμεῖς οἱ καθʼ ἕνα ἕκαστος（hymeis hoi kath' hena hekastos）：「你們每一個人，一個一個地」——沒有一位丈夫可以例外。ἀγαπάτω（agapatō） 是第三人稱命令式。ἡ δὲ γυνὴ ἵνα φοβῆται τὸν ἄνδρα（hē de gynē hina phobētai ton andra） 以 ἵνα（hina） 帶出命令的意思；φοβῆται（phobētai） 字面是「敬畏」，與 5:21 的 ἐν φόβῳ Χριστοῦ（en phobō Christou） 同字根。和合本譯「敬重」，不是叫人害怕，而是尊重。全段以敬畏開始（5:21），以敬重結束（5:33），兩端扣在一起。</p>","exp":"<p><strong>「然而，你們各人都當愛妻子，如同愛自己一樣。妻子也當敬重她的丈夫。」（5:33）講完極大的奧祕，保羅回到最平凡的一句。</strong></p><p>神學的高峰，最後落在每一個家裡。「各人」兩個字不給任何人例外：沒有一位丈夫可以說我的情況特殊。愛，是持續的命令；敬重，是持續的態度。</p><p>「敬重」原文與 5:21 的敬畏基督是同一個字根。整段從敬畏基督開始，在敬重丈夫結束；中間是彼此順服與捨己的愛。敬重不是懼怕：一個妻子若活在對丈夫的恐懼中，那個家已經生病了，需要的是幫助與保護，不是更多的敬重。</p><p>這一節也提醒我們，保羅叫夫妻各自先給出去。不是等對方先愛我、先敬重我，我才回應；而是在基督裡先跨出那一步。這就是 5:21 的彼此順服，也是 5:2「憑愛心行事」在家裡的完成。從效法神開始，在一個平凡的家裡結束：這就是「行」。</p>"}],"6":[{"a":1,"z":1,"star":2,"grk":"<p lang=\"grc\">Τὰ τέκνα, ὑπακούετε τοῖς γονεῦσιν ὑμῶν ἐν κυρίῳ, τοῦτο γάρ ἐστιν δίκαιον·</p>","lit":"<p>那些兒女們，你們要在主裡聽從你們的父母，因為這是公義的；</p>","key":"<table><tr><th>原文</th><th>音譯</th><th>字面</th><th>在這裡</th></tr><tr><td>Τὰ τέκνα</td><td>Ta tekna</td><td>那些兒女</td><td>帶冠詞的稱呼：直接對孩子說話</td></tr><tr><td>ὑπακούετε</td><td>hypakouete</td><td>你們要聽從</td><td>現在式命令：日常的習慣</td></tr><tr><td>τοῖς γονεῦσιν ὑμῶν</td><td>tois goneusin hymōn</td><td>你們的父母</td><td>父母兩人一起，不只父親</td></tr><tr><td>ἐν κυρίῳ</td><td>en kyriō</td><td>在主裡</td><td>是動力，也是界線</td></tr><tr><td>δίκαιον</td><td>dikaion</td><td>公義的、正當的</td><td>和合本譯「理所當然」</td></tr></table>","gram":"<p><strong>6:1 開始的是古代所謂的「家規」，但保羅開口的方式就不一樣。</strong></p><p>Τὰ τέκνα（Ta tekna） 是主格帶冠詞，當稱呼用，5:22 起的每一組都這樣開頭：αἱ γυναῖκες（hai gynaikes）、οἱ ἄνδρες（hoi andres）、Τὰ τέκνα（Ta tekna）、οἱ πατέρες（hoi pateres）、Οἱ δοῦλοι（Hoi douloi）、οἱ κύριοι（hoi kyrioi）。希臘羅馬的家規多半是寫給家主看的，教他怎樣管妻子、兒女、奴僕；保羅卻直接對兒女說話。這表示孩子就坐在聚會裡，信讀出來的時候，他們聽得見，也被當成能自己回應主的人。</p><p>ὑπακούετε（hypakouete） 是現在式命令語氣，講的是一種持續的習慣，不是一次的服從。字面是「在底下聽」：聽進去，照著做。ἐν κυρίῳ（en kyriō） 放在「父母」之後，文法上修飾動詞「聽從」：在主裡聽從。少數古卷（例如梵蒂岡抄本）沒有 ἐν κυρίῳ（en kyriō），SBLGNT 與多數抄本都有，本講義從之。</p><blockquote><p>τοῦτο γάρ ἐστιν δίκαιον（touto gar estin dikaion） 用 γάρ（gar） 給出第一個理由：這是公義的、正當的。這是連外邦人的良心也同意的道理；6:2 再給第二個理由，是十誡。保羅先訴諸普遍的公義，再訴諸聖經，兩條理由疊在一起。</p></blockquote>","exp":"<p>以弗所的教會裡有孩子，而且保羅把他們算進去。全卷講過神的計畫、死人坐上寶座、拆毀的牆、一個身體；到了第 6 章，第一個被點名的人是兒女。教會的「站立得住」，從一個家裡的孩子開始。</p><p>「你們作兒女的，要在主裡聽從父母，這是理所當然的」（6:1）。這裡的兒女，是 6:4 說的那些還在「養育」中的孩子，住在家裡，由父母帶大。所以要分清楚兩個字：<strong>「聽從」是對在家受養育的兒女說的；6:2 的「孝敬」才是一生的責任。</strong>孩子小的時候聽從，長大以後仍然孝敬；但成年兒女的婚姻、信仰、呼召，是在主面前自己負責的。</p><p>「在主裡」三個字有兩面。一面是動力：孩子聽從父母，是把它當成跟從主的一部分，不只是怕挨罵。另一面是界線：父母若要求違背主的事，兒女可以不聽從，但仍要孝敬。使徒說過「順從神，不順從人，是應當的」（徒 5:29），在家裡一樣適用。這不是給不孝找理由，是說連父母的權柄也在主的權柄底下。</p><p>華人很熟悉「聽話」。保羅沒有否定它，卻把它放進一個更大的框架：孩子聽話，是因為家裡最大的不是爸爸，是主。這一點要到 6:4 才看得完整——主在上面，對孩子是要求，對父母也是約束。</p>"},{"a":2,"z":3,"star":3,"grk":"<p lang=\"grc\">τίμα τὸν πατέρα σου καὶ τὴν μητέρα, ἥτις ἐστὶν ἐντολὴ πρώτη ἐν ἐπαγγελίᾳ,</p><p lang=\"grc\">ἵνα εὖ σοι γένηται καὶ ἔσῃ μακροχρόνιος ἐπὶ τῆς γῆς.</p>","lit":"<p>你要尊敬你的父親和母親——這是第一條帶著應許的誡命——</p><p>為要使你得好處，並且你在地上要長久存活。</p>","key":"<table><tr><th>原文</th><th>音譯</th><th>字面</th><th>在這裡</th></tr><tr><td>τίμα</td><td>tima</td><td>你要尊敬</td><td>單數命令：十誡對每一個人說</td></tr><tr><td>τὸν πατέρα σου καὶ τὴν μητέρα</td><td>ton patera sou kai tēn mētera</td><td>你的父親和母親</td><td>父母並列，都要尊敬</td></tr><tr><td>ἐντολὴ πρώτη</td><td>entolē prōtē</td><td>第一條誡命</td><td>「第一」怎樣解，有三說</td></tr><tr><td>ἐν ἐπαγγελίᾳ</td><td>en epangelia</td><td>帶著應許</td><td>誡命後面附了應許</td></tr><tr><td>ἵνα εὖ σοι γένηται</td><td>hina eu soi genētai</td><td>為要使你得好處</td><td>和合本「使你得福」</td></tr><tr><td>μακροχρόνιος</td><td>makrochronios</td><td>長久存活的</td><td>新約只出現在這裡</td></tr><tr><td>ἐπὶ τῆς γῆς</td><td>epi tēs gēs</td><td>在地上</td><td>從迦南地擴大到全地</td></tr></table>","gram":"<p><strong>和合本把 6:2--3 合併成一句。</strong>cu89t 的經文是「要孝敬父母，使你得福，在世長壽」（6:2），連應許一起放在 6:2，6:3 是空字串；原文仍是兩節：6:2 是誡命本身加一句插入語，6:3 才是應許。和合本為了中文通順，把應許提到插入語之前，調整了語序，所以本講義把 6:2--3 合成一段來讀。</p><p>這是明文引用十誡：出 20:12；申 5:16。τίμα（tima） 是現在式命令語氣、單數，照十誡原來的口氣，對每一個人個別說。τίμα（tima） 的意思比「聽話」寬：尊重、看重，也包括實際的奉養。ἥτις ἐστὶν ἐντολὴ πρώτη ἐν ἐπαγγελίᾳ（hētis estin entolē prōtē en epangelia） 是保羅插進來的註解，然後 6:3 ἵνα εὖ σοι γένηται（hina eu soi genētai） 接回引文。ἵνα（hina） 先接假設語氣 γένηται（genētai），後面 καὶ ἔσῃ（kai esē） 換成未來直說語氣——應許說得更實在。</p><p>「第一條帶應許的誡命」怎麼算？學者有三說：一說是十誡裡第一條明說應許的（第二誡的「直到千代」被看為描述，不是應許）；一說是第二塊法版的第一條；一說是「首要的」，孩子最先要學的誡命。本講義的判斷：第一說最貼近字面，第三說最貼近處境，兩說可以並存。</p><blockquote><p>保羅引申 5:16 時省略了後半句「在耶和華你神所賜你的地上」，只留 ἐπὶ τῆς γῆς（epi tēs gēs）。原來的應許落在迦南地，保羅把它交給亞細亞的外邦孩子：這片「地」不再只是一塊應許地，是神的百姓所在的地方。μακροχρόνιος（makrochronios） 在新約只出現這一次。</p></blockquote>","exp":"<p>十誡是寫給大人的。「當照耶和華你神所吩咐的孝敬父母，使你得福」（申 5:16）——在西奈山下聽這句話的，是一群扶老攜幼的成年人。保羅把它引來對孩子說，但誡命本身並沒有年齡上限。<strong>孝敬是一生的責任。</strong>小時候是聽從，長大是尊重；父母老了，是照顧與奉養。耶穌曾經責備那些把該奉養父母的錢說成「供獻」的人（太 15:5--6），可見孝敬是要落到口袋與時間裡的。</p><p>華人的孝道與 6:2 相合的部分很多：尊敬長輩、奉養父母、不叫父母蒙羞。基督徒在這些事上，應當比不信的人做得更好，不可以用「我信主了」作為疏遠父母的理由。</p><p>但也有不相合的部分。孝敬不等於讓父母替成年兒女決定一切。「人要離開父母，與妻子連合」（5:31）就寫在幾節之前：婚姻成立的那一天，一個新的家就在主面前自己負責。<strong>以孝為名操控成年兒女的婚姻、信仰、呼召，不是 6:2 的孝；</strong>要求兒女祭祖、放棄信仰，也不是。這些地方要溫柔，也要堅定：可以拒絕那件事，卻不撤回對父母的尊敬。</p><p>「使你得福，在世長壽」（6:2）是應許，也是智慧：一個尊重根源的人，生命通常比較穩。它不是一張保證書，不能拿來推算誰早逝是因為不孝；它說的是神設立家的方向——<p>還要注意保羅的次序：6:1 先說「在主裡」，6:2 才引十誡。孝敬父母，是放在主的權柄底下的孝敬；它不跟敬拜主競爭，反而是敬拜主的一部分。一個基督徒越愛主，就越懂得怎樣尊敬父母，也越知道哪些要求不能照辦。這兩件事在華人家庭裡常常拉扯，經文給的答案不是二選一，是把父母放回神所定的位置上，好好地愛。</p>"},{"a":4,"z":4,"star":2,"grk":"<p lang=\"grc\">Καὶ οἱ πατέρες, μὴ παροργίζετε τὰ τέκνα ὑμῶν, ἀλλὰ ἐκτρέφετε αὐτὰ ἐν παιδείᾳ καὶ νουθεσίᾳ κυρίου.</p>","lit":"<p>還有那些父親們，你們不要激怒你們的兒女，卻要在主的管教和勸戒中把他們養育出來。</p>","key":"<table><tr><th>原文</th><th>音譯</th><th>字面</th><th>在這裡</th></tr><tr><td>οἱ πατέρες</td><td>hoi pateres</td><td>那些父親們</td><td>對握有權柄的一方說話</td></tr><tr><td>μὴ παροργίζετε</td><td>mē parorgizete</td><td>不要激怒</td><td>μή 加現在式命令：不要養成習慣</td></tr><tr><td>ἐκτρέφετε</td><td>ektrephete</td><td>養育出來</td><td>5:29 基督「保養」教會的同一字</td></tr><tr><td>ἐν παιδείᾳ</td><td>en paideia</td><td>在管教中</td><td>訓練，包括紀律</td></tr><tr><td>νουθεσίᾳ</td><td>nouthesia</td><td>勸戒</td><td>放進心裡的話</td></tr><tr><td>κυρίου</td><td>kyriou</td><td>主的</td><td>主的管教，不是父親的脾氣</td></tr></table>","gram":"<p><strong>6:4 用 Καὶ οἱ πατέρες（Kai hoi pateres） 起頭，雙向的那一半來了。</strong></p><p>μὴ παροργίζετε（mē parorgizete） 是 μή（mē） 加現在式命令，意思是不要把它變成一種模式。這個字的名詞在 4:26 出現過：ὁ ἥλιος μὴ ἐπιδυέτω ἐπὶ παροργισμῷ ὑμῶν（ho hēlios mē epidyetō epi parorgismō hymōn），「不可含怒到日落」。保羅在第 4 章叫每一個人處理怒氣；在這裡，他叫父親不要成為兒女怒氣的來源。</p><p>ἀλλὰ ἐκτρέφετε（alla ektrephete） 是對照：不要激怒，卻要養育。ἐκτρέφετε（ektrephete） 在 5:29 剛剛用過：基督 ἐκτρέφει καὶ θάλπει（ektrephei kai thalpei） 教會，「保養顧惜」。父親養育兒女的樣式，就是基督保養教會的樣式。ἐν παιδείᾳ καὶ νουθεσίᾳ κυρίου（en paideia kai nouthesia kyriou） 兩個名詞：παιδείᾳ（paideia） 偏重訓練與紀律，νουθεσίᾳ（nouthesia） 偏重用話語勸戒，字根是「放進心思」。κυρίου（kyriou） 是屬格，可以讀成「出於主的」，也可以讀成「關於主的」；本講義的判斷：兩面都在，重點是這管教屬於主，不屬於父親的情緒。</p><blockquote><p>πατέρες（pateres） 在希臘文偶爾泛指父母（來 11:23 指摩西的父母）。在這裡特別對父親說，是因為在羅馬法裡父親對兒女握有近乎絕對的權柄。保羅的命令落在權柄最大的那一方身上。</p></blockquote>","exp":"<p>第一世紀的羅馬家庭，父親可以決定一個新生兒要不要留下，可以把兒女賣掉，甚至有生殺之權。在那樣的世界裡，有人對父親說「不要惹兒女的氣」（6:4），是一句很新的話。歌羅西書說得更白：「你們作父親的，不要惹兒女的氣，恐怕他們失了志氣」（西 3:21）。</p><p><strong>這一節是紅線二的另一半。</strong>6:1 叫兒女聽從，6:4 立刻叫父親不要激怒。對上面那一方的要求更重：兒女只被要求聽從，父親卻被要求一邊不激怒、一邊用主的方式養育。任何只講 6:1、不講 6:4 的講台，都把經文講成了單向的。</p><p>華人很熟悉「不打不成器」。6:4 沒有廢掉管教，παιδείᾳ（paideia） 本身就包含紀律；它廢掉的是激怒：羞辱、貶低、比較、情緒失控的打罵、言語上的冷暴力、永遠達不到的標準。孩子的怒氣有時不是叛逆，是被惹出來的。父親的管教要問的不是「我有沒有權」，是「這是主的管教，還是我的脾氣」。</p><p>主在上面，所以父親也在主的管教底下。一個會在孩子面前認錯的父親，正在教孩子最重要的一課：家裡最大的不是我，是主。</p><p>這一節也對母親、祖父母和所有帶孩子的人說話。保羅要的不是一個不出聲的孩子，是一個在主的教訓裡長大、心裡沒有積怨的孩子。</p>"},{"a":5,"z":6,"star":2,"grk":"<p lang=\"grc\">Οἱ δοῦλοι, ὑπακούετε τοῖς κατὰ σάρκα κυρίοις μετὰ φόβου καὶ τρόμου ἐν ἁπλότητι τῆς καρδίας ὑμῶν ὡς τῷ Χριστῷ,</p><p lang=\"grc\">μὴ κατʼ ὀφθαλμοδουλίαν ὡς ἀνθρωπάρεσκοι ἀλλʼ ὡς δοῦλοι Χριστοῦ ποιοῦντες τὸ θέλημα τοῦ θεοῦ, ἐκ ψυχῆς</p>","lit":"<p>那些奴僕們，你們要帶著懼怕和戰兢，在你們心裡的單純中，聽從那些按著肉身作主人的，如同聽從基督；</p><p>不是照著眼前的服事，如同討人喜歡的人，乃是如同基督的奴僕，從魂裡遵行神的旨意，</p>","key":"<table><tr><th>原文</th><th>音譯</th><th>字面</th><th>在這裡</th></tr><tr><td>Οἱ δοῦλοι</td><td>Hoi douloi</td><td>那些奴僕們</td><td>直接對奴隸說話</td></tr><tr><td>τοῖς κατὰ σάρκα κυρίοις</td><td>tois kata sarka kyriois</td><td>按肉身作主人的</td><td>還有一位不按肉身的主</td></tr><tr><td>μετὰ φόβου καὶ τρόμου</td><td>meta phobou kai tromou</td><td>帶著懼怕和戰兢</td><td>保羅也這樣形容自己</td></tr><tr><td>ἐν ἁπλότητι τῆς καρδίας ὑμῶν</td><td>en haplotēti tēs kardias hymōn</td><td>在你們心裡的單純中</td><td>沒有兩副面孔</td></tr><tr><td>ὀφθαλμοδουλίαν</td><td>ophthalmodoulian</td><td>眼前的服事</td><td>可能是保羅造的字</td></tr><tr><td>ἀνθρωπάρεσκοι</td><td>anthrōpareskoi</td><td>討人喜歡的</td><td>眼睛盯著人</td></tr><tr><td>ἐκ ψυχῆς</td><td>ek psychēs</td><td>從魂裡</td><td>整個人投進去</td></tr></table>","gram":"<p><strong>6:5 對奴隸說話，用的是與 6:1 同一個動詞 ὑπακούετε（hypakouete）。</strong></p><p>τοῖς κατὰ σάρκα κυρίοις（tois kata sarka kyriois） 是全段的伏筆：主人是「按肉身」的主人，言下之意，奴隸還有一位不按肉身的主。κύριος（kyrios） 在這一段一字兩用：肉身的主人，和主。到 6:9 這個雙關才完全打開。</p><p>μετὰ φόβου καὶ τρόμου（meta phobou kai tromou） 是保羅自己的用語，他在哥林多就是這樣傳道（林前 2:3），也叫腓立比人這樣作成得救的工夫（腓 2:12）。這不是怕被打的恐懼，是在神面前的敬畏。ἐν ἁπλότητι τῆς καρδίας ὑμῶν（en haplotēti tēs kardias hymōn），ἁπλότητι（haplotēti） 是「單一、不摺疊」：裡外一致。ὡς τῷ Χριστῷ（hōs tō Christō） 把整件事轉向基督。</p><blockquote><p>6:6 以 μὴ κατʼ ὀφθαλμοδουλίαν（mē kat' ophthalmodoulian） 開頭。ὀφθαλμοδουλίαν（ophthalmodoulian） 是「眼睛」加「服事」，新約只見於這裡和西 3:22，此前的希臘文獻也找不到，很可能是保羅造的字；在資料裡沒有 Strong 編號。它和 ἀνθρωπάρεσκοι（anthrōpareskoi） 是一對：眼睛盯著人看不看得見，心想著人喜不喜歡。對面是 ἀλλʼ ὡς δοῦλοι Χριστοῦ（all' hōs douloi Christou）：基督的奴僕。ἐκ ψυχῆς（ek psychēs） 在 SBLGNT 放在 6:6 句末，也可以連到 6:7，讀成「從心裡帶著善意服事」；兩種斷句意思相同。</p></blockquote>","exp":"<p>以弗所城裡大約有三分之一的人是奴隸，教會裡一定也有。他們不能選擇主人，不能選擇工作，許多人連家都不能自己成立。保羅對他們說話，第一件事是把他們當成能自己回應基督的人。這在當時的家規裡是罕見的。</p><p><strong>保羅沒有建立奴隸制，也沒有替它辯護。</strong>他在一個不能一夜改變的制度裡，先改變了制度裡的人：叫奴隸看見頭上有基督，叫主人看見自己頭上也有基督（6:9）。後來他對腓利門說，阿尼西母「不再是奴僕，乃是高過奴僕，是親愛的兄弟」（門 1:16）——基督徒後來廢除奴隸制的種子，就種在這裡。</p><p>今天的僱傭關係不是奴隸制，但原則可以用。「不要只在眼前事奉，像是討人喜歡的」（6:6）：主管在的時候一個樣，主管走了另一個樣，就是 ὀφθαλμοδουλίαν（ophthalmodoulian）。職場基督徒的試金石，是沒有人看見的那一小時。</p><p>但「好像聽從基督一般」（6:5）同時是界線。<strong>基督不會叫人作假帳、違法、說謊；所以 6:5 不包括聽從老闆去作假、去做違法的事，也不包括忍受霸凌或性騷擾。</strong>甘心做工是一回事，被壓榨而不出聲是另一回事；向公司申訴、求助、必要時離開，都不違背這一節。</p>"},{"a":7,"z":8,"star":1,"grk":"<p lang=\"grc\">μετʼ εὐνοίας δουλεύοντες, ὡς τῷ κυρίῳ καὶ οὐκ ἀνθρώποις,</p><p lang=\"grc\">εἰδότες ὅτι ἕκαστος, ὃ ἂν ποιήσῃ ἀγαθόν, τοῦτο κομίσεται παρὰ κυρίου, εἴτε δοῦλος εἴτε ἐλεύθερος.</p>","lit":"<p>帶著善意服事，如同服事主，而不是服事人，</p><p>因為知道：各人無論行了甚麼善，這個他都要從主那裡領回來，不論是奴僕，或是自由人。</p>","key":"<table><tr><th>原文</th><th>音譯</th><th>字面</th><th>在這裡</th></tr><tr><td>μετʼ εὐνοίας</td><td>met' eunoias</td><td>帶著善意</td><td>不是勉強，是好意</td></tr><tr><td>δουλεύοντες</td><td>douleuontes</td><td>服事著</td><td>分詞，連著 6:6</td></tr><tr><td>κομίσεται</td><td>komisetai</td><td>他要領回</td><td>像取回寄存的東西</td></tr><tr><td>παρὰ κυρίου</td><td>para kyriou</td><td>從主那裡</td><td>賞賜的來源</td></tr><tr><td>εἴτε δοῦλος εἴτε ἐλεύθερος</td><td>eite doulos eite eleutheros</td><td>不論奴僕或自由人</td><td>在主面前同一個標準</td></tr></table>","gram":"<p>μετʼ εὐνοίας δουλεύοντες（met' eunoias douleuontes） 是分詞，接著 6:6 的 ποιοῦντες（poiountes） 往下說：遵行神的旨意，帶著善意服事。εὐνοίας（eunoias） 是「好的心意」，指主動的好意，不是被逼出來的順從。ὡς τῷ κυρίῳ καὶ οὐκ ἀνθρώποις（hōs tō kyriō kai ouk anthrōpois） 用 οὐκ（ouk） 一刀切開：對象是主，不是人。</p><p>6:8 εἰδότες ὅτι（eidotes hoti） 給出理由，「因為知道」。ὃ ἂν ποιήσῃ ἀγαθόν（ho an poiēsē agathon） 是不定的關係子句：無論甚麼善事，大小不拘。τοῦτο κομίσεται παρὰ κυρίου（touto komisetai para kyriou），κομίσεται（komisetai） 是未來式中間語態，常用在取回寄存之物：做過的善事，像存在主那裡，將來要領回。句末 εἴτε δοῦλος εἴτε ἐλεύθερος（eite doulos eite eleutheros） 這使我們想起加 3:28 同一組對照。6:9 會用一模一樣的 εἰδότες ὅτι（eidotes hoti） 對主人說話。</p>","exp":"<p>「甘心事奉，好像服事主，不像服事人」（6:7）。這一節是職場基督徒最重要的一節。</p><p>一個奴隸做的事，多半沒有人感謝。他洗的碗明天還要洗，他抄的帳簿屬於別人。保羅沒有說這些事變得不累，他說的是：這些事有另一位觀眾。「無論做甚麼，都要從心裡做，像是給主做的，不是給人做的」（西 3:23）。</p><p>這解放了兩種人。一種是只做給老闆看的人：他終於可以停止表演。另一種是怎樣做都得不到肯定的人：他的評分表不在老闆手上。「都必按所行的得主的賞賜」（6:8）——主看見，主記帳，主會還。</p><p>而且這個標準不分身分：「不論是為奴的，是自主的」（6:8）。在主的帳簿上，清潔工和總經理的善事用同一把尺量。這是從前的奴隸聽到會挺直腰的一句話。</p><p>主的賞賜不是工資的替代品，不是叫人不必爭取應得的待遇；它是告訴人：你的價值不由薪水單決定。</p>"},{"a":9,"z":9,"star":2,"grk":"<p lang=\"grc\">Καὶ οἱ κύριοι, τὰ αὐτὰ ποιεῖτε πρὸς αὐτούς, ἀνιέντες τὴν ἀπειλήν, εἰδότες ὅτι καὶ αὐτῶν καὶ ὑμῶν ὁ κύριός ἐστιν ἐν οὐρανοῖς, καὶ προσωπολημψία οὐκ ἔστιν παρʼ αὐτῷ.</p>","lit":"<p>還有那些主人們，你們要向他們行同樣的事，放下那恐嚇，因為知道：他們的主和你們的主都在天上，在他那裡並沒有取人的臉。</p>","key":"<table><tr><th>原文</th><th>音譯</th><th>字面</th><th>在這裡</th></tr><tr><td>οἱ κύριοι</td><td>hoi kyrioi</td><td>那些主人們</td><td>與 6:5 的「主人」同字</td></tr><tr><td>τὰ αὐτὰ ποιεῖτε</td><td>ta auta poieite</td><td>你們要行同樣的事</td><td>標準一樣</td></tr><tr><td>ἀνιέντες τὴν ἀπειλήν</td><td>anientes tēn apeilēn</td><td>放下那恐嚇</td><td>冠詞：那慣常的恐嚇</td></tr><tr><td>καὶ αὐτῶν καὶ ὑμῶν</td><td>kai autōn kai hymōn</td><td>他們的和你們的</td><td>同一位主</td></tr><tr><td>ἐν οὐρανοῖς</td><td>en ouranois</td><td>在天上</td><td>主人也有主人</td></tr><tr><td>προσωπολημψία</td><td>prosōpolēmpsia</td><td>取人的臉</td><td>看身分給待遇</td></tr></table>","gram":"<p><strong>6:9 的 Καὶ οἱ κύριοι（Kai hoi kyrioi） 讓「主人」這個字轉了一圈。</strong></p><p>τὰ αὐτὰ ποιεῖτε πρὸς αὐτούς（ta auta poieite pros
