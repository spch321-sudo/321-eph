","<p>著重第 5 節的關係子句：貪婪不只是一個壞習慣，而是把心交給神以外的東西——這與西 3:5 的平行句一致。淫亂與貪婪共同的根，是「我還要」：把人當成滿足自己的東西，把錢當成安全感的來源。所以解藥不是更多的規條，是換一個敬拜的對象，以及「總要說感謝的話」的知足。</p><p><strong>難處：</strong>這個讀法深刻，但如果只停在心態，容易讓人覺得「我心裡沒有把錢當神就好」，迴避具體的消費、投資、奉獻與性行為的界線；心的問題終究要落在帳本與手機上。</p>"],["【三】本講義站在哪裡","","<p><strong>本講義採名聲說與偶像說合讀，不採沉默說。</strong>教會要誠實、合宜地談性與金錢，因為保羅自己就談了；但談的方式是教導、保護與感謝，不是淫詞與戲笑。淫亂與貪婪同一個根——「我還要」——所以這一段的解藥在第 4 節：感謝，是知足的嘴。</p><p>以弗所是亞底米與錢財的城市（〔背景〕徒 19:24--27 銀匠為生意鬧事）；今天的以弗所，是有財神廟、有樂透彩、有投資群組的華人城市。原則照守，落點要說出判斷的理由（全卷立場見 ISS00_1）。</p>"],["【四】這件事該不該影響你的信心","","<p>不該讓你恐慌。第 5 節說的「無分」，是以這些事為生活方式、不肯回頭的人；第 8 節立刻說「從前你們是暗昧的」——這張清單描寫的是福音把人救出來的地方。如果你正在和色情、外遇的念頭或對錢的焦慮掙扎，你的痛正是聖靈還在你裡面的記號。</p><p>你能做的，是今天就把它帶到光底下：告訴主，也找一位可信的人同行。</p>"]],"con":[],"say":"本講義的立場：教會要誠實、合宜地談性與金錢，不以沉默代替教導；淫亂與貪婪同出於「我還要」的心，貪婪就是拜偶像，解藥是感謝與知足。5:5 說的是以此為生活方式的人，不是痛悔的人。本講義的全卷立場見 ISS00_1。","care":"會眾席上可能有正在和網路色情、婚外關係或賭博掙扎的人，也可能有曾經被性侵、被當作笑料的人，還有被債務壓得喘不過氣的家庭。講台上不舉會眾的例子、不用羞辱的字眼。會後若有人來談，先謝謝他願意說，不追問細節，陪他找可以同行的人；若涉及性侵或成癮，協助他尋求專業協助，必要時依法通報，不要求受害者原諒或保持沉默。"},{"id":"ISS05_2","t":"5:14「你這睡著的人當醒過來」——這是引用哪一段經文？","r":"5:14；賽26:19；賽60:1","ch":[5],"why":"保羅寫「所以主說」，可是翻遍舊約，找不到一模一樣的句子。有人因此懷疑保羅引錯了，也有人急著替它找一處出處，甚至講成「以賽亞的預言在這裡應驗了」。這一題關乎我們怎樣對待新約引用舊約，也關乎講台會不會替經文說它沒有說的話。","pos":[["【一】經文問的是甚麼","","<p>「所以主說：你這睡著的人當醒過來，從死裡復活！基督就要光照你了。」（5:14）原文 <strong>διὸ λέγει</strong>（dio legei）只說「所以他說」，沒有寫明是誰、出自哪裡；<strong>Ἔγειρε, ὁ καθεύδων</strong>（Egeire, ho katheudōn）是「起來，睡著的人」，<strong>ἐπιφαύσει σοι ὁ Χριστός</strong>（epiphausei soi ho Christos）是「基督要照在你身上」。問題是：這句話從哪裡來？</p>"],["以賽亞書意譯說（保羅綜合了幾處舊約）","","<p>認為保羅是把以賽亞書幾處經文合在一起意譯：「死人要復活，屍首要興起。睡在塵埃的啊，要醒起歌唱」（賽 26:19），與「興起，發光！因為你的光已經來到」（賽 60:1）。「所以他說」就是神在聖經裡說，保羅用基督的光重新讀這些應許。</p><p><strong>難處：</strong>用字差距不小，以賽亞書裡也沒有「基督」；若硬說是引用，就得解釋為甚麼保羅改了那麼多。講台上若把它講成「應驗」，就超過了經文自己作的連結。</p>"],["早期教會詩歌說（洗禮時唱的歌）","","<p>許多學者認為這是第一代信徒的詩歌，可能在洗禮時唱：睡著的人醒來、從死裡復活、基督光照——這正是受洗歸入基督的畫面。句子有節奏、押韻，像一首短歌；緊接著 5:19 又講到詩章、頌詞、靈歌。「他說」可以是聖靈藉著教會的敬拜說話。</p><p><strong>難處：</strong>我們手上沒有這首歌的其他抄本或出處，這是合理的推測，不是確定的事實；而且保羅在 4:8 用同樣的「所以他說」引的是詩篇，讀者自然會期待這裡也是舊約。</p>"],["失傳文獻說（引自今已不存的經外著作）","","<p>古代有些教父認為這句話出自一卷今天已經失傳的先知書或次經，例如有人提到託名以利亞或耶利米的著作。保羅在別處也引過經外的句子（例如徒 17:28 引希臘詩人），所以引用經外文獻並非不可能。</p><p><strong>難處：</strong>這些說法多半出於後來的推測，缺乏可靠的證據；而且把「主說」歸給一卷不在正典裡的書，會引出更多的問題，對解經的幫助也不大。</p>"],["【三】本講義站在哪裡","","<p><strong>本講義的判斷：出處不明，最可能是早期教會的詩歌，內容回響以賽亞書。</strong>講台上說「這使我們想起賽 26:19 與 60:1」，不說「應驗」。重點不在追查出處，而在它對誰說：這首歌放在這裡，是唱給信徒聽的——基督徒也會睡著，對罪麻木、對光遲鈍。</p><p>承認「不知道」不是削弱聖經，是誠實地對待聖經；聖靈默示保羅把這首歌收進來，它就是神對我們說的話。</p>"],["【四】這件事該不該影響你的信心","","<p>不該。新約作者引用舊約與當代材料的方式，本來就比今天的註腳寬廣；這一句的出處不明，不影響它是神的話，也不影響「基督就要光照你」這個應許。</p><p>真正該問的不是「這句話從哪裡來」，而是「我是不是睡著了」——今天有沒有一件事，是我已經習慣到不覺得是罪的？</p>"]],"con":[],"say":"本講義的立場：5:14 的「所以主說」舊約沒有完全相同的句子，最可能是早期教會的詩歌，這使我們想起賽 26:19 與 60:1，不可說成應驗。重點是它唱給信徒聽：睡著的人當醒過來。爭議的分寸見全卷立場 ISS00_9。","care":"有些信徒很怕聽見「聖經有不清楚的地方」，以為那會動搖信仰；也有人正處在屬靈的低谷，聽到「睡著的人」會覺得被指責。講台上平靜地說出「出處不明」，不製造懷疑，也不假裝確定。會後對覺得自己「睡著了」的人，不要說「你就是信心不夠」，陪他讀「基督就要光照你」——叫人醒來的是基督的光，不是更大聲的責備。"},{"id":"ISS05_3","t":"5:18「不要醉酒」——基督徒可以喝酒嗎？","r":"5:18；箴23:31；約2:10；羅14:21；提前5:23","ch":[5],"why":"這是華人教會最常被問的問題之一。有些教會滴酒不沾，把喝酒當作信仰的記號；有些信徒在應酬、婚宴、尾牙上被勸酒，不知道怎樣拒絕；也有家庭被酒精毀了，孩子從小看著父親喝醉。這一題關乎基督徒的自由，也關乎怎樣保護軟弱的人。","pos":[["【一】經文問的是甚麼","","<p>「不要醉酒，酒能使人放蕩；乃要被聖靈充滿。」（5:18）<strong>μὴ μεθύσκεσθε οἴνῳ</strong>（mē methyskesthe oinō）是「不要被酒灌醉」，現在命令式；<strong>ἀσωτία</strong>（asōtia）是「無可救藥的揮霍」，路加福音浪子「任意放蕩」用的就是同一個字根。問題是：經文禁止的是喝酒本身，還是醉酒？基督徒在這件事上要怎樣用自由？</p>"],["完全禁酒說（為了見證與保護，滴酒不沾）","","<p>許多華人教會與部分宗派的傳統主張完全不喝酒：箴言說「酒發紅，在杯中閃爍，你不可觀看」（箴 23:31）；在酒精造成大量家暴、車禍與成癮的社會裡，不喝酒是最安全的見證，也保護軟弱的人。保羅自己說「無論是吃肉是喝酒，是甚麼別的事，叫弟兄跌倒，一概不做才好」（羅 14:21）。</p><p><strong>難處：</strong>聖經沒有一處說喝酒本身是罪：主耶穌在迦拿把水變成酒，保羅勸提摩太「可以稍微用點酒」（提前 5:23）。若把禁酒當作得救或作同工的條件，就是在基督之外加上一副軛。</p>"],["節制飲用說（禁的是醉，不是酒）","","<p>認為經文禁止的是醉酒，不是喝酒：酒是神所造的好東西，「又得酒能悅人心」（詩 104:15）；基督徒可以節制地喝，關鍵是不被酒控制。這與保羅的原則一致：「凡事我都可行，但無論哪一件，我總不受它的轄制。」（林前 6:12）</p><p><strong>難處：</strong>「節制」的界線因人而異，容易成為自我合理化的空間——「我還沒醉」常常是醉的開始；而且在勸酒文化裡，一個人的「自由」可能正好是另一個戒酒者的絆腳石。</p>"],["處境智慧說（看人、看場合、看良心）","","<p>認為這是羅馬書 14 章式的灰色地帶：不把喝或不喝當作屬靈等級。但要問三個問題：一、我有沒有被它轄制？二、在場有沒有會因此跌倒的人（戒酒者、未成年者、家裡有酒害的人）？三、在我的文化與職場裡，喝或不喝哪一個更能見證基督？在拚酒文化很重的處境，得體地不喝，常常是最清楚的見證。</p><p><strong>難處：</strong>這需要成熟的分辨與群體的容讓，不像規條一目了然；對剛信主或有成癮背景的人，「看處境」可能太模糊，他們需要的是一條清楚的線。</p>"],["【三】本講義站在哪裡","","<p><strong>本講義採處境智慧說，並尊重選擇完全禁酒的弟兄姊妹。</strong>經文明令禁止的是醉酒；完全不喝與節制地喝，都是基督徒的自由，不可以升格為得救或被接納的條件（回指加拉太書立場三）。</p><p>但這一節的重點不在酒杯，在後半句：人一定會被某樣東西充滿。醉酒是用一樣東西把空虛灌滿，聖靈充滿是把自己交給一位。教會在聚會、聚餐、婚宴上不供酒或少供酒，是為了保護軟弱的人，不是為了定罪喝酒的人。</p>"],["【四】這件事該不該影響你的信心","","<p>不該。喝或不喝都不會讓你更得救或更不得救，「或吃或喝，無論做甚麼，都要為榮耀神而行」（林前 10:31）。但如果你發現自己已經離不開酒，那不是一個自由的問題，是一個需要幫助的問題。</p><p>你可以今天就告訴一位可信的人，也可以尋求專業的戒癮協助；這不是信心軟弱，是走向光。</p>"]],"con":[],"say":"本講義的立場：經文禁止的是醉酒；完全不喝或節制地喝都是基督徒的自由，不可當作得救或被接納的條件，也要顧念戒酒者與軟弱的人。重點在後半句：乃要被聖靈充滿。基督徒自由的界線回指加拉太書立場三；爭議的分寸見全卷立場 ISS00_9。","care":"會眾席上可能有正在戒酒的人、有在酒癮家庭長大的孩子、有曾經在酒後被打的配偶。講台上不要拿醉酒開玩笑，也不嘲笑完全禁酒的人。會後若有人說出家裡的酒害，先聽，不急著勸他「多為家人禱告」；若有人承認自己離不開酒，不要說「你就是信心不夠」，陪他找戒癮團體或專業協助；若酒後有暴力，先確認他和孩子的安全。"},{"id":"ISS05_4","t":"5:18「被聖靈充滿」——與聖靈的洗一樣嗎？一次還是多次？有甚麼記號？","r":"5:18--20；徒2:4；徒4:31；林前12:13","ch":[5],"why":"有人說沒有說方言就沒有被聖靈充滿，有人在聚會裡追求倒地與發抖；另一些教會怕情緒化，乾脆不談聖靈充滿。信徒被夾在中間，不知道自己到底「有沒有」。這一題關乎得救的確據、教會的合一，也關乎 5:18 這個命令會不會被講成某一種經驗的門票。","pos":[["【一】經文問的是甚麼","","<p>「乃要被聖靈充滿。」（5:18）<strong>πληροῦσθε ἐν πνεύματι</strong>（plērousthe en pneumati）是現在式、被動、命令：持續的、讓他作的、每一個信徒都要的。後面接著五個分詞——對說、唱、讚美（5:19）、感謝（5:20）、<strong>ὑποτασσόμενοι</strong>（hypotassomenoi）彼此順服（5:21）。問題是：這和使徒行傳的「聖靈的洗」是同一件事嗎？一次就夠，還是要一再充滿？記號是甚麼？</p>"],["二次經歷說（五旬節派：聖靈的洗是信主後的另一次經歷）","","<p>古典五旬節派認為，重生時聖靈內住，但「聖靈的洗」是信主之後另一次能力的經歷，最初的記號是說方言，如五旬節「他們就都被聖靈充滿，按著聖靈所賜的口才說起別國的話來」（徒 2:4）。這個傳統喚醒了教會對聖靈能力的渴慕，也推動了二十世紀全球宣教的大量增長。</p><p><strong>難處：</strong>使徒行傳裡被充滿的記號並不一致（4:31 是放膽講道，13:52 是滿心喜樂）；保羅說「都從一位聖靈受洗，成了一個身體」（林前 12:13），把聖靈的洗放在每一個信徒的起點。以方言為唯一記號，會讓沒有說方言的信徒懷疑自己是二等的。</p>"],["一洗多充說（福音派主流：重生時受洗，此後一再被充滿）","","<p>認為聖靈的洗發生在重生的時候，是一次的、每一個信徒都有的，把人放進基督的身體（林前 12:13）；被聖靈充滿卻是一再發生、天天需要的——彼得在五旬節被充滿，在徒 4:8、4:31 又被充滿。5:18 的現在式正支持這一點：「要一直被充滿」。記號是經文自己列的五個分詞。</p><p><strong>難處：</strong>這個說法清楚，但若講得太冷靜，容易讓「充滿」變成一個神學名詞，失去使徒行傳裡那種真實、有時很強烈的經歷；有些信徒確實有過一次決定性的、與重生分開的更新經驗。</p>"],["靈恩更新說（第三波：不設單一記號，經歷是真實而多樣的）","","<p>部分靈恩更新運動的教會不堅持方言是唯一記號，也不嚴格區分「洗」與「充滿」，而強調聖靈今天仍然以真實、可感受的方式臨到——喜樂、能力、醫治、說預言、方言、悔改的眼淚都可能出現；鼓勵信徒在禱告中向聖靈開放。</p><p><strong>難處：</strong>這個說法開放而溫暖，但若在聚會裡把某些身體現象（倒地、發抖、大笑）當作聖靈同在的證據，很容易讓人追求現象本身，甚至彼此模仿；也可能讓沒有這些經歷的人覺得被排除在外。</p>"],["【三】本講義站在哪裡","","<p><strong>本講義採一洗多充說，同時尊重五旬節與靈恩弟兄姊妹的經歷。</strong>聖靈的洗在重生時把每一個信徒放進基督的身體；被聖靈充滿是天天要的命令。經文自己列出的記號，是 5:19--21 的對說、唱、讚美、感謝、彼此順服——不以倒地、發抖、方言或任何一種現象為唯一記號（紅線七）。</p><p>方言與恩賜的爭議回指哥林多前書立場三，講台上一句帶過。但也不可因為怕爭議而不談：這是命令，不是選修。</p>"],["【四】這件事該不該影響你的信心","","<p>不該讓你懷疑自己是不是「二等基督徒」。如果你信了主，聖靈已經住在你裡面；你今天要做的，不是追一種感覺，而是向他打開：「主啊，今天請你充滿我。」</p><p>然後回到家看看：你嘴裡有沒有多一句感謝？心裡有沒有一首歌？在家人面前，有沒有讓一讓？那就是他在作工。</p>"]],"con":[],"say":"本講義的立場：聖靈的洗在重生時把每一個信徒放進基督的身體；被聖靈充滿是天天要的命令，經文自己列的記號是對說、唱、讚美、感謝、彼此順服，不以倒地、發抖、方言為唯一記號。恩賜與方言回指哥林多前書立場三；爭議的分寸見全卷立場 ISS00_9。","care":"會眾席上可能有人曾在某個聚會被按手、被推倒、被說「你沒有被充滿是因為你心裡有罪」，從此對聖靈的話題充滿恐懼；也有人從靈恩教會轉來，覺得這裡太冷。講台上兩邊都不嘲笑。會後若有人說出被逼著倒地或說方言的經驗，先承認那可能是傷害，不替那位講員辯護，也不要求他立刻原諒；陪他從 5:19--21 重新認識那位溫柔的聖靈。"},{"id":"ISS05_5","t":"5:19「詩章、頌詞、靈歌」——傳統詩歌與現代敬拜詩歌，哪一種才合乎聖經？","r":"5:19；西3:16；林前14:26","ch":[5],"why":"許多教會曾為詩歌吵過架：長輩要聖詩、要風琴，年輕人要樂團、要新歌；有人說只能唱詩篇，有人說舊詩歌聽不懂。甚至有教會因此分成兩堂、兩群人。5:19 正好列了三種歌，這一題關乎敬拜怎樣成為合一的地方，而不是另一個戰場。","pos":[["【一】經文問的是甚麼","","<p>「當用詩章、頌詞、靈歌彼此對說，口唱心和地讚美主。」（5:19）<strong>ψαλμοῖς καὶ ὕμνοις καὶ ᾠδαῖς πνευματικαῖς</strong>（psalmois kai hymnois kai ōdais pneumatikais）三個字的界線，學者看法不一；<strong>λαλοῦντες ἑαυτοῖς</strong>（lalountes heautois）是「彼此對說」，<strong>τῇ καρδίᾳ ὑμῶν</strong>（tē kardia hymōn）是「在你們心裡」。問題是：這三種歌是指特定的曲目嗎？今天教會的敬拜風格，又該由誰、照甚麼標準來選？</p>"],["只唱詩篇說（三個字都指舊約詩篇）","","<p>部分改革宗傳統認為，希臘文舊約的詩篇標題裡就有這三個字，所以「詩章、頌詞、靈歌」都是指詩篇；教會敬拜只應唱聖經裡默示的詩歌，避免人寫的詩詞混入錯誤的教義。這個傳統讓會眾把詩篇唱進心裡，十分寶貴。</p><p><strong>難處：</strong>新約裡已經有基督徒新寫的頌歌（例如腓 2:6--11、提前 3:16 被許多學者認為是早期詩歌），5:14 本身也可能是一首；啟示錄裡天上的眾人「唱新歌」。只唱詩篇，難以解釋這些新歌。</p>"],["傳統聖詩說（經過時間淬鍊的詩歌較能承載真道）","","<p>不主張只唱詩篇，但認為經過幾百年教會試驗的聖詩，神學內容豐富、歌詞完整，能把教義一代一代唱下去；現代敬拜歌曲常常重複、偏重個人感受，深度不足。教會應以傳統詩歌為主。</p><p><strong>難處：</strong>每一首「傳統聖詩」在它的時代都是新歌，衛斯理的詩歌當年也被批評太通俗；以年代判斷好壞，容易讓年輕一代覺得敬拜是長輩的事，也忽略了今天仍有內容深刻的新歌。</p>"],["多元並用說（三種歌各有功能，重點在彼此對說與心）","","<p>認為三個字涵蓋了教會可用的各種歌：舊約詩篇、讚美基督的頌歌、聖靈感動的自發之歌。保羅的重點不在曲風，而在兩件事：一是「彼此對說」——唱詩也是互相教導勸戒（西 3:16）；二是「口唱心和」——真正的樂器是心。新舊並用，讓不同世代彼此唱給對方聽。</p><p><strong>難處：</strong>「多元」若沒有原則，容易變成各取所好，或讓歌詞的神學內容被忽略；也可能在實務上兩邊都不滿意。選歌仍需要以真道與造就為準（林前 14:26「凡事都當造就人」）。</p>"],["【三】本講義站在哪裡","","<p><strong>本講義採多元並用說。</strong>經文沒有規定曲風，卻定了兩條標準：歌詞要能「彼此對說」，也就是有內容、能教導、能造就人；唱的人要「口唱心和」，敬拜的對象是主，不是自己的喜好或台上的表演。</p><p>而且這一節是 5:18 被聖靈充滿的第一根枝子，緊接著就是 5:21 彼此順服——為詩歌爭吵的教會，正好在這兩節之間失落了。長輩為年輕人的新歌讓一步，年輕人為長輩的聖詩讓一步，那就是被聖靈充滿的樣子。</p>"]],"con":[],"say":"本講義的立場：5:19 沒有規定曲風，傳統聖詩與現代敬拜詩歌都可以用；標準是歌詞能彼此教導造就、唱的人口唱心和地向著主，而且在詩歌上彼此順服。爭議的分寸見全卷立場 ISS00_9。","care":"教會裡可能有人因為詩歌的事被批評「不屬靈」「老古板」，也有敬拜團的年輕人覺得自己的服事不被看見，還有長輩覺得教會已經不是自己的家。講台上不嘲笑任何一種風格。牧者陪伴時，先聽雙方真正在意的是甚麼——常常不是曲子，是被尊重、被記得；不要用「順服就好」壓下任何一方的感受，也可以安排兩代一起選歌、一起帶領。"},{"id":"ISS05_6","t":"5:21--24「彼此順服」與「妻子順服丈夫」——互補派與平等派怎樣讀？","r":"5:21--24；5:25；林前11:3；加3:28","ch":[5],"why":"5:22 可能是今天新約裡最受爭議、也最常被誤用的一節。有些姊妹一聽到就皺眉，有些弟兄拿它要求太太聽話；敬重聖經的福音派學者在「頭」與「順服」的意思上確實有不同的讀法。這一題關乎婚姻、教會中的性別角色，也關乎講台能不能誠實並陳，而不把任何一方講成不信聖經。","pos":[["【一】經文問的是甚麼","","<p>「又當存敬畏基督的心，彼此順服。」（5:21）接著「你們作妻子的，當順服自己的丈夫，如同順服主。」（5:22）5:22 原文沒有動詞：<strong>Αἱ γυναῖκες τοῖς ἰδίοις ἀνδράσιν ὡς τῷ κυρίῳ</strong>，順服借自 5:21 的分詞 <strong>ὑποτασσόμενοι</strong>（hypotassomenoi）；5:23「丈夫是妻子的<strong>κεφαλὴ</strong>（kephalē，頭）」。問題是：「彼此順服」是否取消了單向的順服？「頭」是權柄，還是源頭？今天的夫妻怎樣活出這段經文？</p>"],["互補派（平等的價值，不同的角色）","","<p>認為夫妻在神面前同樣尊貴，「一同承受生命之恩」（彼前 3:7），但神在創造中給了不同的角色：丈夫以捨己的愛帶領，妻子以敬重回應這樣的帶領。5:21 的「彼此」是指在各自的關係中順服該順服的人，5:22--24 才說明夫妻之間的方向；「頭」帶有帶領與責任的意思（林前 11:3）。帶領的樣式是基督——為身體捨命。</p><p><strong>難處：</strong>若「帶領」沒有被 5:25 的捨己定義，很容易被誤用成控制；而且在實際生活裡，「誰作最後決定」常常被講得比「誰先捨己」更多，偏離了經文的比重——對丈夫的命令比對妻子長三倍。</p>"],["平等派（彼此順服是原則，5:22--24 是處境中的應用）","","<p>認為 5:21「彼此順服」是整段的總綱，夫妻雙方都要順服對方；5:22--24 是保羅在第一世紀父權家規處境中的應用，目的是讓福音不被誤解，同時從裡面翻轉它。「頭」可能帶有「源頭」「供應生命者」的意思，與 5:29「保養顧惜」相連；「並不分……或男或女」（加 3:28）是更深的方向。</p><p><strong>難處：</strong>5:24「凡事順服」與 5:33「妻子也當敬重她的丈夫」仍是單向的措辭，平等派需要說明為甚麼這些不是普遍的原則；「處境性的應用」若沒有清楚的判斷理由，也可能被用來取消任何不合時宜的經文。</p>"],["【三】本講義站在哪裡","","<p><strong>本講義互補派與平等派並陳，不替各個家庭決定分工。</strong>兩派都是福音派、都敬重聖經權威（回指哥林多前書立場二、加拉太書立場四）。但兩派都必須同意四件事：一、讀 5:22 一定從 5:18、5:21 讀起，讀到 5:25、5:28、5:33；二、每一組關係都雙向，對上面那一方要求更重；三、「頭」的定義是基督，作頭就是為身體捨命；四、順服絕不包括忍受暴力、虐待、控制或被迫犯罪——「順從神，不順從人，是應當的」（徒 5:29）。</p><p>本講義的全卷立場見 ISS00_3。</p>"],["【四】這件事該不該影響你的信心","","<p>不該。你們家怎樣分工，可以在禱告中一起尋求；兩派敬虔的夫妻都活出了美好的婚姻。真正要問的是：我們家裡，基督是不是被敬畏的那一位？丈夫有沒有像基督那樣捨己？妻子是被愛得越來越自由，還是越來越害怕？</p><p>如果答案是害怕，那不是神學派別的問題，是需要幫助的問題。</p>"]],"con":[],"say":"本講義的立場：5:21--24 互補派與平等派並陳，兩派都是敬重聖經的福音派；但一律從 5:18、5:21 讀起，讀到 5:25，作頭就是像基督那樣捨己，順服絕不包括忍受暴力。本講義的全卷立場見 ISS00_3。","care":"會眾席上可能有在父權家庭裡長大、聽到 5:22 就想起母親被壓迫的姊妹，也可能有因為太太比自己能幹而自卑的弟兄，還有正在婚姻裡受傷的人。講台上不嘲笑任何一派，也不把「順服」講成女性專屬的美德。會後若有人說出家裡的控制或恐懼，先相信他、先確認安全，不追問細節，也不急著勸「多順服一點」；必要時協助尋求專業協助。"},{"id":"ISS05_7","t":"5:22 被用來合理化家暴——教會怎樣回應？","r":"5:21--33；瑪2:16；徒5:29；詩34:18","ch":[5],"why":"這不是假設的問題。教會裡確實有姊妹（也有少數弟兄）被打、被威脅、被控制經濟與人際，而施暴者引用 5:22，有時教會也勸她回家「更順服、更禱告、為了孩子忍一忍」。這一題不是學術辯論，是保護人命的問題；講台上一句話，可能決定一個人敢不敢求助。","pos":[["【一】經文問的是甚麼","","<p>施暴者常引的是：「教會怎樣順服基督，妻子也要怎樣凡事順服丈夫。」（5:24）可是同一段經文說：「你們作丈夫的，要愛你們的妻子，正如基督愛教會，為教會捨己。」（5:25）又說「愛妻子便是愛自己了」（5:28），要「保養顧惜」（5:29）。問題是：「凡事順服」包不包括忍受暴力？受暴的人可以離開嗎？教會該站在哪裡？</p>"],["勸和優先說（婚姻神聖，盡量挽回）","","<p>有些教會認為婚姻是神所配合的，「人不可分開」，所以遇到家暴，首先要勸雙方悔改、和好，安排婚姻協談，鼓勵受害者以禱告和更多的愛感化對方；分居或離婚是最後的手段，甚至不被允許。出發點是珍惜婚姻、相信神能改變人。</p><p><strong>難處：</strong>這個做法常常讓受害者在危險中多留了好幾年，有時付出的是生命；在暴力仍在進行時作夫妻協談，可能讓她回家後被報復。它也把維持婚姻的責任放在受害者身上，正好與 5:25 把最重的責任放在丈夫身上相反。</p>"],["安全優先、分居許可說（先保護，再談婚姻）","","<p>認為暴力本身已經嚴重違背了婚約；「休妻的事和以強暴待妻的人都是我所恨惡的」（瑪 2:16）。教會的第一責任是保護受害者與孩子的安全——協助她暫時離開、尋求庇護、法律保護與專業協助；分居是為了安全，不是罪。和好只有在施暴者真實悔改、長期接受輔導、安全可以被確認之後才談。</p><p><strong>難處：</strong>這個立場在保護上清楚，但對於「最終可不可以離婚」，它本身沒有給答案；而且教會需要真實的資源、受過訓練的同工與轉介網絡，才不會只停在口號。</p>"],["暴力即遺棄、可以離婚說（把長期暴力視為破壞婚約）","","<p>部分福音派學者認為，主耶穌與保羅給的離婚理由（太 19:9 淫亂；林前 7:15 不信的一方離去）背後的原則是婚約被一方實質破壞；長期、不悔改的暴力與控制，就是用行動離棄婚約，受害者在主面前可以離婚而不被定罪。</p><p><strong>難處：</strong>這是對經文原則的延伸，福音派內部並不一致，有些人認為只能分居不能再婚；教會若把這個立場講得太快，也可能讓還想挽回、施暴者也真心悔改的家庭失去機會。需要個別的牧養判斷。</p>"],["【三】本講義站在哪裡","","<p><strong>本講義採安全優先說，並把離婚與再婚的問題留給個別的牧養判斷，各家並陳。</strong>底線寫進紅線一：順服絕不包括忍受暴力、虐待、控制或被迫犯罪。遇到家暴，教會的第一件事是保護受害者與孩子的安全——必要時協助報警、尋求專業協助與庇護，而不是勸她回家順服。</p><p>丈夫若引 5:22 而不行 5:25，他已經先離開了經文。教會要對施暴者說話：要求他停止暴力、負起法律與屬靈的責任，而不是替他向受害者求情（全卷立場見 ISS00_3）。</p>"],["【四】這件事該不該影響你的信心","","<p>如果你正在受暴，請你聽清楚：離開危險不是不順服神，神沒有要你為了順服，把自己和孩子留在危險裡。「耶和華靠近傷心的人，拯救靈性痛悔的人。」（詩 34:18）</p><p>請你先讓自己安全，告訴一位信得過的人，聯絡當地的家暴求助專線或警方。你的信心不會因為求助而變小；那位為教會捨己的主，正站在你這一邊。</p>"]],"con":[],"say":"本講義的立場：5:22 絕不是家暴的護身符；順服不包括忍受暴力、虐待、控制或被迫犯罪。遇到家暴，教會先保護受害者與孩子的安全，協助報警、庇護與專業協助，不勸她回家順服；離婚與再婚個別牧養，各家並陳。本講義的全卷立場見 ISS00_3。","care":"這是本章最需要保護人的一題。講台上要明說「如果你正在受暴，這段經文沒有要你忍下去」，並在週報或投影片上放求助專線。有人來求助時，第一件事是先保護安全：確認她和孩子今晚有沒有安全的地方，協助聯絡庇護單位、警方與專業協助（社工、家暴防治中心、心理諮商）。相信她、不追問細節、不要求她原諒或和好、不對她說「你要有信心」「為了孩子忍一忍」「你是不是也有錯」；不與施暴者一起作夫妻協談，不把她的去處告訴施暴者；涉及兒童時依法通報。會後單獨、持續地關心她，教會的陪伴要比一次談話更長。"},{"id":"ISS05_8","t":"5:31--32「二人成為一體」「極大的奧祕」——婚姻是基督與教會的圖畫嗎？","r":"5:28--33；創2:24；啟19:7","ch":[5],"why":"保羅引了伊甸園的一句話，然後說「我是指著基督和教會說的」。有人因此把婚姻講成人生最高的呼召，讓單身的人覺得自己不完整；也有人把婚姻講成聖禮；還有人覺得這只是比喻，與今天的夫妻無關。這一題關乎我們怎樣看婚姻，也關乎單身、喪偶、離婚的人在教會裡的位置。","pos":[["【一】經文問的是甚麼","","<p>「為這個緣故，人要離開父母，與妻子連合，二人成為一體。」（5:31）這是創 2:24 的明文引用。接著「這是極大的奧祕，但我是指著基督和教會說的。」（5:32）<strong>τὸ μυστήριον τοῦτο μέγα ἐστίν</strong>（to mystērion touto mega estin）——在以弗所書裡，「奧祕」是神從前隱藏、如今顯明的計畫。問題是：婚姻與基督和教會，哪一個是原版？這個連結對今天的婚姻與單身意味著甚麼？</p>"],["聖禮說（婚姻是傳遞恩典的聖禮）","","<p>拉丁文武加大譯本把 μυστήριον（mystērion）譯為 sacramentum，天主教傳統據此把婚姻列為七件聖禮之一：婚姻本身是基督與教會結合的有效記號，傳遞恩典，因此不可解除。這個傳統高度尊重婚姻的神聖與恆久。</p><p><strong>難處：</strong>希臘文 μυστήριον 在以弗所書裡一貫指神顯明的救恩計畫（1:9；3:3--6），不是一種儀式；把它讀成聖禮，是從拉丁譯文推出來的。改教家因此不把婚姻列為聖禮，但同樣尊重婚姻。</p>"],["比喻說（保羅只是借婚姻作例子）","","<p>認為保羅主要在講基督與教會，婚姻只是一個方便的例子；第 32 節的「但我是指著」表示他把讀者從婚姻轉開，重點不在婚姻本身。這個讀法提醒我們不要把婚姻浪漫化，也不要把夫妻關係當成屬靈生命的全部。</p><p><strong>難處：</strong>第 33 節「然而，你們各人都當愛妻子」又把話題拉回真實的婚姻；而且第 31 節引創 2:24，表示神在創造婚姻時已經有這幅圖畫在心裡，婚姻不只是保羅臨時借來的例子。</p>"],["原版與圖畫說（基督與教會是原版，婚姻是神放在人間的圖畫）","","<p>認為基督與教會的聯合才是神永恆計畫中的原版，伊甸園的婚姻從一開始就是指向它的圖畫；所以婚姻很尊貴，因為它要讓世界看見基督怎樣愛教會；但婚姻也不是終極的——啟示錄說「羔羊婚娶的時候到了」（啟 19:7），那才是真正的婚宴。每一個信徒，不論已婚未婚，都在那個原版的婚姻裡。</p><p><strong>難處：</strong>這個讀法很美，但若講得太滿，容易讓婚姻承受它承擔不起的重量——破碎的婚姻好像毀了一幅屬靈的畫，讓離婚或婚姻痛苦的人更加羞愧。</p>"],["【三】本講義站在哪裡","","<p><strong>本講義採原版與圖畫說。</strong>這是保羅自己作的連結（創 2:24 → 基督與教會），可以講滿：婚姻尊貴，因為它指向基督；婚姻不是終極，因為它指向基督。所以不把婚姻講成偶像，也不講成枷鎖。</p><p>對夫妻，這是最高的標準：你的婚姻要讓人看見基督怎樣愛教會。對單身、喪偶、離婚的弟兄姊妹，這是最大的安慰：你沒有錯過那個真正的婚姻。「離開父母」是盟約次序的改變，不是斷絕孝敬（全卷立場見 ISS00_3）。</p>"]],"con":[],"say":"本講義的立場：基督與教會是原版，婚姻是神放在人間指向它的圖畫——這是保羅自己作的連結，可以講滿；婚姻尊貴但不是終極，單身、喪偶、離婚的信徒同樣在那個原版的婚姻裡。本講義的全卷立場見 ISS00_3。","care":"會眾席上有渴望結婚卻一直等不到的人、有剛喪偶的人、有經歷離婚的人，也有婚姻正在冷戰的夫妻；「婚姻是基督與教會的圖畫」可能讓他們覺得自己是失敗的畫。講台上一定要同時對單身與破碎的人說話。會後不要問單身的人「怎麼還不結婚」，不要對離婚的人說「你毀了神的見證」；陪他們讀 5:27——那位新郎親手把新婦洗淨，沒有一個人是靠自己的婚姻成績站在他面前的。"},{"id":"ISS05_9","t":"5:20「凡事要……常常感謝父神」——苦難和罪惡也要感謝嗎？","r":"5:20；帖前5:18；約11:35；詩13:1","ch":[5],"why":"有人在喪禮上被勸「要感謝神」，有人在被性侵、被背叛之後被要求「為這件事感恩」，結果覺得神殘忍、教會冷漠；也有人反過來把感謝當作否認痛苦的方法。這一題關乎受苦的人怎樣禱告，也關乎教會會不會用一節經文，叫人把眼淚藏起來。","pos":[["【一】經文問的是甚麼","","<p>「凡事要奉我們主耶穌基督的名常常感謝父神。」（5:20）原文 <strong>εὐχαριστοῦντες πάντοτε ὑπὲρ πάντων</strong>（eucharistountes pantote hyper pantōn）——「常常為一切事感謝」；帖前 5:18 則是「凡事謝恩」（原文是「在一切事上」）。問題是：「為一切事」包括罪惡、暴力與死亡嗎？感謝是要我們說壞事是好的嗎？</p>"],["字面全包說（為一切事件本身感謝，因神掌權）","","<p>認為既然神掌管萬有，「萬事都互相效力，叫愛神的人得益處」（羅 8:28），那麼信徒應當為每一件臨到的事感謝，包括疾病與失落，因為這表示完全的信靠與降服。有些見證確實描述人在最痛的時候說出感謝，因而經歷了平安。</p><p><strong>難處：</strong>這個說法很容易變成「為罪惡感謝」：被性侵、被虐待的人被要求為那件事感恩，等於說神喜悅那件惡事；它也忽略了聖經大量的哀歌——「耶和華啊，你忘記我要到幾時呢？」（詩 13:1）。</p>"],["在一切事中感謝說（感謝的是神，不是惡事本身）","","<p>著重帖前 5:18 的「在一切事上」與 5:20 的「奉主耶穌基督的名」「感謝父神」：感謝的對象是父，不是事件；在任何處境裡，都可以為神的同在、應許與基督的救恩感謝，卻不必說那件惡事是好的。保羅寫這句話時手上綁著鎖鍊，他感謝的是神沒有離開，不是鎖鍊本身。</p><p><strong>難處：</strong>5:20 的 ὑπὲρ πάντων（hyper pantōn）字面確實是「為一切」，這個讀法需要說明為甚麼不是字面的全包；若講得太快，也可能削弱「凡事」的徹底。</p>"],["群體與時間說（感謝是群體一生的方向，不是當下的要求）","","<p>注意 5:20 是 5:18 被聖靈充滿的分詞之一，夾在「彼此對說」與「彼此順服」之間：感謝是群體的生活方向，不是對某一個哭泣的人下的命令。哀哭的人可以先哀哭，群體替他唱、替他感謝；「與哀哭的人要同哭」（羅 12:15），感謝常常是走過哀歌之後才長出來的。</p><p><strong>難處：</strong>這個讀法很有牧養智慧，但若只強調「慢慢來」，可能讓人一直停在苦毒裡，看不見感謝本身也是一條走出黑暗的路。</p>"],["【三】本講義站在哪裡","","<p><strong>本講義採在一切事中感謝說，並以群體與時間說作為牧養的方式。</strong>感謝的對象是父神：在任何處境裡，都可以為他的同在、他的應許、基督的救恩感謝；但不必、也不可以說罪惡與暴力是好的。</p><p>主耶穌在拉撒路墳前哭了（約 11:35），在客西馬尼園憂傷幾乎要死，卻也在被賣的那一夜拿起餅來祝謝——哀哭與感謝在他身上同時存在。教會可以替哀哭的人唱感謝的歌，卻不可以逼他唱。爭議的分寸見全卷立場 ISS00_9。</p>"],["【四】這件事該不該影響你的信心","","<p>不該讓你覺得自己不屬靈。如果你今天說不出感謝，你可以先說出你的痛；詩篇裡一半的禱告都是這樣開始的。</p><p>感謝不是假裝沒事，是在最黑的地方仍然相信：父沒有離開。也許今天你只能說一句「主啊，謝謝你還在」，那就夠了。</p>"]],"con":[],"say":"本講義的立場：5:20 的感謝對象是父神——在一切事中為他的同在與救恩感謝，不是說罪惡、暴力與死亡是好的；哀哭與感謝可以同時存在，教會不可用這一節逼受苦的人收起眼淚。爭議的分寸見全卷立場 ISS00_9。","care":"會眾席上可能有剛失去孩子的父母、剛被診斷重病的人、曾經被性侵或家暴的人、長期無望的人。講台上不要說「你要為這件事感謝神」。會後陪伴時，不追問細節、不要求原諒、不對正在流淚的人說「你要有信心」；先和他一同哭，陪他用詩篇的哀歌禱告；會後單獨關心，若有長期的憂鬱或無望感，協助他尋求專業協助。"},{"id":"ISS06_1","t":"6:1--3「要在主裡聽從父母」——成年兒女要聽從父母到甚麼程度？","r":"6:1--3；5:31；可7:11--12；太10:37","ch":[6],"why":"華人教會裡，這幾節常常被拿來處理最痛的家務事：父母反對婚事、要求兒女放棄呼召、逼兒女回家祭祖、替成年兒女決定工作和住處。有人因此背著「不孝」的罪名多年；也有人拿「在主裡」當理由，不再照顧年老的父母。這一題關乎一個人怎樣同時忠於主、又孝敬父母。","pos":[["【一】經文問的是甚麼","","<p>保羅說：「你們作兒女的，要在主裡聽從父母，這是理所當然的。」（6:1）接著引十誡：「要孝敬父母，使你得福，在世長壽。」（6:2）6:1 的對象 <strong>τὰ τέκνα</strong> 是在家中受養育的兒女，動詞是「聽從」；6:2 的動詞換成「孝敬」，那是十誡對所有以色列人、一生的命令。問題是：兒女長大成家以後，「聽從」還是同一個要求嗎？「在主裡」是動力，還是界線？</p>"],["終身聽從說（傳統孝道的讀法）","","<p>認為「聽從父母」不因年齡而改變；父母在，兒女的重大決定都應當得父母同意，這才是「理所當然」。這個讀法與華人「父母在，不遠遊」的倫理相合，也看重家族的和睦，提醒個人主義的社會不要輕看父母的智慧。</p><p><strong>難處：</strong>經文把「聽從」放在「在主裡」底下，又在前一章說「人要離開父母，與妻子連合」（5:31）；若父母的要求違背主，或替兒女決定婚姻與呼召，這個讀法就把父母放到了主的位置，主耶穌說「愛父母過於愛我的，不配作我的門徒」（太 10:37）。</p>"],["成年自主說（成年後只須尊重）","","<p>認為 6:1 只對未成年兒女說話；兒女成年後，與父母是兩個獨立的成年人，彼此尊重即可，不必再聽從，也不必讓父母參與決定。這個讀法保護了成年兒女免於操控，也符合 5:31 的「離開」。</p><p><strong>難處：</strong>它容易把 6:2 的「孝敬」也一起縮小了。孝敬是一生的責任——尊重、照顧、奉養；主耶穌責備法利賽人用「各耳板」逃避奉養父母（可 7:11--12）。只講自主不講孝敬，會讓基督徒在華人家庭裡失去見證。</p>"],["【三】本講義站在哪裡","","<p><strong>聽從有時，孝敬一生。</strong>6:1 的「聽從」是對在家受養育的兒女說的；6:2 的「孝敬」是一生的責任。成年兒女孝敬父母——聽他們的意見、尊重、照顧、奉養——但婚姻、信仰、呼召的決定，是在主面前自己負責的。</p><p>「在主裡」同時是動力與界線：父母要求違背主的事，兒女可以溫柔地不從，卻不撤回尊敬。可以拒絕那一件事，不可以拒絕那一個人。這是本講義的全卷立場 ISS00_3，本章不另立說法。</p>"],["【四】這件事該不該影響你的信心","","<p>不該讓你掉進兩邊的罪咎。若你因為信主、婚事或呼召與父母有張力，你不必覺得自己是「不孝的基督徒」；若你正在照顧年老的父母、累得說不出話，主看見那一份孝敬。</p><p>6:2 說這是「第一條帶應許的誡命」——孝敬父母不是一份枷鎖，是神給的福分，而你在主面前作的每一個艱難決定，主都與你同在。</p>"]],"con":[],"say":"本講義的立場：6:1 的「聽從」是對在家受養育的兒女說的，6:2 的「孝敬」是一生的責任；成年兒女尊重、照顧、奉養父母，但婚姻、信仰、呼召在主面前自己負責；「在主裡」也是界線，可以溫柔地拒絕那一件事，不撤回對父母的尊敬。本講義的全卷立場見 ISS00_3。","care":"會眾席上有正在被父母逼婚、因信主被家人斷絕往來的年輕人，也有覺得兒女信主後就「被教會搶走」的父母，還有正在長期照顧失智父母、身心俱疲的人。講台上不說「你父母不信主，不必聽他們」，也不說「孝順就是一切照辦」。會後若有人來談，先聽他家裡的故事，不急著給答案；陪他想一句可以對父母說的、溫柔又清楚的話；照顧者的疲憊要被看見，必要時協助他找喘息服務與支持團體。"},{"id":"ISS06_2","t":"6:4「不要惹兒女的氣」——華人的打罵教育與「不打不成器」，基督徒還可以打孩子嗎？","r":"6:4；西3:21；箴13:24；來12:11","ch":[6],"why":"很多華人基督徒是被打大的，現在自己也當了父母，一面記得童年的傷，一面又聽人引用箴言說「不忍用杖打兒子的，是恨惡他」。有人用聖經替失控的打罵辯護，也有人因此覺得一切管教都是錯的。這一題關乎孩子的安全，也關乎父母怎樣在主裡養育。","pos":[["【一】經文問的是甚麼","","<p>「你們作父親的，不要惹兒女的氣，只要照著主的教訓和警戒養育他們。」（6:4）<strong>παροργίζετε</strong> 與 4:26 的「含怒」同字根，是「激起怒氣」；<strong>ἐκτρέφετε</strong> 是 5:29 基督保養教會的同一個字；<strong>παιδείᾳ</strong> 包含訓練與紀律，<strong>νουθεσίᾳ</strong> 是用話語勸戒。歌羅西書加了一句理由：「恐怕他們失了志氣」（西 3:21）。問題是：「管教」包不包括體罰？甚麼樣的管教是在惹兒女的氣？</p>"],["有限度的體罰說","","<p>認為箴言「疼愛兒子的，隨時管教」（箴 13:24）與希伯來書「凡管教的事，當時不覺得快樂，反覺得愁苦」（來 12:11）顯示管教可以包含身體上的懲戒；只要在冷靜中、有清楚的規則、不造成傷害、事後有擁抱與解釋，就不是惹氣。</p><p><strong>難處：</strong>箴言的「杖」是智慧文學的比喻還是字面的方法，學者本來就有不同讀法；而在華人家庭裡，「冷靜、不傷害」的界線很容易被情緒越過。許多地方的法律也已經限制或禁止體罰，基督徒不能不顧。</p>"],["不採體罰說","","<p>認為 6:4 的重心在「不要惹兒女的氣」與「養育」，新約沒有任何一處吩咐父母打孩子；兒童發展的研究也顯示，體罰容易教會孩子恐懼與暴力，而不是智慧。管教應當用規則、後果、陪伴與話語。</p><p><strong>難處：</strong>這個說法若講成「一切紀律都會傷害孩子」，就丟掉了 παιδείᾳ 本身的紀律意義；有些父母因此不敢設任何界線，孩子反而失去了被引導的安全感。</p>"],["【三】本講義站在哪裡","","<p><strong>本講義對「可不可以有任何形式的體罰」兩說並陳，不替各家庭決定；但 6:4 的底線是清楚的。</strong>羞辱、貶低、比較、冷暴力、情緒失控的打罵、造成身體傷害的懲罰、永遠達不到的標準，都是在惹兒女的氣，不是主的管教。造成傷害的就是兒虐，教會要先保護孩子，必要時通報。</p><p>父母要問的不是「我有沒有權打」，是「這是主的管教，還是我的脾氣」。這是本講義的全卷立場 ISS00_3 在親子上的應用。</p>"],["【四】這件事該不該影響你的信心","","<p>不該讓你絕望。若你小時候被打罵、被比較，你的傷是真的，主看見；你不必替那些打罵說成是愛。若你現在當了父母，發現自己也說出了同樣的話，回頭的路就是向孩子道歉——肯認錯的父母，正在教孩子家裡最大的是主。</p><p>天父管教我們，從來不是為了洩憤，是「為要我們得益處」；我們也照樣學。</p>"]],"con":[],"say":"本講義的立場：6:4 沒有廢掉管教，廢掉的是激怒——羞辱、比較、失控的打罵與言語暴力；是否容許任何體罰兩說並陳，但造成傷害的就是兒虐，教會先保護孩子。父母要問：這是主的管教，還是我的脾氣？本講義的全卷立場見 ISS00_3。","care":"會眾席上有童年被打罵、至今仍會在某一句話面前發抖的人，也有正在對孩子失控、心裡很自責的父母，還可能有正在受虐的孩子。講台上不說「打你是因為愛你」「你父母也是為你好，要饒恕」。會後若有人說起童年的傷，不追問細節、不要求他立刻原諒，陪他在主面前說出來；若發現孩子正在受到傷害，依法通報並保護孩子；需要時協助家庭尋求親職與心理專業協助。"},{"id":"ISS06_3","t":"6:5--9「僕人要聽從主人」——聖經支持奴隸制嗎？今天怎樣用在職場？","r":"6:5--9；西4:1；門1:16","ch":[6],"why":"這是慕道友最常拿來質疑聖經的經文之一：「你們的聖經叫奴隸聽主人的話，不就是支持奴隸制嗎？」教會裡也有人反過來用這幾節要員工無條件服從老闆。這一題不處理清楚，一邊會失去對聖經的信任，另一邊會把經文變成壓迫人的工具。","pos":[["【一】經文問的是甚麼","","<p>「你們作僕人的，要懼怕戰兢，用誠實的心聽從你們肉身的主人，好像聽從基督一般。」（6:5）緊接著：「你們作主人的，待僕人也是一理，不要威嚇他們。因為知道，他們和你們同有一位主在天上；他並不偏待人。」（6:9）保羅沒有下令廢除奴隸制，卻直接對奴隸說話，也對主人下命令。問題是：這是默許，還是另一種翻轉？今天怎樣用？</p>"],["默許說（批評者的讀法）","","<p>認為保羅既然叫奴隸聽從、沒有譴責制度，就是接受了當時的奴隸制；歷史上也確實有人在美洲引用這幾節替蓄奴辯護，所以這段經文有道德上的問題。</p><p><strong>難處：</strong>這個讀法忽略了經文自己的內容：保羅要主人「待僕人也是一理」，把主人和奴隸放在同一位主之下，又說阿尼西母「不再是奴僕，乃是高過奴僕，是親愛的兄弟」（門 1:16）；而且第一世紀羅馬的奴隸制與後來以種族為基礎的奴隸貿易性質不同，不能直接等同。</p>"],["只改人心說（保守的讀法）","","<p>認為保羅的重點只在個人的屬靈態度：奴隸好好做工，主人好好待人，社會制度不是福音關心的事；今天用在職場，就是員工順服、老闆仁慈，各安其位。</p><p><strong>難處：</strong>它把 6:9 的分量講輕了。「同有一位主」「他並不偏待人」，在那個社會是動搖根基的話；後來基督徒廢除奴隸制，正是從這裡長出來的。只改人心的讀法，容易被拿來要求下面的人忍受不義。</p>"],["內在翻轉說（種子說）","","<p>認為保羅在一個奴隸佔人口很大比例、他也無力改變法律的社會裡，先從裡面改變關係：對奴隸說他們是能直接回應基督的人，對主人說他們頭上也有主。這不是終點，是種子；當主人和奴隸同坐一桌、稱為弟兄，這個制度的根基就已經開始鬆動。</p><p><strong>難處：</strong>這個說法需要承認，教會花了很長的時間才讓種子長成；也要誠實面對歷史上教會的失敗，不能只為經文辯護。</p>"],["【三】本講義站在哪裡","","<p><strong>本講義採內在翻轉說。</strong>保羅沒有建立奴隸制，也沒有替它辯護；他把主人和奴隸放在同一位主之下，這是後來廢除奴隸制的種子。今天的職場不是奴隸制，原則卻天天用得上：員工「從心裡」「甘心」做工，像服事主（6:6--7）；雇主不威嚇、不偏待，因為自己頭上也有主（6:9）。</p><p>「好像聽從基督一般」也是界線：不包括忍受違法、霸凌、性騷擾或被要求作假。這是本講義的全卷立場 ISS00_3，處境與原則的判斷見 ISS00_1。</p>"],["【四】這件事該不該影響你的信心","","<p>不該。聖經沒有要你替一切歷史上的錯誤辯護，卻讓你看見：福音在最不平等的社會裡，第一個把奴隸稱為「親愛的兄弟」。若你今天在職場上被看輕，你的評分表不在老闆手上；若你握有權柄，你頭上也有一位不看面子的主。</p>"]],"con":[],"say":"本講義的立場：保羅沒有建立奴隸制，也沒有替它辯護；他把主人和奴隸放在同一位主之下，這是廢除奴隸制的種子。今天用在職場：員工甘心做工，雇主不威嚇、不偏待；不包括忍受違法、霸凌、性騷擾或作假。本講義的全卷立場見 ISS00_3、ISS00_1。","care":"會眾席上可能有正在職場被霸凌、被性騷擾、被要求作假帳而不敢說的人，也有被長時間工作壓得喘不過氣的外籍移工與基層勞工；也有握有權柄、卻從沒想過自己在威嚇人的主管。講台上不說「忍一忍就是見證」。會後若有人來談職場的傷害，先相信他、聽完，不急著勸他離職或留下；必要時協助他找法律與勞工申訴的管道，並為他的生計一起禱告、具體幫忙。"},{"id":"ISS06_4","t":"6:10--12「與執政的、掌權的……爭戰」——「捆綁地域邪靈」可以嗎？","r":"6:10--13；1:21--22；西2:15；徒19:13--16","ch":[6],"why":"近三十年，一些教會流行「策略性層次屬靈爭戰」：畫出一座城的屬靈地圖、找出掌管那裡的邪靈名字、在高處禱告捆綁。有人覺得這是更有能力的禱告，也有人因此活在恐懼裡，到哪裡都覺得有鬼。這一題關乎教會怎樣讀 6:12，也關乎會眾聽完是更平安，還是更害怕。","pos":[["【一】經文問的是甚麼","","<p>「因我們並不是與屬血氣的爭戰，乃是與那些執政的、掌權的、管轄這幽暗世界的，以及天空屬靈氣的惡魔爭戰。」（6:12）這是真實的靈界勢力；可是同一段經文給的方法是：「要穿戴神所賜的全副軍裝，就能抵擋魔鬼的詭計。」（6:11）四次「站」（6:11、13、14）。問題是：6:12 有沒有教我們去辨認、點名、捆綁掌管某地的邪靈？</p>"],["策略性層次屬靈爭戰說","","<p>認為 6:12 的「執政的、掌權的」有地域性的分工（常引但 10:13「波斯國的魔君」）；教會要先研究一個地方的歷史與偶像，辨認掌管那裡的邪靈，以權柄捆綁它，福音才能突破。這個做法強調禱告的迫切，也提醒教會屬靈爭戰是真的。</p><p><strong>難處：</strong>新約沒有一處吩咐或示範點名地域邪靈；但以理書那一段是天使的爭戰，不是人的方法。這種戰術容易把注意力放在鬼的名字上，也容易製造恐懼與屬靈精英主義。</p>"],["傳統福音派的讀法","","<p>認為執政掌權者是真實的墮落靈界勢力，基督已經「遠超過一切執政的、掌權的」（1:21），並且「將一切執政的、掌權的擄來，明顯給眾人看，就仗著十字架誇勝」（西 2:15）。信徒的爭戰方式是站住、穿上真理與品格、禱告、傳福音，不需要特別的戰術。</p><p><strong>難處：</strong>這個讀法講不好，會讓人覺得屬靈爭戰只是「好好做人」，看不見爭戰的真實；也要回答靈界勢力怎樣透過人間的結構運作。</p>"],["結構說","","<p>認為「執政的、掌權的」除了靈界勢力，也包括人間的政治、經濟、文化結構中的邪惡；所以爭戰也在對抗不義、貪婪、族群歧視的制度裡。這個讀法提醒教會，詭計不只在異象裡，也在制度裡。</p><p><strong>難處：</strong>若完全把執政掌權者講成制度，就把 6:12「天空屬靈氣的惡魔」講沒了，屬靈爭戰變成社會運動。</p>"],["【三】本講義站在哪裡","","<p><strong>本講義不採地域邪靈、屬靈地圖、點名捆綁的戰術。</strong>執政掌權者主要是靈界勢力，也透過人間的結構與文化運作；勝負已定，信徒從得勝的位置站立。保羅的戰術只有站住、禱告與傳福音（6:18--20）。</p><p>使徒行傳講義第 19 章講過，在以弗所，有人拿主耶穌的名當咒語趕鬼，反被惡鬼制伏（徒 19:13--16）；以弗所的信徒做的，是把法術書燒了。這是本講義的全卷立場 ISS00_4。</p>"],["【四】這件事該不該影響你的信心","","<p>不該讓你恐慌。你不必知道任何一個邪靈的名字，你只要知道那一個名字——耶穌基督，他已經坐在一切執政掌權的之上，你也和他「一同坐在天上」（2:6）。站在那裡，就是爭戰。你的禱告不必更大聲、更有技巧，只要靠著主，為你住的那條街、那座城裡的人叫名禱告，並且活出平安的福音。</p>"]],"con":[],"say":"本講義的立場：6:12 的執政掌權者主要是靈界勢力，也透過人間結構運作；勝負已定，爭戰的方式是站住、穿上真理與品格、禱告與傳福音。不採地域邪靈、屬靈地圖、點名捆綁的戰術。本講義的全卷立場見 ISS00_4。","care":"會眾席上可能有從強調地域爭戰的教會轉來、心裡仍很害怕的人，也有曾經參加「捆綁禱告」、對結果失望而懷疑神的人。講台上不嘲笑他們，也不點名批評別的教會。會後陪他重讀 1:21--22 與 2:6，讓他知道自己站在哪裡；若他的恐懼已經影響睡眠、出門或工作，溫和地陪他尋求專業協助，同時為他禱告。"},{"id":"ISS06_5","t":"6:12 鬼月、風水、拜拜的食物、護身符——基督徒要怕嗎？","r":"6:11--13；2:2；2:13；5:8；林前10:25--28；徒19:19","ch":[6],"why":"華人基督徒每年都會碰到：七月不敢搬家、不敢結婚；長輩替孫子綁紅線、塞平安符；同事分拜拜的水果；買房子時家人堅持要看風水。有人一律害怕、處處迴避，也有人覺得「只是文化，沒關係」。這一題關乎信徒在一座有廟、有算命攤的城市裡，怎樣平安地活著。","pos":[["【一】經文問的是甚麼","","<p>以弗所是一座法術之城。保羅說信徒從前「順服空中掌權者的首領」（2:2），「但如今在主裡面是光明的」（5:8）；又說要「穿戴神所賜的全副軍裝，就能抵擋魔鬼的詭計」（6:11）。問題是：基督徒面對民間信仰的日子、方位、食物與符咒，應該害怕、迴避，還是當作文化？分辨的標準在哪裡？</p>"],["全面迴避說","","<p>認為這些習俗背後都有靈界的勢力，基督徒應該一律迴避：不吃拜過的食物、七月盡量不辦大事、不經過廟口、家中不放任何長輩給的物品。這個做法看重聖潔，也認真對待靈界的真實。</p><p><strong>難處：</strong>這樣做常常讓人比不信的人更怕鬼月；而且保羅說「偶像在世上算不得甚麼」（林前 8:4），又說「凡市上所賣的，你們只管吃，不要為良心的緣故問甚麼話」（林前 10:25）。全面迴避，反而把那些東西看得太大。</p>"],["文化中立說","","<p>認為鬼月、風水、平安符多半已經是民俗，大家做是圖個心安，基督徒跟著做無傷大雅，還能避免與家人衝突。這個讀法看重家庭和睦，也提醒信徒不要動輒定罪別人的文化。</p><p><strong>難處：</strong>擇日、求符、看風水的核心是把平安與未來交給另一種力量，那正是以弗所信徒燒掉的東西（「平素行邪術的，也有許多人把書拿來，堆積在眾人面前焚燒」，徒 19:19）。全部當作文化，就看不見信靠的問題。</p>"],["【三】本講義站在哪裡","","<p><strong>不必怕，也不參與。</strong>「你們從前遠離神的人，如今卻在基督耶穌裡，靠著他的血，已經得親近了」（2:13）：在基督裡的人不在黑暗權勢底下，不必怕七月、方位或廟口。但也不拜、不求、不戴護身符、不擇日，因為那是把信靠交給別的力量。</p><p>拜拜的食物照林前 10 章：市場上的只管吃；有人特別說明「這是獻過祭的」，為對方的良心不吃（林前 10:28）。團圓、追思、敬重長輩是可以保留的文化。這是本講義的全卷立場 ISS00_4，處境的判斷見 ISS00_1。</p>"],["【四】這件事該不該影響你的信心","","<p>不該。你不必比不信的人更怕鬼月；你最大的見證，是在大家都不敢搬家的那個月，平平安安地搬家。面對長輩，你可以溫柔地說：「我信的神會保守孩子，這條紅線我先收起來，謝謝你愛他。」站立得住，是平安，不是恐慌。</p>"]],"con":[],"say":"本講義的立場：在基督裡的人不在黑暗權勢底下，不必怕鬼月、風水、廟宇；但也不拜、不求、不戴護身符、不擇日。拜拜的食物照林前 10 章分辨；團圓、追思、敬重長輩可以保留。本講義的全卷立場見 ISS00_4，處境判斷見 ISS00_1。","care":"會眾席上有剛信主、家裡長輩仍在拜拜的人，他們每一次拒絕都要承受家人的不諒解；也有從小在廟裡長大、至今仍會害怕的人。講台上不說「你家拜拜，所以你家有鬼」，也不嘲笑長輩的信仰。會後陪新信徒想一句能同時尊重長輩、又不參與的話；若有人因恐懼而失眠，陪他禱告，也溫和地建議他找人陪談。"},{"id":"ISS06_6","t":"6:13--17 全副軍裝——要每天早上「禱告穿上」嗎？","r":"6:13--17；6:11；4:24；羅13:12","ch":[6],"why":"許多信徒學過一段「穿軍裝禱告」：每天早上逐件宣告穿上真理的帶子、公義的護心鏡……有人得到很大的幫助，也有人漏了一天就心裡不安，覺得今天沒有保護。這一題關乎全副軍裝到底是甚麼、怎樣才算「穿上」，也關乎操練會不會變成儀式。","pos":[["【一】經文問的是甚麼","","<p>「所以，要拿起神所賜的全副軍裝，好在磨難的日子抵擋仇敵，並且成就了一切，還能站立得住。」（6:13）6:14--17 列出真理、公義、平安的福音、信德、救恩、神的道。6:11 的「穿戴」與 4:24「穿上新人」是同一個動詞。問題是：「穿上」是一個每天念出來的動作，還是一種活出來的生命？</p>"],["每日宣告操練說","","<p>認為逐件禱告穿上軍裝，是把經文默想成禱告的好方法：每天早上提醒自己今天要說真話、守住公義、帶著平安、舉起信心、確信救恩、拿著神的話。不少信徒因此建立了穩定的晨禱習慣。</p><p><strong>難處：</strong>經文沒有吩咐每天念一遍；若講成「沒有念就沒有保護」，就從默想變成了儀式，與以弗所人燒掉的法術書只差一步。漏念一天就不安，正說明重心已經從主移到了禱詞。</p>"],["身分已穿上說","","<p>認為軍裝主要是信徒在基督裡已經有的身分：救恩、公義、真理都是基督自己；6:13 的「拿起」是不定過去式，指一個決定性的動作。所以不必每天重新穿，只要站在已經有的身分裡。</p><p><strong>難處：</strong>這個讀法容易讓人忽略「穿」的生活面：真理要在家裡說出來，公義要在職場行出來；只講已經穿上，可能讓人覺得不必警醒，也不必禱告。</p>"],["【三】本講義站在哪裡","","<p><strong>軍裝是神所賜的品格與真理，穿上它是活出來，不是念出來。</strong>神已經在基督裡把軍裝賜給我們；我們每天的「穿」，是在家說真話、在職場行公義、在試探裡相信神的話、在磨難裡靠著主站住，並且藉著 6:18 的禱告來穿——禱告是穿戴每一件軍裝的方式。</p><p>每天早上用 6:14--17 默想禱告，是好的操練，可以做；但不可以講成護身的程序。這是本講義的全卷立場 ISS00_4。</p>"],["【四】這件事該不該影響你的信心","","<p>不該讓你不安。若你今天早上忘了禱告，主沒有忘記你；軍裝是「神所賜的」，不是你念出來才有效的。明天早上，你可以再一次用這幾節跟主說話——不是為了開啟保護，是因為你愛那位把軍裝給你的主。</p>"]],"con":[],"say":"本講義的立場：全副軍裝是神所賜的品格與真理，穿上它是在家、在職場、在試探裡活出來，並且藉著禱告穿上；每天用這幾節默想禱告是好的操練，但不是護身的程序，漏了也不會失去保護。本講義的全卷立場見 ISS00_4。","care":"會眾席上有個性很認真、很容易把操練變成強迫的人，漏了一天就焦慮；也有曾在恐懼文化的教會裡，被教導「不穿軍裝就會被攻擊」的人。講台上不要嘲笑他們的晨禱，也不要加重他們的恐懼。會後若有人說出這種不安，陪他讀 6:10「要靠著主」，讓他知道力量是加給他的；若焦慮已成強迫，溫和地建議他尋求協助。"},{"id":"ISS06_7","t":"6:17「聖靈的寶劍，就是神的道」——可以拿經文當咒語嗎？","r":"6:17；太4:4；徒19:13--16；太6:7","ch":[6],"why":"有人把經文寫成紙條貼在門上、床頭，相信可以趕走邪靈；有人遇到害怕就反覆念某一節，像在念咒；也有「正面宣告」的教導說，把經文說出口，事情就會照著成就。這一題關乎神的話與法術的分界線，在一座曾經滿了法術書的城市裡，這條線特別要緊。","pos":[["【一】經文問的是甚麼","","<p>「並戴上救恩的頭盔，拿著聖靈的寶劍，就是神的道」（6:17）。這裡的「道」原文是 <strong>ῥῆμα</strong>，偏重說出口的話。主耶穌在曠野受試探，三次用「經上記著說」回答（太 4:4）。問題是：既然神的話要說出口，那念出經文本身有沒有力量？這與念咒有甚麼不同？</p>"],["宣告有能力說（正面宣告的讀法）","","<p>認為神的話有創造的能力，信徒把經文宣告出口，就是揮動聖靈的寶劍；宣告得越多、越大聲、越有信心，就越能抵擋仇敵、改變處境。這個讀法看重神話語的能力，也鼓勵信徒背經、開口。</p><p><strong>難處：</strong>若力量在於說出口的次數與音量，經文就成了咒語；主耶穌說「你們禱告，不可像外邦人，用許多重複話」（太 6:7）。以弗所城裡有人拿主耶穌的名當咒語，反被惡鬼制伏（徒 19:13--16）。</p>"],["信靠順服說","","<p>認為寶劍的力量不在文字本身，在於說話的是聖靈、話語是真的、說的人信靠並順服它。主耶穌在曠野不是用經文施法，是用經文表明他信靠天父、拒絕走捷徑。拿寶劍，就是在試探來時，以神的話為準則作決定。</p><p><strong>難處：</strong>這個讀法講不好，可能讓人覺得不必開口、不必背經，只要「心裡知道」就好，失去 ῥῆμα 說出口的那一面。</p>"],["【三】本講義站在哪裡","","<p><strong>經文不是咒語。</strong>神的話有能力，是因為它是神的、是真的、是聖靈使用的；被信的人在對的時候說出來，就是揮動寶劍。背經、開口宣讀、用經文禱告都好，但力量不在紙條、不在次數、不在音量。</p><p>把經文貼在門上當護身符，與以弗所人燒掉的法術書是同一類東西。這是本講義的全卷立場 ISS00_4；聖經作為準則，見 321「聖經是我的準則」——準則是要拿在手上用的。</p>"],["【四】這件事該不該影響你的信心","","<p>不該。若你曾經把經文當成護身符，不必羞愧，只要把它從門上取下來，放進心裡。下一次害怕的時候，你仍然可以開口說出一節經文——不是為了念咒，而是像主耶穌一樣，用它告訴自己：我信靠的是誰。</p>"]],"con":[],"say":"本講義的立場：聖靈的寶劍是神說出口的話，力量在於它是神的、是真的、被信的人在對的時候說出來；經文不是咒語，不在次數、音量或貼在哪裡。背經、宣讀、用經文禱告都好。本講義的全卷立場見 ISS00_4。","care":"會眾席上有在恐懼中靠反覆念經文才睡得著的人，也有剛從民間信仰歸主、仍習慣用符咒的心態看待經文的人。講台上不嘲笑他們的做法，免得拿走他們唯一抓得住的東西。會後陪他把經文從「保護我的字」轉成「我跟神說的話」；若恐懼是長期失眠或焦慮的一部分，陪他禱告，也建議他尋求專業協助。"},{"id":"ISS06_8","t":"6:18「靠著聖靈，隨時多方禱告」——是指方言禱告嗎？","r":"6:18--20；5:18；林前14:14--15；羅8:26","ch":[6],"why":"在靈恩與非靈恩教會之間，6:18「靠著聖靈」常常被拿來討論：有人說這就是方言禱告，不說方言的人禱告少了力量；也有人一聽到方言就緊張。弟兄姊妹若在不同教會之間流動，很容易因為這一節彼此論斷。","pos":[["【一】經文問的是甚麼","","<p>「靠著聖靈，隨時多方禱告祈求；並要在此警醒不倦，為眾聖徒祈求」（6:18）。「靠著聖靈」原文是 <strong>ἐν πνεύματι</strong>，在本卷多次出現（2:18、2:22、3:5、5:18 相關）。這一節緊接在軍裝之後，又接著保羅為自己求「放膽開口」（6:19）。問題是：「靠著聖靈」是特指方言，還是一切靠聖靈的禱告？</p>"],["方言為主說（部分靈恩派的讀法）","","<p>認為「靠著聖靈」「用靈禱告」（林前 14:15）就是方言禱告；方言是聖靈直接在人裡面禱告，所以屬靈爭戰最有力的禱告是方言。這個讀法重視聖靈的工作，也鼓勵信徒在禱告中更多倚靠聖靈。</p><p><strong>難處：</strong>6:18 本身沒有提到方言；ἐν πνεύματι 在本卷的其他用法都不專指方言。若講成「不說方言的人禱告沒力量」，就違背了林前 12 章「不是都說方言」的教導，也在身體裡分出了等級。</p>"],["一切靠聖靈的禱告說","","<p>認為「靠著聖靈」指一切在聖靈裡、被聖靈引導和幫助的禱告：有時是悟性清楚的祈求，有時是說不出來的歎息（「聖靈親自用說不出來的歎息替我們禱告」，羅 8:26），也可以包括方言。重點是倚靠，不是形式。</p><p><strong>難處：</strong>這個讀法若講成「方言不重要」或暗示方言可疑，會傷害真心以方言禱告的肢體；保羅自己說「我要用靈禱告，也要用悟性禱告」（林前 14:15）。</p>"],["【三】本講義站在哪裡","","<p><strong>經文的範圍比方言寬。</strong>「靠著聖靈」包括一切靠聖靈的禱告；說方言的人可以用方言禱告，不說方言的人不比別人少一份。6:18 真正強調的是四個「一切」：一切禱告、一切時候、一切恆忍、一切聖徒。</p><p>方言的議題本講義回指哥林多前書立場三，本章不另立說法；這類邊緣問題講台一句帶過，不把它升格為中心（全卷立場見 ISS00_9）。</p>"],["【四】這件事該不該影響你的信心","","<p>不該。無論你說不說方言，你都可以今天就開始為一位肢體叫名禱告。保羅在鎖鍊裡求的不是更特別的禱告形式，是「放膽開口」；聖靈要的，是一群為彼此守夜、不肯停止禱告的人。</p>"]],"con":[],"say":"本講義的立場：6:18「靠著聖靈」包括一切靠聖靈的禱告，範圍比方言寬；說方言的人可以用方言禱告，不說的人不比別人少一份。方言的議題回指哥林多前書立場三，邊緣問題不升格為中心，見全卷立場 ISS00_9。","care":"會眾席上有從靈恩教會轉來、一直被說「沒有方言就沒有被聖靈充滿」而自卑的人，也有說方言、卻在現在的教會被當成怪人的人。講台上不嘲笑任何一方，也不要求誰證明自己。會後若有人為此困惑或受傷，陪他讀 6:18 的四個「一切」，邀請他加入小組的代禱名單——讓他在禱告裡被接納，而不是在形式上被分類。"},{"id":"ISS06_9","t":"6:11--12、16「魔鬼的詭計」「那惡者一切的火箭」——基督徒會被鬼附嗎？憂鬱、失眠是屬靈攻擊嗎？","r":"6:11--12；6:16；4:27；約壹4:4；路10:17--20","ch":[6],"why":"在華人教會，當一個人憂鬱、焦慮、聽見聲音、長期失眠，常常有人說他「被鬼壓」「被攻擊了」；有人因此不去看醫生，延誤治療；家屬也被指責「信心不夠」。另一邊，也有人完全不信有屬靈的攪擾。這一題關乎病人的安全，也關乎教會怎樣同時認真對待靈界與醫療。","pos":[["【一】經文問的是甚麼","","<p>「要穿戴神所賜的全副軍裝，就能抵擋魔鬼的詭計。」（6:11）「此外，又拿著信德當作盾牌，可以滅盡那惡者一切的火箭」（6:16）。又說「也不可給魔鬼留地步」（4:27）。經文承認魔鬼的攻擊是真的。問題是：在基督裡、有聖靈內住的人，會不會被鬼附？身心的疾病，甚麼時候是醫療的問題，甚麼時候是屬靈的問題？</p>"],["基督徒不會被鬼附說","","<p>認為信徒已受了聖靈的印記，是聖靈的殿；「那在你們裡面的，比那在世界上的更大」（約壹 4:4）。所以信徒可以被試探、被攻擊、被欺騙，卻不會被鬼佔據。這個讀法給信徒很大的安全感。</p><p><strong>難處：</strong>它容易讓人以為信徒完全不必警醒；而且新約沒有直接回答「信徒能不能被附」，用一句「不會」也可能讓真正在屬靈困擾中的人得不到幫助。</p>"],["不同程度攪擾說","","<p>認為信徒不會被鬼「擁有」，但若長期給魔鬼留地步（4:27），可能在某些範圍受到攪擾與壓制，需要認罪、禱告、得釋放。這個讀法認真對待 4:27 與 6:11 的警告。</p><p><strong>難處：</strong>這個說法最容易被濫用：一切情緒與精神困擾都被歸成「攪擾」，於是用趕鬼取代就醫；被趕的人若沒有好轉，又被說成「還有罪沒認」，傷上加傷。</p>"],["全部醫療化說","","<p>認為今天所謂的「鬼附」都可以用精神醫學解釋，憂鬱、思覺失調、解離都是疾病，教會只需要轉介醫療。這個讀法保護病人得到治療，也避免屬靈濫權。</p><p><strong>難處：</strong>它把 6:11「魔鬼的詭計」與福音書的趕鬼記載都講成比喻，屬靈爭戰就不見了，教會也不再為受苦的人迫切禱告。</p>"],["【三】本講義站在哪裡","","<p><strong>不迷信，也不輕忽。</strong>魔鬼的詭計是真的；但本講義的牧養立場是：不輕易說任何人「被鬼附」。遇到情緒、精神、睡眠的困擾，先轉介醫療與專業協助，同時為他禱告，兩者不衝突。吃藥不是信心不夠；禱告也不是醫療的替代品。</p><p>主耶穌提醒歡喜「鬼也服了我們」的門徒：「不要因鬼服了你們就歡喜，要因你們的名記錄在天上歡喜」（路 10:20）。這是本講義的全卷立場 ISS00_4。</p>"],["【四】這件事該不該影響你的信心","","<p>不該。若你正在憂鬱或焦慮中，你不是屬靈失敗的人；你的病不是你給魔鬼留了地步的證據。那面信德的盾牌，有時是由陪你去看診的弟兄、替你禱告的姊妹一起舉著的。你仍然站在得勝的主裡面。</p>"]],"con":[],"say":"本講義的立場：魔鬼的詭計是真的，但不輕易說任何人被鬼附；情緒、精神、睡眠的困擾，先轉介醫療與專業協助，同時為他禱告，兩者不衝突。吃藥不是信心不夠，禱告也不取代醫療。本講義的全卷立場見 ISS00_4。","care":"會眾席上一定有正在服藥治療憂鬱、焦慮的人，也有家人罹患精神疾病、被教會說「家裡有鬼」的家屬，還可能有正處在長期無望感中的人。講台上不說「你被攻擊了」「你要有信心就不必吃藥」。會後單獨關心，不追問細節；陪他就醫，持續陪伴；若察覺有自傷的風險，立即協助他尋求專業協助與危機處理。"}],"terrain":{"points":[[0.609,80,3,"天上各樣屬靈的福氣",null],[1.435,92,22,"使他為教會作萬有之首",null],[1.523,6,1,"你們死在過犯罪惡之中","bot"],[1.75,90,6,"一同坐在天上","top"],[3.095,30,13,"不要因我為你們所受的患難喪膽",null],[3.476,98,21,"但願他在教會中，並在基督耶穌裡，得著榮耀","top"],[3.891,86,13,"滿有基督長成的身量",null],[4.078,16,19,"良心既然喪盡，就放縱私慾","bot"],[4.818,22,11,"那暗昧無益的事",null],[5.455,88,32,"這是極大的奧祕",null],[5.979,12,12,"乃是與那些執政的、掌權的","bot"],[6.021,94,13,"還能站立得住","top"]]},"tracks":[{"gk":"ἐν Χριστῷ","tr":"en Christō","gl":"在基督裡、在主裡、在他裡面","code":"G5547","root":"ἐν——在……裡面；Χριστῷ 是與格。保羅用「在基督裡」「在主裡」「在他裡面」描寫一個人新的所在。本卷三十多次，1:3–14 一句之內就有十一次","ins":"「在基督裡」是以弗所書的主追蹤。它是一個地址：第一站是收信人的身分，「就是在基督耶穌裡有忠心的人」（1:1）；接著是一切福氣的地址，「他在基督裡曾賜給我們天上各樣屬靈的福氣」（1:3），揀選也在那裡，「在基督裡揀選了我們」（1:4）。1:10 這個地址放大到整個宇宙：「都在基督裡面同歸於一」。聖靈的印記是蓋在這個地址上的（1:13），神的大能也是先在基督身上運行（1:20）。第 2 章是搬家：死人「與基督耶穌一同復活，一同坐在天上」（2:6），我們是「在基督耶穌裡造成的」（2:10），遠離的人「如今卻在基督耶穌裡，靠著他的血，已經得親近了」（2:13），於是「各房靠他聯絡得合式，漸漸成為主的聖殿」（2:21）。3:6 奧祕揭開：外邦人「在基督耶穌裡」同為後嗣；3:21 榮耀的地址是「在教會中，並在基督耶穌裡」。後半卷的「在主裡」轉成生活：「但如今在主裡面是光明的」（5:8）；最後一站是力量的地址：「你們要靠著主」（6:10），原文就是「在主裡」。一個人的一生，就是搬進這個地址、住在這個地址、從這個地址出發。","stops":[["1:1","就是在基督耶穌裡有忠心的人",""],["1:3","他在基督裡曾賜給我們天上各樣屬靈的福氣","top"],["1:4","在基督裡揀選了我們",""],["1:10","都在基督裡面同歸於一","top"],["1:13","既然信他，就受了所應許的聖靈為印記",""],["1:20","就是照他在基督身上所運行的大能大力",""],["2:6","他又叫我們與基督耶穌一同復活，一同坐在天上","top"],["2:10","在基督耶穌裡造成的",""],["2:13","如今卻在基督耶穌裡，靠著他的血，已經得親近了","top"],["2:21","各房靠他聯絡得合式，漸漸成為主的聖殿",""],["3:6","這奧祕就是外邦人在基督耶穌裡",""],["3:21","但願他在教會中，並在基督耶穌裡，得著榮耀","top"],["5:8","但如今在主裡面是光明的","top"],["6:10","你們要靠著主，倚賴他的大能大力作剛強的人","top"]]},{"gk":"συγκαθίζω／περιπατέω／ἵστημι","tr":"synkathizō / peripateō / histēmi","gl":"坐／行事為人／站立","code":"G4043","root":"συγκαθίζω——與……同坐；περιπατέω——走來走去，引申為「行事為人」、一個人過日子的方式；ἵστημι——站立、站住。三個動詞畫出全卷的三個姿勢：坐、行、站","ins":"這一條追蹤把全卷的三個姿勢串起來：坐、行、站。第一站是基督自己坐下：神「叫他在天上坐在自己的右邊」（1:20），因為工作已經完成。第 2 章的「行」先出現在死亡裡：「那時，你們在其中行事為人」（2:2）；然後死人被放到基督旁邊，「一同坐在天上」（2:6）；同一章翻轉，路是神鋪好的：「就是神所預備叫我們行的」（2:10）。前三章只有坐，沒有命令。4:1 是全卷的樞紐，περιπατέω 第一次成為命令：「行事為人就當與蒙召的恩相稱」。接著是四個方向：不要「像外邦人存虛妄的心行事」（4:17），「也要憑愛心行事」（5:2），「行事為人就當像光明的子女」（5:8），「你們要謹慎行事」（5:15）。最後一章換成站：「還能站立得住」（6:13），「所以要站穩了」（6:14）。次序不能顛倒：先坐，才會行；會行，才站得住。","stops":[["1:20","叫他在天上坐在自己的右邊","top"],["2:2","那時，你們在其中行事為人","bot"],["2:6","一同坐在天上","top"],["2:10","就是神所預備叫我們行的","top"],["4:1","行事為人就當與蒙召的恩相稱","top"],["4:17","你們行事不要再像外邦人存虛妄的心行事","bot"],["5:2","也要憑愛心行事","top"],["5:8","行事為人就當像光明的子女","top"],["5:15","你們要謹慎行事",""],["6:13","還能站立得住","top"],["6:14","所以要站穩了","top"]]},{"gk":"εἰρήνη","tr":"eirēnē","gl":"平安、和睦、和平","code":"G1515","root":"εἰρήνη——平安、和睦；背後是舊約的「平安」（shalom）：不只是沒有衝突，是一切關係都歸回正位。2:16 的 ἀποκαταλλάσσω（和好）是同一件事的動詞","ins":"εἰρήνη 在以弗所書出現八次，加上 2:16 的「和好」，是一條從問候走到戰場的線。第一站只是書信的問安：「願恩惠、平安從神我們的父和主耶穌基督歸與你們」（1:2）。2:14 平安變成一個人：「因他使我們和睦」，cu89t 的註腳說原文是「因他是我們的和睦」。2:15–16 這個人做成了兩件事：猶太人和外邦人之間「成就了和睦」，兩下又藉十字架「與神和好了」。2:17 平安變成一個好消息：「並且來傳和平的福音給你們遠處的人，也給那近處的人」。4:3 平安變成一條繩子：「用和平彼此聯絡」，σύνδεσμος 是把東西綁在一起的帶子。6:15 平安變成一雙鞋：「又用平安的福音當作預備走路的鞋穿在腳上」——戰士要穿著平安去打仗。最後一站回到祝福：「願平安、仁愛、信心……歸與弟兄們」（6:23）。","stops":[["1:2","願恩惠、平安從神我們的父和主耶穌基督歸與你們",""],["2:14","因他使我們和睦","top"],["2:15","如此便成就了和睦",""],["2:16","便藉這十字架使兩下歸為一體，與神和好了","top"],["2:17","並且來傳和平的福音給你們遠處的人，也給那近處的人","top"],["4:3","用和平彼此聯絡","top"],["6:15","又用平安的福音當作預備走路的鞋穿在腳上","top"],["6:23","願平安、仁愛、信心從父神和主耶穌基督歸與弟兄們",""]]},{"gk":"πλήρωμα／πληρόω","tr":"plērōma / plēroō","gl":"滿足、充滿、所充滿的、長成的身量；充充足足","code":"G4138","root":"πλήρωμα——滿、充滿的那一份；πληρόω——使滿、充滿。馬太福音的 πληρόω 多半是「應驗」，以弗所書的是「充滿」。περισσεύω（1:8）與 ὑπερεκπερισσοῦ（3:20）是同一個畫面的另一組字：滿到溢出來","ins":"「滿」是以弗所書最大膽的一個字。它先是恩典滿出來：「充充足足賞給我們的」（1:8）；接著是神的時間表滿了：「在日期滿足的時候」（1:10）。1:23 把教會放進這個字裡：「是那充滿萬有者所充滿的」——教會是基督的滿。3:19 是全本新約最大膽的禱告之一：「便叫神一切所充滿的，充滿了你們」；緊接著 3:20 的頌讚用了一個疊了三層的字 ὑπερεκπερισσοῦ：「充充足足地成就一切」。4:10 升天的基督「要充滿萬有」，4:13 成長的目標是「滿有基督長成的身量」。最後一站落成一個每天的命令：「乃要被聖靈充滿」（5:18），現在式、被動、命令——宇宙級的「滿」，落在一個人的今天。","stops":[["1:8","充充足足賞給我們的",""],["1:10","在日期滿足的時候",""],["1:23","是那充滿萬有者所充滿的","top"],["3:19","便叫神一切所充滿的，充滿了你們","top"],["3:20","充充足足地成就一切","top"],["4:10","就是遠升諸天之上要充滿萬有的",""],["4:13","滿有基督長成的身量","top"],["5:18","乃要被聖靈充滿","top"]]},{"gk":"οἰκονομία／οἰκεῖος／οἰκοδομή","tr":"oikonomia / oikeios / oikodomē","gl":"安排、家裡的人、聖殿、建造、居住、造就","code":"G3619","root":"οἶκος——家、房子。這個字族在以弗所書十幾次：οἰκονομία（管家的安排）、πάροικος（住在旁邊的客旅）、οἰκεῖος（家裡的人）、ἐποικοδομέω（建造在上面）、οἰκοδομή（建築、建立）、συνοικοδομέω（同被建造）、κατοικητήριον（居所）、κατοικέω（定居）","ins":"這一條追蹤的主角是「家」。第一站是神的管家計畫：「要照所安排的」（1:10），οἰκονομία 是一個家的總管怎樣安排全家。2:19 是全條的轉折：「你們不再作外人和客旅，是與聖徒同國，是神家裡的人了」——πάροικοι 是住在別人家旁邊的人，οἰκεῖοι 是家裡的人。接著這個家被蓋起來：「並且被建造在使徒和先知的根基上」（2:20），「漸漸成為主的聖殿」（2:21），而且是神自己要住的：「成為神藉著聖靈居住的所在」（2:22）。第 3 章保羅是這個家的管家：「將關切你們的職分託付我」（3:2），揭開那「如何安排」的奧祕（3:9）；然後這個家住進一個人心裡：「使基督因你們的信，住在你們心裡」（3:17），κατοικέω 不是作客，是定居。第 4 章，家要一起蓋：「建立基督的身體」（4:12），「在愛中建立自己」（4:16）；最後一站小到一句話：「只要隨事說造就人的好話」（4:29）。建立屬神的體系，小到一句造就人的好話。","stops":[["1:10","要照所安排的",""],["2:19","你們不再作外人和客旅，是與聖徒同國，是神家裡的人了","top"],["2:20","並且被建造在使徒和先知的根基上",""],["2:21","漸漸成為主的聖殿","top"],["2:22","成為神藉著聖靈居住的所在","top"],["3:2","將關切你們的職分託付我",""],["3:9","這歷代以來隱藏在創造萬物之神裡的奧祕是如何安排的",""],["3:17","使基督因你們的信，住在你們心裡","top"],["4:12","建立基督的身體","top"],["4:16","在愛中建立自己",""],["4:29","只要隨事說造就人的好話","top"]]}],"lesson":{"1":{"no":1,"vol":"《321以弗所書講義》第一課·以弗所書第一章","title":"一本寫著你名字的存摺——選、印、首","chars":5127,"min":60,"deep":8,"dchars":1770,"tchars":1394,"blocks":[["h","一、抽屜裡那一本存摺"],["p","弟兄姊妹平安。有一位年輕人，外婆過世以後，他回老家幫忙整理遺物。在衣櫃最底下的抽屜裡，用一條舊手帕包著，有一本存摺。翻開一看，戶名寫的是他的名字。開戶的日期，是他出生的那一個月。"],["p","他一頁一頁往後翻。每個月都有一筆，數目不大，二十幾年沒有斷過；最後一筆，是外婆住院前一個禮拜存的。他想起這幾年自己做兩份工、跟朋友借錢繳學費，還在電話裡跟外婆說：反正我甚麼都要靠自己。原來那時候他早就有了，只是不知道。"],["p","過了幾天，律師說外婆還立了一份遺囑：老家那一間屋子，留給他。律師先交給他一把鑰匙，說：屋子要等手續辦完才過戶，鑰匙先給你，讓你知道這是真的。"],["p","這一課，我們讀以弗所書第一章。我想請你帶著這三樣東西來讀：一本早就存好的存摺，一份早就立好的遺囑，一把先交到你手上的鑰匙。保羅一開口就說：「他在基督裡曾賜給我們天上各樣屬靈的福氣」（1:3）。曾賜給，是已經存進去了。可是很多基督徒信主多年，還在用打工還債的方式過日子。不是沒有，是不知道。"],["p","所以這一章有兩半。前半是一首頌讚，保羅把存摺一頁一頁念給我們聽：父揀選，子救贖，聖靈蓋印。後半是一個禱告，保羅求神「照明你們心中的眼睛」（1:18），讓我們看得見自己已經有的。這一課用三個字走完：選、印、首。"],["p","先看信封上寫給誰。「奉神旨意，作基督耶穌使徒的保羅，寫信給在以弗所的聖徒，就是在基督耶穌裡有忠心的人。」（1:1）收信的人叫作聖徒，這是身分，不是成績。最早的幾份抄本沒有「在以弗所」這幾個字，這很可能是一封傳閱信，議題頁有整理；我們只說一句：這是寫給每一間教會的信，也寫給你。"],["p","書信三問的第一問：以弗所人遇到甚麼？他們住在一座滿街都是神明的城市，亞底米的大廟、銀匠的小神龕、巷口的護身符，人人都在求平安、求福氣。保羅先寫下一句問安：「願恩惠、平安從神我們的父和主耶穌基督歸與你們！」（1:2）你們滿街在求的，在基督裡早就有了。"],["d",["最早的抄本沒有「在以弗所」，這是不是表示聖經被人改過？","不是聖經被改得不可靠，而是抄本留下了寫作處境的線索。現存最早的保羅書信抄本 P46，以及四世紀的西乃抄本、梵諦岡抄本，原文都沒有這兩個字；其餘幾乎所有抄本都有，早期教父也一致稱它為致以弗所人書。學者的主要解釋是：這是一封以以弗所為中心、在亞細亞眾教會之間傳閱的信，所以信裡沒有個人問安，保羅還說「我既聽見你們信從主耶穌」。抄本差異是公開比對的，這正是我們可以信任今天這本聖經的原因。無論原件有沒有寫地名，信的內容一個字也沒有因此改變。本講義的全卷立場見 ISS00_1 與 ISS00_6。"]],["h","二、父揀選、子救贖：一句停不下來的頌讚"],["p","從第三節到第十四節，在原文是一句話，兩百零二個字。保羅是一口氣唱完一首歌，副歌唱了三次：第六、十二、十四節，都落在「得著稱讚」。第一段唱父，第二段唱子，第三段唱聖靈。"],["p","第一段，父的揀選：「就如神從創立世界以前，在基督裡揀選了我們，使我們在他面前成為聖潔，無有瑕疵」（1:4）。請你留意四件事。第一，揀選是在基督裡，不是在基督以外翻名冊。第二，動機是愛，下一節就是「又因愛我們」。第三，目的是聖潔，不是讓人隨便活。第四，時間是創立世界以前，那時候你還沒有做對任何一件事，也還沒有做錯任何一件事。"],["p","回到那本存摺。開戶的日期，是那個孩子出生的那一個月。那時候他還沒有考過一次試，也還沒有頂過一次嘴；外婆存錢給他，是因為他是她的孫子。揀選與預定在教會裡爭了兩千年，各家讀法見講義的全卷立場，我們不在這裡辯論。可是各家都同意：人得救全是恩典，神的愛比我們的表現早。"],["p","所以我要放一道護欄。揀選是給已經相信的人的安慰，不是給還在門外的人的恐嚇。我們永遠不對任何人說：你可能沒有被揀選。想知道自己在不在裡面，不是猜名單，是來到基督面前；主耶穌說：「到我這裡來的，我總不丟棄他」（約 6:37）。而且同一句長長的頌讚唱到第十三節，就說「你們既聽見真理的道，就是那叫你們得救的福音，也信了基督」（1:13）。神的揀選沒有取消人的聽見和相信，反倒讓傳福音有了盼望。"],["p","揀選的終點寫在第五節：「預定我們藉著耶穌基督得兒子的名分」（1:5）。「得兒子的名分」是羅馬的收養用語。被收養的人改用新的姓氏，舊債一筆勾銷，可以寫進遺囑。神不是雇我們來打工，是把我們收進家裡；而且是「按著自己的意旨所喜悅的」，不是勉強，是樂意。"],["p","第二段，子的救贖：「我們藉這愛子的血得蒙救贖，過犯得以赦免，乃是照他豐富的恩典。」（1:7）父的揀選在永恆裡，子的救贖在歷史裡，在一個有日期的十字架上。贖價是一條命；赦免的尺度不是你的過犯有多大，是他的恩典有多富，而且是「充充足足賞給我們的」（1:8），滿出來的。"],["p","然後，在這首歌的正中間，保羅把鏡頭拉開：「要照所安排的，在日期滿足的時候，使天上、地上、一切所有的都在基督裡面同歸於一。」（1:10）接著保羅說：「我們也在他裡面得了基業」（1:11），原文也可以讀成我們被揀為他的產業。神的遺囑比外婆的多寫了一行：我們得著了神，神也把我們算作他的產業。"],["d",["神預定誰得救嗎？那麼沒有被揀選的人怎麼辦？","這是敬虔的人爭了兩千年的題目，教學場上不展開辯論。大致有三種讀法：加爾文派說神照自己的旨意無條件地揀選個人；阿米念派與衛斯理宗說神預知誰會相信而揀選；群體揀選說指出這裡的「我們」是複數，神揀選的是在基督裡的群體，個人藉著信進入這個群體。三派都同意幾件事：人得救全是恩典；揀選在基督裡，動機是愛，目的是聖潔與讚美；人的聽見與相信是真實的。所以最好的回答，是把問的人帶到基督面前。主說：「到我這裡來的，我總不丟棄他」（約 6:37）。本講義的全卷立場見 ISS00_2。"]],["d",["我的親人沒有信主就過世了，是不是因為他沒有被揀選？","請先聽清楚：以弗所書第一章沒有要你這樣解釋你的失去，也沒有任何人有資格替神宣布那一位親人的結局。保羅寫揀選，是在監牢裡唱頌讚，要已經相信的人安心，不是要給每一場悲劇一個答案。我們不知道一個人最後的日子裡心裡發生了甚麼；我們確知神是公義的，也滿有憐憫。這時候你需要的不是一套教義，是有人陪你哭。組長若聽見這樣的分享，不在組裡辯論，不追問細節，不對正在流淚的人說「你要有信心」，會後單獨關心；若哀傷長期壓著他，陪他尋求專業的協助。也可以和他一起，為家裡其他還沒有信主的人禱告。"]],["h","三、原文亮光：歸總、訂金、心的眼睛"],["p","這一課拆三個原文字。第一個在 1:10，「同歸於一」原文是一個很長的字：ἀνακεφαλαιώσασθαι（anakephalaiōsasthai）。字根有兩說，一說是「總數」，像把一長串數字加起來寫在最底下那一行；一說連到 κεφαλή（kephalē），頭，第二十二節就說基督是「萬有之首」。字首還有「再一次」的意思：萬有本來屬於他，散了，如今要重新歸回。所以存摺最底下那一行的總數，寫的不是一個數字，是一個名字：基督。"],["p","三十秒落到生活：你這一週最亂的那一件事，一個吵不完的家、一份對不上的報表，也在「一切所有的」裡面。你不必先整理好才帶到神面前，歸總是他做的工。"],["p","第二個字在 1:14：「這聖靈是我們得基業的憑據，直等到神之民被贖，使他的榮耀得著稱讚。」（1:14）「憑據」，和合本的註腳說原文是「質」，希臘字是 ἀρραβὼν（arrabōn），買賣時先付的一部分價金，就是訂金。訂金不是全部，可是和全部是同一種錢；付了訂金的買主，一定會回來付清。就像那一把鑰匙：屋子還沒過戶，鑰匙已經在手上了。"],["p","同一節還有一個註腳：「神之民」原文是「產業」。神付了訂金，因為他一定要把他的產業領回家。前一節說我們「受了所應許的聖靈為印記」，印記是被動的，是神蓋的，不是我們自己貼的；所以它不會因為你這個禮拜心情不好就掉下來。可是保羅在第四章也說：「你們原是受了他的印記，等候得贖的日子來到」（4:30），前面一句是不要叫神的聖靈擔憂。印記不是放肆的執照，是一份要被珍惜的關係。"],["p","第三個是一個片語，在 1:18：πεφωτισμένους τοὺς ὀφθαλμοὺς τῆς καρδίας（pephōtismenous tous ophthalmous tēs kardias），心的眼睛被照亮。聖經裡的「心」不只是情緒，是人思想、意志、抉擇的中心。人可以用頭腦讀懂經文，心卻還是瞎的；就像那本存摺在抽屜裡躺了二十幾年，沒有人打開抽屜，它就好像不存在。保羅不求更多知識，他求抽屜被打開。"],["p","這個分詞是完成式被動：保羅是在已經看見的基礎上，求他們看見更多。三十秒落到生活：你也許不缺資料，缺的是一次真正的看見。這一課的禱告不是「主啊，給我更多」，是「主啊，讓我看見我已經有的」。"],["d",["既然聖靈是印記，得救的人會不會失去聖靈？","這一題各家理解不同，議題頁有整理。第一章給的方向很清楚：印記是被動語態，是神蓋的；憑據是訂金，是神付的；盼望建立在付錢的那一位身上，不在我今天的狀態上。所以軟弱的人不必被「你會失去聖靈」嚇倒。可是同一卷信在 4:30 說「不要叫神的聖靈擔憂」，接著就說你們原是受了他的印記，可見印記不是放肆的執照，是一份要被珍惜的關係。跌倒的時候，記得印還在，回到神面前認罪；想放縱的時候，記得印是他的。兩句都說，才不會偏到恐嚇或放任任何一邊。"]],["h","四、坐在右邊的那一位：萬有之首與教會"],["p","保羅的禱告從感謝開始：「因此，我既聽見你們信從主耶穌，親愛眾聖徒，就為你們不住地感謝神。」（1:15–16）他聽見兩件事：向上的信，向旁邊的愛。一間教會健不健康，看這兩條線就知道。然後他求：「將那賜人智慧和啟示的靈賞給你們，使你們真知道他」（1:17）。這裡的啟示不是新的經文，是聖靈把已經寫下的真理照進心裡；求的對象是神自己。"],["p","心的眼睛打開了，看見甚麼？三個「何等」。第一，「他的恩召有何等指望」。第二，「他在聖徒中得的基業有何等豐盛的榮耀」，不是我們得的基業，是神在聖徒身上得的基業；你在他的珍寶裡。第三，「他向我們這信的人所顯的能力是何等浩大」（1:19），一節裡疊了四個能力字。"],["p","這能力有多大？保羅指給我們看：「就是照他在基督身上所運行的大能大力，使他從死裡復活，叫他在天上坐在自己的右邊」（1:20）。神能力最大的證明，是一個死人從墳墓裡起來，坐上寶座。坐，表示工作完成了；祭司從不坐下，基督坐下了，因為救贖已經成就。這使我們想起「你坐在我的右邊，等我使你仇敵作你的腳凳」（詩 110:1），保羅沒有明說引用。"],["p","他坐的位置「遠超過一切執政的、掌權的、有能的、主治的，和一切有名的；不但是今世的，連來世的也都超過了」（1:21）。使徒行傳講義第 19 章講過，以弗所信主的人當中，「也有許多人把書拿來，堆積在眾人面前焚燒」（徒 19:19）。他們燒書，不是因為怕，是因為看見了：基督坐的位置在一切名字之上，不必再求它們，也不必再怕它們。屬靈爭戰的勝負，在第一章就定了。"],["p","然後是全章的頂點：「又將萬有服在他的腳下，使他為教會作萬有之首。」（1:22）基督是頭，教會是身體；不是教會作萬有之首，更不是哪一位領袖坐上頭的位子。「教會是他的身體，是那充滿萬有者所充滿的。」（1:23）第十節說萬有要在基督裡同歸於一，第二十二節告訴我們這件事今天的地址：教會是已經先歸在他底下的那一群人。"],["p","用書信三問的第二問收起來：保羅從福音推出甚麼原則？你已經在基督裡被賜福、被揀選、被贖回、被蓋印；你要的不是更多，是心的眼睛被打開。全卷是坐、行、站；第一章先讓你看見基督坐在哪裡，第四章才說「行事為人就當與蒙召的恩相稱」（4:1）。"],["d",["有人說神給他啟示，告訴我應該嫁給誰、辭掉哪一份工作，我該聽嗎？","1:17 保羅求的「智慧和啟示的靈」，目的寫得很清楚：「使你們真知道他」，對象是神自己。聖靈把已經寫在聖經裡的真理照進心裡，不是另外頒布高過聖經的新命令。所以有人用「神給我啟示」替你決定婚姻、工作、搬遷，你可以溫和而清楚地不接受。實際上有三步。第一，拿聖經檢驗這句話，它是在叫你更認識神，還是更依賴某一個人？第二，禱告，也聽幾位成熟弟兄姊妹的意見。第三，最後的決定在主面前由你自己負責。若有人以此要求你絕對順服或奉獻，請找牧者談。全卷立場見 ISS00_5，屬靈權柄回指哥林多後書立場三。"]],["d",["「教會是他的身體」說的是全世界的教會，還是我們這一間地方教會？","以弗所書提到教會的地方，多半指普世的教會，就是所有在基督裡、歸在這一位元首底下的人；這和保羅在哥林多前書第十二章對一間地方教會說「你們就是基督的身子」並不衝突。普世的身體，總是在一間一間具體的教會裡顯出來。這有兩個提醒。第一，同一座城裡別的教會也連在同一個頭上，不互相比較、不互相搶人。第二，不能用「我屬普世教會」來逃避一間具體的教會；身體是要落地的，有名字、有臉、有每週一起擘餅的人。頭只有基督一位，教會裡沒有人可以坐那個位子。"]],["h","五、幾個必須認得的偏差"],["p","第一個偏差，是把預定講成宿命論：神早就定好了，傳不傳福音都一樣。同一句頌讚唱到第十三節就是聽見、相信、受印記；保羅越確信揀選，越放膽傳福音。"],["p","第二個偏差，是對人說「你可能沒有被揀選」，或用預定解釋一場悲劇、一位親人沒有信主就過世。保羅在監牢裡唱這首歌，不是在法庭上宣判；替神說他沒有說的話，只會把最痛的人推得更遠。正確的回應是陪伴。"],["p","第三個偏差，是把蒙揀選講成優越感：我們是特別被揀選的一群，別的教會、別的人不一樣。拿到存摺的孫子沒有理由看不起鄰居；揀選的動機是愛，目的是聖潔，一個知道自己是白白被選的人，只會更謙卑。"],["p","第四個偏差，是把「天上各樣屬靈的福氣」講成成功神學：信主就會發財、升官、不生病，沒有得著就是信心不夠。保羅說的是屬靈的、在天上的、在基督裡的福氣，寫這一句的人手上正綁著鎖鍊。這樣講，會讓剛被裁員、剛拿到壞消息的人以為自己被神漏掉了。"],["p","第五個偏差在兩頭：一頭是「反正已經蓋印了，怎麼活都可以」，另一頭是用「你這樣會失去聖靈」去恐嚇軟弱的人。印是神蓋的，訂金是神付的，盼望建立在付錢的那一位身上；同一卷信也說不要叫聖靈擔憂。"],["h","六、兩個華人處境的真實問題"],["p","第一個問題：命盤、擇日、護身符。很多家裡還有長輩看黃曆、算流年，出門塞一個平安符，搬家要擇日。有些人信主以後，心裡還留著一點怕：萬一沒有拜，會不會出事？第一章的答案不是叫你去和這些東西打仗，是叫你抬頭看：基督坐的位置遠超過一切有名的。屬於你自己的，帶著禱告處理掉，不必再求，也不必再怕；屬於長輩的，不要強行丟棄，用尊重的態度說明你為甚麼不再需要它。不拜，不怕，也不嘲笑。"],["p","第二個問題：被比較長大的價值。我們很多人是在排名裡長大的：考第幾名、讀哪一間學校、表哥的孩子已經買房了。父母那一句「你看人家」，到了四十歲還在耳邊，於是一生活成一場申請。第一章說，在你還沒有考過一次試以前，神已經在基督裡因愛揀選了你，把你寫進遺囑。這不是叫人不努力，是叫人不必再為了被接納而努力；努力可以從感恩出發，不必從恐懼出發。"],["d",["我家裡還有長輩的平安符和神明桌，信主以後我該怎麼處理才不傷和氣？","先分清楚哪些是你自己的，哪些是長輩的。你自己的平安符、護身符、手機裡的運勢推播，可以這一週就帶著禱告處理掉，不是因為怕，是因為 1:21 說基督遠超過一切有名的，你不必再求，也不必再怕。長輩的神明桌和他們的東西，不要趁他們不在時丟掉，那會傷了關係，也把福音說成了不孝。可以找平和的時間說：我現在信耶穌，我不拜，但我一樣孝順你們，祭祖的日子我會回來陪你們、一起懷念。用行動補足那一份心意。若家人反對很強，不要硬碰，先為他們禱告，讓他們在你身上看見平安。全卷立場見 ISS00_4。"]],["h","七、活出321——從看見已經有的開始"],["p","走到這裡，我們才把國度321空中團契的話接上去。次序不能倒：先有 1:10 神的計畫、1:18 保羅的禱告，321 才在末端接上。"],["p","耶穌是我的榜樣：主耶穌在被賣的那一夜禱告說，父在創立世界以前已經愛他。耶穌「知道父已將萬有交在他手裡」（約 13:3），下一個動作卻是拿手巾洗門徒的腳。確知自己被愛的人，可以放下身段。"],["p","聖經是我的準則：1:3 說福氣是「曾賜給」的，不是靠感覺決定有沒有。這一週當我覺得自己甚麼都沒有、甚麼都要靠自己的時候，我讓這一節來糾正我的感覺，而不是讓感覺來改寫這一節。"],["p","聖靈是我的引導：聖靈在以弗所書第一章先是一個印、一筆訂金。引導我的那一位，也是擔保我的那一位。用心靠聖靈，就是求他照亮我心中的眼睛。"],["p","讓耶穌作王：1:22 說萬有都服在他的腳下。這一週要讓出兩個寶座：一個是別人的評價，主管、父母、排名，不再有權決定我是誰；一個是我暗暗害怕或暗暗依靠的名字，命盤、擇日、護身符，也包括存款數字和人脈。"],["p","讓耶穌得著一切的榮耀：這首頌讚三次落在「得著稱讚」。數算恩典的人，榮耀自然歸給神；我的見證裡最大的名字，不是我多努力，是那一位在創立世界以前就愛我的神。"],["p","建立屬神的體系：1:10 是這個體系最大的一幅圖，1:22–23 是它的地址。落在教會裡：作決定先問頭的心意，用禱告開始；用 1:15 的信與愛兩條線檢查健康；同城的教會彼此代禱，不互相搶人。體系的中心不是組織圖，是一位元首。"],["h","八、四種心，翻開同一本存摺"],["p","驕傲型的心，拿到存摺的第一個反應是：當然，我本來就配。或者拿蒙揀選去量別人。請再讀一次：「創立世界以前」，那時你甚麼都還沒有做。存摺上的每一筆，都不是你存進去的。"],["p","恐懼型的心，一直在問：我到底在不在名單上？萬一我又跌倒，印記會不會掉？請聽 1:13 的次序：你聽見了，你信了，神就蓋了印。印是他蓋的，鑰匙是他交的，那位坐在一切名字之上的，是愛你的那一位。"],["p","羞恥型的心，總覺得自己是被撿來的、被挑剩的，就算到了神的家，也只敢站在門口。1:5 說你得的是兒子的名分，不是長工的位子；1:18 說你是神在聖徒中得的豐盛的基業。你不是寄住的人，你的名字寫在戶名上。"],["p","受傷型的心，也許曾經被人用「這是神的旨意」「神早就定好了」來解釋你的失去：一個孩子、一段婚姻、一位沒有信主就離開的親人。那不是這一章的意思。這一章只告訴你，在你最痛的那一天以前，神已經愛你了。今天不必急著想通；請讓組長或一位信得過的人陪你，若需要，也讓專業的人幫助你。"],["h","九、這一週，你可以做的幾件事"],["p","以下五件事，請在散會以前寫下時間、地點和名字。"],["p","第一，每天早上打開手機以前，先讀一次 1:3–14，然後對主說：我今天不是去申請，是從已經有的出發。"],["p","第二，這七天，每當你因為沒被邀請、沒被回覆、被比下去而失落，就記下時間和場合；週末帶到主面前，承認別人的評價還在作王。"],["p","第三，照 1:15–16，在週三晚上以前寫一則訊息或一張卡片給一位弟兄姊妹、同事或家人，說出你在他身上看見的一份信或愛，加一句「我為你感謝神」。"],["p","第四，檢查你的家和手機：平安符、光明燈、運勢推播。屬於你自己的，帶著禱告處理掉；屬於家人的，選一個時間用尊重的態度說明。"],["p","第五，揀選從來不攔阻傳福音。寫下一位這一週你要為他禱告、並邀請他一起吃飯或讀經的朋友，說出哪一天。"],["p","然後我們一起開口說出四句話。"],["p","我宣告：神在基督裡已經賜給我天上各樣屬靈的福氣，我不是在申請，是在領受。"],["p","我宣告：在創立世界以前，神因愛在基督裡揀選了我，我不必再靠別人挑中來證明自己。"],["p","我宣告：聖靈是神蓋在我身上的印、付在我心裡的訂金，他一定會把他的產業領回家。"],["p","我宣告：基督坐在一切名字之上，是教會唯一的頭，我不必再求、也不必再怕別的名字。"],["d",["照 1:15–16 寫一則感謝訊息給人，具體要怎麼寫才不像客套？","保羅的感謝有兩個特色：他說得出具體看見了甚麼，他把感謝歸給神。可以照這三句寫。第一句，說出一件具體的事：上個月你每週載某某姊妹來聚會，我看見了。第二句，說出你在這件事上看見的信或愛：我在你身上看見一份不聲張的愛。第三句，把它歸給神：我為你感謝神。就這樣，不要加「你要繼續加油」，也不要附帶任何請求，否則就成了一份交代。選一個你平常比較少稱讚的人，例如配偶或一位默默服事的同工。寫完以後不要等回覆；保羅寫信的時候，也不知道收信的人甚麼時候會讀到。"]],["h","十、結語"],["p","我們回到那一間老家的房間。那個年輕人後來說，他最難過的不是錢，是那一句「反正我甚麼都要靠自己」。外婆一直在存，他一直不知道。他把存摺放在書桌上，提醒自己：我是被人記掛著長大的。"],["p","可是這一課的焦點，不在那本存摺，也不在我們多會數算，更不在學會一句團契的話。焦點在那一位存款的神，和那一位坐在父右邊的基督。保羅在監牢裡停不下來的頌讚，不是要我們佩服保羅，是要我們看見神：他揀選，他救贖，他蓋印，他叫基督作萬有之首。你不必更佩服作者，只要更認識這一位在你還甚麼都沒有做以前就愛你的神。"],["p","我們一起低頭禱告。天上的父，謝謝你在基督裡揀選我們，用愛子的血贖回我們，又用聖靈蓋上你的印。我們常常像不知道自己有存摺的孩子，用打工還債的姿勢活著。求你照明我們心中的眼睛，讓我們看見你的恩召有何等指望，看見你在我們身上得的基業，看見那位坐在你右邊的元首。也求你安慰今天心裡有傷、有問號的人，讓他們知道你沒有丟棄他們。奉主耶穌基督的名禱告，阿們。"],["h","十一、小組討論分享：三個化"],["p","這一個鐘頭不比誰數得多，是讓每一個人說出一樣自己一直在靠自己掙的東西；以下三個化，請組長照著次序帶。"],["m","帶領說明：本課主軸是選、印、首：已經被賜福，只是還要被開眼。席上可能有在比較裡長大、或為親人過世而有問號的人，請先讀第二化的帶領提醒。"],["m","優先順序標示：★★★＝最優先，時間不足時每一化至少討論這一題；★★＝次優先；★＝時間充裕再討論。標【必做】的繁殖任務不可省略，可帶回家完成。"],["s","第一化｜內化成為觀念（約20分鐘）"],["m","目的：讓組員講得出三個觀念：福氣是已經賜下的；揀選在基督裡、動機是愛，不是恐嚇；基督是萬有之首，教會是身體，頭只有一個。"],["n","1. ★ 你小時候有沒有一樣東西，長大以後才知道是大人早就替你預備好的：一本存摺、一件收起來的衣服？是誰預備的？"],["n","2. ★★★ 保羅說神「曾賜給」我們天上各樣屬靈的福氣。請用一句話說：「已經賜給」和「正在申請」，過起日子來有甚麼不一樣？"],["n","3. ★★ 1:4–5 的揀選有四件事：在基督裡、因為愛、為了聖潔、在創立世界以前。哪一件最改變你對「揀選」這兩個字的感覺？為甚麼？"],["n","4. ★★ 「訂金不是全部，可是和全部是同一種錢。」說出一件你最近在聖靈裡嚐到的安慰或提醒，它怎樣讓你對將來的基業更有把握？"],["m","帶領提醒：第一題輕鬆帶；討論揀選時不展開派別辯論，只問經文自己說了甚麼，若有人追問，指向講義的議題頁。"],["s","第二化｜消化成為生命（約35分鐘·本課主軸）"],["m","目的：讓每一個人說出一樣自己一直在靠自己掙的東西，並在「又因愛我們」裡，說出這一週要從已經有的出發的一步。"],["t","【看】看見自己"],["n","5. ★★★ 你最常用甚麼來證明自己夠格：成績、收入、被不被邀請、父母誇不誇你？說出最近一次因為沒被選上而失落，是在哪一個場合？"],["t","【聽】聽神說話"],["n","6. ★★ 請把 1:4–5 慢慢讀兩遍，第二遍在「揀選了我們」「又因愛我們」的地方換成你的名字。讀完說一句：你聽見神怎樣看你？"],["t","【想】想通關卡"],["n","7. ★★★ 明明知道福氣已經賜下，你還是習慣用打工還債的方式過日子，卡在哪裡：怕不夠、怕被比下去，還是覺得白白得來不安心？選一個說出來。"],["t","【講】說出口"],["n","8. ★★ 請對組裡的人說：「在創立世界以前，神因愛揀選了我；我不必再靠……來證明自己。」右手邊的人只回「神也愛我」，不給建議。"],["t","【行】走一步"],["n","9. ★★★ 寫下這一週你要從「已經有的」出發去做的一件事：例如不再為了被肯定而加班的那一晚，寫下星期幾、在哪裡。"],["m","帶領提醒：這一化可能碰到被父母比較、被排擠的傷，親人過世的哀傷，長期無望感，甚至家庭傷害；不追問細節，不要求任何人原諒誰，不對正在流淚的人說「你要有信心」，也絕不用預定去解釋任何人的失去。若有人情緒很重，不在組裡處理，會後單獨關心，必要時協助尋求專業協助。第七題之後請留三十秒安靜。"],["s","第三化｜轉化成為生活（約25分鐘）"],["m","目的：把這一課搬進行事曆：一則感謝、一樣要讓出寶座的東西、一個要帶的人。"],["n","10. ★★ 照 1:15–16，說出這一週你要寫感謝訊息的那一個人的名字或關係，你在他身上看見的一份信或愛，以及週幾、用甚麼方式告訴他。"],["n","11. ★ 你家裡或手機裡，有沒有一樣東西是你仍然在求或在怕的？說出它是甚麼，你打算哪一天、怎樣帶著禱告處理，或怎樣向家人說明。"],["n","12. ★★ 照 1:22–23，說出我們城裡另一間教會的名字。這個月小組可以為他們做哪一件事，誰去聯絡？"],["n","13. ★★★ 這是本課的 920 操練：找出你的那一個「2」，神放在你身邊、你要帶的那一個人。當場說出他的名字、這一週哪一天約他吃飯，向他分享：神在基督裡早就為他預備了福氣。"],["n","14. ★★★ 【必做】繁殖任務：用三句話把這一課講給一位教會外的朋友聽。第一句，有人在外婆的抽屜裡找到一本寫著自己名字的存摺，才知道自己早就被記掛著。第二句，聖經說神在我們甚麼都沒做以前，就因愛揀選了我們。第三句，我們不必再靠被人挑中來證明自己，來到耶穌面前就看見自己已經有的。這一週講給一個人，下次回來說他的反應。"],["m","帶領提醒：要具體到時間、地點、人名，不收「我會多數算恩典」這類答案；處理長輩的宗教物品時，提醒組員尊重家人，不強行丟棄。"],["s","收尾（5分鐘）"],["p","請每一個人用一句話說：這一週我要寫感謝給誰。可以只說關係。"],["p","然後彼此代禱，為三種人指名禱告：一位最近落榜、被裁員、或在家裡被比下去的人，求主讓他知道自己早已在基督裡被愛；一位活在算命、擇日、護身符懼怕裡的親友，求主照明他心中的眼睛；我們城裡另一間教會，求主祝福他們，也讓我們彼此相連。"],["p","散會以前，確認紙上寫了三樣：要寫感謝的人、要讓出寶座的那一樣東西、你的那個「2」。下次帶來對。"]]},"2":{"no":2,"vol":"《321以弗所書講義》第二課·以弗所書第二章","title":"副堂中間那一道摺疊門——坐、牆、殿","chars":5212,"min":60,"deep":8,"dchars":1713,"tchars":1396,"blocks":[["h","一、副堂中間那一道摺疊門"],["p","弟兄姊妹平安。有一間教會的副堂，正中間裝了一道摺疊門，米黃色的，從天花板拉到地板，上下各有一條軌道。當年裝它的理由很合理：兒童主日學和成人主日學同時上課，聲音會互相干擾。沒有人反對。"],["p","後來國語堂和英語堂都在這間副堂吃午飯。十二點半，摺疊門一拉，左邊是炒米粉和滷蛋，右邊是三明治和披薩；左邊講國語，偶爾夾幾句福建話，右邊講英語。兩邊的人都很好，也都愛主。二十年過去，有一位老執事說了一句實話：我們從來沒有決定要分開吃飯，只是從來沒有人去把那道門拉開。"],["p","看得見的牆，是一道摺疊門。看不見的牆更多。方言是一道：一開口，大家就知道你是哪裡人。世代是一道：長輩的群組和年輕人的群組，各轉各的訊息。學校裡也有：下課鈴一響，本地生和外籍生自動分成幾堆。沒有人動手砌，牆卻一年比一年高。"],["p","保羅寫信的時候，耶路撒冷也有一道牆，而且是真的石頭砌的。他說：「因他使我們和睦，將兩下合而為一，拆毀了中間隔斷的牆」（2:14）。這一課我們走完以弗所書第二章，用三個字：坐、牆、殿。"],["p","可是保羅不是從牆開始的，他從一座墳墓開始：「你們死在過犯罪惡之中，他叫你們活過來。」（2:1）保羅不說你們病了，他說你們死了。奇怪的是，死人還在走路：「那時，你們在其中行事為人，隨從今世的風俗」（2:2）。「行事為人」原文就是走路：死不是不動，是在別人替你決定的方向上照常過日子。這裡的「空中掌權者的首領」是真實的，卻不是最大的；所以我們不迷信，也不輕忽。"],["p","接著保羅換了一個代名詞：「我們從前也都在他們中間」，又說我們「本為可怒之子，和別人一樣」（2:3）。在墳墓裡沒有人比別人高一點，請記住這一句。用書信三問來讀，第一問的答案是：以弗所人住在一座滿是廟宇、法術和族群隔閡的城裡，家庭教會裡坐著從會堂出來的猶太人，也坐著剛燒掉法術書的外邦人。"],["d",["「本為可怒之子」是不是說人生來就一文不值？這樣講會不會傷人？","不是一文不值。2:3 的「本為」原文是按本性，歷代教會從這裡講原罪：人不能靠自己回應神。這叫全然敗壞，意思是每一部分都受了影響，不是毫無價值；人仍然是照神形像造的，也是神大愛所愛的。保羅在這裡從「你們」換成「我們」，又加上「和別人一樣」，這是一份人人平等的診斷書，不是一根指著別人的手指。說人是死的，是為了讓第四節「然而，神」有分量。不要拿它罵不信的家人，陪人一直讀到 2:4–7。原罪如何傳遞的細節各派不同，見議題頁；爭議與信心的全卷立場見 ISS00_9。"]],["h","二、然而，神：死人坐上了寶座"],["p","第四節的頭兩個字，是整卷以弗所書的鉸鏈：「然而，神既有豐富的憐憫，因他愛我們的大愛」（2:4）。原文是 ὁ δὲ θεὸς（ho de theos）。從前翻到如今，中間那個轉折的主詞不是我們，是神。神救人，不是因為人值得，是因為他愛。"],["p","然後神作了三件事：「當我們死在過犯中的時候，便叫我們與基督一同活過來。」（2:5）「他又叫我們與基督耶穌一同復活，一同坐在天上」（2:6）。三個動詞前面都加了同一個字頭，意思是「與他一同」；而且都是已經發生的語氣。神是把我們和基督綁在一起，他坐下，我們一同坐下。全卷的「坐、行、站」，那個「坐」就在這裡。"],["p","請把這一句和那道摺疊門放在一起想。守牆的人多半不是壞人，是怕的人：怕位子被拿走，怕一拉開門，自己就不再是中心。一個不知道自己已經坐在天上的人，會用一生去守地上的位子；一個知道自己已經坐下的人，才空得出手來讓位子。只是要記得，第七節說神的恩典要「顯明給後來的世代看」，已經坐下，還沒有完全顯明；寫這句話的保羅，正戴著鎖鍊坐在羅馬的監裡。"],["p","接著是全章最熟的一段，請三節一起讀，一個字也不省：「你們得救是本乎恩，也因著信；這並不是出於自己，乃是神所賜的；也不是出於行為，免得有人自誇。」（2:8–9）「我們原是他的工作，在基督耶穌裡造成的，為要叫我們行善，就是神所預備叫我們行的。」（2:10）第九節的「行為」和第十節的「善」，原文是同一個字：一個被趕出門外當作條件，一個從另一扇門回來當作目的。行善不是門票，是新生命長出來的樣子。"],["p","「免得有人自誇」這一句，正好通到下半章。每一道牆底下，幾乎都埋著一點自誇：我們這邊比較早來、比較懂規矩。如果連得救都沒有一個人可以誇口，那麼在神的家裡，也沒有一個人可以靠「我們這邊」站得比較高。第十節最後那個「行」，又是走路的字。第二節在死亡裡走，第十節在神預備的善行裡走；同一個動詞，換了一條路。坐在天上的人，腳在地上要走路，第一條路常常就通往那一道門。"],["d",["「這並不是出於自己」的「這」，到底是指恩典、信心，還是整個得救？","原文的「這」是中性，而「恩」和「信」在希臘文都是陰性，所以文法上不容易直接指其中一個。學者有三種讀法：指恩典，指信心，或指前面整句「本乎恩、也因著信而得救」這一整件事。本講義採第三種：整個得救都不是出於自己，是神所賜的禮物，連那一份信也包在裡面。信不是我交出去的另一種功勞，不是我信得夠用力，神才肯救；信是那一隻空著接禮物的手。所以軟弱的時候，不必先檢查自己信得夠不夠，先抬頭看送禮的那一位。救恩穩不穩，不在我抓得多緊，在他給得多真。恩典與行為回指加拉太書立場二。"]],["d",["既然已經「一同坐在天上」，為甚麼我的生活還是這麼辛苦、還會跌倒？","因為聖經同時說「已經」與「還沒有」。2:6 的動詞是已經發生的語氣：在神眼中，你的位置已經改了，和基督綁在一起，他在哪裡，你就在哪裡。可是 2:7 緊接著說，神的恩典要「顯明給後來的世代看」，還有一部分要等到將來才完全看見。寫這句話的保羅，人正在羅馬的監裡，手上戴著鎖鍊；辛苦和跌倒不證明你沒有坐下。坐下的意思是：你不必從地上往上爬，而是從已經被接納的位置出發去面對今天。受苦的人要被安慰，不要被定罪。已然與未然的各家讀法，見議題頁。"]],["h","三、原文亮光：中間的牆、他是和睦、一個新人"],["p","前三章幾乎沒有命令句，只有第十一節冒出一個：「所以你們應當記念」。記念甚麼？「那時，你們與基督無關，在以色列國民以外，在所應許的諸約上是局外人，並且活在世上沒有指望，沒有神。」（2:12）請留意這份清單的中心是以色列：國民的身分、諸約、應許，原是他們的。外邦人是被接進來的，不是取而代之的。然後是轉折：「你們從前遠離神的人，如今卻在基督耶穌裡，靠著他的血，已經得親近了。」（2:13）距離不是我們走完的，是被帶近的。"],["p","第一個原文字：τὸ μεσότοιχον τοῦ φραγμοῦ（to mesotoichon tou phragmou），「中間的牆」，全本新約只出現在這裡。耶路撒冷聖殿的外邦人院和裡面之間，有一道到胸口的矮牆，牆上立著石碑，刻著希臘文：外邦人越過者，死罪自負。這樣的石碑已經出土。使徒行傳講義第 21 章講過，保羅就是為這道牆被捉拿的：有人喊著說「他又帶著希臘人進殿，污穢了這聖地」（徒 21:28），其實只是看見以弗所人特羅非摩和他在城裡。現在這個為一道牆坐監的人寫信給以弗所人說：牆已經被拆了。"],["p","第二個原文字在同一節的開頭：αὐτὸς γάρ ἐστιν ἡ εἰρήνη ἡμῶν（autos gar estin hē eirēnē hēmōn）。和合本的註腳說，原文是「因他是我們的和睦」。不只是他使我們和睦，是他自己就是我們的和睦。和平不是一份協議，是一個人。他怎麼拆？經文說是「以自己的身體廢掉冤仇」（2:15），這一句在原文屬第十四節，和合本移到第十五節句首，是譯文的語序。被廢掉的是「記在律法上的規條」，就是律法被拿來當作牆、當作入門條件的那一套，不是神要人誠實、聖潔、相愛的心意。"],["p","第三個原文字：ἕνα καινὸν ἄνθρωπον（hena kainon anthrōpon），「一個新人」。「為要將兩下藉著自己造成一個新人，如此便成就了和睦。」（2:15）「造成」是創造的字，和第十節同一個字根；「新」是新的種類，不是把舊的翻新。最要緊的是：「新人」在全卷第一次出現，是單數，卻由兩群人合成，第四章才講到每一個人穿上的新人。所以新人不是叫外邦人先變成猶太人，也不是叫猶太人消失、被外邦人取代；是兩方在基督裡一同被造，不是一方吃掉另一方。"],["p","「既在十字架上滅了冤仇，便藉這十字架使兩下歸為一體，與神和好了」（2:16）。直的一條是與神和好，橫的一條是兩下歸為一體，兩條線交叉在同一個十字架上。沒有人可以只要直的、不要橫的。「因為我們兩下藉著他被一個聖靈所感，得以進到父面前。」（2:18）從前外邦人只能站在矮牆外面看，如今和猶太弟兄並肩，從同一道門走到父的面前。加拉太書講義第 2 章講過安提阿那一張分開的桌子：加拉太書說不可以分桌，以弗所書說，牆已經沒有了。"],["d",["2:15 說「廢掉冤仇，就是那記在律法上的規條」，那舊約律法是不是被廢掉了？","被廢掉的是律法被拿來當作牆的那一套功能，不是神要人誠實、聖潔、相愛的心意。保羅特別說「記在律法上的規條」，指的是割禮、飲食、潔淨這些把猶太人和外邦人分成兩邊的條文，被當成進神家的門檻。可是同一封信 6:2 仍然引十誡。所以讀舊約仍然是基督徒的本分，舊約的道德要求仍然是神心意的表達；只是我們不再靠守它進門，而是被接進門以後，靠聖靈活出它。講成「舊約作廢」，就把拆牆講成了拆家。詳見本章議題頁。"]],["d",["「造成一個新人」是不是表示教會已經取代了以色列，神和猶太人的事結束了？","不是。2:12 列出外邦人從前缺少的，全部是以色列原有的：國民的身分、諸約、應許。外邦人是被接進來的，不是把原來的主人趕走。新人是猶太人和外邦人在基督裡一同被造，不是一方吃掉另一方；2:18 說「我們兩下」藉著同一位基督、同一個聖靈到父面前，兩邊走的是同一道門。在教會裡嘲笑猶太人，等於在基督拆過的地方另砌一道牆。反過來，也不必叫外邦信徒守猶太節期才算進入福分，那正是被廢掉的入門條件。詳見本章議題頁。"]],["h","四、住在隔壁的人，變成家裡的人"],["p","牆倒了以後，那片地上蓋起了甚麼？「這樣，你們不再作外人和客旅，是與聖徒同國，是神家裡的人了」（2:19）。「客旅」原文字面是住在房子旁邊的人，「家裡的人」是同一個字根。住在隔壁的人可以天天打招呼，可是吃團圓飯的時候，他不會坐在你家的圓桌旁。保羅說，這個身分已經改了：你不只是神家的鄰居，家裡有你的一副碗筷，門口有你的一把鑰匙。"],["p","一句「她是嫁進來的」，可以讓一個人在家族裡坐了三十年的邊位；從外地調來的同事做了十年，提起來還是「那個外地的」。那麼教會呢？一位新朋友來了半年，還是一個人坐在最後一排。保羅先說「同國」，再說「家裡的人」：同國是一張身分證，家是一張每天都要一起坐下的飯桌。"],["p","這個家怎麼蓋？「並且被建造在使徒和先知的根基上，有基督耶穌自己為房角石」（2:20）。「被建造」是被動的，蓋房子的是神，我們是石頭。根基是使徒和先知所見證、所傳的基督，根基只打一次；今天沒有人可以自稱新的根基，拿頭銜要人絕對順服，這個家的元首只有基督。房角石是整座房子照著它對齊的石頭，這使我們想起「匠人所棄的石頭已成了房角的頭塊石頭」（詩 118:22）。每一塊石頭要對齊的是它，不是旁邊那一塊。"],["p","「各房靠他聯絡得合式，漸漸成為主的聖殿。」（2:21）「漸漸」原文是正在長大：房子不會長大，身體才會。「聯絡得合式」，是石頭被切、被磨，好和旁邊那一塊接得剛剛好。有一位同工講話老是讓你不舒服？那可能是石匠的工具正在你身上。被磨不是被丟掉，是被放進牆裡的前一步。"],["p","全章最後一句：「你們也靠他同被建造，成為神藉著聖靈居住的所在。」（2:22）這一座殿沒有外院，沒有矮牆，因為它的石頭就是從前被擋在牆外的人。神要住的地方是「你們」，複數。書信三問的第二問到這裡有了答案：保羅從福音推出來的原則是，基督自己是我們的和睦，牆是他用身體拆的，家是他的，鑰匙也在他手上。第三問落在今天：每一道摺疊門、每一排沒有人坐過去的後排座位，都是它要落地的地方。"],["d",["今天有人自稱使徒、先知，說他在打新的根基，我們要在他的遮蓋底下，對嗎？","2:20 說神的家「被建造在使徒和先知的根基上」，房角石是基督。根基只打一次：新約的使徒和先知親眼見證了復活的主，把福音的根基立好了，寫成我們手上的新約。今天開拓教會、勸勉造就的功能仍然需要，但沒有人可以自封為新的根基，拿頭銜要求絕對的順服、奉獻或忠誠，也沒有人可以宣稱有高過聖經的新啟示，或用「先知性的話」替你決定婚姻、工作、搬遷。可以問：他讓我更對齊基督嗎？他能被糾正嗎？4:11 的五重職份怎樣讀，第 4 課會細講；本講義的全卷立場見 ISS00_5。"]],["h","五、幾個必須認得的偏差"],["p","第一個偏差，是把恩典和行為拆開讀。只讀 2:8–9，說反正得救了、怎麼活都可以；或只讀 2:10，說得救是恩典，可是善行不夠就會失去。三節一起讀：不是出於行為，卻是為要叫我們行善。"],["p","第二個偏差，是把「一同坐在天上」講成你應該健康、富足、凡事順利，不順利就是沒有活出地位；或反過來，講成既然坐下了，就可以躺平。寫這句話的人在監裡；坐下的人，第十節緊接著就要走路。"],["p","第三個偏差，是把 2:11–22 講成教會已經取代了以色列，或在講台上輕看猶太人。2:12 的清單以以色列為中心，外邦人是被接進來的；保羅在別處也說：「不是你托著根，乃是根托著你。」（羅 11:18）新人是兩方一同被造。"],["p","第四個偏差，是用「牆已經拆了」「要合一」，叫受傷害的人和傷害他的人坐在一起，或叫被欺壓的人不要再說出不公平。基督拆的是冤仇與敵意，不是人保護自己安全的界線。饒恕是把報復的權利交給神，和好需要對方真實的悔改，也需要安全。"],["p","第五個偏差，是先喊口號再找經文，說只要大家無己一點、努力一點，牆就會倒；或說今天有新的使徒在打新的根基，你要在他的遮蓋底下。這一段每一個要緊的動詞，主詞都是基督：他是和睦，他拆了牆，他造了新人；根基只打一次，房角石只有一塊。"],["d",["教會勸我和曾經傷害我的人「合一」，說牆已經拆了，我該怎麼面對？","請先聽清楚：基督拆的是冤仇與敵意，不是你保護自己安全的界線。2:16 的和好是在十字架上成就的，它的路是真實的悔改，不是叫受傷的人假裝沒事。饒恕和和好是兩件事：饒恕是你在神面前把報復的權利交給他，可以慢慢來；和好需要對方承認、悔改，也需要安全。實際上，第一，若有立即的危險，先保護自己和孩子，必要時撥打當地的緊急電話。第二，找一位信得過的人說出來，組長、牧者、輔導或社工。第三，不必因為別人說「要合一」，就立刻回到那個人身邊。組長若在組裡聽到這樣的事，不追問細節，會後單獨關心，必要時協助尋求專業協助。饒恕與受害者的分寸，回指哥林多後書立場四。"]],["h","六、兩個華人處境的真實問題"],["p","第一個問題：分堂慢慢變成分家。國語堂、粵語堂、英語堂分開聚會，可以是為了福音的方便，讓阿嬤和孫子都聽得懂；可是若二十年從不一起吃飯、一起禱告、一起作決定，提到對方總說「他們那邊的」，那就是一道摺疊門了。選舉一到，弟兄姊妹在網上說話越來越冷，彷彿政治立場比十字架還能決定誰是自己人。要問：我這一句話，是在說理，還是在把一位弟兄姊妹砌到牆的另一邊？"],["p","第二個問題：怎樣看家裡還在拜拜的長輩。2:12 說外邦人「沒有指望，沒有神」，有人讀到這裡，回家就和父母辯論，說他們拜的都是假的。可是保羅在 2:3 先說了「我們從前也都在他們中間」，又說「和別人一樣」。他描寫的是一個人人都住過的地方，不是一群可以被看不起的人。我們不拜、不求、不擇日，因為那是把信靠交給別人；但對長輩，我們要的是被血帶近的人那一份謙卑：我也是被白白救活的。多陪他吃幾頓飯，比贏他幾句辯論，更像拆牆的主。"],["h","七、活出321——坐下的人，才讓得出位子"],["p","走到這裡，我們才把國度321空中團契常說的那句話接上去：無己才能合一。它的根不在口號裡，在 2:14：是「他」使我們和睦，是「他」拆了牆；合一不是我們造出來的，是他造好了交給我們保守。"],["p","耶穌是我的榜樣：主在聖殿推倒兌換銀錢之人的桌子，被買賣佔滿的正是外邦人唯一可以禱告的外院；他在井邊向一位撒馬利亞婦人要水喝，那時「猶太人和撒馬利亞人沒有來往」（約 4:9）。他拆牆最後不是靠辯論，是用自己的身體。"],["p","聖經是我的準則：次序不可倒過來。先看見十字架上那個身體，才講合一；三節一起讀，才講行善。"],["p","聖靈是我的引導：我們兩下是「被一個聖靈所感」才進到父面前，神的家也是「藉著聖靈」居住的所在。哪一道門要先拉開、哪一段不安全的關係要先保持距離，求聖靈給你分辨的心。"],["p","讓耶穌作王：讓出兩個位置。一個是救自己的人，我承認那個轉折詞的主詞是神；一個是守門的人，牆是他拆的，鑰匙在他手上，我不再決定誰是外人。可以檢查：這一週我最後一次在心裡說「他們那種人」，是誰在我心裡作王？"],["p","讓耶穌得著一切的榮耀：第七節說，神要把他極豐富的恩典顯明給後來的世代看。一個能讓不同口音的人坐在同一桌的教會，被看見的不是我們多包容，是那位用血把遠的近的都帶近的主。"],["p","建立屬神的體系：接待不停在門口，從被歡迎、被認識，到被邀請上場服事，要有人一路陪著走；讓不同族群、語言、世代的人坐在作決定的桌子旁，不只出現在節慶的合照裡；常常讓弟兄姊妹說自己的「然而，神」。"],["h","八、四種心，站在牆的哪一邊"],["p","驕傲型的心，常常站在牆的裡面，手上拿著鑰匙。我沒有趕誰走，只是心裡有一把尺：口音、學歷、信主的年日。這一章只問你一句：「和別人一樣」那四個字，你讀進去了嗎？你也是從墳墓裡被抬出來的，鑰匙從來不在你手上。"],["p","恐懼型的心，最怕那道門被拉開。拉開了，我習慣的聚會方式、我熟悉的那幾個人、我在這裡的位置，會不會都不見了？請聽 2:6：你已經和基督一同坐下了。坐下的人不必搶位子，也不怕讓位子；你在神家裡的那一副碗筷，沒有人拿得走。"],["p","羞恥型的心，像那一位一直坐在最後一排的人。你被叫過「那個外地的」「嫁進來的」，你早就認定，我大概永遠是客人。可是 2:19 說的是「你們不再作外人和客旅」。不再，是神已經改好的身分，不是你要表現夠好才換得到的。"],["p","受傷型的心，也許你那一道牆不是傲慢砌的，是被傷害之後才築起來的。今天不必勉強拆掉它，也不必立刻回到那個人身邊；基督拆的是冤仇，不是你的安全。先把報復的權利交給神，若你正處在危險裡，請告訴一位信得過的人，讓人陪你找到安全和專業的幫助。"],["h","九、這一週，你可以做的幾件事"],["p","以下五件事，請在散會以前寫下時間、地點和名字。"],["p","第一，每天早上用 2:4–6 禱告：把一件你最近覺得沒救了的事，放在「然而，神」後面說出來，然後說：主啊，我已經與你一同坐下，今天不必守任何位子。"],["p","第二，找出你生活裡的一位外人：外籍看護、新同事、新移民鄰居，或教會裡坐在最後一排的那一位。學會把他的名字念對，問一次他的家鄉和家人。"],["p","第三，這七天，每當你在心裡說「他們那邊的」「他們那種人」，就記下時間、對象和那道牆的材料：口音、背景、立場，還是舊傷。週末把單子帶到主面前。"],["p","第四，在小組或事工團隊裡提出一個具體安排：和另一個語言堂或另一個世代合辦一次聚餐禱告，或請一位外籍弟兄姊妹分享他家鄉的代禱事項。"],["p","第五，在網上談論政治與社會議題以前，先停十秒，問自己：這一句話會不會把一位弟兄姊妹砌到牆的另一邊？會，就不發。"],["p","然後我們一起開口說出四句話。"],["p","我宣告：我從前死在過犯罪惡之中，然而，神，他叫我與基督一同活過來，一同坐在天上。"],["p","我宣告：我得救是本乎恩，也因著信，連這份信也是神所賜的；我要走在神所預備的善行裡。"],["p","我宣告：基督是我們的和睦，他已經用自己的身體拆毀了中間隔斷的牆，我不再替神守門。"],["p","我宣告：我不再是外人和客旅，是神家裡的人；我也要把旁邊的位子空出來。"],["d",["我想主動接近教會裡一位外籍或新來的弟兄姊妹，可是語言不通又怕尷尬，怎麼開始？","不必一次做很多，先從家人會做的小事開始。第一，學會把他的名字念對，這一件事本身就是在說：你在這裡被認識。第二，問兩個簡單的問題：你家鄉在哪裡？家裡還有誰？聽他說，不急著介紹教會的活動。第三，語言不通，用翻譯軟體或帶一位會雙語的人同去。第四，做一件只有家人才會做的事：記住他的生日，請他到家裡吃一頓便飯，或在小組裡為他遠方的家人指名禱告。不要把他當成事工的對象，他是你的弟兄姊妹。"]],["h","十、結語"],["p","我們回到那一間副堂。後來那一位老執事做了一件很小的事：有一個主日十二點半，他沒有拉上摺疊門，自己端著一盤炒米粉，走到右邊，坐在一群講英語的年輕人中間。第三個主日，有人把披薩推到他面前。那道門到今天還在，只是很少再拉上了。"],["p","可是這一課的焦點，不在那位老執事多勇敢，也不在我們學會說「無己才能合一」。焦點在保羅寫下的那一句：他是我們的和睦。牆不是被我們推倒的，是被他的身體擋下來的；我們坐上寶座，是因為他先從寶座上下來，被掛在木頭上。你不必更佩服會拆牆的人，只要更認識這一位用血把你從遠處帶近的主。"],["p","我們一起低頭禱告。有豐富憐憫的父神，我們從前死在過犯罪惡之中，然而是你，叫我們與基督一同活過來、一同坐下。赦免我們在你拆過的地方，又一塊一塊把牆砌回去；赦免我們替你守門，忘了自己也曾是外人。求你醫治那些因為傷害才築起牆的人，保守他們的安全；也給我們勇氣，這一週走到牆原來站的地方，把旁邊的位子空出來。願你的家成為你藉著聖靈居住的所在。奉主耶穌基督的名禱告，阿們。"],["h","十一、小組討論分享：三個化"],["p","這一個鐘頭不比誰比較包容，是讓每一個人說出一道自己守著的牆，也說出這一週要走過去的那一個人；以下三個化，請組長照著次序帶。"],["m","帶領說明：本課主軸是坐、牆、殿。席上可能有一直被當作外人的人，也可能有因為受過傷害才築起牆的人，請先讀第二化的帶領提醒。"],["m","優先順序標示：★★★＝最優先，時間不足時每一化至少討論這一題；★★＝次優先；★＝時間充裕再討論。標【必做】的繁殖任務不可省略，可帶回家完成。"],["s","第一化｜內化成為觀念（約20分鐘）"],["m","目的：讓組員講得出三個觀念：從前到如今的主詞是神；行善是恩典的果子不是條件；牆是基督用身體拆的，新人是兩方一同被造。"],["n","1. ★ 說一道你記得最清楚的牆：學校裡的小圈圈、公司的部門、家族裡的兩房，或教會裡的兩個堂。那時你站在牆的哪一邊？"],["n","2. ★★★ 保羅說從前到如今中間是「然而，神」。請用一句話說：為甚麼一個知道自己已經和基督一同坐下的人，比較不需要守住地上的位子？"],["n","3. ★★ 第九節的「行為」和第十節的「善」原文是同一個字。請說出只讀兩節會變成甚麼樣的信仰，只讀第十節又會變成甚麼樣的信仰。"],["n","4. ★★ 「新人」第一次出現，是由兩群人合成的一個人。這和「教會取代了以色列」有甚麼不同？為甚麼這個分別對我們看待別人很重要？"],["m","帶領提醒：讀 2:8–10 時請一口氣讀完三節。談到猶太人時，不讓任何人說輕看的話。"],["s","第二化｜消化成為生命（約35分鐘·本課主軸）"],["m","目的：讓每一個人說出一道自己守著的牆、牆是用甚麼材料砌的，並在「他是我們的和睦」裡，說出這一週要走過去的那一個人。"],["t","【看】看見自己"],["n","5. ★★★ 說出一個具體的人（不必說全名）：在你的家、公司、社區或教會裡，誰到今天還被你當作外人？你們中間那道牆是口音、背景、立場，還是一次舊的傷？"],["t","【聽】聽神說話"],["n","6. ★★ 請慢慢讀 2:13 和 2:19 兩遍，第二遍把「你們」換成你自己的名字。讀完說一句：你聽見神怎樣看你？"],["t","【想】想通關卡"],["n","7. ★★★ 你不走過那一道牆，卡在哪裡：怕尷尬、怕失去自己那一邊的位置、覺得對方先錯，還是那裡真的不安全？選一個說出來。"],["t","【講】說出口"],["n","8. ★★ 請對組裡的人說：「我從前也是外人，是被他的血帶近的；我不再替神守門。」右手邊的人只回一句「你是神家裡的人」，不給建議。"],["t","【行】走一步"],["n","9. ★★★ 寫下這一週你要走過去的那一個人：名字或關係、星期幾、在哪裡、要做哪一件只有家人才會做的事。若那道牆是傷害築起來的，改寫下你要告訴的那一位信得過的人和哪一天。"],["m","帶領提醒：拆牆不等於要受傷的人回到不安全的地方。這一化可能碰到家庭傷害或族群歧視的經驗；不追問細節，不要求任何人原諒誰或和傷害他的人坐在一起，不對正在流淚的人說「你要有信心」。若有人說出正處在危險中，不在組裡處理，會後單獨關心，先確認他是否安全，必要時協助尋求專業協助。第七題之後請留三十秒安靜。"],["s","第三化｜轉化成為生活（約25分鐘）"],["m","目的：把這一課搬進行事曆：每天用 2:4–6 禱告、念對一個名字、一次跨牆的聚餐、一個要帶的人。"],["n","10. ★★ 你的小組最近一次和另一個語言堂或另一個世代一起吃飯禱告，是甚麼時候？說出這個月可以提出的一個安排，和你要去找誰談。"],["n","11. ★ 看一看你的群組和飯局，是不是只剩下和你一樣的人？說出這一週你要加進來的一位不一樣的人，和哪一天聯絡他。"],["n","12. ★★ 說出一位家裡還在拜拜的長輩，這一週哪一天你要不辯論、只陪他吃一頓飯或打一通電話？"],["n","13. ★★★ 這是本課的 920 操練：找出你的那一個「2」，神放在你身邊、你要帶的那一個人。當場說出他的名字，說出這一週哪一天你要向他分享：你也可以成為神家裡的人。"],["n","14. ★★★ 【必做】繁殖任務：用三句話把這一課講給一位教會外的朋友聽。第一句，兩千年前耶路撒冷的聖殿有一道牆，外國人越過去就是死罪。第二句，耶穌用自己的身體把那道牆拆了，讓遠的近的都能一起回到神面前。第三句，所以在神的家裡沒有外人，你也有一個位子。這一週講給一個人，下次回來說他的反應。"],["m","帶領提醒：要具體到時間、地點、人名，不收「我會多接納別人」這類答案；若那個人曾傷害組員，不勉強接近。"],["s","收尾（5分鐘）"],["p","請每一個人用一句話說：這一週我要走過去的那一個人是誰。可以只說關係。"],["p","然後彼此代禱，為三種人指名禱告：一位外籍移工或新移民，求主讓他在教會裡找到家；一位一直被當作外人的人，求主讓他知道自己是神家裡的人；一位因為受過傷害而築起牆的人，求主保守他的安全，醫治他的心。"],["p","散會以前，確認紙上寫了三樣：要走過去的那一個人、要念對的那一個名字、你的那個「2」。下次帶來對。"]]},"3":{"no":3,"vol":"《321以弗所書講義》第三課·以弗所書第三章","title":"基督的愛是何等長闊高深——鍊子、膝蓋、捲尺","chars":5045,"min":60,"deep":8,"dchars":1777,"tchars":1355,"blocks":[["h","一、一把拉不到盡頭的捲尺"],["p","弟兄姊妹平安。我們這一代人很習慣量東西。買房子先問坪數，買沙發先拿捲尺量客廳那一面牆；孩子每年生日靠在門框上畫一條線，看長高了幾公分；成績單上有分數，手錶每天告訴你走了幾步。量得出來，心裡就踏實；量不出來，就不太放心。"],["p","捲尺很誠實，可是它有一個脾氣：它只量得到它碰得到的東西。拉到盡頭，那一格就是答案。很多人也這樣量神的愛：這一年順，就說神很愛我；這一年病了、失業了、被一段關係困住了，捲尺拉出來一看，好像短了一截。"],["p","以弗所書第三章有一樣東西，保羅說量不完。他求神叫我們「能以和眾聖徒一同明白基督的愛是何等長闊高深，並知道這愛是過於人所能測度的」（3:18–19）。長、闊、高、深，四個方向都給了，最後卻說：過於人所能測度。他遞給你一把捲尺，又告訴你，這一次拉不到盡頭。"],["p","說這句話的人，自己正被量著。他的手腕上有一條鍊子，長度是固定的，羅馬兵站在鍊子的另一頭。他能走多遠、能見誰、還能活多久，都有人替他量好了。偏偏是這樣一個人，寫下新約裡最寬的一段禱告。"],["p","以弗所和亞細亞的信徒遇到甚麼？他們聽說保羅被關了。傳福音的人被關，福音還靠得住嗎？他們多半是外邦人，心裡也許還在問：我真的算數嗎？保羅從福音推出來的原則很清楚：你算不算數，不是處境量出來的，是基督量出來的；而他的量法，沒有盡頭。"],["p","這一課我們拿著三樣東西走：一條鍊子（3:1–7），一個比最小還小的人（3:8–13），一雙跪下來的膝蓋（3:14–21）。走完了，再回來看看手上那一把捲尺。"],["d",["和合本第一節的「替你們祈禱」是補上去的，那我們手上的聖經還可靠嗎？","可靠，而且這正是譯者誠實的地方。保羅的原文說到「為你們外邦人」就斷了，後面是一道破折號；他岔出去講了十二節，到第十四節才用同樣的「因此」接回來，說他在父面前屈膝。和合本的譯者為了讓中文讀起來是一句完整的話，照第十四節補了四個字，並且在註腳裡老老實實寫出來。補上的只是預先說出保羅後來自己說的話。看見註腳不要緊張，那是譯者把功課攤在你面前；這個斷句反而讓我們看見保羅的心。你可以在讀經本上把第一節和第十四節用一條線連起來。"]],["h","二、戴鍊子的管家：三個「同」字"],["p","第一節是一句沒有說完的話：「因此，我－保羅為你們外邦人作了基督耶穌被囚的，替你們祈禱。」（3:1）和合本的註腳說明，最後四個字是照第十四節補上的；原文說到「外邦人」就斷了。他岔出去講了十二節，到第十四節才用同樣的「因此」接回去：這是一段被打斷的禱告，插在中間的，是他最放不下的事。"],["p","請看他怎麼稱呼自己：基督耶穌被囚的。鍊子是羅馬的，握著鍊子另一頭的卻是基督。使徒行傳講義第二十八章講過他在羅馬的日子：「保羅蒙准和一個看守他的兵另住在一處。」（徒 28:16）手上有鍊子，門卻開著。誰決定你在哪裡，誰就是你的主；處境量得出你的活動範圍，量不出你屬於誰。"],["p","接著是他的第二個身分：「諒必你們曾聽見神賜恩給我，將關切你們的職分託付我」（3:2）。「職分」原文 οἰκονομίαν（oikonomian），是大戶人家的管家差事。管家腰上掛著整串鑰匙，可是房子不是他的，帳要交，棒也要交。我們手上的小組、職位、一份被信任的託付，都是鑰匙，不是地契。管家最容易犯的錯不是偷懶，是做久了，忘記這個家不是他的。"],["p","鑰匙開的是甚麼門？一個奧祕。聖經說的奧祕，不是神祕難懂，是從前藏著、如今打開了。「這奧祕在以前的世代沒有叫人知道，像如今藉著聖靈啟示他的聖使徒和先知一樣。」（3:5）今天還有沒有使徒和先知，講義有整理（全卷立場見 ISS00_5），第四課再談；這裡只請你看見，啟示是交給一群人一同領受的，真從神來的亮光會把人帶回聖經和群體。"],["p","然後他終於說出奧祕的內容：「這奧祕就是外邦人在基督耶穌裡，藉著福音，得以同為後嗣，同為一體，同蒙應許。」（3:6）原文三個詞都以「同」起頭，好像現成的字不夠用。同為後嗣：你的名字寫在遺囑上，不是寄住的客人。同為一體：不是兩個團體結盟，是長在同一個身體上。同蒙應許：給亞伯拉罕的應許你有完整的一份；是被接進來同享，不是把誰擠出去。"],["p","這三個「同」字，今天最常被打折扣。本地人和新移民各坐一邊，老會友和新朋友各有各的圈子。保羅接著說他作了這福音的執事，原文 διάκονος（diakonos），本來是端盤子的人。囚犯、管家、端盤子的，他形容自己的字一節比一節低；他端上桌的，卻是讓所有人同坐一桌的福音。"],["d",["第五節說奧祕啟示給「聖使徒和先知」，今天還有使徒和先知嗎？","這一題在教會裡有不同的看法，講義的議題頁把幾種立場並陳，全卷立場見 ISS00_5，第四課講到五重職份時再談。這一課只抓住三件事。第一，第二章說使徒和先知是根基，根基只打一次；新約使徒那種見證復活、奠定真道的職分，今天不再有。第二，使徒性和先知性的功能今天仍然需要。第三，任何人都不可以用頭銜要求絕對順服，不可以發布高過聖經的新啟示，更不可以用「神對你說」替人決定婚姻、工作。若有人告訴你一句「先知性的話」，請拿聖經察驗，也找兩位成熟的肢體一起分辨。"]],["d",["外邦人「同為後嗣」，是不是表示教會取代了以色列，猶太人已經被丟棄了？","不是。第六節的關鍵是那三個「同」字：外邦人是同為後嗣、同為一體、同蒙應許。應許原是給以色列的，外邦人是被接進來同享，不是把以色列擠出去。保羅在羅馬書也用接枝的比喻，說野橄欖枝是被接在原來的根上。如果把第六節講成取代，等於在牆被拆毀之後，又築了一道新的牆，這正好和第二章、第三章的方向相反。可以立刻做的是：若你身邊有一位覺得自己在教會裡是外人的人，讓他知道他是一家人。"]],["h","三、原文亮光：比最小還小、追不到的腳印、住下來"],["p","這一章有三個字，拆開來，整章就站起來了。它們剛好是保羅的三個方向：往下、往前、往裡。"],["p","第一個字往下。「我本來比眾聖徒中最小的還小，然而他還賜我這恩典，叫我把基督那測不透的豐富傳給外邦人」（3:8）。「比最小的還小」原文只有一個字：ἐλαχιστοτέρῳ（elachistoterō）。「最小」已經是最高級，到底了；保羅在最高級後面再接上比較級的字尾，等於說「最小還要更小」。文法上沒有這個地方，保羅的心裡有。寫哥林多前書時他說自己是「使徒中最小的」（林前 15:9），到了這裡，他跟所有的聖徒比。可是請連著讀：同一口氣，他說神還賜他這恩典。他的小不是自我厭惡，是站在恩典旁邊量出來的高度。"],["p","第二個字往前。「測不透的豐富」，原文 τὸ ἀνεξιχνίαστον πλοῦτος（to anexichniaston ploutos），字根 ἴχνος（ichnos） 是腳印。你沿著腳印一路追，追到天黑也追不到盡頭；羅馬書第十一章說神的蹤跡難尋，用的是同一個字。這就解釋了第一個字：保羅為甚麼越走越小？因為他越往基督的豐富裡追，越看見前面還有腳印。謙卑不是把自己壓低的技巧，是一直往前追的人自然的樣子。"],["p","第三個字往裡。「使基督因你們的信，住在你們心裡」（3:17）。他們已經信了，基督早就在他們裡面，保羅為甚麼還這樣求？因為「住」原文 κατοικῆσαι（katoikēsai），是定居、住下來，和第二章「客旅」是同一個字族，方向剛好相反：客旅是寄住的，定居是當家的。一個人可以讓基督進門，卻只給他一間客房：客廳、錢包和行事曆都是我管。保羅求的不是基督來作客，是基督搬進來，每一把鑰匙都交給他。這不是要你再得救一次，是讓已經住在你裡面的那一位，作這個家的主人。"],["p","三個字放在一起，就是這一章的路：往下，看見自己比最小的還小；往前，看見基督的豐富追不到盡頭；往裡，讓這一位住下來當家。這也是我們團契常說的用心靠聖靈：保羅求神「叫你們心裡的力量剛強起來」（3:16），「心裡」原文是「裡面的人」。"],["d",["保羅說自己比最小的還小，我是不是也要覺得自己一文不值，才算謙卑？","不是。請把第八節整句讀完：「比最小的還小」的後面緊接著「然而他還賜我這恩典」，叫他把基督測不透的豐富傳出去。保羅的小，是看見基督有多大以後的位置，不是對自己的厭惡。厭惡自己的人眼睛還是盯著自己；謙卑的人眼睛轉到基督身上。若你本來就常覺得自己不夠好，這一節是要你看見：神把最大的豐富放在最小的人手上，你也在這個名單裡。可以寫下你最近一次責備自己的話，在旁邊寫上「然而他還賜我這恩典」，再寫一件可以拿這份恩典去服事人的小事，這一週做出來。"]],["h","四、跪下來，和眾聖徒一同量"],["p","第十節，保羅的眼光一下子從一個最小的人放大到天上：「為要藉著教會使天上執政的、掌權的，現在得知神百般的智慧。」（3:10）「百般的」原文 πολυποίκιλος（polypoikilos），是繡花布那種多彩的花樣：每一種顏色都還在，卻織成同一幅圖。天上看的，是一群本來互相看不起的人坐在同一張桌子邊，稱同一位為父。執政掌權者是誰，講義有整理（全卷立場見 ISS00_4）；勝負已定，教會不必表演爭戰，一群不一樣的人合一地坐在一起，本身就是宣告。"],["p","所以保羅說：「所以，我求你們不要因我為你們所受的患難喪膽，這原是你們的榮耀。」（3:13）「喪膽」原文 ἐγκακεῖν（enkakein），是累到洩氣、撐不下去就放手；耶穌設比喻「是要人常常禱告，不可灰心」（路 18:1），用的就是這個字。請看保羅下一句做了甚麼：不是叫人咬牙再撐一下，是「我在父面前屈膝」（3:14）。喪膽的解藥是跪下來。"],["p","猶太人平常站著禱告，保羅跪下了。「因此，我在父面前屈膝，天上地上的各家，都是從他得名。」（3:14–15）「父」和「家」原文同一個字根，每一個家族都是從這位父得名。經文沒有規定姿勢；姿勢不是門檻，是心的樣子被身體說出來。一個比最小的還小的人，在父面前再把自己放低一次。"],["p","他跪下來求甚麼？第十六到十九節是一座三層的階梯：先是剛強，基督住下來，愛心「有根有基」（3:17）；再是明白，就是我們開頭那一把捲尺；最後是充滿，「便叫神一切所充滿的，充滿了你們」（3:19）。中間那一層，請先聽四個字：和眾聖徒。保羅沒有求每個人自己量清楚，他求的是一起量。"],["p","想像一個小組圍成一圈，每個人手上拿著一段尺。一位擺攤三十年的阿伯欠了債，弟兄陪他一家一家去還，他量到的是長。一位外地來的學生第一次被請回家吃年夜飯，他量到的是闊。一位照顧失智母親的姊妹，在最累的晚上被托住，她量到的是深。一位離開教會十年又回來的弟兄說，他回來那天沒有人問他去了哪裡，只有人說「你的位子還在」，他量到的是高。四段接起來，還是拉不到盡頭；少了任何一個人，就少了一面。"],["p","保羅說這愛「過於人所能測度的」（3:19）。最後一層「充滿」是被動的：人不能自己灌滿自己，只能把空間讓出來。跪下，是讓出位子；讓基督定居，是讓出房間；和眾聖徒一同量，是放下那一把只屬於自己的尺。"],["p","然後跪著的人抬起頭來：「神能照著運行在我們心裡的大力充充足足地成就一切，超過我們所求所想的。」（3:20）「充充足足地」原文 ὑπερεκπερισσοῦ（hyperekperissou），超過、出來、滿溢，三層疊在一起。這一節常被讀成更大的房子、更高的收入，可是寫的人手上還扣著鍊子；神充充足足成就的，是前面那段禱告：裡面剛強、基督定居、一同明白、被神充滿。最後一句的地點是「在教會中，並在基督耶穌裡」（3:21），這是全卷地勢圖的最高點；主詞是「他」，不是保羅，也不是教會。下一章一開口就是「所以」：先坐，才會行。"],["d",["我為一件事禱告了很多年都沒有改變，是不是我信心不夠，所以第二十節在我身上不靈？","不是。第二十節不是一張保證書，而是一段禱告的頌讚。請連著前面四節讀：神充充足足成就的，是叫人裡面剛強、基督住在心裡、愛心有根有基、和眾聖徒一同明白基督的愛、被神充滿。寫這一句的人手上還扣著鍊子，他沒有出監，亞細亞的教會也沒有因此發財。所以禱告沒有照你的意思成就，不等於神沒有作工，更不等於你信心不夠；神可能正在你裡面成就一件你沒有想到要求的事。你可以繼續帶著那件事禱告，同時加上第十六到十九節。也請找一位弟兄姊妹陪你禱告，不要一個人在夜裡算帳。若事情牽涉病痛，請同時接受醫療。"]],["d",["教會要讓天上執政掌權的看見神的智慧，那我們要不要去點名捆綁地域邪靈？","第十節說的是，教會的存在本身就是宣告：一群本來彼此隔絕的人，猶太人和外邦人、主人和奴僕，同為一體坐在一起，讓天上看見神百般的智慧。經文沒有叫教會去點名捆綁、畫屬靈地圖、表演爭戰。全卷立場見 ISS00_4，第六課再完整講；這裡只抓住兩件事。第一，勝負已定，基督已經坐在天上，遠超過一切執政掌權的，所以不必恐慌，也不必迷信。第二，最有力的宣告常常很平凡：一個有老有少的小組彼此饒恕、同桌吃飯。若你這一週想做一件屬靈爭戰的事，就去和那位一直合不來的弟兄姊妹吃一頓飯。"]],["h","五、幾個必須認得的偏差"],["p","第一個偏差，是把第二十節講成禱告的保證：只要信心夠，神一定給你更大的房子、更高的收入，病一定好。第二十節要和前面四節的禱告連著讀，否則會叫禱告多年沒有照樣成就的人，以為是自己信心不夠。"],["p","第二個偏差，是用第十三節叫受害的人忍耐：家暴、職場霸凌、屬靈控制底下的人，被勸說「為主受苦是榮耀」。保羅的苦是為福音、為別人而受的，不是替加害者遮掩；受害不等於背十字架，遇到傷害，先保護人的安全。"],["p","第三個偏差，是把第八節講成自我貶低，「越覺得自己一文不值越謙卑」；或反過來，領袖嘴上自稱最小，實際上不許任何人提醒他。保羅說最小的同一口氣說神賜他恩典，他的謙卑落在管家和端盤子的行動上。"],["p","第四個偏差，是把第十八節的長闊高深講成屬靈的等級，「你才量到闊，我已經到深」；或把四個方向寓意成十字架四端，當作經文本來的意思。保羅的重點是和眾聖徒一同量，沒有人量完，更不能拿來分高低。"],["p","第五個偏差，是把第二節的職分和第五節的使徒先知講成地盤和頭銜：「神把這個位置交給我，別人不可以碰」，或自封使徒、先知，要眾人順服。職分是管家的差事，鑰匙要交帳也要交棒；元首只有基督。"],["h","六、兩個華人處境的真實問題"],["p","第一個問題：我們很看重姓氏、籍貫、同鄉會，教會也常常照這個樣子分桌。講台語的一堂、講粵語的一堂，新移民一個小組；分堂不一定錯，可是一年到頭看不見彼此，三個「同」字就只剩下文字。第十五節說天上地上的各家都從那一位父得名：這一節沒有廢掉我們的家族，卻把每一個家族放回同一位父的名下，在他面前沒有一個姓比另一個姓高。可以從小處開始：一年幾次聯合聚會，一個小組刻意邀請一個講不同母語的家庭。"],["p","第二個問題：家醜不外揚，報喜不報憂。家裡有人病了、生意倒了、婚姻走不下去了，很多人第一個念頭是不要讓教會知道，怕丟臉，也怕被人在背後說「是不是神不祝福他」。這和把第二十節貼在車上的福氣觀同一個根：把順利當成被愛的證據。保羅卻在信裡大方地說「我為你們所受的患難」，還叫人不要喪膽。被困不是被丟棄；讓小組知道你的鍊子，是讓眾聖徒一起量。需要專業協助的也要去求，禱告和求助並不衝突。"],["d",["第十三節說患難是榮耀，那我在家裡或職場被人傷害，也要當作榮耀忍下來嗎？","不要。保羅的患難是為福音、為外邦人而受的，他說的是「為你們所受的患難」，是一個傳福音的人為了別人得著福音付上的代價。被配偶打、被主管霸凌、被屬靈領袖控制，那不是為福音受苦，是別人對你犯了罪。受害不等於背十字架，聖經從來沒有叫人用忍耐去保護加害者。如果你正在這樣的處境裡，第一件事是保護自己和孩子的安全：告訴一位信得過的人，必要時聯絡專業的協助或報警。你不需要先原諒誰才能求助。小組長若聽見這樣的分享，不追問細節，會後單獨關心，並協助尋求專業協助。"]],["h","七、活出321——在鍊子裡跪下"],["p","耶穌是我的榜樣：在客西馬尼，主耶穌「離開他們約有扔一塊石頭那麼遠，跪下禱告」（路 22:41）。他知道自己要被捆綁，卻跪在父面前。最後的晚餐，他「拿一條手巾束腰」（約 13:4），萬有的主把自己放在最低處。"],["p","聖經是我的準則：第二十節要照著前面四節讀，不抽出來印在卡片上；第十三節的榮耀是為福音受苦，不是叫人忍受傷害。經文說這愛過於人所能測度，我們就不拿它分等級。"],["p","聖靈是我的引導：保羅求神藉著他的靈，叫我們心裡的力量剛強。每天早上，在還沒有看手機以前，用一句話把裡面的人交給聖靈：「今天請你住在我每一個房間。」"],["p","讓耶穌作王：這一章要人讓出兩個位置。一個是處境在我心裡的寶座：我是基督耶穌的，不是病房、債務、職場的；誰決定我的身分，誰就在作王。另一個是鑰匙主人的位置：我手上的職分是託付，隨時願意交帳、交棒、讓別人上場。"],["p","讓耶穌得著一切的榮耀：第二十一節的主詞是他，榮耀要在教會中、在基督耶穌裡被看見。一群不一樣的人同坐一桌，那才是他的榮耀，不是讓人記得我。"],["p","建立屬神的體系：第一，讓不同族群、世代的人定期同在一個小組，分享基督的愛在我身上是哪一面。第二，建立代禱的網：每一位住院、失業、照顧家人、在監的肢體，都有人固定為他禱告、探望。第三，每一個職分都有交棒的計畫，管家不永遠握著鑰匙。"],["h","八、四種心，各自拿著一把尺"],["p","驕傲型的心，是很會拿尺量別人的人：誰比較屬靈、誰服事比較多、誰還在闊、誰已經到深。請你聽保羅那一個自造的字：比最小的還小。基督的豐富追不到盡頭，你量得越清楚別人，越說明你停在原地。"],["p","恐懼型的心，是一直怕捲尺拉出來會短一截的人：禱告沒有照樣成就，就怕神不愛我了；被困久了，就怕自己已經出局。請你回到第一節：鍊子是羅馬的，握著另一頭的是基督。你的處境量不出你屬於誰，這份愛過於人所能測度。"],["p","羞恥型的心，是覺得自己不配同坐一桌的人：過去的事、現在的困境、家裡說不出口的狀況，讓你寧可坐在最後一排、散會就走。第六節說你同為後嗣，名字寫在遺囑上；第十二節說你可以放膽無懼來到神面前。你不是來面試的，你是家裡的人。"],["p","受傷型的心，是在教會裡被人量過、被人比過的人，或是在困境裡聽見「你信心不夠」的人。這一課不要你立刻原諒誰，也不要你假裝不痛。那些話不是基督的量法；他的愛不看你的成績單。可以先找一位信得過的人說出來。"],["h","九、這一週，你可以做的幾件事"],["p","以下五件事，請在散會以前寫下時間、地點和名字。"],["p","第一，把第十六到十九節抄在一張卡上，每天早上讀一次，再把「你們」換成一位正被困住的人的名字，為他禱告一次。"],["p","第二，寫下你現在的鍊子，一件你改變不了的處境，在旁邊寫一句：我是基督耶穌的。再列出你手上的三把鑰匙，各寫上：這是誰託付的、將來要交給誰。"],["p","第三，找一天安靜十分鐘，若身體方便就跪下來，若不方便就坐著低頭，問主：我心裡還有哪一個房間，你只是客人？把那個房間的名字寫下來。"],["p","第四，找一位和你年紀、背景或母語很不一樣的弟兄姊妹，約一頓飯，問他：基督的愛在你身上是哪一面？只聽，不急著說自己。"],["p","第五，若你正被困住，這一週把你的處境告訴小組裡一位信得過的人；需要醫療、法律或財務協助的，踏出一步去問。"],["p","然後我們一起開口說出四句話。"],["p","我宣告：我是基督耶穌的，鍊子量得出我的範圍，量不出我屬於誰。"],["p","我宣告：我手上的職分是託付，不是產業，我願意交帳，也願意交棒。"],["p","我宣告：我不一個人量基督的愛，我要和眾聖徒一同明白那長闊高深。"],["p","我宣告：神能照著運行在我心裡的大力成就一切，榮耀歸給他，直到永遠。"],["d",["保羅跪下來禱告，那我膝蓋不好、坐著禱告，是不是比較不誠心？","不是。經文記的是保羅那一天的姿勢，不是給眾人的規定。聖經裡有站著、坐著、俯伏、舉手的禱告。猶太人平常站著禱告，保羅跪下來，是他心裡的謙卑被身體說了出來；重點是心在父面前放低，不是膝蓋的角度。年長、行動不便的人坐著、躺著禱告，神一樣垂聽。身體方便的人，偶爾跪下來，可能會發現姿勢幫助心安靜。這一週的第三件事，就照你身體的狀況選一個姿勢：跪也好，坐著低頭也好，重要的是那十分鐘裡，你問主那一個問題：我心裡還有哪一個房間，你只是客人？"]],["h","十、結語"],["p","回到那一把捲尺。我們習慣量東西，也習慣量神：量他給了多少，量自己被愛得夠不夠。保羅手上的鍊子有固定的長度，他卻跪下來，求我們明白一份量不完的愛。握著鍊子另一頭的那一位，他的愛比鍊子長，比屋子闊，比城牆高，比監牢深。"],["p","所以這一課的焦點，不在保羅有多堅強，也不在我們量到了哪裡；焦點在那一位「測不透的豐富」的基督。他降到最低處，被捆綁、被釘死，又復活升天，如今要因著信住在我們心裡。你不必更佩服保羅，他跪下來，就是要我們的眼睛從他身上移開；你只要和眾聖徒坐在一起，一段一段地量，一生也量不完。"],["p","我們一起低頭禱告。天上地上的各家都從你得名的父啊，我們在你面前屈膝。有人正被困在病房、債務、一份走不掉的工作裡，求你叫他裡面的力量剛強起來；有人握著鑰匙不肯放，求你叫他比最小的還小；求基督因著信住在我們心裡，叫我們和眾聖徒一同明白你的愛。但願你在教會中，並在基督耶穌裡，得著榮耀。奉主耶穌基督的名禱告，阿們。"],["h","十一、小組討論分享：三個化"],["p","這一課最重要的，不是背熟長闊高深四個字，是接下來這一個鐘頭，有多少人肯說出自己的鍊子、交出一把鑰匙，又把自己量到的那一面愛說給別人聽；以下三個化，請組長照著次序帶。"],["m","帶領說明：本課主軸是在鍊子裡跪下、和眾聖徒一同量那量不完的愛。席上可能有正被病痛、債務、照顧家人或傷害困住的人，請先讀第二化的帶領提醒。"],["m","優先順序標示：★★★＝最優先，時間不足時每一化至少討論這一題；★★＝次優先；★＝時間充裕再討論。標【必做】的繁殖任務不可省略，可帶回家完成。"],["s","第一化｜內化成為觀念（約20分鐘）"],["m","目的：讓組員用自己的話講得出「處境量不出我屬於誰」「職分是託付不是產業」「基督的愛要和眾聖徒一同量，而且量不完」三個觀念。"],["n","1. ★ 你家裡最常被拿出來量的是甚麼？身高、成績還是步數？那個數字曾經怎樣影響你的心情？"],["n","2. ★★★ 保羅不說自己是羅馬的囚犯，說是基督耶穌被囚的。請用一句話對旁邊的人說明：這個稱呼改變了甚麼？"],["n","3. ★★ 第六節的三個「同」字，在我們的教會裡最常被打折扣的是哪一群人？說出一群人，以及他們在哪個場合最像客人。"],["n","4. ★★ 比最小的還小、追不到的腳印、住下來，這三個字裡，哪一個最改變你對謙卑或對信仰的想法？說出原來怎麼想、現在怎麼想。"],["m","帶領提醒：第一題輕鬆帶；第二十節一定和前面四節連著讀。使徒先知、屬靈爭戰的爭議一句帶過，指向議題頁。"],["s","第二化｜消化成為生命（約35分鐘·本課主軸）"],["m","目的：讓每一個人看見自己的鍊子和鑰匙，並說出這一週要讓基督作主的房間。"],["t","【看】看見自己"],["n","5. ★★★ 你現在的鍊子是甚麼？說出一件你改變不了的處境的類別（健康、工作、家庭、經濟），以及它最常在甚麼時候讓你覺得自己沒有用了。"],["t","【聽】聽神說話"],["n","6. ★★ 請把第十六到十九節慢慢讀一遍，在「使基督因你們的信，住在你們心裡」停下來，安靜一分鐘。說出你心裡哪一個房間，基督到現在還只是客人。"],["t","【想】想通關卡"],["n","7. ★★★ 你不肯交出那一把鑰匙，卡在哪裡：怕沒有人需要我、怕別人做不好，還是覺得那個位置是我辛苦換來的？選一個說出來。"],["t","【講】說出口"],["n","8. ★★ 請對組裡的人說一句：「我被……困住，可是我是基督耶穌的。」右手邊的人只回一句「你是家裡的人」，不給建議，也不追問。"],["t","【行】走一步"],["n","9. ★★★ 說出這一週你要交出的一把鑰匙，或要讓基督作主的一個房間（行事曆、錢包、手機），你要在星期幾做哪一件事，請旁邊的人下次問你。"],["m","帶領提醒：這一化可能碰到正在病痛、失業、照顧家人、長期無望感或家庭傷害裡的人。只問類別，不追問細節，不要求原諒任何傷害過他的人，不對正在流淚的人說「你要有信心」；說不出口的可以跳過。若有人透露家暴、自傷念頭或長期的無望感，不在組裡處理，會後單獨關心，必要時協助尋求專業協助。"],["s","第三化｜轉化成為生活（約25分鐘）"],["m","目的：把這一課搬進這一週的行事曆。"],["n","10. ★★ 說出一位正被困住的人的名字或關係，你要每天在幾點、在哪裡，把第十六到十九節的「你們」換成他的名字為他禱告？週末要用甚麼方式告訴他？"],["n","11. ★★ 說出一位和你年紀、背景或母語很不一樣的弟兄姊妹，你要在哪一天約他吃飯，問他基督的愛在他身上是哪一面？"],["n","12. ★ 你的團隊裡，有沒有一個職分太久沒有交棒，或有一群人一直沒有機會上場？說出你要在哪一天向哪一位同工提出建議。"],["n","13. ★★★ 這是本課的 920 操練：找出你的那一個「2」，這一週向他分享你量到的那一面基督的愛，當場說出他的名字，以及你要約他的日子和地點。"],["n","14. ★★★ 【必做】繁殖任務：用三句話把這一課講給一位教會外的朋友聽。第一句，我們很習慣用數字量自己值不值得被愛，被困住就覺得被丟下。第二句，聖經裡有一個戴著鎖鍊的人寫信說，耶穌的愛有長闊高深，卻是人量不完的，連監牢也擋不住。第三句，這份愛要一群不一樣的人坐在一起才看得見，我想邀請你來看看。這一週講給一個人，下次回來說他的反應。"],["m","帶領提醒：要具體到時間、地點、人名，不收「我會多為人禱告」這類答案；正被困住的組員，不再加事給他。"],["s","收尾（5分鐘）"],["p","每一個人用一句話說：這一週，我要讓基督作主的那一個房間。"],["p","然後彼此代禱，為三種人指名禱告：一位被困在病床、陪病或照顧家人裡的人，求主叫他裡面的力量剛強起來；一位長期被不公平對待的人，求主保護他，讓他身邊有人陪他找到安全與幫助；一位手上握著很多鑰匙的同工，求主讓他找到可以交棒的人。"],["p","散會前確認紙上寫了：為誰禱告、要交出的鑰匙、你的「2」的名字。"]]},"4":{"no":4,"vol":"《321以弗所書講義》第四課·以弗所書第四章","title":"台上不出聲的那一位——行、職、新","chars":4998,"min":60,"deep":8,"dchars":1842,"tchars":1399,"blocks":[["h","一、指揮手上沒有樂器"],["p","弟兄姊妹平安。請你想像一場交響樂的演出。燈暗下來，台上坐著七八十個人，從小提琴一直排到最後一排的定音鼓。指揮最後走出來，鞠一個躬，轉身舉起手。整個晚上，台上只有一個人一個音也沒有發出來，就是他。他手上沒有樂器，只有一根細細的棒子。"],["p","可是沒有人會說他沒有工作。演出以前的幾個月，他一個聲部一個聲部地排練，叫小號收一點，叫那位坐在角落、整晚只有三個音的三角鐵，在對的那一拍敲下去。演出那一晚，他的成績不是自己奏了甚麼，是每一個樂手都奏得出來。如果指揮嫌樂手太慢，自己衝下去搶小提琴來拉，那一晚就毀了。"],["p","以弗所書第四章，正好有一句話在說這件事：「為要成全聖徒，各盡其職，建立基督的身體，」（4:12）這一課，我們用三個字走完這一章：行、職、新。先看坐下來的人怎樣開始走路，再看升天的基督怎樣把每一個人放上場，最後看新人穿在甚麼地方。"],["p","先用書信三問的第一問：以弗所人遇到甚麼？這是一封很可能在亞細亞眾教會之間傳閱的信。收信的是散在城裡的家庭教會：有猶太人，有外邦人；有上個月才把法術書抱去燒掉的年輕人，有在碼頭扛貨的奴僕，也有家裡有奴僕的主人。前三章保羅告訴他們，你們已經與基督一同活過來，「一同坐在天上」（2:6），隔斷的牆已經拆毀了。問題是：坐下來以後，這一群背景完全不同的人，星期一要怎樣一起過日子？"],["p","第四章一開口就回答：「我為主被囚的勸你們：既然蒙召，行事為人就當與蒙召的恩相稱。」（4:1）原文的第二個字是「所以」。前三章幾乎沒有一個命令，從這個「所以」開始，命令一個接一個。神先說了三章「你是誰」，才說「你要怎樣活」。"],["p","那麼第一步是甚麼？不是一個大異象，是四樣品格：「凡事謙虛、溫柔、忍耐，用愛心互相寬容，」（4:2）排在第一個的是謙虛。接著是：「用和平彼此聯絡，竭力保守聖靈所賜合而為一的心。」（4:3）合一是聖靈「所賜」的，我們不必造它，只要保守它。樂團開演以前，有一個時刻全場安靜，雙簧管吹出一個 A 音，所有的樂器都向它調音。保羅接著數了七個「一」：一個身體、一位聖靈、一個指望、一主、一信、一洗、一神。這就是教會的那一個 A 音。沒有它，各人拉得再好，也只是噪音。"],["d",["「竭力保守聖靈所賜合而為一的心」，是不是表示為了合一，有錯也不要講？","不是。4:3 要保守的合一不是空的，它的內容就是緊接著的七個「一」：一個身體、一位聖靈、一個指望、一主、一信、一洗、一神。同一章又說要長大，「不再作小孩子」，又說要「用愛心說誠實話」。所以合一不必犧牲真理，因為合一本身就建立在真理上。實際的分寸可以這樣想：核心不讓，邊緣容讓。七個「一」是核心；洗禮的方式、詩歌的風格、末世的細節，是可以彼此接納的事。若有人用「不要破壞合一」叫你對錯誤教導、權力濫用或傷害沉默，那保守的是表面的和氣，不是聖靈所賜的合一。詳見議題頁與全卷立場 ISS00_9。"]],["h","二、得勝的王分下戰利品"],["p","七個「一」數完，保羅換了一個字：「我們各人蒙恩，都是照基督所量給各人的恩賜。」（4:7）從「一」換成「各人」。樂譜只有一份，每一個譜架上的那一頁卻不一樣。坐在最後一排的人，你也在「各人」裡面；坐在第一排的人，你手上那一份是「量給」你的，量的人是基督。"],["p","恩賜從哪裡來？保羅引了詩篇第六十八篇：「所以經上說：他升上高天的時候，擄掠了仇敵，將各樣的恩賜賞給人。」（4:8）這是經文自己作的連結，可以講滿。古時候得勝的王回城，身後押著俘虜，登上高處，把戰利品分給百姓。保羅說，基督升天就是這樣一場凱旋。恩賜不是修來的屬靈等級，是得勝的王分下來的戰利品。"],["p","接著是一個括號：「既說升上，豈不是先降在地下嗎？」（4:9）這個「先」字，有些古卷沒有，意思不變；「降在地下」指道成肉身、降在陰間，還是聖靈降臨，各家看法不同，議題頁有整理。方向卻很清楚：先降，後升。賜恩賜的那一位，先走過最低的路。所以，拿恩賜往上爬的人，正好走了和賜恩者相反的方向。"],["p","主日散會後，有一位阿伯每一次都留下來疊椅子、捲麥克風線。他從沒上過台；按 4:7 的算法，他不是在幫忙，他手上拿的，也是得勝的王親手分給他的那一份。"],["d",["「先降在地下」是不是說耶穌死後下到陰間去傳福音？","這是本章最難的一句，各家看法不同。第一種讀法說，「地下」是指地，降在地下就是道成肉身，從天降到人間。第二種讀法說，是指基督死後降到死人之處，與彼得前書三章和使徒信經「降在陰間」連在一起看。第三種讀法說，降下的是升天後的基督藉聖靈降臨，把恩賜賜給教會。和合本的「先」字，有些古卷沒有，意思不變。不管採哪一種，重點只有一個：賜恩賜的那一位，先走過最低的路，然後升到諸天之上，要充滿萬有。恩賜是從一位彎下腰的主手上來的。議題頁有詳細整理。"]],["h","三、原文亮光：成全、關節、供應"],["p","現在走到這一章最多人熟悉、也最多人用錯的一節：「他所賜的，有使徒，有先知，有傳福音的，有牧師和教師，」（4:11）先看主詞，是「他」；動詞，是「賜」。職分是升天的基督送給教會的禮物，不是教會頒給某些人的頭銜。原文還有一個小細節：前三項各有自己的冠詞，最後兩項 τοὺς δὲ ποιμένας καὶ διδασκάλους（tous de poimenas kai didaskalous）共用一個冠詞，所以有人讀成五種，有人讀成四種，牧者就是教導的人。數目不是重點；今天還有沒有使徒和先知，全卷立場有整理，我只說一句：新約使徒是根基，根基只打一次。"],["p","第一個字在 4:12：πρὸς τὸν καταρτισμὸν τῶν ἁγίων（pros ton katartismon tōn hagiōn），「為要成全聖徒」。καταρτισμός（katartismos）在新約只出現這一次，它的動詞卻很常見：雅各和約翰在船上補網，用的就是這個字；古代醫生接回脫臼的骨頭，也用這個字。補網的人不是替網去抓魚，是讓網重新能用；接骨的醫生不替病人走路，是讓病人自己走。後面接著「各盡其職」，原文是「為了服事的工作」，做工的是聖徒。那五種職分，就是排練室裡的指揮。"],["p","很多教會剛好倒過來：牧師講道、探訪、修冷氣，會眾坐在台下評分。牧者累垮了，會眾也沒有長大。另一種倒置也要擋住：牧者只開會、只分派，不再親手教。補網的人自己也要坐下來補；講道、教導與牧養，正是裝備人的主要方式。"],["p","第二個字在 4:16：「全身都靠他聯絡得合式，百節各按各職，照著各體的功用彼此相助，便叫身體漸漸增長，在愛中建立自己。」（4:16）「百節」那一個字是 ἁφή（haphē），關節、接觸點；「供應」是 ἐπιχορηγία（epichorēgia）。這個字很有意思，它源自古代希臘城裡出資供應合唱團的人：誰負責讓整個合唱團唱得起來。保羅說，每一個關節都是這樣的供應者。第十一節那五種職分，到了第十六節，全都消失在「全身」裡面；他們是關節，不是頭。"],["p","第三個字在 4:15：ἀληθεύοντες δὲ ἐν ἀγάπῃ（alētheuontes de en agapē），「惟用愛心說誠實話」。只有真理沒有愛，是開刀不打麻藥；只有愛沒有真理，是只打麻藥不開刀。後半句是「連於元首基督」（4:15）：頭只有一個。沒有一位使徒、先知、牧師可以站在頭的位置上。"],["d",["今天還有使徒和先知嗎？如果有人自稱使徒，我該怎麼看？","各家看法不同。止息論認為，使徒與先知的職分在新約的根基立好以後就停止了；溫和延續論認為，開拓、差傳的使徒性功能，和造就、安慰、勸勉的先知性功能，今天仍然需要，但不具新約使徒的權威；新使徒改革運動則主張今天有掌權的使徒與先知，可以發布新的啟示，這是本講義要明確分辨的。本講義的立場是：新約使徒是根基，根基只打一次；功能今天仍然需要，但作這些事的人不需要、也不應該以使徒、先知為頭銜，更不可以據此要求別人絕對順服，或宣稱高過聖經的新啟示。檢驗很簡單：他是讓你更依賴他，還是讓你更能站起來服事？全卷立場見 ISS00_5。"]],["d",["如果我是一直在做事的同工，要怎樣把事交出去、讓別人上場？","可以分四步走。第一，列清單：寫下你固定在做的事，圈出一件別人也做得來的。第二，找人：不要在台上公開招募，親自去問一位還沒有上場的人，說出具體的事、具體的時間。第三，一起做：前兩次你做、他看；接著兩次他做、你在旁邊；之後他做，你不在場。這正是補網的意思：讓網重新能用，不是替網抓魚。第四，忍住不搶：他做得比你慢、比你粗，只要不傷人，就讓他做下去，事後具體地稱讚一件做得好的地方。各盡其職，一半是上場，一半是讓位；讓位的人沒有失去位置，是成了接骨的人。"]],["h","四、脫去、穿上，在日落以前"],["p","一個身體裡的關節，怎樣才會願意彼此供應？保羅說，要先換一個人。他先帶我們看一條往下的斜坡：心是虛妄的，就是空的；空的心昏昧，與神的生命隔絕，最後「良心既然喪盡，就放縱私慾，貪行種種的污穢。」（4:19）「良心喪盡」原文是失去了痛覺。"],["p","從谷底往上的路只有一句：「你們學了基督，卻不是這樣。」（4:20）原文是 ἐμάθετε τὸν Χριστόν（emathete ton Christon），學的不是一套道理，是一個人。然後是三個動作：脫去舊人，「又要將你們的心志改換一新，」（4:23）「並且穿上新人；這新人是照著神的形像造的，有真理的仁義和聖潔。」（4:24）這是換衣服的畫面。新人不是自己縫的，是神親手裁的；中間那一句心志的更新，卻是天天的事。"],["p","新人穿在哪裡？保羅沒有給大異象，只給幾件小事。第一件是一句誠實話：「所以，你們要棄絕謊言，各人與鄰舍說實話，因為我們是互相為肢體。」（4:25）理由不是會被抓到，是我們互相為肢體。"],["p","第二件是一個不過夜的怒氣：「生氣卻不要犯罪；不可含怒到日落，」（4:26）這是詩篇第四篇七十士譯本的原句。保羅沒有說基督徒不可以生氣，那會叫人把怒氣吞下去，表面平靜、裡面發炎；他也沒有說我這是義怒、所以罵人有理。他允許生氣，又畫了一條線：日落。意思是要處理，不要收藏；今天就開始把它帶到神面前，不是今天就一定要和對方談完。為甚麼這麼急？「也不可給魔鬼留地步。」（4:27）「地步」是 τόπον（topon），一塊地方。沒有處理的怒氣，是在家裡讓出一個房間；這不是說你被鬼附了，是說你讓了一塊地。過了日落會怎樣，4:31 寫得很清楚：怒氣沉下去變成苦毒，苦毒發酵變成惱恨，上了嘴就是嚷鬧、毀謗。"],["p","第三件是一次饒恕：「並要以恩慈相待，存憐憫的心，彼此饒恕，正如神在基督裡饒恕了你們一樣。」（4:32）「饒恕」是 χαριζόμενοι（charizomenoi），字根就是恩典。饒恕不是咬著牙擠出來的美德，是先領受過的恩典，從我手上再遞出去。這一節要讀得很小心，因為它常被拿來再傷一次受傷的人。饒恕是放下報復的權利，把審判交給神，可以先在神面前開始，也可能需要很長的時間；和好是關係的恢復，需要對方真實的悔改，也需要安全。若有人對一位在家裡受暴力的姊妹說，你要饒恕，所以今天就回家，那不是這一節，那是第二次傷害。先保護人的安全，饒恕可以在安全的地方慢慢發生。"],["d",["基督徒還有舊人嗎？我還是常常說謊、發脾氣，是不是根本沒有穿上新人？","這一段的動詞可以對照歌羅西書三章和羅馬書六章來讀：在基督裡，舊人已經和他同釘，新人已經穿上了；所以保羅叫我們活出已經脫去的樣子。新人是照著神的形像造的，不是你自己縫的，所以你的身分不會因為今天又說錯一句話就作廢。可是中間那一句「心志改換一新」是現在式，是天天的事；舊的習慣還會回來拉你。兩種講法都要擋住：一種是恐嚇，說你還有舊人的樣子，表示根本沒有得救；一種是推卸，說那是我的舊人做的，不是我。比較好的作法是：承認今天哪一件舊衣又穿回去了，認罪、道歉，再穿一次新人。議題頁有整理。"]],["h","五、幾個必須認得的偏差"],["p","第一個偏差，是把 4:11 講成頭銜與階梯：誰是使徒、誰是先知，名片上印出來，或說你現在是教師，將來可以升到使徒。主詞是「他」，動詞是「賜」，目的是 4:12；職分是禮物，不是升遷。"],["p","第二個偏差，是用「遮蓋」和「屬靈權柄」要求絕對順服、奉獻和忠誠，或用一句「先知性的話」替人決定嫁給誰、換甚麼工作、搬到哪裡。元首只有基督，4:14 警告的「人的詭計」，常常正是打著屬靈旗號的操控。任何「神對你說」，都要被聖經和群體察驗。"],["p","第三個偏差，是把 4:12 讀成牧師甚麼都要做、會眾來接受服事；或反過來，講成牧者只要開會分派，不必親手教。兩種倒置都叫身體長不大：一種把牧者燒盡，一種把牧養變成管理。"],["p","第四個偏差在 4:26 的兩頭：一頭說基督徒生氣就是罪，叫人把委屈吞下去；一頭說保羅都允許生氣，所以我在群組裡罵人有理。經文允許生氣，限定日落；要處理，不要收藏，也不可犯罪。"],["p","第五個偏差，是用 4:32 逼受害者和好：「你饒恕了就要回家」「為了孩子忍一忍」「你不饒恕，神也不饒恕你」。饒恕和和好是兩件事；遇到暴力，教會的第一件事是保護人的安全，不是勸人回去。"],["d",["有人說他對我有「先知性的話」，要我換工作或和某人結婚，我該怎麼辦？","先不要急著照做，也不必害怕。第一，任何「神對你說」都要被聖經和群體察驗；這使我們想起林前 14:29，先知講道，其餘的要慎思明辨。第二，問三個問題：這句話是叫我更靠近基督，還是更依賴這個人？有沒有要求我奉獻、保密或絕對順服？是建議，還是在替我作決定？第三，把這件事拿去和你的牧者、成熟的屬靈同伴，以及你的家人一起禱告商量。婚姻、工作、搬遷，是你自己要在神面前負責的決定，沒有人可以替你決定。若你曾經因為這樣的話受了傷，那不是你信心不夠；元首只有基督，你可以直接來到他面前。屬靈權柄的分寸，回指哥林多後書立場三。"]],["h","六、兩個華人處境的真實問題"],["p","第一個問題：頭銜與輩分。華人很重稱呼，見面先交換名片，看清楚對方是經理還是協理，才知道怎樣坐、怎樣敬酒。這一套很容易搬進教會：有人名片上印著「使徒」，長執會按輩分排座位，牧師變成老闆，同工變成員工。另一頭是「我只是來聽的」，把教會當成一家服務很好的餐廳，從不進廚房。4:11 到 4:16 同時擋住這兩頭：沒有一個人可以站在頭的位置上，也沒有一個人可以只坐在台下。在神的家裡，最要緊的問題不是你叫甚麼，是你這個關節有沒有在供應。"],["p","第二個問題：面子與家和萬事興。我們從小學會，不高興不要擺在臉上，家醜不可外揚；於是該說的誠實話吞下去，在家族群組裡轉發文章暗示對方。怒氣沒有在日落以前處理，過了幾年，變成一家人過年不同桌。等到真的出事，又有人勸受傷的那一位：「一家人不要計較，饒恕他吧。」這一章的路不是吞，也不是爆，是用愛心說誠實話：先說事實，再說感受，當面、溫和、具體；而受傷的人，可以先求安全、先求助，饒恕可以慢慢來，和好要看對方有沒有真實的悔改。"],["h","七、活出321——一個讓每一個人上場的團隊"],["p","經文說完了它自己的話，我們國度321空中團契才接上去。「建立屬神的體系」這一句，本文就是 4:12「建立基督的身體」；321「235」裡那個「5」，五重職份的團隊，名字從 4:11 來。可是 4:12 和 4:16 已經量過這個團隊一次：開拓的、說造就的話的、傳福音的、牧養的、教導的，是五種功能彼此配搭，不是五張名片，也不是五個坐在台上的人。沒有誰是誰的遮蓋，元首只有基督。五重職份的團隊，是一個讓每一個人上場的團隊。"],["p","耶穌是我的榜樣：賜下職分的那一位先降後升。門徒爭論誰為大的那一晚，他說：「我在你們中間如同服事人的。」（路 22:27）他把職分給人，是要人學他彎下腰，把別人接起來。"],["p","聖經是我的準則：次序不可倒過來。先讀七個「一」，先讀升天的基督把恩賜分給各人，先讀 4:12 和 4:16，然後才說 321。不是先畫好團契的組織圖，再拿 4:11 來印證。"],["p","聖靈是我的引導：「不要叫神的聖靈擔憂；你們原是受了他的印記，等候得贖的日子來到。」（4:30）印記已經蓋上，他擔憂，卻沒有離開。哪一句話要說、哪一個怒氣要先交給神、哪一段關係要先保持安全的距離，求聖靈給我們分辨的心。"],["p","讓耶穌作王：讓出兩個位子。台上的人讓出被依賴、被絕對順服的那個頭的位子；台下的人讓出「我只是來聽的」那個旁觀的座位。在饒恕上，讓耶穌作王，就是把報復的權利交還給他。我們常說「舊人有己的生命，變成新人無己的生命」，這兩個詞從 4:22–24 來，是對自己說的，不是拿去量別人的尺；「改變觀念就改變生命」，原文就是那一句「心志改換一新」。"],["p","讓耶穌得著一切的榮耀：戰利品是王分下來的，掌聲也要還給王。不管我們在團隊裡是哪一種功能，見證裡最大的名字，都不是自己。"],["p","建立屬神的體系：每一次檢討，不先問台上的人做得多好，先問四件事：這個月有幾個新的關節開始供應？有沒有人被裝備、被差出去？衝突有沒有在日落以前開始處理？說誠實話的人有沒有被保護？一個健康的體系，是每一個人都上場、元首只有基督的身體。"],["h","八、四種心，各坐在哪一個譜架前"],["p","驕傲型的心，喜歡坐第一排，甚至想站上指揮台。讀到 4:11，先找自己在哪一格；這一章對你說：你手上的是「量給」你的，賜恩的那一位先降下來過。你最大的成就，不是自己被聽見，是你身邊的人被接好了。"],["p","恐懼型的心，坐在最後一排，最怕被點名。怕做錯，怕被比較，乾脆說我甚麼都不會。可是 4:7 說的是「我們各人」，你也在裡面。指揮不會要三角鐵去拉小提琴，他只要你在對的那一拍敲下去。先接一件小事，就是上場。"],["p","羞恥型的心，覺得自己不配坐在這個樂團裡：過去太亂，名聲不好，像那個剛燒掉法術書的年輕人。請聽 4:24：新人是「照著神的形像造的」，不是你自己縫的。王分戰利品的時候，沒有先查各人的履歷。"],["p","受傷型的心，也許曾經被一位自稱有屬靈權柄的人控制，或被一句「先知性的話」改變了一生；也許被人催著饒恕、催著回家。這一章不是要你回到傷害裡。元首只有基督，你可以直接來到他面前。今天不必勉強原諒誰，也不必立刻和好；若你正處在危險裡，請先告訴一位信得過的人，讓人陪你找到安全和專業的幫助。"],["d",["對方傷我很深，而且到現在都沒有認錯，我也一定要饒恕、要和好嗎？","請先把兩件事分開。饒恕是放下報復的權利，把審判交給神；它可以先在你和神之間開始，不需要對方在場，也可能需要很長的時間，一次又一次地交出去。和好是關係的恢復，需要對方真實的悔改，也需要安全；主耶穌說：「若是你的弟兄得罪你，就勸戒他；他若懊悔，就饒恕他。」（路 17:3）所以你可以在神面前開始饒恕，卻暫時不和好、不見面。若對方仍在傷害你或孩子，第一件事是安全：告訴一位信得過的人，必要時尋求專業與法律的協助。饒恕的力量不從你的力氣來，是從後半句來：正如神在基督裡饒恕了你們一樣。這條路可以慢，可以有人陪。回指哥林多後書立場四。"]],["h","九、這一週，你可以做的幾件事"],["p","以下五件事，請在散會以前寫下時間、地點和名字。"],["p","第一，每天早上讀一次 4:4–6，慢慢數那七個「一」，然後對主說：今天我是你身體裡的一節，不是頭。"],["p","第二，把你在教會裡被服事的一件事，換成去服事：問你的組長「這個月有哪一件事我可以接手」；若你一直是做很多的人，反過來，交出一件事，親手教一個人做，他做得不如你，也不搶回來。"],["p","第三，找一位默默在供應、從來沒有人謝過的關節，這一週當面或寫字條，對他說一句具體的、造就人的好話。"],["p","第四，寫下一個你已經收著好幾個日落的怒氣，記下它的日期和起因，今晚在神面前說出來；若需要，再約一位信得過的屬靈同伴陪你一起處理。若對方曾經傷害你、並不安全，就不必去找他。"],["p","第五，照 4:28 從拿轉到給：這一週，把一段空檔或一筆錢分給缺乏的人，請一位手頭吃緊的同學吃飯，或替一位單親家長接一次孩子。"],["p","然後我們一起開口說出四句話。"],["p","我宣告：身體只有一個，元首只有基督；我是他身體裡的一節，不是頭。"],["p","我宣告：我手上的恩賜，是得勝的王量給我的；我要上場，也要讓別人上場。"],["p","我宣告：我已經學了基督，我要脫去舊人，穿上神所造的新人，說一句誠實話。"],["p","我宣告：神在基督裡饒恕了我；我的怒氣不留到日落，報復的權利交給神，安全也交給他保守。"],["d",["我想用愛心對家人說一句誠實話，可是一開口就吵起來，具體要怎麼說？","可以照這個次序。第一，選時機：不在氣頭上，不在飯桌上當著全家，也不在群組裡；約一個兩個人都有空的時候。第二，先說事實，不貼標籤：說「上星期三你在親戚面前說我沒用」，不說「你每次都看不起我」。第三，再說感受：「我聽了很難過，到現在還想著。」第四，說你希望的一件具體的事：「下次有意見，可以私下跟我說嗎？」第五，說完就停，聽他回應，不翻舊帳。若對方會用暴力回應，或你在那個家裡並不安全，這一題不必勉強，先和組長或牧者談，安全永遠排在第一。"]],["h","十、結語"],["p","我們回到那一場演出。曲子奏完，全場掌聲。指揮轉身鞠了一個躬，然後回過頭，請全團起立；他特別指向角落那一位，整晚只敲了三下三角鐵的樂手。"],["p","可是這一課的焦點，不在指揮多會帶，也不在我們團契有一個多好的團隊名稱。焦點在那一位先降後升的主：他降到十字架上，在那裡饒恕了我們；又升上高天，把戰利品分給每一個人，也把每一個人一節一節接回他的身體裡。你不必更佩服台上的人，台上的人也只是一個關節；你只要更認識這一位把恩賜交給你、也在基督裡饒恕了你的主。"],["p","我們一起低頭禱告。升上高天的主，謝謝你先降下來，把我們這些空手的人接回你的身體裡，又把恩賜量給我們每一個人。求你赦免我們爭位子，也赦免我們躲在最後一排。教我們用愛心說誠實話，在日落以前把怒氣帶到你面前。求你保守曾經被屬靈權柄傷害、正處在危險裡的人，讓他們知道你是元首，身邊有人陪他們找到安全。奉主耶穌基督的名禱告，阿們。"],["h","十一、小組討論分享：三個化"],["p","這一個鐘頭不比誰的恩賜大，是讓每一個人說出自己這個關節在哪裡，也說出這一週要接手、要交出、要在日落以前處理的那一件事；以下三個化，請組長照著次序帶。"],["m","帶領說明：本課主軸是行、職、新。席上可能有被「屬靈權柄」或「先知性的話」傷害過的人，也可能有正處在家庭傷害裡、被人催著饒恕的人，請先讀第二化的帶領提醒。"],["m","優先順序標示：★★★＝最優先，時間不足時每一化至少討論這一題；★★＝次優先；★＝時間充裕再討論。標【必做】的繁殖任務不可省略，可帶回家完成。"],["s","第一化｜內化成為觀念（約20分鐘）"],["m","目的：讓組員講得出三個觀念：職分是禮物，為要成全聖徒、各盡其職；每一個關節都在供應；饒恕和和好是兩件事。"],["n","1. ★ 你參加過樂團、球隊或詩班嗎？你在哪一個位置？帶你們的人做了甚麼，讓你
