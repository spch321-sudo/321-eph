><p>在羅馬的家庭裡，收養不是施捨，是一個法律行為。被收養的人可以叫那一家的主人父親，可以繼承產業，舊身分的債務一筆勾銷。保羅的讀者都懂這個畫面。神不是雇用我們作僕人，是把我們收進家裡作兒子；而且這件事「按著自己的意旨所喜悅的」——神不是勉強接納我們，是樂意。</p><p>這個名分是「藉著耶穌基督」得來的。我們成為兒子，是因為我們在那位真正的兒子裡面。所以 1:6 說：「這恩典是他在愛子裡所賜給我們的」（1:6）。天父愛那位愛子，而我們在愛子裡面，就被同樣的愛包圍。</p><p>整件事的目的寫在 1:6 的前半句：「使他榮耀的恩典得著稱讚」（1:6）。預定的目的不是讓人去分析誰在名單上，是讓被收養的人讚美。如果一個人讀完這兩節，開始焦慮自己是不是被選上的那一個，那是讀反了；保羅寫這兩節，是要被收養的孩子知道：你在這個家裡，不是因為你表現好，是因為父親願意。預定不是攔阻傳福音的理由——保羅越確信這件事，越放膽傳講，到了監牢還求人為他禱告，好「放膽開口講明福音的奧祕」（6:19）。</p>"},{"a":7,"z":8,"star":2,"grk":"<p lang=\"grc\">ἐν ᾧ ἔχομεν τὴν ἀπολύτρωσιν διὰ τοῦ αἵματος αὐτοῦ, τὴν ἄφεσιν τῶν παραπτωμάτων, κατὰ τὸ πλοῦτος τῆς χάριτος αὐτοῦ</p><p lang=\"grc\">ἧς ἐπερίσσευσεν εἰς ἡμᾶς ἐν πάσῃ σοφίᾳ καὶ φρονήσει</p>","lit":"<p>在他裡面，我們有救贖，藉著他的血，就是過犯的赦免，照著他恩典的豐富，</p><p>這恩典他使之滿溢地臨到我們，在一切智慧和明達之中，</p>","key":"<table><tr><th>原文</th><th>音譯</th><th>字面</th><th>在這裡</th></tr><tr><td>ἐν ᾧ ἔχομεν</td><td>en hō echomen</td><td>在他裡面我們有</td><td>現在式：救贖是現在擁有的</td></tr><tr><td>τὴν ἀπολύτρωσιν</td><td>tēn apolytrōsin</td><td>那救贖</td><td>付贖價把人買回來</td></tr><tr><td>διὰ τοῦ αἵματος αὐτοῦ</td><td>dia tou haimatos autou</td><td>藉著他的血</td><td>贖價是一條命</td></tr><tr><td>τὴν ἄφεσιν τῶν παραπτωμάτων</td><td>tēn aphesin tōn paraptōmatōn</td><td>過犯的赦免</td><td>同位語：救贖的第一個內容</td></tr><tr><td>ἐπερίσσευσεν</td><td>eperisseusen</td><td>使之滿溢</td><td>滿出來的恩典</td></tr></table>","gram":"<p>第二層從 ἐν ᾧ（en hō） 開始，焦點轉到子。ἔχομεν（echomen） 是現在式：父的揀選在創世以前，子的救贖卻是「我們現在有」的。ἀπολύτρωσις（apolytrōsis） 是付贖價把奴隸或戰俘買回來的字；διὰ τοῦ αἵματος αὐτοῦ（dia tou haimatos autou） 說出贖價。τὴν ἄφεσιν τῶν παραπτωμάτων（tēn aphesin tōn paraptōmatōn） 是同位語，解釋救贖的第一個內容：παράπτωμα（paraptōma） 原意是「失足、偏離」，第 2 章開頭的「死在過犯罪惡之中」用的就是同一個字。ἀπολύτρωσις（apolytrōsis） 在 1:14 會再出現一次，那時是「直等到……被贖」——救贖已經有了，也還在等候完成。</p><p>κατὰ τὸ πλοῦτος τῆς χάριτος αὐτοῦ（kata to ploutos tēs charitos autou）：赦免的尺度不是我們的罪有多少，是他的恩典有多富足。πλοῦτος（ploutos） 是本卷的愛用字（1:18；2:7；3:8、16）。1:8 ἐπερίσσευσεν（eperisseusen） 是「滿溢」，恩典不是剛好夠用，是滿出來。ἐν πάσῃ σοφίᾳ καὶ φρονήσει（en pasē sophia kai phronēsei） 可以連上句（神用智慧施恩），也可以連下句 1:9（神賜我們智慧，使我們知道奧祕）；和合本取前者。</p>","exp":"<p>「我們藉這愛子的血得蒙救贖，過犯得以赦免，乃是照他豐富的恩典」（1:7）。父的揀選在永恆裡，子的救贖卻在歷史裡，在一個有日期、有地點、有血的十字架上。</p><p>救贖是市場上的字。第一世紀的以弗所有奴隸市場，人可以被買賣，也可以被贖回。保羅說，我們原本被賣在罪底下，基督用自己的血把我們買回來。那不是一筆象徵性的手續費，是一條命。所以救贖的第一個內容是「過犯得以赦免」：舊帳不是被藏起來，是被付清了。</p><p>赦免的尺度是「照他豐富的恩典」，不是照我過犯的大小。很多人心裡有一本帳，算著自己犯的罪夠不夠被赦免；保羅說，你算錯了尺。不是你的罪有多重，是他的恩典有多富。</p><p>而且這恩典是「充充足足賞給我們的」（1:8），原文是滿溢出來。神施恩不吝嗇，也不糊塗——是「用諸般智慧聰明」。他赦免人，不是把公義擺在一邊，是在十字架上同時滿足了公義與慈愛。這就是智慧。</p><p>一個確知自己被贖回的人，活法會不一樣。他不必再向舊主人交代，也不必用一生去還一筆已經付清的債。第 4 章那些「脫去舊人」的命令，都建立在這一節上：你已經被買回來了，所以不必再照舊主人的規矩活。</p>"},{"a":9,"z":10,"star":3,"grk":"<p lang=\"grc\">γνωρίσας ἡμῖν τὸ μυστήριον τοῦ θελήματος αὐτοῦ, κατὰ τὴν εὐδοκίαν αὐτοῦ ἣν προέθετο ἐν αὐτῷ</p><p lang=\"grc\">εἰς οἰκονομίαν τοῦ πληρώματος τῶν καιρῶν, ἀνακεφαλαιώσασθαι τὰ πάντα ἐν τῷ Χριστῷ, τὰ ἐπὶ τοῖς οὐρανοῖς καὶ τὰ ἐπὶ τῆς γῆς· ἐν αὐτῷ,</p>","lit":"<p>使我們知道他旨意的奧祕，照著他的美意，就是他在他裡面預先立定的，</p><p>為了日期之滿足的安排：要把萬有在基督裡重新歸總在一個頭之下，天上的和地上的，都在他裡面；</p>","key":"<table><tr><th>原文</th><th>音譯</th><th>字面</th><th>在這裡</th></tr><tr><td>γνωρίσας</td><td>gnōrisas</td><td>使人知道</td><td>奧祕是被揭開的，不是被猜中的</td></tr><tr><td>τὸ μυστήριον</td><td>to mystērion</td><td>那奧祕</td><td>從前隱藏、如今顯明的計畫</td></tr><tr><td>εἰς οἰκονομίαν τοῦ πληρώματος τῶν καιρῶν</td><td>eis oikonomian tou plērōmatos tōn kairōn</td><td>為了日期滿足的安排</td><td>οἰκονομία：一家的管理</td></tr><tr><td>ἀνακεφαλαιώσασθαι</td><td>anakephalaiōsasthai</td><td>重新歸總在一個頭之下</td><td>字根 κεφαλή：頭</td></tr><tr><td>τὰ πάντα</td><td>ta panta</td><td>萬有</td><td>天上的和地上的</td></tr></table>","gram":"<p><strong>1:10 是本章的章題，也是全卷主線的第一站。</strong></p><p>1:9 的 γνωρίσας（gnōrisas） 是分詞，說明恩典怎樣「滿溢」：神把 τὸ μυστήριον τοῦ θελήματος αὐτοῦ（to mystērion tou thelēmatos autou） 讓我們知道。保羅的「奧祕」不是神祕宗教的入會祕密，而是從前隱藏、如今顯明的神的計畫（3:4--6 會說得更清楚：外邦人與猶太人同為一體）。1:10 先用 εἰς οἰκονομίαν τοῦ πληρώματος τῶν καιρῶν（eis oikonomian tou plērōmatos tōn kairōn） 說時間與方式：οἰκονομία（oikonomia） 是「一家的管理」，本卷關鍵字追蹤的一站，2:19 會變成「神家裡的人」；πληρώματος（plērōmatos） 是「滿足」，日期像一個容器，裝滿了，時候就到了。</p><p>然後是全句的核心不定詞 ἀνακεφαλαιώσασθαι（anakephalaiōsasthai）。字典形 ἀνακεφαλαιόομαι（anakephalaioomai），全本新約只出現兩次（另一次在羅 13:9，「包在……這一句話之內」）。字根有兩種說法：<strong>一說來自 κεφάλαιον（kephalaion）</strong>，「要點、總數」，像把一長串數字加總、把一篇講章撮要；<strong>一說直接連到 κεφαλή（kephalē）</strong>，「頭」，把萬有重新歸在一個頭底下。前者是字源學的嚴格說法，後者是以弗所書自己的上下文——1:22 κεφαλὴν ὑπὲρ πάντα τῇ ἐκκλησίᾳ（kephalēn hyper panta tē ekklēsia）、4:15「連於元首基督」都把「頭」與「萬有」連在一起。本講義的判斷：兩義不必二選一，保羅在本卷把「總歸」講成「歸在元首底下」。字首還有「再一次」的意味：萬有原本屬於他，後來散了，如今要重新歸回。</p>","exp":"<p>「要照所安排的，在日期滿足的時候，使天上、地上、一切所有的都在基督裡面同歸於一」（1:10）。如果要用一句話說以弗所書，就是這一句。神的計畫不只是救幾個人上天堂，是把整個破碎的宇宙重新歸在一位元首底下。</p><p>想像一間被打翻的書房：書散在地上，頁碼亂了，有的被撕開。神的計畫不是撿起幾本比較好的，把其餘的掃出去；是把每一本都重新排回架上，按著一個總綱歸位。「同歸於一」原文就是這個畫面：把萬有重新總歸在一個頭底下。</p><p>這個計畫是「奧祕」——人猜不到，要神「叫我們知道」（1:9）。人類歷史上有過很多「統一萬有」的夢：帝國、哲學、宗教、意識形態，都想把世界歸在自己底下，結果總是用刀劍與牆壁。神的方式不同：萬有是「在基督裡面」歸一，在一位被釘十字架、又復活的元首底下。這也是為甚麼第 2 章緊接著講那道被拆毀的牆——宇宙的合一，先在一間有猶太人也有外邦人的教會裡試行。</p><p>「在日期滿足的時候」提醒我們，神的計畫有時間表，不是我們催出來的，也不會被耽誤。「要照所安排的」原文是一家的管理：神是這個宇宙之家的主人，按著次序料理一切。</p><p>321 說「一個目的：建立屬神的體系」，這一節是那個體系最大的一幅圖。但次序不能倒：先是神要把萬有歸在基督底下，然後才是我們在家庭、教會、職場裡，讓那一位作頭。體系的中心不是一個組織，是一位元首。每一次我們在一件小事上讓基督作主，就是那個大計畫在地上先開了一扇窗。</p>"},{"a":11,"z":12,"star":1,"grk":"<p lang=\"grc\">ἐν ᾧ καὶ ἐκληρώθημεν προορισθέντες κατὰ πρόθεσιν τοῦ τὰ πάντα ἐνεργοῦντος κατὰ τὴν βουλὴν τοῦ θελήματος αὐτοῦ,</p><p lang=\"grc\">εἰς τὸ εἶναι ἡμᾶς εἰς ἔπαινον δόξης αὐτοῦ τοὺς προηλπικότας ἐν τῷ Χριστῷ·</p>","lit":"<p>在他裡面，我們也被分得了產業，是被預先定下的，照著那位按他旨意的計謀運行萬有者的定意，</p><p>要我們歸於他榮耀的稱讚，就是我們這些在基督裡先有了盼望的人；</p>","key":"<table><tr><th>原文</th><th>音譯</th><th>字面</th><th>在這裡</th></tr><tr><td>ἐκληρώθημεν</td><td>eklērōthēmen</td><td>我們被分得產業</td><td>被動：可譯「得了基業」或「成了他的基業」</td></tr><tr><td>προορισθέντες</td><td>prooristhentes</td><td>被預先定下的</td><td>1:5 預定的第二次</td></tr><tr><td>τοῦ τὰ πάντα ἐνεργοῦντος</td><td>tou ta panta energountos</td><td>那運行萬有的</td><td>現在式：一直在做工</td></tr><tr><td>τοὺς προηλπικότας</td><td>tous proēlpikotas</td><td>那些先有了盼望的</td><td>完成式：先前盼望，如今仍盼望</td></tr></table>","gram":"<p>ἐκληρώθημεν（eklērōthēmen） 是被動語態，字根 κλῆρος（klēros） 是「籤、分」，以色列人進迦南時拈鬮分地。被動語態有兩種讀法：<strong>一說</strong>「我們被分得了產業」（和合本「得了基業」）；<strong>一說</strong>「我們被揀為他的產業」——以色列在舊約被稱為神的產業，如今在基督裡的人也是。1:18「他在聖徒中得的基業」支持後一種讀法；cu89t 的註腳也提到這一節另有譯法。本講義兩義都保留：我們得著神，神也得著我們。</p><p>προορισθέντες（prooristhentes） 是預定第二次出現，緊接著說明預定者：τοῦ τὰ πάντα ἐνεργοῦντος κατὰ τὴν βουλὴν τοῦ θελήματος αὐτοῦ（tou ta panta energountos kata tēn boulēn tou thelēmatos autou）。1:12 τοὺς προηλπικότας（tous proēlpikotas） 是完成式，「那些先前就盼望、如今仍盼望的人」，很多學者認為指猶太信徒，他們先盼望彌賽亞；1:13 的 καὶ ὑμεῖς（kai hymeis） 再轉到外邦信徒。</p>","exp":"<p>「我們也在他裡面得了基業；這原是那位隨己意行、做萬事的，照著他旨意所預定的」（1:11）。以色列人進迦南，按支派拈鬮分地，每一家都有一塊。保羅說，在基督裡的人也分到了一份，而且這一份不是運氣抽中的，是神早就定好的。</p><p>預定這個字在這裡第二次出現，常讓人問：如果神「做萬事」，人還需要選擇嗎？經文自己的答案在下一段：「你們既聽見……也信了基督」（1:13）。神的定意與人的回應在保羅筆下並排放著，他沒有覺得需要調和，我們也不必用一邊吃掉另一邊。本講義的全卷立場見 ISS00_2：預定是要被收養的人安心，不是叫任何人放棄選擇。</p><p>1:12 是第二次副歌：「叫他的榮耀從我們這首先在基督裡有盼望的人可以得著稱讚」（1:12）。「首先」的人很可能是指猶太信徒——他們先有了彌賽亞的盼望。下一節轉成「你們」，外邦人也進來了。第 1 章就已經在預備第 2 章的那個畫面：先盼望的和後來的，同一份基業，同一個目的，同樣是為了神的榮耀。</p>"},{"a":13,"z":14,"star":3,"grk":"<p lang=\"grc\">ἐν ᾧ καὶ ὑμεῖς ἀκούσαντες τὸν λόγον τῆς ἀληθείας, τὸ εὐαγγέλιον τῆς σωτηρίας ὑμῶν, ἐν ᾧ καὶ πιστεύσαντες ἐσφραγίσθητε τῷ πνεύματι τῆς ἐπαγγελίας τῷ ἁγίῳ,</p><p lang=\"grc\">ὅ ἐστιν ἀρραβὼν τῆς κληρονομίας ἡμῶν, εἰς ἀπολύτρωσιν τῆς περιποιήσεως, εἰς ἔπαινον τῆς δόξης αὐτοῦ.</p>","lit":"<p>在他裡面，你們也是，聽了真理的道，就是你們得救的福音，在他裡面也信了，就被那應許的聖靈所印上了印記，</p><p>他是我們產業的訂金，直到那被買為產業者得贖，歸於他榮耀的稱讚。</p>","key":"<table><tr><th>原文</th><th>音譯</th><th>字面</th><th>在這裡</th></tr><tr><td>καὶ ὑμεῖς</td><td>kai hymeis</td><td>你們也是</td><td>從「我們」轉到「你們」：外邦人也在其中</td></tr><tr><td>ἀκούσαντες</td><td>akousantes</td><td>聽了以後</td><td>第一步：聽見真理的道</td></tr><tr><td>πιστεύσαντες</td><td>pisteusantes</td><td>信了以後</td><td>第二步：人的回應</td></tr><tr><td>ἐσφραγίσθητε</td><td>esphragisthēte</td><td>你們被蓋了印</td><td>被動：印是神蓋的</td></tr><tr><td>ἀρραβὼν</td><td>arrabōn</td><td>訂金</td><td>cu89t 註腳：原文是質</td></tr><tr><td>τῆς περιποιήσεως</td><td>tēs peripoiēseōs</td><td>那被買下的產業</td><td>cu89t 註腳：「神之民」原文是產業</td></tr></table>","gram":"<p>第三層從 ἐν ᾧ καὶ ὑμεῖς（en hō kai hymeis） 開始。兩個不定過去式分詞 ἀκούσαντες（akousantes）、πιστεύσαντες（pisteusantes） 排出次序：聽見，然後相信；主動詞 ἐσφραγίσθητε（esphragisthēte） 是被動語態——印是神蓋的，不是人自己貼的。τῷ πνεύματι τῆς ἐπαγγελίας τῷ ἁγίῳ（tō pneumati tēs epangelias tō hagiō） 的「應許」回到舊約與耶穌的話：聖靈是父所應許的。</p><p>1:14 有兩個 cu89t 註腳都要交代。<strong>ἀρραβὼν（arrabōn）</strong>：和合本譯「憑據」，註腳說原文是「質」。這是商業用語，買賣時先付的一部分價金，保證全額會付清；現代希臘文用同一個字指訂婚戒指。<strong>περιποιήσεως（peripoiēseōs）</strong>：和合本譯「神之民」，註腳說原文是「產業」，指「被買下、歸為己有的產業」。εἰς ἀπολύτρωσιν τῆς περιποιήσεως（eis apolytrōsin tēs peripoiēseōs） 直譯是「直到那產業得贖」——1:7 的救贖已經有了，1:14 的救贖還在前頭，這是「已經」與「尚未」並存。句子以第三次 εἰς ἔπαινον τῆς δόξης αὐτοῦ（eis epainon tēs doxēs autou） 收尾，兩百零二字的長句到這裡才停下來。</p>","exp":"<p>「你們既聽見真理的道，就是那叫你們得救的福音，也信了基督，既然信他，就受了所應許的聖靈為印記」（1:13）。長句寫到這裡，主詞從「我們」換成「你們」——在亞細亞那些從前拜亞底米的外邦人，也在這首歌裡。</p><p>這一節把揀選的另一面說了出來：人要聽見，也要相信。父在創世以前揀選，子在十字架上救贖，福音傳到以弗所，有人聽見了、信了。神的主權沒有讓傳福音變成多餘，反倒讓傳福音有了盼望。</p><p>信了以後，神蓋了一個印。古代的印有三個用途：表明擁有權（這是我的）、表明真實（這是真的）、保護（封好了，別人不可動）。聖靈就是神蓋在我們身上的印。這個印不是我們自己刻的，所以也不是我們心情不好就會掉的；第 4 章說：「你們原是受了他的印記，等候得贖的日子來到」（4:30）。保羅用同一個印記勸人「不要叫神的聖靈擔憂」（4:30），可見印記不是讓人放肆的保證，是一份要被珍惜的關係。</p><p>「這聖靈是我們得基業的憑據」（1:14）。和合本的註腳說，「憑據」原文是「質」，就是訂金。訂金不是全部，卻和全部是同一種貨幣；付了訂金的買主，一定會回來付清。聖靈在我們裡面的安慰、引導、更新，是將來那份基業的頭一筆；保羅在另一封信也說神「賜聖靈在我們心裡作憑據」（林後 1:22）。今天嚐到的，是將來要完全得著的樣品。</p><p>「直等到神之民被贖」（1:14），註腳說「神之民」原文是「產業」。我們得基業，我們自己也是神的基業；神付了訂金，因為他一定要把他的產業領回去。得救的人會不會失去聖靈，是一個常被問到的題目，各家理解不同；這兩節給的方向是：印是神蓋的，訂金是神付的，盼望建立在付錢的那一位身上。321 說「聖靈是我的引導」，在以弗所書，祂首先是一個印、一筆訂金——引導我的那一位，也是擔保我的那一位。</p>"},{"a":15,"z":17,"star":1,"grk":"<p lang=\"grc\">Διὰ τοῦτο κἀγώ, ἀκούσας τὴν καθʼ ὑμᾶς πίστιν ἐν τῷ κυρίῳ Ἰησοῦ καὶ τὴν ἀγάπην τὴν εἰς πάντας τοὺς ἁγίους,</p><p lang=\"grc\">οὐ παύομαι εὐχαριστῶν ὑπὲρ ὑμῶν μνείαν ποιούμενος ἐπὶ τῶν προσευχῶν μου,</p><p lang=\"grc\">ἵνα ὁ θεὸς τοῦ κυρίου ἡμῶν Ἰησοῦ Χριστοῦ, ὁ πατὴρ τῆς δόξης, δώῃ ὑμῖν πνεῦμα σοφίας καὶ ἀποκαλύψεως ἐν ἐπιγνώσει αὐτοῦ,</p>","lit":"<p>因此，我也，既聽見你們中間在主耶穌裡的信，和向著眾聖徒的愛，</p><p>不停止為你們感謝，在我的禱告中常提起你們，</p><p>使我們主耶穌基督的神、榮耀的父，把智慧和啟示的靈賜給你們，在對他的真認識之中，</p>","key":"<table><tr><th>原文</th><th>音譯</th><th>字面</th><th>在這裡</th></tr><tr><td>Διὰ τοῦτο κἀγώ</td><td>Dia touto kagō</td><td>因此，我也</td><td>第二個長句的起頭</td></tr><tr><td>οὐ παύομαι εὐχαριστῶν</td><td>ou pauomai eucharistōn</td><td>不停止感謝</td><td>現在式：在監中也沒有停</td></tr><tr><td>ὁ πατὴρ τῆς δόξης</td><td>ho patēr tēs doxēs</td><td>榮耀的父</td><td>全本新約只有這裡這樣稱呼</td></tr><tr><td>πνεῦμα σοφίας καὶ ἀποκαλύψεως</td><td>pneuma sophias kai apokalypseōs</td><td>智慧和啟示的靈</td><td>大寫小寫之爭</td></tr><tr><td>ἐν ἐπιγνώσει αὐτοῦ</td><td>en epignōsei autou</td><td>在對他的真認識裡</td><td>ἐπί 加強的「認識」</td></tr></table>","gram":"<p><strong>1:15--23 又是一句話，一百六十八個字。</strong>頌讚之後是禱告，Διὰ τοῦτο（Dia touto） 把兩者接起來：因為神已經做了 1:3--14 的一切，所以保羅禱告。主幹是 οὐ παύομαι εὐχαριστῶν（ou pauomai eucharistōn）……μνείαν ποιούμενος（mneian poioumenos），後接 ἵνα（hina） 帶出禱告內容（1:17），再分三個「何等」（1:18--19 的 τίς（tis）、τίς（tis）、τί（ti）），最後從 1:20 起滑進一段基督論，收在 1:23 的 τὸ πλήρωμα（to plērōma）。</p><p>1:15 的 τὴν ἀγάπην（tēn agapēn） 在 SBLGNT 有，WH 沒有（「聽見你們……向眾聖徒的」）；和合本「親愛眾聖徒」跟 SBLGNT。1:17 的 δώῃ（dōē） 是祈願式，表達心願。πνεῦμα σοφίας καὶ ἀποκαλύψεως（pneuma sophias kai apokalypseōs） 沒有冠詞，可指聖靈（賜智慧啟示的靈，和合本的理解），也可指人裡面的靈被賜予智慧與啟示的能力；兩說其實相連——人的靈得智慧，是因為聖靈工作。ἐπίγνωσις（epignōsis） 是加強的認識，不是多知道一些資料，是更認識一個人。</p>","exp":"<p>「因此，我既聽見你們信從主耶穌，親愛眾聖徒」（1:15），「就為你們不住地感謝神」（1:16）。保羅聽見的是兩件事：向上的信，向旁邊的愛。一間教會健不健康，看這兩條線就知道。</p><p>值得注意的是，保羅坐在監牢裡，卻「不住地」感謝。他沒有因為自己的鎖鍊停止為別人禱告。感謝在前，祈求在後；他先看見神在別人身上已經做的，才求神再做更多。</p><p>他求甚麼？「將那賜人智慧和啟示的靈賞給你們，使你們真知道他」（1:17）。這些人已經信了、已經有愛了，保羅求的不是更多的活動或恩賜，是更深地認識神。「啟示」在這裡不是新的經文、新的教義，是聖靈把已經啟示的真理照進心裡，讓人看見。今天還有沒有新的啟示，是另一個議題；這一節求的是認識「他」，對象是神自己。</p><p>321 的改變觀念八大步驟，從資訊走到啟示：「聽見真理的道」（1:13）是資訊，智慧和啟示的靈是讓資訊變成看見。讀了很多、聽了很多，卻仍然看不見，這一節就是那個時候的禱告。</p>"},{"a":18,"z":19,"star":3,"grk":"<p lang=\"grc\">πεφωτισμένους τοὺς ὀφθαλμοὺς τῆς καρδίας ὑμῶν εἰς τὸ εἰδέναι ὑμᾶς τίς ἐστιν ἡ ἐλπὶς τῆς κλήσεως αὐτοῦ, τίς ὁ πλοῦτος τῆς δόξης τῆς κληρονομίας αὐτοῦ ἐν τοῖς ἁγίοις,</p><p lang=\"grc\">καὶ τί τὸ ὑπερβάλλον μέγεθος τῆς δυνάμεως αὐτοῦ εἰς ἡμᾶς τοὺς πιστεύοντας κατὰ τὴν ἐνέργειαν τοῦ κράτους τῆς ἰσχύος αὐτοῦ</p>","lit":"<p>你們心的眼睛是已經被照亮的，好使你們知道：他呼召的盼望是甚麼，他在聖徒中之產業的榮耀的豐富是甚麼，</p><p>以及他向我們這些相信的人的能力，那超越的浩大是甚麼，照著他力量之權能的運行，</p>","key":"<table><tr><th>原文</th><th>音譯</th><th>字面</th><th>在這裡</th></tr><tr><td>πεφωτισμένους</td><td>pephōtismenous</td><td>已被照亮的</td><td>完成式被動分詞</td></tr><tr><td>τοὺς ὀφθαλμοὺς τῆς καρδίας</td><td>tous ophthalmous tēs kardias</td><td>心的眼睛</td><td>心有眼睛</td></tr><tr><td>ἡ ἐλπὶς τῆς κλήσεως αὐτοῦ</td><td>hē elpis tēs klēseōs autou</td><td>他呼召的盼望</td><td>第一個「何等」：向前看</td></tr><tr><td>τῆς κληρονομίας αὐτοῦ ἐν τοῖς ἁγίοις</td><td>tēs klēronomias autou en tois hagiois</td><td>他在聖徒中的產業</td><td>第二個「何等」：神得著的</td></tr><tr><td>τὸ ὑπερβάλλον μέγεθος</td><td>to hyperballon megethos</td><td>那超越的浩大</td><td>第三個「何等」：向我們的能力</td></tr><tr><td>δυνάμεως、ἐνέργειαν、κράτους、ἰσχύος</td><td>dynameōs, energeian, kratous, ischyos</td><td>能力、運行、權能、力量</td><td>一節四個能力字</td></tr></table>","gram":"<p>πεφωτισμένους τοὺς ὀφθαλμοὺς τῆς καρδίας（pephōtismenous tous ophthalmous tēs kardias） 是完成式被動分詞，文法上有點鬆：可以視為 1:17 禱告的延續（和合本「並且照明」），也可以讀成狀態——「你們心的眼睛既已被照亮」，保羅是在已被照亮的基礎上求更多看見。καρδία（kardia） 在聖經裡不只是情感，是人思想、意志、抉擇的中心；心有眼睛，就是整個人被開了眼。</p><p>εἰς τὸ εἰδέναι（eis to eidenai） 帶出三個疑問詞：τίς ἐστιν ἡ ἐλπὶς（tis estin hē elpis）、τίς ὁ πλοῦτος（tis ho ploutos）、τί τὸ ὑπερβάλλον μέγεθος（ti to hyperballon megethos）——三個「何等」。1:19 一節堆了四個能力字：δυνάμεως（能力）、ἐνέργειαν（運行，英文 energy 的字根）、κράτους（權能、掌控力）、ἰσχύος（力量、強壯）。這不是重複，是保羅找不到夠大的字，只好疊起來。其中 κράτους（kratous） 與 ἰσχύος（ischyos） 會在 6:10 再出現：「倚賴他的大能大力」——第 1 章看見的能力，就是第 6 章站立得住的能力。</p>","exp":"<p>「並且照明你們心中的眼睛，使你們知道他的恩召有何等指望，他在聖徒中得的基業有何等豐盛的榮耀」（1:18）。保羅不為他們求更多知識——他們已經聽見真理的道了——他求的是心裡的眼睛被打開。</p><p>心有眼睛。人可以用頭腦讀懂一段經文，心卻仍然是瞎的；也可以讀得不多，心卻看得清楚。以弗所城滿街都是可以用肉眼看的神：亞底米的神像、銀匠打造的小神龕。保羅求的是另一種看見：看見那位肉眼看不見、卻真正掌權的。321 說「用心靠聖靈，不要用腦靠自己」，這一節是它最美的禱告：聖靈住在心裡，所以祂照亮的是心的眼睛。</p><p>心的眼睛打開了，看見甚麼？三個「何等」。第一，「他的恩召有何等指望」——向前看，神呼召我們的終點是甚麼。第二，「他在聖徒中得的基業有何等豐盛的榮耀」——這一句很驚人：不是我們得的基業，是神在聖徒身上得的基業。神把一群蒙救贖的人看成他最豐富的產業。你也許覺得自己不值甚麼，神卻把你算在他的珍寶裡。</p><p>第三，「他向我們這信的人所顯的能力是何等浩大」（1:19）。保羅一口氣用了四個能力字，好像一個人站在大海前，用盡了形容詞。很多信徒知道神有能力，卻以為那是給別人的、給大人物的；保羅說，這能力是「向我們這信的人」。同樣的字，在 6:10 變成命令：「你們要靠著主，倚賴他的大能大力作剛強的人」（6:10）。第 6 章能站得住，是因為第 1 章先看見了；先坐，才會行，會行，才站得住。</p>"},{"a":20,"z":23,"star":2,"grk":"<p lang=\"grc\">ἣν ἐνήργηκεν ἐν τῷ Χριστῷ ἐγείρας αὐτὸν ἐκ νεκρῶν, καὶ καθίσας ἐν δεξιᾷ αὐτοῦ ἐν τοῖς ἐπουρανίοις</p><p lang=\"grc\">ὑπεράνω πάσης ἀρχῆς καὶ ἐξουσίας καὶ δυνάμεως καὶ κυριότητος καὶ παντὸς ὀνόματος ὀνομαζομένου οὐ μόνον ἐν τῷ αἰῶνι τούτῳ ἀλλὰ καὶ ἐν τῷ μέλλοντι·</p><p lang=\"grc\">καὶ πάντα ὑπέταξεν ὑπὸ τοὺς πόδας αὐτοῦ, καὶ αὐτὸν ἔδωκεν κεφαλὴν ὑπὲρ πάντα τῇ ἐκκλησίᾳ,</p><p lang=\"grc\">ἥτις ἐστὶν τὸ σῶμα αὐτοῦ, τὸ πλήρωμα τοῦ τὰ πάντα ἐν πᾶσιν πληρουμένου.</p>","lit":"<p>就是他已經在基督身上運行的，叫他從死人中起來，並使他坐在他的右邊，在天上的領域，</p><p>遠在一切執政、掌權、能力、主治之上，也在一切被稱呼的名之上，不只在這個世代，也在那將要來的世代；</p><p>又把萬有服在他的腳下，並把他賜給教會，作萬有之上的頭，</p><p>教會就是他的身體，是那在萬有中充滿萬有者的豐滿。</p>","key":"<table><tr><th>原文</th><th>音譯</th><th>字面</th><th>在這裡</th></tr><tr><td>ἐγείρας αὐτὸν ἐκ νεκρῶν</td><td>egeiras auton ek nekrōn</td><td>叫他從死人中起來</td><td>能力的第一個證據：復活</td></tr><tr><td>καθίσας ἐν δεξιᾷ αὐτοῦ</td><td>kathisas en dexia autou</td><td>使他坐在他的右邊</td><td>全卷「坐」的源頭</td></tr><tr><td>ὑπεράνω</td><td>hyperanō</td><td>遠在……之上</td><td>不只是高一點，是遠遠在上</td></tr><tr><td>κεφαλὴν ὑπὲρ πάντα τῇ ἐκκλησίᾳ</td><td>kephalēn hyper panta tē ekklēsia</td><td>為教會作萬有之上的頭</td><td>回到 1:10 的「同歸於一」</td></tr><tr><td>τὸ πλήρωμα</td><td>to plērōma</td><td>那豐滿</td><td>教會是基督的滿</td></tr></table>","gram":"<p>1:20 的 ἐνήργηκεν（enērgēken） 是完成式，與 1:19 的 ἐνέργειαν（energeian） 同字根：運行在我們身上的，就是運行在基督身上的同一個能力。兩個分詞 ἐγείρας（egeiras）、καθίσας（kathisas） 說出兩個證據：復活與坐上右邊。καθίσας（kathisas） 是全卷「坐」的源頭——2:6 συνεκάθισεν（synekathisen） 我們與他同坐，4:1 περιπατῆσαι（peripatēsai） 才開始行，6:13 στῆναι（stēnai） 才站得住。1:21 列出四個勢力名詞 ἀρχῆς（archēs）、ἐξουσίας（exousias）、δυνάμεως（dynameōs）、κυριότητος（kyriotētos），再加上「一切被稱呼的名」，然後是 ἐν τῷ αἰῶνι τούτῳ（en tō aiōni toutō） 與 ἐν τῷ μέλλοντι（en tō mellonti）：兩個世代都在他腳下。</p><p>1:22 的 πάντα ὑπέταξεν ὑπὸ τοὺς πόδας αὐτοῦ（panta hypetaxen hypo tous podas autou） 與 καθίσας ἐν δεξιᾷ（kathisas en dexia） 學者觀察到與舊約的對應：這使我們想起「你坐在我的右邊，等我使你仇敵作你的腳凳」（詩 110:1），也使我們想起詩 8:6「都服在他的腳下」的人子詩；保羅沒有明說引用。κεφαλὴν ὑπὲρ πάντα τῇ ἐκκλησίᾳ（kephalēn hyper panta tē ekklēsia） 的與格 τῇ ἐκκλησίᾳ（tē ekklēsia） 是「為了教會」：萬有之首，被「賜給」教會。1:23 τὸ πλήρωμα τοῦ τὰ πάντα ἐν πᾶσιν πληρουμένου（to plērōma tou ta panta en pasin plēroumenou） 是本卷最難的一句：πληρουμένου（plēroumenou） 可作關身（那充滿萬有者）或被動（那被充滿者）；πλήρωμα（plērōma） 可指「充滿者」（教會使基督完全）或「被充滿者」（教會被基督充滿）。和合本與多數註釋取後者：教會是被基督充滿的；本講義從之。</p>","exp":"<p>保羅禱告求他們看見神的能力，接著就指給他們看：「使他從死裡復活，叫他在天上坐在自己的右邊」（1:20）。神能力最大的證明不是創造，不是神蹟，是一個死人從墳墓裡起來，坐上寶座。</p><p>坐，表示工作完成了。祭司在聖殿裡從來不坐，因為獻祭永遠做不完；基督坐下了，因為救贖已經成就。第 2 章會說，我們也與他「一同坐在天上」（2:6）。以弗所書的「坐」不是消極不做事，是從一個已經得勝的位置出發。</p><p>他坐的位置「遠超過一切執政的、掌權的、有能的、主治的，和一切有名的；不但是今世的，連來世的也都超過了」（1:21）。以弗所人活在一個充滿名字的城市：亞底米、各樣的神明、法術書上的咒語。使徒行傳講義第 19 章講過，信主的人「也有許多人把書拿來，堆積在眾人面前焚燒」（徒 19:19）。他們燒書，不是因為害怕，是因為看見了：基督坐的位置在一切名字之上，不必再求它們、也不必再怕它們。屬靈爭戰的勝負，在第 1 章已經定了；第 6 章的「站」，是從這個位置站。</p><p>然後是全章的頂點：「又將萬有服在他的腳下，使他為教會作萬有之首」（1:22）。萬有之首，被賜給了教會。1:10 的「同歸於一」在這裡有了地址：萬有要歸在基督這個頭底下，而教會是今天已經歸在他底下的那一群人。「教會是他的身體，是那充滿萬有者所充滿的」（1:23）。教會不是一個俱樂部，是被基督充滿的身體。</p><p>321 說「讓耶穌作王」，這一節是全卷最直接的出處。可是要小心次序：基督是頭，教會是身體；頭只有一個。4:15 會說「連於元首基督」（4:15）。教會裡沒有一個人可以佔那個位子。讀完第 1 章，該問的不是我在教會裡坐甚麼位子，是：我是不是確知自己已經和這位元首連在一起，並且讓他作我的頭。</p>"}],"2":[{"a":1,"z":2,"star":2,"grk":"<p lang=\"grc\">Καὶ ὑμᾶς ὄντας νεκροὺς τοῖς παραπτώμασιν καὶ ταῖς ἁμαρτίαις ὑμῶν</p><p lang=\"grc\">ἐν αἷς ποτε περιεπατήσατε κατὰ τὸν αἰῶνα τοῦ κόσμου τούτου, κατὰ τὸν ἄρχοντα τῆς ἐξουσίας τοῦ ἀέρος, τοῦ πνεύματος τοῦ νῦν ἐνεργοῦντος ἐν τοῖς υἱοῖς τῆς ἀπειθείας·</p>","lit":"<p>而你們，是在你們的過犯和罪中死了的，</p><p>你們從前在其中行走，照著這世界的世代，照著空中權勢的首領，就是那如今在悖逆之子們裡面運行的靈；</p>","key":"<table><tr><th>原文</th><th>音譯</th><th>字面</th><th>在這裡</th></tr><tr><td>νεκροὺς τοῖς παραπτώμασιν</td><td>nekrous tois paraptōmasin</td><td>在過犯中是死的</td><td>不是病重，是死了</td></tr><tr><td>ἐν αἷς ποτε περιεπατήσατε</td><td>en hais pote periepatēsate</td><td>你們從前在其中行走</td><td>περιπατέω 全卷第一次：在死亡裡行</td></tr><tr><td>κατὰ τὸν αἰῶνα τοῦ κόσμου τούτου</td><td>kata ton aiōna tou kosmou toutou</td><td>照著這世界的世代</td><td>和合本譯「今世的風俗」</td></tr><tr><td>τὸν ἄρχοντα τῆς ἐξουσίας τοῦ ἀέρος</td><td>ton archonta tēs exousias tou aeros</td><td>空中權勢的首領</td><td>真實的，卻已被勝過（1:21）</td></tr><tr><td>τοῦ νῦν ἐνεργοῦντος</td><td>tou nyn energountos</td><td>現今正在運行的</td><td>現在分詞：仍在作工</td></tr><tr><td>τοῖς υἱοῖς τῆς ἀπειθείας</td><td>tois huiois tēs apeitheias</td><td>悖逆的兒子們</td><td>希伯來式說法：以悖逆為特徵的人</td></tr></table>","gram":"<p><strong>2:1 是一個等了四節才等到動詞的句子。</strong>Καὶ ὑμᾶς（Kai hymas） 起頭，「你們」是受格，是某個動作的對象；可是這個動作一直沒有出現，保羅先描寫了三節「從前」，到 2:5 才說出 συνεζωοποίησεν（synezōopoiēsen）。和合本為了讓中文讀得通，把 2:5 的「他叫你們活過來」提到 2:1 句末。原文的懸宕本身就是信息：死人只能被描寫，不能自己開口。</p><p>ὄντας νεκροὺς（ontas nekrous） 是現在分詞，「是死的」，不是「快要死了」。τοῖς παραπτώμασιν καὶ ταῖς ἁμαρτίαις（tois paraptōmasin kai tais hamartiais） 是兩個近義詞，前者是失足、越線，後者是射不中靶心；兩個與格標出死亡的範圍與原因。2:2 的 ποτε（pote） 是全卷「從前」的第一聲，περιεπατήσατε（periepatēsate） 是 περιπατέω（peripateō） 在全卷第一次出現——第一次「行」，竟然是在死亡裡行。到 2:10 περιπατήσωμεν（peripatēsōmen） 才行在善行裡，4:1 περιπατῆσαι（peripatēsai） 才變成命令。</p><blockquote><p>兩個 κατὰ（kata） 平行：κατὰ τὸν αἰῶνα τοῦ κόσμου τούτου（kata ton aiōna tou kosmou toutou）、κατὰ τὸν ἄρχοντα τῆς ἐξουσίας τοῦ ἀέρος（kata ton archonta tēs exousias tou aeros）——一個是時代的潮流，一個是潮流背後的首領。接著 τοῦ πνεύματος（tou pneumatos） 是屬格，文法上接不順：有人讀作與 τὸν ἄρχοντα（ton archonta） 同位，「那首領就是那個靈」（和合本「就是……的邪靈」）；有人讀作首領所轄的「那股靈、那種氛圍」。兩讀都說：悖逆不只是個人的軟弱，背後有一個 τοῦ νῦν ἐνεργοῦντος（tou nyn energountos） 的勢力。ἐνεργοῦντος（energountos） 與 1:19–20 神「運行」大能是同一個字根：兩種運行，在同一個世界裡較量。</p></blockquote>","exp":"<p>第 1 章的末了，基督坐在天上，「遠超過一切執政的、掌權的、有能的、主治的」（1:21）。第 2 章一開口，鏡頭轉到地上最低的地方：「你們死在過犯罪惡之中」（2:1）。這是全卷地勢圖的谷底。保羅沒有說你們病了、累了、走偏了，他說你們死了。病人還能求醫，死人連求救都不會。這一句先把人所有自救的盼望關上，2:4 那兩個字才有分量。</p><p>死人卻在「行」：「那時，你們在其中行事為人，隨從今世的風俗，順服空中掌權者的首領」（2:2）。死不是不動，是在錯的方向上照常生活——上班、吃飯、拜拜、追求，一切照舊，只是方向由別人決定。古代教父把 2:2–3 讀成三個主人：世界的風俗、空中掌權者、肉體的私慾。有己的人以為自己作主，其實一直在「隨從」和「順服」。</p><p>「空中掌權者的首領」是誰？經文說他「現今在悖逆之子心中運行」（2:2），不是比喻（立場四）。但同一封信已經說了，基督遠超過一切掌權的。<strong>這個首領是真實的，卻不是最高的。</strong>所以讀這一節，既不輕忽，也不迷信：不必怕鬼月、風水、廟宇，也不把每一個病痛、每一場衝突都講成鬼的問題；身心的困擾要就醫，也要禱告。在基督裡的人，已經不在這位首領的手下了。</p><p>以弗所城本身就是這兩節的註腳：亞底米神廟、法術書、護身符，到處都是「空中掌權者」的生意。今天每一座有廟、有算命攤的華人城市，都是這樣的以弗所。2:1–2 不是在罵人，是在描述一個人人都住過的地方。</p>"},{"a":3,"z":3,"star":1,"grk":"<p lang=\"grc\">ἐν οἷς καὶ ἡμεῖς πάντες ἀνεστράφημέν ποτε ἐν ταῖς ἐπιθυμίαις τῆς σαρκὸς ἡμῶν, ποιοῦντες τὰ θελήματα τῆς σαρκὸς καὶ τῶν διανοιῶν, καὶ ἤμεθα τέκνα φύσει ὀργῆς ὡς καὶ οἱ λοιποί·</p>","lit":"<p>我們眾人從前也在他們中間生活，在我們肉體的私慾裡，行肉體和心思的種種意願，並且我們本性上是忿怒的兒女，如同其餘的人一樣；</p>","key":"<table><tr><th>原文</th><th>音譯</th><th>字面</th><th>在這裡</th></tr><tr><td>καὶ ἡμεῖς πάντες</td><td>kai hēmeis pantes</td><td>連我們眾人</td><td>從「你們」換成「我們」</td></tr><tr><td>ἀνεστράφημέν ποτε</td><td>anestraphēmen pote</td><td>我們從前生活</td><td>又一個「從前」</td></tr><tr><td>τὰ θελήματα τῆς σαρκὸς</td><td>ta thelēmata tēs sarkos</td><td>肉體的種種意願</td><td>複數：一個接一個的想要</td></tr><tr><td>τῶν διανοιῶν</td><td>tōn dianoiōn</td><td>心思的</td><td>罪不只在身體，也在思想</td></tr><tr><td>τέκνα φύσει ὀργῆς</td><td>tekna physei orgēs</td><td>本性上是忿怒的兒女</td><td>φύσει 夾在中間</td></tr><tr><td>ὡς καὶ οἱ λοιποί</td><td>hōs kai hoi loipoi</td><td>和其餘的人一樣</td><td>沒有人例外</td></tr></table>","gram":"<p><strong>2:3 的主詞從「你們」換成了「我們」。</strong>2:1–2 對外邦信徒說「你們」，2:3 一個 καὶ ἡμεῖς πάντες（kai hēmeis pantes） 把保羅自己也放進去：一個受過割禮、熱心律法的猶太人，承認自己也曾在同一條路上。ἐν οἷς（en hois） 回指 2:2 的「悖逆之子」——我們也都在他們中間。</p><p>ἀνεστράφημέν（anestraphēmen） 是另一個「生活」的字，與 περιεπατήσατε（periepatēsate） 平行。ποιοῦντες τὰ θελήματα τῆς σαρκὸς καὶ τῶν διανοιῶν（poiountes ta thelēmata tēs sarkos kai tōn dianoiōn）：θελήματα（thelēmata） 是複數，一個接一個的「想要」；καὶ τῶν διανοιῶν（kai tōn dianoiōn） 說明肉體不只是身體，連思想、計謀都算在內。</p><blockquote><p>τέκνα φύσει ὀργῆς（tekna physei orgēs） 把 φύσει（physei） 夾在「兒女」與「忿怒」中間。讀法有二：一說指生來的本性（奧古斯丁與宗教改革傳統，原罪的經文根據之一）；一說指人實際上、照本來的樣子活出來的光景。本講義的判斷：兩讀不必對立——保羅的重點落在句末 ὡς καὶ οἱ λοιποί（hōs kai hoi loipoi）：猶太人和外邦人一樣。ὀργῆς（orgēs） 是神的忿怒，5:6 再出現。原罪的教義爭論，見本章議題頁。</p></blockquote>","exp":"<p>保羅很可以只說「你們外邦人從前多壞」。他沒有。「我們從前也都在他們中間」（2:3）。這一句把高牆在第 2 章還沒有被提起以前，就先在罪的平地上推倒了：猶太人和外邦人，在死亡裡是一樣的。</p><p>「放縱肉體的私慾，隨著肉體和心中所喜好的去行」（2:3）。「心中所喜好的」提醒我們，罪不只在夜店，也在書房；不只是放縱的身體，也有驕傲的頭腦。一個人可以很有教養、很守規矩，仍然是照著自己所喜好的去行——那正是有己。</p><p>「本為可怒之子，和別人一樣」（2:3）。這一句很重，卻是一份平等的診斷書：沒有人高人一等。這份平等是 2:14 的伏筆。牆要倒，先要承認牆兩邊的人都需要同一位救主。讀到這裡的人，不是更會指著別人說「他們是可怒之子」，而是低頭說「我也是」。</p>"},{"a":4,"z":6,"star":3,"grk":"<p lang=\"grc\">ὁ δὲ θεὸς πλούσιος ὢν ἐν ἐλέει, διὰ τὴν πολλὴν ἀγάπην αὐτοῦ ἣν ἠγάπησεν ἡμᾶς,</p><p lang=\"grc\">καὶ ὄντας ἡμᾶς νεκροὺς τοῖς παραπτώμασιν συνεζωοποίησεν τῷ Χριστῷ— χάριτί ἐστε σεσῳσμένοι—</p><p lang=\"grc\">καὶ συνήγειρεν καὶ συνεκάθισεν ἐν τοῖς ἐπουρανίοις ἐν Χριστῷ Ἰησοῦ,</p>","lit":"<p>但神，在憐憫上是富足的，因著他的大愛，就是他用來愛我們的那愛，</p><p>並且當我們在過犯中是死的時候，使我們與基督一同活過來——你們是靠恩典已經得救的——</p><p>並且使我們一同復活，並且使我們一同坐在天上的領域裡，在基督耶穌裡，</p>","key":"<table><tr><th>原文</th><th>音譯</th><th>字面</th><th>在這裡</th></tr><tr><td>ὁ δὲ θεὸς</td><td>ho de theos</td><td>然而，神</td><td>全卷的鉸鏈</td></tr><tr><td>πλούσιος ὢν ἐν ἐλέει</td><td>plousios ōn en eleei</td><td>在憐憫上是富足的</td><td>2:7「極豐富」同一條線</td></tr><tr><td>διὰ τὴν πολλὴν ἀγάπην αὐτοῦ</td><td>dia tēn pollēn agapēn autou</td><td>因著他的大愛</td><td>救恩的動機</td></tr><tr><td>ἣν ἠγάπησεν ἡμᾶς</td><td>hēn ēgapēsen hēmas</td><td>他用來愛我們的那愛</td><td>同字源的重疊</td></tr><tr><td>συνεζωοποίησεν τῷ Χριστῷ</td><td>synezōopoiēsen tō Christō</td><td>與基督一同使活</td><td>第一個「一同」</td></tr><tr><td>χάριτί ἐστε σεσῳσμένοι</td><td>chariti este sesōsmenoi</td><td>你們是靠恩典已經得救的</td><td>完成式被動；插句</td></tr><tr><td>συνήγειρεν</td><td>synēgeiren</td><td>一同使復活</td><td>第二個「一同」</td></tr><tr><td>συνεκάθισεν</td><td>synekathisen</td><td>一同使坐下</td><td>第三個「一同」；全卷「坐」</td></tr><tr><td>ἐν τοῖς ἐπουρανίοις</td><td>en tois epouraniois</td><td>在天上的領域</td><td>1:3、1:20 同一個片語</td></tr></table>","gram":"<p><strong>◆ ὁ δὲ θεὸς（ho de theos）：全卷的鉸鏈。</strong>2:1 那個懸著的受格 Καὶ ὑμᾶς（Kai hymas），等了三節，終於等到主詞：神。δὲ（de） 是轉折，把「從前」整段翻過去。2:5 又用 καὶ ὄντας ἡμᾶς νεκροὺς（kai ontas hēmas nekrous） 把 2:1 重說一遍，然後才放出主要動詞——文法上說，2:1–7 是一個句子；神學上說，從前到如今中間，主詞是神。</p><p>πλούσιος ὢν ἐν ἐλέει（plousios ōn en eleei） 是現在分詞，說神「本是」富有憐憫的；διὰ τὴν πολλὴν ἀγάπην αὐτοῦ ἣν ἠγάπησεν ἡμᾶς（dia tēn pollēn agapēn autou hēn ēgapēsen hēmas） 是同字源重疊，「因他用來愛我們的那大愛」。憐憫看見的是可憐的光景，愛看見的是人；兩者都在動詞之前出場——動機先於行動。</p><p>接著是三個帶 σύν（syn） 字首的不定過去式：συνεζωοποίησεν（synezōopoiēsen）、συνήγειρεν（synēgeiren）、συνεκάθισεν（synekathisen）。對照 1:20：神叫基督 ἐγείρας（egeiras） 從死裡復活，又 καθίσας（kathisas） 坐在右邊；2:5–6 把同樣的動詞加上 σύν（syn） 字首，「與他一同」。神為基督作的，在基督裡也為我們作了。συζωοποιέω（syzōopoieō） 新約只見於這裡與西 2:13；συνεκάθισεν（synekathisen） 是全卷「坐」的出處，與 4:1 περιπατῆσαι（peripatēsai）、6:13 στῆναι（stēnai） 合成坐、行、站。</p><blockquote><p>不定過去式說的是已經發生的事。那麼「一同坐在天上」是已經發生了嗎？讀法有三：一、預言式的不定過去，把確定要發生的未來說成已成；二、地位上的實際：在基督裡的人，此刻已經有份於他的復活與王權；三、兩者合讀：「已然」坐下，「未然」顯明——2:7 說要「顯明給後來的世代看」。本講義取第三讀。中間的 χάριτί ἐστε σεσῳσμένοι（chariti este sesōsmenoi） 是用破折號隔開的插句，完成式被動：已經被救，至今仍在得救的狀態；2:8 會用 τῇ γὰρ（tē gar） 再說一次，保羅等不及到 2:8 才說。</p></blockquote>","exp":"<p>「然而，神既有豐富的憐憫，因他愛我們的大愛」（2:4）。全本新約，很少有兩個字比「然而，神」更重。2:1–3 的主詞是你們、我們、世界、首領、肉體；到了 2:4，主詞只剩一位。<strong>死人不能自救，所以轉折詞的主詞必須是神。</strong>321 說「反敗為勝」——以弗所書說，反敗為勝的那個轉折，不是我們翻身，是神開口。</p><p>他作了三件事，三件都帶著「一同」：「便叫我們與基督一同活過來」（2:5），「他又叫我們與基督耶穌一同復活，一同坐在天上」（2:6）。這不是神從天上丟一條繩子下來，叫我們自己爬上去；是神把我們和基督綁在一起，基督去哪裡，我們就去哪裡。基督從墳墓出來，我們一同出來；基督坐上寶座，我們一同坐下。谷底的高度是 6，2:6 是 90——中間只隔四節，因為搬動的人是神。</p><p>為甚麼是「坐」？因為坐是完成的姿勢。工作做完的人才坐下。第 1 章說基督坐在天上，「遠超過一切執政的、掌權的」（1:21）；第 2 章說我們和他一同坐在那裡。所以第 6 章的屬靈爭戰，不是從地上往上打，是從得勝的位置站住（立場四）。<strong>先坐，才會行；會行，才站得住。</strong>基督徒的一生不是從「我要努力」開始，是從「我已經被安置」開始。</p><p>但「坐」不是躺平。四節以後保羅就說：「為要叫我們行善」（2:10）。坐，是行的起點，不是行的替代。一個不知道自己已經坐在天上的人，會用一生去搶地上的位子；一個知道自己已經坐下的人，才能空出手來服事。讀完這三節，該問的不是「我要坐上哪個位子」，是「我知不知道，自己已經和基督一同坐在天上」。</p>"},{"a":7,"z":7,"star":1,"grk":"<p lang=\"grc\">ἵνα ἐνδείξηται ἐν τοῖς αἰῶσιν τοῖς ἐπερχομένοις τὸ ὑπερβάλλον πλοῦτος τῆς χάριτος αὐτοῦ ἐν χρηστότητι ἐφʼ ἡμᾶς ἐν Χριστῷ Ἰησοῦ.</p>","lit":"<p>為要在那些正要來的世代裡，展示他恩典超越的豐富，在恩慈裡向著我們，在基督耶穌裡。</p>","key":"<table><tr><th>原文</th><th>音譯</th><th>字面</th><th>在這裡</th></tr><tr><td>ἵνα ἐνδείξηται</td><td>hina endeixētai</td><td>為要展示</td><td>中間語態：為他自己展示</td></tr><tr><td>ἐν τοῖς αἰῶσιν τοῖς ἐπερχομένοις</td><td>en tois aiōsin tois eperchomenois</td><td>在那些正要來的世代裡</td><td>複數：一個接一個</td></tr><tr><td>τὸ ὑπερβάλλον πλοῦτος</td><td>to hyperballon ploutos</td><td>超越的豐富</td><td>1:19 同一個「超越」</td></tr><tr><td>ἐν χρηστότητι</td><td>en chrēstotēti</td><td>在恩慈裡</td><td>4:32「恩慈」的同字根</td></tr></table>","gram":"<p><strong>2:7 是 2:4–6 的目的子句。</strong>ἵνα ἐνδείξηται（hina endeixētai） 是不定過去假設語氣、中間語態：神作這一切，是為要「為自己」展示出來。展示甚麼？τὸ ὑπερβάλλον πλοῦτος τῆς χάριτος αὐτοῦ（to hyperballon ploutos tēs charitos autou）——「他恩典超越的豐富」。ὑπερβάλλον（hyperballon） 在 1:19 用來形容神的能力，這裡形容恩典；πλοῦτος（ploutos） 回扣 2:4 的 πλούσιος（plousios）：富足的神，展示富足的恩典。</p><p>ἐν τοῖς αἰῶσιν τοῖς ἐπερχομένοις（en tois aiōsin tois eperchomenois） 是複數的「世代」，與 2:2 單數的 τὸν αἰῶνα τοῦ κόσμου τούτου（ton aiōna tou kosmou toutou） 成對照：從前隨從的是「這世界的世代」，如今被放進一連串「正要來的世代」。ἐν χρηστότητι（en chrēstotēti） 指出恩典落地的樣子：恩慈，具體的好意。</p>","exp":"<p>神為甚麼要救一群死人？2:7 給的答案出人意外：不只為了我們，也為了展示。「要將他極豐富的恩典，就是他在基督耶穌裡向我們所施的恩慈，顯明給後來的世代看」（2:7）。我們被救活、被安置在天上，是神放在歷史櫥窗裡的作品，要讓一代又一代看見：恩典有多豐富。</p><p>這與第 3 章連起來：神要「藉著教會使天上執政的、掌權的，現在得知神百般的智慧」（3:10）。教會不是一群自己變好的人的俱樂部，是神的展品。展品不必自誇，因為人看展品，讚嘆的是作者。這也是 321「讓耶穌得一切榮耀」最好的一個畫面：一個被救的人最美的地方，是讓人看見救他的那一位。</p><p>「恩慈」這個字很家常。神的恩典不只是一個抽象的宣告，是一份具體的好意。4:32 會要我們「並要以恩慈相待」（4:32）——被恩慈對待過的人，才能恩慈待人。2:7 是源頭，4:32 是下游。</p>"},{"a":8,"z":10,"star":3,"grk":"<p lang=\"grc\">τῇ γὰρ χάριτί ἐστε σεσῳσμένοι διὰ πίστεως· καὶ τοῦτο οὐκ ἐξ ὑμῶν, θεοῦ τὸ δῶρον·</p><p lang=\"grc\">οὐκ ἐξ ἔργων, ἵνα μή τις καυχήσηται.</p><p lang=\"grc\">αὐτοῦ γάρ ἐσμεν ποίημα, κτισθέντες ἐν Χριστῷ Ἰησοῦ ἐπὶ ἔργοις ἀγαθοῖς οἷς προητοίμασεν ὁ θεὸς ἵνα ἐν αὐτοῖς περιπατήσωμεν.</p>","lit":"<p>因為你們是靠著那恩典、藉著信已經得救的；而這不是出於你們，是神的禮物；</p><p>不是出於行為，免得有人自誇。</p><p>因為我們是他的作品，在基督耶穌裡被創造，為了善行，就是神預先預備的，使我們行在其中。</p>","key":"<table><tr><th>原文</th><th>音譯</th><th>字面</th><th>在這裡</th></tr><tr><td>τῇ γὰρ χάριτί</td><td>tē gar chariti</td><td>因為是靠著那恩典</td><td>冠詞回指 2:5</td></tr><tr><td>ἐστε σεσῳσμένοι</td><td>este sesōsmenoi</td><td>你們是已經得救的</td><td>完成式被動</td></tr><tr><td>διὰ πίστεως</td><td>dia pisteōs</td><td>藉著信</td><td>信是管道，不是功勞</td></tr><tr><td>καὶ τοῦτο οὐκ ἐξ ὑμῶν</td><td>kai touto ouk ex hymōn</td><td>而這不是出於你們</td><td>τοῦτο 是中性</td></tr><tr><td>θεοῦ τὸ δῶρον</td><td>theou to dōron</td><td>神的禮物</td><td>θεοῦ 放在前面強調</td></tr><tr><td>οὐκ ἐξ ἔργων</td><td>ouk ex ergōn</td><td>不是出於行為</td><td>與 οὐκ ἐξ ὑμῶν 平行</td></tr><tr><td>ἵνα μή τις καυχήσηται</td><td>hina mē tis kauchēsētai</td><td>免得有人自誇</td><td>恩典的目的</td></tr><tr><td>αὐτοῦ γάρ ἐσμεν ποίημα</td><td>autou gar esmen poiēma</td><td>因為我們是他的作品</td><td>αὐτοῦ 放句首</td></tr><tr><td>κτισθέντες ἐν Χριστῷ Ἰησοῦ</td><td>ktisthentes en Christō Iēsou</td><td>在基督耶穌裡被創造</td><td>創造的字，2:15 再用</td></tr><tr><td>ἐπὶ ἔργοις ἀγαθοῖς</td><td>epi ergois agathois</td><td>為了善行</td><td>行為回來了，換了位置</td></tr><tr><td>οἷς προητοίμασεν ὁ θεὸς</td><td>hois proētoimasen ho theos</td><td>就是神預先預備的</td><td>連善行都是預備好的</td></tr><tr><td>ἵνα ἐν αὐτοῖς περιπατήσωμεν</td><td>hina en autois peripatēsōmen</td><td>使我們行在其中</td><td>2:2「行」的對照</td></tr></table>","gram":"<p><strong>2:8–10 是三個 γάρ（gar） 串起來的一段：</strong>τῇ γὰρ χάριτί（tē gar chariti） 回頭解釋 2:5 的插句；αὐτοῦ γάρ ἐσμεν ποίημα（autou gar esmen poiēma） 再解釋為甚麼不能自誇。τῇ χάριτί（tē chariti） 帶冠詞，是「那恩典」——2:4–7 剛剛描寫過的那份豐富的恩典。ἐστε σεσῳσμένοι（este sesōsmenoi） 是完成式被動迂說：得救已經發生，而且效力持續；被動語態說施救的不是我們。διὰ πίστεως（dia pisteōs） 是「藉著信」：信是領受的手，不是付款的錢。</p><p><strong>◆ τοῦτο（touto） 指甚麼？</strong>καὶ τοῦτο οὐκ ἐξ ὑμῶν（kai touto ouk ex hymōn） 的 τοῦτο（touto） 是中性，χάριτί（chariti） 和 πίστεως（pisteōs） 卻都是陰性，所以它不能在文法上直接指其中一個。三種讀法：<strong>一、指信心</strong>（部分教父與後來的改革宗作者）：連信心都是神所賜的；但性別不合。<strong>二、指恩典</strong>：恩典不是出於自己；但這句話幾乎是同義反覆，性別也不合。<strong>三、指整個「本乎恩、因著信而得救」這件事</strong>：中性代名詞常指前面整個意思；而且下一句 οὐκ ἐξ ἔργων（ouk ex ergōn） 與 οὐκ ἐξ ὑμῶν（ouk ex hymōn） 平行，說「不是出於行為」的，最自然是整個救恩，不是信心本身。本講義取第三讀：救恩整件事，從頭到尾都是 θεοῦ τὸ δῶρον（theou to dōron）——θεοῦ（theou） 放在前面強調，「是神的，這禮物」。這樣讀，信心也被包在禮物裡面，不會變成另一種功勞。</p><blockquote><p>2:9 的 ἔργων（ergōn） 和 2:10 的 ἔργοις ἀγαθοῖς（ergois agathois） 是同一個字。行為先被趕出門：οὐκ ἐξ ἔργων（ouk ex ergōn），不是救恩的來源；一節之後又從另一扇門回來：ἐπὶ ἔργοις ἀγαθοῖς（epi ergois agathois），是新造的目的。ἐξ（ex） 是「出於」，ἐπὶ（epi） 是「為了」——根與果的分別。ποίημα（poiēma） 是「被做出來的東西、作品」，新約只在這裡與羅 1:20 說受造之物的 ποιήμασιν（poiēmasin） 出現；英文 poem 就是從這個字來的，但保羅的意思是「神親手的作品」，不是文學比喻。κτισθέντες（ktisthentes） 是創造的字，2:15 κτίσῃ（ktisē） 用它說造成「一個新人」。最後 ἵνα ἐν αὐτοῖς περιπατήσωμεν（hina en autois peripatēsōmen） 與 2:2 ἐν αἷς ποτε περιεπατήσατε（en hais pote periepatēsate） 首尾呼應：從前在過犯裡行，如今在神預備的善行裡行。</p></blockquote>","exp":"<p>「你們得救是本乎恩，也因著信；這並不是出於自己，乃是神所賜的；也不是出於行為，免得有人自誇」（2:8–9）。這兩節可能是全本新約最常被背誦的福音經文之一。它的好消息很簡單：救恩是禮物。禮物不能賺，只能收；收禮物的手，就是信。一個人若可以靠行為得救，天堂裡就會有人站在台上分享自己的成功；<strong>恩典的目的之一，就是讓天堂裡沒有一個人能自誇。</strong></p><p>321 說，驕傲是問題的根源。2:9 指出驕傲最後、最隱密的一塊地盤：連得救都想誇。有人誇自己的行為，有人誇自己的信心——「我信得比較用力」。τοῦτο（touto） 的第三種讀法把這條路也封住了：連那份信，都包在神的禮物裡。這不是叫人被動，是叫人安心。救恩的穩固不在我抓得多緊，在送禮的那一位。</p><p>可是保羅沒有在 2:9 停筆。「我們原是他的工作，在基督耶穌裡造成的，為要叫我們行善，就是神所預備叫我們行的」（2:10）。<strong>這三節一定要一起讀（紅線五）。</strong>只讀 2:8–9，會以為行為不重要；只讀 2:10，會以為要靠行善保住救恩。三節合起來才是福音：不是出於行為，卻是為了行善。行善不是得救的條件，是得救的結果；不是門票，是新生命自然的樣子。雅各說「信心若沒有行為就是死的」（雅 2:17），保羅說「不是出於行為」——兩人說的是同一棵樹的根和果子（回指加拉太書立場二）。</p><p>「我們原是他的工作」（2:10）——工作，原文是作品。從死人到作品，這是 2:1 到 2:10 的全部距離。作品不必證明自己的價值，作者已經決定了。連要行的善，神都「預備」好了：不是一張我們要自己設計的成績單，是一條神先鋪好、叫我們走上去的路。2:2 我們在死亡裡「行」，2:10 我們在神預備的善行裡「行」——同一個動詞，換了一條路。所以「坐」不是躺平：坐在天上的人，腳在地上是要走路的。</p>"},{"a":11,"z":12,"star":2,"grk":"<p lang=\"grc\">Διὸ μνημονεύετε ὅτι ποτὲ ὑμεῖς τὰ ἔθνη ἐν σαρκί, οἱ λεγόμενοι ἀκροβυστία ὑπὸ τῆς λεγομένης περιτομῆς ἐν σαρκὶ χειροποιήτου,</p><p lang=\"grc\">ὅτι ἦτε τῷ καιρῷ ἐκείνῳ χωρὶς Χριστοῦ, ἀπηλλοτριωμένοι τῆς πολιτείας τοῦ Ἰσραὴλ καὶ ξένοι τῶν διαθηκῶν τῆς ἐπαγγελίας, ἐλπίδα μὴ ἔχοντες καὶ ἄθεοι ἐν τῷ κόσμῳ.</p>","lit":"<p>所以你們要記得：從前你們這些按肉體的外邦人，被那按肉體、人手所做的所謂割禮稱為包皮的，</p><p>那時你們是沒有基督的，與以色列的國民身分隔絕，是應許之諸約的外人，沒有指望，並且在世上沒有神。</p>","key":"<table><tr><th>原文</th><th>音譯</th><th>字面</th><th>在這裡</th></tr><tr><td>Διὸ μνημονεύετε</td><td>Dio mnēmoneuete</td><td>所以你們要記得</td><td>前三章唯一的命令</td></tr><tr><td>οἱ λεγόμενοι ἀκροβυστία</td><td>hoi legomenoi akrobystia</td><td>被稱為「包皮」的</td><td>別人起的名字</td></tr><tr><td>τῆς λεγομένης περιτομῆς</td><td>tēs legomenēs peritomēs</td><td>那被稱為「割禮」的</td><td>兩邊都是「被稱為」</td></tr><tr><td>χειροποιήτου</td><td>cheiropoiētou</td><td>人手所做的</td><td>新約用來說人手所造的殿</td></tr><tr><td>χωρὶς Χριστοῦ</td><td>chōris Christou</td><td>沒有基督</td><td>五個「沒有」的第一個</td></tr><tr><td>ἀπηλλοτριωμένοι τῆς πολιτείας τοῦ Ἰσραὴλ</td><td>apēllotriōmenoi tēs politeias tou Israēl</td><td>與以色列的國民身分隔絕</td><td>完成式分詞：一種狀態</td></tr><tr><td>ξένοι τῶν διαθηκῶν τῆς ἐπαγγελίας</td><td>xenoi tōn diathēkōn tēs epangelias</td><td>應許之諸約的外人</td><td>ξένοι 2:19 再出現</td></tr><tr><td>ἐλπίδα μὴ ἔχοντες</td><td>elpida mē echontes</td><td>沒有指望</td><td></td></tr><tr><td>ἄθεοι ἐν τῷ κόσμῳ</td><td>atheoi en tō kosmō</td><td>在世上沒有神</td><td>新約只此一次</td></tr></table>","gram":"<p><strong>2:11 的 Διὸ μνημονεύετε（Dio mnēmoneuete） 是前三章唯一的命令句。</strong>以弗所書前三章全是陳述、頌讚、禱告，只有這裡出現一個現在式命令：「要記得」。Διὸ（Dio） 把 2:1–10 收進來：既然神為你們作了這一切，就不要忘記自己是從哪裡被帶出來的。</p><p>2:11 兩邊都用了「被稱為」：οἱ λεγόμενοι ἀκροβυστία（hoi legomenoi akrobystia） 對 τῆς λεγομένης περιτομῆς（tēs legomenēs peritomēs）。保羅和兩個標籤都保持了一點距離：外邦人被叫作「包皮」，是猶太人起的綽號；猶太人自稱「割禮」，卻是 ἐν σαρκὶ χειροποιήτου（en sarki cheiropoiētou），在肉身上、人手作的。χειροποιήτου（cheiropoiētou） 在新約多用來說人手所造的殿（可 14:58；徒 7:48）；西 2:11 則說信徒受了 ἀχειροποιήτῳ（acheiropoiētō） 的割禮。</p><blockquote><p>2:12 是五個「沒有」的清單：χωρὶς Χριστοῦ（chōris Christou）、ἀπηλλοτριωμένοι τῆς πολιτείας τοῦ Ἰσραὴλ（apēllotriōmenoi tēs politeias tou Israēl）、ξένοι τῶν διαθηκῶν τῆς ἐπαγγελίας（xenoi tōn diathēkōn tēs epangelias）、ἐλπίδα μὴ ἔχοντες（elpida mē echontes）、ἄθεοι ἐν τῷ κόσμῳ（atheoi en tō kosmō）。ἀπηλλοτριωμένοι（apēllotriōmenoi） 是完成式分詞，一種持續的「被隔在外」；4:18 用同一個字說外邦人「與神所賜的生命隔絕」。διαθηκῶν（diathēkōn） 是複數，「諸約」——亞伯拉罕、摩西、大衛的約，都屬以色列。ἄθεοι（atheoi） 新約只此一次：不是無神論，是在一個滿城都是神明的地方，沒有那一位真神。</p></blockquote>","exp":"<p>神在 2:1–10 說了「你們從前死了」；2:11–12 換一個角度再說一次：「你們從前……是外邦人」（2:11）。第一次說的是人與神的距離，第二次說的是人與神子民的距離。兩個距離是連在一起的：離神遠的人，也在神的家門外。</p><p>保羅要外邦信徒「記念」的清單很具體：「那時，你們與基督無關，在以色列國民以外，在所應許的諸約上是局外人，並且活在世上沒有指望，沒有神」（2:12）。注意這份清單的中心是以色列。以色列的國民身分、諸約、應許，是真實的福分；保羅在別處說，「那兒子的名分、榮耀、諸約、律法、禮儀、應許都是他們的」（羅 9:4）。<strong>外邦人是被接進來的，不是取而代之的</strong>——「不是你托著根，乃是根托著你」（羅 11:18）。一間輕看猶太人的教會，已經忘了 2:12：我們原是局外人。</p><p>「沒有神」這三個字落在以弗所，格外諷刺。以弗所有亞底米神廟，是古代世界的七大奇觀之一；滿城神明，卻「沒有神」。華人城市也是這樣：廟多、神明多、拜的人多，指望卻少。拜過、求過、算過，心裡仍然沒有底。2:12 不是瞧不起拜拜的人，是說出拜拜背後那份「沒有指望」。</p><p>為甚麼要「記念」？不是為了沉溺在過去，是為了不忘恩。忘記自己曾是外人的人，最容易把別人當外人。記得自己是被接納的，才會去接納人——這正是 2:14 那道牆要倒下的第一個條件。</p>"},{"a":13,"z":13,"star":2,"grk":"<p lang=\"grc\">νυνὶ δὲ ἐν Χριστῷ Ἰησοῦ ὑμεῖς οἵ ποτε ὄντες μακρὰν ἐγενήθητε ἐγγὺς ἐν τῷ αἵματι τοῦ Χριστοῦ.</p>","lit":"<p>但如今在基督耶穌裡，你們這些從前在遠處的人，在基督的血裡成了近的。</p>","key":"<table><tr><th>原文</th><th>音譯</th><th>字面</th><th>在這裡</th></tr><tr><td>νυνὶ δὲ</td><td>nyni de</td><td>但如今</td><td>對照 2:11 的 ποτὲ</td></tr><tr><td>οἵ ποτε ὄντες μακρὰν</td><td>hoi pote ontes makran</td><td>從前是在遠處的</td><td>空間的說法</td></tr><tr><td>ἐγενήθητε ἐγγὺς</td><td>egenēthēte engys</td><td>你們成了近的</td><td>不定過去被動：被帶近</td></tr><tr><td>ἐν τῷ αἵματι τοῦ Χριστοῦ</td><td>en tō haimati tou Christou</td><td>在基督的血裡</td><td>1:7 救贖的血</td></tr></table>","gram":"<p><strong>2:13 的 νυνὶ δὲ（nyni de） 是本章第二個鉸鏈。</strong>2:4 是 ὁ δὲ θεὸς（ho de theos），這裡是 νυνὶ δὲ（nyni de）——νυνὶ（nyni） 是 νῦν（nyn） 的加強形，「就在如今」。2:11 的 ποτὲ（pote） 對上 2:13 的 νυνὶ（nyni），全卷「從前／如今」的對照在這一章出現了兩次。</p><p>οἵ ποτε ὄντες μακρὰν（hoi pote ontes makran） 與 ἐγενήθητε ἐγγὺς（egenēthēte engys） 是空間的語言：遠與近。學者觀察到，猶太文獻用「使人親近」形容外邦人歸入以色列；這組字也使我們想起賽 57:19「遠處的人」「近處的人」，2:17 會再用。ἐγενήθητε（egenēthēte） 是不定過去式被動：不是外邦人走近，是被帶近。兩個介系詞片語說出方法：ἐν Χριστῷ Ἰησοῦ（en Christō Iēsou） 是位置，ἐν τῷ αἵματι τοῦ Χριστοῦ（en tō haimati tou Christou） 是代價；血回扣「藉這愛子的血得蒙救贖」（1:7）。</p>","exp":"<p>「你們從前遠離神的人，如今卻在基督耶穌裡，靠著他的血，已經得親近了」（2:13）。這一節是 2:12 五個「沒有」的總答案。沒有基督——如今在基督耶穌裡；在國民以外、在諸約上是局外人——如今得親近了；沒有指望、沒有神——如今靠著他的血，被帶到神面前。</p><p>距離是怎樣消失的？不是外邦人終於守夠了規矩，一步一步走進聖殿；是基督的血把他們帶近。猶太人的近，也不是因為血統，同樣是靠這血（2:16「與神和好」的是兩下）。<strong>在親近神這件事上，沒有人是自己走過去的。</strong></p><p>這一節對華人信徒有一個很實際的安慰（立場四）。鬼月、沖煞、風水、擇日——許多人從小在這些恐懼裡長大。2:13 說：你們如今已經靠著他的血得親近了。一個被基督的血帶到神面前的人，不在黑暗權勢的轄制之下，不必怕；但也因此不再去拜、去求、去戴護身符——因為那是把信靠交回給 2:2 那位「空中掌權者的首領」。不怕，也不拜；不迷信，也不輕忽。</p><p>這一節還有一個字很溫柔：「如今」。不是「將來有一天」，也不是「等你更好一點」。靠著那血，親近是現在式的事實。從前的距離是真的，如今的親近更真。</p>"},{"a":14,"z":14,"star":3,"grk":"<p lang=\"grc\">αὐτὸς γάρ ἐστιν ἡ εἰρήνη ἡμῶν, ὁ ποιήσας τὰ ἀμφότερα ἓν καὶ τὸ μεσότοιχον τοῦ φραγμοῦ λύσας, τὴν ἔχθραν ἐν τῇ σαρκὶ αὐτοῦ,</p>","lit":"<p>因為他自己就是我們的和平，那使兩下成為一、又拆了那圍籬的中間隔牆的，就是冤仇，在他的肉身裡，</p>","key":"<table><tr><th>原文</th><th>音譯</th><th>字面</th><th>在這裡</th></tr><tr><td>αὐτὸς γάρ ἐστιν ἡ εἰρήνη ἡμῶν</td><td>autos gar estin hē eirēnē hēmōn</td><td>因為他自己就是我們的和平</td><td>和平是一個人</td></tr><tr><td>ὁ ποιήσας τὰ ἀμφότερα ἓν</td><td>ho poiēsas ta amphotera hen</td><td>那把兩下做成一的</td><td>中性：兩個群體</td></tr><tr><td>τὸ μεσότοιχον τοῦ φραγμοῦ</td><td>to mesotoichon tou phragmou</td><td>圍籬的中間隔牆</td><td>新約只此一次</td></tr><tr><td>λύσας</td><td>lysas</td><td>拆了</td><td>不定過去分詞：一次完成</td></tr><tr><td>τὴν ἔχθραν ἐν τῇ σαρκὶ αὐτοῦ</td><td>tēn echthran en tē sarki autou</td><td>冤仇，在他的肉身裡</td><td>原文屬 2:14</td></tr></table>","gram":"<p><strong>2:14 用 αὐτὸς γάρ（autos gar） 起頭，「他」放在最前面強調。</strong>αὐτὸς γάρ ἐστιν ἡ εἰρήνη ἡμῶν（autos gar estin hē eirēnē hēmōn），cu89t 的註腳說：原文是「因他是我們的和睦」。和合本譯成「他使我們和睦」，說的是他作了甚麼；原文更進一步，說的是他是誰——和平不是一份協議，是一個人。εἰρήνη（eirēnē） 從這裡起在四節之內出現四次（2:14、15、17 兩次），是本章最密的一條關鍵字追蹤。</p><p>ὁ ποιήσας τὰ ἀμφότερα ἓν（ho poiēsas ta amphotera hen） 的 τὰ ἀμφότερα（ta amphotera） 是中性複數，「兩樣、兩下」，指兩個群體；到 2:15 τοὺς δύο（tous dyo） 換成陽性，「兩個人」。λύσας（lysas） 是不定過去分詞：拆，已經一次拆完。</p><blockquote><p><strong>τὸ μεσότοιχον τοῦ φραγμοῦ（to mesotoichon tou phragmou）</strong>：μεσότοιχον（mesotoichon） 全本新約只有這裡，「中間的牆」；τοῦ φραγμοῦ（tou phragmou） 是「圍籬」，屬格作同位，「那道牆，就是那道圍籬」。牆指甚麼，有三說：一、耶路撒冷聖殿外邦人院與以色列人院之間的矮牆，牆上立有希臘文石碑，警告外邦人越過者死罪自負（約瑟夫有記載，十九世紀已有石碑出土）；二、律法本身，像籬笆把以色列圍起來（2:15 緊接著說「律法上的規條」）；三、天地之間、神人之間的屏障。本講義的判斷：聖殿的隔牆是保羅和讀者都看得見的圖像，2:15 的規條是這道牆的實質；兩說合讀。句末 τὴν ἔχθραν ἐν τῇ σαρκὶ αὐτοῦ（tēn echthran en tē sarki autou） 在原文屬 2:14，可以與 λύσας（lysas） 連讀（拆毀那牆，就是冤仇），也可以連到 2:15 的 καταργήσας（katargēsas）；和合本取後者，把「以自己的身體廢掉冤仇」移到 2:15 句首——這是譯文語序，不是經文的差異。</p></blockquote>","exp":"<p>〔背景〕徒 21:27--30（使徒行傳講義第 21 章）</p><p>〔加〕加 2:11--16（加拉太書講義第 2 章）</p><p>「因他使我們和睦，將兩下合而為一，拆毀了中間隔斷的牆」（2:14）。這道牆不是比喻。耶路撒冷聖殿裡，外邦人只能留在外院；往裡走，有一道矮牆，牆上的石碑寫著：外邦人越過者，死罪自負。一個外邦信徒再愛神，也只能站在牆外看。</p><p>寫這封信的人，正是因為這道牆坐在監裡。使徒行傳講義第 21 章講過那一天：亞細亞來的猶太人在殿裡看見保羅，喊著說「他又帶著希臘人進殿，污穢了這聖地」（徒 21:28）——其實是因為看見以弗所人特羅非摩和他在城裡，「以為保羅帶他進了殿」（徒 21:29）。保羅被拿、被押、被送到羅馬，起因就是那道牆。<strong>如今他戴著鎖鍊寫信給以弗所人：那道牆已經被拆了。</strong>石頭的牆還立在耶路撒冷，但在基督的身體裡，它已經倒了。</p><p>加拉太書講義第 2 章講過安提阿的餐桌：彼得「和外邦人一同吃飯」（加 2:12），後來卻退去隔開。加拉太書的谷底，是一張被拆散的桌子；以弗所書的答案，是一道被拆毀的牆。加拉太書說「不可以分桌」，以弗所書說「牆已經沒有了，你們是一家人」。牆是基督拆的，「以自己的身體」（2:15）拆的——合一不是我們努力造出來的，是他造好了，交給我們「竭力保守」（4:3）。</p><p>這道牆拆的是敵意，不是身分。保羅沒有叫猶太人不再是猶太人，也沒有叫外邦人先變成猶太人。<strong>新人不是一方吃掉另一方</strong>，所以這一節不能講成教會取代以色列、從此可以輕看猶太人；那等於在教會裡另砌一道牆。今天的牆換了材料：族群、方言、世代、階級、政治立場（見本章議題頁）。321 說「無己才能合一」——不是因為無己的人比較會團結，是因為基督已經在十字架上把有己的牆拆了，誰再砌回去，就是和他的身體作對。</p>"},{"a":15,"z":16,"star":2,"grk":"<p lang=\"grc\">τὸν νόμον τῶν ἐντολῶν ἐν δόγμασιν καταργήσας, ἵνα τοὺς δύο κτίσῃ ἐν αὑτῷ εἰς ἕνα καινὸν ἄνθρωπον ποιῶν εἰρήνην,</p><p lang=\"grc\">καὶ ἀποκαταλλάξῃ τοὺς ἀμφοτέρους ἐν ἑνὶ σώματι τῷ θεῷ διὰ τοῦ σταυροῦ ἀποκτείνας τὴν ἔχθραν ἐν αὐτῷ·</p>","lit":"<p>使那在規條中的誡命之律法失效，為要使兩個人在他自己裡面被創造成為一個新人，締造和平，</p><p>並且使兩下在一個身體裡藉著十字架與神徹底和好，在它裡面殺死了冤仇；</p>","key":"<table><tr><th>原文</th><th>音譯</th><th>字面</th><th>在這裡</th></tr><tr><td>τὸν νόμον τῶν ἐντολῶν ἐν δόγμασιν</td><td>ton nomon tōn entolōn en dogmasin</td><td>在規條中的誡命之律法</td><td>三個字疊在一起</td></tr><tr><td>καταργήσας</td><td>katargēsas</td><td>使之失效</td><td>不是「消滅」，是「使不再運作」</td></tr><tr><td>ἵνα τοὺς δύο κτίσῃ ἐν αὑτῷ</td><td>hina tous dyo ktisē en hautō</td><td>為要把兩個人在他自己裡面創造</td><td>創造的字</td></tr><tr><td>εἰς ἕνα καινὸν ἄνθρωπον</td><td>eis hena kainon anthrōpon</td><td>成為一個新人</td><td>新人第一次出現：一群人</td></tr><tr><td>ποιῶν εἰρήνην</td><td>poiōn eirēnēn</td><td>締造和平</td><td>現在分詞</td></tr><tr><td>ἀποκαταλλάξῃ</td><td>apokatallaxē</td><td>使徹底和好</td><td>新約只見於弗、西</td></tr><tr><td>ἐν ἑνὶ σώματι</td><td>en heni sōmati</td><td>在一個身體裡</td><td>教會，或十字架上的身體</td></tr><tr><td>ἀποκτείνας τὴν ἔχθραν</td><td>apokteinas tēn echthran</td><td>殺死了冤仇</td><td>被殺的那一位殺死了冤仇</td></tr></table>","gram":"<p><strong>2:15 先處理一個譯文語序。</strong>和合本 2:15 句首「而且以自己的身體廢掉冤仇」，對應的原文 τὴν ἔχθραν ἐν τῇ σαρκὶ αὐτοῦ（tēn echthran en tē sarki autou） 在 SBLGNT 屬 2:14 末；原文 2:15 從 τὸν νόμον τῶν ἐντολῶν ἐν δόγμασιν καταργήσας（ton nomon tōn entolōn en dogmasin katargēsas） 起頭。經文相同，只是中文換了排列。</p><p><strong>⚖ 律法被廢了嗎？</strong>τὸν νόμον τῶν ἐντολῶν ἐν δόγμασιν（ton nomon tōn entolōn en dogmasin） 三個字疊在一起：律法、誡命、規條。καταργήσας（katargēsas） 是「使失效、使不再運作」。讀法有三：一、整個摩西之約作為一套制度被廢；二、只指分隔猶太人與外邦人的禮儀條例（割禮、飲食、潔淨）；三、指律法被當作冤仇與隔牆的那種功用。本講義的判斷：被廢的是律法作為「隔牆」與「入門條件」的功能，不是神的道德旨意——本卷 4:25 仍引亞 8:16，6:2 仍引十誡。這與耶穌說「我來不是要廢掉，乃是要成全」（太 5:17）並不衝突。</p><blockquote><p>ἵνα τοὺς δύο κτίσῃ ἐν αὑτῷ εἰς ἕνα καινὸν ἄνθρωπον（hina tous dyo ktisē en hautō eis hena kainon anthrōpon）：κτίσῃ（ktisē） 是創造的字（2:10 κτισθέντες（ktisthentes））；καινὸν（kainon） 是「新的種類」，不是翻新舊的。這是「新人」在全卷第一次出現，而且是單數的「一個新人」由「兩個人」造成——一個群體；4:24 τὸν καινὸν ἄνθρωπον（ton kainon anthrōpon） 才是個人穿上的新人。2:16 ἀποκαταλλάξῃ（apokatallaxē） 在 καταλλάσσω（katallassō） 前再加 ἀπό（apo），新約只見於這裡與西 1:20、22。ἐν ἑνὶ σώματι（en heni sōmati） 可指教會（4:4「身體只有一個」），也可指基督被釘的身體；多數註釋取前者。句末 ἀποκτείνας τὴν ἔχθραν ἐν αὐτῷ（apokteinas tēn echthran en autō） 的 ἐν αὐτῷ（en autō） 可讀作「藉著它（十字架）」或「在他自己身上」——兩讀都指向同一個地方。</p></blockquote>","exp":"<p>「為要將兩下藉著自己造成一個新人，如此便成就了和睦」（2:15）。基督拆了牆之後，沒有只留下一片空地，他在上面「造」了一個新的人。這不是叫外邦人變成猶太人，也不是叫猶太人變成外邦人，是兩邊都進到一個從前不存在的新群體裡。猶太人仍是猶太人，外邦人仍是外邦人，卻都成了「一個新人」的一部分。這就是為甚麼這段經文不能講成教會取代以色列：新人不是某一方的勝利，是兩方在基督裡一同被造。</p><p>321 說「舊人有己的生命，變成新人無己的生命」。這兩個詞的出處在第 4 章，但「新人」第一次出現在這裡——<strong>而且第一次出現就是一群人。</strong>新人從來不只是一個人的修養，是一群人在基督裡被造成的。一個脫不掉有己的人，很難擠進這個新人裡面；一個真正被造成新人的群體，也不會容許牆再立起來。</p><p>「既在十字架上滅了冤仇，便藉這十字架使兩下歸為一體，與神和好了」（2:16）。這一節有兩個方向：橫的，兩下歸為一體；直的，與神和好。兩個方向在同一個十字架上交叉。沒有人能只要直的、不要橫的——說自己與神和好、卻和弟兄築牆的人，忘了自己是在哪裡與神和好的。原文說基督在十字架上「殺死了冤仇」：被殺的那一位，殺死了冤仇。</p><p>律法有沒有被廢？本章議題頁會詳論。這裡只要記住一件事：被廢的是把人擋在門外的那一套條件，不是神要我們誠實、聖潔、相愛的心意。第 4 章以後，以弗所書的命令一個接一個，那正是新人該有的樣子。</p>"},{"a":17,"z":18,"star":1,"grk":"<p lang=\"grc\">καὶ ἐλθὼν εὐηγγελίσατο εἰρήνην ὑμῖν τοῖς μακρὰν καὶ εἰρήνην τοῖς ἐγγύς·</p><p lang=\"grc\">ὅτι διʼ αὐτοῦ ἔχομεν τὴν προσαγωγὴν οἱ ἀμφότεροι ἐν ἑνὶ πνεύματι πρὸς τὸν πατέρα.</p>","lit":"<p>並且他來了，傳和平的福音給你們那些遠處的人，也傳和平給那些近處的人；</p><p>因為藉著他，我們兩下在一位靈裡，有了到父面前的引進。</p>","key":"<table><tr><th>原文</th><th>音譯</th><th>字面</th><th>在這裡</th></tr><tr><td>ἐλθὼν εὐηγγελίσατο εἰρήνην</td><td>elthōn euēngelisato eirēnēn</td><td>他來了，傳了和平的福音</td><td>誰傳？何時？</td></tr><tr><td>ὑμῖν τοῖς μακρὰν</td><td>hymin tois makran</td><td>給你們遠處的人</td><td>回扣 2:13</td></tr><tr><td>τὴν προσαγωγὴν</td><td>tēn prosagōgēn</td><td>引進、進見</td><td>被帶到王面前</td></tr><tr><td>οἱ ἀμφότεροι</td><td>hoi amphoteroi</td><td>我們兩下</td><td>同一個入口</td></tr><tr><td>ἐν ἑνὶ πνεύματι πρὸς τὸν πατέρα</td><td>en heni pneumati pros ton patera</td><td>在一位聖靈裡到父面前</td><td>三一神</td></tr></table>","gram":"<p><strong>2:17 把 εἰρήνην（eirēnēn） 說了兩次。</strong>εὐηγγελίσατο εἰρήνην ὑμῖν τοῖς μακρὰν καὶ εἰρήνην τοῖς ἐγγύς（euēngelisato eirēnēn hymin tois makran kai eirēnēn tois engys）——遠處的人一份，近處的人一份，不是一份分兩半。這組字使我們想起「願平安康泰歸與遠處的人，也歸與近處的人」（賽 57:19），也使我們想起賽 52:7 報平安的腳蹤；保羅沒有標明引用，本講義照「這使我們想起」處理。ἐλθὼν（elthōn） 指基督何時「來」傳？可能指他的十字架與復活本身就是宣告，也可能指他藉使徒傳揚；兩讀都說傳和平的是基督自己。</p><p>2:18 是全卷第一句清楚的三一神句子：藉著子，在聖靈裡——ἐν ἑνὶ πνεύματι（en heni pneumati），到父面前——πρὸς τὸν πατέρα（pros ton patera）。τὴν προσαγωγὴν（tēn prosagōgēn） 是「被引進」，宮廷用語，被帶到王面前；3:12 與羅 5:2 也用這個字。οἱ ἀμφότεροι（hoi amphoteroi） 說：兩下一同進去，不是兩個入口。</p>","exp":"<p>「並且來傳和平的福音給你們遠處的人，也給那近處的人」（2:17）。和平有兩份，一份給遠的，一份給近的；但福音只有一個。基督沒有為猶太人傳一個福音、為外邦人傳另一個；他向兩邊說同一句話：和平。</p><p>「因為我們兩下藉著他被一個聖靈所感，得以進到父面前」（2:18）。牆倒了，不只是兩群人可以坐在一起，更是兩群人可以一同進到父面前。從前外邦人只能停在外院；如今藉著子、在聖靈裡，直接到父面前——比當年的猶太祭司走得更深。</p><p>這一節也是合一最深的根。弟兄姊妹能不能坐在同一張桌子上，最終要看能不能跪在同一位父面前。同一位聖靈，同一個入口；一起禱告的人，很難再彼此築牆。這也是 321「用心靠聖靈」在群體裡的樣子：不是各人靠聖靈各走各的，是「被一個聖靈所感」，一同來到父面前。</p>"},{"a":19,"z":19,"star":2,"grk":"<p lang=\"grc\">ἄρα οὖν οὐκέτι ἐστὲ ξένοι καὶ πάροικοι, ἀλλὰ ἐστὲ συμπολῖται τῶν ἁγίων καὶ οἰκεῖοι τοῦ θεοῦ,</p>","lit":"<p>所以這樣，你們不再是外人和寄居的，乃是聖徒的同國之民，和神家裡的人，</p>","key":"<table><tr><th>原文</th><th>音譯</th><th>字面</th><th>在這裡</th></tr><tr><td>ἄρα οὖν</td><td>ara oun</td><td>這樣，所以</td><td>雙重結論詞</td></tr><tr><td>οὐκέτι ἐστὲ ξένοι καὶ πάροικοι</td><td>ouketi este xenoi kai paroikoi</td><td>你們不再是外人和寄居的</td><td>兩種「外」</td></tr><tr><td>συμπολῖται τῶν ἁγίων</td><td>sympolitai tōn hagiōn</td><td>聖徒的同國之民</td><td>回扣 2:12「國民」</td></tr><tr><td>οἰκεῖοι τοῦ θεοῦ</td><td>oikeioi tou theou</td><td>神家裡的人</td><td>與 πάροικοι 同一個字根</td></tr></table>","gram":"<p><strong>2:19 用 ἄρα οὖν（ara oun） 收束 2:11–18。</strong>兩個結論詞疊用，是保羅喜歡的強調句式：所以，這樣說來。</p><p>ξένοι（xenoi） 是外國人，回扣 2:12 的 ξένοι τῶν διαθηκῶν τῆς ἐπαγγελίας（xenoi tōn diathēkōn tēs epangelias）；πάροικοι（paroikoi） 是寄居的人，字面是「住在房子旁邊的」——παρά（para） 加 οἶκος（oikos）。它的對照 οἰκεῖοι τοῦ θεοῦ（oikeioi tou theou） 是同一個字根：從「住在隔壁的」變成「家裡的」。συμπολῖται（sympolitai） 回扣 2:12 的 πολιτείας（politeias）：從國民以外，變成同國之民。從 2:19 到 2:22，帶「家」字根的字連用五次：οἰκεῖοι（oikeioi）、ἐποικοδομηθέντες（epoikodomēthentes）、οἰκοδομὴ（oikodomē）、συνοικοδομεῖσθε（synoikodomeisthe）、κατοικητήριον（katoikētērion）——這是本卷 οἰκεῖος（oikeios）／οἰκοδομή（oikodomē） 追蹤最密的一段。</p><blockquote><p>τῶν ἁγίων（tōn hagiōn） 指誰？一說指以色列或猶太信徒——外邦人加入他們；一說指所有信徒；少數人讀作天使。本講義取前兩說合讀：外邦人被接進一個已經有以色列信徒在裡面的國度與家，是加入，不是取代。</p></blockquote>","exp":"<p>「這樣，你們不再作外人和客旅，是與聖徒同國，是神家裡的人了」（2:19）。外人是路過的，客旅是住下了卻沒有戶籍的；可以住在旁邊，可以付房租，就是不能上桌吃年夜飯。保羅說：這個身分已經改了。</p><p>華人最懂「自己人」和「外人」的分別。一句「你是外人」，就可以讓一個人在家族、公司、教會裡永遠坐在邊上。2:19 說的不是一份會員卡，是一個戶口名簿：你是神家裡的人了。教會如果讓新來的人、外省的人、不同口音的人一直覺得自己是客人，就是讓 2:19 只停在紙上。</p><p>「與聖徒同國」也很重要。外邦信徒被接進的國度，裡面本來就有以色列的聖徒。他們不是另起爐灶，是被接上去；不是取代，是同國。保羅在別處說「我們卻是天上的國民」（腓 3:20），護照換了，鄰居也換了。從前隔牆的兩邊，如今在同一本戶口名簿上。這就是第 2 章三個詞的第二個詞「牆」走到的地方：牆倒了，家出現了。</p><p>家和國不一樣。國講的是權利與身分，家講的是關係與飯桌。保羅先說「同國」，再說「家裡的人」，好像怕讀者以為拿到身分證就夠了。神要的不只是一群持有同一本護照的人，是一群會坐下來一起吃飯、一起擔心彼此的家人。2:19 的檢驗很平實：我們的教會，新朋友是被登記，還是被認識？</p>"},{"a":20,"z":20,"star":2,"grk":"<p lang=\"grc\">ἐποικοδομηθέντες ἐπὶ τῷ θεμελίῳ τῶν ἀποστόλων καὶ προφητῶν, ὄντος ἀκρογωνιαίου αὐτοῦ Χριστοῦ Ἰησοῦ,</p>","lit":"<p>被建造在使徒和先知的根基上，基督耶穌他自己是房角石，</p>","key":"<table><tr><th>原文</th><th>音譯</th><th>字面</th><th>在這裡</th></tr><tr><td>ἐποικοδομηθέντες</td><td>epoikodomēthentes</td><td>被建造在上面</td><td>被動：建造者是神</td></tr><tr><td>ἐπὶ τῷ θεμελίῳ</td><td>epi tō themeliō</td><td>在根基上</td><td>根基只打一次</td></tr><tr><td>τῶν ἀποστόλων καὶ προφητῶν</td><td>tōn apostolōn kai prophētōn</td><td>使徒和先知的</td><td>一個冠詞，兩種職分</td></tr><tr><td>ὄντος ἀκρογωνιαίου</td><td>ontos akrogōniaiou</td><td>是房角石</td><td>或作「頂石」</td></tr><tr><td>αὐτοῦ Χριστοῦ Ἰησοῦ</td><td>autou Christou Iēsou</td><td>基督耶穌自己</td><td>αὐτοῦ 加強</td></tr></table>","gram":"<p><strong>2:20 的 ἐποικοδομηθέντες（epoikodomēthentes） 是不定過去分詞被動：被建造在上面。</strong>建造者是神，石頭是信徒。</p><p>ἐπὶ τῷ θεμελίῳ τῶν ἀποστόλων καὶ προφητῶν（epi tō themeliō tōn apostolōn kai prophētōn） 有兩個問題。第一，屬格怎麼讀：「使徒和先知所立的根基」（他們的教導），還是「由使徒和先知構成的根基」？兩讀相差不大，本講義取後者兼前者：根基就是他們和他們所傳的。第二，先知是誰？τῶν（tōn） 一個冠詞統管兩個名詞，次序是使徒在前、先知在後，3:5 與 4:11 也是同樣次序，所以多數學者認為指新約的先知，不是舊約先知。</p><blockquote><p>ἀκρογωνιαίου（akrogōniaiou） 有兩說：一、房角石，奠基時第一塊放下、決定整座建築方向的石頭；二、頂石，拱門最上面鎖住全局的那一塊。這字使我們想起「寶貴的房角石」（賽 28:16），也使我們想起詩 118:22「匠人所棄的石頭已成了房角的頭塊石頭」（詩 118:22）；彼前 2:6 用了 ἀκρογωνιαῖον（akrogōniaion） 並明引以賽亞書，以弗所書這裡卻沒有標明引用，本講義照「這使我們想起」處理。放在「根基」的上下文裡，房角石一說較順。αὐτοῦ Χριστοῦ Ἰησοῦ（autou Christou Iēsou） 用 αὐτοῦ（autou） 加強：基督耶穌他自己。</p></blockquote>","exp":"<p>「並且被建造在使徒和先知的根基上，有基督耶穌自己為房角石」（2:20）。牆拆了，家要蓋；蓋房子先要根基。這個家的根基，是使徒和先知——他們所見證、所傳的基督。房角石是基督自己：整座建築的方向、水平、角度，都照這塊石頭對齊。</p><p>這一節是立場五的一塊基石。<strong>根基只打一次。</strong>沒有人蓋到十樓再去重打一次地基。新約的使徒和先知有一個不能重複的地位：他們見過復活的主，被他直接差遣，把福音的根基立好了。今天開拓、差傳、造就、安慰的功能仍然需要；但沒有人可以自稱是新的根基，用「使徒」「先知」的頭銜要求別人絕對順服，或宣稱有高過聖經的新啟示（紅線六）。</p><p>這也保護了每一間教會。一間教會若蓋在一位領袖的魅力上，那位領袖一走，房子就斜了。蓋在使徒的根基、對齊基督這塊房角石，房子才不倚靠任何一個人站立。321 的「聖經是我的準則」在這裡有一個建築的樣子：準則就是根基，根基不是拿來展示的，是拿來承重的。</p><p>房角石的圖像還有一層意思：每一塊石頭都要對齊它，而不是對齊旁邊那一塊。教會裡的人彼此比較，很容易歪；各自對齊基督，才會彼此平行。</p>"},{"a":21,"z":22,"star":1,"grk":"<p lang=\"grc\">ἐν ᾧ πᾶσα οἰκοδομὴ συναρμολογουμένη αὔξει εἰς ναὸν ἅγιον ἐν κυρίῳ,</p><p lang=\"grc\">ἐν ᾧ καὶ ὑμεῖς συνοικοδομεῖσθε εἰς κατοικητήριον τοῦ θεοῦ ἐν πνεύματι.</p>","lit":"<p>在他裡面，整個建築被聯絡在一起，長大成為在主裡的聖殿，</p><p>在他裡面，你們也一同被建造，成為神在靈裡的居所。</p>","key":"<table><tr><th>原文</th><th>音譯</th><th>字面</th><th>在這裡</th></tr><tr><td>πᾶσα οἰκοδομὴ συναρμολογουμένη</td><td>pasa oikodomē synarmologoumenē</td><td>整個建築被聯絡得合式</td><td>4:16 再用</td></tr><tr><td>αὔξει</td><td>auxei</td><td>正在長大</td><td>房子會長：活的建築</td></tr><tr><td>εἰς ναὸν ἅγιον ἐν κυρίῳ</td><td>eis naon hagion en kyriō</td><td>成為在主裡的聖殿</td><td>ναὸν：殿的本體</td></tr><tr><td>συνοικοδομεῖσθε</td><td>synoikodomeisthe</td><td>你們一同被建造</td><td>現在式被動</td></tr><tr><td>εἰς κατοικητήριον τοῦ θεοῦ ἐν πνεύματι</td><td>eis katoikētērion tou theou en pneumati</td><td>成為神在聖靈裡的居所</td><td>全章最後一句</td></tr></table>","gram":"<p><strong>2:21–22 兩節都以 ἐν ᾧ（en hō） 起頭，回指基督這塊房角石。</strong>πᾶσα οἰκοδομὴ（pasa oikodomē） 沒有冠詞，可以讀成「每一座建築」或「整座建築」；在通用希臘文裡兩讀都可能，上下文講一座殿，和合本譯「各房」，兼顧了兩者。συναρμολογουμένη（synarmologoumenē） 是現在被動分詞：正在被聯絡、被接合，4:16 用同一個字說身體「聯絡得合式」。</p><p>αὔξει（auxei） 是「長大」——房子不會長，身體才會長；保羅把建築和身體兩個圖像疊在一起。εἰς ναὸν ἅγιον（eis naon hagion） 用 ναὸν（naon） 而不是 ἱερόν（hieron），指殿的本體、神同在的所在。2:22 συνοικοδομεῖσθε（synoikodomeisthe） 是現在式被動，加了 σύν（syn） 字首：你們也一同正在被建造。全章最後一句 εἰς κατοικητήριον τοῦ θεοῦ ἐν πνεύματι（eis katoikētērion tou theou en pneumati），再一次是三一神：神、在主裡、在聖靈裡。</p>","exp":"<p>「各房靠他聯絡得合式，漸漸成為主的聖殿」（2:21）。第 2 章從一座有隔牆的聖殿開始，結束在另一座聖殿：這座殿沒有外院、沒有牆、沒有石碑，因為它的石頭就是從前被擋在牆外的人。神不再住在耶路撒冷那座人手所造的殿裡，他要住在一群人中間。</p><p>這座殿是活的，「漸漸」在長。它不是一次蓋好的展覽館，是一個還在施工的工地，每一塊石頭都要被「聯絡得合式」。被聯絡，意思是要被切、被磨、被調整，好和旁邊那一塊對齊。這正是 321「建立屬神的體系」的樣子：體系不是一張組織圖，是一座活的聖殿——石頭彼此相接，對齊同一塊房角石。</p><p>「你們也靠他同被建造，成為神藉著聖靈居住的所在」（2:22）。神要住的地方，不是哪一位明星講員，是「你們」——複數，從前的外人和客旅，彼此相接。坐、牆、殿：死人被安置在天上，隔牆被拆毀，兩下被建成神的居所。第 2 章最後的問題不是「我坐上了哪個位子」，是「我願不願意被聯絡，成為別人旁邊合式的一塊石頭」。</p>"}],"3":[{"a":1,"z":1,"star":2,"grk":"<p lang=\"grc\">Τούτου χάριν ἐγὼ Παῦλος ὁ δέσμιος τοῦ Χριστοῦ Ἰησοῦ ὑπὲρ ὑμῶν τῶν ἐθνῶν—</p>","lit":"<p>為了這個緣故，我保羅，基督耶穌的那個囚犯，為了你們這些外邦人——</p>","key":"<table><tr><th>原文</th><th>音譯</th><th>字面</th><th>在這裡</th></tr><tr><td>Τούτου χάριν</td><td>Toutou charin</td><td>為了這個緣故</td><td>回指 2:11–22 拆毀的牆、神的家</td></tr><tr><td>ἐγὼ Παῦλος</td><td>egō Paulos</td><td>我，保羅</td><td>全信唯二自稱名字之處（1:1；3:1）</td></tr><tr><td>ὁ δέσμιος τοῦ Χριστοῦ Ἰησοῦ</td><td>ho desmios tou Christou Iēsou</td><td>基督耶穌的囚犯</td><td>屬格：是基督的囚犯，不是羅馬的</td></tr><tr><td>ὑπὲρ ὑμῶν τῶν ἐθνῶν</td><td>hyper hymōn tōn ethnōn</td><td>為了你們外邦人</td><td>鎖鍊的理由：為外邦人</td></tr></table>","gram":"<p><strong>3:1 是一個沒有說完的句子。</strong></p><p>Τούτου χάριν ἐγὼ Παῦλος ὁ δέσμιος τοῦ Χριστοῦ Ἰησοῦ ὑπὲρ ὑμῶν τῶν ἐθνῶν（Toutou charin egō Paulos ho desmios tou Christou Iēsou hyper hymōn tōn ethnōn）——主詞有了，同位語有了，介系詞片語也有了，就是沒有主要動詞。SBLGNT 在句末放一道長破折號，表示句子在這裡中斷。保羅一說出「為你們外邦人」，就岔開去解釋自己為甚麼會為外邦人坐監，這一岔就是 3:2–13 整整十二節。到 3:14 他用同一個 Τούτου χάριν（Toutou charin） 重新起頭，才接回原來的話：「因此，我在父面前屈膝」（3:14）。</p><p>和合本把句子補完，加上「替你們祈禱」（3:1）；cu89t 的註腳說明這四個字是照第十四節所加，原文沒有。這是好的翻譯判斷：讀者一開始就知道保羅要說的是禱告。但讀原文的人要知道，這一句是懸著的，懸了十二節。</p><blockquote><p>ὁ δέσμιος（ho desmios） 帶冠詞，是「那個囚犯」，一個眾所周知的身分。屬格 τοῦ Χριστοῦ Ἰησοῦ（tou Christou Iēsou） 可以讀成所屬（基督的囚犯）或來源（因基督而被囚）；兩者並不衝突。4:1 換成 ὁ δέσμιος ἐν κυρίῳ（ho desmios en kyriō），「在主裡的囚犯」；6:20 說自己是「帶鎖鍊的使者」（6:20）。全信三次提到鎖鍊，一次比一次靠近人。</p></blockquote>","exp":"<p>〔背景〕徒 28:16--31（使徒行傳講義第 28 章）</p><p>第 2 章剛剛說完一道牆被拆了：「拆毀了中間隔斷的牆」（2:14）。第 3 章一開口，寫信的人卻在牆裡。使徒行傳講義第 28 章講過羅馬的軟禁：「保羅蒙准和一個看守他的兵另住在一處」（徒 28:16），手上拴著鍊子，門卻是開的，「凡來見他的人，他全都接待」（徒 28:30）。保羅坐監，正是因為被誣告帶外邦人越過聖殿的那道矮牆（徒 21:28–29）。他為那道牆被捆，卻在信裡宣告那道牆已經倒了。</p><p>他怎麼稱呼自己？不是「羅馬的囚犯」，是「基督耶穌被囚的」（3:1）。綁住他的鍊子是羅馬的，握著鍊子另一頭的卻是基督。這不是自我安慰的修辭，是一個人看清了自己真正的主人。誰決定了我在哪裡，誰就是我的主。</p><p>他也說清楚了理由：「為你們外邦人」（3:1）。這一份苦不是白受的，是為了一群他多半沒見過面的人。保羅並沒有把坐監看成事工中斷，他把它看成事工的一部分。</p><p>然後，這句話斷了。他本來要禱告，一想到「為你們外邦人」，就忍不住先解釋那個奧祕。這一個中斷讓我們看見保羅的心：他不是背好一篇講稿的人，是被一個真理抓住、說到一半就停不下來的人。今天許多基督徒也在某種「牆裡」——病床、失業、被誤解、一段走不出去的處境。3:1 先讓我們學會一件事：在牆裡，仍然可以說「我是基督耶穌的」。</p>"},{"a":2,"z":4,"star":2,"grk":"<p lang=\"grc\">εἴ γε ἠκούσατε τὴν οἰκονομίαν τῆς χάριτος τοῦ θεοῦ τῆς δοθείσης μοι εἰς ὑμᾶς·</p><p lang=\"grc\">κατὰ ἀποκάλυψιν ἐγνωρίσθη μοι τὸ μυστήριον, καθὼς προέγραψα ἐν ὀλίγῳ,</p><p lang=\"grc\">πρὸς ὃ δύνασθε ἀναγινώσκοντες νοῆσαι τὴν σύνεσίν μου ἐν τῷ μυστηρίῳ τοῦ Χριστοῦ,</p>","lit":"<p>你們若真是聽過那賜給我、為了你們的神恩典的管家職分；</p><p>照著啟示，那奧祕被叫我知道了，正如我先前簡短寫過的，</p><p>對此，你們讀的時候，能夠領會我在基督的奧祕上的領悟，</p>","key":"<table><tr><th>原文</th><th>音譯</th><th>字面</th><th>在這裡</th></tr><tr><td>εἴ γε ἠκούσατε</td><td>ei ge ēkousate</td><td>你們若真是聽過</td><td>εἴ γε 不是懷疑，是「想必」</td></tr><tr><td>τὴν οἰκονομίαν</td><td>tēn oikonomian</td><td>那管家的職分</td><td>οἶκος＋νόμος：管理一個家</td></tr><tr><td>τῆς χάριτος τοῦ θεοῦ</td><td>tēs charitos tou theou</td><td>神恩典的</td><td>託付的內容是恩典</td></tr><tr><td>κατὰ ἀποκάλυψιν</td><td>kata apokalypsin</td><td>照著啟示</td><td>不是推論出來的</td></tr><tr><td>τὸ μυστήριον</td><td>to mystērion</td><td>那奧祕</td><td>本章出現三次（3:3、4、9）</td></tr><tr><td>προέγραψα ἐν ὀλίγῳ</td><td>proegrapsa en oligō</td><td>我先前簡短寫過</td><td>回指 1:9–10；2:11–22</td></tr><tr><td>τὴν σύνεσίν μου</td><td>tēn synesin mou</td><td>我的領悟</td><td>把散開的拼在一起的理解</td></tr></table>","gram":"<p>3:2 以 εἴ γε（ei ge） 開頭。εἰ（ei） 是「若」，γε（ge） 是加強的小品詞；合起來不是懷疑，是溫和的假定：「你們想必已經聽說過」。和合本譯「諒必」（3:2），很準。這個語氣也是傳閱信說的一條旁證：保羅在以弗所住了將近三年，若只寫給以弗所一城，說「諒必你們聽過我的職分」就有點奇怪；若是寫給整個亞細亞、其中許多人沒見過他，就很自然。</p><p>οἰκονομίαν（oikonomian） 是本卷「家」系列的字：οἶκος（oikos） 是家，νόμος（nomos） 是規矩，合起來是管家的差事。1:10 用它講神整個計畫的「安排」，3:2 用它講保羅領受的「職分」，3:9 又回到神的安排。同一個字，一頭是神的大計畫，一頭是一個人的小差事。林前 4:1 的 οἰκονόμος（oikonomos） 也是這個家族：「為神奧祕事的管家」（林前 4:1）。</p><blockquote><p>κατὰ ἀποκάλυψιν（kata apokalypsin） 放在句首強調來源；ἐγνωρίσθη（egnōristhē） 是不定過去式被動，主動者是神。προέγραψα ἐν ὀλίγῳ（proegrapsa en oligō） 指的多半就是本信前文（1:9–10；2:11–22），不是另一封失落的信。3:4 的 τὴν σύνεσίν μου（tēn synesin mou） 是「我的領悟」，σύνεσις（synesis） 原是把東西放在一起的意思——保羅不是要人佩服他懂得多，是請人自己讀了來核對。</p></blockquote>","exp":"<p>保羅在牆裡，先講自己的差事。他用的字是 οἰκονομίαν（oikonomian），一個家裡的管家職分。管家不是主人，家產不是他的，鑰匙卻在他手上。他說這份職分是「神賜恩給我」（3:2）的，又是「關切你們」的——託付給他，目的地卻是別人。</p><p>這個奧祕怎麼來的？「用啟示使我知道」（3:3）。保羅不是坐在書房裡推論出外邦人也可以進來，大馬士革路上的那一位直接向他顯明了（加 1:12）。所以他講這件事時那麼篤定：這不是他的主張，是他受託看管的東西。</p><p>值得注意的是 3:4 的語氣。「你們念了，就能曉得我深知基督的奧祕」（3:4）。他沒有說「你們要相信我」，而是說「你們念了」。他把信攤開，請人自己讀、自己判斷。一個確知自己蒙了啟示的人，仍然願意被檢驗，這是健康的屬靈權柄的樣子；哥林多後書講義講過同一件事：權柄是用來造就人，不是用來壓人的。</p><p>管家這個身分，對今天每一個服事的人都是一面鏡子。我們手上有的——恩賜、職位、一個小組、一份講稿——都是託付，不是產業。管家最常犯的錯，不是不做事，是慢慢忘了這個家不是他的。保羅在監裡還記得：這是神的家，我只是拿鑰匙的人。</p>"},{"a":5,"z":5,"star":2,"grk":"<p lang=\"grc\">ὃ ἑτέραις γενεαῖς οὐκ ἐγνωρίσθη τοῖς υἱοῖς τῶν ἀνθρώπων ὡς νῦν ἀπεκαλύφθη τοῖς ἁγίοις ἀποστόλοις αὐτοῦ καὶ προφήταις ἐν πνεύματι,</p>","lit":"<p>這奧祕在別的世代沒有被叫人的眾子知道，像如今在靈裡被啟示給他聖別的使徒和先知一樣，</p>","key":"<table><tr><th>原文</th><th>音譯</th><th>字面</th><th>在這裡</th></tr><tr><td>ἑτέραις γενεαῖς</td><td>heterais geneais</td><td>在別的世代</td><td>與格表時間</td></tr><tr><td>οὐκ ἐγνωρίσθη</td><td>ouk egnōristhē</td><td>沒有被叫人知道</td><td>不是沒有預言，是沒有看清</td></tr><tr><td>ὡς νῦν ἀπεκαλύφθη</td><td>hōs nyn apekalyphthē</td><td>像如今被啟示</td><td>「如今」：全卷從前與如今的對照</td></tr><tr><td>τοῖς ἁγίοις ἀποστόλοις αὐτοῦ καὶ προφήταις</td><td>tois hagiois apostolois autou kai prophētais</td><td>給他聖別的使徒和先知</td><td>一個冠詞統管兩者</td></tr><tr><td>ἐν πνεύματι</td><td>en pneumati</td><td>在靈裡</td><td>啟示的媒介是聖靈</td></tr></table>","gram":"<p>3:5 用 ὡς（hōs） 作比較：「不像如今」——是程度的對比，不是全有全無。舊約並非對外邦人蒙福一字不提，神對亞伯拉罕說過「地上的萬族都要因你得福」（創 12:3）。保羅的意思是：從前沒有人看清外邦人會以外邦人的身分、與猶太人同等地成為一個身體；νῦν ἀπεκαλύφθη（nyn apekalyphthē），如今才被揭開。</p><p>τοῖς ἁγίοις ἀποστόλοις αὐτοῦ καὶ προφήταις（tois hagiois apostolois autou kai prophētais） 一個冠詞統管「使徒」與「先知」，把他們看成一組人；2:20 說教會「被建造在使徒和先知的根基上」（2:20），也是同一組。這裡的先知排在使徒後面、同屬啟示的領受者，多數註釋家因此認為指的是新約的先知，而不是舊約的先知。ἁγίοις（hagiois） 修飾使徒，不是使徒自稱聖潔，是說他們被分別出來領受這個啟示。</p><blockquote><p>ἐν πνεύματι（en pneumati） 放在句末，可以連「啟示」（藉著聖靈啟示），也可以連「先知」（在靈裡說話的先知）；和合本取前者，本講義從之。</p></blockquote>","exp":"<p>奧祕的意思不是神祕難懂，是「從前藏著、如今打開了」。3:5 把這個對照寫得很清楚：「這奧祕在以前的世代沒有叫人知道，像如今藉著聖靈啟示他的聖使徒和先知一樣」（3:5）。這正是全卷「從前」與「如今」的對照，搬到了啟示史上。</p><p>領受這個啟示的是「聖使徒和先知」（3:5）。這一節連著 2:20 的「根基」：使徒和先知是神用來打地基的人。<strong>地基只打一次。</strong>新約的使徒見過復活的主、由他直接差遣（徒 1:21–22；林前 9:1），他們領受、寫下的啟示成了新約，今天沒有人能在上面再加一塊根基石。這是本講義全卷立場五的起點：使徒性的開拓、先知性的造就勸勉今天仍然需要，但不以頭銜要求順服，也不發布高過聖經的新啟示（見 ISS00_5）。止息論、溫和延續論與新使徒改革運動的分歧，第 4 章再並陳。</p><p>這一節也提醒我們一件常被忽略的事：保羅說這啟示不是只給他一個人的。上一節他才講「我深知基督的奧祕」（3:4），這一節立刻把自己放回一群人裡——眾使徒和先知一同領受。他沒有把奧祕變成私人的專利。今天若有人說「只有我看見了神的計畫，你們都要跟著我」，3:5 就是一道簡單的檢驗：真正從神來的啟示，會讓人回到群體與聖經，不會讓人離開。</p>"},{"a":6,"z":7,"star":3,"grk":"<p lang=\"grc\">εἶναι τὰ ἔθνη συγκληρονόμα καὶ σύσσωμα καὶ συμμέτοχα τῆς ἐπαγγελίας ἐν Χριστῷ Ἰησοῦ διὰ τοῦ εὐαγγελίου,</p><p lang=\"grc\">οὗ ἐγενήθην διάκονος κατὰ τὴν δωρεὰν τῆς χάριτος τοῦ θεοῦ τῆς δοθείσης μοι κατὰ τὴν ἐνέργειαν τῆς δυνάμεως αὐτοῦ—</p>","lit":"<p>就是外邦人是同作後嗣的、同一個身體的、同享應許的，在基督耶穌裡，藉著福音；</p><p>我被造成了這福音的僕役，是照著神恩典的禮物，就是照著他能力的運行賜給我的那恩典——</p>","key":"<table><tr><th>原文</th><th>音譯</th><th>字面</th><th>在這裡</th></tr><tr><td>εἶναι τὰ ἔθνη</td><td>einai ta ethnē</td><td>外邦人是</td><td>不定詞：奧祕的內容</td></tr><tr><td>συγκληρονόμα</td><td>synklēronoma</td><td>同作後嗣的</td><td>syn-＋分產業的人</td></tr><tr><td>σύσσωμα</td><td>syssōma</td><td>同一個身體的</td><td>可能是保羅自造的字</td></tr><tr><td>συμμέτοχα</td><td>symmetocha</td><td>同享有份的</td><td>同分一份應許</td></tr><tr><td>ἐν Χριστῷ Ἰησοῦ</td><td>en Christō Iēsou</td><td>在基督耶穌裡</td><td>本卷「在基督裡」追蹤站</td></tr><tr><td>διάκονος</td><td>diakonos</td><td>僕役、執事</td><td>從管家降到端盤子的人</td></tr><tr><td>κατὰ τὴν ἐνέργειαν τῆς δυνάμεως αὐτοῦ</td><td>kata tēn energeian tēs dynameōs autou</td><td>照著他能力的運行</td><td>1:19；3:20 同一組字</td></tr></table>","gram":"<p><strong>3:6 是本章的心臟：奧祕終於被說出來了。</strong></p><p>εἶναι τὰ ἔθνη（einai ta ethnē） 用不定詞說明奧祕的內容：「外邦人是……」。接著三個形容詞一字排開，都以 syn-（同）起頭：συγκληρονόμα（synklēronoma）、σύσσωμα（syssōma）、συμμέτοχα（symmetocha）。第一個字新約別處也有（羅 8:17「和基督同作後嗣」）；σύσσωμα（syssōma） 在希臘文獻裡找不到更早的例子，很可能是保羅為了這一句自造的；συμμέτοχα（symmetocha） 在新約也只見於本卷（3:6；5:7）。三個 syn- 字首是一組刻意的音韻，連讀起來就是一個「同」字敲三下。</p><p>三個字由外而內：後嗣是產業上的地位，一體是身體上的連結，同蒙應許是信仰上的份。猶太人與外邦人不是並排站，是被焊在一起。後面三個修飾語各有分工：τῆς ἐπαγγελίας（tēs epangelias） 屬於第三個字；ἐν Χριστῷ Ἰησοῦ（en Christō Iēsou） 說明地點；διὰ τοῦ εὐαγγελίου（dia tou euangeliou） 說明管道。</p><blockquote><p>3:7 的 διάκονος（diakonos） 原是端盤子、跑腿的僕役。3:2 他是管家，3:7 他是僕役——保羅描述自己的字，一節比一節低。ἐγενήθην（egenēthēn） 是不定過去式被動形：「我被造成了」執事；照的是 τὴν δωρεὰν τῆς χάριτος（tēn dōrean tēs charitos），白白的恩典禮物。</p></blockquote>","exp":"<p>那個讓保羅說到一半就岔開的奧祕，到這裡揭曉了：「這奧祕就是外邦人在基督耶穌裡，藉著福音，得以同為後嗣，同為一體，同蒙應許」（3:6）。</p><p>對第一世紀的猶太人，這是不可想像的。外邦人可以歸化，可以敬畏神，可以在聖殿外院敬拜；但與以色列人「同為後嗣」，分同一份產業？「同為一體」，成為同一個身體？那道刻著「越過者死罪自負」的牆，就是為了阻止這件事立的。保羅說：那道牆攔不住的，基督已經做成了。</p><p>三個「同」字是三種關係。<strong>同為後嗣</strong>，外邦人不是寄人籬下的客人，是名字寫在遺囑上的兒女；<strong>同為一體</strong>，不是兩個團體結盟，是一個身體長在一起，傷一處就疼全身；<strong>同蒙應許</strong>，給亞伯拉罕的應許，外邦人有完整的一份，不是二等的。這三個字回應了 2:19：「你們不再作外人和客旅」（2:19）。</p><p>這一切都發生在「在基督耶穌裡」，而且「藉著福音」（3:6）。不是靠種族、文化、守律法，是靠一個好消息。所以保羅說自己「作了這福音的執事」（3:7）。他不是福音的主人，是端著它給人的僕人；連這份僕人的工作，都是「照神的恩賜」，靠「他運行的大能」（3:7）。</p><p>今天的教會很少再爭外邦人能不能入會，但「同」字仍然常常被打折扣：本地人與新移民、老會友與新來的、有學歷的與沒學歷的、這個語言堂與那個語言堂。3:6 量的是一件事：在我們的教會裡，有沒有人只是被容許坐在旁邊，卻從來沒有被當成同一個身體？神的奧祕不是讓不同的人各坐一桌，是讓他們同坐一桌。</p>"},{"a":8,"z":8,"star":3,"grk":"<p lang=\"grc\">ἐμοὶ τῷ ἐλαχιστοτέρῳ πάντων ἁγίων ἐδόθη ἡ χάρις αὕτη— τοῖς ἔθνεσιν εὐαγγελίσασθαι τὸ ἀνεξιχνίαστον πλοῦτος τοῦ Χριστοῦ,</p>","lit":"<p>給我這比一切聖徒中最小的還更小的，這恩典被賜下了——要向外邦人傳講基督那追蹤不到的豐富，</p>","key":"<table><tr><th>原文</th><th>音譯</th><th>字面</th><th>在這裡</th></tr><tr><td>ἐμοὶ τῷ ἐλαχιστοτέρῳ</td><td>emoi tō elachistoterō</td><td>給我這比最小還更小的</td><td>最高級＋比較級：保羅自造</td></tr><tr><td>πάντων ἁγίων</td><td>pantōn hagiōn</td><td>所有聖徒的</td><td>不是比使徒，是比所有聖徒</td></tr><tr><td>ἐδόθη ἡ χάρις αὕτη</td><td>edothē hē charis hautē</td><td>這恩典被賜下了</td><td>被動：主動者是神</td></tr><tr><td>εὐαγγελίσασθαι</td><td>euangelisasthai</td><td>傳福音</td><td>恩典的內容就是差事</td></tr><tr><td>τὸ ἀνεξιχνίαστον πλοῦτος</td><td>to anexichniaston ploutos</td><td>那追蹤不到的豐富</td><td>ἴχνος 是腳印：找不到盡頭</td></tr></table>","gram":"<p><strong>ἐλαχιστοτέρῳ（elachistoterō） 是全本新約講謙卑最奇特的一個字。</strong></p><p>ἐλάχιστος（elachistos） 本身已是最高級，「最小的」；保羅在最高級後面再加上比較級字尾，造出一個文法上不該存在的字：「比最小的更小」。和合本譯成「比眾聖徒中最小的還小」（3:8），把這個疊上去的意味譯出來了。希臘文偶有這種「雙重比較」的口語用法，但在保羅書信裡只有這一處。</p><p>比較的對象也值得注意。林前 15:9 他說「我原是使徒中最小的」（林前 15:9），比的是使徒；3:8 比的是 πάντων ἁγίων（pantōn hagiōn），所有的聖徒；提前 1:15 更說「在罪人中我是個罪魁」（提前 1:15）。學者觀察到一條往下的線：使徒中最小，聖徒中更小，罪人中第一。</p><blockquote><p>句子的重心在後半：ἐδόθη ἡ χάρις αὕτη（edothē hē charis hautē），「這恩典被賜下了」。不定過去式被動，主動者是神。εὐαγγελίσασθαι（euangelisasthai） 緊接在後，說明恩典的內容就是差事。τὸ ἀνεξιχνίαστον πλοῦτος（to anexichniaston ploutos） 的字根 ἴχνος（ichnos） 是腳印：沿著腳印追，追不到盡頭；羅 11:33 用同一個字說神的蹤跡難尋。</p></blockquote>","exp":"<p>「我本來比眾聖徒中最小的還小」（3:8）。這句話出自全卷最懂奧祕的人之口。上一段他才說「我深知基督的奧祕」（3:4），下一句就把自己放到最低處。保羅為甚麼要特地造一個字來說自己小？</p><p>這是真謙卑，還是修辭？有些學者認為這是書信的謙遜慣用語，甚至懷疑是後人替保羅說話。但這句話與他一生的自述吻合：他曾經「逼迫神的教會」（林前 15:9），他清楚知道自己是從哪裡被撿回來的。這不是自卑，自卑的人不會寫出「然而他還賜我這恩典」；也不是假謙虛，假謙虛的人等著別人說「不，你很大」。保羅說自己小，是為了讓恩典顯得大。</p><p>這是 321「謙卑」的原文。321 說驕傲是離開本位、抓住權力；謙卑是回到本位。保羅的本位在哪裡？不是在眾聖徒之上，而是在眾聖徒之下，卻仍然被託付「把基督那測不透的豐富傳給外邦人」（3:8）。<strong>最小的人，拿著最大的豐富。</strong>這兩件事不衝突，反而互相需要：一個覺得自己很大的人，端不穩一份測不透的豐富，他會不知不覺把豐富換成自己的大小。</p><p>「測不透」的原文是追蹤不到腳印。基督的豐富不是一口井，打到底就沒了；是一條追不到盡頭的路。這也解釋了保羅為甚麼越走越小：他越往基督的豐富裡走，就越看見自己有多小。謙卑不是壓低自己的技巧，是看見基督之後的自然結果。今天服事越久的人，越要問自己：我是越來越小，還是越來越大？</p>"},{"a":9,"z":10,"star":2,"grk":"<p lang=\"grc\">καὶ φωτίσαι πάντας τίς ἡ οἰκονομία τοῦ μυστηρίου τοῦ ἀποκεκρυμμένου ἀπὸ τῶν αἰώνων ἐν τῷ θεῷ τῷ τὰ πάντα κτίσαντι</p><p lang=\"grc\">ἵνα γνωρισθῇ νῦν ταῖς ἀρχαῖς καὶ ταῖς ἐξουσίαις ἐν τοῖς ἐπουρανίοις διὰ τῆς ἐκκλησίας ἡ πολυποίκιλος σοφία τοῦ θεοῦ,</p>","lit":"<p>並且照亮眾人，那從萬世以來隱藏在創造萬有的神裡面之奧祕的安排是甚麼，</p><p>為要如今藉著教會，使天上的那些執政的和那些掌權的，得知神多彩多樣的智慧，</p>","key":"<table><tr><th>原文</th><th>音譯</th><th>字面</th><th>在這裡</th></tr><tr><td>φωτίσαι πάντας</td><td>phōtisai pantas</td><td>照亮眾人</td><td>1:18「照明」同一個字</td></tr><tr><td>ἡ οἰκονομία τοῦ μυστηρίου</td><td>hē oikonomia tou mystēriou</td><td>奧祕的安排</td><td>3:2 的「職分」在這裡是神的安排</td></tr><tr><td>τοῦ ἀποκεκρυμμένου ἀπὸ τῶν αἰώνων</td><td>tou apokekrymmenou apo tōn aiōnōn</td><td>那從萬世以來被隱藏的</td><td>完成式：一直藏著</td></tr><tr><td>ταῖς ἀρχαῖς καὶ ταῖς ἐξουσίαις</td><td>tais archais kai tais exousiais</td><td>執政的和掌權的</td><td>1:21；6:12 同一組</td></tr><tr><td>διὰ τῆς ἐκκλησίας</td><td>dia tēs ekklēsias</td><td>藉著教會</td><td>教會是展示的管道</td></tr><tr><td>ἡ πολυποίκιλος σοφία</td><td>hē polypoikilos sophia</td><td>多彩多樣的智慧</td><td>全本新約只此一處</td></tr></table>","gram":"<p>3:9 的 φωτίσαι（phōtisai） 與 1:18「照明你們心中的眼睛」（1:18）是同一個字根。保羅的差事不只是報告一個消息，是讓人「看見」。τοῦ ἀποκεκρυμμένου（tou apokekrymmenou） 是完成式分詞：這奧祕一直被藏著，而且藏的地方是 ἐν τῷ θεῷ τῷ τὰ πάντα κτίσαντι（en tō theō tō ta panta ktisanti），在創造萬物的神裡面——救恩的計畫不是創造之後的補救，是創造主心中早就有的。</p><p>3:10 以 ἵνα（hina） 帶出目的：γνωρισθῇ νῦν（gnōristhē nyn），「如今被知道」。受眾是 ταῖς ἀρχαῖς καὶ ταῖς ἐξουσίαις ἐν τοῖς ἐπουρανίοις（tais archais kai tais exousiais en tois epouraniois），與 1:21 基督遠超過的那一群、6:12 我們要抵擋的那一群是同一組字。管道是 διὰ τῆς ἐκκλησίας（dia tēs ekklēsias）。</p><blockquote><p>πολυποίκιλος（polypoikilos） 由「多」加上「彩色、花樣繁多」組成，可以用來形容繡花的布、花環、一片花圃。全本新約只此一處；彼前 4:10 用較簡單的 ποικίλης（poikilēs） 說神「百般恩賜」。這些天上的執政掌權者，學者有兩說：一說包括善惡兩類天使，都在觀看；一說主要指敵對的勢力，教會的存在本身就是對它們的宣告。本講義認為兩者都在視野裡，而 6:12 的語境使後者更突出。</p></blockquote>","exp":"<p>神的奧祕要讓誰知道？3:9 說「使眾人都明白」（3:9），3:10 範圍忽然放大到天上：「為要藉著教會使天上執政的、掌權的，現在得知神百般的智慧」（3:10）。</p><p>這是全本新約對教會最驚人的一句描述之一。教會不只是一群得救的人聚在一起，是神向全宇宙展示的作品。天上的執政掌權者看甚麼？看一群本來互相厭惡的人——猶太人與外邦人、主人與奴隸、希臘人與化外人——坐在同一張桌子上，稱同一位為父。那就是「百般的智慧」：不是單色的，是像一塊繡滿各色絲線的布，每一種顏色都保留，卻織成同一幅圖。</p><p>天使也從教會學習嗎？彼前 1:12 說天使「願意詳細察看」福音的事。這裡的意思是：有些關於神的事，天使不是聽來的，是看來的；而他們看的地方，就是教會。這也牽涉到全卷立場四：執政掌權者是真實的靈界勢力，但勝負已定，教會不是去跟它們表演爭戰，而是以合一的存在本身宣告基督的得勝（見 ISS00_4）。教會的合一，就是對黑暗權勢最有力的宣告。</p><p>這也是一個沉重的提醒。如果教會是神的展示櫥窗，一間分裂、彼此攻擊、按族群分桌的教會，展示的是甚麼？天上的觀眾看見的，不會是神百般的智慧，只會是人單調的驕傲。反過來，一個小小的家庭小組，裡面有老有少、有本地有外地，大家在同一張桌上擘餅，可能正是天上最注目的一幕。</p>"},{"a":11,"z":12,"star":1,"grk":"<p lang=\"grc\">κατὰ πρόθεσιν τῶν αἰώνων ἣν ἐποίησεν ἐν τῷ Χριστῷ Ἰησοῦ τῷ κυρίῳ ἡμῶν,</p><p lang=\"grc\">ἐν ᾧ ἔχομεν τὴν παρρησίαν καὶ προσαγωγὴν ἐν πεποιθήσει διὰ τῆς πίστεως αὐτοῦ.</p>","lit":"<p>是照著萬世的旨意，就是他在基督耶穌我們的主裡面所成就的，</p><p>在他裡面，我們有那坦然無懼和進到面前的門路，在確信之中，藉著對他的信。</p>","key":"<table><tr><th>原文</th><th>音譯</th><th>字面</th><th>在這裡</th></tr><tr><td>κατὰ πρόθεσιν τῶν αἰώνων</td><td>kata prothesin tōn aiōnōn</td><td>照著萬世的旨意</td><td>1:11「預定」同一字族</td></tr><tr><td>ἣν ἐποίησεν</td><td>hēn epoiēsen</td><td>他所成就的</td><td>可譯「定」，也可譯「實行」</td></tr><tr><td>τὴν παρρησίαν</td><td>tēn parrēsian</td><td>坦然無懼</td><td>公民在議會說話的自由</td></tr><tr><td>προσαγωγὴν</td><td>prosagōgēn</td><td>進到面前的門路</td><td>2:18 已用過</td></tr><tr><td>ἐν πεποιθήσει</td><td>en pepoithēsei</td><td>在確信中</td><td>篤信不疑</td></tr></table>","gram":"<p>κατὰ πρόθεσιν τῶν αἰώνων（kata prothesin tōn aiōnōn） 直譯是「照著萬世的旨意」，屬格可讀成「萬世以來的」或「貫穿萬世的」；和合本譯「從萬世以前……所定的旨意」（3:11）。πρόθεσιν（prothesin） 與 1:11 的 πρόθεσιν（prothesin） 是同一個字。關係子句 ἣν ἐποίησεν（hēn epoiēsen） 的動詞 ποιέω（poieō） 可以指「定下」，也可以指「實現」；加上 ἐν τῷ Χριστῷ Ἰησοῦ τῷ κυρίῳ ἡμῶν（en tō Christō Iēsou tō kyriō hēmōn），多數註釋傾向「在基督裡實現了」——旨意早就定了，在歷史上的基督身上完成了。</p><p>3:12 的兩個名詞共用一個冠詞：τὴν παρρησίαν καὶ προσαγωγὴν（tēn parrēsian kai prosagōgēn），是同一件事的兩面。παρρησία（parrēsia） 原是希臘城邦公民在議會裡自由發言的權利；προσαγωγή（prosagōgē） 是被引到君王面前的門路，2:18 已經用過。διὰ τῆς πίστεως αὐτοῦ（dia tēs pisteōs autou） 可以讀成「因信他」（受詞屬格），和合本作「因信耶穌」（3:12），本講義從之。</p>","exp":"<p>3:11 把前面的一切拉回到起點：這不是保羅的策略，也不是教會的計畫，是「照神從萬世以前，在我們主基督耶穌裡所定的旨意」（3:11）。外邦人進來不是神臨時改變主意，是神從起初就要做的事，而且已經在基督裡完成了。</p><p>這個宏大的旨意，落到 3:12 卻是一個很個人的畫面：「我們因信耶穌，就在他裡面放膽無懼，篤信不疑地來到神面前」（3:12）。萬世的計畫，最後變成一個人可以直接走到父面前。原文的「放膽無懼」是公民說話的權利，不是客人怯生生地站在門口。外邦人從前連聖殿內院都不能進，如今可以直接進到神面前。</p><p>這也解釋了為甚麼 3:12 緊接著 3:13：監獄裡的人仍然放膽。鍊子綁得住手，綁不住一個人到父面前的路。今天許多信主多年的人，禱告時仍像在面試，怕說錯話、怕不夠屬靈。3:12 說：你進去不是靠你的表現，是「在他裡面」。門是基督開的，所以可以放膽。</p>"},{"a":13,"z":13,"star":1,"grk":"<p lang=\"grc\">διὸ αἰτοῦμαι μὴ ἐγκακεῖν ἐν ταῖς θλίψεσίν μου ὑπὲρ ὑμῶν, ἥτις ἐστὶν δόξα ὑμῶν.</p>","lit":"<p>所以我求你們不要在我為你們所受的患難中灰心，這就是你們的榮耀。</p>","key":"<table><tr><th>原文</th><th>音譯</th><th>字面</th><th>在這裡</th></tr><tr><td>διὸ αἰτοῦμαι</td><td>dio aitoumai</td><td>所以我求</td><td>從 3:12 的放膽推出</td></tr><tr><td>μὴ ἐγκακεῖν</td><td>mē enkakein</td><td>不要灰心</td><td>路 18:1 不可灰心</td></tr><tr><td>ἐν ταῖς θλίψεσίν μου</td><td>en tais thlipsesin mou</td><td>在我的患難中</td><td>複數：不只一次</td></tr><tr><td>ἥτις ἐστὶν δόξα ὑμῶν</td><td>hētis estin doxa hymōn</td><td>這就是你們的榮耀</td><td>關係代名詞指整件事</td></tr></table>","gram":"<p>διὸ（dio） 是「所以」，從 3:12 的放膽推出 3:13 的請求。αἰτοῦμαι（aitoumai） 是中間語態，「我求」；求的對象可以是神（我求神使你們不灰心），也可以是讀者（我求你們不要灰心）。和合本取後者，本講義從之，因為 3:14 才正式轉向對父的禱告。</p><p>ἐγκακεῖν（enkakein） 是「灰心、洩氣、累到放棄」，路 18:1 耶穌講禱告不可灰心、林後 4:1 保羅說「就不喪膽」都用這個字。ἥτις ἐστὶν δόξα ὑμῶν（hētis estin doxa hymōn） 的關係代名詞 ἥτις（hētis） 是陰性單數，被 δόξα（doxa） 吸引了性別，指的是保羅受苦這整件事：我為你們受的苦，就是你們的榮耀。</p>","exp":"<p>坐監的人寫信安慰外面的人：「所以，我求你們不要因我為你們所受的患難喪膽，這原是你們的榮耀」（3:13）。</p><p>亞細亞的信徒聽說保羅被囚，第一個反應可能是灰心：傳給我們福音的人都坐監了，這福音還靠得住嗎？保羅反過來說：我的患難正是你們有多寶貴的證據。一個人願意為你坐牢，說明你在神眼中的份量。外邦人能與以色列人同為一體，付上了代價；保羅的鍊子就是那代價的一部分。</p><p>受苦怎麼會是榮耀？不是因為苦本身好，是因為苦有方向。保羅的苦是「為你們」的。西 1:24 說「現在我為你們受苦，倒覺歡樂」（西 1:24）。苦若只是苦，會叫人喪膽；苦若是為了別人得著福音，就成了榮耀。</p><p>在全卷地勢圖上，3:13 是一塊平地：一個坐監的人，一群可能洩氣的讀者。可是只隔八節，就是全卷最高點 3:21。從平地到山頂，中間是一段跪下來的禱告。今天在苦難中的人不必假裝不苦；3:13 只是請我們不要在苦裡丟下盼望。</p>"},{"a":14,"z":15,"star":2,"grk":"<p lang=\"grc\">Τούτου χάριν κάμπτω τὰ γόνατά μου πρὸς τὸν πατέρα</p><p lang=\"grc\">ἐξ οὗ πᾶσα πατριὰ ἐν οὐρανοῖς καὶ ἐπὶ γῆς ὀνομάζεται,</p>","lit":"<p>為了這個緣故，我向著父彎下我的膝蓋，</p><p>天上和地上的每一個家族都是從他得名，</p>","key":"<table><tr><th>原文</th><th>音譯</th><th>字面</th><th>在這裡</th></tr><tr><td>Τούτου χάριν</td><td>Toutou charin</td><td>為了這個緣故</td><td>接回 3:1 中斷的句子</td></tr><tr><td>κάμπτω τὰ γόνατά μου</td><td>kamptō ta gonata mou</td><td>我彎下我的膝蓋</td><td>跪下禱告</td></tr><tr><td>πρὸς τὸν πατέρα</td><td>pros ton patera</td><td>向著父</td><td>禱告的對象：父</td></tr><tr><td>πᾶσα πατριὰ</td><td>pasa patria</td><td>每一個家族</td><td>與 πατέρα 同字根</td></tr><tr><td>ὀνομάζεται</td><td>onomazetai</td><td>得名</td><td>命名者是主人、是源頭</td></tr></table>","gram":"<p><strong>3:14 的 Τούτου χάριν（Toutou charin） 接回 3:1 中斷的句子。</strong>岔出去的十二節講完了，保羅回到原本要說的話：「因此，我在父面前屈膝」（3:14）。</p><p>κάμπτω τὰ γόνατά μου（kamptō ta gonata mou） 是一個具體的動作。猶太人禱告的常見姿勢是站著，耶穌也說「你們站著禱告的時候」（可 11:25）；跪下通常是特別迫切、特別降服的時刻：所羅門獻殿「屈膝跪著」（王上 8:54），耶穌在客西馬尼「跪下禱告」（路 22:41），司提反臨死前「又跪下大聲喊著說」（徒 7:60）。保羅在這裡用了最謙卑的姿勢。</p><blockquote><p>3:15 有一個無法完全譯出的字根遊戲：πατέρα（父）與 πατριὰ（家族、宗族）同字根。直譯是「每一個父系家族都是從這位父得名」。πᾶσα πατριὰ（pasa patria） 可譯「各家」或「全家」，cu89t 的註腳也作「或譯：全家」。「各家」強調天上地上每一個家族都源於這位父；「全家」強調天上地上只有一個大家庭。本講義取前者，但兩者都把「家」的源頭放在父身上。</p></blockquote>","exp":"<p>保羅說到一半斷掉的句子，在這裡接上了：「因此，我在父面前屈膝」（3:14）。為了甚麼「因此」？為了 3:1 到 3:13 說的一切：外邦人同為一體、神的奧祕打開了、教會要向天上展示神的智慧。這麼大的事，保羅的回應不是策劃，是跪下。</p><p>禱告的姿勢重要嗎？站著、坐著、走路時都可以禱告，經文沒有規定。但姿勢會說話。保羅本可以站著，猶太人的習慣也是站著；他跪下了。一個比最小的還小的人，在父面前再把自己放低一次。這不是一條規矩，是一個內心的樣子被身體說出來。</p><p>他跪在誰面前？「父」。而且是「天上地上的各家，都是從他得名」（3:15）的那一位父。這一節把第 2 章的「神的家」放大到全宇宙：所有家族的源頭都是他。命名是主權，也是關係——就像父母為孩子取名，取名的人與被命名的人連在一起。猶太人有猶太人的宗族，外邦人有外邦人的家族，但他們都有同一位命名者。所以 2:19 說外邦人是「神家裡的人」（2:19），不是寄人籬下，是本來就姓這個家的姓。</p><p>華人很看重姓氏、族譜、宗祠，常常也因此築起牆來。3:15 不廢掉我們的家族，卻把每一個家族放回一位父的名下。在祂面前，沒有一個家族比另一個更高；每一個家族都是借來的名。</p>"},{"a":16,"z":17,"star":2,"grk":"<p lang=\"grc\">ἵνα δῷ ὑμῖν κατὰ τὸ πλοῦτος τῆς δόξης αὐτοῦ δυνάμει κραταιωθῆναι διὰ τοῦ πνεύματος αὐτοῦ εἰς τὸν ἔσω ἄνθρωπον,</p><p lang=\"grc\">κατοικῆσαι τὸν Χριστὸν διὰ τῆς πίστεως ἐν ταῖς καρδίαις ὑμῶν ἐν ἀγάπῃ· ἐρριζωμένοι καὶ τεθεμελιωμένοι,</p>","lit":"<p>使他照著他榮耀的豐富賜給你們，藉著他的靈，以能力被加強到裡面的人，</p><p>使基督藉著信定居在你們的心裡，在愛中；你們已經生了根、立了基，</p>","key":"<table><tr><th>原文</th><th>音譯</th><th>字面</th><th>在這裡</th></tr><tr><td>κατὰ τὸ πλοῦτος τῆς δόξης αὐτοῦ</td><td>kata to ploutos tēs doxēs autou</td><td>照著他榮耀的豐富</td><td>標準是神的豐富，不是我的需要</td></tr><tr><td>δυνάμει κραταιωθῆναι</td><td>dynamei krataiōthēnai</td><td>以能力被加強</td><td>被動：剛強是被賜的</td></tr><tr><td>εἰς τὸν ἔσω ἄνθρωπον</td><td>eis ton esō anthrōpon</td><td>到裡面的人</td><td>林後 4:16 內心</td></tr><tr><td>κατοικῆσαι τὸν Χριστὸν</td><td>katoikēsai ton Christon</td><td>使基督定居</td><td>不是作客，是住下</td></tr><tr><td>ἐρριζωμένοι καὶ τεθεμελιωμένοι</td><td>errizōmenoi kai tethemeliōmenoi</td><td>已經生根、已經立基</td><td>兩個完成式分詞</td></tr></table>","gram":"<p>3:16–19 原文又是一個長句，由三個 ἵνα（hina） 串起：3:16 ἵνα δῷ（hina dō），3:18 ἵνα ἐξισχύσητε（hina exischysēte），3:19 ἵνα πληρωθῆτε（hina plērōthēte）。禱告像一座三層的階梯：剛強、明白、被充滿。</p><p>第一層有兩個平行的不定詞：δυνάμει κραταιωθῆναι（dynamei krataiōthēnai），「以能力被加強」，與 κατοικῆσαι τὸν Χριστὸν（katoikēsai ton Christon），「使基督定居」。兩個片語各有一個「地點」：εἰς τὸν ἔσω ἄνθρωπον（eis ton esō anthrōpon） 與 ἐν ταῖς καρδίαις ὑμῶν（en tais kardiais hymōn），裡面的人與心是同一個地方。κατοικῆσαι（katoikēsai） 是 οἶκος（oikos） 字族的字，本卷「家」的追蹤站：2:19 的 πάροικοι（paroikoi） 是寄居的客旅，κατοικῆσαι（katoikēsai） 是住下來的主人。基督不是來心裡作客，是要搬進來住。</p><blockquote><p>ἐρριζωμένοι καὶ τεθεμελιωμένοι（errizōmenoi kai tethemeliōmenoi） 是兩個完成式被動分詞，一個是植物的比喻（生根），一個是建築的比喻（立基）；西 2:7 也有「在他裡面生根建造」（西 2:7）。分詞的主格文法上不太順，學者認為是保羅思路跳躍、或刻意放在句首強調。ἐν ἀγάπῃ（en agapē） 放在兩個分詞前面，可以連上句（基督在愛中住在心裡），也可以連下句（在愛中生根立基）；和合本取後者「愛心有根有基」（3:17）。</p></blockquote>","exp":"<p>保羅跪下來，先求甚麼？不是求環境改變，不是求自己出監，是求亞細亞的信徒「心裡的力量剛強起來」（3:16）。</p><p>求的標準是「按著他豐盛的榮耀」（3:16）。這是給禱告的人很大的放膽：神給的不是按照我缺多少，是按照祂有多少。力量從哪裡來？「藉著他的靈」（3:16）。力量往哪裡去？「心裡」，原文是「裡面的人」。保羅沒有求他們外面更風光，是求裡面更堅固。這是 321「用心靠聖靈」的原文：聖靈作工的地方在心，不在外表。</p><p>第二句更親密：「使基督因你們的信，住在你們心裡」（3:17）。他們已經信了，基督早已在他們裡面，保羅為甚麼還要這樣求？因為原文的「住」是定居。一個人可以讓基督住進來，卻只給他客房；保羅求的是基督在每一個房間都是主人。這也是上半卷的一條線：2:22 說教會是「神藉著聖靈居住的所在」（2:22），3:17 說每一顆心也是。</p><p>然後是兩個畫面：「叫你們的愛心有根有基」（3:17）。樹有根，風來不倒；房子有基，水來不垮。根和基都在地面以下，看不見，卻決定了地面上的一切。今天我們很容易只看地面上的果子——事工、聚會、成果；保羅跪下來為的，是看不見的那一段。愛心若沒有根，很快就累；有了基督住在心裡，愛就有了地基。</p>"},{"a":18,"z":19,"star":3,"grk":"<p lang=\"grc\">ἵνα ἐξισχύσητε καταλαβέσθαι σὺν πᾶσιν τοῖς ἁγίοις τί τὸ πλάτος καὶ μῆκος καὶ ὕψος καὶ βάθος,</p><p lang=\"grc\">γνῶναί τε τὴν ὑπερβάλλουσαν τῆς γνώσεως ἀγάπην τοῦ Χριστοῦ, ἵνα πληρωθῆτε εἰς πᾶν τὸ πλήρωμα τοῦ θεοῦ.</p>","lit":"<p>為要你們完全有力，與眾聖徒一同領悟那闊、長、高、深是甚麼，</p><p>並且知道基督那超過知識的愛，為要你們被充滿，直到神一切的豐滿。</p>","key":"<table><tr><th>原文</th><th>音譯</th><th>字面</th><th>在這裡</th></tr><tr><td>ἐξισχύσητε</td><td>exischysēte</td><td>你們能夠完全有力</td><td>加強語氣的「能夠」</td></tr><tr><td>καταλαβέσθαι</td><td>katalabesthai</td><td>抓住、領悟</td><td>中間語態：自己去抓住</td></tr><tr><td>σὺν πᾶσιν τοῖς ἁγίοις</td><td>syn pasin tois hagiois</td><td>與所有的聖徒一起</td><td>不是一個人量得完</td></tr><tr><td>πλάτος καὶ μῆκος καὶ ὕψος καὶ βάθος</td><td>platos kai mēkos kai hypsos kai bathos</td><td>闊、長、高、深</td><td>四個名詞共用一個冠詞</td></tr><tr><td>τὴν ὑπερβάλλουσαν τῆς γνώσεως ἀγάπην</td><td>tēn hyperballousan tēs gnōseōs agapēn</td><td>超過知識的愛</td><td>1:19 同一個字</td></tr><tr><td>ἵνα πληρωθῆτε</td><td>hina plērōthēte</td><td>為要你們被充滿</td><td>被動：充滿者是神</td></tr><tr><td>εἰς πᾶν τὸ πλήρωμα τοῦ θεοῦ</td><td>eis pan to plērōma tou theou</td><td>直到神一切的豐滿</td><td>本卷 πλήρωμα 追蹤站</td></tr></table>","gram":"<p>第二個 ἵνα（hina） 帶出第二層：ἐξισχύσητε（exischysēte） 是 ἰσχύω（ischyō） 加上 ἐκ（ek） 的加強形，全本新約只此一處，「完全有能力」。καταλαβέσθαι（katalabesthai） 是中間語態，「為自己抓住、領會」。四個名詞 τὸ πλάτος καὶ μῆκος καὶ ὕψος καὶ βάθος（to platos kai mēkos kai hypsos kai bathos） 只有第一個帶冠詞，四者被當成同一件事的四面。原文其實沒說量的是甚麼；和合本照 3:19 補上「基督的愛」，這是多數註釋的讀法。另有學者認為指神的智慧、或新耶路撒冷式的聖殿；本講義從和合本，因為 3:19 緊接著就說「這愛」。</p><p>3:19 是一個刻意的矛盾修辭：γνῶναί τε τὴν ὑπερβάλλουσαν τῆς γνώσεως ἀγάπην（gnōnai te tēn hyperballousan tēs gnōseōs agapēn），「去知道那超過知道的愛」。ὑπερβάλλουσαν（hyperballousan） 在 1:19 用來形容神能力的「浩大」，這裡用來形容基督的愛。</p><blockquote><p>第三個 ἵνα（hina） 帶出階梯的頂端：ἵνα πληρωθῆτε εἰς πᾶν τὸ πλήρωμα τοῦ θεοῦ（hina plērōthēte eis pan to plērōma tou theou）。εἰς（eis） 帶有方向，「被充滿，直到達到神一切的豐滿」。πληρωθῆτε（plērōthēte） 是被動，人不能自己把自己充滿。1:23 說教會是「那充滿萬有者所充滿的」（1:23），4:13 說要「滿有基督長成的身量」（4:13），πλήρωμα（plērōma） 這條線在 3:19 走到禱告的最高處。</p></blockquote>","exp":"<p>第三層禱告最大膽：「能以和眾聖徒一同明白基督的愛是何等長闊高深，並知道這愛是過於人所能測度的，便叫神一切所充滿的，充滿了你們」（3:18–19）。</p><p>最關鍵的四個字是「和眾聖徒」。基督的愛不是一個人量得完的。一個人只能量到自己走過的那一段：有人經歷過被饒恕的深，有人經歷過被接納的闊，有人經歷過在苦難中被托住的長，有人經歷過被提升的高。猶太人量到的和外邦人量到的不一樣，年長的和年輕的不一樣；要把這四面量全，需要整個身體一起。這正是第 2、3 章的落點：神把不同的人放進同一個家，其中一個原因，是只有一群不同的人才能看見愛的全貌。</p><p>長闊高深是四個方向。歷代解經家常有不同的畫面：古教父看見十字架的四端，有人看見一座立方體的聖殿，有人想到詩篇講神慈愛「天離地何等的高」（詩 103:11）。這些畫面都是聯想，不是經文的定義；經文自己說的是：這愛「過於人所能測度的」（3:19）。保羅要人知道一份不可能完全知道的愛。這不是自相矛盾，就像一個孩子知道父母愛他，卻永遠說不完那份愛有多大。知道，但沒有盡頭。</p><p>最後是被充滿。保羅不是求他們得到一點點神的東西，是求他們被「神一切所充滿的」充滿。這是被動的：人不能自己灌滿自己，只能把空間讓出來。這也是 321「無己」的一個畫面：心若被自己塞滿，就沒有地方給神的豐滿。跪下、讓基督定居、和眾聖徒一同量——這三件事都在騰出空間。今天的教會常常比較誰的聚會人多、誰的事工大；3:18–19 問的卻是：我們有沒有一起，更明白一點基督的愛？</p>"},{"a":20,"z":21,"star":3,"grk":"<p lang=\"grc\">Τῷ δὲ δυναμένῳ ὑπὲρ πάντα ποιῆσαι ὑπερεκπερισσοῦ ὧν αἰτούμεθα ἢ νοοῦμεν κατὰ τὴν δύναμιν τὴν ἐνεργουμένην ἐν ἡμῖν,</p><p lang=\"grc\">αὐτῷ ἡ δόξα ἐν τῇ ἐκκλησίᾳ καὶ ἐν Χριστῷ Ἰησοῦ εἰς πάσας τὰς γενεὰς τοῦ αἰῶνος τῶν αἰώνων· ἀμήν.</p>","lit":"<p>但歸給那位能照著在我們裡面運行的能力，成就超過一切、極其超過我們所求或所想的，</p><p>歸給他，榮耀在教會中，並在基督耶穌裡，直到萬世之世的一切世代；阿們。</p>","key":"<table><tr><th>原文</th><th>音譯</th><th>字面</th><th>在這裡</th></tr><tr><td>Τῷ δὲ δυναμένῳ</td><td>Tō de dynamenō</td><td>但那位能夠的</td><td>頌讚以與格起首</td></tr><tr><td>ὑπὲρ πάντα ποιῆσαι</td><td>hyper panta poiēsai</td><td>成就超過一切</td><td>第一層「超過」</td></tr><tr><td>ὑπερεκπερισσοῦ</td><td>hyperekperissou</td><td>極其超過地</td><td>ὑπέρ＋ἐκ＋περισσοῦ 三層疊字</td></tr><tr><td>ὧν αἰτούμεθα ἢ νοοῦμεν</td><td>hōn aitoumetha ē nooumen</td><td>我們所求或所想的</td><td>求的與連求都不敢求的</td></tr><tr><td>τὴν ἐνεργουμένην ἐν ἡμῖν</td><td>tēn energoumenēn en hēmin</td><td>在我們裡面運行的</td><td>大能的地點：我們裡面</td></tr><tr><td>ἐν τῇ ἐκκλησίᾳ καὶ ἐν Χριστῷ Ἰησοῦ</td><td>en tē ekklēsia kai en Christō Iēsou</td><td>在教會中並在基督耶穌裡</td><td>全卷最高點</td></tr><tr><td>ἀμήν</td><td>amēn</td><td>阿們</td><td>上半卷的落款</td></tr></table>","gram":"<p><strong>3:20–21 是頌讚（doxology），上半卷的落款。</strong>Τῷ δὲ δυναμένῳ（Tō de dynamenō） 以與格起首，「歸給那位能夠的」；主要子句到 3:21 才出現：αὐτῷ ἡ δόξα（autō hē doxa），「榮耀歸給他」，沒有動詞。這是新約頌讚的標準句式（羅 16:25–27；猶 24–25）。</p><p>3:20 是一連串的加碼。ὑπὲρ πάντα ποιῆσαι（hyper panta poiēsai） 已經是「超過一切」；接著 ὑπερεκπερισσοῦ（hyperekperissou） 把三個成分疊在一起：ὑπέρ（超過）、ἐκ（出來）、περισσοῦ（多餘、豐盛）。這個字在 SBLGNT 資料裡沒有 Strong 編號，新約只見於保羅（並見帖前 3:10；5:13），很可能是保羅愛用的自造強化字。和合本譯成「充充足足地」（3:20），用疊字傳達原文的疊字。</p><blockquote><p>ὧν αἰτούμεθα ἢ νοοῦμεν（hōn aitoumetha ē nooumen）：「我們所求的」與「我們所想的」——想的範圍比求的大，有些事我們想過卻不敢求。但這一節的度量衡不是我們的願望清單，是 κατὰ τὴν δύναμιν τὴν ἐνεργουμένην ἐν ἡμῖν（kata tēn dynamin tēn energoumenēn en hēmin），照著已經在我們裡面運行的大能；那是 1:19–20 叫基督從死裡復活的同一個能力。3:21 的 ἐν τῇ ἐκκλησίᾳ καὶ ἐν Χριστῷ Ἰησοῦ（en tē ekklēsia kai en Christō Iēsou） 把教會與基督並列，εἰς πάσας τὰς γενεὰς τοῦ αἰῶνος τῶν αἰώνων（eis pasas tas geneas tou aiōnos tōn aiōnōn） 是「直到萬世之世的一切世代」，時間與永恆一起疊上去。</p></blockquote>","exp":"<p>跪下來的禱告，最後站起來變成頌讚：「神能照著運行在我們心裡的大力充充足足地成就一切，超過我們所求所想的。但願他在教會中，並在基督耶穌裡，得著榮耀，直到世世代代，永永遠遠。阿們！」（3:20–21）。</p><p>這兩節很常被單獨抽出來用，所以要先說清楚它不是甚麼。3:20 不是一張空白支票，保證我求甚麼、想甚麼都會照我的意思成就。成功神學把「超過我們所求所想的」讀成更大的房子、更高的收入、更順的人生；但保羅寫這句話的時候，正戴著鍊子坐在羅馬。他沒有出監，教會也沒有發財。神「充充足足地成就」的，是前面禱告的內容：心裡剛強、基督定居、和眾聖徒明白基督的愛、被神充滿。那才是超過我們所求所想的。</p><p>那股大力在哪裡？「運行在我們心裡」（3:20）。不是在遠處等我們去求，是已經在裡面作工的能力，就是叫基督從死裡復活的那一個能力（1:19–20）。這是給軟弱的人最大的安慰：問題不在我們的力量夠不夠，在於祂的大力已經在裡面。</p><p>3:21 是全卷地勢圖的最高點：「但願他在教會中，並在基督耶穌裡，得著榮耀」（3:21）。榮耀不是在一個英雄身上，是「在教會中」——在那群同為後嗣、同為一體、同蒙應許的人身上。這是 321「讓耶穌得著一切的榮耀」最直接的經文：榮耀要在一群人身上被看見，而不是在一個講台上。</p><p>上半卷三章，從「在基督裡」的福氣開始，到「在教會中」的榮耀結束：神揀選、救贖、叫死人與基督一同坐在天上、拆毀了牆、造成一個新人、把奧祕交給一個坐監的人，最後歸結成一聲「阿們」。<strong>先坐，才會行。</strong>下一章一開口就是「所以」：「行事為人就當與蒙召的恩相稱」（4:1）。頌讚不是終點，是起步的地方。</p>"}],"4":[{"a":1,"z":1,"star":3,"grk":"<p lang=\"grc\">Παρακαλῶ οὖν ὑμᾶς ἐγὼ ὁ δέσμιος ἐν κυρίῳ ἀξίως περιπατῆσαι τῆς κλήσεως ἧς ἐκλήθητε,</p>","lit":"<p>所以我，那在主裡的囚犯，勸你們行走得配得上你們被召的那個呼召，</p>","key":"<table><tr><th>原文</th><th>音譯</th><th>字面</th><th>在這裡</th></tr><tr><td>Παρακαλῶ οὖν</td><td>Parakalō oun</td><td>所以我勸</td><td>全卷第一個勸勉動詞；οὖν 把前三章整個接過來</td></tr><tr><td>ὁ δέσμιος ἐν κυρίῳ</td><td>ho desmios en kyriō</td><td>在主裡的囚犯</td><td>3:1 說「基督耶穌被囚的」，這裡說「在主裡」</td></tr><tr><td>ἀξίως</td><td>axiōs</td><td>相稱地、配得上地</td><td>字根 ἄξιος：天平兩邊等重</td></tr><tr><td>περιπατῆσαι</td><td>peripatēsai</td><td>行走</td><td>不定過去式不定詞；全卷「行」的起點</td></tr><tr><td>τῆς κλήσεως ἧς ἐκλήθητε</td><td>tēs klēseōs hēs eklēthēte</td><td>你們被召的那個呼召</td><td>同字根重複：呼召、被召</td></tr></table>","gram":"<p><strong>4:1 的第一個字是動詞 Παρακαλῶ（Parakalō），第二個字是 οὖν（oun）——全卷的樞紐，就是這個小小的「所以」。</strong></p><p>前三章，保羅幾乎沒有下過命令，只有 2:11 一處 μνημονεύετε（mnēmoneuete）「應當記念」；他用直說語氣講神做了甚麼：揀選、救贖、印記、叫我們活過來、一同坐在天上、拆毀隔斷的牆。從 4:1 起，命令語氣一個接一個。οὖν（oun） 是推論詞：後面的一切，都是從前面推出來的。羅馬書也在同一個轉折點用同一句話——羅 12:1 也是 Παρακαλῶ οὖν ὑμᾶς（Parakalō oun hymas）。保羅的倫理永遠是這個次序——先直說，後命令；先恩典，後回應。</p><p>ἀξίως（axiōs） 的字根 ἄξιος（axios） 原是秤：一邊放了東西，另一邊要放上等重的才平衡。保羅沒有說「配得蒙召」，那就倒過來了；他說行走要和「已經蒙了的召」相稱。τῆς κλήσεως ἧς ἐκλήθητε（tēs klēseōs hēs eklēthēte） 是同字根的重複，關係代名詞 ἧς（hēs） 被前面的屬格吸引，像一個人把同一件事說兩遍，好叫人記住：你是被召的人。</p><p>περιπατῆσαι（peripatēsai） 字面是「走路」，承襲希伯來人以「行」說一生的習慣。這個動詞在 2:2 說從前「在其中行事為人」，在 2:10 說神預備善工「叫我們行」，這裡第一次成為命令；第 4–5 章它還要出現四次（4:17 兩次；5:2、8、15），全卷的骨架「坐、行、站」由此進入第二段。</p>","exp":"<p><strong>「我為主被囚的勸你們：既然蒙召，行事為人就當與蒙召的恩相稱。」（4:1）坐下來的人，開始走路了。</strong></p><p>前三章的保羅像一位導遊，帶我們繞著神的計畫走了一圈：創立世界以前的揀選（1:4），死人被叫活過來（2:5），「一同坐在天上」（2:6），隔斷的牆被拆毀（2:14），最後在屈膝的禱告與頌讚裡停下來（3:14–21）。然後他說「所以」。神先用了三章講「你是誰」，才開始講「你要怎樣活」。次序不能倒過來：若從第 4 章讀起，以弗所書就變成一本規條；從第 1 章讀起，第 4 章是一個被愛的人自然邁出的腳步。</p><p>寫信的人自稱「為主被囚的」。他寫這句話時手上可能就戴著鎖鍊（6:20）。一個不能走遠的人，勸人好好走路——這本身就是一篇講道：行事為人與蒙召相稱，不取決於你的處境有多寬，而取決於你被誰召。囚室裡也可以走得與恩相稱。</p><p>「相稱」是一架天平。一邊放著神已經放上去的：恩典、身分、基業、聖靈的印記；另一邊放的是我每天的走路。天平不是叫我們掙得恩典，恩典早已在秤盤上；是叫我們的生活不要輕得太離譜。一個人若知道自己是王的兒女，他不會為了得到這個身分而努力，卻會因為這個身分而改變說話與用錢的方式。</p><p>這就是 321 所說「改變觀念就改變生命，改變生命就改變生活」的經文次序：第 1–3 章改變觀念，第 4–6 章落在生活。下一節立刻告訴我們，這樣的走路第一步不是轟轟烈烈的事工，而是謙虛、溫柔、忍耐。</p>"},{"a":2,"z":3,"star":2,"grk":"<p lang=\"grc\">μετὰ πάσης ταπεινοφροσύνης καὶ πραΰτητος, μετὰ μακροθυμίας, ἀνεχόμενοι ἀλλήλων ἐν ἀγάπῃ,</p><p lang=\"grc\">σπουδάζοντες τηρεῖν τὴν ἑνότητα τοῦ πνεύματος ἐν τῷ συνδέσμῳ τῆς εἰρήνης·</p>","lit":"<p>帶著一切的謙卑和溫柔，帶著恆久忍耐，在愛中彼此擔待，</p><p>竭力保守那靈的合一，在和平的聯繫之中；</p>","key":"<table><tr><th>原文</th><th>音譯</th><th>字面</th><th>在這裡</th></tr><tr><td>ταπεινοφροσύνης</td><td>tapeinophrosynēs</td><td>謙卑的心思</td><td>希臘文化裡原是貶義：奴才的低賤</td></tr><tr><td>πραΰτητος</td><td>praytētos</td><td>溫柔</td><td>有力量而受約束；加 6:1 挽回人要用的心</td></tr><tr><td>μακροθυμίας</td><td>makrothymias</td><td>長的怒氣、恆忍</td><td>怒氣來得很慢</td></tr><tr><td>ἀνεχόμενοι ἀλλήλων</td><td>anechomenoi allēlōn</td><td>彼此擔待</td><td>現在分詞：一直承受彼此的重量</td></tr><tr><td>σπουδάζοντες</td><td>spoudazontes</td><td>竭力、趕緊</td><td>不是隨緣，是用力</td></tr><tr><td>τηρεῖν</td><td>tērein</td><td>保守、看守</td><td>守住已有的，不是造出沒有的</td></tr><tr><td>ἐν τῷ συνδέσμῳ τῆς εἰρήνης</td><td>en tō syndesmō tēs eirēnēs</td><td>在和平的繩索裡</td><td>σύνδεσμος：綁在一起的帶子、韌帶</td></tr></table>","gram":"<p><strong>4:2–3 沒有新的主要動詞；兩個分詞 ἀνεχόμενοι（anechomenoi）、σπουδάζοντες（spoudazontes） 都掛在 4:1 的 περιπατῆσαι（peripatēsai） 底下：這就是「相稱的走路」的樣子。</strong></p><p>四個名詞排成兩組，各由 μετὰ（meta） 帶出：μετὰ πάσης ταπεινοφροσύνης καὶ πραΰτητος（meta pasēs tapeinophrosynēs kai praytētos），μετὰ μακροθυμίας（meta makrothymias）。排第一的是 ταπεινοφροσύνης（tapeinophrosynēs）。這個字在希臘道德哲學裡不是美德，是奴才的卑躬屈膝；新約把它翻轉成基督徒品格的頭一項，因為基督自己「心裡柔和謙卑」（太 11:29）。第 4 章的合一，從一個字開始：謙卑。</p><p>σπουδάζοντες τηρεῖν τὴν ἑνότητα τοῦ πνεύματος（spoudazontes tērein tēn henotēta tou pneumatos）：τηρεῖν（tērein） 是看守、保管，受詞是「那靈的合一」。屬格 τοῦ πνεύματος（tou pneumatos） 多數註釋讀作來源——是聖靈所造、所賜的合一，不是人的「同心」。和合本「聖靈所賜合而為一的心」正是這個讀法。合一已經存在（2:14–16 基督已把兩下造成一個新人），我們的工作是竭力不要把它弄丟。</p><p>ἐν τῷ συνδέσμῳ τῆς εἰρήνης（en tō syndesmō tēs eirēnēs） 是追蹤字 εἰρήνη（eirēnē） 在本章的站點：2:14 說基督「是我們的和睦」，到這裡和平成了一條把肢體綁在一起的繩子。σύνδεσμος（syndesmos） 在西 3:14 說愛心是「聯絡全德」的帶子；4:16 還會用醫學的語言講關節與韌帶。</p>","exp":"<p><strong>合一像一只別人交到你手上的古董花瓶。你不必燒製它，只要捧好，不要摔碎。</strong></p><p>「竭力保守聖靈所賜合而為一的心。」（4:3）許多教會把合一當成一項工程：開會、協調、找共識，彷彿合一是我們造出來的。保羅說合一是聖靈「所賜」的，在十字架上已經完成；但他也說要「竭力」保守，因為花瓶雖然是送的，摔碎卻只要一秒。</p><p>怎樣捧好？保羅列了四樣：謙虛、溫柔、忍耐、用愛心互相寬容。沒有一樣是技巧，全是品格。而且第一樣就是謙虛——大部分的分裂，不是因為教義，而是因為有人覺得自己沒有被尊重。「互相寬容」原文是彼此擔待，暗示一件誠實的事：在神的家裡，你一定會遇到需要你忍受的人；而你自己，也正被別人忍受著。合一不是沒有摩擦，是在摩擦中仍不放手。</p><p>那麼，為了合一可以犧牲真理嗎？同一章回答了：合一的目標是「在真道上同歸於一」（4:13），方法是「用愛心說誠實話」（4:15）；保守合一不等於對錯誤沉默。這一題在議題頁展開。</p><p>321 說謙卑是「回到本位」。謙卑的人不需要每一次都贏，所以他捧得住花瓶。華人教會常為語言、地域、宗派而分開，這兩節經文提醒我們：先問自己的心是否謙虛，再問別人的立場是否正確。</p>"},{"a":4,"z":6,"star":2,"grk":"<p lang=\"grc\">ἓν σῶμα καὶ ἓν πνεῦμα, καθὼς καὶ ἐκλήθητε ἐν μιᾷ ἐλπίδι τῆς κλήσεως ὑμῶν·</p><p lang=\"grc\">εἷς κύριος, μία πίστις, ἓν βάπτισμα·</p><p lang=\"grc\">εἷς θεὸς καὶ πατὴρ πάντων, ὁ ἐπὶ πάντων κα
