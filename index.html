覺得自己真的上場了？"],["n","2. ★★★ 4:11 的主詞是「他」，動詞是「賜」，目的寫在 4:12。請用一句話說：為甚麼職分不是頭銜、不是層級，而是為了讓每一個人上場？"],["n","3. ★★ 「成全」原文是補網、接骨。請說出一個你在教會看過的例子：有人沒有替你做，而是把你接好，讓你自己能服事。"],["n","4. ★★ 「生氣卻不要犯罪；不可含怒到日落」：請說出兩種常見的錯讀，一種是壓抑、一種是發怒有理；再說饒恕和和好有甚麼不同。"],["m","帶領提醒：第一題輕鬆帶；討論 4:11 時，不在組裡評論任何個人或教會的頭銜，把話題帶回 4:12 與 4:16。"],["s","第二化｜消化成為生命（約35分鐘·本課主軸）"],["m","目的：讓每一個人看見自己是在爭位子還是躲在最後一排，並說出這一週要走的一步。"],["t","【看】看見自己"],["n","5. ★★★ 在教會或團契裡，你比較像哪一種：想坐第一排、被取代會受傷的人，還是躲在最後一排、說我甚麼都不會的人？說一件最近的事。"],["t","【聽】聽神說話"],["n","6. ★★ 請慢慢讀 4:7 和 4:16 兩遍，第二遍把「各人」換成你自己的名字。讀完說一句：你聽見升天的基督怎樣看你手上的那一份？"],["t","【想】想通關卡"],["n","7. ★★★ 你心裡有沒有一個已經放過好幾個日落的怒氣？不必說對方是誰，只說它卡在哪裡：怕衝突、怕丟臉、覺得生氣不屬靈，還是還不安全？"],["t","【講】說出口"],["n","8. ★★ 請對組裡的人說：「我是基督身體裡的一節，不是頭；我手上的恩賜是他量給我的，這一週我要在……上場。」右手邊的人只回「你也是一節」，不給建議。"],["t","【行】走一步"],["n","9. ★★★ 寫下這一週你要接手或交出的一件事：哪一件、找誰、星期幾。若有收著過夜的怒氣，再寫下你哪一晚要在神面前說出它，或要告訴的那一位信得過的人。"],["m","帶領提醒：這一化可能碰到屬靈控制、家庭傷害或長期無望感。不追問細節，不要求任何人原諒誰或和好，不對正在流淚的人說「你要有信心」；若有人說出正處在危險中，不在組裡處理，會後單獨關心，先確認他是否安全，必要時協助尋求專業協助。不用「舊人」「有己」替任何人貼標籤。第七題之後請留三十秒安靜。"],["s","第三化｜轉化成為生活（約25分鐘）"],["m","目的：把這一課搬進行事曆：一件事、一句好話、一句誠實話、一個要帶的人。"],["n","10. ★★ 列出你的小組或服事團隊裡一直是同一個人在做的一件事。這個月，誰可以被邀請一起做？由誰親手教他？說出名字和日子。"],["n","11. ★ 說出一位默默在供應、很少被人謝過的弟兄姊妹的名字，這一週哪一天，你要對他說哪一句具體的、造就人的好話？"],["n","12. ★★ 有沒有一句你為了面子一直吞下去的誠實話？說出你要對誰說、在哪裡、哪一天，以及你要說的第一句事實是甚麼。"],["n","13. ★★★ 這是本課的 920 操練：找出你的那一個「2」，神放在你身邊、你要以恩慈相待的那一個人。當場說出他的名字，說出這一週哪一天你要找他，並向他分享：每一個人在神的家裡都有一個位置。"],["n","14. ★★★ 【必做】繁殖任務：用三句話把這一課講給一位教會外的朋友聽。第一句，一個好的指揮自己不出聲，他的成績是每一個樂手都奏得出來。第二句，聖經說耶穌就是這樣，他把恩賜分給每一個人，要每一個人都上場，不是只讓幾個人站在台上。第三句，他也饒恕了我，所以我學著不把怒氣留到日落，在他的家裡，我也有一個位置。這一週講給一個人，下次回來說他的反應。"],["m","帶領提醒：要具體到時間、地點、人名，不收「我會多服事」這類答案；若對方曾傷害組員、並不安全，不勉強去說誠實話或和好。"],["s","收尾（5分鐘）"],["p","請每一個人用一句話說：這一週我要接手或交出的那一件事是甚麼。"],["p","然後彼此代禱，為三種人指名禱告：一位從來沒有人邀請他上場的人，求主讓他知道自己也是一個關節；一位曾被屬靈權柄傷害的人，求主醫治；一位身邊的人一直催他饒恕的人，求主先保護他，讓饒恕在安全的地方慢慢發生。"],["p","散會以前，確認紙上寫了三樣：要接手或交出的事、要說的那一句話、你的那個「2」。下次帶來對。"]]},"5":{"no":5,"vol":"《321以弗所書講義》第五課·以弗所書第五章","title":"停電的那一夜，誰點了燈——愛、光、滿","chars":5226,"min":60,"deep":8,"dchars":1700,"tchars":1278,"blocks":[["h","一、停電的那一夜"],["p","弟兄姊妹平安。停電的夜晚，你還記得是甚麼樣子嗎？颱風過境，整條街忽然一黑。冰箱不響了，電視不亮了，連窗外的路燈也熄了。你在自己家裡，竟然一腳踢到了自己放的椅子。"],["p","這時候總有一個人先動起來。她摸黑走進廚房，拉開抽屜，找出一根蠟燭，劃了一根火柴。火亮起來，屋子沒有變，可是你看得見了。然後本來散在各個房間、各滑各的手機的一家人，不約而同地往那張餐桌靠過去，坐得比平常近，話說得比平常多。"],["p","還有一個畫面。沙發上有一個人，從停電前就睡著了。全家人在燭光下說了一個鐘頭的話，他一點也不知道。直到有人推他一下：醒醒，停電了。他睜開眼，才發現屋子早就不一樣了。"],["p","以弗所書第五章有兩句話，很像這一夜。一句是：「從前你們是暗昧的，但如今在主裡面是光明的，行事為人就當像光明的子女。」（5:8）另一句是：「你這睡著的人當醒過來，從死裡復活！基督就要光照你了。」（5:14）一句講那根被點亮的蠟燭，一句講沙發上那個還沒醒的人。"],["p","書信三問的第一問：以弗所人遇到甚麼？他們的城中間站著亞底米的大廟，節期一到滿街醉酒，信主的人曾把行邪術的書拿來燒了（徒 19:19）。當時的家規只對妻子、兒女、奴隸下命令。這封傳閱信，就是在這樣的城裡，在家庭教會的燈下被讀出來的。"],["p","前三章是坐，從第四章起是行。第五章一開頭的「所以」，接著上一章最後一句：「並要以恩慈相待，存憐憫的心，彼此饒恕，正如神在基督裡饒恕了你們一樣。」（4:32）這一章保羅說了三次「行」：憑愛心行、像光明的子女行、謹慎地行；三段路最後都走進家門。這一課用三個字走完：愛、光、滿。"],["h","二、像蒙慈愛的兒女那樣學走路"],["p","「所以，你們該效法神，好像蒙慈愛的兒女一樣。」（5:1）「效法」原文 μιμηταὶ（mimētai），是模仿的人。標竿放到最高：效法神；後半句卻很溫柔：好像蒙慈愛的兒女。這不是學徒照圖紙施工，是三歲的孩子穿上爸爸的拖鞋，在客廳裡學爸爸走路。次序不能倒：不是學像了，神才愛你；是神先愛你，所以你越走越像他。"],["p","效法神的甚麼？第二節說得很具體：「也要憑愛心行事，正如基督愛我們，為我們捨了自己，當作馨香的供物和祭物，獻與神。」（5:2）「捨了自己」原文 παρέδωκεν ἑαυτὸν（paredōken heauton），是把自己交出去。愛在這裡不是一種感覺，是一個動作。請記住這個片語，第二十五節它會再出現一次。"],["p","接著保羅講了三件教會不太喜歡講的事：「至於淫亂並一切污穢，或是貪婪，在你們中間連提都不可，方合聖徒的體統。」（5:3）愛是給，淫亂和貪婪是拿。「貪婪」原文 πλεονεξία（pleonexia），字面是「要得更多」。保羅接著說：「有貪心的，就與拜偶像的一樣。」（5:5）在以弗所，偶像是亞底米；今天可能是一個看盤軟體。不燒香的人，每天為那個數字興奮、焦慮、睡不著，其實也在拜。"],["p","保羅給的解藥很有意思：「淫詞、妄語，和戲笑的話都不相宜；總要說感謝的話。」（5:4）「戲笑的話」原文 εὐτραπελία（eutrapelia），本來是轉得很快的機靈，在這裡是甚麼都轉成下流雙關的嘴；「感謝」是 εὐχαριστία（eucharistia），聲音相近。保羅是叫那條很會轉的舌頭換個方向轉。貪婪說：我還不夠。感謝說：我已經領受了。"],["p","第五節說這樣的人「在基督和神的國裡都是無分的」，這一句很重，不能刪，也不能拿來嚇人。保羅說的是把這些當作生活方式、不肯回頭的人；他也提醒「不要被人虛浮的話欺哄」（5:6），因為總有人說這些事沒甚麼。可是請你看下一節的第一個字：「從前」。這張清單描寫的，是福音把人救出來的地方，不是痛悔的人回不去的地方。"],["d",["「有貪心的，就與拜偶像的一樣」，那想多賺一點錢、為家人打拚也算貪心嗎？","不算。保羅沒有說工作、存錢、照顧家人是罪；他自己說過人若不看顧自己的家，比不信的人還不好。貪婪的原文是「要得更多」，問題不在數字，在位置：那個東西在你心裡，是比神大還是比神小。可以問自己三個問題：我打開看盤軟體的次數是否遠多過聖經？想到錢是平安還是焦慮？願不願意為多賺一點犧牲誠實和家人吃飯的時間？若答案讓你不安，第四節的解藥很具體：每天說一句感謝的話，因為感謝是在說「我已經領受了」。"]],["d",["我曾經看過色情影片、也一直在這件事上跌倒，第五節是不是說我在神的國裡無分？","這一句不能刪，也不能拿來嚇你。保羅說的是以這些事為生活方式、安然住在裡面、不想回頭的人；第八節馬上接著說「從前你們是暗昧的」，這張清單描寫的是福音把人救出來的地方。你會因為這件事心裡痛，正說明光已經照到你。第十三節說，凡事被光顯明出來；光照出來是為了醫治，不是為了羞辱。具體的一步是：這一週找一位同性、可信任的弟兄姊妹說出來，請他陪你走一段，並在手機上裝好過濾。若已經很難停下來，也可以尋求專業的協助。"]],["h","三、原文亮光：是光、買回來、被充滿"],["p","第八到二十節有三個原文的片語，拆開來，停電那一夜的畫面就全部站起來了。"],["p","第一個是第八節：ἦτε γάρ ποτε σκότος, νῦν δὲ φῶς ἐν κυρίῳ（ēte gar pote skotos, nyn de phōs en kyriō）。請聽動詞：保羅沒有說「你們從前在黑暗裡，如今在光明裡」，他說你們從前「是」黑暗，如今「是」光。不是把蠟燭從暗房間搬到亮房間，是蠟燭本身被點著了。不是換了環境，是換了本質。可是後面還有三個字：ἐν κυρίῳ（en kyriō），在主裡面。蠟燭的火是借來的。「光明所結的果子就是一切良善、公義、誠實。」（5:9）有些古卷作「聖靈」，和合本跟從「光明」；兩處的「果子」都是單數。不作假帳、不說兩套話，就是光在結果子。"],["p","第十一到十四節講光怎樣作工。「倒要責備行這事的人」（5:11），「責備」原文 ἐλέγχετε（elenchete），是把藏著的拉到光底下；第十三節說得更清楚，揭露的主體是光：「凡事受了責備，就被光顯明出來」（5:13）。光照出地上的玻璃碎片，是為了不讓人受傷。至於「所以主說」，舊約沒有一模一樣的句子，很可能是早期教會的詩歌；這使我們想起「興起，發光」（賽 60:1），但不是應驗。這首歌唱給信徒聽：基督徒也會睡著，對罪麻木、對光遲鈍。最後一個動詞 ἐπιφαύσει（epiphausei），照亮，主詞是基督。醒是你的事，照亮是他的事。"],["p","第二個是第十六節：「要愛惜光陰，因為現今的世代邪惡。」（5:16）原文 ἐξαγοραζόμενοι τὸν καιρόν（exagorazomenoi ton kairon），是市場用語，把時機買下來；加拉太書用同一個字講基督把我們贖出來。καιρόν（kairon） 不是鐘錶上的鐘點，是時機。停電那一夜大家坐得近，因為手機沒電了；平常的晚上，那一個鐘頭是被誰買走的？愛惜光陰不是塞滿行事曆，是把一頓不看手機的晚飯買回來。"],["p","第三個是第十八節：「不要醉酒，酒能使人放蕩；乃要被聖靈充滿。」（5:18）人一定會被某樣東西灌滿，問題只是被甚麼。πληροῦσθε ἐν πνεύματι（plērousthe en pneumati），「被充滿」有四個文法特徵。現在式：天天要，昨天的充滿不夠今天用，像蠟燭要一直有蠟。被動：你不能咬緊牙關把自己充滿，只能打開、交出，讓他作。命令：是每一個信徒的責任。複數：是對整個教會說的。"],["p","這裡兩邊都有溝。一邊是把它講成某一種外在現象，沒有倒下、沒有說方言就是沒有被充滿；經文沒有把任何一種現象當作唯一的記號。另一邊是怕情緒化乾脆不談，可是這是命令。方言的爭議請看議題頁；保羅自己的答案是：原文一個命令之後接著五個分詞，λαλοῦντες（lalountes）對說、ᾄδοντες（adontes）唱、ψάλλοντες（psallontes）讚美、εὐχαριστοῦντες（eucharistountes）感謝、ὑποτασσόμενοι（hypotassomenoi）順服。第五個記號不在聚會的高潮裡，在家裡。"],["d",["我從來沒有倒下、發抖或特別的感覺，是不是表示我沒有被聖靈充滿？","不是。第十八節的「被充滿」是現在式、被動、命令：天天要，讓他作，每一個信徒都要。經文沒有把倒下、發抖、說方言當作唯一的記號；這些現象在教會歷史上出現過，有的是真實的經歷，但保羅自己列出的果效是五個分詞：彼此對說、唱、讚美、感謝、彼此順服。所以與其問「我有沒有某一種感覺」，不如問「這一週我的嘴裡有沒有感謝，心裡有沒有歌，在家裡有沒有讓一讓」。具體的操練是：每天早上用一句話把自己交給他，晚上照著五個分詞回想一次。也不要因為怕情緒化就不敢求，這是神的命令，也是神的應許。"]],["d",["第十四節「所以主說」到底是引用舊約哪一節？為甚麼講義不說它是應驗？","舊約裡找不到一句完全相同的話。有人認為它是幾處以賽亞書經文的意譯，例如「興起，發光」與「睡在塵埃的啊，要醒起歌唱」；更多學者認為它是早期教會的一首詩歌，可能在洗禮時唱，因為醒來、復活、被光照正是洗禮的畫面。所以本講義只說「這使我們想起」以賽亞書，不說「應驗」。把可能的回聲講成應驗，等於替保羅說他沒說的話。出處不明不影響這一節的力量；它的重點在最後一句，照亮的主詞是基督。醒是我們的回應，光是他給的。"]],["h","四、從第十八節一路讀到第二十五節"],["p","這一段，請一定照這個次序連著讀：「乃要被聖靈充滿。」（5:18）「又當存敬畏基督的心，彼此順服。」（5:21）「你們作妻子的，當順服自己的丈夫，如同順服主。」（5:22）「你們作丈夫的，要愛你們的妻子，正如基督愛教會，為教會捨己。」（5:25）這是同一口氣說出來的。"],["p","第二十二節原文其實沒有動詞：Αἱ γυναῖκες τοῖς ἰδίοις ἀνδράσιν ὡς τῷ κυρίῳ（Hai gynaikes tois idiois andrasin hōs tō kyriō），直譯是「妻子們，對自己的丈夫，如同對主」。「順服」借自第二十一節，有些古卷和和合本補上了。中文在第二十一節後面分段，我們就很容易看不見前面那一句。第二十一節的 ὑποτασσόμενοι（hypotassomenoi） 是中間語態：不是被人壓下去，是自己願意把自己排在別人旁邊。所以文法本身就說了：妻子的順服，是全家彼此順服的一部分；而彼此順服，是被聖靈充滿的果子。"],["p","用書信三問的第二問來看，保羅從福音推出的原則是：家裡每一條命令，都在「敬畏基督」底下，而且每一組都是雙向的。這在第一世紀是很刺耳的。當時的家規只對下面的人說話，保羅卻直接對妻子說話，把她當成一個能自己回應基督的人；然後轉身對丈夫說話，而且說得長得多。對妻子三節，對丈夫九節。"],["p","「敬畏基督」同時是一道界線。既然是如同順服主，就沒有任何人可以用順服的名義要我違背主：「順從神，不順從人，是應當的。」（徒 5:29）所以有一句話，教學場上要說得和講台上一樣清楚：順服，絕不包括忍受暴力、虐待、控制，或被迫犯罪。如果你此刻在家裡被打、被威脅、被控制，不能自己決定見誰、花甚麼錢，這段經文沒有要你忍下去。請先讓自己和孩子安全，告訴一位信得過的人或教會的同工；必要的時候報警，尋求專業協助與庇護。教會的第一件事是保護你的安全，不是勸你回家再順服一點。一個人若拿第二十二節打妻子，他已經先離開了第二十一節，也離開了第二十五節。"],["p","「因為丈夫是妻子的頭，如同基督是教會的頭；他又是教會全體的救主。」（5:23）「頭」怎樣理解，互補派與平等派都是敬重聖經的福音派，並陳在議題頁與全卷立場。可是經文自己替「頭」下了定義：救主，他為身體死。第二十五節的「捨己」和第二節同一個片語。很多弟兄在外面很會捨己，回到家卻等人服事；保羅把捨己的戰場定在餐桌旁。"],["p","基督的愛有方向：「要用水藉著道把教會洗淨，成為聖潔，可以獻給自己，作個榮耀的教會」（5:26–27）。他愛她，是要她更美好，不是更縮小。「保養顧惜」原文 ἐκτρέφει καὶ θάλπει（ektrephei kai thalpei），是餵養和給溫暖。然後他引了伊甸園那一句（創世記講義第二章）：「為這個緣故，人要離開父母，與妻子連合，二人成為一體。」（5:31）接著說：「這是極大的奧祕，但我是指著基督和教會說的。」（5:32）原版是基督與教會，婚姻是人間的複製畫；所以單身、喪偶的弟兄姊妹，這段也是寫給你的。"],["p","書信三問的第三問：今天這原則落在哪裡？落在家務誰做、錢怎麼花、遙控器在誰手上、婆媳之間誰讓誰。最後一節說「妻子也當敬重她的丈夫」（5:33），「敬重」和第二十一節的「敬畏」同一個字根；整段從敬畏基督開始，到敬重收尾。可是敬重不是懼怕。一個人若活在對配偶的恐懼裡，那個家需要的是幫助和保護。"],["d",["我在家裡常被罵、被控制，偶爾也被推打，這段經文是要我更順服嗎？","不是。順服絕不包括忍受暴力、虐待、控制或被迫犯罪。第二十二節掛在第二十一節「存敬畏基督的心，彼此順服」底下，同一段要丈夫為妻子捨己、保養顧惜；一個用暴力或控制對待配偶的人，已經先離開了這段經文。你現在最重要的不是檢討自己夠不夠順服，是你和孩子的安全。請先找一位信得過的人說出來，可以是教會的同工；若有立即的危險，請報警，或聯絡當地的家暴求助專線與庇護單位。你不必一個人扛，教會應該陪你，而不是勸你回去忍。"]],["d",["「丈夫是妻子的頭」，那家裡的大事到底應該由誰決定？","這一題，敬重聖經的弟兄姊妹有不同看法。互補派認為夫妻在神面前完全平等，角色不同，丈夫的帶領是捨己的帶領；平等派認為第二十一節的彼此順服是原則，後面是保羅在當時處境裡的應用。兩派都是福音派，議題頁與全卷立場有並陳，本講義不替每一個家決定分工。可是兩派都同意兩件事：頭的定義是第二十三節的「救主」，作頭的方式是為身體捨命，不是管錢、管她見誰、檢查手機；而且彼此順服的意思，是兩個人都把對方的好處放在自己前面。實際的做法是：重要的決定一起禱告商量，不用冷戰逼對方讓步。"]],["h","五、幾個必須認得的偏差"],["p","第一個偏差，是從第二十二節開始讀，講成男尊女卑，甚至對受暴的人說「你要更順服」。第二十二節掛在第二十一節底下，第二十一節掛在第十八節底下，同一段要丈夫捨己。順服絕不包括忍受暴力。"],["p","第二個偏差，是把被聖靈充滿講成某一種台前的現象，沒有倒下、沒有說方言就是沒有被充滿；或反過來，因為怕爭議，把它講成「讀經禱告、作個好人」就跳過去。經文自己列的果效，是對說、唱、讚美、感謝、彼此順服。"],["p","第三個偏差，是拿第五節的「無分」恐嚇痛悔的人；或者只講淫亂不講貪婪，同一場聚會裡推銷「奉獻越多、蒙福越多」。保羅說的是不肯回頭的生活方式，也把貪婪叫作拜偶像。"],["p","第四個偏差，是用第二十節的「凡事……常常感謝」要求正在哀哭的人：「你要為失去孩子感謝神」。寫這句話的人手上綁著鎖鍊，他相信的是在一切事上父沒有離開，不是假裝苦難是好的；主耶穌也在墳前哭過。"],["p","第五個偏差，是用第十一節在群組裡點名羞辱人；或反過來，拿「不要論斷」把教會裡的性侵、作帳與權勢濫用蓋起來。光照出來是為了醫治與保護，先保護受害者與真相，不是教會的面子。"],["h","六、兩個華人處境的真實問題"],["p","第一個問題：「家醜不可外揚」和「為了孩子忍一忍」。華人教會遇到家裡的暴力，常常先壓下來，怕難看、怕家散了，受傷的一方被勸包容、順服。可是第十三節說，暗中的事要被光顯明，為了醫治。教會要事先預備好：誰接案、怎樣保密、轉介到哪裡的專業協助與庇護；也不在暴力還在進行時安排雙方協談，那可能讓她回家後付出代價。"],["p","第二個問題：酒桌與財神。很多人的工作離不開應酬，不喝就是不給面子；也有很多家裡年初拜財神，整年看盤。第十八節禁止的是醉酒；要不要滴酒不沾是基督徒的自由與智慧，不可升格成被接納的條件，也要顧到正在戒酒的人。「當像智慧人」，就是應酬前先想好在哪一杯停下來。至於財神，貪心就是拜偶像；不燒香的人，也可能把那個位置留給帳戶。"],["d",["工作上常常要應酬，客戶一直勸酒，基督徒可以喝酒嗎？","第十八節禁止的是醉酒，理由是「酒能使人放蕩」，也就是失去自制、被另一樣東西掌控。所以要不要滴酒不沾，是基督徒的自由與智慧，議題頁有並陳；不可把它升格成進教會或作同工的條件，也不可說只要沒醉喝多少都可以。在應酬桌上，第十五節的「當像智慧人」可以很具體：事先決定今晚最多喝多少，或乾脆以茶代酒；預備一句得體的話，例如「我開車」。若你身邊有正在戒酒的人，為了他不喝，就是憑愛心行事。若你發現自己已經很難停下來，請找人談，也可以尋求專業協助。"]],["h","七、活出321——在同一盞燈底下"],["p","耶穌是我的榜樣：第二節和第二十五節說的是同一件事，基督為我們捨了自己，基督為教會捨己。他被賣的那一夜，還「拿起餅來，祝謝了」（林前 11:23–24）。學他，就是在最該被服事的位置上先把自己交出去，在最有理由抱怨的夜裡先說感謝。"],["p","聖經是我的準則：這一章要照經文讀完，從第十八節讀到第三十三節，一節都不跳；第十四節的出處不明，我們就說不明，不替保羅說他沒有說的「應驗」。基督洗淨教會用的是「道」（5:26），我們家裡的規矩，也要讓這本書來校正。"],["p","聖靈是我的引導：每天早上用一句話求：主啊，今天請你充滿我。晚上回想今天有沒有一句對說、一首心裡的歌、一句感謝、一次彼此讓。被動語態的意思是，這一步我不必自己擠，我只要交出去。"],["p","讓耶穌作王：這一章要人讓出兩個位置。一個是「累了就伸手去拿」的那個位置，酒、追劇、看盤、怒氣，讓出來給聖靈。一個是「家裡的王」的位置：第二十一節說存敬畏基督的心，坐在餐桌最高處的是基督，不是我，也不是任何一位家人；所以誰都不可以用順服控制人，誰也不必用強勢保護自己。"],["p","讓耶穌得著一切的榮耀：保羅說基督要把教會獻給自己，「作個榮耀的教會」（5:27）。這份榮耀是他洗淨的結果，不是我們打扮的結果。所以家裡有一點溫柔、教會裡有一點光，我們口唱心和地讚美的是主，不是自己的家教或屬靈。"],["p","建立屬神的體系：第一，敬拜是彼此對說的，讓每一個人的歌被聽見。第二，教會要有光：財務公開，責任清楚。第三，預備好面對家暴的求助流程與轉介名單。第四，單身、喪偶、離婚的弟兄姊妹不是旁聽者，同樣在那位新郎所愛的新婦裡面。"],["h","八、四種心，在燭光亮起來的那一刻"],["p","驕傲型的心，是燈一亮就看見別人哪裡不對的人。你很會引用第二十二節，卻很少讀第二十一節和第二十五節。請你今晚問一次家人：最近我有沒有哪一句話、哪一個決定，讓你覺得被壓著？只聽，不辯解。"],["p","恐懼型的心，是一直擔心自己沒有被聖靈充滿的人，因為你從來沒有倒下、沒有特別的感覺；或是在家裡不敢說話，把害怕叫作順服的人。請你聽：被充滿是被動的、天天的，你只要打開。而害怕不是順服，敬重也不是懼怕。"],["p","羞恥型的心，是有一件事一直藏在暗處的人：一個網站、一筆帳、一段不該有的關係。你怕光，可是第十三節的光是為了醫治你；第十四節不是叫你滾開，是說「你這睡著的人當醒過來」。找一位可信任的弟兄姊妹，說出來，就是醒過來的第一步。"],["p","受傷型的心，是在家裡被傷過、或正在受傷的人，也許你曾被人拿這一章壓著。這一課不要你立刻原諒誰。這段經文沒有要你留在危險裡；請先讓自己安全，找一個人說出來。基督作頭的方式是為身體捨命，凡拿他的名傷害你的人，已經離開了他。"],["d",["我剛失去親人，實在說不出感謝，第二十節「凡事……常常感謝」是不是說我沒有信心？","不是。寫這句話的人手上綁著鎖鍊，他說的「凡事」，是在一切事上相信父神沒有離開，不是要你假裝失去是好的。聖經裡有整卷的哀歌，詩篇裡有許多哭著問神的禱告，主耶穌也在拉撒路的墳前哭了。「與哀哭的人要同哭」（羅 12:15），神也和你一起哭。所以這一段時間，你可以把眼淚帶到父面前，連「我說不出感謝」也照實告訴他，這本身就是一種信靠。等到有一天，你也許會發現自己在一件很小的事上說得出一句謝謝；那一天不必趕，聖靈會陪你走到那裡。"]],["h","九、這一週，你可以做的幾件事"],["p","以下五件事，請在散會以前寫下時間、地點和名字。"],["p","第一，每天早上用一句話禱告：主啊，今天請你充滿我。晚上睡前讀一次第十八到二十一節，回想今天有沒有對說、唱、讚美、感謝、彼此順服其中一樣，為它感謝；一樣也沒有，也照實告訴主。"],["p","第二，這七天記下你「累了就伸手去拿」的那一樣東西每天打開幾次；週末選一個時段，用一首詩歌或一段經文把那一個鐘頭買回來。"],["p","第三，每天晚餐或全家第一次碰面的時候，由你先說一句具體的感謝，謝謝誰做了甚麼，不是泛泛的「辛苦了」；再找一件你平常一定要照自己意思的小事，這一週讓家人決定一次。"],["p","第四，回到家，從第十八節讀到第三十三節，一節都不跳。若你是家裡最強勢的那一位，讀完問一次對方被壓著的地方；若你是一直在吞忍、甚至害怕的那一位，這一週的功課不是更順服，是找一位信得過的人或專業單位說出來。"],["p","第五，為你的教會提一件「光」的事：財務公開、同工責任、家暴的求助流程，挑一件向負責的同工提出建議。"],["p","然後我們一起開口說出四句話。"],["p","我宣告：從前我是暗昧的，如今在主裡面我是光明的，因為基督光照了我。"],["p","我宣告：我不再被別的東西灌滿，我天天向聖靈打開，讓他充滿我。"],["p","我宣告：我要存敬畏基督的心彼此順服，在家裡先把自己交出去。"],["p","我宣告：基督先為我捨了自己，我是他所愛、他親手洗淨的人。"],["h","十、結語"],["p","回到停電的那一夜。蠟燭點亮以後，屋子沒有變，可是一家人往同一張餐桌靠過去。那一晚有人把燭台挪到孩子那一邊，有人把最後一片餅乾推給別人；沒有人比誰坐得高。原來被聖靈充滿，不是一個人在台前發光，是一屋子從前是黑暗的人，在同一盞燈底下，學著彼此對說、彼此感謝、彼此讓。"],["p","可是這一課的焦點，不在那根蠟燭，也不在點蠟燭的人；焦點在那一位先把自己交出去的主。是他把暗昧的人變成光，喊醒沙發上睡著的人，「為教會捨己」，親手把她洗淨。我們彼此順服、彼此捨己，因為他先為我們捨了自己。你不必更佩服保羅，也不必更佩服今天的講員；請你更認識這位一直在燈下看著你的主。"],["p","我們一起低頭禱告。主耶穌，謝謝你把從前是暗昧的我們變成光。有人已經在沙發上睡了很久，求你今天喊醒他；有人一直被酒、被錢、被怒氣灌滿，求聖靈充滿他；有人在家裡受著傷害，求你保守他的安全，讓他身邊有一位可以求助的人；也求你叫我們回到家，先把自己交出去。奉主耶穌基督的名禱告，阿們。"],["h","十一、小組討論分享：三個化"],["p","這一課最重要的，不是記住五個分詞的原文，是接下來這一個鐘頭，有多少人肯說出自己被甚麼灌滿、在家裡最常坐在哪一個位置，又說出這一週要先讓的那一件事；以下三個化，請組長照著次序帶。"],["m","帶領說明：本課主軸是如今在主裡是光，被聖靈充滿的人回到家會彼此順服；讀 5:22 一定從 5:18、5:21 讀到 5:25。請先讀第二化的帶領提醒。"],["m","優先順序標示：★★★＝最優先，時間不足時每一化至少討論這一題；★★＝次優先；★＝時間充裕再討論。標【必做】的繁殖任務不可省略，可帶回家完成。"],["s","第一化｜內化成為觀念（約20分鐘）"],["m","目的：讓組員講得出「不是換了環境，是換了本質」「被充滿的果效是五個分詞」「妻子的順服掛在彼此順服底下」三個觀念。"],["n","1. ★ 你記得哪一次停電的夜晚？那一晚家裡誰先點了燈，大家後來坐在哪裡、做了甚麼？"],["n","2. ★★★ 第八節說我們不是「在」光裡，是「是」光。請用蠟燭向旁邊的人說明兩種講法的差別，再說「在主裡面」為甚麼不能漏掉。"],["n","3. ★★ 請說出「被充滿」的四個文法特徵，再從第十九到二十一節找出五個果效，哪一個你最少想到？"],["n","4. ★★ 請一起把第十八、二十一、二十二、二十五節連著讀一遍。從第二十二節開始讀，和從第十八節讀起，你聽到的意思有甚麼不同？"],["m","帶領提醒：講到第二十二節，先讀第十八、二十一節，讀到第二十五節，並說出「順服不包括忍受暴力」。方言、互補平等的爭議一句帶過，指向議題頁。"],["s","第二化｜消化成為生命（約35分鐘·本課主軸）"],["m","目的：看見自己被甚麼灌滿、在家裡坐在哪個位置，說出這一週要先讓的事。"],["t","【看】看見自己"],["n","5. ★★★ 你累了的時候，最常伸手去拿的是甚麼：一杯酒、一部劇、看盤或購物軟體、還是一個可以發洩的人？你一天打開它幾次，打開聖經幾次？"],["t","【聽】聽神說話"],["n","6. ★★ 慢慢讀第十四節，在「醒過來」停下來安靜一分鐘。你最近在哪一件事上，像那個停電了還在睡的人？"],["t","【想】想通關卡"],["n","7. ★★★ 在家裡，你比較像坐著等人服事的人，還是一直吞忍的人？卡住你的是面子、怕吵架、從小的家規，還是怕家散了？"],["t","【講】說出口"],["n","8. ★★ 請對組裡的人說一句：「我常被……灌滿；但我在主裡面是光，我要天天向聖靈打開。」右手邊的人只回一句「基督要光照你」，不給建議。"],["t","【行】走一步"],["n","9. ★★★ 說出這一週你要在家裡讓的一件小事（遙控器、週末行程、菜怎麼煮、錢怎麼花），讓哪一位家人決定，以及星期幾；請旁邊的人下次問你。"],["m","帶領提醒：這一化可能碰到家庭傷害、婚姻裡的暴力或控制、長期的無望感。不追問細節，不要求原諒，不對正在流淚的人說「你要有信心」，也不說「回去再順服一點」；說不出口的可以跳過。若有人透露正在受暴，會後單獨關心，先確認他和孩子的安全，必要時協助尋求專業協助、庇護與報警。"],["s","第三化｜轉化成為生活（約25分鐘）"],["m","目的：把這一課搬進這一週的行事曆。"],["n","10. ★★ 這一週每天早上那一句「主啊，今天請你充滿我」，你要在幾點、在哪裡說？晚上照五個分詞回想時，要記在哪裡？"],["n","11. ★★ 這一週你要在哪一餐、對哪一位家人說出一句具體的感謝？請現在就把那一句話說出來，說清楚是謝謝他做了甚麼。"],["n","12. ★ 你的教會有沒有一件需要「光」的事：財務、同工責任、家暴求助流程？你要在哪一天向哪一位同工提出？"],["n","13. ★★★ 這是本課的 920 操練：光明所結的果子是單數，是一個生命。找出你的那一個「2」，這一週向他分享「我從前是暗昧的，如今在主裡面是光」，當場說出他的名字，以及你要約他的日子和地點。"],["n","14. ★★★ 【必做】繁殖任務：用三句話把這一課講給一位教會外的朋友聽。第一句，每個人都會被某樣東西灌滿，酒、錢、工作或怒氣，灌滿了就身不由己。第二句，耶穌把黑暗裡的人變成光，神的靈天天充滿人，叫人回到家更願意彼此讓。第三句，因為耶穌先為我們捨了自己，我們也學著在家裡先把自己交出去。這一週講給一個人，下次回來說他的反應。"],["m","帶領提醒：要具體到時間、地點、人名；家裡正在受傷的人，這一週的功課是找人說出來，不是更多順服。"],["s","收尾（5分鐘）"],["p","請每一個人用一句話說：這一週，我要在家裡先讓的那一件事。"],["p","然後為四種人指名禱告：一對常常爭吵的夫妻；一位被酒、賭或色情綁住的人；一位單身、喪偶或離婚而孤單的弟兄姊妹；一位可能正在家裡受傷的人，求主保守他的安全。"],["p","散會前確認紙上寫了：早上禱告的時間、要感謝的家人、你的「2」的名字。"]]},"6":{"no":6,"vol":"《321以弗所書講義》第六課·以弗所書第六章","title":"出門以前——餐桌、辦公桌、跪墊","chars":4934,"min":60,"deep":8,"dchars":1858,"tchars":1468,"blocks":[["h","一、同一個早上，三條前線"],["p","弟兄姊妹平安。早上七點十分，一個三代同住的家。廚房裡，媽媽一邊煎蛋，一邊對著房門喊：「手機放下，再不出來就遲到了！」十三歲的兒子把門甩上，回了一句很難聽的話。她手上的鍋鏟停在半空，心裡冒出一句更難聽的，差一點就說出口。"],["p","客廳裡，爸爸已經穿好襯衫，手機亮了一下，是主管凌晨傳來的訊息：「九點來我辦公室。」沒有說甚麼事。他把那句話讀了四遍，胃開始緊，早餐一口也吃不下。他想起上個月主管叫他把一筆帳「先處理掉」，他到現在還沒有回答。"],["p","最裡面那個房間，奶奶坐在床邊，還沒有起來。她凌晨三點被一個惡夢驚醒，夢見過世的老伴站在門口叫她；醒來以後，屋子很暗，她不敢再睡，一直坐到天亮。她信主不久，心裡在想：是不是要去廟裡問一問？"],["p","同一個早上，同一間屋子，三條前線一起開打：一條在餐桌旁，一條在辦公桌旁，一條在看不見的地方。我們常把它們分開處理：家庭問題找家庭講座，職場問題看管理書，靈界的事交給牧師。保羅在以弗所書第六章，卻把這三條前線寫在同一頁上，而且次序就是這個早上的次序：先是兒女與父母（6:1–4），再是僕人與主人（6:5–9），然後才是「要穿戴神所賜的全副軍裝」（6:11）。"],["p","這一章寫給以弗所與亞細亞眾教會。他們的城裡有亞底米神廟、有滿街的護身符；他們的家裡有父親、孩子，也有奴隸；他們的聚會就在這樣的家裡。保羅推出的原則只有一個：每一個人頭上，都同有一位主。今天這原則落在哪裡？就落在你明天早上七點十分的那一間屋子裡。"],["p","全卷是三個動作：前三章坐，第四、五章行，這一章站。先坐，才會行；會行，才站得住。這一課走三步：家裡的前線（6:1–9），站立得住（6:10–17），禱告與不朽壞的愛（6:18–24）。"],["d",["保羅為甚麼在講屬靈爭戰以前，先花九節經文講家庭和職場？","因為對保羅來說，家和職場就是爭戰的前線，不是爭戰以外的瑣事。第十節「我還有末了的話」原文是「至於其餘的」，把前面一路講下來的生活收成一個總結：一個在家裡天天惹兒女的氣、在職場只做給人看的人，就算很會禱告，腰上也沒有真理的帶子。反過來，一個在餐桌旁放下怒氣、在沒有人看見的時候照樣誠實的人，正在穿戴軍裝。第四章也早就說過「不可含怒到日落」「也不可給魔鬼留地步」（4:27），魔鬼的地盤常常是從一個帶過夜的怒氣開始。所以這一週的爭戰，第一個戰場很可能就是你家的廚房。"]],["h","二、餐桌與辦公桌：每一組都是雙向的"],["p","先回到廚房。「你們作兒女的，要在主裡聽從父母，這是理所當然的。」（6:1）那個時代的家規是寫給一家之主看的，教他怎樣管人；保羅卻直接對孩子開口。他把那個甩門的十三歲孩子，當成一個能自己回應主的人。「在主裡」三個字有兩面：一面是動力，孩子聽話是跟從主的一部分；一面是界線，父母若要求違背主的事，兒女可以不聽從，卻仍要孝敬。"],["p","接著保羅引十誡：「要孝敬父母，使你得福，在世長壽。」（6:2）請分清兩個字。「聽從」是對在家受養育的孩子說的；「孝敬」是一生的責任，小時候聽從，長大尊重，父母老了照顧奉養。可是孝敬不等於讓父母替成年兒女決定一切；婚姻、信仰、呼召，是成年人在主面前自己負責的。"],["p","然後保羅立刻轉身：「你們作父親的，不要惹兒女的氣，只要照著主的教訓和警戒養育他們。」（6:4）在羅馬法裡，父親幾乎有絕對的權柄。對這樣的父親說「不要惹兒女的氣」，是一句很新的話。保羅沒有廢掉管教，他廢掉的是激怒：羞辱、比較、失控的打罵、永遠達不到的標準。那位拿著鍋鏟的媽媽，要問的不是「我有沒有權罵他」，是「這是主的管教，還是我的脾氣」。"],["p","再到客廳那位爸爸。「你們作僕人的，要懼怕戰兢，用誠實的心聽從你們肉身的主人，好像聽從基督一般。」（6:5）以弗所城裡大約三分之一的人是奴隸。保羅沒有建立奴隸制，也沒有替它辯護；他先改變制度裡的人，後來對腓利門說，阿尼西母「不再是奴僕，乃是高過奴僕，是親愛的兄弟」（門 1:16）。"],["p","「甘心事奉，好像服事主，不像服事人。」（6:7）這是職場基督徒最重要的一節。可是「好像聽從基督一般」同時是一條界線：基督不會叫人作假帳。所以那筆「先處理掉」的帳，不在第五節的範圍裡；職場上忍受違法、霸凌、性騷擾，也不在。向公司申訴、找人幫忙、必要時離開，都不違背這一節。"],["p","最後保羅對主人說：「你們作主人的，待僕人也是一理，不要威嚇他們。因為知道，他們和你們同有一位主在天上；他並不偏待人。」（6:9）他把對奴隸說的話，原封不動交給主人。兒女與父親，僕人與主人，每一組都是雙向的，而且對握有權柄的那一方要求更重。那位凌晨傳訊息的主管，頭上也有一位主。細節，講義的全卷立場有整理；答案的根就在這一句：同有一位主在天上。"],["d",["我已經三十多歲，父母堅持要我回老家、嫁給他們看中的人，不聽就是不孝嗎？","不是。第一節的「聽從」是對在家受養育的兒女說的；第二節的「孝敬」才是一生的責任。孝敬是尊重、照顧、奉養，要落到時間與口袋裡；但成年人的婚姻、信仰、呼召，是在主面前自己負責的，第五章剛說過「人要離開父母」。所以你可以溫柔地拒絕那一件事，卻不撤回對父母的尊敬。具體的做法：先找一個不吵架的時間，感謝他們的擔心；清楚說出「這件事我會在主面前負責」；同時用行動孝敬，例如固定打電話、回家探望、分擔家用。若壓力已經變成威脅、控制或不讓你出門，請先顧好安全，讓教會知道。"]],["d",["老闆要我配合做一筆不實的帳，說大家都這樣，我若拒絕是不是不夠「甘心事奉」？","不是。第五節說「好像聽從基督一般」，這是動力，也是界線：基督不會叫人作假帳、說謊、違法，所以這類要求本來就不在第五節的範圍裡。甘心事奉是在合法、誠實的工作上盡心，不是在錯的事上配合。你可以這樣走：第一，先禱告，寫下事情的經過與時間，保留紀錄。第二，用尊重的語氣向主管表明「這一筆我沒有辦法這樣處理」，並提出合法的替代做法。第三，若對方施壓，找公司的申訴管道、可信任的前輩或專業人士諮詢。必要時離開，也不違背這一節。請記得第八節：主看見，主記帳，主會還；你的價值不在那一張考績單上。"]],["h","三、原文亮光：被加力、摔跤、站"],["p","講完家和職場，保羅才說：「我還有末了的話：你們要靠著主，倚賴他的大能大力作剛強的人。」（6:10）接下來這一段有三個字，拆開來，那位奶奶凌晨三點的恐懼，就有了地方放。"],["p","第一個字在第十節：ἐνδυναμοῦσθε（endynamousthe），和合本譯「作剛強的人」。這是現在式、被動的命令：要一直被加上力量。被動，表示力量不是自己擠出來的；現在式，表示每天早上都要。後面的「大能大力」，就是第一章那股叫基督從死裡復活的力量。所以出門前那一口氣，不是自己咬牙吸進去的，是從復活的主那裡領來的。"],["p","第二個字在第十二節：ἡ πάλη（hē palē），和合本譯「爭戰」，原文是摔跤。不是遠遠射箭，是貼身的扭打。而且保羅先說對手不是誰：「因我們並不是與屬血氣的爭戰」（6:12）。你的對手不是甩門的兒子，不是凌晨傳訊息的主管，也不是那位一直不肯道歉的同工。把人當成敵人，正好中了魔鬼的詭計。對手是真實的靈界勢力，不是比喻；它們也會透過人間的結構運作。"],["p","第三個字貫穿三節：στῆναι（stēnai），站。第十一節「抵擋」、第十三節「抵擋」與「站立得住」、第十四節「站穩了」，原文都是同一個字根。保羅沒有叫人衝鋒、佔領、點名驅趕，他四次說：站住。為甚麼？因為勝負已經定了。我們已經和基督「一同坐在天上」（2:6）。爭戰是從得勝的位置出發，不是為了得勝。全卷是先坐，才會行；會行，才站得住。所以這一段聽完，你應該更平安，不是更害怕。"],["d",["既然勝負已經定了，為甚麼保羅還說「在磨難的日子」，基督徒還會吃苦嗎？","會。勝負已定，說的是結局與位置：基督已經坐在一切執政掌權的之上，我們也與他一同坐在天上。可是第十三節同時說「在磨難的日子」，原文是「在那邪惡的日子」，可以指末世的高峰，也可以指每一個試探特別強、難處特別重的日子。所以得勝的人仍然會失眠、會掉眼淚。差別在於：你不是為了得勝而打，是從得勝的位置站住。這就是為甚麼保羅四次說「站」，不是「衝」。站，是一天一天的事：今天站住，明天再站住。站不住的時候，記得第十節是被動的，力量是一直加給你的；也記得盾牌是一面一面連起來的，請讓弟兄姊妹陪你站。"]],["h","四、六件軍裝，然後跪下"],["p","站的時候穿甚麼？保羅沒有明說引用，可是這使我們想起以賽亞書裡，穿軍裝的是神自己：「他以公義為鎧甲，以拯救為頭盔」（賽 59:17）。神把自己的軍裝借給了我們。"],["p","「所以要站穩了，用真理當作帶子束腰，用公義當作護心鏡遮胸，」（6:14）第一件是真理。在家說謊的父親，禱告再大聲，腰上也沒有帶子。第二件是公義，那筆「先處理掉」的帳，就是爸爸今天早上的護心鏡要擋的那一箭。第三件是鞋：「又用平安的福音當作預備走路的鞋穿在腳上。」（6:15）基督拆毀了隔斷的牆，會打屬靈仗的教會，該是最能讓不同的人坐在一起的教會。"],["p","「此外，又拿著信德當作盾牌，可以滅盡那惡者一切的火箭；」（6:16）羅馬士兵的大盾可以一面一面連起來，所以旁邊弟兄姊妹的盾牌，常常比你自己的更早擋住。「並戴上救恩的頭盔，拿著聖靈的寶劍，就是神的道；」（6:17）「神的道」原文偏重說出口的話。主耶穌在曠野三次用經上的話回答，不是念咒。六件軍裝，沒有一件是儀式，沒有一件是口訣，全是品格與真理。"],["p","以弗所人最懂這件事。使徒行傳講義第十九章講過，那城裡「平素行邪術的，也有許多人把書拿來，堆積在眾人面前焚燒」（徒 19:19）。讀這封信的人，有些就是當年燒書的人。他們不需要更強的符咒，需要知道自己站在誰的力量裡。那位奶奶也一樣。"],["p","軍裝穿好，照理該衝鋒了，保羅卻叫人跪下：「靠著聖靈，隨時多方禱告祈求；並要在此警醒不倦，為眾聖徒祈求，」（6:18）禱告不是第七件軍裝，是穿戴每一件軍裝的方式。保羅也為自己求，他沒有求出獄，求的是開口的膽量：「我為這福音的奧祕作了帶鎖鍊的使者」（6:20）。"],["p","信的最後一句是：「並願所有誠心愛我們主耶穌基督的人都蒙恩惠！」（6:24）「誠心」原文是 ἐν ἀφθαρσίᾳ（en aphtharsia），「在不朽壞之中」，是整封信最後一個字。這使我們想起三十年後，復活的主對以弗所教會說：「然而有一件事我要責備你，就是你把起初的愛心離棄了。」（啟 2:4）啟示錄沒有引用以弗所書，可是並讀叫人心裡一沉：教義還在，勞碌還在，愛不在了。真理讓人站得住，愛讓人站得久。"],["d",["每天早上一件一件「禱告穿上全副軍裝」，有沒有幫助？不做會不會沒有保護？","把它當作一種提醒，是好的；把它當作一道手續，就偏了。保羅說的六件軍裝，是真理、公義、平安的福音、信德、救恩、神的道，全是品格與真理，不是一段要念對的禱詞。早上用軍裝的圖畫禱告，提醒自己今天要說誠實話、行公義，這很有幫助；可是若你覺得少念一件，那一部分今天就沒有保護，那就是把法術換一個名字帶回教會。以弗所人燒掉的，正是那種靠念誦得力量的書。真正的檢驗在晚上：今天在家有沒有說真話？在職場有沒有行公義？在試探裡有沒有相信神的話？有，你就穿著；沒有，明天早上再求主幫助你。"]],["h","五、幾個必須認得的偏差"],["p","第一個偏差，是只讀第一節和第五節，把這一段講成單向的服從：兒女要聽話、員工要聽話，卻略過第四節「不要惹兒女的氣」和第九節「不要威嚇他們」。只講一半，經文就成了壓迫的工具。"],["p","第二個偏差，是以孝為名操控成年兒女的婚姻、信仰、工作、呼召；或反過來，拿「在主裡」替不孝找理由，說父母不信主就不必奉養。孝敬是一生的責任，決定是在主面前自己負責。"],["p","第三個偏差，是用第五節叫員工忍受霸凌、性騷擾，或聽命作假帳、違法，說這樣才算「好像聽從基督」。基督不會叫人說謊；求助和申訴都不違背經文。"],["p","第四個偏差，是凡事見鬼：把憂鬱、焦慮、失眠、孩子叛逆都講成邪靈攻擊，叫人只趕鬼不就醫；或熱衷捆綁地域邪靈、畫屬靈地圖、點名驅趕。保羅的戰術只有站住、穿上真理與品格、禱告與傳福音。"],["p","第五個偏差，是反過來把屬靈爭戰講成只是比喻，或把全副軍裝講成每天早上念一遍的口訣，沒念就沒有保護。爭戰是真的，勝負也是定的；軍裝是品格與真理，不是護身符。"],["d",["家人長期失眠、做惡夢、情緒很低落，有人說是被邪靈攪擾，我該怎麼辦？","先不要急著下結論。魔鬼的詭計是真的，可是第十二節並沒有叫我們把每個問題都歸給鬼；長期失眠、惡夢、情緒低落，最常見的原因是身體、壓力與心理的困擾。具體的做法：第一，陪他去看醫生或尋求專業協助，這不是信心不夠，是愛他。第二，同時為他禱告，可以握著他的手，用簡單的話求主賜他平安，不需要喊叫或表演。第三，不要在他面前說「你被鬼附了」「是你信心不夠」，這會加重他的恐懼與羞恥。第四，請小組的弟兄姊妹輪流關心、陪伴。若他說出想傷害自己的念頭，請立刻尋求專業協助，不要獨自處理。聽完這一章，他應該更平安，而不是更害怕。"]],["h","六、兩個華人處境的真實問題"],["p","第一個問題：成年兒女的孝與主權。很多三十多歲的弟兄姊妹，婚姻、工作、搬去哪一座城，父母都要說了算；一句「我養你這麼大」，就讓人說不出話。第六章給的答案不是二選一。孝敬要落到時間和口袋裡：常回家、奉養、照顧，基督徒要做得比不信的人更好；可是「在主裡」也是界線，成年人的婚姻、信仰、呼召在主面前自己負責。可以溫柔地拒絕那一件事，卻不撤回對父母的尊敬，例如說：「爸、媽，這件事我會在主面前負責，我也會一直孝敬你們。」"],["p","第二個問題：鬼月、風水、廟口與半夜的惡夢。華人城市就是今天的以弗所。本講義的全卷立場是：在基督裡的人不必怕，「從前你們是暗昧的，但如今在主裡面是光明的」（5:8），我們不在黑暗權勢底下；可是也不參與，不拜、不求、不戴護身符、不擇日。家裡長輩拜拜，可以尊重、陪伴、幫忙準備，自己不拜。也請不要輕易說一個人被鬼附；長期失眠、恐懼、情緒困擾，先陪他看醫生，同時為他禱告，兩者不衝突。"],["d",["我剛信主，家裡長輩農曆七月要拜拜，叫我幫忙擺供品，我該怎麼做？","你不必怕，也不必和長輩對立。在基督裡的人不在黑暗權勢底下，供品不能害你，日子也不能害你。但你也不參與敬拜的部分：不拜、不求、不拿香。你可以幫忙採買、煮飯、整理家裡、陪長輩說話；擺放供品和上香的那一段，可以溫和地說：「這部分我不方便，我來幫忙別的。」重要的是語氣和行動，讓家人看見信耶穌的人更孝順、更體貼，而不是更難相處。若一時說不清楚，請小組長或牧者陪你想一句合適的話。以弗所的信徒燒掉了自己的法術書，卻沒有燒掉別人家的。"]],["h","七、活出321——頭上同有一位主"],["p","耶穌是我的榜樣：主耶穌十二歲留在聖殿，知道自己最終聽從的是天父；可是路加接著寫，他「同他們下去，回到拿撒勒，並且順從他們」（路 2:51）。他知道頭上有父，所以能甘心孝敬地上的父母；面對試探，他沒有表演，只用經上的話站住。"],["p","聖經是我的準則：這一章同時寫了「聽從父母」和「不要惹兒女的氣」，同時寫了「聽從主人」和「不要威嚇他們」；我們兩邊都照經文講，不刪一半。經文說「爭戰」，我們不把它講成比喻；經文沒有教地域邪靈，我們也不加上去。"],["p","聖靈是我的引導：第十八節是「靠著聖靈」禱告。出門前，用一句話把今天交給他：「今天在餐桌、在辦公桌，求你帶我站住。」想對孩子吼、想做給老闆看的那一刻，求他提醒我：頭上有主。"],["p","讓耶穌作王：這一章要人讓出三個位置。一是「家裡的最高權柄」，父母、老闆、牧者都不是最後的主；二是「自己的力量」，不再靠咬牙撐住磨難的日子；三是「恐懼的主權」，鬼月、方位、惡夢，都不再替我決定能不能睡覺、能不能搬家。"],["p","讓耶穌得著一切的榮耀：軍裝是「神所賜的」，力量是被加給的，連寶劍都是聖靈的。我站住了，不是因為我比較屬靈，是得勝的主先站在我這一邊；榮耀歸給他。"],["p","建立屬神的體系：第一，教會裡每一個握權的位置，家長、小組長、執事、牧者，都被提醒「不要威嚇」，並且有一條讓下面的人可以說話的路；遇到家暴、職場霸凌的肢體，先保護人。第二，屬靈爭戰寫進教會文化：不表演、不點名、不販賣恐懼。第三，代禱是一張網，小組有輪流守夜的名單，為眾聖徒，也為傳福音的人求開口的膽量。"],["h","八、四種心，在同一個早上"],["p","驕傲型的心，是在上面很會用權柄的人。在家裡一句「我是你媽」，在公司一句「照我說的做」，在小組裡沒有人敢說不。請你把第九節慢慢讀：「他們和你們同有一位主在天上」。你不是最上面那一位；放下威嚇，是你今天的軍裝。"],["p","恐懼型的心，是那位凌晨三點醒來的奶奶，也是那位讀主管訊息讀了四遍的爸爸。怕鬼、怕老闆、怕明天。請你聽第十節是被動的：力量是被加給你的，不是你擠出來的；第十三節說「站立得住」，不是打贏，是站住。勝負已定，你從得勝的位置出發。"],["p","羞恥型的心，是那位差一點吼出口、或真的吼出口的媽媽，是一直在做給人看、心裡知道自己兩副面孔的人。你不必躲。第八節說主記得每一件沒有人看見的善事，你今天就可以在孩子面前說一句對不起；肯認錯的父母，正在教孩子家裡最大的是主。"],["p","受傷型的心，是從小被打罵、被比較長大的人，或在職場被霸凌、被要求作假的人。這一課不要你立刻原諒誰，也不要你假裝不痛；第四節和第九節就是神替你說的話。你可以求助，可以申訴，也可以在安全的地方慢慢說出來。"],["d",["我從小被父親打罵長大，現在自己當了爸爸，也常控制不住脾氣，還有希望嗎？","有。第四節「不要惹兒女的氣」不是只寫給做得好的父親，它是寫給在羅馬法底下握著絕對權柄、很容易失控的父親。具體的路有幾步：第一，在孩子面前認錯。說一句「剛才爸爸太兇了，對不起」，你正在教孩子家裡最大的是主。第二，找出最容易失控的時段，例如下班後第一個小時，先停五分鐘、禱告一句再進門。第三，找一位成熟的弟兄或輔導陪你走，必要時尋求專業協助，處理過去的傷。第四，若你發現自己已經出手打傷孩子，請先停下來，讓孩子安全，並向牧者與專業單位求助。你的父親沒有給你的，天上的父可以重新給你。"]],["h","九、這一週，你可以做的幾件事"],["p","以下五件事，請在散會以前寫下時間、地點和名字。"],["p","第一，每天早上出門前讀一次第十節，用一句話告訴主：「今天我的力量不是自己擠出來的，是你加給我的。」晚上讀第二十四節，回想今天哪一刻是因為愛主才站住的。"],["p","第二，在你握有一點權柄的地方，家裡、部門或小組，找一個人問：「我最近有沒有哪一句話，讓你很生氣卻不敢說？」聽完先不解釋，只說謝謝。若你是父母，為一件事向孩子道歉。"],["p","第三，在工作上挑一個沒有人看見的時段，照樣把事情做好，心裡說一句「這是給主看的」。若有人要你作假，寫下你要找的那一位可信任的人，這一週就去談。"],["p","第四，寫下一個你心裡的恐懼，怕某個日子、某個方位、某個夢，旁邊寫上第十三節「還能站立得住」。若它已經影響睡眠或生活，這一週告訴一位信任的人，需要時去看醫生。"],["p","第五，在小組建立一張輪流代禱名單，每天叫著名字為兩位肢體禱告；再為一位正在傳福音的人求「放膽開口」，傳訊息告訴他你在為他禱告。"],["p","然後我們一起開口說出四句話。"],["p","我宣告：我靠著主，倚賴叫基督復活的大能大力，今天的力量是他加給我的。"],["p","我宣告：在家裡、在職場，我頭上都有一位主；我不威嚇人，也不必活在人的威嚇底下。"],["p","我宣告：勝負已定，我穿上真理、公義與平安，在磨難的日子站立得住，不害怕。"],["p","我宣告：我要隨時多方禱告，並且用一份不朽壞的愛，愛我的主耶穌基督。"],["h","十、結語"],["p","回到那個早上。七點十分，媽媽放下鍋鏟，走到房門口，沒有吼，只說了一句：「剛才媽媽也很急，對不起。」爸爸出門前，在車裡停了一分鐘，為九點那一場談話禱告，也決定那筆帳不做。奶奶沒有去廟裡，她打了電話給小組長，兩個人在電話裡一起禱告，約好下午陪她去看睡不好的門診。那一天的三條前線，沒有一條忽然消失；可是三個人都站住了。"],["p","這一課的焦點，不在我們多會管家、多會做事、多懂屬靈爭戰，焦點在那一位主。先是「靠著主」（6:10），倚賴叫基督復活的大能大力；再是「站立得住」（6:13），在家、在職場、在磨難的日子；然後是「隨時多方禱告」（6:18），為眾聖徒守夜；最後是「誠心愛」主（6:24），用不朽壞的愛愛他。次序不能倒過來：是他先把力量、軍裝、恩典給了我們，他的愛從不朽壞，我們的愛才有可能不朽壞。你不必更佩服保羅，也不必更佩服任何一位很會打屬靈仗的人；你只要更愛這一位主。"],["p","我們一起低頭禱告。主耶穌，謝謝你已經得勝，又叫我們與你一同坐在天上。明天早上，在餐桌旁，求你叫我們放下怒氣；在辦公桌旁，求你叫我們誠實、甘心，也有勇氣說不；在半夜驚醒的時候，求你作我們的平安。有人被打罵、被霸凌傷過，求你親自保護他；有人被恐懼綁住，求你賜他願意就醫、願意被陪伴的心。求你教我們隨時多方禱告，也叫我們不離棄起初的愛，一生用不朽壞的愛愛你。奉主耶穌基督的名禱告，阿們。"],["h","十一、小組討論分享：三個化"],["p","這一課最重要的，不是記住六件軍裝的名稱，是接下來這一個鐘頭，有多少人肯說出自己在哪一條前線最常倒下、在哪裡握著權柄卻在威嚇人，又說出這一週出門以前要怎樣站住；以下三個化，請組長照著次序帶。"],["m","帶領說明：本課主軸是三條前線、一位主：每一組關係都是雙向的，爭戰的方式是站住，果效是平安不是恐慌。席上可能有受過家庭或職場傷害的人，請先讀第二化的帶領提醒。"],["m","優先順序標示：★★★＝最優先，時間不足時每一化至少討論這一題；★★＝次優先；★＝時間充裕再討論。標【必做】的繁殖任務不可省略，可帶回家完成。"],["s","第一化｜內化成為觀念（約20分鐘）"],["m","目的：讓組員用自己的話講得出「每一組關係都是雙向的，因為同有一位主」「爭戰的方式是站，因為勝負已定」「站得住的人最後被問的是愛」三個觀念。"],["n","1. ★ 小時候，家裡早上出門前最常吵的是甚麼？你家那時候是誰在喊、誰在甩門？"],["n","2. ★★★ 保羅把家、職場、看不見的爭戰寫在同一頁。請用第九節「同有一位主在天上」說明：為甚麼每一組關係都是雙向的，而且對握權的一方要求更重？"],["n","3. ★★ 第十一到十四節四次說「站」，不是「衝」。請用一句話對旁邊的人說明：勝負已定，和我們今天還要站住，這兩件事怎樣放在一起？"],["n","4. ★★ 全卷最後一個字是「不朽壞」。對照啟示錄第二章第四節，一間很會站立得住的教會，最容易丟掉的是甚麼？舉一個具體的樣子。"],["m","帶領提醒：講到第一節和第五節時，一定同時說出第四節和第九節。鬼月、地域邪靈、方言等爭議一句帶過，指向議題頁與全卷立場。"],["s","第二化｜消化成為生命（約35分鐘·本課主軸）"],["m","目的：讓每一個人看見自己在哪一條前線最常倒下，並說出這一週要在哪裡站住。"],["t","【看】看見自己"],["n","5. ★★★ 那個早上的三個人：拿鍋鏟的媽媽、讀訊息的爸爸、凌晨醒來的奶奶，你最像哪一位？說出你最近一次在那條前線倒下，是哪一天、在哪裡。"],["t","【聽】聽神說話"],["n","6. ★★ 請把第十到十三節慢慢讀一遍，在「靠著主」停下來，安靜一分鐘。說出一次你明明撐不住、卻發現自己還站著的時刻，是哪一年、在甚麼處境裡？"],["t","【想】想通關卡"],["n","7. ★★★ 你在握權的地方放不下威嚇，或在別人的權柄底下不敢說不，卡在哪裡：怕失去面子、怕丟了飯碗、怕被說不孝，還是習慣了？選一個說出來。"],["t","【講】說出口"],["n","8. ★★ 請對組裡的人說一句：「我常在……的時候站不住；但我頭上有一位主，他已經得勝。」右手邊的人只回一句「主加給你力量」，不給建議。"],["t","【行】走一步"],["n","9. ★★★ 說出這一週你要站住的一個具體場合：家裡的哪個時段、公司的哪個會議或哪一筆事，你要說的第一句話，以及星期幾。請旁邊的人下次問你。"],["m","帶領提醒：這一化可能碰到被打罵長大、被以孝為名操控、家庭傷害、職場霸凌或性騷擾、長期失眠與恐懼的人。只問類別，不追問細節，不要求原諒任何傷害過他的人，不對正在流淚的人說「你要有信心」；說不出口的可以跳過。若有人透露家暴、自傷念頭或長期的無望感，不在組裡處理，會後單獨關心，必要時協助尋求專業協助。"],["s","第三化｜轉化成為生活（約25分鐘）"],["m","目的：把這一課搬進這一週的行事曆。"],["n","10. ★★ 這一週每天出門前讀第十節，你要定在幾點、在家裡的哪個位置？晚上讀第二十四節，要把「因為愛主才站住」的那一刻記在哪裡？"],["n","11. ★★ 說出你握有一點權柄的一個地方和一個人的名字或關係，你要在哪一天問他「我有沒有讓你很生氣卻不敢說」？若你是父母，說出你要為哪一件事向孩子道歉。"],["n","12. ★ 在小組裡建立輪流代禱名單：你這一週每天要為哪兩位肢體叫名禱告？又要為哪一位正在傳福音的人求「放膽開口」，用甚麼方式告訴他？"],["n","13. ★★★ 這是本課的 920 操練：站得住的人從來不是一個人站著的。找出你的那一個「2」，這一週向他分享「勝負已定，我們從得勝的位置站住」，當場說出他的名字，以及你要約他的日子和地點。"],["n","14. ★★★ 【必做】繁殖任務：用三句話把這一課講給一位教會外的朋友聽。第一句，很多人的一天同時有三場仗：家裡、工作，還有半夜的害怕。第二句，聖經說父母、孩子、老闆、員工頭上都有同一位主，那看不見的仗，耶穌已經打贏了。第三句，所以我們不靠符咒，也不靠咬牙，是靠著他站住，並且一生愛他。這一週講給一個人，下次回來說他的反應。"],["m","帶領提醒：要具體到時間、地點、人名，不收「我會更有耐心」這類答案；正在受傷的人，鼓勵他先找一位可信任的人談，不逼他立刻做大決定。"],["s","收尾（5分鐘）"],["p","請每一個人用一句話說：這一週，我要在哪一條前線靠著主站住。"],["p","然後彼此代禱，為三種人指名禱告：一位被父母以孝為名、在婚姻或信仰上被逼得喘不過氣的成年兒女；一位在職場被霸凌、被要求作假，卻怕丟了飯碗不敢說的人；一位被恐懼綁住、或正在身心困擾中的肢體，求主賜他平安，也賜他願意就醫、願意被陪伴的心。"],["p","散會前確認紙上寫了：出門前讀經的時間、要問的那一個人、你的「2」的名字。"]]}}}</script>

<script>/* ===== 321以弗所書講義 ===== */
const D = JSON.parse(document.getElementById('DATA').textContent);
const $ = s => document.querySelector(s);
const esc = s => (s == null ? '' : String(s)).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const CH = D.ch, BLK = D.blk;
/* 每一節 → 所屬的解經段落 */
const VMAP = {};
Object.keys(BLK).forEach(c => BLK[c].forEach((b, i) => {
  b.ch = +c; b.i = i;
  b.ref = c + ':' + (b.a === b.z ? b.a : b.a + '–' + b.z);
  for (let v = b.a; v <= b.z; v++) VMAP[c + ':' + v] = b;
}));
const byCh = {}; Object.keys(BLK).forEach(c => byCh[+c] = BLK[c]);
const cuvOf = ref => { const [c, v] = ref.split(':'); const t = D.txt[c]; return t ? (t[+v - 1] || '') : ''; };
const blkCuv = b => { const t = D.txt[b.ch] || []; let h = '';
  for (let v = b.a; v <= b.z; v++) h += `<p><b>${v}</b>　${esc(t[v - 1] || '')}</p>`; return h; };
const KEY = 'r321.v1';
const DAY = 864e5, GAPS = [0, 1, 3, 7, 16, 35, 75];

let S = load();
function load(){
  try {
    const o = JSON.parse(localStorage.getItem(KEY));
    if (o && o.v === 1){ o.lnote = o.lnote || {}; return o; }   // 舊存檔補上新欄位
  } catch(e){}
  return { v:1, last:1, steps:{}, notes:{}, lnote:{}, prac:{}, mem:{},
           set:{ fs:1, grk:1, dark:0, sc:0, role:'' }, seen:{} };
}
const save = () => { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch(e){} };

/* ═══ 繁 → 簡：對照表由 scripts/make_scmap.py 從本檔自動推導並驗證過 ═══
   逐字表 m ＝ [繁體字串, 簡體字串]；詞組表 p 用來處理一對多的字（計畫→计划、甚好→甚好）。
   演算法：由左到右掃一次，先試最長的詞組，沒中才套逐字表——詞組是覆蓋，不是先替換。
   這與 Python 端完全相同，兩邊的結果逐字比對過。 */
const SCMAP = (() => { try { return JSON.parse(document.getElementById('SCMAP').textContent); } catch(e){ return null; } })();
const SC_M = new Map(), SC_P = new Map(), SC_HEAD = new Set();
let SC_LENS = [];
if (SCMAP) {
  const [tc, sc] = SCMAP.m;
  for (let i = 0; i < tc.length; i++) SC_M.set(tc[i], sc[i]);
  const L = new Set();
  for (const pr of (SCMAP.p || [])) { SC_P.set(pr[0], pr[1]); L.add(pr[0].length); SC_HEAD.add(pr[0][0]); }
  SC_LENS = [...L].sort((a, b) => b - a);
}
function toSC(s){
  if (!s || !SCMAP) return s;
  let out = '', i = 0;
  const n = s.length;
  while (i < n) {
    const c = s[i];
    if (SC_HEAD.has(c)) {
      let hit = false;
      for (const L of SC_LENS) {
        const r = SC_P.get(s.substr(i, L));
        if (r !== undefined) { out += r; i += L; hit = true; break; }
      }
      if (hit) continue;
    }
    const m = SC_M.get(c);
    out += (m === undefined ? c : m);
    i++;
  }
  return out;
}
const SC_SKIP = { SCRIPT:1, STYLE:1, TEXTAREA:1 };
function scWalk(n){
  if (!n) return;
  if (n.nodeType === 3) { const t = n.nodeValue, v = toSC(t); if (v !== t) n.nodeValue = v; return; }
  if (n.nodeType !== 1 || SC_SKIP[n.tagName]) return;
  for (const a of ['placeholder', 'title', 'alt']) {
    if (n.hasAttribute && n.hasAttribute(a)) { const t = n.getAttribute(a), v = toSC(t); if (v !== t) n.setAttribute(a, v); }
  }
  for (let c = n.firstChild; c; c = c.nextSibling) scWalk(c);
}
function scApply(){ if (S.set.sc) scWalk(document.body); }
/* 之後每一次重繪都會被這個觀察器接住；toSC 是冪等的，重複轉換不會出事 */
try {
  new MutationObserver(ms => {
    if (!S.set.sc) return;
    for (const m of ms) {
      if (m.type === 'characterData') scWalk(m.target);
      else m.addedNodes.forEach(scWalk);
    }
  }).observe(document.body, { childList: true, subtree: true, characterData: true });
} catch(e){}
function toast(t){ const el = $('#toast'); el.textContent = t; el.classList.add('on'); clearTimeout(el._t); el._t = setTimeout(() => el.classList.remove('on'), 1700); }
const meta = n => CH[n - 1];

/* ===== 進度 ===== */
const STEPS = [
  ['資訊','讀完本章卡片'], ['啟示','讀經文，寫下你看見的一件事'], ['信服','記住本章金句'],
  ['實踐','選一項本週操練'], ['檢討','第七天回填：做了嗎'], ['修正','回到哪一節重讀'],
  ['反覆','複習通過三次'], ['繁殖','講給一位課外的人聽'],
];
const stepsOf = n => S.steps[n] || [];
function toggleStep(n, i){
  const a = stepsOf(n), k = a.indexOf(i);
  if (k >= 0) a.splice(k, 1); else a.push(i);
  S.steps[n] = a; save(); render();
}
const doneCh = () => CH.filter(c => stepsOf(c.n).length === 8).length;
const startedCh = () => CH.filter(c => stepsOf(c.n).length > 0).length;

/* ===== 複習 ===== */
function memAdd(n){ if (S.mem[n]) return false; S.mem[n] = { box:0, due:Date.now(), hit:0 }; save(); return true; }
function memGrade(n, ok){
  const r = S.mem[n]; if (!r) return;
  r.box = ok ? Math.min(GAPS.length - 1, r.box + 1) : 0;
  r.hit = (r.hit || 0) + (ok ? 1 : 0);
  r.due = Date.now() + (ok ? GAPS[r.box] : 0.4) * DAY;
  save();
}
const due = () => Object.keys(S.mem).filter(n => S.mem[n].due <= Date.now()).map(Number);
function blank(t, seed){
  const ch = [...t], idx = [];
  ch.forEach((c, i) => { if (/[\u4e00-\u9fa5]/.test(c)) idx.push(i); });
  let r = seed; const rnd = () => (r = (r * 1103515245 + 12345) % 2147483648) / 2147483648;
  const n = Math.max(1, Math.round(idx.length * 0.3)), pick = new Set();
  let guard = 0;
  while (pick.size < n && guard++ < 999) pick.add(idx[Math.floor(rnd() * idx.length)]);
  return ch.map((c, i) => pick.has(i) ? '<i>○</i>' : esc(c)).join('');
}

/* ===== 朗讀 ===== */
let VOICE = null;
function say(t){
  if (!window.speechSynthesis) return toast('這台裝置不支援朗讀');
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(String(t).replace(/<[^>]+>/g, ''));
  u.lang = 'zh-TW'; u.rate = 0.94;
  const vs = speechSynthesis.getVoices();
  const v = vs.find(x => /zh[-_]TW|zh[-_]HK|cmn/i.test(x.lang)) || vs.find(x => /^zh/i.test(x.lang));
  if (v) u.voice = v;
  speechSynthesis.speak(u);
}
const plain = el => (el || $('#view')).innerText.slice(0, 3000);

/* ===== 路由 ===== */
let R = { tab:'today', ch:0, sub:'' };
function go(tab, ch, sub){ R = { tab, ch: ch || 0, sub: sub || '' }; if (ch) { S.last = ch; save(); } render(); window.scrollTo(0, 0); }
document.addEventListener('click', e => {
  const b = e.target.closest('nav.tabs button'); if (!b) return;
  go(b.dataset.t);
});
$('#back').onclick = () => { if (R.ch) go(R.tab === 'text' ? 'text' : 'course'); else go('today'); };
/* 頁首的 🔊：在講義那一頁，直接讀講義本文（不念卷名、提詞機與目錄） */
$('#spk').onclick = () => {
  if (SPK.on) return stopSpeak();
  if (R.tab === 'course' && R.ch && R.sub === 'lesson' && (D.lesson || {})[R.ch]) return lesSpeak(R.ch);
  speak(plain(), $('#ttl').textContent);
};
$('#spk').onlongpress = null;
(function(){ let t; const b = $('#spk');
  const st = () => { t = setTimeout(() => { voiceSheet(); t = null; }, 550); };
  const cl = () => { if (t){ clearTimeout(t); t = null; } };
  b.style.webkitTouchCallout = 'none'; b.style.webkitUserSelect = 'none'; b.style.userSelect = 'none';
  b.addEventListener('contextmenu', e => e.preventDefault());
  b.addEventListener('touchstart', st, { passive:true });
  b.addEventListener('touchend', cl); b.addEventListener('touchmove', cl);
  b.addEventListener('mousedown', st); b.addEventListener('mouseup', cl);
})();
$('#fsz').onclick = () => { S.set.fs = (S.set.fs + 1) % 5; save(); applyFS(); toast('字級 ' + (S.set.fs + 1) + ' / 5'); };
function applyFS(){ document.documentElement.style.setProperty('--fs', [15, 17, 19, 22, 25][S.set.fs] + 'px'); }

/* 繁 ↔ 简：頁首一鍵切換。按鈕上寫的是「要切過去的那一邊」。 */
function applyLang(){
  document.documentElement.setAttribute('lang', S.set.sc ? 'zh-Hans' : 'zh-Hant');
  for (const id of ['#lang', '#fLang']) {
    const b = $(id);
    if (b) { b.textContent = S.set.sc ? '繁' : '简'; b.classList.toggle('on', !!S.set.sc); }
  }
}
function toggleSC(){
  S.set.sc = S.set.sc ? 0 : 1; save();
  // 轉簡是單向的：切回繁體要重讀一次，否則靜態外殼的字回不來
  if (!S.set.sc) { location.reload(); return; }
  render();
  try { if (typeof F !== 'undefined' && F) fDraw(); } catch(e){}   // 全螢幕模式也要跟著換
  scApply(); applyLang();
  toast(S.set.sc ? '已切換為简体中文' : '已切換為繁體中文');
}
if ($('#lang')) $('#lang').onclick = toggleSC;

/* ===== 地形圖 ===== */
function terrain(cur){
  const P = D.terrain.points, W = 320, H0 = 96, pad = 14;
  const LAST = 6;
  const x = c => pad + (c - 0.5) / LAST * (W - pad * 2);   // 每章兩點：c 是章內位置（章中心＝整數）
  const y = v => 10 + (100 - v) / 100 * (H0 - 26);
  let d = `M ${x(0.5)} ${y(40)}`;
  P.forEach(p => { d += ` L ${x(p[0]).toFixed(1)} ${y(p[1]).toFixed(1)}`; });
  d += ` L ${x(LAST + 0.5)} ${y(P.length ? P[P.length - 1][1] : 30)}`;

  // ── 標籤排版：以方框做二維避讓，放不下就往外推 ──
  const lab = P.filter(p => p[4]);
  const fs = lab.length > 10 ? 6.6 : (lab.length > 6 ? 7.4 : 8.5);
  const boxes = [], out = [];
  const hit = (a, b) => !(a.x1 < b.x0 - 1 || a.x0 > b.x1 + 1 || a.y1 < b.y0 - 1 || a.y0 > b.y1 + 1);
  // 圓點與「目前所在」的圈也是障礙物，標籤不壓在線上
  const obst = [];
  P.forEach(p => { const cx = x(p[0]), cy = y(p[1]), r = (p[4] ? 3.2 : 2.2) + 1.5;
    obst.push({ x0: cx - r, x1: cx + r, y0: cy - r, y1: cy + r }); });
  if (cur) { const cx = x(cur), cy = y(50);
    obst.push({ x0: cx - 7, x1: cx + 7, y0: cy - 7, y1: cy + 7 }); }
  obst.forEach(o => boxes.push(o));
  lab.slice().sort((a, b) => a[0] - b[0]).forEach(p => {
    const txt = String(p[3] || '');
    let w = 0;
    for (const ch of txt) w += /[一-鿿　-〿＀-￯]/.test(ch) ? fs : fs * 0.55;
    const cx = Math.min(W - 1 - w / 2, Math.max(1 + w / 2, x(p[0])));
    const base = y(p[1]);
    const up = [-7, -16, -25, -34, -43], dn = [11, 20, 29, 38, 47];
    const cand = (p[4] === 'bot' ? dn.concat(up) : up.concat(dn));
    let yy = base + cand[0];
    for (const off of cand) {
      const t = base + off;
      const box = { x0: cx - w / 2, x1: cx + w / 2, y0: t - fs, y1: t + 2 };
      if (!boxes.some(b => hit(b, box))) { yy = t; boxes.push(box); break; }
      if (off === cand[cand.length - 1]) { yy = t; boxes.push(box); }
    }
    out.push({ p, cx, yy });
  });
  const labs = out.map(o =>
    `<text class="tlab ${o.p[4] === 'top' ? 'hi' : ''}" style="font-size:${fs}px" x="${o.cx.toFixed(1)}" y="${o.yy.toFixed(1)}" text-anchor="middle">${esc(String(o.p[3] || ''))}</text>`
  ).join('');
  const dots = P.map(p => `<circle class="tdot ${p[4] === 'bot' ? 'low' : ''}" cx="${x(p[0]).toFixed(1)}" cy="${y(p[1]).toFixed(1)}" r="${p[4] ? 3.2 : 2.2}"/>`).join('');
  const now = cur ? `<circle class="tnow" cx="${x(cur).toFixed(1)}" cy="${y(50)}" r="6"/>` : '';
  // viewBox 依實際內容撐開，標籤不會被切掉
  const lb = boxes.slice(obst.length);
  const vy0 = Math.min(0, ...lb.map(b => b.y0)) - 3;
  const vy1 = Math.max(H0, ...lb.map(b => b.y1)) + 3;
  return `<div class="terrain"><svg viewBox="0 ${vy0.toFixed(1)} ${W} ${(vy1 - vy0).toFixed(1)}" role="img" aria-label="以弗所書全書地形圖">
    <path class="tpath" d="${d}"/>${dots}${labs}${now}</svg>
    <p class="xs muted center" style="margin:2px 0 6px">坐 · 行 · 站</p></div>`;
}

  sheet(h);

/* ── 講義朗讀：跳過卷名、提詞機與目錄，直接從本文開始 ──
   節標題、想更深、三個化的段落，都用口語的方式帶進去，
   聽起來像一位老師在講，不像螢幕在念版面。 */
const DEEP_LEAD = [
  '我們在這裡想更深一點。有人會問，',
  '這裡容我多說一句。可能有人心裡正在問，',
  '我知道有人讀到這裡會停下來問，',
  '讓我們把這一段再往裡走一步。有人問，',
];
const DEEP_ANS = ['我的回答是這樣。', '我是這樣看的。', '我們可以這樣想。', '這一題我會這樣回答。'];
/* 把純文字切成句子（與畫面上的 .mks 完全同一套規則，這樣才對得起來）*/
const plainSents = s => splitHTML(esc(s)).map(x =>
  x.replace(/<[^>]+>/g, '').replace(/&quot;/g,'"').replace(/&#39;/g,"'").replace(/&amp;/g,'&'));

/* 朗讀單位：一句一個，並且記著它在畫面上是哪一塊的第幾句
   { t:要念的字, i:區塊序號, part:'t'|'a', j:句序（-1 表示整塊） }  */
function lesSpeakUnits(n){
  const L = (D.lesson || {})[n];
  if (!L) return [];
  const out = [];
  let di = 0, qi = 0;
  const push = (t, i, part, j) => { if (String(t).trim()) out.push({ t:String(t), i, part, j }); };
  /* 一整塊：第一句套用口語的帶入詞，其餘照念，句序與畫面對得起來 */
  const block = (raw, i, part, lead, drop) => {
    const ss = plainSents(raw);
    ss.forEach((s, j) => {
      let x = s;
      if (j === 0){ if (drop) x = x.replace(drop, ''); x = (lead || '') + x; }
      push(x, i, part, j);
    });
  };
  L.blocks.forEach((b, i) => {
    const t = b[1];
    switch (b[0]){
      case 'h': {                                   // 一、xxx → 第一段，xxx。
        const p = String(t).split('、');
        push(p.length > 1 ? `第${p[0]}段，${p.slice(1).join('、')}。` : String(t) + '。', i, 't', -1);
        break;
      }
      case 'd':                                     // 想更深：一問一答
        push(DEEP_LEAD[di % DEEP_LEAD.length] + t[0], i, 'q', -1);
        block(t[1], i, 'a', DEEP_ANS[di % DEEP_ANS.length]);
        di++;
        break;
      case 's': {                                   // 三個化的段標（括號裡的分鐘數不念）
        const s = String(t).replace(/（[^）]*）/g, '').replace(/｜/g, '，').trim();
        push(/^收尾/.test(s) ? '我們來收尾。' : `接下來是${s}。`, i, 't', 0);
        break;
      }
      case 't': {                                   // 【看】【聽】【想】【講】【行】
        const m = String(t).match(/^【(.+?)】(.*)$/);
        push(m ? `這一步是「${m[1]}」，${m[2]}。` : String(t) + '。', i, 't', 0);
        break;
      }
      case 'm':                                     // 帶領說明／提醒：本身已自帶稱謂
        if (/優先順序標示/.test(t)) break;           // 星號是印在紙上的記號，念出來沒有意義
        block(t, i, 't');
        break;
      case 'n': {                                   // 1. ★★★ 題目 → 第一題。題目
        const m = String(t).match(/^(\d+)\./);
        qi = m ? +m[1] : qi + 1;
        const must = /【必做】/.test(String(t));
        block(t, i, 't', `第${cnNum(qi)}題。${must ? '這一題必做。' : ''}`, /^\d+\.\s*(★+)?\s*(【必做】)?\s*/);
        break;
      }
      default:
        block(t, i, 't');
    }
  });
  return out;
}
/* 把單位併成「一次抓一段語音」的段落：同一塊之內合併到 60 字以上再切，
   太碎會一直等網路，太大又會遲遲不開口。每一段記著它涵蓋畫面上的哪幾句。 */
function lesSegs(n){
  const us = lesSpeakUnits(n), segs = [];
  us.forEach(u => {
    const last = segs[segs.length - 1];
    if (last && last.i === u.i && last.part === u.part && last.j0 >= 0 && u.j >= 0
        && last.t.length < 60 && last.t.length + u.t.length <= 240){
      last.t += u.t; last.js.push(u.j);
    } else {
      segs.push({ t:u.t, i:u.i, part:u.part, j0:u.j, js:u.j >= 0 ? [u.j] : [] });
    }
  });
  segs.forEach(s => { s.t = sanitize(s.t); });
  return segs.filter(s => s.t);
}
const lesSpeakText = n => lesSpeakUnits(n).map(u => u.t).join('\n');
function lesTitle(n){
  const L = (D.lesson || {})[n];
  return L ? `第${cnNum(n)}課　${String(L.title).split('——')[0]}` : '講義';
}
function lesSpeak(n){
  if (SPK.on) return stopSpeak();
  const segs = lesSegs(n);
  if (!segs.length) return toast('本章尚未收錄教學講義');
  playSegs(segs, lesTitle(n), n);
}
/* 預先下載：把整課的語音抓進 IndexedDB，之後離線也能聽 */
async function lesDownload(n){
  const segs = lesSegs(n);
  if (!segs.length) return toast('本章尚未收錄教學講義');
  if (!S.set.human) return toast('目前用的是裝置語音，不需要下載');
  const b = $('#lesDl' + n);
  const chunks = segs.map(s => s.t);
  let done = 0, fail = 0;
  const paint = () => { if (b) b.textContent = `⤓ 下載中 ${done}/${chunks.length}`; };
  paint();
  const CONC = 6; let next = 0;
  await new Promise(res => {
    let running = 0;
    const pump = () => {
      if (!chunks.length) return res();
      while (running < CONC && next < chunks.length){
        running++;
        ttsFetch(chunks[next++]).catch(() => { fail++; }).then(() => {
          running--; done++; paint();
          if (done === chunks.length) res(); else pump();
        });
      }
    };
    pump();
  });
  if (b) b.textContent = fail ? '⤓ 預先下載' : '✓ 已下載';
  toast(fail ? `有 ${fail} 段沒下載到，請再試一次` : '整課語音已存進這台裝置，可以離線聽了');
}
/* 進到講義頁時，看看這一課是不是已經下載過了 */
function lesDlCheck(n){
  const b = $('#lesDl' + n);
  if (!b || !S.set.human) return;
  const segs = lesSegs(n); if (!segs.length) return;
  const keys = segs.map(s => voiceName() + '|' + rateAttr() + '|' + s.t);
  ttsCount(keys, got => {
    const el = $('#lesDl' + n); if (!el) return;
    el.textContent = got >= keys.length ? '✓ 已下載'
      : got ? `⤓ 預先下載（已有 ${got}/${keys.length}）` : '⤓ 預先下載';
  });
}

/* ═══════ ① 真人語音 ═══════ */
const TTS_DB = 'r321_tts';
function ttsDB(cb){
  try {
    if (!window.indexedDB) return cb(null);
    const r = indexedDB.open(TTS_DB, 1);
    r.onupgradeneeded = () => { try { if (!r.result.objectStoreNames.contains('a')) r.result.createObjectStore('a'); } catch(e){} };
    r.onsuccess = () => cb(r.result);
    r.onerror = () => cb(null);
  } catch(e){ cb(null); }
}
function ttsGet(k, cb){
  ttsDB(db => { if (!db) return cb(null);
    try { const q = db.transaction('a').objectStore('a').get(k);
      q.onsuccess = () => cb(q.result || null); q.onerror = () => cb(null);
    } catch(e){ cb(null); } });
}
function ttsPut(k, blob){
  ttsDB(db => { if (!db) return;
    try { db.transaction('a', 'readwrite').objectStore('a').put(blob, k); } catch(e){} });
}
/* 這些段落已經下載了幾段？（一次交易查完，不逐段開連線）*/
function ttsCount(keys, cb){
  if (!keys.length) return cb(0);
  ttsDB(db => { if (!db) return cb(0);
    try {
      const st = db.transaction('a').objectStore('a');
      let n = 0, done = 0;
      keys.forEach(k => {
        const q = st.getKey ? st.getKey(k) : st.count(k);
        q.onsuccess = () => { if (q.result !== undefined && q.result !== 0) n++; if (++done === keys.length) cb(n); };
        q.onerror   = () => { if (++done === keys.length) cb(n); };
      });
    } catch(e){ cb(0); } });
}
async function ttsClear(){
  return new Promise(res => ttsDB(db => { if (!db) return res();
    try { const t = db.transaction('a', 'readwrite'); t.objectStore('a').clear(); t.oncomplete = () => res(); t.onerror = () => res(); }
    catch(e){ res(); } }));
}

const voiceName = () => (TTS_VOICES[S.set.voice] || TTS_VOICES.yunfan).name;
const rateAttr  = () => (S.set.rate >= 0 ? '+' : '') + (S.set.rate * 5) + '%';

/* 原文（希伯來文／希臘文）中文語音念不出來。
   後面若跟著括號裡的拼音，就只念那個拼音；沒有拼音就整段略過——只念一遍，不重複。 */
const ORIG_CH  = '\\u0590-\\u05FF\\u0370-\\u03FF\\u1F00-\\u1FFF';
const ORIG_RUN = '[' + ORIG_CH + '][' + ORIG_CH + "\\s'\u2019\\-\u05be\u05f3\u05f4\u00b7]*";
const RE_ORIG_ROMAN = new RegExp(ORIG_RUN + "\\s*[（(]\\s*([A-Za-z][A-Za-z'\u2019\u0101\u0113\u012b\u014d\u016b\\- ]*)\\s*[）)]", 'g');
const RE_ORIG_RUN   = new RegExp(ORIG_RUN, 'g');

/* 讀音修正：只改送去語音的字，畫面上的字完全不動。
   「地」在天地、地球、地是……應讀 ㄉㄧˋ，語音引擎常誤讀成輕聲的 ㄉㄜ˙；
   換成同音的「帝」就讀得對（聽起來一模一樣）。要再加字就往這張表加。 */
const TTS_SAY = [
  [/天地/g, '天帝'],
  [/地球/g, '帝球'],
  [/地是/g, '帝是'],
];

/* 朗讀前的文字整理 */
function sanitize(t){
  t = String(t || '').replace(/<[^>]+>/g, ' ');
  t = t.replace(/&nbsp;/g, ' ').replace(/&amp;/g, '和').replace(/&lt;|&gt;/g, ' ');
  // 原文只念一遍：有拼音就只念拼音，沒有拼音就整段略過
  t = t.replace(RE_ORIG_ROMAN, ' $1 ').replace(RE_ORIG_RUN, '\u0000');
  // 略過原文之後，把「……原文是。」這種懸在半空的接續詞一起收乾淨
  t = t.replace(/[（(]\s*\u0000\s*[）)]/g, '\u0000');
  t = t.replace(/[是叫作為的]?\s*\u0000\s*(?=[，。；、！？])/g, '');
  t = t.replace(/\s*\u0000\s*/g, ' ');
  t = t.replace(/[（(]\s*[）)]/g, ' ');
  t = t.replace(/\*\*/g, '').replace(/[《》「」『』【】]/g, '');
  t = t.replace(/^[ \t]*#{1,6}[ \t]*/gm, '').replace(/^[ \t]*>[ \t]?/gm, '');
  t = t.replace(/★|⚠|✓|❌|🟢|🟡|🔴|📋|📖|⚖|▸|▾|·/g, ' ');
  // 經節寫法口語化：8:28 → 八章二十八節
  t = t.replace(/(\d{1,3}):(\d{1,3})(?:[–-](\d{1,3}))?/g, (m, a, b, c) =>
    cnNum(a) + '章' + cnNum(b) + (c ? '到' + cnNum(c) : '') + '節');
  t = t.replace(/321/g, '三二一').replace(/920/g, '九二零').replace(/235/g, '二三五');
  t = t.replace(/[：]/g, '，');
  TTS_SAY.forEach(r => { t = t.replace(r[0], r[1]); });
  t = t.replace(/\s+([，。！？；、])/g, '$1');
  return t.replace(/\s{2,}/g, ' ').trim();
}
function cnNum(n){
  n = parseInt(n, 10); const d = '零一二三四五六七八九';
  if (n < 10) return d[n];
  if (n < 20) return '十' + (n % 10 ? d[n % 10] : '');
  if (n < 100) return d[Math.floor(n / 10)] + '十' + (n % 10 ? d[n % 10] : '');
  return String(n);
}
function ttsChunks(t){
  t = sanitize(t); if (!t) return [];
  const out = []; let buf = '';
  for (const ch of t){ buf += ch; if ('。！？；\n'.includes(ch) && buf.length >= 110){ out.push(buf); buf = ''; } }
  if (buf.trim()) out.push(buf);
  const fin = [];
  out.forEach(s => { while (s.length > 300){ fin.push(s.slice(0, 300)); s = s.slice(300); } if (s) fin.push(s); });
  return fin.length ? fin : [t];
}
async function ttsFetch(piece){
  const key = voiceName() + '|' + rateAttr() + '|' + piece;
  const cached = await new Promise(r => ttsGet(key, r));
  if (cached) return cached;
  const res = await fetch(SVC.tts, { method:'POST', headers:{ 'Content-Type':'application/json' },
    body: JSON.stringify({ voice:voiceName(), rate:rateAttr(), sil:TTS_SIL.s, silc:TTS_SIL.c, sile:TTS_SIL.e, text:piece }) });
  if (!res.ok) throw new Error('TTS ' + res.status);
  const blob = await res.blob();
  ttsPut(key, blob);
  return blob;
}

let AUP = null, SPK = { on:false, pause:false, tok:0, list:[], i:0, title:'', prep:0, total:0 };
/* 兩個播放器輪流用：一個在播，另一個先把下一段 load 好，接起來不會卡 */
function audioPair(){
  if (!AUP){
    AUP = [0, 1].map(() => {
      const a = new Audio(); a.preload = 'auto'; a.loop = false;
      a.setAttribute('playsinline', '');
      /* 背景播放：鎖屏／切到別的 App 時，系統的播放控制列要能操作 */
      a.addEventListener('play',  () => { mediaState('playing'); });
      a.addEventListener('pause', () => { if (!SPK.on) mediaState('paused'); });
      return a;
    });
  }
  return AUP;
}
const audioEl = () => audioPair()[0];
/* 鎖屏／耳機／車機的播放控制 */
function mediaState(st){
  try { if (navigator.mediaSession) navigator.mediaSession.playbackState = st; } catch(e){}
}
function appIcon(){
  const l = document.querySelector('link[rel="apple-touch-icon"], link[rel="icon"]');
  return (l && l.getAttribute('href')) || '';
}
function mediaSetup(title){
  if (!navigator.mediaSession || !window.MediaMetadata) return;
  try {
    const ic = appIcon();
    navigator.mediaSession.metadata = new MediaMetadata({
      title: title || '朗讀中',
      artist: '321以弗所書講義',
      album: '國度321空中團契',
      artwork: ic ? [{ src: ic, sizes:'180x180', type:'image/png' }] : [],
    });
    navigator.mediaSession.setActionHandler('play',  () => { if (SPK.pause) togglePause(); });
    navigator.mediaSession.setActionHandler('pause', () => { if (!SPK.pause) togglePause(); });
    navigator.mediaSession.setActionHandler('stop',  () => stopSpeak());
    navigator.mediaSession.setActionHandler('previoustrack', () => spkStep(-1));
    navigator.mediaSession.setActionHandler('nexttrack',     () => spkStep(1));
    navigator.mediaSession.setActionHandler('seekbackward',  () => spkStep(-1));
    navigator.mediaSession.setActionHandler('seekforward',   () => spkStep(1));
  } catch(e){}
}
/* ── 串流播放器 ───────────────────────────────────────────
   一段一段抓、一段一段播：抓到前兩段就開始播，其餘邊播邊抓。
   兩個 <audio> 輪流用（下一段先 load 好），所以段與段之間不會卡住。
   每一段都記著它對應到畫面上的哪幾句，播到那一段就把那幾句標起來、捲過去。  */
const PRE_START = 2;      // 抓到幾段就開播
const PRE_AHEAD = 8;      // 播放中隨時往前多抓幾段
const SILENT_MP3 = 'data:audio/mpeg;base64,//uQxAAAAAAAAAAAAAAAAAAAAAAAWGluZwAAAA8AAAACAAACcQCA';

let PL = null;
function playSegs(segs, title, lesson){
  if (!segs.length) return;
  if (!S.set.human) return sayNative(segs.map(s => s.t).join('\n'));
  stopSpeak();
  const my = ++SPK.tok;
  SPK = { on:true, pause:false, tok:my, list:segs, i:0, title:title || '朗讀中', prep:0, total:segs.length };
  PL = { tok:my, segs, blobs:new Array(segs.length), pend:new Array(segs.length).fill(0),
         try:new Array(segs.length).fill(0),
         i:0, cur:0, lesson:lesson || 0, fail:0, running:0 };
  const els = audioPair();
  els.forEach(a => { try { a.pause(); a.removeAttribute('src'); a.load(); } catch(e){} });
  /* 使用者按下按鈕的這一刻，把兩個播放器都解鎖（iOS 只認手勢當下的 play）*/
  els.forEach(a => { try { a.src = SILENT_MP3; const p = a.play(); if (p && p.catch) p.catch(() => {}); } catch(e){} });
  setTimeout(() => els.forEach(a => { try { if (a !== els[0]) a.pause(); } catch(e){} }), 0);
  mediaSetup(SPK.title);
  drawBar();
  plPump();
  plWaitAndStart();
}
function plFetch(k){
  if (!PL || PL.tok !== SPK.tok) return;
  if (PL.blobs[k] || PL.pend[k]) return;
  PL.pend[k] = 1; PL.running++;
  ttsFetch(PL.segs[k].t).then(b => { if (PL && PL.tok === SPK.tok) PL.blobs[k] = b; },
                               () => { if (PL){ PL.fail++; PL.try[k] = (PL.try[k] || 0) + 1; } })
    .then(() => {
      if (!PL || PL.tok !== SPK.tok) return;
      PL.pend[k] = 0; PL.running--;
      SPK.prep = PL.blobs.filter(Boolean).length; drawBar(); plPump();
    });
}
/* 從正在播的那一段往前看幾段，缺的就補抓（抓壞的也會自動重試）*/
function plPump(){
  if (!PL || PL.tok !== SPK.tok) return;
  const end = Math.min(PL.segs.length, Math.max(PRE_START, PL.i + 1 + PRE_AHEAD));
  for (let k = PL.i; k < end && PL.running < 4; k++){
    if ((PL.try[k] || 0) < 3) plFetch(k);
  }
}
function plWaitAndStart(){
  const my = SPK.tok;
  const tick = () => {
    if (!PL || PL.tok !== my || !SPK.on) return;
    const ready = PL.blobs[0] && (PL.blobs[1] || PL.segs.length < 2);
    if (ready) return plPlay(0);
    if (PL.fail >= 3 && !PL.blobs[0]){
      const txt = PL.segs.map(s => s.t).join('\n');
      stopSpeak(); toast('真人語音連不上，改用裝置語音'); return sayNative(txt);
    }
    setTimeout(tick, 120);
  };

}
function plPlay(k){
  if (!PL || PL.tok !== SPK.tok) return;
  if (k >= PL.segs.length) return stopSpeak();
  const b = PL.blobs[k];
  if (!b){
    if ((PL.try[k] || 0) >= 3){              // 這一段真的抓不到，跳過去，不要卡住整課
      PL.i = k; SPK.i = k; return plPlay(k + 1);
    }
    SPK.buffering = true; SPK.i = k; drawBar(); plPump();   // 還沒到，等一下再播（不跳過）
    return setTimeout(() => plPlay(k), 150);
  }
  SPK.buffering = false;
  PL.i = k; SPK.i = k;
  const els = audioPair(), a = els[PL.cur];
  a.src = URL.createObjectURL(b);
  a.onended = () => {
    if (!PL || PL.tok !== SPK.tok) return;
    try { URL.revokeObjectURL(a.src); } catch(e){}
    PL.cur = 1 - PL.cur;
    plPlay(k + 1);

  a.onerror = () => { if (PL && PL.tok === SPK.tok){ PL.cur = 1 - PL.cur; plPlay(k + 1); } };
  const p = a.play(); if (p && p.catch) p.catch(() => {});
  spkMark(PL.segs[k]);
  drawBar();
  plPump();
  /* 下一段先 load 好，接得上 */
  const nb = PL.blobs[k + 1];

    try { nx.src = URL.createObjectURL(nb); nx.load(); } catch(e){} }
}
async function speak(text, title){

  u.lang = 'zh-TW'; u.rate = 0.94 + S.set.rate * 0.05;

  const v = vs.find(x => /zh[-_]TW|zh[-_]HK|cmn/i.test(x.lang)) || vs.find(x => /^zh/i.test(x.lang));

/* 依句號切句；HTML 標籤不會被切斷，句末的引號跟著前一句走 */
const EN_SENT = false;
function splitHTML(html){
  const out = []; let cur = '', depth = 0, inTag = false, tag = '';
  for (let i = 0; i < html.length; i++){
    const ch = html[i];
    if (!inTag && ch === '<'){ inTag = true; tag = '<'; cur += ch; continue; }
    if (inTag){
      cur += ch; tag += ch;
      if (ch === '>'){
        inTag = false;
        if (/^<\//.test(tag)) depth--;
        else if (!/\/>$/.test(tag) && !/^<(br|img|hr|input|wbr)\b/i.test(tag)) depth++;
      }
      continue;
    }
    cur += ch;
    if (depth !== 0) continue;                       // 標籤內不切
    let brk = '。！？'.includes(ch);
    if (!brk && EN_SENT && '.!?'.includes(ch)){      // 英文：句點後須接空白
      const nx = html[i + 1];
      brk = (nx === undefined || nx === ' ' || nx === '\n') && !/\b[A-Z]$/.test(cur.slice(-2, -1));
    }
    if (!brk) continue;
    while (i + 1 < html.length && '」』）”"\''.includes(html[i + 1])){ i++; cur += html[i]; }
    while (i + 1 < html.length && html[i + 1] === ' '){ i++; cur += html[i]; }
    out.push(cur); cur = '';
  }
  if (cur.replace(/<[^>]*>|\s|&nbsp;/g, '').length) out.push(cur);
  else if (cur && out.length) out[out.length - 1] += cur;
  return out.length ? out : [html];
}

  return out;
}

    const s = D.serm[n];

    else if (WAKE) { WAKE.release(); WAKE = null; }
  } catch(e){}
}
function telePages(bl){
  const pages = []; let cur = [];
  const push = () => { if (cur.length){ pages.push(cur); cur = []; } };
  bl.forEach(b => {
    if (b[0] === 'h' || b[0] === 's'){ push(); cur = [b]; return; }
    if (b[0] === 'w'){ cur.push(b); push(); return; }   // 稿中的停頓 ＝ 換頁
    cur.push(b);
    const chars = cur.reduce((a, x) => a + (typeof x[1] === 'string' ? x[1].length : 0), 0);
    if (cur.length >= 6 || chars > 190) push();
  });
  push();
  return pages.map(p => ({ blocks:p }));
}
function outlinePages(n){
  const m = meta(n), ps = [{ blocks:[['h','《' + m.t + '》'], ['p', m.sub], ['q', m.mv.t + '　' + m.mv.r]] }];
  m.serm.pts.forEach(p => ps.push({ blocks:[['h', p[0]], ['p', '經文　' + p[1]], ['p', p[2]]] }));
  ps.push({ blocks:[['h','結論'], ['p', m.truth]] });
  return ps;
}
function livePages(n){
  const m = meta(n), ps = [];
  ps.push({ sec:600, ttl:'① 破冰　10 分鐘', q:m.grp[0], tip:'讓每個人都說一句。組長先說自己的。' });
  ps.push({ sec:900, ttl:'② 經文共讀　15 分鐘', q:'「' + m.mv.t + '」　' + m.mv.r,
            tip:'逐人讀本章核心經文。讀完，先安靜三十秒，不急著解釋。' });
  m.grp.slice(1).forEach((q, i) => ps.push({
    sec:450, ttl:'③ 討論　第 ' + (i + 2) + ' 題', q,
    tip: i === 1 ? '這是最深的一題。組長先說自己的。不要追問細節；若有人哭，停下來為他禱告，不要接著問下一題。'
       : i === 3 ? '請小組成員在第七天問他一次。' : '' }));
  ps.push({ sec:900, ttl:'④ 操練與代禱　15 分鐘', q:m.prac.main,
            tip:'一人只選一項。彼此指定第七天要問的同伴，然後為彼此禱告。' });
  return ps;
}
function fDraw(){
  if (!F) return;
  const p = F.pages[F.i], b = $('#fbody');
  if (F.tele){
    b.className = 'fbody tele';
    b.innerHTML = p.blocks.map(x =>
      x[0] === 'h' ? `<h5>${esc(x[1])}</h5>` :
      x[0] === 's' ? `<h5>${esc(x[1])}</h5>` :
      x[0] === 't' ? `<p class="qq">${esc(x[1])}</p>` :
      x[0] === 'm' ? `<p class="pause">${esc(x[1])}</p>` :
      x[0] === 'q' ? `<p class="qq">${esc(x[1])}</p>` :
      x[0] === 'w' ? `<p class="pause">停　<b>${x[1]}</b>　秒</p>` :
      `<p>${esc(x[1])}</p>`).join('');
  } else {
    b.className = 'fbody live';
    b.innerHTML = `<h5>${esc(p.ttl)}</h5><p class="qq">${esc(p.q)}</p>` +
      (p.tip ? `<div class="tipbox"><b>💡 帶領提醒</b><br>${esc(p.tip)}</div>` : '');
    F.left = p.sec;
  }
  b.scrollTop = 0;
  $('#frail').style.width = ((F.i + 1) / F.pages.length * 100) + '%';
  $('#fplay').textContent = F.run ? '暫停' : '繼續';
  fClock();
}
function fClock(){
  const s = Math.max(0, Math.round(F.left)), over = F.left < 0;
  const t = (over ? '-' : '') + String(Math.floor(Math.abs(F.left) / 60)).padStart(2, '0') + ':' +
            String(Math.floor(Math.abs(F.left) % 60)).padStart(2, '0');
  const c = $('#fclock'); c.textContent = t; c.classList.toggle('over', F.left < 0);
}
function fTick(){
  clearInterval(FT);
  FT = setInterval(() => { if (!F) return clearInterval(FT); if (F.run) F.left--; fClock(); }, 1000);
}
function fGo(d){
  if (!F) return;
  const i = F.i + d;
  if (i < 0) return;
  if (i >= F.pages.length){ toast('已經是最後一段'); return; }
  F.i = i; fDraw();
}
$('#fx').onclick = () => { if (confirm('結束這個模式嗎？')) fClose(); };
$('#fprev').onclick = () => fGo(-1);
$('#fnext').onclick = () => fGo(1);
$('#fplay').onclick = () => { F.run = !F.run; $('#fplay').textContent = F.run ? '暫停' : '繼續'; };
$('#fA').onclick = () => { S.set.fs = (S.set.fs + 1) % 5; save(); applyFS(); };
if ($('#fLang')) $('#fLang').onclick = toggleSC;
document.addEventListener('keydown', e => {
  if (!F) return;
  if (e.key === 'ArrowRight' || e.key === ' ') { e.preventDefault(); fGo(1); }
  if (e.key === 'ArrowLeft') fGo(-1);
  if (e.key === 'Escape') fClose();
});

/* ===== 搜尋 ===== */
function vSearch(){
  setTitle('搜尋', false);
  const q = (R.q || '').trim();
  let h = `<div class="sect"><p class="eyebrow">搜尋</p>
    <input class="sbox" id="sq" placeholder="經節、原文、關鍵字…（例：4:12、無己、πλήρωμα）" value="${esc(q)}">
    <p class="xs muted" style="margin:8px 0 0">搜尋六章講義、教學講義逐字稿、重點節解經、原文軌跡與爭議地圖。</p></div>`;
  if (q.length >= 1){
    const hit = (t) => t && t.indexOf(q) >= 0;
    const mk = (t) => esc(t).split(esc(q)).join('<mark>' + esc(q) + '</mark>');
    let r = '';
    // 經節
    const vs = [];
    Object.keys(D.txt).forEach(c => (D.txt[c] || []).forEach((t, i) => {
      const ref = c + ':' + (i + 1);
      if (hit(t) || hit(ref)) vs.push([ref, t]);
    }));
    const ex = [];
    Object.keys(BLK).forEach(c => BLK[c].forEach(b => {
      if (hit(b.exp) || hit(b.gram) || hit(b.grk) || hit(b.key) || hit(b.lit)) ex.push(b);
    }));
    if (vs.length){ r += `<h3 class="sec">經文　${vs.length}</h3>`;
      vs.slice(0, 15).forEach(v => r += `<button class="chrow" onclick="openV('${v[0]}')">
        <span class="chn">${esc(v[0])}</span><span style="flex:1"><b style="font-weight:400;font-size:15px;line-height:1.7">${mk(v[1])}</b></span></button>`);
      if (vs.length > 15) r += `<p class="xs muted">（只顯示前 15 筆）</p>`; }
    const my = Object.keys(S.mk).filter(k => hit(mkText(k)) || hit(mkNote(k)));
    if (my.length){ r += `<h3 class="sec">我的畫線　${my.length}</h3>`;
      my.slice(0, 10).forEach(k => r += `<button class="chrow" onclick="mkSheet('${k}')">
        <span class="chn">✍</span><span style="flex:1"><b style="font-weight:400;font-size:15px;line-height:1.7">${mk(mkText(k).slice(0, 40))}…</b>
        ${mkNote(k) ? `<span class="s">${mk(mkNote(k).slice(0, 30))}</span>` : ''}</span></button>`); }
    if (ex.length){ r += `<h3 class="sec">解經　${ex.length}</h3>`;
      ex.slice(0, 12).forEach(b => r += `<button class="chrow" onclick="openV('${b.ch}:${b.a}')">
        <span class="chn">${b.ch}:${b.a === b.z ? b.a : b.a + '–' + b.z}</span>
        <span style="flex:1"><b style="font-weight:400;font-size:15px;line-height:1.7">${mk(((D.txt[b.ch] || [])[b.a - 1] || '').slice(0, 38))}…</b></span></button>`);
      if (ex.length > 12) r += `<p class="xs muted">（只顯示前 12 筆）</p>`; }
    // 章
    const chs = CH.filter(c => hit(c.t) || hit(c.sub) || hit(c.truth) || hit(c.self) ||
      c.card.some(hit) || c.grp.some(hit) || c.safe.some(hit) || hit(c.mv.t));
    if (chs.length){ r += `<h3 class="sec">講義　${chs.length}</h3>`;
      chs.forEach(c => r += `<button class="chrow" onclick="go('course',${c.n})">
        <span class="chn">${String(c.n).padStart(2,'0')}</span>
        <span style="flex:1"><b>${mk(c.t)}</b><span class="s">${mk(c.truth)}</span></span></button>`); }
    // 教學講義逐字稿
    const ls = [];
    Object.keys(D.lesson || {}).forEach(k => {
      const L = D.lesson[k];
      if (hit(L.title)) { ls.push([k, L.title]); return; }
      for (const x of L.blocks){
        const parts = Array.isArray(x[1]) ? x[1] : [x[1]];   // 想更深是一問一答
        const p = parts.find(hit);
        if (p) { ls.push([k, p]); break; }
      }
    });
    if (ls.length){ r += `<h3 class="sec">教學講義　${ls.length}</h3>`;
      ls.slice(0, 12).forEach(x => r += `<button class="chrow" onclick="go('course',${x[0]},'lesson')">
        <span class="chn">${String(x[0]).padStart(2,'0')}</span>
        <span style="flex:1"><b style="font-weight:400;font-size:15px;line-height:1.7">${mk(x[1].slice(0, 44))}${x[1].length > 44 ? '…' : ''}</b></span></button>`);
      if (ls.length > 12) r += `<p class="xs muted">（只顯示前 12 筆）</p>`; }
    // 軌跡
    const tk = D.tracks.filter(t => hit(t.gk) || hit(t.gl) || hit(t.tr) || hit(t.ins) || hit(t.head));
    if (tk.length){ r += `<h3 class="sec">原文軌跡　${tk.length}</h3>`;
      tk.forEach(t => r += `<button class="chrow" onclick="go('tools',0,'tracks')">
        <span class="chn">原</span><span style="flex:1"><b>${mk(t.gk)}</b><span class="s">${mk(t.gl)}　·　${mk(t.ins)}</span></span></button>`); }
    // 爭議
    const is = D.issues.filter(i => hit(i.t) || hit(i.why) || hit(i.say));
    if (is.length){ r += `<h3 class="sec">爭議　${is.length}</h3>`;
      is.forEach(i => r += `<button class="chrow" onclick="openIssue('${i.id}')">
        <span class="chn">⚖</span><span style="flex:1"><b>${mk(i.t)}</b><span class="s">羅 ${esc(i.r)}</span></span></button>`); }
    h += r || `<p class="sm muted" style="margin-top:18px">找不到「${esc(q)}」。試試經節（4:12）、原文（πλήρωμα）或關鍵字（無己、合一、聖靈）。</p>`;
  }
  return h;
}

<script id="tri321">
/* ═══ TRI321 · 繁／简／EN 三語切換（頁首一鍵切換；三個版本在同一個資料夾，用檔名互連） ═══ */
(function () {
  if (window.__tri321) return; window.__tri321 = 1;
  var path = location.pathname, file = (path.split('/').pop() || 'index.html');
  var PAGE = /^en\.html$/i.test(file) ? 'en' : (/^sc\.html$/i.test(file) ? 'sc' : 'tc');
  var INPLACE = typeof window.toggleSC === 'function' && PAGE === 'tc';
  var base = path.replace(/[^\/]*$/, '');
  function isSC() { try { return !!(S && S.set && S.set.sc); } catch (e) { return false; } }
  function cur() { return PAGE === 'en' ? 'en' : (PAGE === 'sc' ? 'sc' : (isSC() ? 'sc' : 'tc')); }
  var has = { tc: true, sc: INPLACE, en: PAGE === 'en' };
  /* 從別的語言跳回來：index.html?lang=sc / tc */
  try {
    var q = new URLSearchParams(location.search).get('lang');
    if (q && PAGE === 'tc' && typeof window.toggleSC === 'function') {
      if ((q === 'sc') !== isSC()) setTimeout(function () { try { toggleSC(); } catch (e) {} paint(); }, 300);
      history.replaceState(null, '', base + file + location.hash);
    }
  } catch (e) {}
  function go(k) {
    if (k === cur()) return;
    if (k === 'en') { location.href = base + 'en.html'; return; }
    if (INPLACE && PAGE === 'tc') { try { toggleSC(); } catch (e) {} paint(); return; }
    if (k === 'sc' && has.scFile) { location.href = base + 'sc.html'; return; }
    location.href = base + 'index.html?lang=' + k;
  }
  var st = document.createElement('style');
  st.textContent = '.tri321{display:inline-flex;flex:none;border:1px solid rgba(127,127,127,.35);border-radius:999px;overflow:hidden;height:30px;margin:0 2px}' +
    '.tri321 button{border:0;background:transparent;color:inherit;font:600 13px/30px system-ui,-apple-system,"PingFang TC",sans-serif;padding:0 9px;min-width:30px;cursor:pointer}' +
    '.tri321 button.on{background:rgba(127,127,127,.28);font-weight:800}' +
    '.tri321 button[hidden]{display:none}#lang.tri-hide{display:none!important}';
  document.head.appendChild(st);
  var box = document.createElement('div'); box.className = 'tri321'; box.setAttribute('role', 'group'); box.setAttribute('aria-label', 'Language');
  [['tc', '繁'], ['sc', '简'], ['en', 'EN']].forEach(function (x) {
    var b = document.createElement('button'); b.type = 'button'; b.setAttribute('data-k', x[0]); b.innerHTML = '<span>' + x[1] + '</span>';
    b.onclick = function () { go(x[0]); }; box.appendChild(b);
  });
  function paint() {
    var c = cur();
    Array.prototype.forEach.call(box.querySelectorAll('button'), function (b) {
      var k = b.getAttribute('data-k'); b.classList.toggle('on', k === c); b.hidden = !(has[k] || k === c);
    });
  }
  function mount() {
    var bar = document.querySelector('header .bar') || document.querySelector('header');
    if (!bar) return setTimeout(mount, 300);
    var old = document.getElementById('lang'); if (old) old.classList.add('tri-hide');
    var fsz = document.getElementById('fsz');
    if (fsz && fsz.parentNode === bar) bar.insertBefore(box, fsz); else bar.appendChild(box);
    paint();
  }
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', mount); else mount();
  /* 有哪些版本：網站上找得到才顯示 */
  function probe(f, k, flag) {
    if (!/^https?:/.test(location.protocol)) return;
    fetch(base + f, { method: 'HEAD', cache: 'no-store' }).then(function (r) { if (r.ok) { has[k] = true; if (flag) has[flag] = true; paint(); } }).catch(function () {});
  }
  if (PAGE !== 'en') probe('en.html', 'en');
  if (PAGE !== 'tc') { has.tc = true; }
  if (!INPLACE) probe('sc.html', 'sc', 'scFile');
  if (PAGE === 'en') { has.sc = true; }   /* 中文版可在 index.html 內切到简体 */
  /* 原本的繁简按鈕被按到（例如全螢幕模式）時，同步標示 */
  if (typeof window.toggleSC === 'function') {
    var t0 = window.toggleSC;
    window.toggleSC = function () { var r = t0.apply(this, arguments); setTimeout(paint, 0); return r; };
    try { toggleSC = window.toggleSC; } catch (e) {}
  }
})();

</script>
