哪裡","","<p><strong>本講義的立場：新約使徒的「根基」職分不再有（2:20）；使徒性的功能（開拓、差傳、植堂）與先知性的功能（造就、安慰、勸勉，林前 14:3）今天仍然需要——作這些事的人不需要、也不應該以「使徒」「先知」為頭銜，更不可以據此要求別人絕對順服、宣稱高過聖經的新啟示。</strong></p><p><strong>321「235」的「5 屬靈戰友五重職份的團隊」</strong>：是以 4:11 的五種<strong>功能</strong>組成的同工團隊——開拓的、說造就的話的、傳福音的、牧養的、教導的——彼此配搭，目的是 4:12：成全每一個聖徒、讓每一個人各盡其職。<strong>那是一個團隊的五種功能，不是五張名片。</strong>團隊裡沒有一個人是另一個人的「遮蓋」；元首只有一位：基督（4:15）。</p><p>次序永遠是：先講升天的基督「將各樣的恩賜賞給人」（4:8），先講 4:4–6 七個「一」，先講 4:16「百節各按各職」——五重職份從那裡長出來，321 才在末端接上去。「牧師和教師」是四重還是五重（共用一個冠詞 τοὺς δὲ ποιμένας καὶ διδασκάλους），第 4 章原文解經三種讀法並陳；<strong>講台的落點不在數目，在目的</strong>。</p>"],["【四】這件事該不該影響你的信心","","<p>不該。<strong>各派都同意：基督把恩賜賜給教會，為要建立他的身體；每一個信徒都有份。</strong>止息論與延續論爭的是某些恩賜與職分今天的形式，不是基督是不是教會的頭。</p><p>如果你曾經在一個自稱有「使徒遮蓋」的團體裡受傷——被要求絕對順服、被一句「先知性的話」改變了婚姻或工作——請知道：4:11 從來不是為了讓某一個人站到你頭上，是為了讓你站起來。<strong>你不是誰的下線，你是身體上的一個關節，「百節各按各職」（4:16）裡也有你的一份供應。</strong>升天的基督把恩賜賞給人，也賞給了你。</p>"]],"con":[],"say":"本講義的全卷立場：新約使徒的根基職分不再有（2:20），使徒性的開拓差傳與先知性的造就勸勉今天仍需要，但不以使徒、先知為頭銜要求順服，不發布高過聖經的新啟示。321「235」的五重職份團隊是五種功能的配搭，不是五張名片；目的是 4:12 成全每一個聖徒、各盡其職；元首只有基督（4:15）。","care":"牧養底線：不自封、不封人為使徒或先知；不以職分頭銜要求順服、奉獻或忠誠（紅線六；回指哥林多後書立場三）。不把五重職份講成升遷的階梯——「你現在是教師，將來可以升到使徒」；不讓「團隊」變成五個人在台上、其他人在台下，4:16 的檢驗標準是：每一個關節都在供應嗎？不用「先知性的話」替別人決定婚姻、工作、搬遷，任何「神對你說」都要被聖經與群體察驗。席上可能有從控制性團體出來、聽到「使徒」「遮蓋」就發抖的人：讓他知道他的感受是真的，不催他立刻批評過去的團體，會後單獨陪他；也可能有從來不覺得自己有恩賜的人，對他講 4:7「我們各人」。"},{"id":"ISS00_6","t":"「在以弗所」的古卷、傳閱信說與作者問題——以弗所書是寫給誰的？誰寫的？","r":"1:1；3:1--4；6:21--22","ch":[],"why":"全卷通用：作者與收信人。1:1 的「在以弗所」三份最早的抄本沒有；以弗所書的長句、用字與教會觀，又讓近兩百年來不少學者主張這是保羅的門生託名寫成的。這兩件事不改變福音，卻會改變讀者怎樣聽 3:1「被囚的」、6:20「帶鎖鍊的使者」這些第一人稱的話，也決定了全卷怎樣把以弗所書與使徒行傳、歌羅西書放在一起讀，必須在開卷交代清楚。","pos":[["【一】經文問的是甚麼","","<p>信一開頭就說：「奉神旨意，作基督耶穌使徒的保羅，寫信給在以弗所的聖徒，就是在基督耶穌裡有忠心的人。」（1:1）信中兩次自稱被囚：「因此，我－保羅為你們外邦人作了基督耶穌被囚的」（3:1），「我為主被囚的勸你們」（4:1），信末又說自己是「帶鎖鍊的使者」（6:20），並且差推基古送信（6:21–22）。</p><p>但有兩個問題。<strong>一、收信人</strong>：「在以弗所」（ἐν Ἐφέσῳ）在 P46（約主後 200 年的蒲草紙抄本）、西乃抄本與梵諦岡抄本的原文都沒有（後來才有人補上），SBLGNT 因此加上方括號；二世紀的馬吉安把這封信稱為「致老底嘉人書」。加上信裡沒有問安、口氣像寫給不認識他的人（1:15；3:2），這封信真的是寫給以弗所一城的嗎？<strong>二、作者</strong>：以弗所書的句子特別長（1:3–14 原文一句兩百多字），用字與保羅公認的書信有些不同，「教會」多指普世的教會，又與歌羅西書高度相似（見 ISS00_7）。<strong>經文問的是：這封信寫給誰？是誰寫的？寫於何時何地？</strong></p>"],["收信人：以弗所一城說","","<p>認為這封信就是寫給以弗所教會的。絕大多數的抄本、所有古代譯本的標題都有「致以弗所人」，早期教父也一致這樣稱呼它；和合本照這個讀法譯出「在以弗所」。這派的優點是尊重教會傳承的一致見證，而且信中處處可以對上以弗所城的背景：法術、執政掌權者、偶像、猶太人與外邦人。</p><p><strong>難處：</strong>保羅在以弗所住了將近三年（〔背景〕徒 20:31），臨別時長老們「抱著保羅的頸項，和他親嘴」（徒 20:37），這封信卻沒有一個人名的問候，還說「我既聽見你們信從主耶穌」（1:15），「諒必你們曾聽見神賜恩給我」（3:2），「如果你們聽過他的道」（4:21）——這些話寫給他親手建立、天天一起生活了三年的教會，顯得很不自然。三份最早的抄本沒有「在以弗所」，也需要解釋。</p>"],["收信人：傳閱信說（以以弗所為中心、在亞細亞眾教會傳閱）","","<p>認為這是一封寫給亞細亞省眾教會的傳閱信，以弗所是省會與交通樞紐，信很可能先到以弗所，再傳到附近各城；有學者推測最初的抄本在 1:1 留了空位，各教會抄寫時填上自己的城名，最後流傳最廣、保存最多的是以弗所的抄本。歌羅西書提到「你們也要念從老底嘉來的書信」（西 4:16），有人認為那封信就是這封傳閱信傳到老底嘉的那一份——這也可以解釋馬吉安為甚麼稱它為「致老底嘉人書」。這派把沒有問安、口氣疏遠、早期抄本缺字三件事一起解釋了。</p><p><strong>難處：</strong>「留空位」的推測沒有任何一份實際的抄本可以證明；1:1 原文在沒有「在以弗所」時，句子讀起來也有些彆扭（τοῖς ἁγίοις τοῖς οὖσιν καὶ πιστοῖς）。而且若是傳閱信，為甚麼所有抄本的標題都只說「致以弗所人」，沒有留下其他城市的名字？</p>"],["作者：保羅親筆說","","<p>認為以弗所書是保羅在監獄中寫的（或口述、由書記筆錄），這是教會兩千年的傳統看法。二世紀的教父已經引用這封信，愛任紐明說它是保羅寫的；信中自稱保羅兩次（1:1；3:1），又有具體的個人細節（6:19–22）。風格的不同可以用題材解釋：這是一封頌讚與禱告很多的傳閱信，不是回答問題的辯論信；用字差異的程度，其實和保羅公認的書信彼此之間的差異差不多。今天霍納（Harold Hoehner）、奧布萊恩（Peter O'Brien）、阿諾德等學者都為這個看法詳細辯護。</p><p><strong>難處：</strong>它需要說明以弗所書與歌羅西書之間的高度相似（見 ISS00_7），以及某些神學重點的變化——例如「一同坐在天上」（2:6）的「已然」口氣比其他書信更強，「教會」幾乎都指普世的教會。這些不是不能解釋，但需要一一面對，不能只用「傳統如此」帶過。</p>"],["作者：門徒託名說（保羅過世後，他的門生以他的名義寫成）","","<p>十九世紀以來，不少批判學者認為以弗所書是保羅死後，他的門生把老師的思想整理、發展，以保羅的名義寫給下一代教會的；理由是長句與用字、對歌羅西書的依賴、更「發展」的教會觀與末世觀，以及 2:20「被建造在使徒和先知的根基上」聽起來像是回頭看使徒時代。林肯（Andrew Lincoln）、貝斯特（Ernest Best）等是這派的代表。這派的優點是認真看待文本上的差異。</p><p><strong>難處：</strong>一封叮嚀「你們要棄絕謊言，各人與鄰舍說實話」（4:25）的信，若本身是冒名之作，道德上的張力很大；6:21–22 差推基古報告「我的景況」的細節，若是虛構，更難說得通。初期教會對託名之作的態度其實很嚴：二世紀有長老因冒保羅之名寫作而被革職（特土良記載）。而且「發展」與否的判斷，常常預設了學者自己對保羅思想應該長甚麼樣子的設定。</p>"],["寫作地點：羅馬、該撒利亞或以弗所的監獄","","<p>保羅在新約記載中至少有三次較長的監禁可以考慮。<strong>羅馬說</strong>是傳統看法：「保羅在自己所租的房子裡住了足足兩年。凡來見他的人，他全都接待」（徒 28:30），這與 6:19–20 他還能「放膽講論」相合，年代約在主後 60–62 年。<strong>該撒利亞說</strong>指徒 23–26 章的兩年監禁。<strong>以弗所說</strong>則推測保羅在以弗所也曾被囚（根據林後 1:8–10 的苦難），但新約沒有明文記載。</p><p><strong>難處：</strong>每一個說法都沒有信中的明文支持，信裡沒有說「我在羅馬」；以弗所說若成立，「寫信給在以弗所的聖徒」就成了寫給自己所在之城，更加不自然。所以這一題只能作「較可能」的判斷，不能講成確定的事實。</p>"],["【三】本講義站在哪裡","","<p><strong>本講義的判斷：以弗所書是保羅所寫（或在他監督下由同工筆錄），寫於羅馬監獄，約主後 60–62 年；很可能是一封以以弗所為中心、在亞細亞眾教會傳閱的信。</strong>經文照和合本保留「在以弗所」，第 1 章原文解經交代三份最早抄本的缺字與傳閱信說；App 原文欄保留方括號並加註。</p><p>理由有三：一、信中的自我陳述（1:1；3:1；4:1；6:20）與個人細節（6:21–22）若當作虛構，比當作真實難解釋得多；二、初期教會一致把它歸給保羅；三、沒有問安、口氣疏遠、早期抄本缺字，用傳閱信說最能一起解釋。門徒託名說的觀察——長句、用字、與歌羅西書的關係——本講義照實陳列，不迴避；但不採它的結論。</p><p>各章碰到作者、收信人與寫作地點的問題，一句帶過，回指這裡；保羅在以弗所的事工見本系列使徒行傳講義第 19–20 章，羅馬的監禁見使徒行傳講義第 28 章。</p>"],["【四】這件事該不該影響你的信心","","<p>不該。這封信是寫給以弗所一城還是亞細亞眾教會、是保羅親筆還是書記筆錄，爭的是這封信怎樣送到讀者手上，不是這封信說了甚麼。不論收信人在以弗所、老底嘉還是歌羅西，他們聽到的都是同一句話：「你們得救是本乎恩，也因著信」（2:8）。古卷的缺字反而說明一件事：教會兩千年來把抄本的差異一一記下來，沒有藏起來——我們手上的經文，是在光天化日之下被小心傳下來的。</p><p>這一題還有一層溫柔：寫這封信的人手上綁著鎖鍊。他沒有因為坐監而只寫自己的苦，反而一開口就是「願頌讚歸與我們主耶穌基督的父神」（1:3）。<strong>一封從監獄寄出、在許多教會之間傳來傳去的信，今天也傳到了你手上。</strong></p>"]],"con":[],"say":"本講義的判斷：以弗所書是保羅所寫（或在他監督下由同工筆錄），寫於羅馬監獄，約主後 60–62 年；很可能是一封以以弗所為中心、在亞細亞眾教會傳閱的信。經文照和合本保留「在以弗所」，原文解經交代三份最早抄本的缺字；門徒託名說的觀察照實陳列，但不採它的結論。這個判斷不影響解經。","care":"這一題容易在查經班裡變成考據課，讓不熟悉抄本與學術的弟兄姊妹覺得自己讀不懂聖經，也可能讓剛接觸「古卷沒有這幾個字」「有學者說不是保羅寫的」的年輕人突然不安。講台上一兩句帶過就好，不要把學者的名字當成炫耀的資本；遇到真心被這些問題困擾的人，會後單獨陪他讀，先肯定他願意誠實發問，再陪他看教會怎樣光明正大地處理抄本差異。也可以帶會眾留意 3:1 與 6:20：寫信的人在坐監——教會裡正在受限制、覺得自己不能再事奉的人，需要聽見這一點。"},{"id":"ISS00_7","t":"以弗所書與歌羅西書——同一位送信人、相近的內容，兩封信是甚麼關係？","r":"6:21--22；西 4:7--9","ch":[],"why":"全卷通用：兩封監獄書信。以弗所書與歌羅西書由同一位送信人推基古帶去，內容相近的段落很多，連交代送信人的那兩節都幾乎一字不差。這引出幾個問題：哪一封先寫？是同一位作者嗎？還是有人照著歌羅西書寫成了以弗所書？讀以弗所書時要不要拿歌羅西書來對照？這兩封信的關係決定了全卷許多平行經文怎樣讀，也和 ISS00_6 的作者問題緊密相連，必須在開卷交代清楚。","pos":[["【一】經文問的是甚麼","","<p>兩封信交代送信人的話幾乎完全相同。以弗所書說：「今有所親愛、忠心事奉主的兄弟推基古，他要把我的事情，並我的景況如何全告訴你們」（6:21），歌羅西書說：「有我親愛的兄弟推基古要將我一切的事都告訴你們」（西 4:7）；接下來一句，兩封信在和合本裡一字不差：「我特意打發他到你們那裡去，好叫你們知道我們的光景，又叫他安慰你們的心」（6:22；西 4:8）。</p><p>相近的還不只這兩節。「舊人」「新人」（4:22–24；西 3:9–10）、「詩章、頌詞、靈歌」（5:19；西 3:16）、全身靠著元首聯絡（4:16；西 2:19）、妻子丈夫、兒女父親、僕人主人的家規（5:22–6:9；西 3:18–4:1）——歌羅西書大約有三分之一的內容，可以在以弗所書裡找到相近的段落。<strong>經文問的是：這兩封信是甚麼關係？哪一封先寫？差異在哪裡、為甚麼？</strong></p>"],["保羅擴寫說（保羅先寫歌羅西書，再把相同的主題擴寫成給眾教會的傳閱信）","","<p>認為保羅在羅馬監獄中，因為歌羅西教會出現特定的錯謬（敬拜天使、守節期與飲食規條，西 2:16–18），先寫了歌羅西書；同時，他把這些思想擴大、沉澱，寫成一封給亞細亞眾教會的傳閱信，交給同一位送信人推基古一起帶去。所以兩封信的相似，是同一位作者在同一段時間、腦中帶著同一批思想寫信的自然結果。這派的優點是同時解釋了相似與差異：歌羅西書急、短、有對手；以弗所書寬、長、沒有對手。</p><p><strong>難處：</strong>它需要說明為甚麼同一位作者在幾天或幾週之內，會把同一個字用出不同的重點——例如「奧祕」，歌羅西書說是「基督在你們心裡成了有榮耀的盼望」（西 1:27），以弗所書說是「外邦人在基督耶穌裡，藉著福音，得以同為後嗣」（3:6）。不過這也可以理解為同一個奧祕的兩個面向。</p>"],["後人仿作說（保羅的門生照著歌羅西書寫成以弗所書）","","<p>認為以弗所書的作者手上有歌羅西書，把它當作範本，擴充、重組、加上自己的神學發展；6:21–22 幾乎逐字抄自西 4:7–8，正是仿作者借用真實書信細節的痕跡。這派與 ISS00_6 的門徒託名說是同一套論證，優點是認真解釋了兩封信在字句上的高度重疊。</p><p><strong>難處：</strong>兩封信相近的段落，很少是成段照抄，多半是相同的字詞以不同的次序、在不同的上下文中出現——這比較像同一個人的口頭習慣，不像一個人照著範本抄寫。而且以弗所書在家規裡加上的 5:21「彼此順服」與 5:25–32 基督與教會的奧祕，是全段最深刻的部分；若是仿作者所加，他就比原作者更有創造力——這本身也需要解釋。</p>"],["以弗所書在先說（先寫以弗所書，再寫針對特定錯謬的歌羅西書）","","<p>少數學者認為以弗所書先寫，是保羅一般性的教導；之後聽到歌羅西的特定問題，再把相同的內容濃縮、加上針對錯謬的辯論，寫成歌羅西書。這派指出：一般的教導先成形、再應用到特定處境，也是傳道人常見的習慣。它也提醒讀者，不要先入為主地以為較長的一定是較晚的。</p><p><strong>難處：</strong>歌羅西書提到推基古時多了一位同行的阿尼西謀（西 4:9），並且有一長串的問安，以弗所書則省去了這些；這比較像是同時寄出時，個人細節放在寫給特定教會的那一封裡。多數學者認為兩封信的先後難以斷定，但「以弗所書在先」的證據最少。</p>"],["【三】本講義站在哪裡","","<p><strong>本講義的立場：兩封信都是保羅在羅馬監獄中、差同一位送信人推基古同時帶去的；歌羅西書寫給一間面對特定錯謬的教會，以弗所書寫給亞細亞眾教會傳閱（見 ISS00_6）。先後次序不作硬性決定，但兩封信要對照著讀。</strong></p><p>一個簡單的記法：<strong>歌羅西書的重心是「基督是教會的頭」，以弗所書的重心是「教會是基督的身體」。</strong>歌羅西書說「他也是教會全體之首」（西 1:18），以弗所書說「教會是他的身體，是那充滿萬有者所充滿的」（1:23）。讀以弗所書遇到平行經文，第一步是對照歌羅西書，第二步是看以弗所書<strong>多說了甚麼</strong>——那往往就是這封信的重心。最明顯的例子是家規：歌羅西書直接從「你們作妻子的」（西 3:18）開始，以弗所書卻先加上「又當存敬畏基督的心，彼此順服」（5:21），又用了八節講基督怎樣愛教會（5:25–32）。</p><p>後人仿作說的觀察本講義照實陳列，但不採它的結論。各章碰到兩封信的平行經文，一句帶過，回指這裡；第 5、6 章的家規段一律把西 3:18–4:1 並列。</p>"],["【四】這件事該不該影響你的信心","","<p>不該——反過來說，兩封信的相似正好讓我們看見保羅怎樣作牧者。對一間正在被錯謬拉走的小城教會，他寫得短、寫得急，一句一句拆掉對方的論證；對一群散在各城的教會，他寫得寬、寫得慢，帶他們跪下來禱告。<strong>同一個福音、同一位送信人、同一段監禁，卻有兩種寫法——因為收信的人不一樣。</strong></p><p>這也給今天的講台一個榜樣：同一位基督，對正在懷疑「基督夠不夠」的人，要講歌羅西書的「頭」；對正在懷疑「我屬不屬於這裡」的人，要講以弗所書的「身體」。推基古帶著兩封信上路，也帶著兩種安慰：「又叫他安慰你們的心」（6:22）。</p>"]],"con":[],"say":"本講義的立場：以弗所書與歌羅西書都是保羅在羅馬監獄中、差同一位送信人推基古同時帶去的；歌羅西書寫給面對特定錯謬的教會，重心是「基督是教會的頭」，以弗所書是傳閱信，重心是「教會是基督的身體」。先後不作硬性決定；讀平行經文時先對照，再看以弗所書多說了甚麼。後人仿作說照實陳列，不採其結論。","care":"這一題容易讓信徒以為「聖經是互相抄來抄去的」而不安，或讓查經變成兩欄對照的文字遊戲。講台上不需要展開學術爭論，只要讓會眾看見同一位牧者怎樣對不同的教會說話。也要想到會眾裡那些覺得自己「只是重複別人做過的事」、看不見自己事奉價值的人——推基古只是送信的人，名字卻在兩封信裡都被稱為「親愛的兄弟」；送信、轉述、安慰人的事奉，在神面前一點也不小。不要用這一題製造「哪一封信比較深」的比較。"},{"id":"ISS00_8","t":"以弗所教會的歷史——從使徒行傳到啟示錄，這間教會怎樣走過三十年？","r":"徒 19:1--41；20:17--38；啟 2:1--7","ch":[],"why":"全卷通用：一間教會的三十年。以弗所教會是新約裡被記錄得最完整的一間教會：使徒行傳 18–20 章它的誕生與興旺，以弗所書它被寫信的那一刻，提摩太前後書它面對假教師，啟示錄 2:1–7 它被主責備「把起初的愛心離棄了」。這條線怎樣讀，會影響讀者怎樣聽以弗所書裡的每一個「愛」字，也是今天每一間第二代、第三代教會都要照的鏡子，必須在開卷交代清楚。","pos":[["【一】經文問的是甚麼","","<p>這間教會的故事大約跨了四十年。保羅第二次旅行末了第一次到以弗所，只短暫停留，臨走時說「神若許我，我還要回到你們這裡」（徒 18:21），留下百基拉、亞居拉，亞波羅也在那裡講道（〔背景〕徒 18:24–28）。第三次旅行他回來了：先在會堂三個月，再到推喇奴的學房，「這樣有兩年之久，叫一切住在亞細亞的，無論是猶太人，是希臘人，都聽見主的道」（徒 19:10）；行邪術的人把書燒了，「主的道大大興旺，而且得勝，就是這樣」（徒 19:20）；接著是亞底米神廟銀匠煽動的暴動（〔背景〕徒 19:23–41）。</p><p>之後保羅在米利都向以弗所的長老告別，流淚警告：「我知道，我去之後必有兇暴的豺狼進入你們中間，不愛惜羊群」（徒 20:29）。幾年後他從羅馬監獄寫信來（以弗所書），又「曾勸你仍住在以弗所，好囑咐那幾個人不可傳異教」（提前 1:3）。大約三十年後，復活的主在啟示錄裡對這間教會說：「我知道你的行為、勞碌、忍耐」（啟 2:2），「然而有一件事我要責備你，就是你把起初的愛心離棄了」（啟 2:4）。<strong>經文問的是：這條線要怎樣讀？是一間教會的衰退，還是一間教會的堅持？以弗所書在這條線上站在哪裡？</strong></p>"],["衰退說（從「親愛眾聖徒」到「離棄起初的愛心」，一間教會的下坡）","","<p>認為這條線是一間教會由盛轉衰的故事：使徒行傳裡的以弗所充滿聖靈的能力，以弗所書裡的以弗所以「親愛眾聖徒」（1:15）著稱，到了啟示錄，只剩下行為、勞碌與正統，愛心卻離棄了。這派的優點是讓這條線成為一個清楚的警告：教會可以在正確裡死去，熱心可以變成例行公事。</p><p><strong>難處：</strong>啟示錄 2 章其實先稱讚了這間教會：「你也曾試驗那自稱為使徒卻不是使徒的，看出他們是假的來」（啟 2:2），「你也能忍耐，曾為我的名勞苦，並不乏倦」（啟 2:3）——保羅在米利都所憂慮的豺狼，他們確實擋住了。只講衰退，就看不見他們忠心的一面；而且主說「應當回想你是從哪裡墜落的，並要悔改」（啟 2:5），這是一扇開著的門，不是一張死亡證明。</p>"],["正統的代價說（守住了真道，卻在守的過程中失去了愛）","","<p>認為以弗所教會的問題不是不忠心，而是太專注於分辨與抵擋，以致愛心漸漸冷卻：他們聽進了保羅的警告「應當警醒」（徒 20:31），也聽進了提摩太的囑咐，把假使徒一個一個試驗出來；可是在「試驗」與「恨惡尼哥拉一黨人的行為」（啟 2:6）之間，那份「用愛心說誠實話」（4:15）的「愛心」不見了，只剩下「誠實話」。這派的優點是把這間教會的故事講得很有層次，也很貼近今天許多強調真理的教會。</p><p><strong>難處：</strong>這是一個合理的推想，但經文沒有明說兩者的因果；若講得太滿，容易讓會眾以為「重視真理就會失去愛心」，於是不敢分辨。以弗所書本身的答案是兩者並存：4:14 要我們不再「被一切異教之風搖動」，4:15 緊接著說「惟用愛心說誠實話」。</p>"],["持續說（啟示錄的呼召有了回應；以弗所教會在二世紀仍然忠心）","","<p>認為不要把啟示錄 2 章當成這間教會的最後一頁。教會傳統（愛任紐）說使徒約翰晚年住在以弗所；主後二世紀初，安提阿的伊格那丟赴殉道途中寫信給以弗所教會，稱讚他們不容異端在他們中間撒種，也稱讚他們的愛心與合一。以弗所後來還成為重要的教會中心，431 年在那裡召開了大公會議。這派的優點是讓啟示錄的責備有一個盼望的回音：主的責備是為了挽回，而挽回是可能的。</p><p><strong>難處：</strong>二世紀的資料畢竟在新約之外，不能和經文同等權威；而且一間教會在某個時期回轉，不代表它此後一直如此——到了中世紀，以弗所城本身衰落，燈臺最後真的從原處被挪去了。持續說若講成「教會一定會好起來」，也就失去了啟示錄的警告。</p>"],["【三】本講義站在哪裡","","<p><strong>本講義的立場：把這條線當成一間真實教會的三十年來讀——有興旺、有忠心、有冷淡，也有主的呼召；以弗所書站在這條線的中間，它的每一個「愛」字都是一劑預防針。</strong></p><p>以弗所書從愛開始，也在愛裡結束：揀選的動機是「又因愛我們」（1:5），保羅的禱告是要他們「能以和眾聖徒一同明白基督的愛是何等長闊高深」（3:18），身體要「在愛中建立自己」（4:16），丈夫要「正如基督愛教會」（5:25）；信的最後一句「並願所有誠心愛我們主耶穌基督的人都蒙恩惠」（6:24），原文直譯是「凡在不朽壞之中愛我們主耶穌基督的人」（ἐν ἀφθαρσίᾳ）。<strong>保羅寫給這間教會的最後一個詞是「不朽壞」；三十年後，主責備他們的是愛心離棄了。</strong>這不是保羅的失敗，是一面每一代教會都要照的鏡子：真道可以守住，愛卻需要每一代重新領受。</p><p>各章的〔背景〕互見行指向本系列使徒行傳講義第 18–20 章；啟示錄 2:1–7 的討論留待啟示錄講義，本卷只說這是同一間教會，不另立末世解釋。</p>"],["【四】這件事該不該影響你的信心","","<p>不該——反過來說，這條線是給信心的禮物。聖經沒有把以弗所教會修飾成一間完美的教會，它誠實地記下了興旺，也記下了冷淡；而那位責備他們的主，同時是「在七個金燈臺中間行走的」（啟 2:1）——他沒有離開，他在燈臺中間走著，看著，呼召著。</p><p>如果你所在的教會已經走過了第一代的熱火，正在第二代、第三代的「行為、勞碌、忍耐」裡，以弗所書與啟示錄一起對你說：<strong>回到起初的愛，不是回到起初的熱鬧，是回到「他因愛我們」</strong>。「得勝的，我必將神樂園中生命樹的果子賜給他吃」（啟 2:7）——這個應許，是說給一間被責備的教會聽的。</p>"]],"con":[],"say":"本講義的立場：以弗所教會從使徒行傳 18–20 章到啟示錄 2:1–7，是一間真實教會的三十年——有興旺、有忠心、有冷淡，也有主的呼召；以弗所書站在這條線中間，從「又因愛我們」寫到「不朽壞」的愛，是給每一代教會的預防針：真道可以守住，愛卻需要每一代重新領受。啟示錄的末世解釋本卷不另立。","care":"這一題容易被用來批評別的教會「已經失去起初的愛心」，或被用來責備老信徒「你們以前比較火熱」——不要這樣用。席上會有在教會裡事奉了幾十年、已經累了、不敢承認自己的愛冷了的同工，對他們，先肯定啟 2:2–3 的「勞碌、忍耐」，再溫柔地指向「他因愛我們」，不要用罪咎感催逼他們更賣力；也會有因教會冷淡而受傷、想離開的人，對他們講主仍在燈臺中間行走。身心耗竭的同工，必要時會後單獨關心，鼓勵休息，協助尋求專業協助。"},{"id":"ISS00_9","t":"這些爭議該不該影響一個人的信心？","r":"4:3--6；4:13--15","ch":[],"why":"全卷通用：爭議與信心。這一卷的議題頁要陳列許多爭論：加爾文派與阿米念派、互補派與平等派、止息論與延續論、執政掌權者是靈界還是結構、保羅親筆還是門徒託名、「在以弗所」的古卷。有些讀者會因此鬆一口氣，有些讀者卻會開始不安：連揀選和家庭都有爭論，我信的到底可不可靠？而以弗所書本身又是一封叫人「竭力保守聖靈所賜合而為一的心」、又叫人「不再作小孩子」的信。甚麼可以有不同看法、甚麼不能讓，必須在開卷講清楚。","pos":[["【一】經文問的是甚麼","","<p>以弗所書同時給了兩幅圖。一幅是合一：「用和平彼此聯絡，竭力保守聖靈所賜合而為一的心」（4:3），接著是七個「一」：「身體只有一個，聖靈只有一個，正如你們蒙召同有一個指望。一主，一信，一洗，一神，就是眾人的父」（4:4–6）。另一幅是堅定：「使我們不再作小孩子，中了人的詭計和欺騙的法術，被一切異教之風搖動，飄來飄去，就隨從各樣的異端」（4:14）。合一不是甚麼都可以；堅定也不是甚麼都要爭。兩幅圖之間的那一句是：「惟用愛心說誠實話，凡事長進，連於元首基督」（4:15）。</p><p>這一卷的議題頁會陳列許多爭論，有歷史的、有語法的、有神學的、有牧養實踐的。<strong>經文問的是：甚麼是「一信」，不能讓？甚麼是可以有不同看法的事，要彼此寬容？一個人知道了這麼多爭議以後，信心該建立在哪裡？</strong></p>"],["完美答案說（每一題都必須有唯一的標準答案，信心才站得住）","","<p>認為一位真正信靠聖經的人，在每一個議題上都應當有清楚而唯一的答案；承認有爭議，就是承認聖經不清楚，信心就會動搖。所以教會應當在揀選、性別、恩賜、屬靈爭戰等每一題上都立好標準答案，要信徒照著相信，才不會「被一切異教之風搖動」（4:14）。這派的心志是保護信徒，這份心是好的。</p><p><strong>難處：</strong>它把 4:14 的「異端」和教會內部敬虔的人之間的不同看法混在一起了。把每一題都升格成「一信」，結果是七個「一」變成七十個「一」，合一就只剩下和自己意見完全相同的人；保羅自己承認「我們如今彷彿對著鏡子觀看，模糊不清」（林前 13:12），在某些事上也說「只是各人心裡要意見堅定」（羅 14:5）。而且信心若建立在每一題都答對上，任何一題的答案一動，整個信仰就跟著倒。</p>"],["爭議即不可靠說（既然甚麼都有爭論，信仰就只剩個人意見）","","<p>認為既然學者們連揀選、婚姻、恩賜、作者都意見分歧，那就表示聖經沒有確定的教導，每個人照自己的感覺讀就好；合一就是不談真理、彼此不要說對錯。這派誠實地面對了爭議的存在，也提醒教會不要假裝一切都很簡單、不要用自己的答案壓人。</p><p><strong>難處：</strong>它把爭議的「細節」與爭議的「範圍」混在一起了。加爾文派與阿米念派爭的是揀選怎樣運作，卻沒有人否認「你們得救是本乎恩，也因著信」（2:8）；互補派與平等派爭的是家庭的分工，卻沒有人否認丈夫要「為教會捨己」那樣愛妻子；止息論與延續論爭的是恩賜的形式，卻沒有人否認元首只有基督。而且 4:14 明說有「人的詭計和欺騙的法術」——真理不是可有可無的，沒有真理的合一，只是一群一起漂流的人。</p>"],["中心與邊緣說（「一信」不能讓，其餘的事可以有不同看法）","","<p>認為以弗所書本身就劃出了一條線。<strong>不能讓的</strong>，是 4:4–6 的七個「一」所標出的中心：一位父神、一位主基督、一位聖靈，一個身體、一個指望、一信、一洗；以及這封信反覆宣告的福音：我們「藉這愛子的血得蒙救贖，過犯得以赦免」（1:7），「你們得救是本乎恩，也因著信」（2:8），基督「遠超過一切執政的、掌權的」（1:21）。<strong>可以有不同看法的</strong>，是在這中心之外的解釋、歷史與實踐的問題：作者與收信人、揀選的運作方式、家庭的分工形式、恩賜今天的樣子、執政掌權者怎樣運作。</p><p><strong>難處：</strong>中心與邊緣的界線本身有時也會被爭論——有人會說性別或恩賜就是中心。所以劃線的時候，要以經文自己最清楚、最反覆強調的事為中心，而不是以某一個宗派最在意的事為中心；並且要記得，「一洗」本身的形式（浸禮或點水、嬰兒洗禮）也是各宗派有不同看法的地方——「一」說的是同一位主、同一個歸入，不是同一種做法。</p>"],["【三】本講義站在哪裡","","<p><strong>本講義的立場：採中心與邊緣的讀法，以 4:4–6 的七個「一」為中心。</strong>一位神、一位主、一位聖靈，一個身體、一個指望、一信、一洗——這幾件事各派都同意，兩千年沒有被任何學術爭論動搖。加上以弗所書自己的福音：基督的血使我們得蒙救贖（1:7），得救是本乎恩、也因著信（2:8），神叫我們與基督一同活過來、一同坐在天上（2:5–6），牆已經拆毀（2:14），基督是教會的元首（4:15）。</p><p>其餘的事，本講義照鐵律三：先陳列各家、說出各自的難處、再給判斷，並且把判斷的理由講出來；講台與教學場上一句帶過，指向議題頁與 ISS00_1–5。古卷異文（1:1；4:9；5:30）、5:22 原文沒有動詞、6:2–3 和合本合併節，都照實交代，不講成懷疑。</p><p>全卷的地勢最高點是 3:20–21，引它時一律引全句：「神能照著運行在我們心裡的大力充充足足地成就一切，超過我們所求所想的。但願他在教會中，並在基督耶穌裡，得著榮耀，直到世世代代，永永遠遠。阿們！」（3:20–21）爭議可以留在議題頁裡，這兩節要帶回家。</p>"],["【四】這件事該不該影響你的信心","","<p>不該。信心不是建立在「我對每一題都有答案」上，而是建立在那一位「因他愛我們的大愛」（2:4）叫我們與基督一同活過來的神身上。學者的爭論會一直持續下去；但你可以在不知道 1:1 有沒有「在以弗所」、不確定自己是加爾文派還是阿米念派的情況下，完全確定自己是神家裡的人（2:19），因為你「受了所應許的聖靈為印記」（1:13）。</p><p>這一卷要讀完的人，<strong>不是更會辯論，而是更能「用愛心說誠實話」（4:15）</strong>——在不同意彼此的時候，仍然「用愛心互相寬容」（4:2）；在必須說真話的時候，仍然記得對方是同一個身體上的肢體。<strong>讀完這一卷的人，是更愛主，還是更佩服作者？</strong>若是更愛主，爭議就各歸其位了。</p>"]],"con":[],"say":"本講義的立場：以 4:4–6 的七個「一」為中心——一位神、一位主、一位聖靈，一個身體、一個指望、一信、一洗，加上得救本乎恩、也因著信，基督是元首；其餘解釋、歷史與實踐的問題，先陳列各家、說出難處、再給判斷，講台一句帶過、指向議題頁與 ISS00_1–5。不把邊緣升格成中心，也不用合一取消真理：用愛心說誠實話。","care":"席上會有正在信仰危機裡、問題多到不敢說出口的人，也會有一聽到「學者有爭論」「古卷沒有這幾個字」就不安、覺得教會怎麼甚麼都不確定的人，還有曾經在某一題上——預定、順服、恩賜、趕鬼——被教會傷過、因此連神也不敢信的人。對第一種人，不要說「你就是信心不夠」，也不要急著用一堆答案堵住他，先陪他；對第二種人，指給他看 4:4–6 與 2:8 那幾件從來沒有被任何爭議動搖的事；對第三種人，讓他知道傷他的是人錯用了經文，不是那位愛他、為他捨己的基督（5:2）。疑惑若伴隨長期的失眠、無望感或輕生念頭，會後單獨關心，必要時協助尋求專業協助。"},{"id":"ISS01_1","t":"1:1「在以弗所」三份最早的抄本沒有——這封信是寫給誰的？","r":"1:1；西 4:16；徒 19:1--10","ch":[1],"why":"和合本第一節清楚寫著「在以弗所」，但新約最早的三份重要抄本原文都沒有這幾個字，現代的希臘文版本也因此加上方括號。會眾在網路上或新譯本的註腳裡讀到這件事，常會擔心聖經被改過；而這一題的答案，又決定我們怎樣讀整封信——它是寫給一間教會的私信，還是寫給每一間教會的信。","pos":[["【一】經文問的是甚麼","","<p>「奉神旨意，作基督耶穌使徒的保羅，寫信給在以弗所的聖徒，就是在基督耶穌裡有忠心的人。」（1:1）<strong>ἐν Ἐφέσῳ</strong>（en Ephesō）在 P46（約主後 200 年的蒲草紙抄本）、西乃抄本、梵諦岡抄本的原文都沒有，是後來才被補上的；二世紀的馬吉安稱這封信為「致老底嘉人書」。再加上信裡沒有任何一個人名的問安，保羅還說「我既聽見你們信從主耶穌」（1:15），口氣像寫給不太認識他的人。問題是：這封信原本寫給誰？</p>"],["以弗所一城說（就是寫給以弗所教會）","","<p>絕大多數的抄本與所有古代譯本的標題都是「致以弗所人」，早期教父也一致這樣稱呼它；信裡的法術、執政掌權者、偶像與族群隔閡，處處對得上以弗所城的背景（〔背景〕徒 19）。和合本照這個讀法譯出。</p><p><strong>難處：</strong>保羅在以弗所住了將近三年，臨別時長老們抱著他哭（徒 20:31、37），這封信卻一個人名也不提，還用「聽見」來說他們的信；三份最早的抄本缺字，也需要一個解釋。</p>"],["傳閱信說（以以弗所為中心，在亞細亞眾教會之間傳閱）","","<p>認為這是一封寫給亞細亞省眾教會的信，以弗所是省會與交通樞紐，信先到那裡，再抄送附近各城。歌羅西書說：「你們念了這書信，便交給老底嘉的教會，叫他們也念；你們也要念從老底嘉來的書信。」（西 4:16）有人認為那封「從老底嘉來的書信」就是這一封；這也能解釋馬吉安的稱呼、沒有問安、口氣疏遠與早期抄本缺字。</p><p><strong>難處：</strong>有人推測原本在 1:1 留了空位讓各教會填上城名，但沒有一份實際的抄本可以證明；而且若是傳閱信，為甚麼流傳下來的標題都只有「致以弗所人」，沒有留下其他城市的名字？</p>"],["一般書信說（原本就不寫地名，是寫給各處的聖徒）","","<p>認為 1:1 原本就沒有地名，讀作「寫信給那些聖徒，就是在基督耶穌裡有忠心的人」，是一封寫給所有外邦人教會的神學書信，像一篇論述，不是一封私信；後來因為以弗所教會保存並傳抄它，地名才被加上。</p><p><strong>難處：</strong>沒有地名時，原文 τοῖς ἁγίοις τοῖς οὖσιν καὶ πιστοῖς 讀起來很彆扭；信末又提到推基古要把保羅的景況告訴「你們」（6:21--22），顯示收信人是一群具體的人，不是抽象的讀者。</p>"],["【三】本講義站在哪裡","","<p><strong>本講義採傳閱信說：</strong>這封信以以弗所為中心，在亞細亞眾教會之間傳閱。經文照和合本保留「在以弗所」，第 1 章的原文解經交代三份最早抄本的缺字；講台上只講一句：這是寫給每一間教會的信。</p><p>這個判斷也帶出書信三問的第三問：這封信的處境不是某一場危機，而是每一間外邦人教會共同的處境——在偶像、法術、族群隔閡的城市裡作神的家。今天的以弗所，就是每一座有廟、有算命攤、有族群分隔的華人城市（全卷立場見 ISS00_1、ISS00_6）。</p>"],["【四】這件事該不該影響你的信心","","<p>不該。爭的是這封信怎樣送到讀者手上，不是信裡說了甚麼；不論收信人在以弗所、老底嘉還是歌羅西，他們聽到的都是同一句：神「在基督裡曾賜給我們天上各樣屬靈的福氣」（1:3）。</p><p>古卷的差異被教會一一記下、公開討論，沒有被藏起來，這正說明我們手上的經文是在光天化日之下被小心傳下來的。一封從監獄寄出、在許多教會之間傳來傳去的信，今天也傳到了你手上。</p>"]],"con":[],"say":"本講義的立場：這封信很可能以以弗所為中心、在亞細亞眾教會之間傳閱；經文照和合本保留「在以弗所」，講台只說一句——這是寫給每一間教會的信。本講義的全卷立場見 ISS00_6；處境與原則見 ISS00_1。","care":"會眾席上可能有正在讀神學、或在網路上看到「聖經被改過」的文章而動搖的年輕人，也可能有被這類問題問倒、不敢再和同事談信仰的人。不要在講台上把這一題講成考據課，也不要說「有疑問就是不信」。會後若有人來問，先肯定他認真讀經，陪他看古卷是怎樣被保存與比對的，再把他帶回這封信共同的那一句：你已經在基督裡蒙了福。"},{"id":"ISS01_2","t":"1:4--5「揀選」「預定」——神預定誰得救嗎？那沒有被揀選的人呢？","r":"1:3--6；1:11；羅 8:29--30","ch":[1],"why":"這是以弗所書第一章最常被問、也最容易傷人的問題。有人因此害怕「萬一我不是選民」，有人因此覺得傳福音沒有意義，也有人在親人過世後被一句「也許他本來就沒有被揀選」刺得很深。教會為這件事爭了兩千年，各派都是敬重聖經的弟兄姊妹；講台需要知道怎樣陳列，更需要知道怎樣保護人。","pos":[["【一】經文問的是甚麼","","<p>「就如神從創立世界以前，在基督裡揀選了我們，使我們在他面前成為聖潔，無有瑕疵」（1:4）；「又因愛我們，就按著自己的意旨所喜悅的，預定我們藉著耶穌基督得兒子的名分」（1:5）。<strong>ἐξελέξατο</strong>（exelexato）是「揀選」，<strong>προορίσας</strong>（proorisas）是「預先劃定」。</p><p>在各家之前，先讓經文自己說四件事：揀選是「在基督裡」；動機是愛；目的是聖潔與讚美（1:6）；揀選不取消人的回應——「你們既聽見真理的道……也信了基督」（1:13）。爭論在於這四件事怎樣拼在一起。</p>"],["加爾文派（無條件的揀選）","","<p>神在創立世界以前，單單照著「自己的意旨所喜悅的」揀選了特定的個人；揀選不是因為神看見人裡面有甚麼好，連信心也是神所賜的。這派的力量在於徹底拿走人的誇口：「這不在乎那定意的，也不在乎那奔跑的，只在乎發憐憫的神」（羅 9:16）。</p><p><strong>難處：</strong>它必須面對「那沒有被揀選的人呢」這個沉重的問題；部分學者主張的雙重預定，在經文與牧養上都很難承擔。講台處理不慎，容易滑成「傳不傳都一樣」的宿命論——而這正是司布真等加爾文派傳道人自己極力反對的。</p>"],["阿米念派與衛斯理宗（根據預知的揀選）","","<p>神從永遠預先知道誰會回應福音，就揀選了這些人：「因為他預先所知道的人，就預先定下效法他兒子的模樣」（羅 8:29）。神「願意萬人得救，明白真道」（提前 2:4），福音的邀請是真誠地向每一個人發出的，人可以回應，也可以拒絕。</p><p><strong>難處：</strong>1:5、11 強調的根據是神「自己的意旨所喜悅的」「照著他旨意所預定的」，不是人的反應；若揀選最後取決於人的選擇，相信的人和不相信的人之間的差別在哪裡，就需要更多說明，否則容易留下自誇的空間（2:9）。</p>"],["群體揀選說（神揀選的是在基督裡的群體）","","<p>1:4 的「我們」是一個群體：基督自己是那一位蒙揀選者，神在他裡面揀選了一個子民，就像舊約揀選以色列；個人藉著信進入這個蒙揀選的群體。這一說緊貼以弗所書自己的重點：揀選的結果是猶太人與外邦人「造成一個新人」（2:15）。</p><p><strong>難處：</strong>它容易把揀選講得太抽象，好像神只揀選了一個類別，卻不認識裡面的每一個人；而且群體是由個人組成的，誰會進入這個群體的問題，最後仍要回到前面兩派的爭論。</p>"],["【三】本講義站在哪裡","","<p><strong>本講義陳列各家，不替讀者決定這個兩千年的爭論；但講台的落點一致。</strong>一、揀選是安慰，不是恐嚇：保羅寫 1:4 不是在辯論，是在頌讚。二、揀選是「在基督裡」的：想知道自己有沒有被揀選，不是猜一張名單，是來到基督面前。三、揀選從來不攔阻傳福音：越相信揀選的人，越有理由去傳，因為福音不會白傳。</p><p>所以講台上絕不對任何人說「你可能沒有被揀選」，也不用預定解釋一場悲劇（紅線四，全卷立場見 ISS00_2）。</p>"],["【四】這件事該不該影響你的信心","","<p>不該。各派都同意：人得救全是神的恩典，福音是真誠的邀請；爭的是揀選怎樣運作，不是神愛不愛罪人。</p><p>如果你曾因為這個題目而害怕，請記得保羅寫這一節的口氣：他不是在發一張名單，他是在跪著讚美。一個為自己有沒有被揀選而擔心的人，往往正是聖靈在他心裡工作的人。答案不在你的感覺，在基督身上：「到我這裡來的，我總不丟棄他」（約 6:37）。</p>"]],"con":[],"say":"本講義的立場：加爾文派、阿米念派、群體揀選說並陳，不替讀者決定；但揀選是在基督裡的、動機是愛、目的是聖潔與讚美，是安慰不是恐嚇，從不攔阻傳福音。本講義的全卷立場見 ISS00_2。","care":"會眾席上可能有因為這個題目失眠、反覆問「我是不是選民」的人，也可能有親人沒有信主就過世、正在悲傷中的家屬。絕不對任何人說「他可能沒有被揀選」，也不用預定解釋悲劇。對前者，陪他一再回到基督的邀請；對後者，不追問、不下判斷，陪他哭，把那個人交在公義又慈愛的神手中。若焦慮已經影響睡眠與生活，協助他尋求專業的幫助。"},{"id":"ISS01_3","t":"1:11「預定」與人的自由——神既然「做萬事」，基督徒還需要作選擇嗎？","r":"1:11--12；1:13；5:17","ch":[1],"why":"許多信徒在面對婚姻、工作、搬家、讀書的抉擇時，被一個問題卡住：如果神早已照他的旨意定好一切，我的選擇還算數嗎？有人因此不敢作決定，怕走錯了「神的旨意」；有人因此把責任推給神，「反正都是神安排的」。這一題不只是哲學，是每一個信徒每天要面對的生活。","pos":[["【一】經文問的是甚麼","","<p>「我們也在他裡面得了基業；這原是那位隨己意行、做萬事的，照著他旨意所預定的」（1:11）。<strong>τοῦ τὰ πάντα ἐνεργοῦντος</strong>（tou ta panta energountos）是「那一位運行萬有的」，<strong>κατὰ τὴν βουλὴν τοῦ θελήματος αὐτοῦ</strong>（kata tēn boulēn tou thelēmatos autou）是「照他旨意的計畫」。</p><p>可是同一卷信的後三章有幾十個命令句，從 4:1 起一直叫人「行」。問題是：神的主權涵蓋到甚麼程度？人的選擇是真的嗎？兩者怎樣同時成立？</p>"],["細密主權說（神的旨意涵蓋一切細節）","","<p>改革宗傳統：「做萬事」就是萬事，神的護理細到一隻麻雀；人的選擇是真實的，也是負責任的，但都在神的旨意之內被成就，兩者在神裡面並不衝突（學者稱為相容論）。這派給受苦的人很大的安慰：沒有一件事在神的手以外。</p><p><strong>難處：</strong>它要面對罪與惡的問題——若萬事都在神的計畫裡，惡從哪裡來？講得不小心，容易讓人覺得自己只是被操縱的棋子，或把一切不公義都說成「神的安排」，叫受害者不要追究。</p>"],["自由意志說（神賦予人真實的選擇空間）","","<p>阿米念與衛斯理傳統：神的主權包括他自由地決定給人真實的選擇；1:11 說的是神的救恩計畫一定會成就，不是說人生的每一個細節都已經被決定。神「願意萬人得救」（提前 2:4），人卻可以拒絕，所以人要為自己的回應負責。</p><p><strong>難處：</strong>「做萬事」的範圍在這一說裡被收窄了；而它的極端形式（開放神論）甚至說神不能確知未來，就和 1:4「從創立世界以前」的口氣有很大的距離。</p>"],["藍圖說與智慧說（落在日常抉擇的兩種讀法）","","<p><strong>藍圖說</strong>認為神為每一個人的每一個決定都定了唯一正確的答案，信徒的責任是把它「找出來」，找錯了就會錯過神最好的。<strong>智慧說</strong>認為神已經在聖經裡啟示了他的道德旨意，在這個範圍裡，信徒可以憑著禱告、勸勉與智慧自由地選擇；5:17「要明白主的旨意如何」是在品格與生活中明白，不是猜一道謎題。</p><p><strong>難處：</strong>藍圖說常使人癱瘓、焦慮，或依賴別人的「感動」替自己決定；智慧說若講得太輕，又容易忽略神也會具體地引導，讓人只憑自己的喜好。</p>"],["【三】本講義站在哪裡","","<p><strong>本講義兩面都要講：</strong>神的主權是真的——他「做萬事」，他的計畫一定會成就；人的選擇也是真的——同一段說「你們既聽見……也信了」（1:13），同一卷信叫人行、叫人站。這兩面怎樣在神裡面合在一起，各派解釋不同，本講義不替讀者決定（全卷立場見 ISS00_2）。</p><p>落在生活裡，本講義傾向智慧說：在聖經清楚的範圍內，帶著禱告、尋求成熟信徒的勸勉，然後放心地選；神的主權不是讓人不敢走，是讓人走錯了也不會走出他的手。</p>"],["【四】這件事該不該影響你的信心","","<p>不該。這是一個連最偉大的神學家都承認有奧祕的題目；但各派都同意：神是掌權的，人是要負責的，神的旨意是美善的。</p><p>如果你正卡在一個決定上，害怕走錯，請記得 1:11 的重點不是一張你必須猜中的藍圖，而是「我們也在他裡面得了基業」：你的未來掛在他身上，不是掛在你每一次都選對。</p>"]],"con":[],"say":"本講義的立場：神的主權與人的選擇兩面都是真的，各派怎樣把兩者合在一起並陳；生活的抉擇不是猜中一張藍圖，是在聖經的範圍裡帶著禱告與勸勉放心地選。本講義的全卷立場見 ISS00_2。","care":"會眾席上可能有因為「選錯了神的旨意」而自責多年的人——婚姻破裂、事業失敗、孩子離家——也可能有被別人用「神的安排」叫他忍受不公義的人。不要對受害者說「這也是神的旨意，你要順服」，也不要對正在後悔的人說「你當初沒有聽神的話」。陪他回到 1:11 的那一句：在他裡面的人，沒有一條路走出他的手；涉及傷害的，先保護人的安全。"},{"id":"ISS01_4","t":"1:13--14「受了所應許的聖靈為印記」——得救的人會失去聖靈嗎？","r":"1:13--14；4:30；來 6:4--6","ch":[1],"why":"印記與訂金的比喻帶來極大的安慰，可是許多信徒在跌倒之後、在讀到希伯來書第六章之後，心裡會問：我會不會已經失去了聖靈？也有人反過來說「反正已經蓋印了，怎麼活都可以」。這一題關乎得救的確據，也關乎屬靈生命的認真，兩頭都會傷人。","pos":[["【一】經文問的是甚麼","","<p>「你們既聽見真理的道……既然信他，就受了所應許的聖靈為印記。這聖靈是我們得基業的憑據，直等到神之民被贖」（1:13--14）。<strong>ἐσφραγίσθητε</strong>（esphragisthēte）是被動：印是神蓋的；<strong>ἀρραβὼν</strong>（arrabōn）是訂金。</p><p>但同一卷信也說「不要叫神的聖靈擔憂」（4:30），希伯來書更說到「若是離棄道理，就不能叫他們重新懊悔了」（來 6:6）。問題是：神蓋的印，會被撕掉嗎？</p>"],["蒙保守說（真信的人永遠不會失去聖靈）","","<p>改革宗與許多浸信會傳統：印是神蓋的，訂金是神付的，神不會收回；主耶穌說「誰也不能從我手裡把他們奪去」（約 10:28），保羅也說「那在你們心裡動了善工的，必成全這工」（腓 1:6）。真正重生的人會被保守、也會恆忍到底。</p><p><strong>難處：</strong>它要解釋那些曾經熱心、後來離開的人；常見的回答是「他們出去，顯明都不是屬我們的」（約壹 2:19），可是這個說法若用在牧養上不小心，會讓每一個軟弱的人懷疑自己「是不是本來就不是真的」。</p>"],["可能失落說（人若持續離棄，可能失去救恩）","","<p>阿米念與衛斯理傳統：神的保守是真的，但不是不顧人的回應；人若持續、刻意地離棄信仰，可能失去所得的。希伯來書第六章與許多警告經文，是對真信徒說的真警告；4:30 也顯示聖靈是一位會擔憂的朋友，關係是要被珍惜的。</p><p><strong>難處：</strong>1:13--14 的重點正是神的擔保：印是神蓋的，憑據「直等到」被贖的日子；若得救最後取決於人能不能守住，確據就很難建立，軟弱的人容易活在不安裡。</p>"],["區分說（印記不撤，同在的經歷與充滿會受損）","","<p>許多牧者在兩派之間作一個實際的區分：聖靈作為印記與訂金，是神的擔保，不會撤回；但人可以叫聖靈擔憂（4:30）、消滅聖靈的感動，失去喜樂、能力與被充滿的經歷。大衛犯罪後求「不要從我收回你的聖靈」（詩 51:11），是舊約的處境，也表達了一個失去同在之感的人的哀求。</p><p><strong>難處：</strong>這個區分在牧養上很有用，卻沒有回答最根本的神學問題：一個持續離棄的人，最後會怎樣？那仍然回到前面兩派。</p>"],["【三】本講義站在哪裡","","<p><strong>本講義的落點：</strong>1:13--14 要人把確據建立在蓋印的那一位身上——印是神蓋的，訂金是神付的，盼望建立在付錢的那一位身上。兩派最後怎樣解釋離開的人，本講義並陳，不替讀者決定（揀選與保守的全卷立場見 ISS00_2）。</p><p>同時，印記不是放肆的執照：同一個印記被用來勸人「不要叫神的聖靈擔憂」（4:30）。所以講台兩頭都要守：對軟弱的人說「印還在」，對放縱的人說「這是一份要被珍惜的關係」。</p>"],["【四】這件事該不該影響你的信心","","<p>不該。各派都同意：凡真信靠基督的人，神會保守他；警告的經文是為了叫人回轉，不是為了叫回轉的人絕望。</p><p>如果你正害怕自己已經失去聖靈，這份害怕本身往往就是聖靈還在作工的記號——離開的人不會為這件事流淚。回到主面前認罪，「到我這裡來的，我總不丟棄他」（約 6:37）。</p>"]],"con":[],"say":"本講義的立場：印是神蓋的、訂金是神付的，得救的確據建立在神身上；蒙保守說與可能失落說並陳，但兩頭都要守——對軟弱的人說印還在，對放縱的人說不要叫聖靈擔憂。揀選與保守的全卷立場見 ISS00_2。","care":"會眾席上可能有害怕自己犯了「不得赦免的罪」、反覆求問的人，也可能有正在憂鬱中、感覺不到神同在的人。不要對他說「你感覺不到，可能就是失去了」，也不要用希伯來書第六章去嚇一個已經在流淚的人。會後單獨關心，陪他認罪、禱告，把確據帶回神的應許；若長期的低落已經影響生活，協助他尋求專業的協助。"},{"id":"ISS01_5","t":"1:17「賜人智慧和啟示的靈」——今天還有新的啟示嗎？","r":"1:17--19；2:20；3:5","ch":[1],"why":"許多華人教會裡流行「領受啟示」「神給我一句話」的說法，有人用它造就人，也有人用它替別人決定婚姻、工作、搬遷，甚至宣稱有高過聖經的新啟示。保羅在 1:17 正是求神「將那賜人智慧和啟示的靈賞給你們」，這一節常被引用，需要說清楚它求的是甚麼。","pos":[["【一】經文問的是甚麼","","<p>「求我們主耶穌基督的神，榮耀的父，將那賜人智慧和啟示的靈賞給你們，使你們真知道他」（1:17）。<strong>πνεῦμα σοφίας καὶ ἀποκαλύψεως</strong>（pneuma sophias kai apokalypseōs）沒有冠詞，可指聖靈，也可指人裡面被賜予智慧與啟示的靈；目的是 <strong>ἐν ἐπιγνώσει αὐτοῦ</strong>（en epignōsei autou），真認識「他」。</p><p>問題是：這裡的「啟示」是新的真理內容，還是聖靈把已經啟示的真理照進心裡？今天的信徒還會領受「啟示」嗎？它有甚麼權威？</p>"],["止息論（啟示已經完成，今天只有光照）","","<p>認為神「就在這末世藉著他兒子曉諭我們」（來 1:2），使徒與先知是教會的根基（2:20），根基只立一次；聖經正典完成以後，不再有具權威的新啟示。1:17 求的是光照：讓人看懂已經寫下的真理。</p><p><strong>難處：</strong>這一說保護了聖經的獨特權威，卻可能把聖靈今天具體的引導、勸勉與安慰講得太少；林前 12--14 章與帖前 5:20「不要藐視先知的講論」也需要一個說明。</p>"],["溫和延續論（先知性的造就仍在，但從屬於聖經）","","<p>認為先知恩賜今天仍可存在，但它的權威遠低於聖經：是為了「造就、安慰、勸勉」，而且必須被檢驗——「其餘的就當慎思明辨」（林前 14:29），「但要凡事察驗」（帖前 5:21）。1:17 的啟示主要是光照，但神也可能具體地提醒人。</p><p><strong>難處：</strong>界線不容易守：一句「我有感動」很快就可能變成「神說」，在華人重視權威的處境裡，會眾往往不敢檢驗講台上的「啟示」。</p>"],["新啟示說（今天的使徒、先知可以頒布具權威的新啟示）","","<p>部分新使徒改革運動與一些獨立團體認為，神今天仍藉使徒、先知頒布新的策略、新的教導，甚至關於個人婚姻與事業的指示，信徒應當順服；他們常用 1:17 與 3:5 支持這一說。</p><p><strong>難處：</strong>這一說把個人的話抬到與聖經同等、甚至更高的地位，正是猶大書所說「從前一次交付聖徒的真道」（猶 3）要防備的；它也常成為屬靈控制的工具：不順服「先知的話」就被說成悖逆。</p>"],["【三】本講義站在哪裡","","<p><strong>本講義的判斷：1:17 求的是光照，不是新的經文。</strong>聖靈把已經啟示的真理照進心裡，使人「真知道他」，對象是神自己；這和 1:18「照明你們心中的眼睛」是同一個禱告。</p><p>先知性的造就與勸勉今天仍需要，但要被聖經檢驗，不以頭銜要求順服，不發布高過聖經的新啟示，也不用「神給我啟示」替人決定婚姻、工作、搬遷（全卷立場見 ISS00_5；恩賜回指哥林多前書立場三）。</p>"],["【四】這件事該不該影響你的信心","","<p>不該。各派都同意：聖經是最高的準則，聖靈會光照人明白聖經，並引導人認識神。</p><p>你不必羨慕別人「領受啟示」的經歷，也不必害怕自己沒有。保羅為以弗所人求的，是心裡的眼睛被打開，看見神的恩召、基業與能力；打開聖經、帶著禱告讀，就是向這一個禱告敞開。</p>"]],"con":[],"say":"本講義的立場：1:17 的「啟示」是聖靈把已經啟示的真理照進心裡，使人真知道神，不是新的經文；先知性的造就要被聖經檢驗，不以頭銜要求順服，不替人決定人生。本講義的全卷立場見 ISS00_5；恩賜與方言回指哥林多前書立場三。","care":"會眾席上可能有曾經因為「先知的話」而嫁錯人、辭錯工作、奉獻掉積蓄的人，也可能有因為質疑「啟示」而被說成悖逆、被趕出小組的人。不要在台上嘲笑任何恩賜的經歷，也不要叫受傷的人「再順服一點」。會後單獨關心，先聽他的經歷，陪他回到聖經的檢驗；若涉及財務或屬靈控制，協助他找到安全的管道與專業的協助。"},{"id":"ISS01_6","t":"1:21「執政的、掌權的、有能的、主治的」——是靈界的勢力，還是地上的政權與結構？","r":"1:20--22；3:10；6:12","ch":[1],"why":"這四個詞在以弗所書一再出現（1:21；3:10；6:12），是全卷屬靈爭戰的伏筆。有人把它們全講成鬼魔，凡事見鬼；有人把它們全講成社會結構與政權，靈界只是比喻。華人信徒又活在廟宇、鬼月、算命與風水之間，這一題直接關係到他們怎樣過每一天。","pos":[["【一】經文問的是甚麼","","<p>基督坐在神的右邊，「遠超過一切執政的、掌權的、有能的、主治的，和一切有名的；不但是今世的，連來世的也都超過了」（1:21）。<strong>ἀρχῆς καὶ ἐξουσίας καὶ δυνάμεως καὶ κυριότητος</strong>（archēs kai exousias kai dynameōs kai kyriotētos）在當時既可指地上的官長，也是猶太文獻裡天使與靈界勢力的名稱。問題是：保羅在這裡指的是誰？</p>"],["靈界勢力說（天使與鬼魔的等級）","","<p>多數註釋者認為這裡主要指靈界勢力：它們在「天上」（3:10；6:12），6:12 明說「我們並不是與屬血氣的爭戰」；以弗所是法術之城（徒 19:19），信徒最怕的正是這些看不見的力量。保羅的意思是：你們怕的一切，都在基督腳下。</p><p><strong>難處：</strong>若只講靈界，容易讓人忽略罪惡也透過人間的制度、文化與權力運作；講得過頭，更會變成凡事見鬼，把一切問題都歸給邪靈，而不面對自己的罪與社會的不公。</p>"],["人間結構說（政權、制度與文化的力量）","","<p>部分近代學者（如溫克 Walter Wink）認為這些詞主要指地上的政權、制度、意識形態與文化力量，「世上有權有位的人」把榮耀的主釘在十字架上（林前 2:8）；屬靈爭戰就是揭露並抵擋壓迫人的結構。</p><p><strong>難處：</strong>這一說看見了結構性的罪，卻很難解釋 6:12 明確地說「不是與屬血氣的爭戰」，也很難解釋「天上」「空中掌權者的首領」（2:2）；把靈界講成只是比喻，就和保羅與第一世紀讀者的世界觀不合。</p>"],["兩者兼有說（靈界勢力透過人間結構運作）","","<p>認為這些勢力主要是靈界的，但也透過人間的政權、制度、文化與偶像運作：但以理書提到「波斯國的魔君」（但 10:13），以弗所的亞底米崇拜同時是宗教、經濟與城市認同（徒 19:24--27）。爭戰的範圍包括靈界，也包括人心與社會。</p><p><strong>難處：</strong>這一說最完整，但界線需要智慧：不能把每一個政權、每一個政敵都說成魔鬼，也不能拿「屬靈爭戰」去替特定的政治立場背書。</p>"],["【三】本講義站在哪裡","","<p><strong>本講義採兩者兼有說：</strong>執政掌權者主要是靈界勢力，也透過人間的結構與文化運作。但第 1 章的重點不是分析敵人，是宣告勝負已定：基督已經坐在一切之上，信徒從得勝的位置站立。</p><p>所以本講義不採地域邪靈、屬靈地圖、點名捆綁的作法；不必怕鬼月、風水、廟宇，但不拜、不求、不戴護身符、不擇日；不輕易說人被鬼附，身心困擾先轉介醫療並同時禱告（全卷立場見 ISS00_4）。</p>"],["【四】這件事該不該影響你的信心","","<p>不該。不論這些勢力怎樣分類，以弗所書的答案只有一個：它們都在基督的腳下，「不但是今世的，連來世的也都超過了」。</p><p>以弗所的信徒把法術書燒了，不是因為害怕，是因為看見了。你也不必再怕那些名字，也不必再求它們。</p>"]],"con":[],"say":"本講義的立場：執政掌權者主要是靈界勢力，也透過人間的結構與文化運作；第 1 章的重點是勝負已定，基督坐在一切之上。不迷信、不輕忽，不採地域邪靈與點名捆綁。本講義的全卷立場見 ISS00_4。","care":"會眾席上可能有從民間信仰家庭出來、夜裡仍然害怕的初信者，也可能有正在憂鬱、焦慮或其他身心困擾中、曾被人說成「被鬼附」的人和家屬。不要在台上渲染鬼怪故事，也不要輕易替人下「邪靈」的判斷。會後單獨關心：陪初信者禱告，宣告基督的得勝；身心困擾的，一定協助他尋求醫療與專業協助，並同時為他禱告。"},{"id":"ISS01_7","t":"1:22--23「教會是他的身體」——是指普世教會，還是地方教會？","r":"1:22--23；4:4；4:16","ch":[1],"why":"華人教會對「教會」有很多不同的理解：有人說一城只能有一個教會，其他都是宗派分裂；有人說只要在普世教會裡就好，不必委身任何一間地方教會；也有人愛耶穌卻不愛教會。1:22--23 是以弗所書第一次提到「教會」，怎樣讀它，會直接影響信徒怎樣看待自己所在的那一間教會。","pos":[["【一】經文問的是甚麼","","<p>「又將萬有服在他的腳下，使他為教會作萬有之首。教會是他的身體，是那充滿萬有者所充滿的。」（1:22--23）<strong>τῇ ἐκκλησίᾳ</strong>（tē ekklēsia）在以弗所書出現九次（1:22；3:10、21；5:23、24、25、27、29、32），沒有一次加上城名。</p><p>問題是：這裡的教會是指天上地上所有屬基督的人（普世教會），還是指一間一間聚集的地方教會？兩者是甚麼關係？</p>"],["普世教會說（以弗所書的教會都是指全體）","","<p>以弗所書的「教會」一致指基督全體的子民：基督「為教會捨己」（5:25），「身體只有一個」（4:4）；這和保羅較早書信多指地方教會（「寫信給在哥林多神的教會」，林前 1:2）不同，正符合傳閱信的性質。</p><p><strong>難處：</strong>若只講普世教會，容易讓人覺得不必委身任何一間具體的教會——「我屬於基督的身體就好」，卻忽略了保羅寫給的，是一群會聚集、會吵架、需要「竭力保守」合一的真實的人（4:2--3）。</p>"],["地方教會說（身體在每一間聚集中具體顯出）","","<p>強調基督的身體總是在一群具體的人中顯明：保羅在別處對一間地方教會說「你們就是基督的身子，並且各自作肢體」（林前 12:27）；4:16「百節各按各職」只能在彼此認識、彼此服事的群體裡發生。</p><p><strong>難處：</strong>以弗所書本身的「教會」用法並不支持只指地方教會；而且若把身體只限於自己那一間，很容易對別的教會漠不關心，甚至彼此競爭。</p>"],["一城一會說（一個地方只能有一個合法的教會）","","<p>二十世紀華人教會中有一個影響深遠的主張：每一座城只應有一個教會，以城為界；宗派、以人或道理命名的教會都是分裂，信徒應當站在「地方立場」上。這一說的出發點是對合一的渴慕，也是對宗派林立的真實痛心。</p><p><strong>難處：</strong>新約固然以城稱呼教會，卻沒有明文規定一城只能有一個聚集（羅 16 章羅馬城中有幾處「家中的教會」）；實際上，這一說也常常造成另一種分裂：把別的教會判為不合法，自己成了唯一的教會。</p>"],["【三】本講義站在哪裡","","<p><strong>本講義的判斷：1:22--23 的教會首先是普世教會——所有在基督裡的人，只有一個身體、一個頭。</strong>而這一個身體，在每一間地方教會裡具體地顯出來；所以委身一間地方教會，是活在普世教會裡的方式，不是二選一。</p><p>同一座城的教會不是競爭對手，是同一個身體的不同肢體；這封信本身就是在幾間教會之間傳閱的。合一的中心是七個「一」與元首基督（全卷立場見 ISS00_9）。</p>"],["【四】這件事該不該影響你的信心","","<p>不該。各派都同意：基督是教會唯一的頭，所有真信他的人都屬於他的身體。爭的是怎樣組織與稱呼，不是誰屬於基督。</p><p>如果你曾在一間教會受傷，甚至不想再進教會，請記得 1:22 說基督是「為教會」作萬有之首的——他沒有放棄這個常常讓人失望的身體，也沒有放棄你。</p>"]],"con":[],"say":"本講義的立場：1:22--23 的教會首先是普世教會，只有一個身體、一個頭；這個身體在每一間地方教會裡具體地顯出來，委身地方教會不是和普世教會二選一。合一與爭議的全卷立場見 ISS00_9。","care":"會眾席上可能有曾在教會受過傷、只在網上聽道不敢再委身的人，也可能有從強調「唯一合法教會」的團體出來、心裡仍然不安的人。不要在台上批評任何宗派或團體，也不要責怪暫時離開教會的人。會後單獨關心，先聽他的經歷，陪他慢慢找到一群可以彼此認識、彼此服事的人；涉及屬靈控制的傷害，協助他尋求專業的協助。"},{"id":"ISS01_8","t":"1:7「藉這愛子的血得蒙救贖」——代贖是甚麼意思？","r":"1:7；可 10:45；羅 3:25","ch":[1],"why":"「藉著血得救贖」是福音的中心，卻也是今天最常被質疑的地方：為甚麼需要流血？父懲罰兒子公平嗎？贖價是付給誰的？教會歷史上有好幾種講法，各自抓住了經文的一面；講台需要講清楚，又不能把十字架講成冷冰冰的交易，或講成讓受過父親暴力的人更害怕的畫面。","pos":[["【一】經文問的是甚麼","","<p>「我們藉這愛子的血得蒙救贖，過犯得以赦免，乃是照他豐富的恩典。」（1:7）<strong>τὴν ἀπολύτρωσιν</strong>（tēn apolytrōsin）是付贖價使人得釋放，<strong>τὴν ἄφεσιν τῶν παραπτωμάτων</strong>（tēn aphesin tōn paraptōmatōn）是過犯的赦免。</p><p>主耶穌自己說他來「要捨命作多人的贖價」（可 10:45）。問題是：基督的死怎樣使我們得赦免？贖價付給了誰？</p>"],["刑罰代替說（基督代替罪人承受罪的刑罰）","","<p>宗教改革以來福音派的主流：神是公義的，罪必須被審判；基督代替我們承受了罪的刑罰，「神設立耶穌作挽回祭，是憑著耶穌的血」（羅 3:25），這使我們想起「因他受的刑罰，我們得平安」（賽 53:5）。所以赦免不是神睜一隻眼閉一隻眼，而是公義與慈愛在十字架上相遇。</p><p><strong>難處：</strong>講得不小心，會被聽成一位憤怒的父親懲罰一個無辜的兒子；必須同時講清楚：父、子、聖靈同心，子是甘心捨己，動機是愛（1:5--7）。</p>"],["基督得勝說（基督勝過罪、死亡與黑暗權勢）","","<p>早期教父的重要主題，近代又被重新強調：十字架與復活是基督勝過一切執政掌權者的勝利，「既將一切執政的、掌權的擄來，明顯給眾人看，就仗著十字架誇勝」（西 2:15）。這和 1:20--22 基督坐在一切之上的畫面一致。</p><p><strong>難處：</strong>它講清楚了「從甚麼被救出來」，卻較少說明「罪的虧欠怎樣被處理」；古代有人更進一步說贖價是付給撒但的，這就把撒但抬高成與神交易的一方，經文並沒有這樣說。</p>"],["道德感化說（十字架是愛的最高榜樣）","","<p>中世紀的亞伯拉德與近代自由派神學強調：十字架顯出神的愛，感動人悔改歸向神；基督的死主要是榜樣，不是為了滿足公義。十字架確實是愛的最高表達（5:2）。</p><p><strong>難處：</strong>若十字架只是榜樣，1:7「藉這愛子的血……過犯得以赦免」就失去了它的力量——一個榜樣可以感動人，卻不能赦免人；而且若沒有真實的罪需要處理，那份愛也就失去了重量。</p>"],["【三】本講義站在哪裡","","<p><strong>本講義以刑罰代替為中心，同時講出得勝與愛的兩面。</strong>基督替我們承受了罪的刑罰，所以過犯真的被赦免；他也因此勝過了罪、死亡與一切執政掌權者；這一切的源頭是父的愛，子是甘心捨己。</p><p>1:7 的尺度是「照他豐富的恩典」，不是照我們過犯的大小；得救全在於恩典，不在於行為（因信稱義回指加拉太書立場二）。</p>"],["【四】這件事該不該影響你的信心","","<p>不該。各種講法像從不同的窗口看同一座山：十字架同時是赦免、得勝與愛。福音派各家都同意基督的死是為我們、使我們得赦免。</p><p>你不必先弄懂每一種理論，才能接受赦免。你只要知道：那一位愛子流的血，夠付清你的帳，而且是照他豐富的恩典付的。</p>"]],"con":[],"say":"本講義的立場：以刑罰代替為中心——基督替我們承受罪的刑罰，過犯真的被赦免；同時講出他勝過一切權勢、以及父與子同心的愛。因信稱義回指加拉太書立場二。","care":"會眾席上可能有在暴力或嚴厲的父親底下長大的人，聽到「父懲罰兒子」會勾起很深的傷痛；也可能有被罪咎壓了很多年、覺得自己不配被赦免的人。不要把十字架講成一位憤怒的父親發洩怒氣，要講出父與子同心、子甘心捨己的愛。會後單獨關心，不追問細節；若過去的傷害仍在影響他，協助他尋求專業的協助。"},{"id":"ISS01_9","t":"1:10「同歸於一」——最後所有的人都會得救嗎？","r":"1:10；西 1:20；腓 2:10--11","ch":[1],"why":"「使天上、地上、一切所有的都在基督裡面同歸於一」是一幅極其寬廣的圖畫，歷史上有人據此主張最後萬人都會得救；今天許多為未信主親人憂傷的信徒，也會從這一節生出盼望或困惑。這一題關係到福音的邀請是否需要回應，也關係到我們怎樣面對已經過世的家人。","pos":[["【一】經文問的是甚麼","","<p>「要照所安排的，在日期滿足的時候，使天上、地上、一切所有的都在基督裡面同歸於一。」（1:10）<strong>ἀνακεφαλαιώσασθαι τὰ πάντα</strong>（anakephalaiōsasthai ta panta）是把萬有重新歸總在一個頭之下。</p><p>歌羅西書也說神「便藉著他叫萬有－無論是地上的、天上的－都與自己和好了」（西 1:20）。問題是：「萬有」包括每一個人嗎？歸在基督底下，是每一個人都得救，還是萬有都服在他的主權之下？</p>"],["普救論（最後萬人都會得救）","","<p>從三世紀的俄利根到近代部分神學家，有人主張神的愛最後會勝過一切抗拒，萬有都要回歸神，連最遠離神的也會被挽回；1:10、西 1:20、林前 15:28「叫神在萬物之上，為萬物之主」常被引用。</p><p><strong>難處：</strong>同一章說人要「聽見」「信了」（1:13），新約也有許多清楚的審判經文，主耶穌說「這些人要往永刑裡去」（太 25:46）；俄利根的這一部分主張在主後 553 年被大公會議定罪。若萬人都得救，福音的邀請就變成一張不必回應的通知。</p>"],["主權歸一說（萬有都服在基督的主權之下，包括審判）","","<p>多數福音派的讀法：「同歸於一」是萬有都被帶回基督的主權之下——信的人在恩典中歸向他，抗拒的人在審判中也要承認他：「叫一切在天上的、地上的，和地底下的，因耶穌的名無不屈膝」（腓 2:10）。歸一是秩序的恢復，不等於每一個人得救。</p><p><strong>難處：</strong>這一說若講得太快，容易讓 1:10 只剩下審判的冷峻，失去經文頌讚的溫度；也要說明為甚麼保羅在這裡用的是「和好」「歸一」這麼溫暖的字。</p>"],["宇宙更新說（重點在受造界的復和）","","<p>許多近代註釋強調 1:10 的「天上、地上」是整個受造界：神的計畫不只是救靈魂，是更新萬有，「受造之物仍然指望脫離敗壞的轄制，得享神兒女自由的榮耀」（羅 8:21），坐寶座的說「我將一切都更新了」（啟 21:5）。這一說不談每一個人的結局，而把焦點放在神要恢復整個世界。</p><p><strong>難處：</strong>它把視野打開了，卻沒有直接回答「每一個人都會得救嗎」；講得不平衡，也可能讓人只關心環境與社會，而忽略個人悔改信靠的需要。</p>"],["【三】本講義站在哪裡","","<p><strong>本講義採主權歸一說，並吸收宇宙更新說的視野：</strong>神要更新整個受造界，萬有都要歸在基督這一位元首底下；但歸一的中心是在基督裡面，同一章也說人要「聽見真理的道」並且「信了基督」（1:13），本講義不採普救論。</p><p>同時，我們不替任何一個具體的人宣判結局——審判屬於神。我們能做的，是趁著今天，把人帶到那一位元首面前。</p>"],["【四】這件事該不該影響你的信心","","<p>不該。各派都同意：神的計畫一定會成就，基督是萬有的中心，福音是真誠的邀請。</p><p>如果你正為一位沒有信主就過世的家人憂傷，請記得那位審判的主，就是為罪人流血的主；你可以把那個人交在他公義又慈愛的手中。而為還活著的家人，1:10 是最大的動力：神的計畫這麼大，值得我們今天就開口。</p>"]],"con":[],"say":"本講義的立場：同歸於一是萬有都歸在基督這一位元首底下，神要更新整個受造界；但歸一的中心是在基督裡面，人要聽見、相信，本講義不採普救論，也不替任何具體的人宣判結局。","care":"會眾席上一定有親人沒有信主就過世的人，這一題對他們不是理論，是每一次掃墓、每一個忌日的痛。絕不在台上或私下對家屬說「他現在在地獄裡」，也不要為了安慰而說「其實每個人最後都會得救」。陪他哭，把那個人交在神公義又慈愛的手中，也陪他為還活著的家人禱告。"},{"id":"ISS02_1","t":"2:1--3「死在過犯罪惡之中」「本為可怒之子」——人生來就全然敗壞嗎？甚麼是原罪？","r":"2:1--3；羅 5:12；詩 51:5","ch":[2],"why":"「死在過犯罪惡之中」與「本為可怒之子」是基督教原罪教義最常被引用的經文之一。人是生來就有罪性，還是因為自己犯罪才成為可怒之子？「全然敗壞」是說人壞到極點，還是說罪滲透到人的每一部分？這一題關係到人怎樣看自己、怎樣看不信的家人，也關係到福音為甚麼必須是恩典。","pos":[["【一】經文問的是甚麼","","<p>保羅說：「你們死在過犯罪惡之中」（2:1），又說「我們從前也都在他們中間，放縱肉體的私慾，隨著肉體和心中所喜好的去行，本為可怒之子，和別人一樣」（2:3）。<strong>τέκνα φύσει ὀργῆς</strong>（tekna physei orgēs）的 φύσει（physei）是「按本性」。問題是：「本為」指生來的本性，還是指人實際活出來的光景？「死」是說人完全不能回應神，還是說人與神的生命關係斷了？</p>"],["奧古斯丁與改革宗：原罪與全然敗壞","","<p>奧古斯丁、路德、加爾文：φύσει（physei）指生來的本性，人從亞當承受了罪性與罪責，「罪是從一人入了世界」（羅 5:12），詩人也說「我是在罪孽裡生的」（詩 51:5）。「全然敗壞」不是說人壞到極點，是說罪滲透到人的每一部分——意志、情感、理性都受了轄制，人不能靠自己回應神，所以需要神先叫他活過來。</p><p><strong>難處：</strong>講得不小心，容易被聽成「人毫無價值」，忽略人仍有神的形像；「生來就有罪責」對嬰孩夭折等牧養問題也帶來沉重的追問，各派在這裡的回答並不一致。</p>"],["東方教會與阿米念傳統：承受敗壞，不承受罪責","","<p>東方正教與許多阿米念派學者：人從亞當承受的是死亡與敗壞的傾向，但罪責是因自己實際犯罪才有；φύσει（physei）可以讀成「照人本來活出的樣子」。人雖然死在罪中，神的先行恩典已經臨到眾人，使人能夠回應福音。</p><p><strong>難處：</strong>2:1–3 用「死」這麼強烈的字，又說「和別人一樣」，似乎不只是傾向的問題；若人在罪中仍保有一部分回應的能力，2:4–5「然而，神……便叫我們與基督一同活過來」的轉折就顯得不那麼徹底。</p>"],["處境描寫說：保羅在描寫光景，不是在建構教義","","<p>一些新約學者認為，2:1–3 首先是一份處境描寫：外邦人在偶像與風俗裡、猶太人在肉體的私慾裡，兩邊一樣需要救恩；保羅的重點在句末「和別人一樣」——為 2:14 的拆牆鋪路，不是在回答原罪如何遺傳的問題。</p><p><strong>難處：</strong>這一說提醒我們讀上下文，卻可能低估了這段經文的神學分量；保羅在羅 5 確實討論了亞當與眾人的關係，2:3 的 φύσει（physei）也不容易只當作修辭。</p>"],["【三】本講義站在哪裡","","<p><strong>本講義站在歷代教會的共識上：人在罪中無法自救，需要神先行動</strong>——這是 2:1–5 的明文。在原罪如何傳遞、罪責如何歸算的細節上，奧古斯丁傳統是福音派的主流讀法，本講義採用，但並陳東方與阿米念的理解。</p><p>同時要守住兩件事：全然敗壞是說罪滲透到每一部分，不是說人毫無價值；保羅說的是「我們」與「和別人一樣」——這是一份平等的診斷書，不是一根指著別人的手指。</p>"],["【四】這件事該不該影響你的信心","","<p>不該。各派都同意：人需要恩典，救恩的主動在神，基督是唯一的救主。爭論的是罪怎樣傳遞、人在恩典之前還剩下多少能力。</p><p>對你今天最重要的，不是先弄清楚哪一派對，而是聽見 2:4 那兩個字：「然而，神」。死人被描寫了三節，是為了讓你知道，叫你活過來的不是你的努力，是他的大愛。</p>"]],"con":[],"say":"本講義的立場：人在罪中無法自救，救恩的主動在神；原罪的細節採奧古斯丁傳統而並陳各家。全然敗壞是說罪滲透到人的每一部分，不是說人毫無價值；2:3 說的是「我們」，是一份人人平等的診斷書。爭議與信心的全卷立場見 ISS00_9。","care":"會眾席上可能有從小被罵「你天生就是壞」的人，聽到「可怒之子」會勾起舊傷；也可能有家中嬰孩夭折、正在追問孩子去哪裡的父母。不要在講台上用這一題嚇人，也不要對喪子的父母展開原罪的辯論。對前者，陪他讀到 2:4–7，讓他知道神看他的眼光是「豐富的憐憫」；對後者，先陪伴、不追問，把孩子交託在那位滿有憐憫的神手中，必要時協助尋求哀傷輔導。"},{"id":"ISS02_2","t":"2:2「空中掌權者的首領」——撒但現在掌權嗎？","r":"2:2；約 12:31；林後 4:4；約壹 5:19","ch":[2],"why":"2:2 說有一位「空中掌權者的首領」在悖逆之子心中運行；第 1 章卻說基督已經遠超過一切執政掌權的。撒但到底還有沒有權柄？華人信徒從小在鬼月、風水、沖煞的恐懼裡長大，這一題講得太重會叫人恐慌、凡事見鬼，講得太輕又會叫人輕忽真實的屬靈爭戰。","pos":[["【一】經文問的是甚麼","","<p>「那時，你們在其中行事為人，隨從今世的風俗，順服空中掌權者的首領，就是現今在悖逆之子心中運行的邪靈」（2:2）。<strong>τὸν ἄρχοντα τῆς ἐξουσίας τοῦ ἀέρος</strong>（ton archonta tēs exousias tou aeros）是「空中權勢的首領」。耶穌稱他為「這世界的王」，保羅說「這世界的神」，約翰說「全世界都臥在那惡者手下」（約壹 5:19）。問題是：基督既已得勝，這位首領現在還有多少權柄？他在哪裡運行？</p>"],["比喻說：首領是古人對邪惡結構的稱呼","","<p>一些現代學者認為，「空中掌權者」是古代世界觀的語言，今天可以讀成社會結構、文化潮流、集體的惡；保羅把「今世的風俗」與這位首領並列，正說明他指的是籠罩一個時代的風氣。</p><p><strong>難處：</strong>經文說他是「現今在悖逆之子心中運行的邪靈」，有位格、有作為；耶穌的服事中也有真實的趕鬼。把它完全讀成比喻，就和全卷 6:11–12 的「魔鬼的詭計」對不上，也會叫信徒輕忽真實的試探與攻擊。</p>"],["權勢誇大說：撒但仍然掌管世界，信徒要不斷捆綁、爭奪地域","","<p>部分屬靈爭戰運動認為，撒但與牠的邪靈分區轄制城市、家族與個人；信徒必須辨認地域邪靈、繪製屬靈地圖、點名捆綁，才能奪回失地，許多病痛與不順都被解釋成邪靈作祟。</p><p><strong>難處：</strong>這一說忽略了 1:20–22 與 2:6：基督已經坐在遠超一切執政掌權的位置上，信徒也與他一同坐著；新約從來沒有教導信徒去點名捆綁地域邪靈。這種作法常叫人恐慌、延誤醫療，果效是怕，不是平安。</p>"],["已敗而未滅說：真實存在，已被擊敗，仍在悖逆的人中運行","","<p>多數福音派學者：這位首領是真實的靈界位格，在不信的人與這世界的風俗裡運行；但他已經在十字架上被擊敗，「這世界的王要被趕出去」（約 12:31），基督已經坐在遠超一切的位置上。信徒「從前」在他手下，「如今」已經被遷到愛子的國裡。爭戰是真實的，但信徒是從得勝的位置站立，不是從地上往上打。</p><p><strong>難處：</strong>「已經被擊敗」與「仍在運行」之間的張力需要說清楚，否則會眾不是覺得他已經不存在，就是覺得他仍然很可怕。</p>"],["【三】本講義站在哪裡","","<p><strong>本講義採已敗而未滅說。</strong>這個首領是真實的，卻不是最高的；他在悖逆之子心中運行，但在基督裡的人已經不在他手下了。所以不迷信，也不輕忽：不必怕鬼月、風水、廟宇，也不把每一個病痛、每一場衝突都講成鬼的問題；但不拜、不求、不戴護身符、不擇日，因為那是把信靠交回給他。</p><p>身心的困擾要就醫，也要禱告；不採地域邪靈、屬靈地圖、點名捆綁的作法（全卷立場見 ISS00_4）。</p>"],["【四】這件事該不該影響你的信心","","<p>不該，而且應當叫你更平安。2:2 是寫在 2:6 之前的：先說你從前在誰的手下，再說你如今和誰一同坐著。</p><p>約翰說：「那在你們裡面的，比那在世界上的更大。」（約壹 4:4）認識這位首領，不是為了怕他，是為了知道自己已經被帶到哪裡。</p>"]],"con":[],"say":"本講義的立場：空中掌權者的首領是真實的，卻已經被擊敗，不是最高的；在基督裡的人已經不在他手下。不迷信、不輕忽；身心困擾同時就醫與禱告。本講義的全卷立場見 ISS00_4。","care":"會眾席上可能有從小被鬼月、沖煞嚇大的人，也可能有正在受憂鬱、焦慮、幻聽所苦、卻被人說成「被鬼附」的弟兄姊妹與家人。不要在講台上描述靈界的恐怖細節，也不要輕易對任何人說「你身上有邪靈」。陪受苦的人一起禱告，同時鼓勵並協助他就醫、尋求專業協助；對害怕的人，帶他讀 2:6，讓他知道自己坐在哪裡。"},{"id":"ISS02_3","t":"2:6「一同坐在天上」——已經發生了嗎？「已然」與「未然」怎樣並存？","r":"2:5--7；西 3:3；約壹 3:2","ch":[2],"why":"保羅用不定過去式說神已經叫我們「一同復活，一同坐在天上」。可是信徒明明還在地上受苦、生病、跌倒。這句話是預言、是比喻，還是事實？講得太滿，會變成成功神學；講得太虛，會叫人覺得這只是好聽的話。這一題直接決定一個人怎樣面對今天的軟弱。","pos":[["【一】經文問的是甚麼","","<p>「他又叫我們與基督耶穌一同復活，一同坐在天上」（2:6）。<strong>συνήγειρεν</strong>（synēgeiren）、<strong>συνεκάθισεν</strong>（synekathisen）都是不定過去式，說的是已經發生的事；可是下一節說，神要將他極豐富的恩典「顯明給後來的世代看」（2:7）。問題是：信徒是已經坐在天上，還是將來才會坐在天上？如果已經坐下，為甚麼生活看起來還不是這樣？</p>"],["預言式不定過去說：確定的未來，說成已成","","<p>認為這是希伯來先知常用的筆法：把神確定要成就的事，用已經完成的語氣說出來；信徒將來必定與基督一同復活、一同作王，因為太確定，所以保羅說成已經發生。</p><p><strong>難處：</strong>這一說保住了將來的盼望，卻可能削弱了保羅要信徒「如今」就知道的事；2:5 的「得救」是完成式，2:13「如今……已經得親近了」也是現在的事實，同一段經文的時態不容易全部推到將來。</p>"],["全然實現說：信徒現在就該活出天上的權柄與豐盛","","<p>部分信心運動與成功神學認為：既然已經坐在天上，信徒現在就該擁有健康、富足、凡事得勝；如果生病、貧窮、受挫，是因為沒有認識或宣告自己的地位。</p><p><strong>難處：</strong>寫這句話的保羅自己正戴著鎖鍊坐在監裡（3:1；4:1）；2:7 明說恩典的豐富要在「後來的世代」顯明。把「已然」講成「全然」，會叫受苦的人以為自己被神擱在一邊，也和新約對苦難的教導不合。</p>"],["已然未然說：地位上已經坐下，經歷上還沒有完全顯明","","<p>多數福音派學者：在基督裡的人，此刻已經真實地有份於他的復活與王權——不是比喻，是聯合；但這份地位要到基督顯現時才完全顯明。「你們的生命與基督一同藏在神裡面」（西 3:3）；「我們現在是神的兒女，將來如何，還未顯明」（約壹 3:2）。已經坐下，所以不必搶位子；還沒有顯明，所以仍要忍耐、仍要爭戰。</p><p><strong>難處：</strong>「已然」與「未然」的比例需要牧養的分寸，講得不好，會讓人覺得只是一套術語。</p>"],["【三】本講義站在哪裡","","<p><strong>本講義採已然未然說。</strong>2:6 是全卷「坐」的出處：坐是完成的姿勢，是基督作成、我們被安置；但坐不是躺平，四節之後保羅就說「為要叫我們行善」（2:10），第 6 章還要站立爭戰。</p><p>所以本講義的落點是：已經坐下，所以你不必再用一生搶地上的位子；還沒有完全顯明，所以今天的眼淚不證明你沒有坐在那裡。</p>"],["【四】這件事該不該影響你的信心","","<p>不該，反而能扶住你的信心。你不必等生活順利了，才相信自己和基督一同坐著；也不必因為生活不順利，就懷疑自己失去了這個位置。</p><p>保羅在監裡寫下「一同坐在天上」，這句話最能安慰的，正是今天還坐在病床邊、失業的家裡、或某一間看不見出口的房間裡的人。</p>"]],"con":[],"say":"本講義的立場：已然未然——在基督裡的人已經真實地與他一同坐在天上，但要到後來的世代才完全顯明；已經坐下，所以不必搶位子，還沒有顯明，所以仍要忍耐、行善、站立。屬靈爭戰從得勝的位置站立，全卷立場見 ISS00_4。","care":"會眾席上可能有久病、失業、婚姻破碎、禱告多年沒有看見改變的人，也可能有曾經被人說「你病了是因為信心不夠」而受傷的人。不要用 2:6 叫受苦的人「宣告得勝」，也不要對正在流淚的人說「你要有信心」。陪他坐著，讓他知道保羅寫這句話時也在監裡；必要時協助他尋求醫療與專業協助，並在會後單獨關心。"},{"id":"ISS02_4","t":"2:8「這並不是出於自己」——「這」指恩典、信心，還是整個救恩？","r":"2:8--9；腓 1:29；徒 16:14","ch":[2],"why":"「這並不是出於自己，乃是神所賜的」是信徒最熟悉的一句經文，但「這」到底指甚麼，牽動一個很實際的問題：連我的信心都是神給的嗎？如果是，那不信的人怎麼辦？如果不是，信心會不會變成我自己的功勞？這一題和揀選與預定的爭論緊緊相連。","pos":[["【一】經文問的是甚麼","","<p>「你們得救是本乎恩，也因著信；這並不是出於自己，乃是神所賜的」（2:8）。<strong>καὶ τοῦτο οὐκ ἐξ ὑμῶν</strong>（kai touto ouk ex hymōn）的 τοῦτο（touto）是中性代名詞，可是前面的 χάριτί（chariti，恩）與 πίστεως（pisteōs，信）都是陰性。問題是：在文法不直接對應的情況下，「這」指的是信心、恩典，還是整件得救的事？</p>"],["指信心說：連信心都是神所賜的","","<p>部分教父與後來的改革宗作者：「這」最靠近的是「信」，保羅要說的是連信心也不是出於自己；這與「你們蒙恩，不但得以信服基督」（腓 1:29）、主開導呂底亞的心（徒 16:14）相合，強調救恩從頭到尾都是神的主動。</p><p><strong>難處：</strong>文法上性別不合，中性的 τοῦτο（touto）不容易直接指陰性的 πίστεως（pisteōs）；而且下一句「也不是出於行為」若是在說信心，就變成「信心不是出於行為」，意思有些繞。</p>"],["指恩典說：恩典不是出於自己","","<p>認為「這」回指「恩」，保羅在強調恩典的來源是神，不是人。</p><p><strong>難處：</strong>同樣有性別不合的問題；而且「恩典不是出於自己」幾乎是同義反覆——恩典本來就是白白給的，不必再說它不是出於人。這一讀法在學者中支持者最少。</p>"],["指整個得救說：本乎恩、因著信而得救這件事","","<p>多數現代註釋：中性代名詞在希臘文裡常用來指前面整個意思；「這」指的是「本乎恩、也因著信而得救」這一整件事。下一句 οὐκ ἐξ ἔργων（ouk ex ergōn）與 οὐκ ἐξ ὑμῶν（ouk ex hymōn）平行，說「不是出於行為」的，最自然是整個救恩。這樣讀，信心也被包在禮物裡面，不會變成另一種功勞。</p><p><strong>難處：</strong>這一讀法沒有直接回答「信心本身是不是神所賜」的問題，各派仍可以各自帶進自己的揀選觀來理解。</p>"],["【三】本講義站在哪裡","","<p><strong>本講義取第三讀：「這」指整個得救這件事。</strong>救恩從頭到尾都是 θεοῦ τὸ δῶρον（theou to dōron）——「是神的，這禮物」；連你的那份信，都包在神的禮物裡。信是領受的手，不是付款的錢。</p><p>至於人的信心與神的揀選如何並存，加爾文派、阿米念派各有理解，本講義並陳，不在本章另立說法（全卷立場見 ISS00_2）。</p>"],["【四】這件事該不該影響你的信心","","<p>不該。三種讀法都同意：得救不是出於自己，免得有人自誇；連最用力的信心，也不能拿來誇口。</p><p>這反而是安慰：救恩的穩固不在你抓得多緊，在送禮的那一位。你今天信得軟弱，禮物並沒有因此被收回。</p>"]],"con":[],"say":"本講義的立場：「這」指本乎恩、因著信而得救的整件事——救恩從頭到尾都是神的禮物，連信心也不能拿來自誇。人的信心與神的揀選如何並存，本講義的全卷立場見 ISS00_2。","care":"會眾席上可能有正為家人不信而焦急的人，聽到「信心是神所賜的」會害怕：「那我的孩子是不是沒有被揀選？」也可能有覺得自己信心太小、懷疑自己是否真的得救的人。不要對任何人說「他可能沒有被揀選」；陪焦急的人繼續為家人禱告、繼續傳福音，陪懷疑的人回到送禮的那一位：禮物的保證在他，不在你抓得多緊。"},{"id":"ISS02_5","t":"2:9--10「不是出於行為」「為要叫我們行善」——恩典與行為怎樣並存？","r":"2:8--10；雅 2:17；多 3:5","ch":[2],"why":"2:8–9 是新教「唯獨恩典」最常引的經文，雅各書卻說「信心若沒有行為就是死的」。華人教會常在兩個極端之間擺盪：一邊說得救了怎麼活都可以，一邊用服事與表現量一個人是不是真信徒。這一題是本卷紅線五的本文，關係到每一位信徒每天怎樣看自己的行為。","pos":[["【一】經文問的是甚麼","","<p>「也不是出於行為，免得有人自誇。我們原是他的工作，在基督耶穌裡造成的，為要叫我們行善，就是神所預備叫我們行的。」（2:9–10）2:9 的 <strong>ἔργων</strong>（ergōn）和 2:10 的 <strong>ἔργοις ἀγαθοῖς</strong>（ergois agathois）是同一個字。問題是：行為在救恩裡到底有沒有位置？是得救的條件、得救的證據，還是得救的結果？</p>"],["唯獨恩典、行為無關說","","<p>部分強調恩典的教導認為：既然得救不是出於行為，行為就和救恩完全無關；談行為、談順服都會帶回律法主義，信徒只要相信自己已經得救，不必在意生活的改變。</p><p><strong>難處：</strong>這一說讀到 2:9 就停了。保羅緊接著說我們被造是「為要叫我們行善」，保羅在別處也說「我們可以仍在罪中、叫恩典顯多嗎？」答案是「斷乎不可」（羅 6:1–2）。恩典不是放縱的許可證。</p>"],["恩典起頭、行為保持說","","<p>另一些教導認為：人起初得救是本乎恩，但之後要靠行善、守規矩、持續服事，才能保住救恩；行為不夠，救恩可能失去。常引腓 2:12「恐懼戰兢做成你們得救的工夫」。</p><p><strong>難處：</strong>2:8「你們得救」是完成式被動，已經發生、效力持續，施救的是神；腓 2:12 下一節就說「你們立志行事都是神在你們心裡運行」（腓 2:13）。若行為是保住救恩的條件，2:9「免得有人自誇」就失守了。</p>"],["根與果說：不是出於行為，卻是為了行善","","<p>宗教改革與多數福音派：行為不是救恩的根，是救恩的果。ἐξ（ex）是「出於」，ἐπὶ（epi）是「為了」——行為被趕出門外，不能當作得救的來源；又從另一扇門回來，成為新造之人的目的。保羅與雅各說的是同一棵樹的根和果子：真實的信心一定結出行為，而那些善行是神「預備」好的路。</p><p><strong>難處：</strong>「真信心一定有行為」在牧養上容易被轉成「拿行為量別人的信心」，需要謹慎。</p>"],["【三】本講義站在哪裡","","<p><strong>本講義採根與果說，並且要求三節一起讀（紅線五）。</strong>只讀 2:8–9，會以為行為不重要；只讀 2:10，會以為要靠行善保住救恩。三節合起來才是福音：不是出於行為，卻是為了行善；行善是恩典的結果，不是條件。</p><p>這與加拉太書講義的立場一致：稱義是神白白的恩典，單單因信；聖靈在信徒裡面結出愛的果子（回指加拉太書立場二）。</p>"],["【四】這件事該不該影響你的信心","","<p>不該。各派都同意：得救是神的恩典，得救的人會被改變。爭的是先後與比例。</p><p>如果你今天因為行善不夠而覺得離神很遠，請記得：善行是神「預備」好、讓你走上去的路，不是你要交出去的成績單。你不是為了得救而行善，是因為得救而行善。</p>"]],"con":[],"say":"本講義的立場：2:8、2:9、2:10 三節一起讀——得救不是出於行為，卻是為了行善；行善是恩典的結果，不是得救的條件，也不是保住救恩的代價。因信稱義回指加拉太書立場二；爭議與信心的全卷立場見 ISS00_9。","care":"會眾席上可能有在重視表現的教會裡長大、到今天仍然覺得「做得不夠」就不被神接納的人；也可能有因為軟弱跌倒、懷疑自己已經失去救恩的人。不要用「真信徒一定會……」去量任何一個人，也不要叫跌倒的人「再努力一點把救恩保住」。陪他回到 2:8 的完成式：他已經得救；再陪他一小步一小步走上神預備的路。"},{"id":"ISS02_6","t":"2:14--15「廢掉冤仇，就是那記在律法上的規條」——舊約律法被廢了嗎？","r":"2:14--16；太 5:17；羅 3:31；西 2:14","ch":[2],"why":"2:15 說基督「以自己的身體廢掉冤仇，就是那記在律法上的規條」，耶穌卻說「我來不是要廢掉，乃是要成全」。律法到底是被廢了還是被成全了？這一題影響信徒怎樣讀舊約、怎樣看十誡、怎樣面對要求守節期與飲食條例的教導，也影響教會怎樣講道德。","pos":[["【一】經文問的是甚麼","","<p>「而且以自己的身體廢掉冤仇，就是那記在律法上的規條」（2:15）。原文是 <strong>τὸν νόμον τῶν ἐντολῶν ἐν δόγμασιν καταργήσας</strong>（ton nomon tōn entolōn en dogmasin katargēsas）——律法、誡命、規條三個字疊在一起；καταργήσας（katargēsas）是「使失效、使不再運作」。問題是：被廢的是整個摩西律法，是分隔猶太人與外邦人的禮儀條例，還是律法被當作隔牆的那種功用？</p>"],["整體廢止說：摩西之約作為制度已經結束","","<p>認為基督來了，摩西之約作為一整套制度已經終止；信徒不在律法之下，乃在恩典之下（羅 6:14），「律法的總結就是基督」（羅 10:4）。新約信徒的道德生活來自基督的律與聖靈，而不是直接來自摩西律法。</p><p><strong>難處：</strong>本卷 4:25 仍引亞 8:16，6:2 仍引十誡「孝敬父母」；保羅說「我們因信廢了律法嗎？斷乎不是！更是堅固律法」（羅 3:31）。若說整體廢止，就要說明為甚麼保羅還一直引用律法來教導信徒。</p>"],["禮儀條例說：只廢掉分隔族群的割禮、飲食、潔淨條例","","<p>改革宗傳統常把律法分為道德律、禮儀律、民事律：被廢的是禮儀與民事的部分，特別是把猶太人和外邦人分開的割禮、飲食、潔淨條例；道德律仍然有效。2:11 的割禮與 2:14 的隔牆正支持這一讀法。</p><p><strong>難處：</strong>三分法是後來的神學整理，舊約與新約都沒有這樣明文分類；猶太讀者會把律法看成一個整體，保羅的用詞也不容易硬切成三塊。</p>"],["功能說：被廢的是律法當作隔牆與入門條件的那種功用","","<p>許多當代學者：保羅在這裡關心的是律法如何成了「冤仇」，被拿來把人分成裡面和外面；基督在十字架上使律法這種隔斷的功能失效，同時成全了律法的心意。所以不是神的旨意被廢，而是「誰守這些才算自己人」的那一套被廢。</p><p><strong>難處：</strong>「功能」這個說法比較抽象，需要具體說明哪些作法屬於隔牆、哪些屬於神不變的心意，不然容易被各取所需。</p>"],["【三】本講義站在哪裡","","<p><strong>本講義採功能說，並吸收禮儀條例說的提醒。</strong>被廢的是律法作為「隔牆」與「入門條件」的功能——割禮、飲食、潔淨被當作分隔與門票的那一套；不是神要人誠實、聖潔、相愛的道德旨意。所以 4:25 以後保羅仍然一條一條地教導新人該怎樣活，那正是律法心意的成全。</p><p>這也是書信三問的第三問：今天的「規條」可能是一套教會文化、一種服裝規矩、一份屬靈表現的檢查表——它們一旦成為門票，就是被基督廢掉的那一套（全卷立場見 ISS00_1）。</p>"],["【四】這件事該不該影響你的信心","","<p>不該。各派都同意：人不是靠守律法得救，基督成全了律法，信徒要過聖潔的生活。爭的是如何描述律法在新約裡的位置。</p><p>對你今天最重要的是：舊約仍然是神的話，值得你一讀再讀；只是沒有任何一條規條，可以再把你或別人擋在神的家門外。</p>"]],"con":[],"say":"本講義的立場：2:15 被廢的是律法作為隔牆與入門條件的功能，不是神的道德旨意；本卷仍引十誡教導信徒，基督來是要成全律法。處境與原則的全卷立場見 ISS00_1；律法與稱義回指加拉太書立場二。","care":"會眾席上可能有曾在律法主義很重的群體裡受傷、一聽到「律法」就害怕的人，也可能有被要求守節期、飲食條例才算「回到根源」而困惑的人。不要在台上嘲笑任何一種守法的傳統，也不要叫人以為舊約可以丟掉。陪害怕的人看見律法的心意是愛，陪困惑的人回到 2:18：兩下都是「藉著他」才得以進到父面前。"},{"id":"ISS02_7","t":"2:15「造成一個新人」——教會取代以色列了嗎？","r":"2:11--18；羅 11:1；羅 11:18；羅 11:29","ch":[2],"why":"「將兩下……造成一個新人」常被讀成：教會已經成了新的以色列，神和猶太民族的盟約已經結束。歷史上，這種讀法曾被拿來合理化對猶太人的輕看、甚至迫害。另一面，也有人把以色列和教會分成兩條平行的救恩路線。這一題關係到教會怎樣看猶太人，也關係到神的應許是否可靠。","pos":[["【一】經文問的是甚麼","","<p>「為要將兩下藉著自己造成一個新人，如此便成就了和睦。」（2:15）<strong>εἰς ἕνα καινὸν ἄνθρωπον</strong>（eis hena kainon anthrōpon），καινὸν（kainon）是新的種類，不是翻新舊的。2:12 又說外邦人從前「在以色列國民以外」，2:19 說如今「與聖徒同國」。問題是：這個新人是取代了以色列，是加入了以色列，還是與以色列並行的另一群人？</p>"],["取代論：教會是新以色列，以色列的地位已經轉給教會","","<p>教會歷史上相當長一段時間的主流讀法：猶太人拒絕了彌賽亞，以色列的應許與名分轉移到教會身上；「一個新人」就是新的神子民，民族的以色列在救恩歷史裡已經沒有特殊位置。</p><p><strong>難處：</strong>保羅自己問「神棄絕了他的百姓嗎？」答案是「斷乎沒有」（羅 11:1），又說「神的恩賜和選召是沒有後悔的」（羅 11:29）。取代論的歷史果子也很沉重——它曾被拿來輕看、甚至迫害猶太人，這正是在教會裡另砌一道牆。</p>"],["兩約並行說：以色列與教會是兩群不同的神子民","","<p>部分時代論與一些猶太基督徒對話的立場：以色列和教會是兩群不同的神子民，各有各的應許與將來；甚至有人主張猶太人可以藉著摩西之約得救，不必信耶穌。</p><p><strong>難處：</strong>2:15–16 明說是「兩下」被造成一個新人、「歸為一體」，2:18 說「我們兩下藉著他」才得以進到父面前——沒有兩個入口。說猶太人不需要基督，等於在十字架上又分出兩條路，也與新約使徒向猶太人傳福音的事實不合。</p>"],["接枝與新人說：外邦人被接進來，猶太人與外邦人一同成為新人","","<p>許多當代福音派學者：新人不是取代，也不是並行，而是兩下在基督裡一同被造；外邦人被接進一個本來有以色列信徒在裡面的國度與家，「不是你托著根，乃是根托著你」（羅 11:18）。神對以色列的恩賜和選召沒有後悔，羅 11 對以色列的將來仍有盼望；但無論猶太人或外邦人，都只能藉著基督來到父面前。</p><p><strong>難處：</strong>以色列將來的確切樣子（例如羅 11:26「以色列全家都要得救」的意思），學者仍有不同理解，需要謙卑地並陳。</p>"],["【三】本講義站在哪裡","","<p><strong>本講義採接枝與新人說。</strong>新人不是一方吃掉另一方，是猶太人與外邦人在基督裡一同被造：猶太人仍是猶太人，外邦人仍是外邦人，卻都成了一個新人的一部分。外邦人是被接進來的，不是取而代之的；神的應許沒有落空。</p><p>所以本講義不採取代論，也不採兩約並行說；講台絕不輕看猶太人。以色列將來的細節不在本章另立說法，也不套用預設的末世時間表。</p>"],["【四】這件事該不該影響你的信心","","<p>不該。各派都同意：基督是唯一的救主，教會是神的子民，神是信實的。爭的是以色列和教會之間的關係怎樣描述。</p><p>對你今天最重要的，是記得 2:12：你原是局外人，是被接進來的。忘記自己曾是外人的人，最容易把別人當外人。</p>"]],"con":[],"say":"本講義的立場：一個新人不是取代以色列，也不是與以色列並行，是猶太人與外邦人在基督裡一同被造；外邦人是被接進來的，神對以色列的選召沒有後悔。講台絕不輕看猶太人；爭議與信心的全卷立場見 ISS00_9。","care":"會眾席上可能有猶太裔的朋友、信主的猶太人，或有猶太親友的弟兄姊妹；也可能有被某些過度熱衷以色列議題的教導搞得很焦慮的人。不要在台上用任何貶低猶太人的笑話或說法，也不要把中東的政治局勢直接講成預言的應驗。陪焦慮的人回到 2:14：他是我們的和睦；對猶太裔的朋友，以尊重與愛接待，不把他當成辯論的對象。"},{"id":"ISS02_8","t":"2:14 今天的牆：族群、方言、世代、階級與政治立場——教會怎樣面對？","r":"2:14--18；加 3:28；西 3:11；啟 7:9","ch":[2],"why":"第一世紀最高的牆是猶太人與外邦人之間的那一道；今天的教會裡，牆換了材料：國語堂與方言堂、第一代與第二代、本地人與外籍移工、不同的收入與學歷，還有越來越尖銳的政治立場。這一題是書信三問的第三問，直接碰到每一間華人教會的週日早上與每一個教會群組。","pos":[["【一】經文問的是甚麼","","<p>「因他使我們和睦，將兩下合而為一，拆毀了中間隔斷的牆」（2:14）。<strong>αὐτὸς γάρ ἐστιν ἡ εἰρήνη ἡμῶν</strong>（autos gar estin hē eirēnē hēmōn），原文是「因他是我們的和睦」。保羅在別處說「並不分猶太人、希臘人，自主的、為奴的，或男或女」（加 3:28）。問題是：基督拆的那道牆，今天落在哪裡？教會該消除一切差異，還是在差異中合一？</p>"],["抹平差異說：在基督裡不再有族群、文化、立場的分別","","<p>認為既然牆拆了，教會就不該再談族群、語言、文化，也不該有任何按群體安排的聚會；大家都是基督徒，其他的身分都不重要，談差異本身就是分裂。</p><p><strong>難處：</strong>2:15 的新人不是叫猶太人不再是猶太人，而是兩下一同被造；啟示錄的寶座前站著「從各國、各族、各民、各方來的」（啟 7:9）——差異沒有被抹掉。抹平差異常常變成以多數人的文化為標準，讓少數的一群人悄悄地消失。</p>"],["屬靈與社會分開說：教會只管靈魂，不碰族群與政治的牆","","<p>認為教會的使命是傳福音、救靈魂，族群、階級、政治是社會的事；講台只要講屬靈的事，不必觸碰這些敏感議題，以免分裂。</p><p><strong>難處：</strong>2:16 說十字架同時有直的與橫的兩個方向：「與神和好」，也「使兩下歸為一體」。教會若對自己中間的牆視而不見，就是讓基督拆過的地方，一塊一塊被砌回去；沉默本身也是一種選擇。</p>"],["和睦的群體說：差異保留，敵意拆除，在基督裡一同被建造","","<p>認為基督拆的是「冤仇」，不是身分：族群、語言、文化可以保留，甚至是神百般智慧的展示；但任何差異一旦成為敵意、優越感或入門條件，就是那道被拆的牆。教會要讓不同的人一起吃飯、一起禱告、一起作決定；在政治立場上，講台不替任何一方背書，卻要教導信徒在不同立場中彼此相愛、不把弟兄姊妹當敵人。</p><p><strong>難處：</strong>這一說最需要持續的努力與牧養的智慧，不像一條規條那樣容易執行；在政治撕裂的時刻，要同時守住真理與和睦，代價很高。</p>"],["【三】本講義站在哪裡","","<p><strong>本講義採和睦的群體說。</strong>合一不是一樣，但合一一定要落在生活裡：不同的人有沒有一起吃飯、一起禱告、一起作決定？提到對方時，語氣裡有沒有「他們那邊的」？</p><p>處境不同，原則一致：第一世紀的牆是聖殿的隔牆，今天的牆是方言、世代、階級、國籍與政治立場；原則是基督自己是我們的和睦（全卷立場見 ISS00_1）。</p>"],["【四】這件事該不該影響你的信心","","<p>不該。每一間教會都在這件事上掙扎，這不證明福音失效，只證明我們仍在「漸漸」被建造。</p><p>合一不是我們努力造出來的，是基督造好了，交給我們保守。你不必拆掉所有的牆，你只要不再砌新的那一塊，並且願意先走過去。</p>"]],"con":[],"say":"本講義的立場：基督拆的是冤仇，不是身分——差異可以保留，敵意、優越感與入門條件必須拆除；講台不替任何政治立場背書，但要教導信徒在不同立場中彼此相愛。本講義的全卷立場見 ISS00_1。","care":"會眾席上可能有在教會裡一直被當作外人的外籍移工、新移民、少數族群，也可能有因為政治立場與弟兄姊妹撕裂、甚至離開教會的人。不要在講台上點名任何群體或立場，也不要叫任何一群人覺得自己是問題。會後主動關心那些在教會裡找不到位子的人；對因政治立場受傷的人，先聽，不急著勸和，陪他回到同一位父面前禱告。"},{"id":"ISS02_9","t":"2:20「被建造在使徒和先知的根基上」——今天還有使徒、先知在立根基嗎？","r":"2:20；林前 3:11；啟 21:14","ch":[2],"why":"2:20 說教會「被建造在使徒和先知的根基上」。今天有人自稱使徒、先知，要人在他的遮蓋底下，也有人說使徒和先知的恩賜早已止息。這節經文常被兩邊引用：一邊說根基已經立好，一邊說神今天仍在興起使徒和先知。這一題直接關係到屬靈權柄與信徒的安全。","pos":[["【一】經文問的是甚麼","","<p>「並且被建造在使徒和先知的根基上，有基督耶穌自己為房角石」（2:20）。<strong>ἐπὶ τῷ θεμελίῳ τῶν ἀποστόλων καὶ προφητῶν</strong>（epi tō themeliō tōn apostolōn kai prophētōn），一個冠詞統管兩個名詞，次序與 3:5、4:11 相同，多數學者認為指新約的先知。問題是：這個根基是一次立好、不再重複的，還是每一代都需要新的使徒和先知來立？</p>"],["止息論：使徒和先知的職分已經結束","","<p>認為根基只打一次：新約的使徒見過復活的主、被他直接差遣，把福音的根基立好了；「那已經立好的根基就是耶穌基督，此外沒有人能立別的根基」（林前 3:11）。新約正典完成之後，使徒與先知的職分與啟示性的恩賜都已經止息。</p><p><strong>難處：</strong>4:11–13 說這些恩賜是「直等到我們眾人……長大成人」，不容易說只限於第一代；而且止息論若講得太硬，會讓教會忽略開拓差傳、造就勸勉這些今天仍然需要的功能。</p>"],["新使徒改革運動：神今天正在恢復使徒與先知的職分","","<p>二十世紀末興起的運動認為，神在末後的日子恢復使徒與先知的職分，他們今天仍在為教會立根基、帶領城市與國家；信徒需要在使徒的遮蓋底下，先知的話可以為個人與群體指示方向。</p><p><strong>難處：</strong>2:20 說根基已經立在使徒和先知上，房角石是基督，蓋到十樓不會再重打地基；以頭銜要求絕對順服、用「先知性的話」替人決定婚姻和工作，在實踐上已經造成許多屬靈控制與傷害。</p>"],["溫和延續論：根基職分不再有，使徒性與先知性的功能仍在","","<p>許多福音派學者：新約使徒和先知那種立根基、寫下啟示的地位不能重複；但「使徒性」的開拓差傳、「先知性」的造就勸勉安慰（林前 14:3），今天仍然需要，而且要受聖經檢驗。這些功能是為了成全聖徒，不是為了建立頭銜與層級。</p><p><strong>難處：</strong>功能與職分的界線需要分辨，名稱上的混用容易造成誤會，教會需要清楚的教導與問責機制。</p>"],["【三】本講義站在哪裡","","<p><strong>本講義採溫和延續論。</strong>根基只打一次：新約使徒與先知的根基職分不再有，沒有人可以自稱是新的根基；使徒性與先知性的功能仍然需要，但不以頭銜要求順服，不發布高過聖經的新啟示，不用「先知性的話」替人決定婚姻、工作、搬遷。</p><p>每一塊石頭都要對齊房角石，而不是對齊旁邊那一塊；元首只有基督（全卷立場見 ISS00_5；屬靈權柄回指哥林多後書立場三）。</p>"],["【四】這件事該不該影響你的信心","","<p>不該。各派都同意：教會建造在基督和使徒所傳的福音上，聖經是最終的權威。爭的是今天的恩賜與職分怎樣命名、怎樣運作。</p><p>你的信心不靠任何一位領袖站立。一間教會蓋在一個人的魅力上，那人一走房子就斜了；蓋在根基與房角石上，才不倚靠任何一個人。</p>"]],"con":[],"say":"本講義的立場：根基只打一次——新約使徒與先知的根基職分不再有，房角石是基督；使徒性與先知性的功能仍需要，但不以頭銜要求順服、不發布高過聖經的新啟示。本講義的全卷立場見 ISS00_5。","care":"會眾席上可能有曾經在「使徒」「先知」的遮蓋下被控制、被要求奉獻或斷絕關係的人，也可能有因為一句「先知性的話」而嫁錯人、搬錯城市、至今自責的人。不要嘲笑他們當初的信任，也不要叫他們「順服就好」。先聽他說完，肯定他離開控制的勇氣；涉及屬靈或其他方面的傷害，協助他找到安全的管道與專業協助。"},{"id":"ISS03_1","t":"3:1「被囚的」——保羅在哪裡坐監？以弗所書寫於何時？","r":"3:1；6:20；4:1","ch":[3],"why":"以弗所書三次提到保羅的捆鎖（3:1；4:1；6:20），卻沒有說他被關在哪裡。坐監的地點決定這封信寫於哪一年，也牽動它和歌羅西書、腓利門書、腓立比書的關係；有人因為地點無法確定，就懷疑整封信的可靠。這一題值得把各家的理由攤開，也讓人看見一個囚犯怎樣寫出全本新約最高的頌讚之一。","pos":[["【一】經文問的是甚麼","","<p>保羅自稱「為你們外邦人作了基督耶穌被囚的」（3:1），又說「我為主被囚的」（4:1）、「我為這福音的奧祕作了帶鎖鍊的使者」（6:20）。使徒行傳記他至少兩次長期被拘：該撒利亞兩年（徒 24:27），羅馬兩年（徒 28:30）；他自己也說「多下監牢」（林後 11:23）。問題是：寫以弗所書時，他在哪一處的監裡？</p>"],["羅馬說（約主後 60–62 年）","","<p>這是教會最早、也最普遍的看法：保羅在羅馬「蒙准和一個看守他的兵另住在一處」（徒 28:16），可以接待來客、口述書信，推基古與阿尼西母從那裡把以弗所書、歌羅西書、腓利門書一起送到亞細亞。腓立比書提到「御營全軍」，也與羅馬相合。</p><p><strong>難處：</strong>羅馬離亞細亞很遠，阿尼西母一個逃走的奴僕跑到羅馬、又被送回，路程不短；而且腓利門書說保羅要人為他預備住處，彷彿很快就能去，從羅馬看似乎太遠。</p>"],["該撒利亞說（約主後 57–59 年）","","<p>保羅在該撒利亞被「看守在希律的衙門裡」（徒 23:35）整整兩年，時間夠長，朋友也能來往。有學者認為監獄書信有一部分寫於那裡，與耶路撒冷聖殿那道隔斷的牆（2:14）的事件時間最近。</p><p><strong>難處：</strong>使徒行傳沒有暗示保羅在該撒利亞能自由寫信、接待許多同工；而且當時他已經上訴該撒，心裡想的是往羅馬去，與書信裡等候釋放的語氣不太相合。</p>"],["以弗所說（約主後 54–55 年）","","<p>保羅在以弗所住了將近三年，說過「在以弗所同野獸戰鬥」（林前 15:32），又說多下監牢，有學者推想他曾在以弗所短暫被囚，亞細亞的書信就近寫成，阿尼西母的路程也最短。</p><p><strong>難處：</strong>使徒行傳完全沒有記保羅在以弗所坐監；更大的難處是，以弗所書很像寫給不太認識的讀者（「諒必你們曾聽見」3:2），若保羅就在以弗所坐監，這語氣就很奇怪。</p>"],["【三】本講義站在哪裡","","<p><strong>本講義採羅馬說</strong>，約主後 60–62 年，與使徒行傳講義第 28 章相接；這也最能解釋三封監獄書信由推基古一同送達（6:21；西 4:7），以及 3:2 那種寫給傳閱眾教會的語氣。但這是歷史重建，三說都有敬重聖經的學者支持。</p><p>不論在哪裡，三說都同意同一件事：寫下「但願他在教會中，並在基督耶穌裡，得著榮耀」（3:21）的人，手上有鍊子。</p>"],["【四】這件事該不該影響你的信心","","<p>不該。古代書信常常不寫日期地點，學者用經文裡的線索重建，是讀古代文獻的常態；地點不同，沒有一處改變信的內容。</p><p>真正該讓我們停下來的，是保羅怎樣稱呼自己：不是羅馬的囚犯，是「基督耶穌被囚的」。不論你被困在哪一座城、哪一間病房，決定你身分的，仍然是基督。</p>"]],"con":[],"say":"本講義的立場：三說並陳，採羅馬說（約主後 60–62 年）；不論在哪裡，寫下這封信的人手上有鍊子，卻稱自己是基督耶穌被囚的。作者、收信人與寫作背景的全卷立場見 ISS00_6。","care":"會眾席上可能有正在監獄、看守所裡的人或他們的家人，也有人被困在病床、照顧者的角色或一份走不掉的工作裡。不要把這一題講成考據比賽；也不要說「保羅坐監都不抱怨，你為甚麼抱怨」。牧者可以會後單獨探望在困境裡的人，陪他說出自己的鍊子，再一同讀 3:14–19，讓他知道有人為他跪下。"},{"id":"ISS03_2","t":"3:5「啟示他的聖使徒和先知」——使徒與先知的職分是一次性的嗎？","r":"3:3--6；2:20；4:11","ch":[3],"why":"3:5 說奧祕「如今藉著聖靈啟示他的聖使徒和先知」，2:20 說教會「被建造在使徒和先知的根基上」。今天有人自稱使徒、先知，宣稱有新的啟示，要求別人順服；也有人因此認為一切先知性的事奉都已停止。這一題直接關係到華人教會的屬靈權柄與受傷的人，必須講清楚。","pos":[["【一】經文問的是甚麼","","<p>保羅說這奧祕「在以前的世代沒有叫人知道，像如今藉著聖靈啟示他的聖使徒和先知一樣」（3:5）。這裡的使徒和先知與 2:20 的「根基」是同一組人，領受的是外邦人同為後嗣、同為一體的奧祕。問題是：這樣的使徒和先知，今天還有嗎？他們的職分是一次性的，還是延續到今天？</p>"],["止息論（根基職分已經完成）","","<p>根基只打一次。新約的使徒必須見過復活的主、被他直接差遣（徒 1:21–22；林前 9:1），他們和新約的先知一同領受了奧祕，寫成聖經；聖經完成以後，這兩個職分就停止了。這一派保護了聖經的獨特權威，防止有人另立新啟示。</p><p><strong>難處：</strong>新約也記了不屬十二使徒的先知（徒 13:1），林前 14 章鼓勵眾人追求作先知講道，目的是「造就、安慰、勸勉人」（林前 14:3）；一概說先知性的功能都已停止，經文的根據不夠直接。</p>"],["溫和延續論（根基不再有，功能仍需要）","","<p>3:5 與 2:20 的使徒、先知是根基性的，不再重複；但使徒性的功能（開拓、差傳、植堂）與先知性的功能（造就、安慰、勸勉）今天仍然需要，4:11 也把它們列在基督賜給教會的恩賜裡。這些功能要被聖經與群體察驗。</p><p><strong>難處：</strong>「功能」與「職分」的界線不容易劃清，實際操作上容易滑向頭銜；需要清楚的群體察驗與問責，否則名稱一換，權柄的問題又回來了。</p>"],["新使徒改革運動（今天有掌權的使徒與先知）","","<p>認為神在這個時代恢復了使徒與先知的職分，他們有權柄帶領教會、發布新的啟示與策略，信徒要歸在某一位使徒的遮蓋之下。這一派常引 4:11 說五重職份必須全部恢復。</p><p><strong>難處：</strong>3:5 與 2:20 明說使徒和先知是根基，而這個運動把根基當成可以一再重蓋的樓層；宣稱高過聖經的新啟示、以頭銜要求順服與奉獻，正是許多屬靈傷害的來源。</p>"],["【三】本講義站在哪裡","","<p><strong>本講義站在溫和延續論，並明確分辨新使徒改革運動</strong>：新約使徒的根基職分不再有（2:20；3:5），使徒性與先知性的功能今天仍需要，但作這些事的人不需要、也不應該以使徒、先知為頭銜，更不可據此要求絕對順服，或宣稱高過聖經的新啟示。</p><p>請留意 3:5 的重點：奧祕是啟示給「他的聖使徒和先知」——複數的一群，而且是要被公開讀出來的（3:4）。真正從神來的啟示，把人帶回聖經與群體，不把人帶到某一個人腳前。</p>"],["【四】這件事該不該影響你的信心","","<p>不該。各派都同意：基督已經藉著使徒和先知立好了根基，聖經是我們的準則；基督也繼續把恩賜賜給教會，為要成全每一個聖徒。</p><p>你不必猜誰是真使徒，只要問：這個人把我帶到基督和聖經面前，還是帶到他自己面前？</p>"]],"con":[],"say":"本講義的立場：使徒和先知的根基職分不再有，使徒性與先知性的功能仍需要，但不以頭銜要求順服、不發布高過聖經的新啟示。本講義的全卷立場見 ISS00_5；屬靈權柄回指哥林多後書立場三。","care":"會眾席上可能有人曾被「先知性的話」決定了婚姻、工作或搬家，後來受了傷；也可能有人仍在某位「使徒」的遮蓋下不敢離開。不要在講台上點名嘲笑其他教會，也不要說「你當初就是太笨才會信」。牧者要會後單獨陪伴，先聽他說完，肯定他尋求神的心，再陪他回到聖經與一個健康的群體裡察驗。"},{"id":"ISS03_3","t":"3:8「比眾聖徒中最小的還小」——保羅的謙卑是真謙卑還是修辭？","r":"3:8；林前 15:9；提前 1:15","ch":[3],"why":"保羅一面說自己「比眾聖徒中最小的還小」，一面又說自己深知基督的奧祕、被託付傳給外邦人。有人覺得這是講道者常用的謙卑修辭，甚至是一種更高明的權威宣稱；也有人拿它要求信徒貶低自己。這一題關係到 321 的「謙卑」怎樣讀，也關係到領袖的權柄怎樣被檢驗。","pos":[["【一】經文問的是甚麼","","<p>「我本來比眾聖徒中最小的還小，然而他還賜我這恩典」（3:8）。「比最小的還小」原文是一個字：<strong>ἐλαχιστοτέρῳ</strong>（elachistoterō），在最高級「最小」後面再加上比較級，文法上本來不成立。問題是：這是保羅真實的自我認識，還是一種修辭技巧？</p>"],["修辭說（一種說服的策略）","","<p>古代演說家常用自我貶抑博取聽眾好感，保羅受過良好的教育，懂得這種手法；而且他說自己最小的同時，正在宣告自己領受了萬世隱藏的奧祕，這反而加強了他的權威。有些學者因此把 3:8 讀成誇張的修辭，不必按字面理解。</p><p><strong>難處：</strong>保羅的自我描述一封比一封低：「我原是使徒中最小的」（林前 15:9）、比眾聖徒中最小的還小（3:8）、「在罪人中我是個罪魁」（提前 1:15）。修辭不會越寫越低；而且他每一次都連著說出原因——他從前逼迫神的教會。</p>"],["真謙卑說（從恩典出來的自我認識）","","<p>保羅的小，不是技巧，是他一生記得自己從前是逼迫教會的人，如今卻蒙了恩。他越往基督測不透的豐富裡走，就越看見自己的小；自造一個字，是因為現成的字不夠用。他的權威不在自己，在於神「還賜我這恩典」。</p><p><strong>難處：</strong>若只講保羅的小，容易變成貶低自己的屬靈功課，好像越討厭自己越謙卑；也容易忽略保羅同一節裡對自己的託付非常清楚，並沒有因為小就推辭。</p>"],["【三】本講義站在哪裡","","<p><strong>本講義採真謙卑說，並吸收修辭說的提醒</strong>：保羅會用修辭，但 3:8 的根是真實的——一個記得自己從前、看見基督豐富的人，自然把自己放在最低處。謙卑不是貶低自己，是不再需要自己很大。</p><p>修辭說的提醒也很重要：謙卑的話可以被拿來作面具。檢驗不在於說得多低，而在於行得多低——保羅稱自己是管家、是執事，他手上的鑰匙不是他的，他也一直接受眾人的察驗。</p>"],["【四】這件事該不該影響你的信心","","<p>不該。不論學者怎樣分析保羅的修辭，這一節最後指向的不是保羅，是「基督那測不透的豐富」（3:8）。保羅越小，基督越大。</p><p>真正該讓我們停下來的，是一個問題：服事越久、懂得越多的我，是越來越小，還是越來越大？</p>"]],"con":[],"say":"本講義的立場：3:8 是從恩典出來的真謙卑，不是自我貶低，也不是可以拿來作面具的修辭；檢驗謙卑，看的是行得多低，不是說得多低。這類爭議與信心的關係，全卷立場見 ISS00_9；屬靈權柄回指哥林多後書立場三。","care":"會眾席上有兩種人會因這一題受傷：一種是本來就自我價值很低、常常責怪自己的人，聽到「要更小」就更覺得自己沒有價值；另一種是曾被一位口說謙卑、實際操控的領袖傷害的人。不要對前者說「你還不夠謙卑」，也不要叫後者「不要論斷屬靈領袖」。牧者要讓前者聽見「然而他還賜我這恩典」，陪後者分辨甚麼是真謙卑，必要時協助尋求專業協助。"},{"id":"ISS03_4","t":"3:10「藉著教會使天上執政的、掌權的……得知神百般的智慧」——天使也從教會學習嗎？","r":"3:9--11；1:21；6:12","ch":[3],"why":"3:10 說神的智慧要「藉著教會」叫天上執政的、掌權的得知。這些是誰？善的天使還是邪惡的勢力？教會要對它們做甚麼？有人據此發展出地域邪靈、對空宣告的爭戰戰術，也有人把它們只當成比喻。這一題牽涉全卷屬靈爭戰的立場，也決定教會怎樣理解自己存在的意義。","pos":[["【一】經文問的是甚麼","","<p>「為要藉著教會使天上執政的、掌權的，現在得知神百般的智慧」（3:10）。「執政的、掌權的」在本卷出現在 1:21（基督遠超過他們）與 6:12（我們與他們爭戰）。問題是：3:10 的執政掌權者是誰？他們真的從教會「學到」甚麼嗎？教會要怎樣面對他們？</p>"],["善天使說（天使觀看並學習）","","<p>天使雖然在神面前，卻不是全知的；彼得說先知所傳的事，「天使也願意詳細察看這些事」（彼前 1:12），保羅也說使徒「成了一臺戲，給世人和天使觀看」（林前 4:9）。神救贖一群不同的人成為一體，是天使從前沒有看過的智慧，所以他們從教會身上看見、讚美。</p><p><strong>難處：</strong>本卷其他地方的執政掌權者明顯帶敵意（6:12），3:10 若只指善天使，就和全卷的用法不太一致。</p>"],["敵對勢力說（教會的存在就是宣告）","","<p>3:10 的執政掌權者與 6:12 是同一群，是敵對神的靈界勢力。教會的合一本身，就是向它們宣告基督的得勝：它們用來分裂人類的牆，已經被拆毀了。它們「得知」，不是學了而讚美，是看見而失敗。</p><p><strong>難處：</strong>這一說容易被推成「教會要去對空宣告、點名捆綁」，把一節講合一的經文變成爭戰戰術；而且也可能忽略了善天使在聖經中觀看救恩的線索。</p>"],["結構說與策略性爭戰說","","<p>結構說認為執政掌權者也包括人間政治、經濟、文化結構中的邪惡勢力，教會以另一種群體生活向它們作見證；策略性層次屬靈爭戰則認為各地有地域邪靈，教會要辨認、點名、捆綁，城市才會得著福音。</p><p><strong>難處：</strong>結構說若只剩社會結構，就把 6:12「天空屬靈氣的惡魔」講成了比喻；地域邪靈戰術在新約沒有教導，3:10 說的是教會被看見，不是教會去喊話。</p>"],["【三】本講義站在哪裡","","<p><strong>本講義認為兩類都在視野裡，而本卷的語境使敵對勢力說更突出</strong>：執政掌權者主要是真實的靈界勢力，也會透過人間的結構運作；勝負已定（1:21–22），教會不是去表演爭戰，而是以合一的存在本身，讓天上看見神百般的智慧。不採地域邪靈、屬靈地圖、點名捆綁的戰術。</p><p>「百般的」原是多彩織錦的字：一群本來彼此隔絕的人，坐在同一張桌子邊稱同一位為父，就是那幅繡給全宇宙看的圖。</p>"],["【四】這件事該不該影響你的信心","","<p>不該。各派都同意：基督已經遠超過一切執政掌權者，教會在他裡面是安全的。</p><p>這一節反而給我們一份尊嚴：一個小小的家庭小組，有老有少，彼此饒恕、一同擘餅，可能正是天上最注目的一幕。果效是平安與合一，不是恐慌。</p>"]],"con":[],"say":"本講義的立場：天上的執政掌權者是真實的靈界勢力，勝負已定；教會不是去表演爭戰，而是以合一的存在本身彰顯神百般的智慧。本講義的全卷立場見 ISS00_4。","care":"會眾席上可能有人因為過去被教導「處處有邪靈」而活在恐懼裡，也可能有人有身心的困擾，被別人說成是鬼的問題。不要在講台上渲染靈界的恐怖，也不要輕易說誰被鬼附。牧者要讓會眾聽見勝負已定，遇到情緒或精神的困擾，先陪他尋求醫療與專業協助，同時為他禱告，兩者不衝突。"},{"id":"ISS03_5","t":"3:13「我為你們所受的患難……原是你們的榮耀」——受苦怎麼會是榮耀？","r":"3:13；3:1；林後 4:17","ch":[3],"why":"保羅說他為外邦人所受的患難是他們的榮耀，叫他們不要喪膽。這句話很容易被讀成「苦難本身是好的」，甚至被拿來叫受暴的人、被霸凌的人忍耐；也有人因此覺得基督徒應該追求受苦。這一題必須分清楚為福音受苦和被人傷害，才能保護會眾席上正在受苦的人。","pos":[["【一】經文問的是甚麼","","<p>「所以，我求你們不要因我為你們所受的患難喪膽，這原是你們的榮耀」（3:13）。「這」原文是陰性關係代名詞，被「榮耀」吸引，指保羅受苦這整件事。問題是：保羅的患難為甚麼是別人的榮耀？這能推到一切受苦都是榮耀嗎？</p>"],["代價說（保羅的苦證明他們的寶貴）","","<p>保羅被囚，是因為他堅持外邦人同為後嗣（〔背景〕徒 21:28–29 被誣告帶外邦人進聖殿）。他的鍊子正說明外邦人在神眼中有多寶貴——寶貴到值得一位使徒坐監。所以亞細亞的信徒不必因保羅坐監而懷疑福音，反倒要看見自己的尊貴。</p><p><strong>難處：</strong>這一說解釋了 3:13 的處境，卻不容易回答今天的人：我的苦不是為誰，只是生病、失業、被傷害，那也是榮耀嗎？</p>"],["與基督同受苦說（苦難通往榮耀）","","<p>新約一再說受苦與榮耀相連：「如果我們和他一同受苦，也必和他一同得榮耀」（羅 8:17），「這至暫至輕的苦楚，要為我們成就極重無比、永遠的榮耀」（林後 4:17）。信徒在基督裡的苦，不會白受，神會用它成就永遠的榮耀。</p><p><strong>難處：</strong>若不分辨，這一說容易變成「受苦本身就是屬靈」，甚至叫人主動追求受苦，或叫受害者留在危險裡「為主忍耐」——這正是經文從來沒有說過的。</p>"],["【三】本講義站在哪裡","","<p><strong>本講義綜合兩說，並劃一條清楚的線</strong>：苦本身不是好的；保羅的苦成為榮耀，是因為它有方向——「為你們」、為福音。信徒的一切苦，神都能在基督裡轉成益處與將來的榮耀；但這不等於苦是神要我們留在裡面的。</p><p>為福音受苦，和被人傷害，是兩件事。遇到家暴、霸凌、性騷擾、屬靈控制，第一件事是安全與求助，不是忍耐；保羅自己也曾上訴該撒、使用羅馬公民的權利保護自己。</p>"],["【四】這件事該不該影響你的信心","","<p>不該。基督徒的盼望從來不是沒有苦，而是苦不能把我們和基督的愛隔絕。保羅說完 3:13，下一節就跪下來為人禱告：喪膽的解藥是跪下，不是假裝不痛。</p><p>如果你正在受苦，你可以哭，可以求助，可以求神挪開；這些都不是信心不夠。</p>"]],"con":[],"say":"本講義的立場：苦本身不是好的；保羅的苦是為福音、為別人，所以成了榮耀；為福音受苦和被人傷害是兩件事，遇到傷害先求安全。處境與原則的全卷立場見 ISS00_1；饒恕與受害者回指哥林多後書立場四。","care":"會眾席上可能有正在受家暴、職場霸凌或屬靈控制的人，也有久病、失去孩子、長期無望的人。不追問細節，不要求原諒，不對正在流淚的人說「你要有信心」「這是榮耀」。牧者要會後單獨關心，先確認他的安全，陪他找到可信任的人，必要時協助尋求專業協助、醫療或庇護。"},{"id":"ISS03_6","t":"3:14「我在父面前屈膝」——禱告的姿勢重要嗎？","r":"3:14--15；路 22:41；可 11:25","ch":[3],"why":"猶太人平常站著禱告，保羅在這裡卻說「我在父面前屈膝」。有些教會傳統強調跪禱，有些強調舉手、俯伏，也有人覺得姿勢完全不重要。對年長、身體不便或有傷的人來說，這一題也關係到他們會不會覺得自己的禱告不夠屬靈。","pos":[["【一】經文問的是甚麼","","<p>「因此，我在父面前屈膝」（3:14），原文 κάμπτω τὰ γόνατά μου（kamptō ta gonata mou），我彎下我的膝蓋。聖經裡的禱告姿勢很多：「你們站著禱告的時候」（可 11:25）、主耶穌「跪下禱告」（路 22:41）、又「俯伏在地」（太 26:39）、「舉起聖潔的手」（提前 2:8）。問題是：姿勢有沒有屬靈上的意義？有沒有一個正確的姿勢？</p>"],["姿勢有意義說（身體表達心）","","<p>人是身心合一的受造物，身體的姿勢會表達、也會塑造內心。跪下表示降服與懇切，但以理「一日三次，雙膝跪在他神面前」（但 6:10），保羅與以弗所長老分別時「就跪下同眾人禱告」（徒 20:36）。在特別的時刻刻意跪下，可以幫助人把自己放低。</p><p><strong>難處：</strong>若把姿勢變成標準，就容易變成外表的敬虔，叫不能跪的人被比下去；主耶穌也批評過在人面前表演的禱告。</p>"],["姿勢無關說（只看內心）","","<p>神看的是心，不是膝蓋；聖經沒有規定任何一個姿勢，站、坐、跪、俯伏都有。稅吏「遠遠地站著」捶胸禱告，卻比法利賽人更蒙悅納。強調姿勢，反而容易落入律法主義。</p><p><strong>難處：</strong>說姿勢完全不重要，會忽略經文刻意記下的細節；3:14 的屈膝和 3:8 的比最小的還小前後呼應，作者顯然要我們看見這個動作。</p>"],["【三】本講義站在哪裡","","<p><strong>本講義認為：姿勢不是規條，卻會說話</strong>。3:14 是保羅的姿勢，不是對眾人的命令；它把 3:8 心裡的低，用身體說了出來。身體方便的人，可以在某些時刻刻意跪下，作為在父面前放低自己的表達；不方便的人，坐著、躺著的禱告同樣被父聽見。</p><p>重點不在膝蓋的角度，在於跪在誰面前——「父」。保羅不是在君王面前下跪求情，是孩子在父面前放下自己。</p>"],["【四】這件事該不該影響你的信心","","<p>不該。不論你站著、坐著、跪著，或在病床上動也不能動，你的禱告都可以「放膽無懼，篤信不疑地來到神面前」（3:12）。門是基督開的，不是膝蓋開的。</p><p>若你方便，這一週試著跪下一次；若不方便，就在心裡把自己放低。父看的是那顆心。</p>"]],"con":[],"say":"本講義的立場：禱告的姿勢不是規條，卻會表達心；3:14 是保羅的姿勢，不是對眾人的命令，跪下、站立、坐著的禱告都被父聽見。處境與原則的全卷立場見 ISS00_1。","care":"會眾席上有年長、坐輪椅、膝蓋受傷、或身體有障礙的人；也有曾在聚會裡被要求一同下跪、覺得被逼迫的人。不要在聚會裡要求所有人跪下，也不要說「不跪就是不夠謙卑」。牧者可以邀請「方便的人跪下，其他人就在座位上安靜」，讓每一個人都被接納在同一個禱告裡。"},{"id":"ISS03_7","t":"3:20「超過我們所求所想的」——可以拿來保證禱告一定蒙應允、保證成功嗎？","r":"3:20--21；3:16--19；林後 12:8--9","ch":[3],"why":"3:20 是最常被單獨抽出來印在卡片、貼在新車、掛在店面的經文之一，常被讀成神保證給我更大的房子、更高的收入、更順的人生。這種讀法吸引人，也會傷人：禱告沒有照樣成就的人，以為是自己信心不夠。這一題要把這節經文放回它的上下文。","pos":[["【一】經文問的是甚麼","","<p>「神能照著運行在我們心裡的大力充充足足地成就一切，超過我們所求所想的」（3:20）。「充充足足地」原文 ὑπερεκπερισσοῦ（hyperekperissou），疊了三層。問題是：這是神對每一個禱告的保證嗎？「一切」包括我想要的成功、健康、財富嗎？</p>"],["成功神學的讀法（信心保證豐盛）","","<p>神既然能成就超過我們所求所想的，信徒就應該大膽求、大膽想；求得不夠大，是信心不夠。這一派常把 3:20 與「你們奉我的名無論求甚麼，我必成就」（約 14:13）連在一起，認為物質的豐盛與身體的醫治是信心的必然結果。</p><p><strong>難處：</strong>寫這一句的人手上扣著鍊子；他「三次求過主，叫這刺離開我」（林後 12:8），主卻說「我的恩典夠你用的」。而且這節經文沒有說「照著我們的信心」，是說「照著運行在我們心裡的大力」。</p>"],["上下文的讀法（神成就的是那段禱告）","","<p>3:20 是 3:14–19 那段禱告的頌讚結語，「所求所想的」首先指保羅剛剛求的：裡面剛強、基督定居、和眾聖徒一同明白基督的愛、被神一切所充滿的充滿。神能成就的，遠超過我們敢為這些事所求所想的。</p><p><strong>難處：</strong>若讀得太窄，可能把 3:20 只限於屬靈的事，忽略神也確實關心我們生活裡具體的需要，「何況你們在天上的父，豈不更把好東西給求他的人嗎？」（太 7:11）</p>"],["【三】本講義站在哪裡","","<p><strong>本講義採上下文的讀法，並拒絕成功神學</strong>：3:20 首先是對 3:16–19 的保證；神也關心我們具體的需要，可以向他求，但他照他的智慧回應，不受我們的信心多寡操控。3:20 不是保證禱告一定照我的意思成就，也不是保證成功。</p><p>還要讀到 3:21：這一切的目的是「但願他在教會中，並在基督耶穌裡，得著榮耀」。超過所求所想的，不是讓我發光，是讓他在一群人身上被看見。</p>"],["【四】這件事該不該影響你的信心","","<p>不該，反而應該讓你更放心。若你的禱告多年沒有照你的意思成就，那不是信心不夠的證明；保羅的鍊子到寫信時也還在。神的大力「運行在我們心裡」，常常先成就在我們裡面。</p><p>你可以大膽求，也可以安心交託：他所成就的，往往不是我們想要的，卻是我們真正需要的。</p>"]],"con":[],"say":"本講義的立場：3:20 首先是對 3:16–19 那段禱告的保證，不是保證禱告照我的意思成就，也不是保證成功；神照他的智慧回應，為要在教會中得著榮耀。這類爭議與信心的關係，全卷立場見 ISS00_9。","care":"會眾席上可能有禱告多年病沒有好的人、生意失敗的人、為孩子求了很久沒有改變的父母，也可能有人曾被告知「你沒有得醫治是因為信心不夠」。不要對他們說「再多一點信心就好」，也不要在講台上用某個人的發財或得醫治作為 3:20 的證明。牧者要陪他們哀哭，並一同讀 3:16–19，讓他們知道神正在他們裡面作工。"},{"id":"ISS03_8","t":"3:15「天上地上的各家，都是從他得名」——是「各家」還是「全家」？","r":"3:15；3:14；2:19","ch":[3],"why":"cu89t 在 3:15 有註腳「或譯：全家」，原文 πᾶσα πατριὰ 可以有兩種讀法。這不只是翻譯問題：它關係到華人很看重的家族、姓氏、宗祠，在基督裡怎樣定位；也有人據此推出所有家族、所有宗教都來自同一位神。這一題值得說清楚。","pos":[["【一】經文問的是甚麼","","<p>「因此，我在父面前屈膝，天上地上的各家，都是從他得名」（3:14–15）。「父」πατέρα 與「家」πατριὰ 同字根，直譯是「每一個父系家族都是從這位父得名」。πᾶσα 沒有冠詞，通常譯「每一個」，也可以譯「全部」。問題是：這裡是天上地上許多個家，還是一個大家庭？</p>"],["「各家」說（每一個家族都源於這位父）","","<p>文法上 πᾶσα 加無冠詞的單數名詞，最自然的意思是「每一個」。天上有各類天使的群體，地上有各族各家，沒有一個家族不是從這位父那裡得到它的存在和名分。和合本正文採這一說。</p><p><strong>難處：</strong>若只講「各家」，可能被讀成家族之間的分隔都是神所設立的，好像第 2 章那一道已經拆毀的牆，又被「各家」重新築起來。</p>"],["「全家」說（天上地上只有一個家）","","<p>保羅剛剛講完外邦人「是神家裡的人了」（2:19），又講同為後嗣、同為一體；讀成「全家」，強調天上地上的神的子民是同一個家庭，都歸在同一位父的名下。cu89t 註腳保留了這一讀法。</p><p><strong>難處：</strong>文法上要把 πᾶσα 讀成「全部」，通常需要冠詞，這裡沒有；而且「天上地上」若包括天使，說他們和人是同一個家庭，也需要更多說明。</p>"],["【三】本講義站在哪裡","","<p><strong>本講義取「各家」，並吸收「全家」的神學方向</strong>：每一個家族都從這位父得名，所以沒有一個家族比另一個高，也沒有一個家族在他的名分之外；第 2 章與 4:6「一神，就是眾人的父」又告訴我們，這些家族在基督裡被聚成一家。兩種讀法都把家的源頭放在父身上。</p><p>但這不是說所有宗教、所有祖先崇拜都通往同一位神：3:15 說的是創造與命名的主權，得救仍是「在基督耶穌裡，藉著福音」（3:6）。</p>"],["【四】這件事該不該影響你的信心","","<p>不該。兩種譯法都是忠於原文的選擇，和合本把兩者都保留下來，正是尊重讀者。</p><p>這一節給華人信徒一份安慰：信主不是背棄家族，而是把整個家族帶回到那位真正命名的父面前。孝敬父母、記念祖先的恩情，可以在基督裡做得更好；只是敬拜，只歸給那一位父。</p>"]],"con":[],"say":"本講義的立場：3:15 取「各家」，每一個家族都從這位父得名，在基督裡被聚成一家；這是創造與命名的主權，不是說一切宗教都通往神。處境與原則的全卷立場見 ISS00_1。","care":"會眾席上可能有因為信主而被家族排斥的人，有在祭祖、宗祠事上和家人起衝突的人，也有在家族裡被看輕的女兒、媳婦。不要在講台上嘲笑傳統習俗，也不要說「信了主就不必管家人」。牧者要陪他們溫柔而堅定地分辨，幫助他們在不拜的同時，用更多的孝敬和愛讓家人看見那位父。"},{"id":"ISS03_9","t":"3:19「便叫神一切所充滿的，充滿了你們」——人可以成為完全、甚至成為神嗎？","r":"3:19；4:13；西 2:9--10","ch":[3],"why":"3:19 是保羅禱告的頂點，說要被「神一切所充滿的」充滿。有人據此教導信徒今生可以達到不再犯罪的完全，也有人推到「人可以成為神」；另一面，也有人把這句話當成永遠到不了的口號。讀錯了，前者叫人驕傲，後者叫人絕望，這一題值得分辨。","pos":[["【一】經文問的是甚麼","","<p>「並知道這愛是過於人所能測度的，便叫神一切所充滿的，充滿了你們」（3:19）。原文 ἵνα πληρωθῆτε εἰς πᾶν τὸ πλήρωμα τοῦ θεοῦ（hina plērōthēte eis pan to plērōma tou theou），動詞是被動的，介系詞 εἰς 可以讀成「達到」，「你們」是複數。問題是：被神的豐滿充滿，是甚麼意思？今生可以達到嗎？</p>"],["完全主義的讀法（今生可以達到完全）","","<p>有些聖潔運動的傳統認為，3:19 描述信徒可以經歷的「第二次祝福」：被神充滿以後，心裡不再有故意的罪，愛成為完全。這一派認真看待神改變人的大能，不願把經文的應許打折扣。</p><p><strong>難處：</strong>同一卷書第 4 章還在勸信徒脫去舊人、不要叫聖靈擔憂；保羅自己說「這不是說我已經得著了，已經完全了」（腓 3:12），約翰也說「我們若說自己無罪，便是自欺」（約壹 1:8）。</p>"],["成神論的讀法（人被提升為神）","","<p>東方教會有「神化」的傳統，引「就得與神的性情有分」（彼後 1:4），說信徒在恩典中越來越有分於神的生命；某些現代運動更推到「人可以成為小神」，擁有神的能力與權柄。</p><p><strong>難處：</strong>東方傳統的神化，本意是有分於神的生命而不是變成神的本質，但若推到人成為神，就取消了造物主與受造物的分別；3:19 的被動語態清楚表示，人是被充滿的器皿，不是源頭。</p>"],["漸進成長的讀法（群體一同被充滿，直到完全）","","<p>3:19 的「你們」是複數，和 3:18「和眾聖徒一同」相連，又和 4:13「滿有基督長成的身量」呼應；被神充滿是教會一同長大的方向，今生不斷經歷，到主再來時才完全。「神本性一切的豐盛都有形有體地居住在基督裡面，你們在他裡面也得了豐盛」（西 2:9–10）。</p><p><strong>難處：</strong>若只講「將來才完全」，容易讓這句禱告變得遙遠，好像今天不必期待任何改變。</p>"],["【三】本講義站在哪裡","","<p><strong>本講義採漸進成長的讀法</strong>：被神充滿是今天就開始、和眾聖徒一同經歷、到主再來才完全的生命方向；人始終是受造的器皿，充滿的是神自己的豐盛。今生會真實改變，但不會到不再需要恩典的地步。</p><p>被動語態也是一個邀請：人不能自己灌滿自己，只能把空間讓出來。心被自己塞滿，就沒有地方給神。</p>"],["【四】這件事該不該影響你的信心","","<p>不該。各派都同意：神要在我們裡面作工，叫我們越來越像基督；分別只在於今生能走到哪裡。</p><p>如果你覺得自己離「被神充滿」很遠，請記得這是保羅為你的禱告，不是對你的要求；而下一節說，神能照著運行在我們心裡的大力，成就超過我們所求所想的。</p>"]],"con":[],"say":"本講義的立場：3:19 是群體一同被神充滿、今生不斷經歷、主再來時才完全的生命方向；人是被充滿的器皿，不會成為神，也不會不再需要恩典。這類爭議與信心的關係，全卷立場見 ISS00_9。","care":"會眾席上可能有長期與某一種罪或軟弱掙扎、覺得自己永遠不夠屬靈的人，也可能有曾被要求「必須經歷某種充滿才算完全」而受傷的人。不要說「你如果真的被充滿，就不會這樣」，也不要用某一種經歷作為被充滿的唯一標記。牧者要讓他聽見這是一個為他的禱告，陪他在群體中一步一步長大。"},{"id":"ISS04_1","t":"4:3「竭力保守聖靈所賜合而為一的心」——合一要犧牲真理嗎？","r":"4:1--6；4:13--15；約17:21；猶1:3","ch":[4],"why":"華人教會的招牌很多：宗派、語言、世代、靈恩與非靈恩。有人說「只要愛主，教義不重要，別再分了」；也有人說「為了真理，寧可分開」，一點小事就另立門戶。4:3 正好夾在這兩種聲音中間。這一題關乎教會怎樣在差異裡保守合一，又不用合一掩蓋錯誤與傷害。","pos":[["【一】經文問的是甚麼","","<p>「用和平彼此聯絡，竭力保守聖靈所賜合而為一的心。」（4:3）<strong>σπουδάζοντες τηρεῖν τὴν ἑνότητα τοῦ πνεύματος</strong>（spoudazontes tērein tēn henotēta tou pneumatos）是「竭力保守聖靈的合一」：合一是聖靈已經賜下的，要人保守，不是人造出來的。緊接著是七個「一」（4:4–6），再往下是「在真道上同歸於一」（4:13）與「用愛心說誠實話」（4:15）。問題是：保守合一，要不要在真理上讓步？哪些事可以讓、哪些不能讓？</p>"],["合一優先說（愛與合一高過教義差異）","","<p>認為主耶穌禱告「使他們都合而為一」（約 17:21），教會的分裂是世人不信的絆腳石；教義的差異多半是人的理解，不應該讓它拆散神的家。所以要多強調共同的信仰經驗與愛，少談爭議。</p><p><strong>難處：</strong>4:3 的合一不是空的，它的內容就是 4:4–6 的七個「一」；同一章又說要「在真道上同歸於一」，不再「被一切異教之風搖動」。若真理一概不談，合一就只剩下情緒，也讓錯誤教導與屬靈操控得以藏身。</p>"],["真理優先說（為了純正，寧可分開）","","<p>認為真理是合一的唯一基礎，沒有真理的合一是妥協；所以凡在教義上有偏差，就應當分別出來。他們引用「要為從前一次交付聖徒的真道竭力地爭辯」（猶 1:3），也提醒保羅在加拉太書寸步不讓。</p><p><strong>難處：</strong>這個說法守住了真理，卻常常把每一項次要的看法都升格成真理的底線，於是洗禮方式、詩歌風格、末世時間表都可以成為分裂的理由。4:2 把「謙虛、溫柔、忍耐，用愛心互相寬容」放在合一之前——許多分裂不是為了真理，是為了面子。</p>"],["核心與邊緣說（核心不讓，邊緣容讓）","","<p>認為 4:4–6 本身就畫出了合一的核心：一個身體、一位聖靈、一個指望、一主、一信、一洗、一神。在這些核心上不讓步；在核心以外的事——教會治理、洗禮方式、恩賜的運用、末世細節——彼此接納，「但不要辯論所疑惑的事」（羅 14:1），可以有不同的宗派，卻承認彼此是一個身體。</p><p><strong>難處：</strong>核心與邊緣的界線在哪裡，各家劃得不一樣；有些人認為的邊緣，另一些人認為攸關福音。這需要謙卑與長時間的對話，不是一張清單可以解決。</p>"],["【三】本講義站在哪裡","","<p><strong>本講義採核心與邊緣說。</strong>合一不必犧牲真理，因為合一本身建立在真理上：七個「一」就是它的內容。4:3 要我們保守的，是聖靈已經賜下的合一，不是人造的一致。</p><p>同時，保守合一不等於對錯誤沉默，也不等於對傷害沉默。「用愛心說誠實話」（4:15）就是合一的方式：核心不讓，邊緣容讓，說真話時帶著愛。華人城市裡的國語堂、粵語堂、英語堂，可以有不同的招牌，卻不可以活得像幾個身體。</p>"],["【四】這件事該不該影響你的信心","","<p>不該。教會的分裂常常讓人灰心：「基督徒自己都吵成這樣，信仰還是真的嗎？」可是 4:3 說合一是聖靈「所賜」的——它早就存在，不是靠我們吵贏才成立。你今天能做的，不是解決所有宗派的問題，而是在你的小組、你的家裡，保守那一份已經賜下的合一。</p>"]],"con":[],"say":"本講義的立場：合一不必犧牲真理，因為合一的內容就是 4:4–6 的七個「一」；核心不讓，邊緣容讓，用愛心說誠實話。保守合一不等於對錯誤或傷害沉默。本講義的全卷立場見 ISS00_9。","care":"會眾席上可能有人經歷過教會分裂，親眼看見同工反目、家人分散到兩間教會，聽到「合一」兩個字就心痛；也可能有人曾經指出教會裡的問題，卻被說成「破壞合一」。講台上不要把提出問題的人和製造分裂的人混為一談。會後陪伴時，先聽他的失落，不急著叫他回到原來的群體；承認傷害是真的，再陪他一起看 4:3 所說那份聖靈所賜的合一。"},{"id":"ISS04_2","t":"4:5「一洗」——浸禮與點水禮、嬰兒洗禮，哪一種才算數？","r":"4:4--6；羅6:4；西2:12；林前12:13；徒16:33","ch":[4],"why":"許多華人信徒換教會時第一個被問到的就是：「你是浸的還是點的？要不要再受一次？」家裡有孩子的，也會問該不該給嬰孩施洗。保羅說「一洗」，教會卻在洗禮上分成好幾邊。這一題關乎「一洗」到底是在合一的核心，還是成了分裂的理由。","pos":[["【一】經文問的是甚麼","","<p>「一主，一信，一洗」（4:5）。<strong>ἓν βάπτισμα</strong>（hen baptisma）夾在七個「一」中間，與一主、一信並列。保羅在這裡沒有談洗禮的方式或年齡，他說的是洗禮把人歸入同一位主、同一個身體。問題是：「一洗」指的是甚麼？浸禮、點水禮、嬰兒洗禮，都在這「一洗」裡面嗎？已經受過洗的人，換了教會要不要再受？</p>"],["信徒浸禮說（浸信會與許多獨立教會）","","<p>認為洗禮是信的人對信仰的公開表明，新約的模式是先信後洗（徒 2:38）；βαπτίζω 原意是浸入，而「我們藉著洗禮歸入死，和他一同埋葬」（羅 6:4）的圖畫，以全身入水最清楚。所以嬰孩不施洗，點水不算完整的洗禮。</p><p><strong>難處：</strong>這個說法清楚有力，但若因此要求所有點水或嬰兒時受洗的信徒「重洗」，容易讓「一洗」反而成了分裂的界線；而新約也記載全家受洗的例子（徒 16:33），雖然沒有明說有無嬰孩，卻提醒我們不可把話說得太滿。</p>"],["嬰兒洗禮說（長老會、聖公會、信義宗、循道衛理宗等）","","<p>認為洗禮是神恩約的記號，如同舊約的割禮施行在信徒的孩子身上；新約的全家受洗（徒 16:33）延續了這個恩約的家庭觀。洗禮的重點是神的應許，不是人的表白；方式可以是點水、澆水或浸水，重在奉三一神的名（太 28:19）。</p><p><strong>難處：</strong>新約沒有一處明說為嬰孩施洗，這個說法主要從恩約神學推論；若講得不好，也可能讓受過嬰兒洗禮卻從未個人信主的人，以為自己已經「在裡面」了。</p>"],["一洗的核心說（洗禮歸入同一位主，方式各家容讓）","","<p>著重 4:5 的上下文：保羅列的是合一的根基，「一洗」與「一主」「一信」連在一起，指的是歸入基督的那一次洗禮，「都從一位聖靈受洗，成了一個身體」（林前 12:13）。所以不同傳統的洗禮方式與年齡可以有不同的實踐與教導，卻承認彼此奉三一神之名所受的洗。</p><p><strong>難處：</strong>這個說法照顧了合一，卻沒有替各教會解決實際的牧養問題：一位受過嬰兒洗禮的人要加入浸信會，或一對夫妻對孩子的洗禮意見不同，仍需要具體的判斷。</p>"],["【三】本講義站在哪裡","","<p><strong>本講義採一洗的核心說。</strong>4:5 的「一洗」是合一的根基，不是分裂的理由：它指的是歸入同一位主、同一個身體的洗禮。浸禮與點水、信徒洗禮與嬰兒洗禮，是敬重聖經的福音派之間的真實分歧，各教會可以照自己的傳統教導與施行。</p><p>但講台的落點要一致：不嘲笑別的傳統；不讓洗禮方式成為接納弟兄姊妹的門檻；也提醒每一個受過洗的人，洗禮指向的是一個個人與基督聯合、與他一同活過來的生命。</p>"],["【四】這件事該不該影響你的信心","","<p>不該。你的得救不在於水的多少，而在於你歸入的是哪一位主。若你對自己的洗禮有疑問，可以找你的牧者坦白地談；但不必因為別人說「那個不算」，就懷疑神在你身上的工作。</p>"]],"con":[],"say":"本講義的立場：4:5 的「一洗」是歸入同一位主、同一個身體的洗禮，是合一的根基，不是分裂的理由；浸禮與點水、信徒洗禮與嬰兒洗禮各傳統並陳，不嘲笑、不設門檻。本講義的全卷立場見 ISS00_9。","care":"有人因為換教會被要求「重洗」，覺得自己過去的信仰被否定；也有人在嬰兒時受洗，長大後才真正信主，不知道該怎麼看自己的洗禮；還有夫妻為了孩子要不要受洗而爭執。講台上不要拿別的傳統開玩笑。會後陪伴時，先聽他真正擔心的是甚麼——常常不是水，而是「我算不算數」；陪他回到 4:5 的「一主」。"},{"id":"ISS04_3","t":"4:8--10「先降在地下」——基督下到陰間了嗎？","r":"4:8--10；彼前3:19；腓2:7--9；徒2:27；羅10:7","ch":[4],"why":"使徒信經說基督「降在陰間」，許多教會每週背誦，卻很少人說得清楚那是甚麼意思；有人把 4:9 當成基督下到地獄受苦、或到陰間傳福音的根據。和合本的「先」字，原文抄本又有出入。這一題關乎怎樣讀一段難解的括號，而不讓它蓋過全段的重點。","pos":[["【一】經文問的是甚麼","","<p>「既說升上，豈不是先降在地下嗎？那降下的，就是遠升諸天之上要充滿萬有的。」（4:9–10）SBLGNT 作 <strong>κατέβη</strong>（katebē），沒有「先」（πρῶτον）；拜占庭傳統的抄本有，和合本與之相同。<strong>εἰς τὰ κατώτερα μέρη τῆς γῆς</strong>（eis ta katōtera merē tēs gēs），「地更低的部分」，可以有幾種讀法。問題是：「降在地下」指道成肉身、降到陰間，還是別的意思？</p>"],["道成肉身說（從天降到地上，包括死與埋葬）","","<p>把「地」讀作同位語：「更低的部分，也就是地」。全段的對比是「地」與「遠升諸天之上」，與腓立比書先降卑、後升高的路線一致——「反倒虛己，取了奴僕的形像」（腓 2:7）。主耶穌也說「除了從天降下、仍舊在天的人子，沒有人升過天」（約 3:13）。</p><p><strong>難處：</strong>這個讀法很自然，但「更低的部分」若只是「地」，似乎不必用比較級；有學者認為它暗示比地面更低的地方，至少包括墳墓。</p>"],["降在陰間說（死後降到死人之地）","","<p>把「地」讀作部分或比較屬格：「比地更低的地方」，指基督死後降到陰間。支持者引彼得的話「因你必不將我的靈魂撇在陰間」（徒 2:27），保羅也說「誰要下到陰間去呢？」（羅 10:7），以及彼前 3:19 的「傳道給那些在監獄裏的靈聽」。這是使徒信經「降在陰間」的主要經文背景之一。</p><p><strong>難處：</strong>彼前 3:19 本身就是新約最難解的經文之一，不宜拿來解釋另一段難解的經文；而「降在陰間」若被講成基督下地獄繼續受苦、或給死人第二次得救的機會，就超出了經文所說的。</p>"],["聖靈降臨說（升天之後帶著恩賜降下）","","<p>有學者認為「降下」發生在升天之後：升天的基督藉著聖靈在五旬節降下，把恩賜分給教會，正好接上 4:7–11 的恩賜主題；詩篇 68 篇的背景也與猶太人在五旬節紀念頒布律法有關。</p><p><strong>難處：</strong>和合本的「先」字（以及有 πρῶτον 的抄本）排除了這個讀法；即使沒有「先」字，4:10「那降下的，就是遠升諸天之上」的語氣也比較像先降後升。</p>"],["【三】本講義站在哪裡","","<p><strong>本講義取道成肉身說，不排除包括死與埋葬，也不在講台上展開陰間的細節。</strong>經文的重點不是地理，是方向：賜恩賜的那一位，先走過最低的路，才升到諸天之上要充滿萬有。原文很可能沒有「先」字，但保羅的邏輯本身已經含有先後，和合本並沒有扭曲意思。</p><p>使徒信經的「降在陰間」可以理解為基督真實地死了、進入死亡的境地；不可據此教導基督下地獄受苦，或死後還有第二次得救的機會。</p>"],["【四】這件事該不該影響你的信心","","<p>不該。這段括號的意思，各家看法不同，但沒有一家否認基督真實地降卑、真實地死、真實地復活升天。對你最要緊的是這一句：那位把恩賜交給你的主，先降到你最低的地方——你走過的低谷，他都走過。</p>"]],"con":[],"say":"本講義的立場：4:9 的「降在地下」取道成肉身說，包括基督真實的死與埋葬；重點是賜恩賜的那一位先降後升。陰間的細節不在講台展開，也不教導死後第二次得救的機會。","care":"會眾席上可能有人最近失去了未信主的親人，聽到「降在陰間」「傳道給監獄裡的靈」，會急著問：我的家人還有機會嗎？講台上不要隨口給出經文沒有給的保證，也不要冷冷地宣判。會後陪伴時，先陪他哀哭，不急著回答神學問題；可以和他一起把親人交在那位公義又慈愛的神手中。"},{"id":"ISS04_4","t":"4:11「使徒、先知」今天還有嗎？「牧師和教師」是一種還是兩種？","r":"4:11；2:20；3:5；林前14:3；林前14:29","ch":[4],"why":"有些教會的名片上印著「使徒」「先知」，有人在台上宣告「神膏立我作使徒，你們要在我的遮蓋底下」；也有教會說使徒先知早就停止了，連「先知性」三個字都不敢碰。321 的「235」用「五重職份」作團隊的名字，更需要講清楚這一節怎樣讀、怎樣用，免得禮物變成權柄。","pos":[["【一】經文問的是甚麼","","<p>「他所賜的，有使徒，有先知，有傳福音的，有牧師和教師，」（4:11）<strong>τοὺς δὲ ποιμένας καὶ διδασκάλους</strong>（tous de poimenas kai didaskalous）——前三個職分各有一個冠詞，最後兩個共用一個冠詞。保羅又說教會「被建造在使徒和先知的根基上」（2:20）。問題有兩個：使徒與先知今天還有嗎？「牧師和教師」是一種職分還是兩種？</p>"],["止息論（使徒與先知的職分已經停止）","","<p>認為使徒與先知是教會的「根基」（2:20），根基只打一次；新約的使徒見過復活的主、被他親自差遣，他們的地位不可重複。新約正典完成後，先知啟示的功能也已完成，今天的教會靠聖經被建造。「牧師和教師」共用冠詞，常被讀作同一群人的兩面：牧者就是教導的人（四重）。</p><p><strong>難處：</strong>這個說法守住了聖經的權威，但容易連使徒性的開拓差傳、先知性的造就勸勉也一併關掉，讓教會只剩下守成的牧養；而 4:13「直等到」似乎表示這些恩賜要一直運作到教會長大成熟。</p>"],["溫和延續論（功能仍在，根基職分不再有）","","<p>認為新約使徒的根基職分不再有，但「使徒性」的功能——被差去開拓、植堂、跨文化宣教——與「先知性」的功能——「要造就、安慰、勸勉人」（林前 14:3）——今天仍然需要，而且一切先知性的話都要被察驗：「其餘的就當慎思明辨」（林前 14:29）。牧師和教師多半讀作緊密相連、彼此重疊的恩賜。</p><p><strong>難處：</strong>「功能」與「職分」的界線在實際教會裡不容易劃清；一旦有人被稱為「有先知恩賜的人」，很快就可能變成不能質疑的權威，需要很清楚的察驗機制。</p>"],["新使徒改革運動（今天有掌權的使徒與先知）","","<p>認為神在這個時代恢復了使徒與先知的職分，由他們領導教會、發布新的啟示、為城市與國家作屬靈的「遮蓋」；教會要照五重職事的架構重建，使徒在最上面，其他職分在其下。這個運動在華人靈恩圈也有相當影響。</p><p><strong>難處：</strong>這正是本講義要明確分辨的讀法：它把 4:11 的禮物讀成了層級，把 4:12 的目的（成全聖徒）換成了服從領袖；以遮蓋要求絕對順服、以新啟示高過聖經，與 4:15「連於元首基督」直接衝突，也在不少地方造成屬靈操控的傷害。</p>"],["【三】本講義站在哪裡","","<p><strong>本講義的立場照全卷立場五：</strong>新約使徒的根基職分不再有（2:20）；使徒性的開拓差傳與先知性的造就勸勉今天仍然需要，但作這些事的人不以「使徒」「先知」為頭銜，不據此要求順服、奉獻或忠誠，也不發布高過聖經的新啟示。「牧師和教師」四重或五重並陳，講台的落點不在數目，在 4:12 的目的。</p><p>321「235」的「5」是五種功能——開拓的、說造就的話的、傳福音的、牧養的、教導的——彼此配搭的團隊，不是五張名片；團隊裡沒有誰是誰的遮蓋，元首只有基督。</p>"],["【四】這件事該不該影響你的信心","","<p>不該。各派都同意：基督把恩賜賜給教會，為要建立他的身體，每一個信徒都有份。你不必先弄清楚自己是不是「使徒」或「先知」才能服事；你只要問：基督量給我的這一份，我用來成全別人了嗎？</p>"]],"con":[],"say":"本講義的立場：新約使徒的根基職分不再有，使徒性與先知性的功能仍需要，但不以頭銜要求順服、不發布高過聖經的新啟示；「牧師和教師」四重五重並陳。本講義的全卷立場見 ISS00_5；屬靈權柄回指哥林多後書立場三。","care":"會眾席上可能有人曾在某個團體裡被「使徒」或「先知」控制，被要求奉獻、斷絕家人、照「先知性的話」結婚或辭職，離開以後對一切屬靈權柄都充滿戒心；也可能有人很愛先知性的事奉，聽到止息論會覺得被否定。講台上不點名任何團體或個人。會後陪伴時，先承認他受的傷是真的，不說「你自己也有責任」；陪他慢慢重新建立對基督這位元首的信任，必要時協助他尋求專業的輔導。"},{"id":"ISS04_5","t":"4:12「成全聖徒，各盡其職」——牧者的工作是做事工，還是裝備人做事工？","r":"4:12--16；徒20:28；彼前5:2；提後2:2","ch":[4],"why":"許多華人教會的實況是：牧師講道、探訪、輔導、開會、修水管，會眾坐在台下評分；牧者累垮了，會眾也沒有長大。4:12 的標點和讀法，直接決定了牧者與會眾的分工，也決定了 321「235」的五重職份團隊是在做事，還是在成全人。","pos":[["【一】經文問的是甚麼","","<p>「為要成全聖徒，各盡其職，建立基督的身體，」（4:12）原文三個介系詞片語：<strong>πρὸς τὸν καταρτισμὸν τῶν ἁγίων</strong>（pros ton katartismon tōn hagiōn）、<strong>εἰς ἔργον διακονίας</strong>（eis ergon diakonias）、<strong>εἰς οἰκοδομὴν τοῦ σώματος τοῦ Χριστοῦ</strong>（eis oikodomēn tou sōmatos tou Christou）。καταρτισμός 是補網、接骨的字。問題是：三個片語是並列的（都是職分的工作），還是一個接一個（職分成全聖徒，聖徒去做服事的工作）？</p>"],["並列說（三件事都是有職分之人的工作）","","<p>較早的英文譯本與一些註釋在三個片語之間加上逗號，讀作職分的三個目的：成全聖徒、做服事的工、建立身體——三件事都由 4:11 那些人來做。支持者指出，新約清楚要求長老「牧養神的教會」（徒 20:28），牧者的服事本身就是不可取代的工作。</p><p><strong>難處：</strong>三個介系詞並不相同（πρός 之後接兩個 εἰς），比較像一層接一層；而且這個讀法落到實際，常常變成牧者做完一切、會眾只負責出席，與 4:16「百節各按各職」的畫面不合。</p>"],["裝備說（職分成全聖徒，聖徒做服事的工作）","","<p>多數近代註釋讀作連續的層次：基督賜下職分，為要成全聖徒，使聖徒去做服事的工作，結果是建立基督的身體。做工的是聖徒；有職分的人像教練、像補網的人，不是替網去打魚。保羅自己也說，要把所聽見的「交託那忠心能教導別人的人」（提後 2:2）。</p><p><strong>難處：</strong>這個讀法講不好，會變成牧者只管理、分派、開會，不再親手牧養、講道、探訪；也可能讓會眾覺得「服事」只是教會裡的活動，忽略了在家庭與職場上的服事。</p>"],["身體說（重點不在分工，在全身一起長大）","","<p>著重 4:12–16 的整段：終點是「我們眾人」長大成人（4:13），方法是「百節各按各職，照著各體的功用彼此相助」（4:16）。有職分的人自己也是身體的關節，也要被別人供應；牧者與會眾不是兩個階層，而是同一個身體的不同功能，一起被元首基督建立。</p><p><strong>難處：</strong>這個讀法很美，卻比較不容易轉成具體的教會制度；若只講「大家都是關節」，不講牧者的裝備責任，也可能讓教會缺少有人負責教導和看顧。</p>"],["【三】本講義站在哪裡","","<p><strong>本講義採裝備說，並以身體說作為它的框架。</strong>職分的成績不看有職分的人做了多少，看聖徒被接好了多少；牧者的講道、教導、牧養正是裝備的主要方式，不是被取消，而是被放在正確的方向上。</p><p>321「235」的五重職份團隊，量它的尺在 4:16：有多少關節開始供應？有沒有人被裝備、被差出去？服事的範圍也不只教會的活動，而是聖徒在家裡、職場、城市裡的每一份工作。</p>"]],"con":[],"say":"本講義的立場：4:12 讀作職分成全聖徒、聖徒做服事的工作、一同建立基督的身體；牧者的講道與牧養是裝備的主要方式，不是被取消。五重職份團隊的檢驗是每一個關節都在供應。本講義的全卷立場見 ISS00_5。","care":"會眾席上可能有一位已經燒盡的牧者或同工，多年一個人扛下所有事，聽到「裝備」兩個字反而覺得自己失敗了；也可能有人很想服事，卻一直被說「你還不夠成熟」。講台上不要把牧者的疲憊講成「不懂得授權」的錯，也不要把會眾講成懶惰。會後陪伴時，先關心疲憊的人能不能休息，再陪他具體找出一件可以交出去的事、一個可以教的人。"},{"id":"ISS04_6","t":"4:22--24「舊人」「新人」——基督徒還有舊人嗎？","r":"4:20--24；羅6:6；西3:9--10；林後5:17","ch":[4],"why":"許多信徒的經驗是：信主以後，脾氣、慾望、舊習慣還在。於是有人懷疑自己「到底有沒有重生」，也有人說「那是我的舊人做的，不是我」。321 常說「舊人有己、新人無己」，這兩個詞就從這三節來，所以更需要講清楚：舊人是已經脫去了，還是要每天脫？","pos":[["【一】經文問的是甚麼","","<p>「就要脫去你們從前行為上的舊人……又要將你們的心志改換一新，並且穿上新人」（4:22–24）。<strong>ἀποθέσθαι</strong>（apothesthai）、<strong>ἀνανεοῦσθαι</strong>（ananeousthai）、<strong>ἐνδύσασθαι</strong>（endysasthai）三個不定詞，接在「領了他的教」（4:21）後面。歌羅西書說「你們已經脫去舊人」（西 3:9），羅馬書說「我們的舊人和他同釘十字架」（羅 6:6）。問題是：這三個不定詞是描述已經發生的事，還是命令我們去做？基督徒裡面還有舊人嗎？</p>"],["已經脫去說（信主時舊人已經死了）","","<p>認為三個不定詞是間接引述，說的是信徒所受的教導內容：你們已經脫去了舊人、穿上了新人。配合羅 6:6 的「同釘十字架」與西 3:9–10 的「已經脫去」「穿上了新人」，以及「若有人在基督裏，他就是新造的人，舊事已過，都變成新的了」（林後 5:17）。舊人不是信徒裡面的一部分，而是信主以前的那個身分，已經結束了。</p><p><strong>難處：</strong>這個讀法很能給人確據，但若只講「已經」，會讓還在掙扎的人困惑：既然已經死了，為甚麼它好像還活著？也可能讓人忽略經文要求的更新。</p>"],["每天脫去說（舊人仍在，要不斷對付）","","<p>認為和合本「就要脫去」把不定詞讀作命令是對的：舊人雖在十字架上被判了死，它的習慣與傾向仍在信徒身上，所以要每天脫去、每天穿上。許多靈修傳統都這樣講，也很貼近信徒的經驗。</p><p><strong>難處：</strong>講得太重，會把「舊人」講成信徒裡面另一個人格，讓人說「那是我的舊人做的」；也容易把成聖講成每天的自我處決，忘了新人是神「造」的，不是我們努力出來的。</p>"],["已然與未然說（已經脫去，所以要活出已經脫去的樣子）","","<p>認為兩者兼有：在基督裡，舊人已經脫去、新人已經穿上，這是身分的改變；所以要在每天的生活裡，把已經發生的事活出來。這正是保羅「先直說、後命令」的一貫模式——前三章說「你是誰」，從 4:1 起說「你要怎樣活」。心志的改換一新（現在式）是天天的事。</p><p><strong>難處：</strong>這個讀法需要同時講兩件事，講台上若只講一半，就會落回前兩種的偏差；而「已經」與「還要」之間的張力，在牧養上需要很多耐心。</p>"],["【三】本講義站在哪裡","","<p><strong>本講義採已然與未然說。</strong>舊人在基督裡已經脫去，新人是照著神的形像造的；所以信徒不是在兩個人格之間拔河，而是一個新造的人，天天學著把舊衣服放下，讓心志被更新。</p><p>321 說「舊人有己、新人無己」，用的就是這三節：先講神已經造了新人，再講每天的脫去與穿上。這兩個詞是每一個人對自己說的話，不是用來替別人貼標籤的尺。</p>"],["【四】這件事該不該影響你的信心","","<p>不該。舊習慣還在，不證明你沒有重生；它只表示你還在學著穿新衣。新人的身分不靠你今天表現得多好，靠的是神已經造成的事。今天脫下一件舊衣，就是在活出你已經是的那個人。</p>"]],"con":[],"say":"本講義的立場：在基督裡舊人已經脫去、新人已經穿上；所以要天天活出已經脫去的樣子，讓心志改換一新。不可說「那是我的舊人做的」推卸，也不可因掙扎懷疑自己的重生。","care":"會眾席上可能有人長年和某種習慣、成癮或脾氣掙扎，偷偷覺得自己是假基督徒；也可能有人常被別人說「你就是舊人」。講台上不要用「舊人」羞辱任何人。會後若有人說出他的掙扎，先謝謝他的誠實，不追問細節，陪他找一兩位可以同行的弟兄姊妹；若涉及成癮或身心狀況，鼓勵他同時尋求專業協助。"},{"id":"ISS04_7","t":"4:26「生氣卻不要犯罪」——基督徒可以生氣嗎？「不可含怒到日落」是不能隔夜嗎？","r":"4:26--27；4:31；可3:5；雅1:19--20","ch":[4],"why":"許多華人基督徒從小被教導「生氣就是不屬靈」，於是把怒氣吞下去，表面平靜，裡面發炎；也有人拿「義怒」替自己的脾氣背書。夫妻吵架時，有人硬撐到半夜也要談完，因為「不可含怒到日落」。這一題關乎情緒的健康，也關乎講台會不會把一節經文變成壓抑或暴躁的理由。","pos":[["【一】經文問的是甚麼","","<p>「生氣卻不要犯罪；不可含怒到日落，也不可給魔鬼留地步。」（4:26–27）<strong>ὀργίζεσθε καὶ μὴ ἁμαρτάνετε</strong>（orgizesthe kai mē hamartanete）逐字是詩篇第 4 篇的七十士譯本；<strong>παροργισμός</strong>（parorgismos）是被激起的惱怒；<strong>τόπος</strong>（topos）是一塊地方。問題是：「生氣」是命令、許可，還是條件？「日落」是字面的時限嗎？</p>"],["命令說（要對罪惡發義怒）","","<p>把 ὀργίζεσθε 讀作真正的命令：基督徒應當對不義、罪惡生氣，像主耶穌「怒目周圍看他們，憂愁他們的心剛硬」（可 3:5）。對罪惡無動於衷，不是成熟，是麻木——正是 4:19「良心喪盡」的人。</p><p><strong>難處：</strong>這個讀法提醒我們不可麻木，但經文的重心明顯在限制，而不是鼓勵；同一段又說要除掉「忿怒」（4:31），雅各也說「人的怒氣並不成就神的義」（雅 1:20）。講成命令，很容易被拿來替一切脾氣貼上「義怒」的標籤。</p>"],["許可或條件說（生氣可以，但不要讓它變成罪）","","<p>多數註釋讀作讓步或條件：「生氣可以，但不要犯罪」或「若生氣，不要讓它成為罪」。經文沒有命令人生氣，也沒有禁止生氣，它限定生氣：有期限（日落以前），有界線（不給魔鬼留地步），並且最後要除掉苦毒、惱恨、忿怒（4:31）。雅各的「慢慢地動怒」（雅 1:19）也是同一個方向。</p><p><strong>難處：</strong>這個讀法平衡，但若只停在「可以生氣」，可能讓人輕忽怒氣的危險；需要同時講出 4:27 與 4:31：怒氣過夜，就會讓出一塊地、長成苦毒。</p>"],["壓抑說（成熟的基督徒不應該生氣）","","<p>有些敬虔傳統認為，生氣幾乎都帶著罪，真正成熟、被聖靈充滿的人應該不再生氣；4:26 只是向軟弱的人讓步，理想是完全不動怒，凡事忍耐。</p><p><strong>難處：</strong>這與經文直接衝突：保羅引詩篇允許生氣，主耶穌自己也發怒。壓抑的怒氣不會消失，只會轉成冷淡、躲避、身體的症狀或某一天的爆發；對受過傷害的人，這種教導更會讓他以為連感到憤怒都是罪。</p>"],["【三】本講義站在哪裡","","<p><strong>本講義採許可或條件說。</strong>經文允許生氣，限定生氣：要處理，不要收藏。「日落」是一個畫面——怒氣不可累積、不可過夜發酵，要儘快帶到神面前、找人一起處理；它不是要求當晚一定談完、一定和好，更不是要受傷的人當天面對傷害他的人。</p><p>4:27 的「地步」是一塊地，不是被鬼附；沒有處理的怒氣，就是在心裡讓出一個房間（屬靈爭戰的全卷立場見 ISS00_4）。</p>"],["【四】這件事該不該影響你的信心","","<p>不該。你會生氣，不表示你不屬靈；神造人有情感，主耶穌也發過怒。要問的不是「我有沒有生氣」，而是「我怎樣處理我的怒氣」：今天就把它說給神聽，再找一位信得過的人陪你一起處理，這本身就是順服；聖靈會幫助你在日落以前，不讓它變成苦毒。</p>"]],"con":[],"say":"本講義的立場：4:26 允許生氣、限定生氣——不壓抑，也不以義怒為藉口；「日落」是要處理、不累積，不是當晚一定要和好。4:27 的地步不等於被鬼附，屬靈爭戰的全卷立場見 ISS00_4。","care":"會眾席上可能有人從小生活在一個常有人暴怒的家裡，對任何怒氣都害怕；也可能有人長期壓抑，身體已經出現症狀；還可能有人正為一件不公平的事憤怒，卻被教會說「你要放下」。講台上不要說「基督徒不可以生氣」。會後陪伴時，先允許他說出怒氣，不急著勸他饒恕；若怒氣與創傷或憂鬱有關，溫和地建議他也尋求專業協助。"},{"id":"ISS04_8","t":"4:30「不要叫神的聖靈擔憂」——聖靈有情感嗎？","r":"4:30；1:13--14；賽63:10；羅8:26--27","ch":[4],"why":"許多華人信徒心中的聖靈是一股能力、一種感覺、一陣風，很少想到他是一位會傷心的神。另一面，也有人用「聖靈擔憂」來恐嚇人：你再這樣，聖靈就要離開你了。這一題關乎我們怎樣認識三一神的第三位，也關乎得救的確據。","pos":[["【一】經文問的是甚麼","","<p>「不要叫神的聖靈擔憂；你們原是受了他的印記，等候得贖的日子來到。」（4:30）<strong>μὴ λυπεῖτε</strong>（mē lypeite）的 λυπέω 是使人憂傷，只能用在有位格的對象上。這使我們想起以賽亞書：「他們竟悖逆，使主的聖靈擔憂」（賽 63:10）。問題是：神會有情感嗎？聖靈擔憂是比喻，還是真實的？擔憂了會離開嗎？</p>"],["神不受苦說（古典的「神無情感」教義）","","<p>古典神學強調神是完全、不改變的，不會像人一樣被外在的事影響而起伏；所以經文說神「後悔」「擔憂」，是用人的語言描述神的作為（擬人法），意思是神對罪的回應如同人憂傷時那樣，而不是神內在真的受到攪擾。</p><p><strong>難處：</strong>這個說法守住了神的完全與不變，但若講得太冷，會讓會眾覺得經文裡神的愛、憂傷、喜悅都只是修辭，聖靈也變回一股非位格的力量，與 λυπέω 只用在有位格者身上的用法不太相合。</p>"],["位格情感說（聖靈真實地憂傷）","","<p>認為聖靈是有位格的神，他有心意——「鑒察人心的，曉得聖靈的意思」（羅 8:27），會「用說不出來的歎息替我們禱告」（羅 8:26），也真實地會擔憂。神的情感不像人的情緒那樣失控或被操縱，卻是真實的愛的回應。</p><p><strong>難處：</strong>這個說法很溫暖，但若講得太像人的情緒，會讓人以為神會因我們而情緒崩潰、需要我們安撫，或者神的愛會隨著我們的表現漲落。</p>"],["【三】本講義站在哪裡","","<p><strong>本講義採位格情感說，並保留古典神學的提醒。</strong>4:30 最直接的意思是：聖靈不是一股力量，是一位會傷心的朋友；他的擔憂不是失控的情緒，而是聖潔之愛對罪的真實回應。</p><p>同一節的後半句同樣重要：「你們原是受了他的印記」——印記已經蓋上（回到 1:13–14），聖靈擔憂，卻沒有離開。這一節的力量是被愛而不忍心，不是怕被拋棄。叫他擔憂的，在上下文裡就是謊言、含怒過夜、污穢的言語、苦毒與毀謗（4:25–31）。</p>"],["【四】這件事該不該影響你的信心","","<p>不該讓你恐慌。若你很怕自己已經讓聖靈離開了，這份怕本身，常常就是他還在你裡面動工的記號。他擔憂，是因為他愛你；回到他面前，不必先把自己洗乾淨；那一位蓋了印記的，會陪你一直走到得贖的日子。</p>"]],"con":[],"say":"本講義的立場：聖靈是有位格的神，4:30 的擔憂是聖潔之愛對罪的真實回應，不是失控的情緒；印記已經蓋上，他擔憂卻沒有離開。不用這一節恐嚇人失去聖靈。","care":"有些信徒天生敏感，聽到「叫聖靈擔憂」就整天擔心自己是不是又讓神傷心了，活在自責裡；也有人曾被說「你犯了這個罪，聖靈已經離開你」。講台上不要用這一節恐嚇人。會後陪伴時，先陪他讀這一節的後半句「受了他的印記」，讓他知道被愛是起點；若自責已影響睡眠與生活，溫和地建議他尋求協助。"},{"id":"ISS04_9","t":"4:32「彼此饒恕」——饒恕就要和好嗎？受害者也要饒恕加害者嗎？","r":"4:31--32；路17:3；羅12:18--19；太18:22","ch":[4],"why":"「你要饒恕」常常是教會對受傷的人說的第一句話，有時也是最傷人的一句：家暴的受害者被勸回家，被性侵的人被要求「放下」，被教會領袖傷害的人被說「你不饒恕就是你的問題」。4:32 是 920 的「2」，越是我們看重的經文，越需要讀清楚它說了甚麼、沒有說甚麼。","pos":[["【一】經文問的是甚麼","","<p>「並要以恩慈相待，存憐憫的心，彼此饒恕，正如神在基督裡饒恕了你們一樣。」（4:32）<strong>χαριζόμενοι</strong>（charizomenoi）與 χάρις 同字根：饒恕就是「施恩」，給對方他不配得的。前一節要除掉「一切苦毒、惱恨、忿怒」（4:31）。問題是：饒恕和和好是同一件事嗎？加害者沒有悔改，受害者也要饒恕嗎？饒恕是不是表示要回到原來的關係裡？</p>"],["無條件饒恕即和好說","","<p>認為神在基督裡無條件地饒恕了我們，所以我們也要無條件地饒恕，而且饒恕就要恢復關係；主耶穌說「不是到七次，乃是到七十個七次」（太 18:22），沒有附加條件。不肯和好，就表示還沒有真正饒恕。</p><p><strong>難處：</strong>這個說法把饒恕與和好綁在一起，在暴力與虐待的處境裡會造成第二次傷害；主耶穌自己也說「他若懊悔，就饒恕他」（路 17:3），和好的恢復需要對方真實的悔改。</p>"],["有條件饒恕說（對方悔改了才饒恕）","","<p>認為神的饒恕是對悔改之人的回應，所以人的饒恕也以對方的悔改為條件；加害者沒有認錯以前，受害者不必、也不應該饒恕，否則等於縱容惡行。</p><p><strong>難處：</strong>這個說法保護了受害者，卻可能讓受傷的人一輩子被綁在加害者是否悔改上——對方不認錯，我的心就一直不能放下；也與 4:31 要除掉苦毒、與羅 12:19「不要自己伸冤」的方向不完全相合。</p>"],["饒恕與和好區分說","","<p>認為饒恕與和好是兩件事。饒恕是放下報復的權利，把審判交給神——「不要自己伸冤，寧可讓步，聽憑主怒」（羅 12:19）；它可以單方面在神面前開始，也可能需要很長的時間。和好是關係的恢復，需要對方真實的悔改，也需要安全；「若是能行，總要盡力與眾人和睦」（羅 12:18），「若是能行」本身就承認有時不能。</p><p><strong>難處：</strong>這個說法在牧養上最安全，但也可能被誤用：有人把「我已經饒恕了」當作不再處理關係的理由，或用「界線」包裝苦毒；需要智慧分辨。</p>"],["【三】本講義站在哪裡","","<p><strong>本講義採饒恕與和好區分說。</strong>饒恕的力量來自後半句：「正如神在基督裡饒恕了你們一樣」——饒恕是被饒恕的人把恩典再遞出去，不是咬著牙擠出來的；它可以慢，可以從神面前開始。</p><p>和好需要悔改與安全。遇到暴力、虐待、性侵或屬靈操控，教會的第一件事是保護人的安全，不是勸人回去；不對受害者說「你要饒恕，所以今天就回家」。這與哥林多後書立場四一致。</p>"],["【四】這件事該不該影響你的信心","","<p>不該。如果你還饒恕不了，不表示你不是基督徒；饒恕常常是一段路，不是一個按鈕。你可以今天先對主說：「主啊，你在基督裡饒恕了我，我還做不到，求你教我。」這已經是饒恕的開始。</p>"]],"con":[],"say":"本講義的立場：饒恕是放下報復的權利、把審判交給神，可以先在神面前開始；和好需要對方真實的悔改與安全。不用 4:32 逼受害者和好，遇到暴力先保護安全。饒恕與受害者回指哥林多後書立場四。","care":"會眾席上可能有正在家暴、性侵、長期霸凌或屬靈操控的傷害裡的人，也可能有多年前受傷、至今一想起就發抖的人。講台上不追問細節、不要求原諒、不對正在流淚的人說「你要有信心」或「你要饒恕」；要清楚說出：先安全，再談饒恕。會後單獨關心，必要時協助他報警、尋求庇護與專業協助；陪他走饒恕的路，可以很長，不催促。"},{"id":"ISS05_1","t":"5:3--5「連提都不可」「有貪心的，就與拜偶像的一樣」——教會怎樣談性與金錢？","r":"5:3--5；西3:5；提前6:10；來13:4--5","ch":[5],"why":"華人教會對性常常是兩個極端：要嘛完全不談，讓年輕人從網路學；要嘛只談羞恥，讓跌倒的人不敢回來。對錢卻很寬容，貪婪被叫作理財、上進、為家人打拚，甚至被講台包裝成蒙福。保羅把淫亂與貪婪放在同一句話裡，又說「連提都不可」——這一題關乎教會到底能不能誠實地談這兩件事。","pos":[["【一】經文問的是甚麼","","<p>「至於淫亂並一切污穢，或是貪婪，在你們中間連提都不可，方合聖徒的體統。」（5:3）<strong>πλεονεξία</strong>（pleonexia）字面是「要得更多」；第 5 節說有貪心的 <strong>εἰδωλολάτρης</strong>（eidōlolatrēs），就是拜偶像的。「連提都不可」原文是「連名字都不要被叫出來」。問題是：這是叫教會對性與錢閉口不談，還是叫教會裡不要有這些事可以被人指名？貪婪為甚麼是拜偶像？</p>"],["沉默說（連提都不可＝不要談論）","","<p>把「連提都不可」讀成言談的禁令：講台、小組、家庭都不宜公開談性，免得挑起私慾、失了體統；教會只要教導聖潔的標準，細節留給個人與家庭處理。這個讀法保護了聚會的端莊，也顧到兒童與敏感的人。</p><p><strong>難處：</strong>保羅自己就在這裡提了，而且提得很具體；第 4 節說要換掉的是淫詞與戲笑的話，不是誠實的教導。教會一沉默，年輕人就從色情網站學性，跌倒的人也找不到一個可以說出來的地方，罪反而在暗中長大（5:12）。</p>"],["名聲說（教會裡不可有這樣的事被人指名）","","<p>許多註釋讀為：在你們中間，這些事連一點風聲都不該有，因為「方合聖徒的體統」——聖徒有聖徒的樣子。重點不在禁止談論，而在生活的標準：教會不要成為別人一提起來就聯想到淫亂與貪婪的群體。這與第 4 節「總要說感謝的話」相連：舌頭要從挑逗與嘲笑轉向感謝。</p><p><strong>難處：</strong>這個讀法若只顧教會的名聲，容易變成把醜聞壓下來、要受害者保持沉默；「不要有風聲」不可以變成「不要讓人知道」。第 11 節同時要求把暗昧的事揭露出來。</p>"],["偶像說（貪婪的根是敬拜，不只是道德）","
