autous），「向他們行同樣的事」：同樣從心裡、同樣如同對基督、同樣帶著善意。保羅沒有給主人另一套規則，他把 6:5--8 原封不動地反過來交給主人。</p><p>ἀνιέντες τὴν ἀπειλήν（anientes tēn apeilēn） 是現在分詞，ἀνίημι（aniēmi） 是「放鬆、放掉」。冠詞 τὴν（tēn） 指那個大家都知道的東西：主人手上慣用的恐嚇——鞭打、賣掉、拆散家庭。保羅要主人把它放下。</p><blockquote><p>εἰδότες ὅτι（eidotes hoti） 和 6:8 對主人用一模一樣的開頭。καὶ αὐτῶν καὶ ὑμῶν ὁ κύριός ἐστιν ἐν οὐρανοῖς（kai autōn kai hymōn ho kyrios estin en ouranois）：奴僕的主和主人的主，是同一位，在天上。地上的 κύριοι（kyrioi） 頭上，有一位 ὁ κύριός（ho kyrios）。καὶ προσωπολημψία οὐκ ἔστιν παρʼ αὐτῷ（kai prosōpolēmpsia ouk estin par' autō），「取臉」是看人的身分給待遇；在他那裡沒有這回事。</p></blockquote>","exp":"<p>「你們作主人的，待僕人也是一理，不要威嚇他們」（6:9）。在第一世紀，對主人說這句話是驚人的。羅馬法沒有規定主人要怎樣待奴隸，奴隸在法律上是財產。保羅卻說：你們要像奴僕對你們那樣，對待你們的奴僕。</p><p>理由只有一個：「他們和你們同有一位主在天上；他並不偏待人」（6:9）。主人以為自己站在金字塔頂端，保羅把他拉到同一排：你也是僕人，你的主人在天上，他看你的方式，和他看你家奴隸的方式一樣。歌羅西書說：「你們作主人的，要公公平平地待僕人，因為知道你們也有一位主在天上」（西 4:1）。</p><p>今天的雇主、主管、店長都在這一節裡。不威嚇、不羞辱、不拿飯碗當籌碼、不偏待有關係的人。<strong>6:1--9 每一組都是雙向的，而且對握有權柄的一方要求更重。</strong>講台要同時對兩方說話：不用 6:5 叫員工無條件服從，也不用 6:9 煽動員工與老闆對立。</p><p>家、職場、教會，是三個天天上演的前線。保羅接下來要講全副軍裝；但在講軍裝之前，他先講了廚房、書房與作坊。站立得住，先站在這些地方。</p><p>這一節也提醒今天在教會裡作「主人」的人：長執、主管、帶小組的人。頭上有主的人，不靠恐嚇帶人。</p>"},{"a":10,"z":11,"star":3,"grk":"<p lang=\"grc\">Τοῦ λοιποῦ ἐνδυναμοῦσθε ἐν κυρίῳ καὶ ἐν τῷ κράτει τῆς ἰσχύος αὐτοῦ.</p><p lang=\"grc\">ἐνδύσασθε τὴν πανοπλίαν τοῦ θεοῦ πρὸς τὸ δύνασθαι ὑμᾶς στῆναι πρὸς τὰς μεθοδείας τοῦ διαβόλου·</p>","lit":"<p>至於其餘的：你們要在主裡、並在他力量的權能中被加力。</p><p>你們要穿上神的全副軍裝，為要使你們能夠站立，抵擋魔鬼的種種詭計；</p>","key":"<table><tr><th>原文</th><th>音譯</th><th>字面</th><th>在這裡</th></tr><tr><td>Τοῦ λοιποῦ</td><td>Tou loipou</td><td>至於其餘的</td><td>全信最後一段的開頭</td></tr><tr><td>ἐνδυναμοῦσθε</td><td>endynamousthe</td><td>你們要被加力</td><td>現在式被動：力量從外面來</td></tr><tr><td>ἐν τῷ κράτει τῆς ἰσχύος αὐτοῦ</td><td>en tō kratei tēs ischyos autou</td><td>在他力量的權能中</td><td>1:19 叫基督復活的能力</td></tr><tr><td>ἐνδύσασθε</td><td>endysasthe</td><td>你們要穿上</td><td>4:24「穿上新人」同一動詞</td></tr><tr><td>τὴν πανοπλίαν τοῦ θεοῦ</td><td>tēn panoplian tou theou</td><td>神的全副軍裝</td><td>神所賜的，也是神自己的</td></tr><tr><td>στῆναι</td><td>stēnai</td><td>站立</td><td>四次站立的第一次</td></tr><tr><td>τὰς μεθοδείας τοῦ διαβόλου</td><td>tas methodeias tou diabolou</td><td>魔鬼的種種詭計</td><td>複數：一套一套的方法</td></tr></table>","gram":"<p><strong>Τοῦ λοιποῦ（Tou loipou） 宣告全信最後一段，第一個命令卻不是「去打」，是「被加力」。</strong></p><p>ἐνδυναμοῦσθε（endynamousthe） 是現在式被動命令：持續地被加上力量。被動，表示力量不是自己擠出來的；現在式，表示每天都要。ἐν κυρίῳ καὶ ἐν τῷ κράτει τῆς ἰσχύος αὐτοῦ（en kyriō kai en tō kratei tēs ischyos autou） 兩個 ἐν（en） 並列，第二個把 1:19 的字搬回來：保羅在那裡求神叫他們知道 τοῦ κράτους τῆς ἰσχύος αὐτοῦ（tou kratous tēs ischyos autou），也就是「他在基督身上所運行的大能大力」（1:20）。叫基督從死裡復活的同一股力量，是信徒站立的力量。</p><p>6:11 ἐνδύσασθε（endysasthe） 是不定過去式中間語態命令，與 4:24 的 ἐνδύσασθαι（endysasthai） 同一個動詞：那裡是「穿上新人」，這裡是穿上軍裝。τὴν πανοπλίαν τοῦ θεοῦ（tēn panoplian tou theou），πανοπλίαν（panoplian） 是重裝步兵的全套裝備；τοῦ θεοῦ（tou theou） 可以讀成神所賜的，也可以讀成神自己的。學者觀察到，以賽亞書裡穿上公義與拯救的是神自己：「他以公義為鎧甲，以拯救為頭盔」（賽 59:17）。保羅沒有明說引用，但這使我們想起：神把自己的軍裝借給了我們。</p><blockquote><p>πρὸς τὸ δύνασθαι ὑμᾶς στῆναι（pros to dynasthai hymas stēnai） 說出目的：能夠站立。不是佔領，是站住。πρὸς τὰς μεθοδείας τοῦ διαβόλου（pros tas methodeias tou diabolou） 的 μεθοδείας（methodeias） 是複數，「一套一套的方法」；4:14 用單數 μεθοδείαν（methodeian） 講「人的詭計」。τοῦ διαβόλου（tou diabolou） 在 4:27 出現過：μηδὲ δίδοτε τόπον τῷ διαβόλῳ（mēde didote topon tō diabolō）。魔鬼的詭計，常常從一塊留給它的地步開始。</p></blockquote>","exp":"<p>〔背景〕徒 19:11--20（使徒行傳講義第 19 章）</p><p>以弗所是一座法術之城。亞底米神廟就在城外，城裡流通著各種護身的符咒。使徒行傳講義第 19 章講過：有人想借用耶穌的名，說「我奉保羅所傳的耶穌敕令你們出來」（徒 19:13），結果被鬼反問「耶穌我認識，保羅我也知道。你們卻是誰呢？」（徒 19:15）後來「平素行邪術的，也有許多人把書拿來，堆積在眾人面前焚燒」（徒 19:19）。讀這封信的人，有些就是當年燒書的人。</p><p>所以當保羅說「我還有末了的話」（6:10），他知道這些人怕甚麼。他們從小就活在靈界的威脅底下，信主以後，不需要另一套更強的符咒，需要知道自己站在誰的力量裡。「你們要靠著主，倚賴他的大能大力作剛強的人」（6:10）——爭戰的第一步不是向魔鬼喊話，是轉身面向主。</p><p>這也是全卷的結構：先坐，才會行；會行，才站得住。神叫我們「一同坐在天上」（2:6），在第 4、5 章教我們行，到這裡才說站。站立的力量不是新的東西，是第 1 章那份叫基督復活的能力，到第 6 章才派上用場。</p><p><strong>紅線三的兩面，從這兩節就開始。</strong>一面，「魔鬼的詭計」（6:11）是真的，保羅不是在用比喻嚇人；另一面，爭戰的方式是「站」，是穿上神所賜的，不是學一套驅鬼的技術。保羅給的「全副軍裝」，下面一件一件列出來時，會發現沒有一件是儀式或口訣。</p><p>還要看見「全副」兩個字。魔鬼的詭計是一套一套的，信徒的裝備也是一整套；只穿一件，就留下一個缺口。有人很有真理卻沒有和平，有人很熱心禱告卻不肯說誠實話；保羅要的是一個整全的人，站在一位整全的主裡。</p>"},{"a":12,"z":13,"star":3,"grk":"<p lang=\"grc\">ὅτι οὐκ ἔστιν ἡμῖν ἡ πάλη πρὸς αἷμα καὶ σάρκα, ἀλλὰ πρὸς τὰς ἀρχάς, πρὸς τὰς ἐξουσίας, πρὸς τοὺς κοσμοκράτορας τοῦ σκότους τούτου, πρὸς τὰ πνευματικὰ τῆς πονηρίας ἐν τοῖς ἐπουρανίοις.</p><p lang=\"grc\">διὰ τοῦτο ἀναλάβετε τὴν πανοπλίαν τοῦ θεοῦ, ἵνα δυνηθῆτε ἀντιστῆναι ἐν τῇ ἡμέρᾳ τῇ πονηρᾷ καὶ ἅπαντα κατεργασάμενοι στῆναι.</p>","lit":"<p>因為我們的摔跤不是對著血和肉，乃是對著那些執政的，對著那些掌權的，對著這黑暗的世界統治者，對著那些在天上屬靈的邪惡勢力。</p><p>因此，你們要拿起神的全副軍裝，好叫你們能夠在那邪惡的日子抵擋，並且完成了一切之後，站立得住。</p>","key":"<table><tr><th>原文</th><th>音譯</th><th>字面</th><th>在這裡</th></tr><tr><td>ἡ πάλη</td><td>hē palē</td><td>摔跤</td><td>貼身的扭打</td></tr><tr><td>πρὸς αἷμα καὶ σάρκα</td><td>pros haima kai sarka</td><td>對著血和肉</td><td>對手不是人</td></tr><tr><td>τὰς ἀρχάς</td><td>tas archas</td><td>那些執政的</td><td>1:21、3:10 同一組</td></tr><tr><td>τὰς ἐξουσίας</td><td>tas exousias</td><td>那些掌權的</td><td>同上</td></tr><tr><td>κοσμοκράτορας</td><td>kosmokratoras</td><td>世界統治者</td><td>新約只出現在這裡</td></tr><tr><td>ἐν τοῖς ἐπουρανίοις</td><td>en tois epouraniois</td><td>在天上</td><td>我們也一同坐在那裡</td></tr><tr><td>ἀναλάβετε</td><td>analabete</td><td>你們要拿起</td><td>軍事用語</td></tr><tr><td>ἀντιστῆναι</td><td>antistēnai</td><td>抵擋</td><td>站在對面</td></tr><tr><td>κατεργασάμενοι</td><td>katergasamenoi</td><td>完成了</td><td>兩種讀法</td></tr></table>","gram":"<p><strong>6:12 用 ὅτι（hoti） 解釋為甚麼需要神的軍裝：對手不是人。</strong></p><p>ἡ πάλη（hē palē） 是摔跤，cu89t 的註腳也說原文是摔跤。保羅用的不是遠距離的弓箭戰，是貼身的扭打。οὐκ ἔστιν ἡμῖν ἡ πάλη πρὸς αἷμα καὶ σάρκα（ouk estin hēmin hē palē pros haima kai sarka），先否定：不是血和肉。然後 ἀλλὰ（alla） 接四個 πρός（pros）：πρὸς τὰς ἀρχάς（pros tas archas）、πρὸς τὰς ἐξουσίας（pros tas exousias）、πρὸς τοὺς κοσμοκράτορας τοῦ σκότους τούτου（pros tous kosmokratoras tou skotous toutou）、πρὸς τὰ πνευματικὰ τῆς πονηρίας ἐν τοῖς ἐπουρανίοις（pros ta pneumatika tēs ponērias en tois epouraniois）。τὰς ἀρχάς（tas archas） 與 τὰς ἐξουσίας（tas exousias） 在 1:21 已經被放在基督腳下，在 3:10 是教會向它們展示神智慧的對象。κοσμοκράτορας（kosmokratoras） 在新約只出現這一次；學者觀察到，同時代的法術文獻用它稱呼某些神明。</p><p>ἐν τοῖς ἐπουρανίοις（en tois epouraniois） 是本卷第五次出現：1:3 福氣在那裡，1:20 基督坐在那裡，2:6 我們一同坐在那裡，3:10 執政掌權的在那裡得知神的智慧，6:12 爭戰也在那裡。爭戰的地方，正是我們已經坐下的地方。</p><blockquote><p>6:13 διὰ τοῦτο ἀναλάβετε（dia touto analabete），不定過去式命令，「拿起」是士兵上陣前拿裝備的字。ἵνα δυνηθῆτε ἀντιστῆναι ἐν τῇ ἡμέρᾳ τῇ πονηρᾷ（hina dynēthēte antistēnai en tē hēmera tē ponēra）：那邪惡的日子，可以指末世的高峰，也可以指每一個試探特別強的日子；本講義讀成兩者都在。καὶ ἅπαντα κατεργασάμενοι στῆναι（kai hapanta katergasamenoi stēnai），κατεργασάμενοι（katergasamenoi） 可以讀成「把一切預備妥當」，也可以讀成「勝過了一切」；兩種讀法都以 στῆναι（stēnai） 收尾。從 6:11 στῆναι（stēnai）、6:13 ἀντιστῆναι（antistēnai） 與 στῆναι（stēnai）、到 6:14 στῆτε（stēte），四次都是 ἵστημι（histēmi） 這一個字根：站。</p></blockquote>","exp":"<p>〔背景〕徒 19:11--20（使徒行傳講義第 19 章）</p><p>「因我們並不是與屬血氣的爭戰」（6:12）——這一句首先是一個保護。教會裡最常見的錯誤，是把弟兄姊妹當成敵人。保羅說：你的對手不是那位讓你受傷的同工，不是那位頂撞你的兒子，也不是那位難纏的老闆。「我們爭戰的兵器本不是屬血氣的」（林後 10:4）。把人當敵人，正中了魔鬼的詭計。</p><p>那麼這些執政的、掌權的是誰？傳統福音派認為是靈界的墮落天使；另一派學者強調它們也包括人間的政治、經濟、文化結構裡的邪惡勢力。本講義的判斷：<strong>它們主要是靈界的勢力，也會透過人間的結構與文化運作。</strong>所以爭戰既在禱告裡，也在說誠實話、行公義、拒絕貪婪裡。</p><p>勝負已定。基督已經「遠超過一切執政的、掌權的、有能的、主治的」（1:21），神「又將萬有服在他的腳下」（1:22）。<strong>爭戰是從得勝的位置出發，不是為了得勝。</strong>所以保羅沒有叫人去捆綁地域邪靈、繪製屬靈地圖、點名驅趕；6:10--18 一個這樣的字也沒有。他只說四次：站住。</p><p>這對華人城市很實際。基督徒不必怕鬼月、風水、廟宇——「從前你們是暗昧的，但如今在主裡面是光明的」（5:8）；但也不參與：不拜、不求、不戴護身符、不擇日，因為那是把信靠交給「空中掌權者的首領」（2:2）。遇到情緒或精神上的困擾，不要輕易說人被鬼附；先轉介醫療與專業協助，同時為他禱告，兩者不衝突。聽完 6:12 的會眾，應該是更平安地站在基督裡，不是回家把每一個角落都看成鬼。</p><p>「並且成就了一切，還能站立得住」（6:13）是全卷的終點。坐、行、站，到這裡收住：不是衝上去，是站得住。</p>"},{"a":14,"z":15,"star":2,"grk":"<p lang=\"grc\">στῆτε οὖν περιζωσάμενοι τὴν ὀσφὺν ὑμῶν ἐν ἀληθείᾳ, καὶ ἐνδυσάμενοι τὸν θώρακα τῆς δικαιοσύνης,</p><p lang=\"grc\">καὶ ὑποδησάμενοι τοὺς πόδας ἐν ἑτοιμασίᾳ τοῦ εὐαγγελίου τῆς εἰρήνης,</p>","lit":"<p>所以你們要站立，用真理束上你們的腰，並且穿上公義的胸甲，</p><p>並且在平安之福音的預備中，把鞋穿在腳上；</p>","key":"<table><tr><th>原文</th><th>音譯</th><th>字面</th><th>在這裡</th></tr><tr><td>στῆτε οὖν</td><td>stēte oun</td><td>所以你們要站立</td><td>第四次站立</td></tr><tr><td>περιζωσάμενοι</td><td>perizōsamenoi</td><td>束上了</td><td>先束腰，才能行動</td></tr><tr><td>ἐν ἀληθείᾳ</td><td>en alētheia</td><td>用真理</td><td>教義的真，也是人的真</td></tr><tr><td>τὸν θώρακα τῆς δικαιοσύνης</td><td>ton thōraka tēs dikaiosynēs</td><td>公義的胸甲</td><td>賽 59:17 神的鎧甲</td></tr><tr><td>ὑποδησάμενοι</td><td>hypodēsamenoi</td><td>穿上鞋</td><td>第三個分詞</td></tr><tr><td>ἐν ἑτοιμασίᾳ</td><td>en hetoimasia</td><td>在預備中</td><td>預備走，也是站得穩</td></tr><tr><td>τοῦ εὐαγγελίου τῆς εἰρήνης</td><td>tou euangeliou tēs eirēnēs</td><td>平安的福音</td><td>軍人的鞋是平安</td></tr></table>","gram":"<p><strong>6:14 的主要動詞只有一個：στῆτε οὖν（stēte oun）。</strong>其餘全是分詞。</p><p>στῆτε（stēte） 是不定過去式命令，οὖν（oun） 把 6:10--13 收成結論。接著四個不定過去式分詞：περιζωσάμενοι（perizōsamenoi）、ἐνδυσάμενοι（endysamenoi）、ὑποδησάμενοι（hypodēsamenoi），以及 6:16 的 ἀναλαβόντες（analabontes）。分詞的動作先於站立，或與站立同時：穿戴妥當，才站得住。</p><p>περιζωσάμενοι τὴν ὀσφὺν ὑμῶν ἐν ἀληθείᾳ（perizōsamenoi tēn osphyn hymōn en alētheia），束腰是把長袍紮起來，好行動。ἀληθείᾳ（alētheia） 是客觀的真理，還是主觀的誠實？本卷兩面都講過：「你們既聽見真理的道」（1:13）是客觀的，「各人與鄰舍說實話」（4:25）是主觀的；本講義讀成兩者並在。τὸν θώρακα τῆς δικαιοσύνης（ton thōraka tēs dikaiosynēs） 也有兩讀：神所算給人的義，或是行出來的義；4:24 說新人「有真理的仁義和聖潔」，同樣兩面都在。</p><blockquote><p>6:15 ἐν ἑτοιμασίᾳ τοῦ εὐαγγελίου τῆς εἰρήνης（en hetoimasia tou euangeliou tēs eirēnēs），ἑτοιμασίᾳ（hetoimasia） 一說是「預備好去傳」，一說是「堅定的立足點」。羅馬兵丁的鞋底有釘，是為了站穩。學者觀察到這三件與以賽亞書相近：「公義必當他的腰帶」（賽 11:5）；「那報佳音，傳平安……這人的腳登山何等佳美」（賽 52:7）。保羅沒有明說引用，這使我們想起。</p></blockquote>","exp":"<p>「所以要站穩了，用真理當作帶子束腰，用公義當作護心鏡遮胸」（6:14）。第一件軍裝是真理。一個說謊的人站不住，因為他每一步都要記得自己說過甚麼。魔鬼被稱為詭計的主人，抵擋它的第一件東西就是真。這與 4:15 一致：「惟用愛心說誠實話」（4:15）。</p><p>第二件是公義。護心鏡遮住要害。在基督裡被稱義，是神替我們穿上的；行出公義，是我們每天穿著它走路。被指控的時候，信徒站在基督的義裡；被試探的時候，信徒用正直的生活保護自己的心。</p><p>第三件最出人意料：軍人的鞋，是「平安的福音」（6:15）。全卷講過基督「使我們和睦」（2:14），又「來傳和平的福音給你們遠處的人」（2:17）。爭戰的鞋，是和平。一間會打屬靈仗的教會，應該是一間最能讓猶太人和外邦人坐在一起的教會，而不是最會分裂的教會。</p><p>這幾件都是品格與真理，不是儀式。穿上它，不是早上念一遍禱詞就算數，是在家裡、職場上說真話、行公義、帶來和平。前面 6:1--9 講的家與職場，正是這幾件軍裝每天被試穿的地方。</p><p>一個在家裡說謊的父親，在職場上作假的員工，禱告再大聲，腰上也沒有帶子。</p>"},{"a":16,"z":17,"star":2,"grk":"<p lang=\"grc\">ἐν πᾶσιν ἀναλαβόντες τὸν θυρεὸν τῆς πίστεως, ἐν ᾧ δυνήσεσθε πάντα τὰ βέλη τοῦ πονηροῦ πεπυρωμένα σβέσαι·</p><p lang=\"grc\">καὶ τὴν περικεφαλαίαν τοῦ σωτηρίου δέξασθε καὶ τὴν μάχαιραν τοῦ πνεύματος, ὅ ἐστιν ῥῆμα θεοῦ,</p>","lit":"<p>在一切事上拿起信心的大盾牌，藉著它，你們將能熄滅那惡者一切已經點了火的箭；</p><p>並且你們要接過救恩的頭盔，和聖靈的短劍，就是神的話；</p>","key":"<table><tr><th>原文</th><th>音譯</th><th>字面</th><th>在這裡</th></tr><tr><td>ἐν πᾶσιν</td><td>en pasin</td><td>在一切事上</td><td>不是「最重要的是」</td></tr><tr><td>τὸν θυρεὸν τῆς πίστεως</td><td>ton thyreon tēs pisteōs</td><td>信心的大盾牌</td><td>門形的大盾</td></tr><tr><td>τὰ βέλη τοῦ πονηροῦ πεπυρωμένα</td><td>ta belē tou ponērou pepyrōmena</td><td>那惡者已點了火的箭</td><td>完成式分詞</td></tr><tr><td>σβέσαι</td><td>sbesai</td><td>熄滅</td><td>盾牌浸過水</td></tr><tr><td>δέξασθε</td><td>dexasthe</td><td>你們要接過</td><td>從分詞回到命令</td></tr><tr><td>τὴν περικεφαλαίαν τοῦ σωτηρίου</td><td>tēn perikephalaian tou sōtēriou</td><td>救恩的頭盔</td><td>賽 59:17 神的頭盔</td></tr><tr><td>τὴν μάχαιραν τοῦ πνεύματος</td><td>tēn machairan tou pneumatos</td><td>聖靈的短劍</td><td>近身用的短劍</td></tr><tr><td>ῥῆμα θεοῦ</td><td>rhēma theou</td><td>神的話</td><td>說出口的話</td></tr></table>","gram":"<p><strong>6:16--17 是最後三件，也是唯一一件攻擊的武器。</strong></p><p>ἐν πᾶσιν（en pasin） 舊譯常作「最要緊的是」，但更自然的讀法是「在一切事上」：每一件軍裝都配上它。τὸν θυρεὸν τῆς πίστεως（ton thyreon tēs pisteōs），θυρεὸν（thyreon） 是門形的大盾，與「門」同字根，可以遮住全身。τὰ βέλη τοῦ πονηροῦ πεπυρωμένα（ta belē tou ponērou pepyrōmena），πεπυρωμένα（pepyrōmena） 是完成式被動分詞：已經點著火的箭。σβέσαι（sbesai） 是熄滅；羅馬兵丁上陣前會把皮面的盾牌浸濕。τοῦ πονηροῦ（tou ponērou） 帶冠詞，指那位惡者。</p><p>6:17 句型一轉：δέξασθε（dexasthe） 是不定過去式命令，從分詞回到命令語氣，而且是「接過」。頭盔和寶劍是遞給你的，不是自己打造的。τὴν περικεφαλαίαν τοῦ σωτηρίου（tēn perikephalaian tou sōtēriou） 這使我們想起賽 59:17 神自己的頭盔。τὴν μάχαιραν τοῦ πνεύματος（tēn machairan tou pneumatos） 的 μάχαιραν（machairan） 是近身用的短劍。</p><blockquote><p>ὅ ἐστιν ῥῆμα θεοῦ（ho estin rhēma theou） 的 ὅ（ho） 是中性關係代名詞，指整個「聖靈的寶劍」。保羅用 ῥῆμα（rhēma），不用 λόγος（logos）：ῥῆμα（rhēma） 偏重說出口的話。聖靈的劍，是在具體的時候被說出來的神的話。</p></blockquote>","exp":"<p>盾牌是給整隊用的。羅馬兵丁的大盾可以一面一面連起來，前排擋前面，後排舉過頭頂。「此外，又拿著信德當作盾牌，可以滅盡那惡者一切的火箭」（6:16）——信心是個人的，也是群體的。被火箭射中的時候，旁邊弟兄姊妹的盾牌，常常比自己的更早擋住。</p><p>頭盔是救恩。人的頭最容易被打：懷疑、控告、絕望都從這裡進來。救恩是神「接過」給我們的，所以不必靠感覺來保住它。</p><p>寶劍是「神的道」（6:17）。全副軍裝只有這一件能往前刺，而它是神的話，不是我們的話。耶穌在曠野被試探，三次都用經上的話回答（太 4:4、7、10）——不是念咒，是在那一刻說出那一句合用的真理。</p><p><strong>所以經文不是咒語。</strong>以弗所城裡有人把耶穌的名當成趕鬼的口訣，結果被鬼反問（徒 19:13--16）。大聲宣告某一節經文，本身沒有魔力；那把劍的力量，在於它是聖靈的、是真的，而且是被一個信的人在對的時候說出來。這六件軍裝，真理、公義、平安的福音、信德、救恩、神的道，沒有一件是口訣，全都是品格與真理。</p><p>那麼要不要每天早上「禱告穿上」全副軍裝？這樣禱告可以是很好的提醒，但軍裝不是靠一段禱詞穿上的。真理、公義、信心、救恩，是在基督裡已經賜下的；每天要做的，是活在其中，並且把神的話存在心裡，到時候拿得出來。</p>"},{"a":18,"z":20,"star":2,"grk":"<p lang=\"grc\">διὰ πάσης προσευχῆς καὶ δεήσεως, προσευχόμενοι ἐν παντὶ καιρῷ ἐν πνεύματι, καὶ εἰς αὐτὸ ἀγρυπνοῦντες ἐν πάσῃ προσκαρτερήσει καὶ δεήσει περὶ πάντων τῶν ἁγίων,</p><p lang=\"grc\">καὶ ὑπὲρ ἐμοῦ, ἵνα μοι δοθῇ λόγος ἐν ἀνοίξει τοῦ στόματός μου, ἐν παρρησίᾳ γνωρίσαι τὸ μυστήριον τοῦ εὐαγγελίου</p><p lang=\"grc\">ὑπὲρ οὗ πρεσβεύω ἐν ἁλύσει, ἵνα ἐν αὐτῷ παρρησιάσωμαι ὡς δεῖ με λαλῆσαι.</p>","lit":"<p>藉著一切的禱告和祈求，在每一個時候在靈裡禱告，並且為此警醒，在一切的恆忍與祈求中，為著眾聖徒，</p><p>也為著我，好叫在我開口的時候有話賜給我，能坦然無懼地使人知道福音的奧祕，</p><p>我為了它在鎖鍊中作使者，好叫我在它裡面坦然無懼地講說，照我所必須講的。</p>","key":"<table><tr><th>原文</th><th>音譯</th><th>字面</th><th>在這裡</th></tr><tr><td>διὰ πάσης προσευχῆς καὶ δεήσεως</td><td>dia pasēs proseuchēs kai deēseōs</td><td>藉著一切的禱告和祈求</td><td>四個「一切」的第一個</td></tr><tr><td>ἐν παντὶ καιρῷ</td><td>en panti kairō</td><td>在每一個時候</td><td>不分時段</td></tr><tr><td>ἐν πνεύματι</td><td>en pneumati</td><td>在靈裡</td><td>5:18「被聖靈充滿」</td></tr><tr><td>ἀγρυπνοῦντες</td><td>agrypnountes</td><td>警醒</td><td>不睡，守夜</td></tr><tr><td>προσκαρτερήσει</td><td>proskarterēsei</td><td>恆忍</td><td>新約只出現在這裡</td></tr><tr><td>ἐν παρρησίᾳ</td><td>en parrēsia</td><td>坦然無懼</td><td>3:12 同一個字</td></tr><tr><td>πρεσβεύω ἐν ἁλύσει</td><td>presbeuō en halysei</td><td>在鎖鍊中作使者</td><td>矛盾的兩個詞</td></tr></table>","gram":"<p><strong>6:18 的禱告，在文法上仍然掛在 6:14 的 στῆτε（stēte） 底下。</strong></p><p>προσευχόμενοι（proseuchomenoi） 與 ἀγρυπνοῦντες（agrypnountes） 是分詞，接著前面的軍裝分詞往下走。所以禱告不是第七件軍裝，是穿戴每一件軍裝的方式。本節四次「一切」：διὰ πάσης προσευχῆς καὶ δεήσεως（dia pasēs proseuchēs kai deēseōs）、ἐν παντὶ καιρῷ（en panti kairō）、ἐν πάσῃ προσκαρτερήσει（en pasē proskarterēsei）、περὶ πάντων τῶν ἁγίων（peri pantōn tōn hagiōn）。</p><p>ἐν πνεύματι（en pneumati） 在本卷多次出現（2:18、2:22、3:5、5:18），指在聖靈裡、靠著聖靈。有人把它讀成專指方言禱告；本講義的判斷：經文的範圍更寬，包括一切靠聖靈的禱告，方言的議題回指哥林多前書立場三。ἀγρυπνοῦντες（agrypnountes） 是「不睡」，守夜的字；προσκαρτερήσει（proskarterēsei） 在新約只出現在這裡，是黏著不放的恆忍。</p><blockquote><p>6:19 καὶ ὑπὲρ ἐμοῦ（kai hyper emou），保羅求代禱，不是求出獄，是 ἵνα μοι δοθῇ λόγος（hina moi dothē logos）——被動，話是賜下的。ἐν παρρησίᾳ（en parrēsia） 與 3:12 的 παρρησίαν（parrēsian） 同字。6:20 ὑπὲρ οὗ πρεσβεύω ἐν ἁλύσει（hyper hou presbeuō en halysei） 是一個刻意的矛盾：使者通常享有外交上的保護，這一位卻戴著鎖鍊。句末 παρρησιάσωμαι ὡς δεῖ με λαλῆσαι（parrēsiasōmai hōs dei me lalēsai），δεῖ（dei） 是「必須」：放膽講，是他的本分。</p></blockquote>","exp":"<p>軍裝穿好以後，保羅沒有叫人衝鋒，叫人跪下。「靠著聖靈，隨時多方禱告祈求；並要在此警醒不倦，為眾聖徒祈求」（6:18）。禱告的範圍是「眾聖徒」：不是只為自己這一隊，是為整個身體。站立得住的信徒，不是單獨站著的。</p><p>他也為自己求，求的內容很特別：「使我得著口才，能以放膽開口講明福音的奧祕」（6:19）。一個坐在羅馬監獄裡的人，最想要的不是自由，是開口的膽量。使徒行傳講義第 28 章看過他在羅馬「被這鍊子捆鎖」（徒 28:20），也看過那卷書的最後一句「並沒有人禁止」（徒 28:31）。</p><p>「我為這福音的奧祕作了帶鎖鍊的使者」（6:20）。他在別處說「我們作基督的使者」（林後 5:20）。使者代表國家，本來不可侵犯；天國的使者卻被鎖著。鎖鍊沒有取消他的身分，反而成了他的講台。</p><p>這也是屬靈爭戰的樣本。保羅最後的「戰術」，不是點名趕鬼，是禱告與傳福音。他越相信神在基督裡的揀選，就越放膽傳講；揀選從來沒有攔阻他開口。</p><p>今天的代禱也可以學他：不只求處境改變，也求在處境裡能開口。病床上、裁員名單上、移居的城市裡，信徒都可以是一位帶著限制的使者。限制不是福音的終點，常常是福音被聽見的地方。</p>"},{"a":21,"z":22,"star":1,"grk":"<p lang=\"grc\">Ἵνα δὲ εἰδῆτε καὶ ὑμεῖς τὰ κατʼ ἐμέ, τί πράσσω, πάντα γνωρίσει ὑμῖν Τυχικὸς ὁ ἀγαπητὸς ἀδελφὸς καὶ πιστὸς διάκονος ἐν κυρίῳ,</p><p lang=\"grc\">ὃν ἔπεμψα πρὸς ὑμᾶς εἰς αὐτὸ τοῦτο ἵνα γνῶτε τὰ περὶ ἡμῶν καὶ παρακαλέσῃ τὰς καρδίας ὑμῶν.</p>","lit":"<p>為要叫你們也知道我的事、我在做甚麼，推基古，那親愛的弟兄、在主裡忠心的執事，要把一切告訴你們；</p><p>我差他到你們那裡，正是為了這件事，好叫你們知道我們的情形，並且他可以安慰你們的心。</p>","key":"<table><tr><th>原文</th><th>音譯</th><th>字面</th><th>在這裡</th></tr><tr><td>Τυχικὸς</td><td>Tychikos</td><td>推基古</td><td>亞細亞人（徒 20:4）</td></tr><tr><td>ὁ ἀγαπητὸς ἀδελφὸς</td><td>ho agapētos adelphos</td><td>那親愛的弟兄</td><td>先是弟兄</td></tr><tr><td>πιστὸς διάκονος</td><td>pistos diakonos</td><td>忠心的執事</td><td>再是服事的人</td></tr><tr><td>ἔπεμψα</td><td>epempsa</td><td>我差了</td><td>書信式的過去式</td></tr><tr><td>παρακαλέσῃ τὰς καρδίας ὑμῶν</td><td>parakalesē tas kardias hymōn</td><td>安慰你們的心</td><td>送信也送安慰</td></tr></table>","gram":"<p>Ἵνα δὲ εἰδῆτε καὶ ὑμεῖς（Hina de eidēte kai hymeis） 的 καὶ ὑμεῖς（kai hymeis），「你們也」，暗示還有別人也會知道。學者觀察到 6:21--22 與西 4:7--8 有一長串字幾乎一模一樣，兩封信很可能由推基古同一趟帶出去。這與傳閱信說相配：全信沒有具名問安，只有一位送信人。</p><p>τί πράσσω（ti prassō） 是「我在做甚麼」，一個囚犯的近況。ὃν ἔπεμψα（hon epempsa） 是書信式的不定過去式：從讀信人的角度，差派已經發生。εἰς αὐτὸ τοῦτο（eis auto touto），「正是為了這件事」，下面兩個 ἵνα（hina）：讓你們知道，也讓他 παρακαλέσῃ τὰς καρδίας ὑμῶν（parakalesē tas kardias hymōn）。</p>","exp":"<p>全卷最後出場的人物，不是使徒，不是先知，是一位送信的弟兄。「今有所親愛、忠心事奉主的兄弟推基古」（6:21）。保羅給他兩個稱呼：先是親愛的弟兄，再是忠心的執事。身分在前，服事在後。歌羅西書幾乎說了同樣的話：「有我親愛的兄弟推基古要將我一切的事都告訴你們」（西 4:7）。</p><p>他要走幾百公里，把這封信帶到亞細亞，一間一間教會讀給大家聽，還要回答大家的問題，說明保羅的景況。後來保羅又寫：「我已經打發推基古往以弗所去」（提後 4:12）。這樣的人不常被講到，但沒有他，這封信到不了我們手上。</p><p>經上說「百節各按各職」（4:16）；推基古就是其中一節。他的職分很簡單：送信，也送安慰。「又叫他安慰你們的心」（6:22）——一封講屬靈爭戰的信，是由一個帶著安慰的人送到的。</p>"},{"a":23,"z":24,"star":3,"grk":"<p lang=\"grc\">Εἰρήνη τοῖς ἀδελφοῖς καὶ ἀγάπη μετὰ πίστεως ἀπὸ θεοῦ πατρὸς καὶ κυρίου Ἰησοῦ Χριστοῦ.</p><p lang=\"grc\">ἡ χάρις μετὰ πάντων τῶν ἀγαπώντων τὸν κύριον ἡμῶν Ἰησοῦν Χριστὸν ἐν ἀφθαρσίᾳ</p>","lit":"<p>願平安歸與弟兄們，並愛與信心，從父神和主耶穌基督而來。</p><p>願恩典與一切在不朽壞之中愛我們主耶穌基督的人同在。</p>","key":"<table><tr><th>原文</th><th>音譯</th><th>字面</th><th>在這裡</th></tr><tr><td>Εἰρήνη</td><td>Eirēnē</td><td>平安</td><td>結尾先說平安</td></tr><tr><td>ἀγάπη μετὰ πίστεως</td><td>agapē meta pisteōs</td><td>愛與信心</td><td>愛帶著信</td></tr><tr><td>ἡ χάρις</td><td>hē charis</td><td>那恩典</td><td>全卷最後一個祝福</td></tr><tr><td>τῶν ἀγαπώντων</td><td>tōn agapōntōn</td><td>那些愛的人</td><td>現在分詞：持續地愛</td></tr><tr><td>ἐν ἀφθαρσίᾳ</td><td>en aphtharsia</td><td>在不朽壞之中</td><td>全卷最後一個字</td></tr></table>","gram":"<p><strong>全卷首尾用「恩惠、平安」包起來，次序卻倒過來。</strong></p><p>1:2 是 χάρις ὑμῖν καὶ εἰρήνη（charis hymin kai eirēnē），先恩惠後平安；結尾是 6:23 Εἰρήνη（Eirēnē） 開頭、6:24 ἡ χάρις（hē charis） 收尾，先平安後恩惠——一個交錯排列，把全卷包在中間。6:23 用第三人稱 τοῖς ἀδελφοῖς（tois adelphois）「弟兄們」，不是「你們」，又是傳閱信的一個記號。ἀγάπη μετὰ πίστεως（agapē meta pisteōs）：愛帶著信心。</p><p>6:24 ἡ χάρις μετὰ πάντων τῶν ἀγαπώντων τὸν κύριον ἡμῶν Ἰησοῦν Χριστὸν（hē charis meta pantōn tōn agapōntōn ton kyrion hēmōn Iēsoun Christon），τῶν ἀγαπώντων（tōn agapōntōn） 是現在分詞，持續地愛。然後是全卷最後兩個字 ἐν ἀφθαρσίᾳ（en aphtharsia）。和合本譯「誠心」，字面是「在不朽壞之中」；這個字保羅在林前 15 用來講復活的身體。</p><blockquote><p>ἐν ἀφθαρσίᾳ（en aphtharsia） 修飾甚麼？學者有三說：一說修飾「愛」，以不朽壞的愛愛主；一說修飾「恩典」，恩典在不朽壞之中與他們同在；一說修飾「主」，那位不朽壞的主。本講義的判斷：最自然的是第一說，緊接在「愛」之後，和合本的「誠心」也是這樣讀；但第二說提醒我們，這份愛能不朽壞，是因為恩典不朽壞。</p></blockquote>","exp":"<p>「並願所有誠心愛我們主耶穌基督的人都蒙恩惠」（6:24）。直譯是：願恩典與一切以不朽壞的愛愛我們主耶穌基督的人同在。這封信從「天上各樣屬靈的福氣」（1:3）開始，走過坐、行、站，最後一個字落在愛上，而且是不朽壞的愛。</p><p>不朽壞是復活的字。「這必朽壞的總要變成不朽壞的」（林前 15:53）。保羅祝福的愛，是帶著復活生命的愛：不會因為時間、失望、苦難而腐爛。他在哥林多前書的結尾說得更重：「若有人不愛主，這人可詛可咒」（林前 16:22）。對主的愛，是一切的檢驗。</p><p>這使我們想起以弗所教會後來的消息。大約三十年後，復活的主對這間教會說：「然而有一件事我要責備你，就是你把起初的愛心離棄了」（啟 2:4）。教義還在、勞碌還在、分辨假使徒的能力還在（啟 2:2），愛不在了。啟示錄沒有引用以弗所書，但兩處並讀，就看見一個問題：<strong>一間很會站立得住的教會，還愛主嗎？</strong></p><p>第 6 章的次序因此很清楚：先是「靠著主」（6:10），再是「站立得住」（6:13），然後是「隨時多方禱告」（6:18），最後是不朽壞的愛（6:24）。全副軍裝的第一件是真理，全信的最後一個字是愛。真理讓人站住，愛讓人站得久。讀完這封信，該問的不是我站得穩不穩，是我愛得久不久。</p><p>6:23 的「平安、仁愛、信心」也是一條回家的路。平安是基督所成就的（2:14），仁愛是全卷不斷回到的（3:17--19；5:2），信心是從 1:13 起就在的回應。保羅把這三樣一起祝福給「弟兄們」，全卷就在一個家裡結束：從前遠離的外邦人，如今被稱為弟兄。站立得住的教會，最後被問的，是它是不是一個彼此相愛、也愛主的家。</p>"}]},"serm":{"1":{"min":18,"blocks":[["h","《都在基督裡面同歸於一》"],["p","弟兄姊妹平安，今天我們開始讀一卷新的書信：以弗所書。我們從第一章讀起。"],["p","請你和我一起，走進一間屋子。"],["q","羅馬城，一條窄巷，一間租來的屋子。上午。"],["p","屋子不大。一張木桌，一盞油燈，牆角堆著幾卷皮卷。"],["p","窗外是羅馬的聲音：車輪壓過石板，小販在叫賣，遠處有軍號。"],["p","屋裡有三個人。"],["p","一個年輕人坐在桌邊，手上拿著筆，面前攤著一張蘆葦紙。他是抄寫的人。"],["p","門邊站著一個羅馬兵。他的手腕上扣著一條鐵鍊。"],["p","鐵鍊的另一頭，扣在一個老人的手上。"],["q","「保羅蒙准和一個看守他的兵另住在一處。」（徒 28:16）"],["p","他能做的，就是說話。"],["p","現在，老人清一清喉嚨。抄寫的人把筆蘸了墨。"],["p","前面兩句是書信的慣例：寫信的是誰，寫給誰，願恩惠平安。"],["p","然後，老人停了一下。鐵鍊輕輕響了一聲。"],["q","「願頌讚歸與我們主耶穌基督的父神！」（1:3）"],["p","抄寫的人寫下來，等他說完這一句，好畫上句點。"],["p","可是老人沒有停。"],["p","他說，神在基督裡賜福給我們。神在創立世界以前揀選了我們。"],["p","神預定我們得兒子的名分。我們藉這愛子的血得蒙救贖。"],["p","抄寫的人的筆跟不上了。他抬頭看，句點還是沒有來。"],["p","老人說到奧祕，說到日期滿足，說到天上地上，說到聖靈的印記。"],["p","一直說到最後，才落在一句話上："],["q","「使他的榮耀得著稱讚。」（1:14）"],["p","弟兄姊妹，從第三節到第十四節，在希臘原文裡是一句話。"],["p","兩百零二個字，中間沒有句點。這是整本新約最長的句子之一。"],["q","一個戴著鎖鍊的人，一開口，就是一句停不下來的頌讚。"],["p","這封信很可能不只寄到以弗所。最早的幾份抄本，沒有「在以弗所」這幾個字。"],["p","學者有不同的看法，講義的議題頁整理過。我們在講台上只說一句："],["q","這是寫給每一間教會的信。也寫給今天坐在這裡的你。"],["p","今天我們走三步：父揀選、子救贖、靈印記；同歸於一；心中的眼睛。"],["q","第一步：父揀選、子救贖、靈印記。"],["p","先看這一句長長的頌讚是怎麼起頭的。"],["q","「他在基督裡曾賜給我們天上各樣屬靈的福氣」（1:3）"],["p","「曾賜給」，原文是一個已經完成的動作。"],["p","不是神正在考慮要不要給你，也不是你要排隊申請。是已經給了。"],["p","而且是「各樣」的福氣。不是缺了一樣，要靠別的方法補上。"],["p","保羅第一句話就把帳本攤開：你已經富足了，只是還沒有看見。"],["q","人不是先頌讚才得福，是看見福氣才頌讚。"],["p","這一句兩百多字的話，是有骨架的。"],["p","請你留意一句話，它出現了三次，像一首詩歌的副歌。"],["q","「使他榮耀的恩典得著稱讚」（1:6）"],["q","「叫他的榮耀從我們這首先在基督裡有盼望的人可以得著稱讚。」（1:12）"],["q","「使他的榮耀得著稱讚。」（1:14）"],["p","三段話，三次副歌。"],["p","第一段講父，第二段講子，第三段講聖靈。"],["p","每唱完一段，都回到同一個地方：神的榮耀。"],["p","我們一段一段聽。"],["p","第一段，父的揀選。"],["q","「就如神從創立世界以前，在基督裡揀選了我們，使我們在他面前成為聖潔，無有瑕疵」（1:4）"],["p","「揀選」和「預定」這兩個詞，在教會裡爭了兩千年。"],["p","各家的讀法，講義的全卷立場有整理，我們今天不在這裡辯論。"],["p","我只想請你看見這一節自己說的幾件事。"],["p","揀選是「在基督裡」。神不是在基督以外翻一本名冊。"],["p","要問我在不在裡面，答案不在名冊上，在基督身上。"],["p","揀選的動機是愛。下一節說：「又因愛我們」。"],["p","揀選的目的是聖潔。神揀選人，不是讓人放心隨便活。"],["p","揀選的時間是「創立世界以前」。"],["p","那時候你還沒有做對任何一件事，也還沒有做錯任何一件事。"],["q","神愛你，比你做對任何事都早，也比你做錯任何事都早。"],["p","所以我要在這裡放一道護欄。"],["p","揀選是給已經相信的人的安慰，不是給還在門外的人的恐嚇。"],["p","請你永遠不要對任何一個人說：你可能沒有被揀選。"],["p","保羅寫這一句，是在監牢裡唱歌，不是在法庭上宣判。"],["p","如果你今天心裡問：那我呢？我在不在裡面？"],["p","答案不是去猜一張名單，是來到基督面前。主耶穌自己說過："],["q","「到我這裡來的，我總不丟棄他。」（約 6:37）"],["p","揀選的終點是甚麼？保羅說，是「得兒子的名分」。"],["p","神不是雇用我們作僕人，是把我們收進家裡作兒女。"],["p","而且是「按著自己的意旨所喜悅的」。他不是勉強收留，是樂意。"],["p","第二段，子的救贖。"],["q","「我們藉這愛子的血得蒙救贖，過犯得以赦免，乃是照他豐富的恩典。」（1:7）"],["p","父的揀選在永恆裡；子的救贖，卻在歷史裡。"],["p","在一個有日期、有地點、有血的十字架上。"],["p","「救贖」是市場上的字。以弗所有奴隸市場，人可以被賣，也可以被贖回來。"],["p","贖價不是一筆手續費，是一條命。"],["p","請你聽赦免的尺度：「照他豐富的恩典」。不是照你過犯的大小。"],["p","有人心裡一直有一本帳，算著自己的罪夠不夠被赦免。"],["q","保羅說，你量錯了尺。不是你的罪有多重，是他的恩典有多富。"],["p","第三段，聖靈的印記。"],["p","長句唱到這裡，主詞換了。從「我們」換成「你們」。"],["q","「你們既聽見真理的道，就是那叫你們得救的福音，也信了基督，既然信他，就受了所應許的聖靈為印記。」（1:13）"],["p","請你聽這一節的次序：聽見，相信，受印記。"],["p","剛才講的揀選，並沒有取消人的回應。福音傳到以弗所，有人聽見了，信了。"],["q","神的主權沒有讓傳福音變成多餘，反倒讓傳福音有了盼望。"],["p","「受了印記」，原文是被動的。印是神蓋的，不是我們自己貼的。"],["p","所以它不會因為你這個禮拜心情不好，就掉下來。"],["q","「這聖靈是我們得基業的憑據」（1:14）"],["p","和合本的註腳說，「憑據」原文是「質」，就是訂金。"],["p","訂金不是全部，可是和全部是同一種錢。"],["p","付了訂金的買主，一定會回來付清。"],["p","「直等到神之民被贖」，註腳說，「神之民」原文是「產業」。"],["p","我們得了基業；我們自己，也是神的基業。"],["p","神付了訂金，因為他一定要把他的產業領回家。"],["p","三段唱完了。父揀選，子救贖，靈印記。"],["p","請你留意，這一整句裡，主詞幾乎都是神。"],["p","神賜福，神揀選，神預定，神救贖，神蓋印。"],["p","我們做了甚麼？聽見，相信，然後讚美。"],["q","一個看見神做了這麼多的人，嘴裡只剩下頌讚。"],["p","這就是那個戴鎖鍊的人停不下來的原因。"],["p","可是保羅唱的，不只是我得救了。"],["p","在這首歌的正中間，他把鏡頭拉開，拉到整個宇宙。"],["q","第二步：同歸於一。"],["q","「要照所安排的，在日期滿足的時候，使天上、地上、一切所有的都在基督裡面同歸於一。」（1:10）"],["p","如果要用一句話說完以弗所書，就是這一句。"],["p","「同歸於一」，原文是一個很長的字。"],["q","ἀνακεφαλαιώσασθαι。"],["p","字當中藏著一個字根，κεφαλή，意思是「頭」。"],["p","保羅在這卷書裡，把兩個意思連在一起。到這一章末了，他會說基督是「萬有之首」。"],["p","字頭還有「再一次」的意思。萬有本來屬於他，後來散了，如今要重新歸回。"],["p","請你想像一間被打翻的書房。"],["p","書散在地上，頁碼亂了，有的被撕開，有的沾了水。"],["p","神的計畫，不是撿起幾本比較好的，把其餘的掃出門。"],["p","是把每一本都撿起來，按著一個總綱，重新排回架上。"],["q","神的計畫不只是救幾個人，是把萬有重新歸在一位元首底下。"],["p","我們說：信耶穌，上天堂。這句話沒有錯，可是太小了。"],["p","神要的，是天上地上一切所有的，都回到基督底下。"],["p","你的家，你的工作，你的身體，你的城市，都在那個「一切所有的」裡面。"],["p","保羅說，這是一個「奧祕」。"],["q","「叫我們知道他旨意的奧祕」（1:9）"],["p","人類歷史上，有過很多「統一萬有」的夢。保羅窗外的羅馬，就是一個。"],["p","它用的是刀劍、稅吏，和十字架。"],["p","門口那個羅馬兵，就是這個夢的一小部分。"],["p","可是神的方式不一樣。萬有不是歸在凱撒底下，是「在基督裡面」。"],["p","歸在一位被釘十字架、又從死裡復活的元首底下。"],["q","羅馬用十字架統一天下；神用一個被釘十字架的人，統一萬有。"],["p","「在日期滿足的時候」：日期像一個瓶子，裝滿了，時候就到了。"],["p","這個計畫不是我們催出來的，也不會被耽誤。"],["p","然後保羅說了一句很驚人的話。"],["q","「我們也在他裡面得了基業」（1:11）"],["p","原文也可以讀成：我們被揀選，成了他的基業。"],["p","兩個意思都對。我們得著了神，神也得著了我們。"],["p","保羅說的是「首先在基督裡有盼望的人」，下一節就轉成「你們」。"],["p","先盼望的猶太人，後來的外邦人，同一份基業，同一個目的。"],["p","第二章那一道被拆毀的牆，在這裡已經開始鬆動了。"],["p","弟兄姊妹，這一節要落在哪裡？"],["p","宇宙的合一，不是先在聯合國試行，是先在一間教會裡試行。"],["p","在一間有不同口音、不同年紀、不同脾氣的人一起擘餅的教會裡。"],["p","國度321空中團契說「一個目的：建立屬神的體系」。"],["p","這一節，是那個體系最大的一幅圖。可是次序不能倒。"],["p","先有神要把萬有歸在基督底下，然後才有我們在家、在教會、在職場裡，讓那一位作頭。"],["q","體系的中心不是一個組織，是一位元首。"],["p","每一次你在一件小事上讓基督作主，"],["p","在一次吵架之後先低頭，在一份報表上不作假，"],["p","那個大計畫，就在地上先開了一扇小窗。"],["p","長句唱完了。保羅喘了一口氣。"],["p","抄寫的人終於畫下了句點。"],["p","然後老人說：「因此」。他開始禱告。"],["q","第三步：心中的眼睛。"],["p","保羅聽見了他們的消息。"],["q","「因此，我既聽見你們信從主耶穌，親愛眾聖徒，就為你們不住地感謝神。」（1:15–16）"],["p","向上的信，向旁邊的愛。一間教會健不健康，看這兩條線就知道。"],["p","請你留意「不住地」。一個戴著鎖鍊的人，沒有因為自己的鎖鍊，停止為別人感謝。"],["p","他求甚麼？"],["p","這些人已經聽見了真理的道，已經信了，也已經有愛了。"],["p","如果是我們，大概會求：主啊，讓他們更有知識，更有恩賜，聚會更興旺。"],["p","保羅不是這樣求的。"],["q","「並且照明你們心中的眼睛」（1:18）"],["p","原文就是這幾個字：心的眼睛。"],["q","心有眼睛。"],["p","人可以用頭腦讀懂一段經文，心卻還是瞎的。"],["p","國度321空中團契常說：用心靠聖靈，不要用腦靠自己。"],["p","這一節是這句話最美的一個禱告。聖靈住在心裡，所以他照亮的，是心的眼睛。"],["p","想一想以弗所這座城。滿街都是可以用肉眼看的神。"],["p","亞底米的大廟，銀匠打造的小神龕，巷口賣的護身符。"],["p","保羅求的，是另一種看見。看見那一位肉眼看不見、卻真正掌權的。"],["p","我們的城市也一樣。滿街都是看得見的東西在向我們招手。"],["p","房價，學區，業績，粉絲數。"],["q","肉眼看得見的，常常在搶心的眼睛。"],["p","心的眼睛打開了，會看見甚麼？保羅說了三個「何等」。"],["p","第一個，「他的恩召有何等指望」。往前看，神呼召你的終點有多好。"],["p","第二個，「他在聖徒中得的基業有何等豐盛的榮耀」。"],["p","請你再聽一次。不是我們得的基業，是神在聖徒身上得的基業。"],["p","神把一群蒙救贖的人，看成他最豐富的產業。"],["q","你也許覺得自己不值甚麼。神卻把你算在他的珍寶裡。"],["p","第三個，「他向我們這信的人所顯的能力是何等浩大」。"],["p","保羅在這一節裡，一口氣用了四個講能力的字。"],["p","能力，運行，權能，力量。"],["p","那這能力有多大？保羅馬上指給他們看。"],["q","「就是照他在基督身上所運行的大能大力，使他從死裡復活，叫他在天上坐在自己的右邊」（1:20）"],["p","神能力最大的證明，不是創造，也不是神蹟。"],["p","是一個死人從墳墓裡起來，坐上寶座。"],["p","這使我們想起詩篇的那一句："],["q","「你坐在我的右邊，等我使你仇敵作你的腳凳。」（詩 110:1）"],["p","請你看那個字：坐。"],["p","坐，表示工作完成了。祭司在聖殿裡從來不坐，因為獻祭永遠做不完。"],["p","基督坐下了，因為救贖已經成就了。"],["p","第二章會說，我們也與他「一同坐在天上」。"],["p","以弗所書的「坐」，不是叫我們消極不做事，是從一個已經得勝的位置出發。"],["q","先坐，才會行；會行，才站得住。"],["q","「遠超過一切執政的、掌權的、有能的、主治的，和一切有名的；不但是今世的，連來世的也都超過了。」（1:21）"],["p","以弗所人活在一座充滿名字的城裡。神明的名字，咒語上的名字。"],["p","使徒行傳講義第 19 章講過，那裡信主的人做了一件事："],["q","「平素行邪術的，也有許多人把書拿來，堆積在眾人面前焚燒。」（徒 19:19）"],["p","他們燒書，不是因為害怕，是因為看見了。"],["p","基督坐的位置，在一切名字之上。不必再求它們，也不必再怕它們。"],["p","所以我們不必怕鬼月，不必看風水，不必戴護身符，也不必凡事都疑神疑鬼。"],["q","勝負在第一章已經定了。我們不是打一場不知輸贏的仗。"],["p","然後是這一章的頂點。"],["q","「又將萬有服在他的腳下，使他為教會作萬有之首。」（1:22）"],["p","請你聽那個「首」字。就是剛才「同歸於一」裡面藏著的那個字根，頭。"],["p","第十節說，萬有要歸在基督這個頭底下。"],["p","到了第二十二節，這個計畫有了地址：教會。"],["p","教會，是今天已經先歸在他底下的那一群人。"],["q","「教會是他的身體，是那充滿萬有者所充滿的。」（1:23）"],["p","可是要小心：頭只有一個。"],["p","教會裡沒有一個人可以坐那個位子。牧師不行，長老不行，講員更不行。"],["p","讀完第一章，該問的不是：我在教會裡坐甚麼位子？"],["q","該問的是：我是不是確知，自己已經和這一位元首連在一起？"],["p","弟兄姊妹，我們最後一次回到羅馬那間屋子。"],["p","請你再看一眼那條鐵鍊。"],["p","一頭扣在羅馬兵的手上，一頭扣在保羅的手上。"],["p","照肉眼看，這一幕很清楚：羅馬掌權，保羅被綁。"],["p","可是保羅的心有眼睛。"],["p","他越過那個士兵，越過窗外的軍號，越過凱撒的宮殿，"],["p","看見一位坐在父右邊的基督，遠超過一切執政的、掌權的。"],["p","所以這個戴鎖鍊的人，一開口，就停不下來。"],["q","不是因為他的處境好轉了，是因為他看見了誰坐在寶座上。"],["p","那一位坐在寶座上的，曾經為我們流了血。"],["p","他的血買回了我們，他的靈印在我們心裡，他是萬有之首，也是我們的頭。"],["p","你不必更佩服保羅。你只要和他一樣，看見這一位耶穌。"],["p","這個禮拜，請你做兩件小事。"],["p","第一件，找一個安靜的時間，把第三節到第十四節慢慢念一遍。"],["p","每念到「得著稱讚」，就停下來，為一件神已經給你的福氣謝謝他。"],["p","第二件，在你最憂心的那一件事上，用保羅的話禱告："],["p","主啊，照明我心中的眼睛，讓我看見你坐在寶座上。"],["p","我們一起低頭禱告。"]]},"2":{"min":18,"blocks":[["h","《拆毀了中間隔斷的牆》"],["p","弟兄姊妹平安，今天我們一起讀以弗所書第二章。"],["p","今天我想先送你一個希臘字。只有一個字，請你帶回家。"],["q","ποίημα。"],["p","這個字，出現在第十節。和合本把它譯成「工作」。"],["q","「我們原是他的工作，在基督耶穌裡造成的」（2:10）"],["p","「工作」，原文的意思是被做出來的東西，一件作品。"],["p","英文有一個字，就是從它來的。poem，一首詩。"],["p","保羅的重點，是神親手做出來的作品。"],["p","可是借著這個字根，我們今天可以這樣說："],["q","你是神寫的一首詩。"],["p","我知道，有人聽到這一句，心裡會笑一下。"],["p","我？一首詩？我比較像一張揉皺的草稿。"],["p","如果我是一首詩，那大概是寫壞了的那一首。"],["p","一首詩值不值得讀，不是詩自己決定的。"],["p","是寫詩的人決定的。"],["q","作品不必證明自己的價值。作者已經決定了。"],["p","可是我也要老實告訴你：這一句不是這一章的第一句。"],["p","這一章不是從詩開始的。是從一座墳墓開始的。"],["q","「你們死在過犯罪惡之中」（2:1）"],["p","從第一節的死人，走到第十節的詩，中間只有九節。"],["p","這一章有三個詞：坐，牆，殿。"],["p","我們今天沿著它走三步：然而，神；拆毀的牆；神的家。"],["q","第一步：然而，神。"],["p","原文第一節，用「你們」起頭，可是動詞一直沒有出來。"],["p","保羅先描寫你們怎樣死、怎樣活在死亡裡，描寫了三節。"],["p","要等到第五節，那個動詞才出現。"],["q","死人只能被描寫，不能自己開口。"],["p","保羅沒有說你們病了，也沒有說你們累了、走偏了。"],["p","他說，你們死了。"],["p","病人還可以求醫。死人連求救都不會。"],["p","可是奇怪，死人卻在走路。"],["q","「那時，你們在其中行事為人，隨從今世的風俗，順服空中掌權者的首領」（2:2）"],["p","「行事為人」這個詞，原文就是走路。"],["p","全卷第一次走路，竟然是在死亡裡走。"],["p","死不是不動。死是在錯的方向上照常過日子。"],["p","只是方向，是別人替你決定的。"],["q","有己的人以為自己作主，其實一直在隨從。"],["p","「空中掌權者的首領」是誰？經文說，他是真實的。"],["p","可是第一章剛剛說過，基督坐在天上，遠超過一切執政掌權的。"],["p","這個首領是真的，卻不是最大的。"],["p","所以我們不輕忽，也不迷信。"],["p","身體和心裡的困擾，要看醫生，也要禱告。"],["p","在基督裡的人，已經不在這位首領的手下了。"],["p","然後保羅做了一件很謙卑的事。"],["q","「我們從前也都在他們中間」（2:3）"],["p","他從「你們」換成「我們」。"],["p","可是他說，我也一樣。"],["q","「本為可怒之子，和別人一樣。」（2:3）"],["p","和別人一樣。在墳墓裡，沒有人比別人高一點。"],["p","現在請你聽第四節的頭兩個字。"],["q","「然而，神既有豐富的憐憫，因他愛我們的大愛」（2:4）"],["p","原文是三個字：ὁ δὲ θεὸς。"],["p","第一節那個懸著的「你們」，等了三節，終於等到主詞了。"],["q","是神。"],["p","這兩個字，是整卷以弗所書的鉸鏈。"],["p","從前，翻到如今，中間那個鉸鏈，叫作「然而，神」。"],["p","弟兄姊妹，你的生命裡，有沒有一段只能用這兩個字講的故事？"],["p","我那時候已經放棄了。然而，神。"],["q","反敗為勝的那個轉折，不是我們翻身，是神開口。"],["p","神還沒有動手以前，保羅先講他的心：憐憫，和大愛。"],["p","憐憫看見的是我們的光景。愛看見的是我們這個人。"],["p","動機，先於行動。神救你，不是因為你值得，是因為他愛。"],["p","然後，神作了三件事。三件都帶著同一個字頭。"],["q","「便叫我們與基督一同活過來」（2:5）"],["q","「他又叫我們與基督耶穌一同復活，一同坐在天上」（2:6）"],["p","一同活過來，一同復活，一同坐下。"],["p","原文三個動詞，前面都加了同一個字頭，意思是「與他一同」。"],["p","神不是從天上丟一條繩子下來，叫我們自己爬上去。"],["p","是把我們和基督綁在一起。基督去哪裡，我們就去哪裡。"],["p","他從墳墓出來，我們一同出來。他坐上寶座，我們一同坐下。"],["p","最後那個字，συνεκάθισεν，一同坐。"],["p","這就是全卷「坐、行、站」的那個「坐」。"],["p","為甚麼是坐？因為坐，是完成的姿勢。"],["p","而且這三個動詞都是講已經發生的事。"],["p","已經坐下，只是還沒有完全顯明，第七節說，要顯明給後來的世代看。"],["p","第一節是全卷最低的地方，第六節，幾乎是最高的地方。"],["p","中間只隔四節。因為搬動的人，是神。"],["p","一個不知道自己已經坐在天上的人，會用一生去搶地上的位子。"],["p","一個知道自己已經坐下的人，才空得出手來服事。"],["p","不必搶位子的人，才會讓位子。"],["p","然後保羅把第五節中間那一句插話，再說一遍。"],["q","「你們得救是本乎恩，也因著信；這並不是出於自己，乃是神所賜的；也不是出於行為，免得有人自誇。」（2:8–9）"],["p","救恩是禮物。禮物不能賺，只能收。收禮物的那隻手，叫作信。"],["p","「這並不是出於自己」，那個「這」，指的是甚麼？"],["p","學者有幾種讀法；本講義的判斷是：指整個得救這件事。"],["p","連你的那份信，都包在神的禮物裡。"],["p","救恩穩不穩，不在你抓得多緊，在送禮的那一位。"],["p","如果人可以靠行為得救，天堂裡就會有人上台分享成功經驗。"],["q","恩典的目的之一，就是讓天堂裡沒有一個人能自誇。"],["p","可是請不要在第九節停下來。保羅沒有停。"],["q","「為要叫我們行善，就是神所預備叫我們行的。」（2:10）"],["p","第九節的「行為」，和第十節的「善」，原文是同一個字。"],["p","一個是根，一個是果子。"],["p","只讀八、九兩節，會以為行為不重要。"],["p","只讀第十節，會以為要靠行善保住救恩。"],["q","三節一起讀：不是出於行為，卻是為了行善。"],["p","行善不是門票，是新生命自然長出來的樣子。"],["p","再聽最後那個字：「叫我們行的」。又是走路那個字。"],["p","第二節，我們在死亡裡走。第十節，我們在神預備的善行裡走。"],["p","同一個動詞，換了一條路。"],["p","所以「坐」不是躺平。坐在天上的人，腳在地上是要走路的。"],["p","不是一張要你自己設計的成績單，是一條等你走上去的路。"],["p","現在，我們回到那一個字。ποίημα。"],["p","從死人，到神的詩。這是第一節到第十節的全部距離。"],["p","可是如果你以為，這首詩是寫給你一個人的獨唱，"],["p","那你只讀了一半。"],["p","因為下一節，保羅開始講一道牆。"],["q","第二步：拆毀的牆。"],["q","「所以你們應當記念：你們從前按肉體是外邦人」（2:11）"],["p","以弗所書前三章，幾乎沒有命令句。"],["p","只有這裡，冒出一個命令：要記得。"],["p","記得甚麼？記得你從哪裡被帶出來。"],["q","「那時，你們與基督無關，在以色列國民以外，在所應許的諸約上是局外人，並且活在世上沒有指望，沒有神。」（2:12）"],["p","請你數一數，這是五個「沒有」。"],["p","最後一個，「沒有神」，落在以弗所，特別刺耳。"],["p","以弗所有亞底米神廟，是古代世界的七大奇觀。滿城都是神明。"],["p","保羅卻說：你們沒有神。"],["p","我們華人的城市也是這樣。廟多，神明多，香火旺。"],["p","拜過了，求過了，算過了，心裡還是沒有底。"],["p","也請你留意，這份清單的中心是以色列。"],["p","外邦人是被接進來的，不是取而代之的。"],["p","一間看不起猶太人的教會，已經忘了這一節：我們原是局外人。"],["p","忘記自己曾是外人的人，最容易把別人當外人。"],["p","現在，我想請你跟我去一個地方。"],["q","耶路撒冷，聖殿，外邦人院。"],["p","一大片鋪著石板的廣場。外邦人可以進來，只能到這裡。"],["p","再往裡走，有一道矮牆。不高，大概到胸口。"],["p","矮牆上，每隔一段，立著一塊石碑，刻著希臘文。"],["q","外邦人越過者，死罪自負。"],["p","一個外邦人再愛神，也只能站在這道牆外面看。"],["p","寫以弗所書的人，就是因為這道牆坐在監裡。"],["p","使徒行傳講義第二十一章講過那一天。"],["p","亞細亞來的猶太人，在殿裡看見保羅，就大喊起來："],["q","「他又帶著希臘人進殿，污穢了這聖地。」（徒 21:28）"],["p","保羅被打，被拿，被押，最後被送到羅馬。起因，就是這道牆。"],["p","現在，他手上戴著鎖鍊，寫信給以弗所人。"],["q","「因他使我們和睦，將兩下合而為一，拆毀了中間隔斷的牆」（2:14）"],["p","「中間隔斷的牆」，原文 μεσότοιχον，全本新約只出現這一次。"],["p","可是一個為這道牆坐監的人，寫信說：它已經倒了。"],["p","和合本的註腳說，原文是：因他是我們的和睦。"],["p","不只是他使我們和睦。是他本身，就是我們的和睦。"],["p","和平不是一份協議，是一個人。"],["p","他怎麼拆？"],["q","「而且以自己的身體廢掉冤仇」（2:15）"],["p","不是用鐵鎚，是用自己的身體。"],["p","被廢掉的是甚麼？經文說，是「記在律法上的規條」。"],["p","這裡的意思，是律法被拿來當作牆、當作入門條件的那一套。"],["p","不是神要我們誠實、聖潔、相愛的心意。這一點，議題頁有細講。"],["p","牆拆了以後，基督沒有只留下一片空地。"],["q","「為要將兩下藉著自己造成一個新人，如此便成就了和睦。」（2:15）"],["p","「造成」，是創造的字。和第十節「造成的」，是同一個字。"],["p","第十節，神造的是一首詩。第十五節，神造的是一個新人。"],["p","請你聽清楚：這個新人，是單數，可是由兩個群體合成。"],["q","「新人」第一次出現在聖經裡，就是一群人。"],["p","所以這首詩，從來不是獨唱。是一首合唱。"],["p","而且這個新人，不是叫外邦人變成猶太人，"],["p","也不是叫猶太人消失，被外邦人取代。"],["q","新人不是一方吃掉另一方，是兩方在基督裡一同被造。"],["q","「既在十字架上滅了冤仇，便藉這十字架使兩下歸為一體，與神和好了」（2:16）"],["p","這一節有兩個方向。"],["p","橫的：兩下歸為一體。直的：與神和好。"],["p","兩條線，交叉在同一個十字架上。"],["p","沒有人可以只要直的那一條，不要橫的那一條。"],["p","說自己和神和好了，卻在弟兄中間砌牆的人，"],["p","忘了自己是在哪裡和神和好的。"],["q","「並且來傳和平的福音給你們遠處的人，也給那近處的人。」（2:17）"],["p","然後他們一起，「被一個聖靈所感，得以進到父面前。」"],["p","從前，外邦人只能站在矮牆外面看。"],["p","如今，他和猶太弟兄並肩，一直走到父的面前。"],["p","弟兄姊妹，加拉太書講義第二章講過安提阿的餐桌。"],["p","加拉太書說：不可以分桌。以弗所書說：牆已經沒有了。"],["p","今天的牆，換了材料。"],["p","族群，方言，世代，學歷，收入，還有政治立場。"],["p","同一間教會，國語的、粵語的、英語的，可以一年都不坐在一起。"],["p","選舉一到，弟兄姊妹在群組裡，說話越來越冷。"],["p","可是如果提到對方，語氣裡總帶著「他們那邊的」，"],["q","那就是有人在基督拆過的地方，一塊一塊，把牆砌回去。"],["p","合一不是我們努力造出來的。是他造好了，交給我們保守。"],["p","牆倒了。那麼，牆倒了以後，那片地上蓋起了甚麼？"],["p","保羅說，蓋起了一個家。"],["q","第三步：神的家。"],["q","「這樣，你們不再作外人和客旅，是與聖徒同國，是神家裡的人了」（2:19）"],["p","「客旅」，原文 πάροικοι，字面是「住在房子旁邊的人」。"],["p","「家裡的人」，原文 οἰκεῖοι，是同一個字根。"],["p","住在隔壁的人，變成家裡的人。"],["p","可是除夕晚上，他不會坐在你家的圓桌旁吃年夜飯。"],["p","保羅說，這個身分已經改了。"],["p","你不只是神家隔壁的鄰居。你的名字，寫在神家的戶口名簿上。"],["p","我們華人，最懂「自己人」和「外人」的分別。"],["p","一句「你是外人」，可以讓一個人在家族裡，一輩子坐在邊上。"],["p","從外地來的同事，做了十年，還是外人。"],["p","那麼教會呢？"],["p","一位新朋友，來了半年，還是一個人坐在最後一排。"],["p","新朋友在我們中間，是被登記，還是被認識？"],["p","保羅先說「同國」，再說「家裡的人」。"],["p","同國，是一本護照。家，是一張飯桌。"],["p","神要的，不只是一群拿同一本護照的人，是一群會坐下來一起吃飯的家人。"],["p","這個家，怎麼蓋？"],["q","「並且被建造在使徒和先知的根基上，有基督耶穌自己為房角石」（2:20）"],["p","「被建造」，是被動的。蓋房子的是神，我們是石頭。"],["p","根基，是使徒和先知，就是他們所見證、所傳的基督。"],["p","請你記住一件事：根基只打一次。"],["p","所以今天沒有人可以自稱是新的根基，拿頭銜要人絕對順服。"],["p","這個家的元首，只有基督一位。"],["p","然後是房角石。古時候蓋房子，第一塊放下去的就是它。"],["p","整座房子的方向、水平、角度，都照這一塊對齊。"],["p","這使我們想起詩篇的那一句："],["q","「匠人所棄的石頭已成了房角的頭塊石頭。」（詩 118:22）"],["p","被人丟掉的那一塊，成了整座房子對齊的那一塊。"],["p","每一塊石頭都要對齊它，而不是對齊旁邊那一塊。"],["q","「各房靠他聯絡得合式，漸漸成為主的聖殿。」（2:21）"],["p","請你留意那兩個字：漸漸。原文的意思是「正在長大」。"],["p","房子不會長大。身體才會長大。"],["p","這個家不是一間蓋好的展覽館，是一個還在施工的工地。"],["p","「聯絡得合式」，意思是石頭要被切，被磨，被調整，"],["p","好讓它和旁邊那一塊，接得剛剛好。"],["p","弟兄姊妹，你在教會裡，有沒有被磨的時候？"],["p","有一位同工，講話老是讓你不舒服。"],["p","那可能不是神放棄你了。那可能是石匠的工具，正在你身上。"],["q","被磨，不是被丟掉。是被放進牆裡的前一步。"],["p","最後，聽全章的最後一句。"],["q","「你們也靠他同被建造，成為神藉著聖靈居住的所在。」（2:22）"],["p","這一章從一座有隔牆的聖殿開始，現在結束在另一座聖殿。"],["p","這一座殿，沒有外院，沒有矮牆，沒有那塊石碑。"],["p","因為它的石頭，就是從前被擋在牆外面的人。"],["p","神要住的地方，不是哪一位明星講員。"],["p","是「你們」。複數。從前的外人和客旅，彼此相接。"],["q","神沒有搬進一棟建築。神搬進了一群人中間。"],["p","弟兄姊妹，我們回到開頭那個字。ποίημα，神的作品，神的詩。"],["p","第一段，寫在一座墳墓旁邊：你們死了。然而，神。"],["p","第二段，寫在一道矮牆上：外邦人越過者死。牆，拆了。"],["p","第三段，寫在一個工地上：住在隔壁的人，成了家裡的人。"],["p","那麼，這首詩是用甚麼寫的？"],["q","「你們從前遠離神的人，如今卻在基督耶穌裡，靠著他的血，已經得親近了。」（2:13）"],["p","這首詩，是用他的血寫的。"],["p","牆不是被我們推倒的，是被他的身體擋下來的。"],["p","我們坐上寶座，是因為他先從寶座上下來，被掛在木頭上。"],["q","詩的作者，在十字架上簽了名。"],["p","所以你不必更佩服誰。你只要更認識這一位作者。"],["p","國度321空中團契常說：無己才能合一。"],["p","它的根不在我們的口號裡。在這裡：他是我們的和睦。"],["p","他先用自己的身體拆了牆，我們才擠得進那一個新人裡面。"],["p","這個禮拜，請你做兩件小事。"],["p","第一件，早上起來，對主說一句話："],["p","主啊，從前我是死的。然而，你。謝謝你，我已經和你一同坐下了。"],["p","第二件，想一想，教會裡有沒有一個人，你一直把他當外人。"],["p","這個主日散會的時候，走過去，問他一句：吃飯了沒有？"],["p","牆，已經拆了。請你從牆原來站的地方，走過去。"],["p","我們一起低頭禱告。"]]},"3":{"min":18,"blocks":[["h","《基督的愛是何等長闊高深》"],["p","弟兄姊妹平安，今天我們一起讀以弗所書第三章。"],["p","今天一開始，我想請大家和我一起，安靜一下。"],["p","我們一起，安靜三十秒。"],["q","（停）"],["p","好。剛才這三十秒，有沒有覺得有點長？"],["p","請你聽第一節。"],["q","「因此，我－保羅為你們外邦人作了基督耶穌被囚的，替你們祈禱。」（3:1）"],["p","聽起來是一句完整的話。可是有一件事，中文看不出來。"],["p","最後那四個字「替你們祈禱」，原文沒有。"],["p","和合本的註腳說明了，這是照第十四節補上去的。"],["p","原文到「為你們外邦人」就斷了，後面是一道長長的破折號。"],["q","一句話，說到一半，停住了。"],["p","他要做甚麼？經文沒有說。"],["p","這一停，停了十二節。"],["p","一直到第十四節，保羅才用同樣的開頭，把話接回來："],["q","「因此，我在父面前屈膝」（3:14）"],["p","原來他那句沒說完的話，是要跪下來。"],["p","請你看一看這個畫面。"],["q","羅馬，一間租來的屋子。一個人，手腕上扣著鍊子。"],["p","鍊子另一頭，是一個羅馬兵。"],["p","這個人口述，旁邊的人寫。寫到一半，他停下來了。"],["p","屋子裡很安靜。兵看著他。寫字的人也看著他。"],["q","然後，他慢慢地彎下膝蓋，跪在地上。"],["p","猶太人平常是站著禱告的。"],["p","可是這一天，這個戴著鎖鍊的人，跪下來了。"],["p","今天這一章，我們就跟著這段安靜走三步。"],["p","第一步，被囚的人與奧祕。第二步，比最小的還小。第三步，跪下來的禱告。"],["q","第一步：被囚的人與奧祕。"],["p","上一章剛剛講完，基督「拆毀了中間隔斷的牆」（2:14）。"],["p","那道牆，是耶路撒冷聖殿裡一道矮牆。"],["p","牆上立著石碑，寫著：外邦人越過此牆者，死罪自負。"],["p","保羅為甚麼坐監？使徒行傳講義第二十一章講過。"],["p","有人看見他和一個以弗所人在城裡，就以為他帶外邦人越過了那道牆。"],["q","他為那道牆被捆，卻在信裡宣告：那道牆已經倒了。"],["p","使徒行傳講義第二十八章，講過他在羅馬的日子。"],["q","「保羅蒙准和一個看守他的兵另住在一處。」（徒 28:16）"],["p","手上有鍊子，門卻是開的。"],["p","請你留意，他怎麼稱呼自己。"],["p","他沒有說「我是羅馬的囚犯」。他說：「基督耶穌被囚的」。"],["p","「被囚的」，原文是 δέσμιος，前面還加了冠詞：那個囚犯。"],["q","扣住他的鍊子是羅馬的。握著鍊子另一頭的，是基督。"],["p","弟兄姊妹，誰決定了你在哪裡，誰就是你的主。"],["p","今天有人也在某一種牆裡。"],["p","病床上，失業的家裡，一段被誤會、說不清楚的關係，一個走不出去的處境。"],["p","第三章第一節先教我們一件事：在牆裡，仍然可以說，我是基督耶穌的。"],["p","他還說了理由：「為你們外邦人」。"],["p","保羅沒有把坐監看成事工中斷。他把它看成事工的一部分。"],["p","然後，他岔開了。他一說到「外邦人」，就停不下來。"],["q","「諒必你們曾聽見神賜恩給我，將關切你們的職分託付我」（3:2）"],["p","「職分」這個字，原文 οἰκονομίαν，是一個家裡管家的差事。"],["p","管家不是主人。家產不是他的，鑰匙卻在他手上。"],["p","弟兄姊妹，我們手上的恩賜、職位、一個小組、一份講稿，都是託付，不是產業。"],["q","管家最常犯的錯，不是不做事，是慢慢忘了這個家不是他的。"],["p","他手上那把鑰匙，開的是甚麼門？他說，是一個奧祕。"],["p","奧祕的意思，不是神祕難懂。是從前藏著，如今打開了。"],["q","「這奧祕在以前的世代沒有叫人知道，像如今藉著聖靈啟示他的聖使徒和先知一樣。」（3:5）"],["p","今天怎樣看使徒和先知，講義的全卷立場五有整理，第四章我們再談。"],["p","我只請你看見，他沒有說只有我看見了。他說，眾使徒和先知一同領受。"],["p","真正從神來的啟示，會讓人回到聖經和群體，不會讓人離開。"],["p","好，那個奧祕到底是甚麼？保羅說到第六節，終於說出來了。"],["q","「這奧祕就是外邦人在基督耶穌裡，藉著福音，得以同為後嗣，同為一體，同蒙應許。」（3:6）"],["p","請你聽那三個「同」字。"],["p","同為後嗣：你不是寄人籬下的客人，你的名字寫在遺囑上。"],["p","同為一體：不是兩個團體結盟，是一個身體長在一起，傷一處，全身都疼。"],["p","同蒙應許：給亞伯拉罕的應許，你有完整的一份，不是二等的。"],["p","今天，教會很少再爭外邦人能不能進來。"],["p","可是這三個「同」字，常常還是被打了折扣。"],["p","本地人和新移民，老會友和新來的，這個語言堂和那個語言堂。"],["q","神的奧祕，不是讓不同的人各坐一桌，是讓他們同坐一桌。"],["p","保羅說，他作了這福音的「執事」。"],["p","這個字原文 διάκονος，本來是端盤子、跑腿的僕人。"],["p","請你看他怎樣描述自己：第一節是囚犯，第二節是管家，第七節是端盤子的。"],["q","保羅形容自己的字，一節比一節低。"],["p","一個戴鎖鍊的人，看守著一個打開的祕密。"],["p","講到這裡，保羅還沒有回到那句沒說完的話。"],["p","他又往下降了一層。降到一個，文法上本來不存在的地方。"],["q","第二步：比最小的還小。"],["q","「我本來比眾聖徒中最小的還小，然而他還賜我這恩典，叫我把基督那測不透的豐富傳給外邦人」（3:8）"],["p","「比最小的還小」，原文只有一個字：ἐλαχιστοτέρῳ。"],["p","「最小」，已經是到底了。"],["p","保羅在「最小」後面，再加上一個「更」。"],["p","文法上沒有這個字。可是保羅的心裡，有這個地方。"],["p","請你再看他跟誰比。"],["p","寫哥林多前書的時候，他說："],["q","「我原是使徒中最小的，不配稱為使徒，因為我從前逼迫神的教會。」（林前 15:9）"],["p","到以弗所書，他不跟使徒比了，他跟所有的聖徒比。"],["p","保羅越走越遠，也越走越低。"],["p","請你聽那句話的後半段：「基督那測不透的豐富」。"],["p","「測不透」這個字，字根是腳印。"],["p","意思是，你沿著腳印一直追，追不到盡頭。"],["p","基督的豐富不是一口井，打到底就沒了。是一條追不完的路。"],["p","所以保羅才會越走越小。"],["p","他越往基督的豐富裡走，就越看見自己有多小。"],["q","謙卑不是壓低自己的技巧，是看見基督以後，自然的樣子。"],["p","這也是我們國度321空中團契常講的「謙卑」。"],["p","驕傲是離開本位，抓住權力。謙卑是回到本位。"],["p","保羅的本位在哪裡？在眾聖徒的下面。"],["p","可是在那個最低的地方，他手上端著的，是最大的豐富。"],["q","最小的人，端著最大的豐富。"],["p","一個覺得自己很大的人，端不穩一份測不透的豐富。"],["p","他會不知不覺，把基督的豐富，換成自己的大小。"],["p","弟兄姊妹，服事越久的人，越要問自己一句話。"],["q","我是越來越小，還是越來越大？"],["p","然後，保羅的眼光一下子放大了。從一個最小的人，放大到天上。"],["q","「為要藉著教會使天上執政的、掌權的，現在得知神百般的智慧。」（3:10）"],["p","「百般的」，原文是「多」加上「花樣繁多」，可以用來形容一塊繡花的布。"],["p","神的智慧不是單色的，是一塊布，上面繡滿了各種顏色的絲線，每一種顏色都還在，卻織成同一幅圖。"],["p","天上的執政掌權者看甚麼？"],["p","看一群本來互相看不起的人，猶太人和外邦人，主人和奴僕，"],["p","坐在同一張桌子邊，稱同一位為父。"],["q","教會，是神掛給全宇宙看的一幅繡花。"],["p","這些執政掌權者是誰，講義的全卷立場四有整理。"],["p","我只說一件事：勝負已經定了。教會不必去表演爭戰。"],["p","一群不一樣的人合一地坐在一起，本身就是一個宣告。"],["p","如果一間教會按族群、按地位分桌，天上看見的，就只是人很單調的驕傲。"],["p","反過來，一個小小的家庭小組，有老有少，有本地有外地，"],["p","大家擠在客廳裡擘餅，可能正是天上最注目的一幕。"],["p","這是神從萬世以前就定好的旨意。然後，這麼大的旨意，落到一個很親的畫面上："],["q","「我們因信耶穌，就在他裡面放膽無懼，篤信不疑地來到神面前。」（3:12）"],["p","「放膽無懼」，原文本來是希臘城邦的公民，在議會裡自由說話的權利。"],["p","不是客人怯生生站在門口，是家裡的人走進來。"],["p","很多信主多年的人，禱告的時候還像在面試。"],["q","你進去，不是靠你的表現，是「在他裡面」。門是基督開的。"],["p","所以，坐監的人寫信安慰外面的人。"],["q","「所以，我求你們不要因我為你們所受的患難喪膽，這原是你們的榮耀。」（3:13）"],["p","亞細亞的信徒聽說保羅坐監，心裡可能會想：這福音還靠得住嗎？"],["p","保羅反過來說：我的鍊子，正好說明你們有多寶貴。"],["p","苦不是本身好。苦若只是苦，會叫人喪膽。"],["p","可是苦若有方向，是為了別人得著福音，那就成了榮耀。"],["p","這一節，在全卷的地勢圖上是一塊平地。"],["p","可是只隔八節，就是整卷以弗所書最高的地方。"],["q","從平地到山頂，中間只有一件事：一段跪下來的禱告。"],["p","弟兄姊妹，那句停了十二節的話，現在要接上了。"],["p","請你回到開頭那間屋子。寫字的人等著，羅馬兵看著。"],["q","第三步：跪下來的禱告。"],["q","「因此，我在父面前屈膝，天上地上的各家，都是從他得名。」（3:14–15）"],["p","「屈膝」，原文是 κάμπτω τὰ γόνατά μου，我彎下我的膝蓋。"],["p","禱告的姿勢重要嗎？站著、坐著、走路的時候，都可以禱告，經文沒有規定。"],["p","可是姿勢會說話。"],["q","一個比最小的還小的人，在父面前，再把自己放低一次。"],["p","這不是一條規矩。是心裡的樣子，被身體說了出來。"],["p","為甚麼「因此」？為了前面十二節說的一切：外邦人同為一體，神的奧祕打開了。"],["p","這麼大的事，保羅的回應不是開會，不是策劃。是跪下。"],["p","他跪在誰面前？「父」。"],["p","「父」和「家」，在原文是同一個字根。"],["p","意思是，天上地上每一個家，都是從這位父那裡得名的。"],["p","我們華人很看重姓氏，族譜，宗祠。這是好事，也常常因此築起牆來。"],["p","這一節沒有廢掉我們的家族，卻把每一個家族，放回同一位父的名下。"],["p","在他面前，沒有一個姓比另一個姓高。"],["p","那麼，保羅跪下來，求甚麼？"],["q","「求他按著他豐盛的榮耀，藉著他的靈，叫你們心裡的力量剛強起來」（3:16）"],["p","求的標準，是「按著他豐盛的榮耀」。"],["p","不是照我缺多少，是照他有多少。"],["p","力量往哪裡去？「心裡」，原文是「裡面的人」。"],["p","這就是我們常說的：用心靠聖靈。聖靈作工的地方在心，不在外表。"],["q","「使基督因你們的信，住在你們心裡」（3:17）"],["p","他們已經信了，基督早就在他們裡面了。保羅為甚麼還要這樣求？"],["p","因為「住」這個字，原文 κατοικῆσαι，是定居，是住下來。"],["p","一個人可以讓基督進門，卻只給他一間客房。"],["p","客廳我自己管，書房我自己管，錢包和行事曆，也是我自己管。"],["q","保羅求的，不是基督來作客。是基督搬進來，每一個房間都是他的。"],["p","然後是兩個畫面：「叫你們的愛心有根有基」。"],["p","樹有根，風來不倒。房子有地基，水來不垮。"],["p","愛心若沒有根，很快就累了。有基督住在心裡，愛才有地基。"],["p","再往上一層，就是本章的題目。"],["q","「能以和眾聖徒一同明白基督的愛是何等長闊高深，並知道這愛是過於人所能測度的」（3:18–19）"],["p","請你先聽那四個字：「和眾聖徒」。"],["p","保羅沒有求，讓你們每一個人自己量清楚。"],["p","他求的是，讓你們一起量。"],["q","基督的愛，不是一個人量得完的。"],["p","一個人，只能量到自己走過的那一段。"],["p","有一位姊妹，被饒恕過一件說不出口的事。她量到的是深。"],["p","有一位弟兄，從別的國家來，被一間教會接納。他量到的是闊。"],["p","有一位長輩，在病床上躺了好幾年，一直被托住。她量到的是長。"],["p","有一個年輕人，從谷底被拉起來，重新站上來。他量到的是高。"],["p","要把四面都量全，需要整個身體坐在一起。"],["q","神把不一樣的人放進同一個家，其中一個原因，是只有一群不一樣的人，才看得見愛的全貌。"],["p","經文自己說，這愛「過於人所能測度的」。"],["p","保羅要人知道一份不可能完全知道的愛。"],["p","就像一個孩子知道父母愛他，卻永遠說不完那份愛有多大。"],["p","知道，但是沒有盡頭。"],["p","最後一層：「便叫神一切所充滿的，充滿了你們」。"],["p","原文是被動的。人不能自己灌滿自己，只能把空間讓出來。"],["p","心若被自己塞滿，就沒有地方給神的豐滿。"],["p","跪下，是讓出位子。讓基督定居，是讓出房間。和眾聖徒一同量，是讓出那把只屬於自己的尺。"],["p","然後，跪著的人，抬起頭來了。"],["q","「神能照著運行在我們心裡的大力充充足足地成就一切，超過我們所求所想的。」（3:20）"],["p","「充充足足地」，原文 ὑπερεκπερισσοῦ，是三層疊起來的字。"],["p","可是這一節，我必須先關上一扇門。"],["p","因為它很常被單獨抽出來，印在卡片上，貼在新買的車上。"],["p","有人把它讀成更大的房子，更高的收入，更順的人生。"],["p","請你記得，寫這一句話的人，手上還扣著鍊子。"],["p","他沒有出監，亞細亞的教會也沒有發財。"],["p","神充充足足成就的，是前面那段禱告的內容。"],["p","心裡剛強，基督定居，和眾聖徒一同明白基督的愛，被神充滿。"],["q","這些，才是超過我們所求所想的。"],["p","那股大力在哪裡？「運行在我們心裡」。"],["p","問題不在我們的力量夠不夠，在於他的大力，已經在裡面了。"],["p","然後，是整卷以弗所書最高的一句。"],["q","「但願他在教會中，並在基督耶穌裡，得著榮耀，直到世世代代，永永遠遠。阿們！」（3:21）"],["p","請你看，榮耀在哪裡被看見？"],["p","是「在教會中」。在那群同為後嗣、同為一體、同蒙應許的人身上。"],["p","也在「基督耶穌裡」。教會的榮耀，從來不是自己發光，是從他身上來的。"],["p","我們團契常說：讓耶穌得著一切的榮耀。這一節告訴我們，那榮耀要在一群人身上被看見。"],["p","下一章一開口，就是「所以」。先坐，才會行。"],["q","頌讚不是終點，是起步的地方。"],["p","弟兄姊妹，我們最後一次回到那間屋子。"],["p","那個人還跪在地上。鍊子還扣在他手上。"],["p","他的禱告說完了，屋子又安靜下來。"],["p","你可能會想：他為甚麼不求那條鍊子斷掉？"],["p","我想，是因為他已經看清楚，握著鍊子另一頭的是誰。"],["q","他是基督耶穌被囚的。"],["p","那一位的愛，比這條鍊子長。比這間屋子闊。比羅馬的城牆高。比任何一間監牢深。"],["p","保羅量了一輩子，也沒有量完。"],["p","所以他不需要我們佩服他。他跪下來，就是要我們的眼睛，從他身上移開。"],["q","移到那一位，因著信，要住進我們心裡的基督身上。"],["p","這個禮拜，請你做兩件小事。"],["p","第一件，找一天，讓自己安靜三十秒。"],["p","如果你方便，就跪下來。不是因為規定，是在父面前，把自己放低一次。"],["p","然後問主：主啊，我心裡還有哪一個房間，你只是客人？"],["p","第二件，找一位和你很不一樣的弟兄姊妹，問他：基督的愛在你身上是甚麼樣子？"],["p","他手上那把尺，會量到你從來沒有量過的那一面。"],["p","現在，就讓我們像保羅一樣，在父面前，安靜下來。"],["p","我們一起低頭禱告。"]]},"4":{"min":18,"blocks":[["h","《建立基督的身體》"],["p","弟兄姊妹平安，今天我們一起讀以弗所書第四章。"],["p","今天我想請你帶一個數字回家。七。"],["p","我念三節經文，請你在心裡數，數那個「一」字。"],["q","「身體只有一個，聖靈只有一個，正如你們蒙召同有一個指望。一主，一信，一洗，一神，就是眾人的父，超乎眾人之上，貫乎眾人之中，也住在眾人之內。」（4:4–6）"],["p","數完了嗎？一個身體，一位聖靈，一個指望。一主，一信，一洗。一神。"],["q","七個「一」。"],["p","可是這一章還藏著第二個數字，在第十六節。"],["q","「百節各按各職」。"],["p","「百節」，就是全身的關節。"],["p","人的身體有幾百個關節。手指的，膝蓋的，脊椎一節一節的。"],["p","可是只要其中一個卡住，你整天都會想起它。"],["p","一邊是七，每一個都是「一」。一邊是幾百，每一個都不一樣。"],["q","七個「一」，是我們共同的根。幾百個關節，是我們各人的位置。"],["p","這一章有三個字：行，職，新。"],["p","我們沿著它走三步：與恩相稱，各盡其職，脫去與穿上。"],["q","第一步：與恩相稱。"],["q","「我為主被囚的勸你們：既然蒙召，行事為人就當與蒙召的恩相稱。」（4:1）"],["p","這一節的原文，第一個字是「勸」，第二個字是「所以」。"],["p","這個小小的「所以」，是整卷以弗所書的樞紐。"],["p","前面三章，保羅幾乎沒有下過一個命令。他一直在說神做了甚麼。"],["p","神揀選了我們，神叫死人活過來，神拆毀了隔斷的牆。"],["p","三章講完，他才說：所以。"],["q","神先講了三章「你是誰」，才開始講「你要怎樣活」。"],["p","從第四章讀起，以弗所書就變成一本規條。"],["p","從第一章讀起，第四章是一個被愛的人，自然邁出去的腳步。"],["p","前三章是坐。從這裡開始，是行。坐下來的人，開始走路了。"],["p","寫信的人稱自己是「為主被囚的」。他手上很可能戴著鎖鍊。"],["p","一個走不遠的人，在勸別人好好走路。"],["p","與恩相稱，不看你的處境有多寬，看你是被誰召的。"],["p","「相稱」，原文 ἀξίως，字根原是一架天平。一邊放了多重，另一邊也要一樣重。"],["p","一邊，神已經放上去了：恩典，身分，聖靈的印記。"],["p","另一邊，是我每天怎樣走路。"],["p","保羅沒有說「要配得蒙召」。恩典早就在秤盤上，不是用走路換來的。"],["p","他只是說，不要讓另一邊輕得太離譜。"],["p","那麼，與恩相稱的第一步是甚麼？一個大異象？一項大事工？"],["q","「凡事謙虛、溫柔、忍耐，用愛心互相寬容，用和平彼此聯絡，竭力保守聖靈所賜合而為一的心。」（4:2–3）"],["p","四樣都不是技巧，全是品格。排在第一個的，是謙虛。"],["p","教會裡大部分的分裂，不是因為教義，是因為有人覺得自己沒有被尊重。"],["p","「互相寬容」，原文是彼此擔待。在神的家裡，你一定會遇到需要你忍耐的人。"],["q","而你自己，也正被別人忍耐著。"],["p","再聽兩個詞：「所賜」，和「保守」。"],["p","合一是聖靈賜的，在十字架上已經造好了。我們不必造它，只要保守它。"],["p","像一只古董花瓶，別人親手交到你手上。你不必燒製，只要捧好。"],["p","可是保羅說「竭力」。花瓶是送的，摔碎卻只要一秒。"],["p","合一要不要犧牲真理，「一洗」是浸是點，議題頁有整理；保守合一，不等於對錯誤沉默。"],["p","請你留意，保羅在講各人的恩賜以前，先數了七個「一」。"],["p","以弗所書倒過來：先講共同的根，再講不同的枝子。"],["p","我們華人的城市裡，國語堂，粵語堂，英語堂，還有許多招牌。"],["p","我們常常活得像好幾個身體。"],["q","保羅會說：身體只有一個。你們只是還沒有活出來。"],["p","所以坐下來的人，第一步不是往前衝，是低下頭，把花瓶捧好。"],["p","七個「一」數完了，保羅下一句話，換了一個字。"],["q","「我們各人蒙恩，都是照基督所量給各人的恩賜。」（4:7）"],["p","從「一」，換成了「各人」。從共同的根，走到那幾百個關節。"],["q","第二步：各盡其職。"],["p","「我們各人」：教會裡沒有一個人是空手的。"],["p","對覺得自己沒用的人，這句話說：你也在「各人」裡面，不必等到有頭銜才服事。"],["p","對覺得自己很重要的人，它說：你手上的，也是「量給」你的。量的人是基督。"],["p","要問的不是「為甚麼他比我多」，是「基督給我的這一份，我用了沒有」。"],["p","恩賜從哪裡來？保羅引了詩篇第六十八篇。"],["q","「所以經上說：他升上高天的時候，擄掠了仇敵，將各樣的恩賜賞給人。」（4:8）"],["q","一位得勝的王回城了。身後押著俘虜。他登上高處，把戰利品分給百姓。"],["p","保羅說，基督升天，就是這樣一場凱旋。"],["p","恩賜不是修來的屬靈等級，是得勝的王分下來的戰利品。"],["p","誰把戰利品拿來建立自己的名聲，就是把王的凱旋，改成了自己的遊行。"],["p","然後保羅加了一個括號。"],["q","「既說升上，豈不是先降在地下嗎？那降下的，就是遠升諸天之上要充滿萬有的。」（4:9–10）"],["p","這個「先」字，有些古卷沒有，意思不變。「降在地下」指甚麼，各家看法不同，我們不在這裡久留。"],["p","方向很清楚：先降，後升。降到人間，降到十字架，降到墳墓，然後升到諸天之上。"],["q","賜恩賜的那一位，先走過最低的路。"],["p","所以，誰拿恩賜往上爬，就走了和賜恩者相反的方向。"],["p","現在，我們走到這一章最多人熟悉，也最多人用錯的一節。"],["q","「他所賜的，有使徒，有先知，有傳福音的，有牧師和教師，」（4:11）"],["p","請你先看主詞。是「他」。動詞，是「賜」。"],["q","職分是升天的基督送給教會的禮物，不是教會頒給某些人的頭銜。"],["p","使徒被差去開拓，先知說造就安慰的話，傳福音的把好消息帶到牆外，牧師和教師餵養教導羊群。"],["p","原文最後兩個共用一個冠詞，所以有人讀成四種，有人讀成五種。"],["p","今天還有沒有使徒和先知，講義的全卷立場有整理。我只說一句：新約使徒是根基，根基只打一次。"],["p","開拓的工作、造就人的話，今天仍然需要；可是做這些事的人，不需要把它掛成頭銜。"],["p","這裡我必須把幾扇門關上，因為這一節在教會裡傷過人。"],["p","有人說：「我是神膏立的使徒，你們要在我的遮蓋底下。」"],["p","有人用一句「先知性的話」，替別人決定嫁給誰，換甚麼工作，搬到哪裡。"],["q","這些都是把禮物，變成了權柄。"],["p","沒有人可以拿職分，要求你絕對順服，要求你的奉獻和忠誠。"],["p","檢驗很簡單：一個職分是讓你更依賴他，還是讓你更能站起來服事？"],["p","答案就寫在下一節。"],["q","「為要成全聖徒，各盡其職，建立基督的身體，」（4:12）"],["p","「成全」，原文 καταρτισμὸν。同字根的動詞，福音書用在漁夫補網，醫生用在接骨。"],["q","加利利湖邊，天還沒亮。一個漁夫坐在船上，低著頭補網。"],["p","補網的人不是替網去抓魚，是讓網重新能用。"],["p","那五種職分，就是補網的人，接骨的人。把聖徒接好，讓聖徒自己去服事。"],["p","「各盡其職」，原文是「為了服事的工作」。做工的，是聖徒。"],["p","很多教會剛好倒過來：牧師講道、探訪、修水管，會眾坐在台下打分數。"],["p","牧者累垮了，會眾也沒有長大。這不是太忠心，是讀錯了這一節。"],["q","教練的成績，不是自己進了幾個球，是場上每一個人都會踢。"],["q","「直等到我們眾人在真道上同歸於一，認識神的兒子，得以長大成人，滿有基督長成的身量，」（4:13）"],["p","教會的身高尺，不是某一位屬靈偉人，是基督自己。"],["p","長大的反面，是「使我們不再作小孩子」（4:14）。"],["p","小孩子最危險的，是容易被帶走，像沒有錨的小船。"],["p","「人的詭計」，原文是擲骰子的人在作弊。有些教導很屬靈，背後卻在算計你的錢和忠誠。"],["p","那麼，怎樣長大？"],["q","「惟用愛心說誠實話，凡事長進，連於元首基督，」（4:15）"],["p","我們華人看重面子。為了和氣，當面不說，背後再說；或者忍到受不了，話像刀子。"],["p","只有真理沒有愛，是開刀不打麻藥。只有愛沒有真理，是只打麻藥不開刀。"],["p","用愛心說誠實話，是說他需要聽的話，用他接得住的方式。"],["p","再聽後半句：「連於元首基督」。"],["q","頭只有一個。沒有一位使徒、先知、牧師，可以站在頭的位置上。"],["p","然後，我們走到開場的第二個數字。"],["q","「全身都靠他聯絡得合式，百節各按各職，照著各體的功用彼此相助，便叫身體漸漸增長，在愛中建立自己。」（4:16）"],["p","第十一節那五種職分，到了第十六節，都消失在「全身」裡面了。"],["p","他們是關節，不是頭。"],["p","本系列哥林多前書講義第十二章講過："],["q","「頭也不能對腳說：我用不著你」（林前 12:21）"],["p","以弗所書再補一句：每一個關節，都在供應。"],["p","坐在最後一排、從來沒有上過台的那位阿伯，是一個關節。"],["p","在病床上為教會禱告的老姊妹，也是。少了一個，身體就會卡住。"],["p","經文說完了它自己的話，我們國度321空中團契才可以接上去。"],["p","我們說「建立屬神的體系」，本文就是第十二節：建立基督的身體。"],["p","我們說「235」裡的那個「5」，五重職份的團隊，名字從第十一節來。"],["p","可是第十二節和第十六節，量了這個團隊一次。"],["p","開拓的，說造就的話的，傳福音的，牧養的，教導的，是五種功能彼此配搭。"],["p","它不是五張名片，也不是五個坐在台上的人。沒有誰是誰的遮蓋，元首只有基督。"],["q","五重職份的團隊，是一個讓每一個人上場的團隊。"],["p","所以每一次檢討，只要問一句：那幾百個關節，有多少已經在供應了？"],["p","可是，一個身體裡的關節，怎樣才會願意彼此供應？保羅說，要先換一個人。"],["q","第三步：脫去與穿上。"],["p","保羅先帶我們往下看一條斜坡。"],["q","「良心既然喪盡，就放縱私慾，貪行種種的污穢。」（4:19）"],["p","這是這一章的谷底。起點很不起眼：心是「虛妄」的，就是空的。"],["p","空的心會昏暗，昏暗久了，就與神的生命隔絕，心長出一層厚繭。"],["p","「良心喪盡」，原文是失去了痛覺。第一次說謊，心會跳；第十次，就很自然了。"],["p","保羅講這條斜坡，不是要我們看不起人。第二章說，我們從前也是這樣。"],["p","從谷底往上的路，只有一句話。"],["q","「你們學了基督，卻不是這樣。」（4:20）"],["p","不是學了基督的道理。是學了基督。學的不是一套道理，是一個人。"],["q","規條告訴你哪裡不能去。一個人，卻能帶你去另一個地方。"],["p","這位老師教了三個動作。"],["q","「就要脫去你們從前行為上的舊人，這舊人是因私慾的迷惑漸漸變壞的；又要將你們的心志改換一新，並且穿上新人；這新人是照著神的形像造的，有真理的仁義和聖潔。」（4:22–24）"],["p","脫去，改換一新，穿上。這是換衣服的畫面。"],["p","脫去，是對從前那個人說不。穿上，是接受神親手裁好的新衣。"],["p","新人不是自己縫的，是「照著神的形像造的」。"],["p","中間那一句最常被跳過：「心志改換一新」。換衣服很快，心思的更新是天天的事。"],["p","經文說到這裡，321 才接上來。"],["p","我們常說：舊人有己的生命，變成新人無己的生命。這兩個詞，就是從這三節來的。"],["p","我們說「改變觀念就改變生命」，原文就是這一句「心志改換一新」。"],["p","第二章的「新人」，是一群人。"],["q","一個人脫去有己的舊人，才擠得進那一個新人裡面。"],["p","新人穿上了，穿在哪裡？保羅沒有給我們大異象，只給了幾件小事。"],["p","一句誠實話，一個不過夜的怒氣，一次饒恕。"],["q","「所以，你們要棄絕謊言，各人與鄰舍說實話，因為我們是互相為肢體。」（4:25）"],["p","保羅的理由不是「會被抓到」，是「互相為肢體」。"],["p","想像眼睛對腳說謊：前面沒有坑。腳踩下去，摔斷的是整個身體。"],["p","第二件小事，是全章最常被讀錯的一句。"],["q","「生氣卻不要犯罪；不可含怒到日落，」（4:26）"],["p","這是詩篇第四篇的原句。"],["p","有人讀成：基督徒不可以生氣。於是把怒氣吞下去，表面平靜，裡面發炎。"],["p","也有人讀成：我這是義怒。於是罵人有理。"],["p","保羅兩樣都沒有說。他允許生氣，可是畫了一條線：太陽下山以前。"],["q","意思是：怒氣要處理，不要收藏。"],["p","向神說出來，找一個人幫你一起處理。為甚麼這麼急？"],["q","「也不可給魔鬼留地步。」（4:27）"],["p","「地步」，原文 τόπον，一塊地方。沒有處理的怒氣，就是在家裡讓出一個房間給仇敵住。"],["p","偷竊的，要勞力做工，好分給缺乏的人：從「拿」轉到「給」。"],["q","「污穢的言語一句不可出口，只要隨事說造就人的好話，叫聽見的人得益處。」（4:29）"],["p","「造就」，和第十二節「建立」，原文是同一個字。一句好話，就是在建造基督的身體。"],["q","「不要叫神的聖靈擔憂；你們原是受了他的印記，等候得贖的日子來到。」（4:30）"],["p","聖靈不是一股能力，是一位會傷心的朋友。叫他傷心的，正是謊言、含怒、爛話。"],["p","可是印記蓋上了，他擔憂，卻沒有離開。我們不忍心，是因為被這樣愛著。"],["p","最後一件小事。"],["q","「一切苦毒、惱恨、忿怒、嚷鬧、毀謗，並一切的惡毒，都當從你們中間除掉；」（4:31）"],["p","第二十六節說不可含怒到日落。這一節讓我們看見，過了日落會怎樣。"],["p","怒氣沉下去，變成苦毒；苦毒發酵，變成惱恨；上了嘴，就是嚷鬧、毀謗。"],["q","「並要以恩慈相待，存憐憫的心，彼此饒恕，正如神在基督裡饒恕了你們一樣。」（4:32）"],["p","這一節我要讀得很小心，因為它常被拿來再傷一次受傷的人。"],["p","饒恕和和好，不是同一件事。"],["p","饒恕，是放下報復的權利，把審判交給神。可以在神面前開始，也可能需要很長的時間。"],["p","和好，是關係的恢復，需要對方真實的悔改，也需要安全。"],["q","「若是你的弟兄得罪你，就勸戒他；他若懊悔，就饒恕他。」（路 17:3）"],["p","如果有人對一位在家裡受暴力的姊妹說：你要饒恕，所以今天就回家。"],["p","那不是以弗所書四章三十二節，那是第二次傷害。"],["p","先保護人的安全。饒恕，可以在安全的地方慢慢發生。"],["p","如果你正在這樣的處境裡，請你今天就告訴一個信得過的人。"],["p","饒恕的力量，從後半句來：「正如神在基督裡饒恕了你們一樣」。"],["p","一個知道自己欠的一萬兩被免了的人，才放得下別人欠他的十兩。"],["p","我們的「920」裡，那個「2」，就是我要以恩慈相待的人。"],["p","舊人含怒過夜。新人在日落以前，把怒氣帶到神面前。"],["p","弟兄姊妹，最後，我們回到那兩個數字。"],["p","七個「一」，正中間的那一個，是「一主」。"],["p","幾百個關節，全部連到同一個頭上：元首基督。"],["p","這一位主，就是先降下來的那一位。"],["p","他降到十字架上，在那裡饒恕了我們；然後升上高天，把戰利品分給每一個人。"],["q","那降下的，就是升上去的。那饒恕你的，就是把恩賜交給你的。"],["p","你不必更佩服台上的人。台上的人，也只是一個關節。"],["p","你只要更認識這一位先降後升、在基督裡饒恕了你的主。"],["p","這個禮拜，請你做兩件小事。"],["p","第一件，找一個默默在供應、從來沒有人謝過的「關節」，對他說一句造就人的好話。"],["p","第二件，如果你心裡有一個怒氣，已經放了好幾個日落，"],["p","今天晚上，在太陽下山以前，把它帶到主面前，說出來。"],["p","然後對主說：主啊，你在基督裡饒恕了我，求你教我饒恕。"],["p","我們一起低頭禱告。"]]},"5":{"min":18,"blocks":[["h","《乃要被聖靈充滿》"],["p","弟兄姊妹平安，今天我們一起讀以弗所書第五章。"],["p","前幾年，我參加一位弟兄的婚禮。"],["q","一間不大的禮堂。新郎站在前面，新娘剛走完紅毯，花童還在找媽媽。"],["p","證婚的牧師打開聖經，說：我們來讀以弗所書第五章。"],["p","他讀的第一句是："],["q","「你們作妻子的，當順服自己的丈夫，如同順服主。」（5:22）"],["p","我坐的位置，剛好在新娘的朋友們後面。"],["p","我看見好幾位姊妹的眉頭，同時皺了起來。"],["p","另一邊，新郎的朋友們，有人在笑，有人用手肘頂了新郎一下。"],["p","牧師沒有停。他繼續往下讀。"],["q","「你們作丈夫的，要愛你們的妻子，正如基督愛教會，為教會捨己。」（5:25）"],["p","這一次，換新郎那一邊安靜了。"],["p","因為大家都聽得懂「捨己」是甚麼意思。那不是一個頭銜，那是一個十字架。"],["p","其實那位牧師，還是讀得太晚了。"],["p","他從第二十二節開始讀。可是保羅不是從那裡開始說的。"],["p","保羅在第二十二節之前，先說了一句話。再往前，又說了一句更大的話。"],["p","今天，我們就從前面一路讀過來。"],["p","這一章有三個字：愛，光，滿。"],["p","我們走三步：憑愛心行事，光明的子女，彼此順服。"],["q","第一步：憑愛心行事。"],["q","「所以，你們該效法神，好像蒙慈愛的兒女一樣。」（5:1）"],["p","這是新約裡最大膽的一句命令。"],["p","保羅常說「效法我」。可是這裡，他把標竿一下子放到最高：效法神。"],["p","可是請你聽後半句：好像蒙慈愛的兒女一樣。"],["p","這不是學徒照著師傅的圖紙做。是小孩學爸爸走路。"],["p","你看過一個三歲的男孩，穿上爸爸的皮鞋，在客廳裡一步一步走嗎？"],["q","效法神的人，先是被神抱過的人。"],["p","次序不能倒過來。不是你學得像了，神才愛你。是神愛你，所以你越來越像他。"],["p","那麼，效法神的甚麼？"],["p","第一節開頭有一個「所以」。這個「所以」，接的是上一章最後一句。"],["q","「並要以恩慈相待，存憐憫的心，彼此饒恕，正如神在基督裡饒恕了你們一樣。」（4:32）"],["p","效法神，第一件事，是像神那樣饒恕人。"],["p","第二件事，保羅說得更具體。"],["q","「也要憑愛心行事，正如基督愛我們，為我們捨了自己」（5:2）"],["p","「行事」這個字，原文是走路。從第四章第一節起，保羅一直在講怎樣走。"],["p","前三章，我們和基督一同坐在天上。從這裡起，要把那個位置，一步一步走出來。"],["p","先坐，才會行。"],["p","「捨了自己」，原文是把自己交出去。"],["q","愛不是一種感覺，是一個動作：把自己交出去。"],["p","我們團契常講「捨己」。捨己的榜樣，就在這一節。"],["p","不是先等自己被愛夠了才去愛。是因為已經被愛到這個地步，所以捨得。"],["p","接著，保羅講了兩件我們在教會裡不太喜歡講的事。"],["q","「至於淫亂並一切污穢，或是貪婪，在你們中間連提都不可，方合聖徒的體統。」（5:3）"],["p","上一節是基督把自己給出去。這一節，是人把不屬於自己的拿過來。"],["p","愛是給。淫亂和貪婪，是拿。"],["p","然後他寫了一句很不客氣的話。"],["q","「有貪心的，就與拜偶像的一樣。」（5:5）"],["p","保羅說，貪心也是這一類。"],["p","今天的教會，對淫亂常常很警覺，對貪婪卻很寬容。"],["p","一個人不燒香，可是每天為帳戶的數字興奮、焦慮、睡不著，他其實也在拜。"],["p","保羅給的解藥，不是更節省，是換一張嘴。"],["q","「淫詞、妄語，和戲笑的話都不相宜；總要說感謝的話。」（5:4）"],["p","貪婪說：我還不夠。感謝說：我已經領受了。"],["p","第五節說這樣的人「在基督和神的國裡都是無分的」，這句話很重。"],["p","保羅說的，是把這些當成生活方式、不肯回頭的人。不是一次跌倒、心裡痛悔的人。"],["p","那是我們從前的樣子，不再是如今的樣子。"],["p","這就把我們帶到第二步。"],["q","第二步：光明的子女。"],["q","「從前你們是暗昧的，但如今在主裡面是光明的，行事為人就當像光明的子女。」（5:8）"],["p","請你仔細聽這一句的動詞。"],["p","保羅沒有說：從前你們在黑暗裡，如今你們在光明裡。"],["p","他說：從前你們「是」黑暗。如今你們「是」光。"],["p","原文兩個都是名詞。不是換了一個房間，是換了一個人。"],["q","不是換了環境，是換了本質。"],["p","基督徒是一個已經被點亮、正在學怎樣照亮的人。"],["p","可是請你不要漏掉「在主裡面」這四個字。"],["p","月亮會亮，是因為它對著太陽。它一轉過去，就暗了。"],["p","主耶穌說："],["q","「我是世界的光。跟從我的，就不在黑暗裡走，必要得著生命的光。」（約 8:12）"],["p","我們是光，因為他是光。"],["q","「光明所結的果子就是一切良善、公義、誠實。」（5:9）"],["p","有些古卷這裡寫的是「聖靈的果子」。多數學者認為原來是「光明」，和合本也是這樣譯。"],["p","那是抄寫的人想起了加拉太書。本系列加拉太書講義第五章講過「聖靈所結的果子」。"],["p","那裡是九樣，這裡是三樣。可是兩處的「果子」，原文都是單數。"],["p","在辦公室不作假帳，在家裡不說兩套話，在教會不假裝屬靈，這就是光在結果子。"],["p","然後保羅引了一段話。"],["q","「所以主說：你這睡著的人當醒過來，從死裡復活！基督就要光照你了。」（5:14）"],["p","這句話在舊約裡找不到一模一樣的經文。"],["p","很多學者認為，這可能是第一代信徒唱的一首歌。這使我們想起以賽亞書裡「興起，發光」的呼喚。"],["p","可是這首歌放在這裡，是唱給信徒聽的。"],["p","基督徒也會睡著。不是失去救恩，是對罪麻木了，對光遲鈍了。"],["q","屬靈的瞌睡最危險的地方，是睡著的人不知道自己睡著了。"],["p","所以需要有人喊一聲。也許今天，就是那一聲。"],["q","「要愛惜光陰，因為現今的世代邪惡。」（5:16）"],["p","「愛惜光陰」，原文是把時機買回來。"],["p","時間不是中性的。你不用，別的東西就會替你用掉。手機會用，焦慮會用，沒有盡頭的工作也會用。"],["p","愛惜光陰，不是把行事曆塞滿。"],["p","是和孩子吃一頓不看手機的飯。是對一位同事，說一句真誠的話。"],["p","現在，我們來到這一章的中心。"],["q","「不要醉酒，酒能使人放蕩；乃要被聖靈充滿。」（5:18）"],["p","保羅把兩種「被灌滿」放在一起。"],["p","保羅說，醉酒帶來的是放蕩。被聖靈充滿帶來的，卻是一個人成為真正的自己。"],["p","「被充滿」這個字，原文有三個特徵。我只講這三個，你帶回家就好。"],["p","它是命令。不是建議，不是少數人的特別經歷。是每一個信徒都要的。"],["p","它是被動的。你不能咬緊牙關把自己充滿。你只能打開、交出，讓他來作。"],["p","它是現在式。天天要。昨天的充滿，不夠今天用。"],["p","那麼，被聖靈充滿的人，看起來是甚麼樣子？"],["p","這裡我們要很小心，因為兩邊都有溝。"],["p","一邊的溝，是把聖靈充滿講成某一種外在的現象。"],["p","沒有倒下，沒有發抖，沒有說方言，就說你沒有被充滿。"],["p","這些現象在教會歷史上出現過，有的是真實的經歷。"],["q","可是經文自己，沒有把任何一種現象當作唯一的記號。"],["p","另一邊的溝，是怕情緒化，乾脆不談聖靈充滿。"],["p","可是這是神的命令。避而不談，不是謹慎，是不順服。"],["p","恩賜和方言的爭議，講義的議題頁有並陳，我今天不在這裡展開。"],["p","我只請你看，保羅自己怎樣回答這個問題。"],["p","原文第十八節是一個命令，後面接著五個分詞。像一棵樹，長出五根枝子。"],["q","「當用詩章、頌詞、靈歌彼此對說，口唱心和地讚美主。」（5:19）"],["p","對說。唱。讚美。這是三根。"],["p","請你注意「彼此對說」。我們唱詩，不只唱給神聽，也唱給旁邊的人聽。"],["q","「凡事要奉我們主耶穌基督的名常常感謝父神。」（5:20）"],["p","感謝。這是第四根。"],["p","寫這封信的人，手上綁著鎖鍊。他說「凡事」。"],["p","這不是假裝苦難是好的。是相信在一切事上，父神沒有離開。"],["p","抱怨，其實也是一種醉酒：被情緒灌滿了。"],["p","然後是第五根。"],["q","「又當存敬畏基督的心，彼此順服。」（5:21）"],["p","弟兄姊妹，你聽見了嗎？"],["p","被聖靈充滿的第五個記號，不在聚會的高潮裡。"],["q","被聖靈充滿的人，回到家，會彼此順服。"],["p","你可以在台前倒下，也可以在台前很安靜。經文要問的是：你回到家，對家人是甚麼樣子？"],["p","現在，我們終於走到那位證婚牧師開始讀的地方了。"],["p","可是這一次，我們不是從第二十二節走進去的。我們是從第十八節，一路走過來的。"],["q","第三步：彼此順服。"],["p","我請你把這四節經文，連在一起聽。"],["q","「乃要被聖靈充滿。」（5:18）"],["q","「又當存敬畏基督的心，彼此順服。」（5:21）"],["q","「你們作妻子的，當順服自己的丈夫，如同順服主。」（5:22）"],["q","「你們作丈夫的，要愛你們的妻子，正如基督愛教會，為教會捨己。」（5:25）"],["p","這是同一口氣說出來的。"],["p","我要告訴你一個原文的細節。第二十二節，原文其實沒有動詞。"],["p","直譯是：妻子們，對自己的丈夫，如同對主。"],["p","「順服」這個動詞，是從第二十一節借過去的。有些古卷補上了，和合本也補上了。"],["p","可是中文在第二十一節後面分了段，我們很容易從第二十二節開始讀，就看不見第二十一節。"],["q","妻子的順服，是全家彼此順服的一部分；而彼此順服，是被聖靈充滿的果子。"],["p","「彼此」這兩個字，在那個時代是很刺耳的。"],["p","當時希臘羅馬的家規，只對下面的人下命令。妻子要服從，兒女要服從，奴隸要服從。"],["p","家主坐在上面，沒有人對他說甚麼。"],["p","保羅卻直接對妻子說話，把她當成一個能夠自己回應基督的人。"],["p","然後他轉過身，對丈夫說話。而且說得比對妻子長得多。"],["p","對妻子，是三節。對丈夫，是九節。"],["p","順服的根據是甚麼？「存敬畏基督的心」。"],["p","這同時是一道界線。既然是敬畏基督，就沒有任何人，可以用順服的名義，要我違背基督。"],["p","第二十四節說「凡事順服」。可是第二十二節已經說了：如同順服主。"],["q","「順從神，不順從人，是應當的。」（徒 5:29）"],["p","所以，有一句話，我今天要說得非常清楚。"],["q","順服，絕不包括忍受暴力、虐待、控制，或被迫犯罪。"],["p","如果你今天坐在這裡，在家裡被打、被威脅、被控制，不能自己決定見誰、花甚麼錢。"],["p","請你聽清楚：這段經文沒有要你忍下去。"],["p","神沒有要你為了順服，把自己和孩子留在危險裡。"],["p","請你先讓自己安全。請你告訴一位信得過的人，告訴教會的同工。必要的時候，報警，尋求專業的幫助和庇護。"],["p","教會的第一件事，是保護你的安全。不是勸你回家更順服一點，也不是叫你為了孩子忍一忍。"],["p","一個人若拿第二十二節打妻子，他已經先違背了第二十一節，也違背了第二十五節。"],["p","他離開的，不是妻子的期待。他離開的，是這段經文。"],["q","「因為丈夫是妻子的頭，如同基督是教會的頭；他又是教會全體的救主。」（5:23）"],["p","「頭」怎樣理解，敬重聖經的弟兄姊妹有不同的看法。"],["p","互補派認為，夫妻在神面前完全平等，角色不同，丈夫的帶領是捨己的帶領。"],["p","平等派認為，彼此順服是原則，後面是保羅在當時處境裡的應用。"],["p","兩派都是福音派，都敬重聖經。講義的議題頁和全卷立場有並陳，我不替你們每一個家決定分工。"],["p","可是請你看，經文自己怎樣替「頭」下定義：他又是教會全體的救主。"],["p","基督怎樣作頭？他為身體死。"],["q","在這段經文裡，作頭的人，是第一個上十字架的人。"],["p","所以，作丈夫的弟兄們，現在輪到我們了。"],["p","請你回想第二節：「正如基督愛我們，為我們捨了自己」。"],["p","第二十五節幾乎是同一句話：「正如基督愛教會，為教會捨己。」"],["p","「捨己」，和第二節是同一個字。把自己交出去。"],["p","我們男人很容易在外面捨己。為客戶捨己，為事工捨己，為老闆捨己。"],["p","回到家，卻坐下來，等人服事。"],["p","保羅把捨己的戰場，定在餐桌旁。"],["q","「要用水藉著道把教會洗淨，成為聖潔，可以獻給自己，作個榮耀的教會」（5:26–27）"],["p","基督的愛有方向。他愛教會，是要她更美好，不是要她更依附。"],["p","這給每一位丈夫一個檢驗：我的愛，使她更自由、更成長、更像基督嗎？"],["p","還是使她更害怕、更縮小？"],["q","真正的頭，使身體興旺，不是使身體萎縮。"],["p","第二十九節說「保養顧惜」。保養是餵養，顧惜是給溫暖。像一個人把冷的手放到懷裡暖一暖。"],["p","冷漠，也是一種不愛。"],["p","然後，保羅引了伊甸園的那一句話。"],["q","「為這個緣故，人要離開父母，與妻子連合，二人成為一體。」（5:31）"],["p","本系列創世記講義第二章講過這一節：亞當醒來，說出人類第一首情詩。"],["p","接下來，保羅說了一句讓所有人都停下來的話。"],["q","「這是極大的奧祕，但我是指著基督和教會說的。」（5:32）"],["p","原來，神在伊甸園設立第一場婚禮的時候，心裡已經有一幅更大的圖畫。"],["q","基督與教會才是原版。婚姻，是神放在人間的一張複製畫。"],["p","所以你的婚姻，不只是兩個人的事。它是要讓世界看見，基督怎樣愛他的教會。"],["p","這也是為甚麼，單身的弟兄姊妹，這段經文一樣是寫給你的。"],["p","因為那個原版的婚姻裡，你和我都在其中。我們都是那位新郎所愛的。"],["q","「然而，你們各人都當愛妻子，如同愛自己一樣。妻子也當敬重她的丈夫。」（5:33）"],["p","「敬重」這個字，和第二十一節「敬畏基督」，原文是同一個字根。"],["p","整段從敬畏基督開始，在敬重收尾。中間是彼此順服，和捨己的愛。"],["p","可是敬重不是懼怕。一個妻子如果活在對丈夫的恐懼裡，那個家已經病了。需要的是幫助和保護。"],["p","弟兄姊妹，我們回到那場婚禮。"],["p","新娘走進來的時候，大家都回頭看她。"],["p","可是你有沒有注意過，那一刻，有一個人沒有回頭。"],["p","是站在前面的新郎。他一直看著她，從她走進門，一直看到她走到身邊。"],["p","第二十七節說，基督要把教會「獻給自己」。"],["q","原來，在每一場婚禮的前面，都還站著另一位新郎。"],["p","他不是等新娘把自己打扮好了，才肯愛她。"],["p","他先為她捨了自己。是他親手把她洗淨，親手把她帶到自己面前。"],["q","「毫無玷污、皺紋等類的病，乃是聖潔沒有瑕疵的。」（5:27）"],["p","今天坐在這裡的你，也許覺得自己滿身皺紋、滿身玷污。"],["p","請你聽：那不是你努力的結果。是他捨己的結果。"],["p","我們效法神，是因為先被他愛。我們是光，是因為他照亮了我們。"],["p","我們能彼此順服、彼此捨己，是因為他先為我們捨了自己。"],["p","你不必更佩服保羅，也不必更佩服今天的講員。請你更認識那位站在前面、一直看著你的主。"],["p","這個禮拜，我想請你做兩件很小的事。"],["p","第一件，每天早上，用一句話求：主啊，今天請你充滿我。"],["p","然後晚上回家的時候，看看自己有沒有說一句感謝的話，有沒有在一件小事上，讓一讓家人。"],["p","第二件，請你回到家，讀一次這段經文。從第十八節開始，讀到第三十三節。一節都不要跳過。"],["p","如果你在家裡正受著傷害，請你這個禮拜，就找一個人說出來。教會願意陪你。"],["p","我們一起低頭禱告。"]]},"6":{"min":17,"blocks":[["h","《還能站立得住》"],["p","弟兄姊妹平安，今天我們一起讀以弗所書第六章，這封信的最後一章。"],["p","今天開頭，我想借一個人的口，說幾句話。"],["p","他沒有在經文裡留下名字，可是保羅寫這一章時，他一定就在旁邊。"],["p","他是一個羅馬士兵。他的鎖鍊，一頭扣在自己手上，一頭扣在保羅手上。"],["p","請你聽，下面是我替他說的話。"],["q","羅馬，一間租來的屋子。輪到我值班，六個鐘頭。"],["q","「我是看守這個囚犯的兵。鎖鍊很短，他走到哪裡，我就得跟到哪裡。」"],["q","「別的囚犯會罵人、會哭。這個人不一樣，他一直在口述，叫人寫下來。」"],["q","「今天他寫給孩子、父親、奴隸、主人。哪有人寫信，直接跟奴隸說話的？」"],["q","「後來他停下來看著我：我的帶子、護心鏡、鞋、盾牌、頭盔，最後是我腰間的短劍。」"],["q","「然後他又開口了：要穿戴神所賜的全副軍裝。」"],["q","「我穿軍裝，是為了看住他。他口中的軍裝，卻是為了叫人站得住。」"],["q","「鎖鍊扣著我們兩個人。到底是誰在看守誰？」"],["p","他心裡的那個問題，我們今天帶著走。"],["p","被鎖住的人，在教鎖他的人，怎樣站得住。"],["p","這一章有三個字：家，甲，站。"],["p","我們沿著它走三步：家裡的前線，站立得住，禱告與不朽壞的愛。"],["q","第一步：家裡的前線。"],["p","一章講屬靈爭戰的經文，為甚麼先講家，再講工作？"],["p","因為保羅講完家和工作，下一句就是："],["q","「我還有末了的話：你們要靠著主，倚賴他的大能大力作剛強的人。」（6:10）"],["p","屬靈爭戰的前線，不先在異象裡，先在餐桌旁，在辦公桌旁。"],["q","「你們作兒女的，要在主裡聽從父母，這是理所當然的。」（6:1）"],["p","那個時代的家規，是寫給一家之主看的，教他怎樣管人。"],["p","保羅卻是直接對孩子開口。"],["p","在保羅眼中，一個孩子，也是一個能自己回應主的人。"],["p","「聽從」這個字，原文是「在底下聽」。聽進去，照著做。"],["p","可是保羅加了三個字：在主裡。"],["p","一面是動力：孩子聽話，是跟從主的一部分。"],["p","一面是界線：父母若要求違背主的事，兒女可以不聽從，卻仍要孝敬。"],["q","「要孝敬父母，使你得福，在世長壽。」（6:2）"],["p","「聽從」，是對在家受養育的孩子說的。"],["p","「孝敬」，是一生的責任。"],["p","小時候聽從，長大了尊重，父母老了，照顧奉養。"],["p","華人的孝道與這一節相合的地方，基督徒應該做得更好。"],["p","可是孝敬，不等於讓父母替成年兒女決定一切。"],["p","成年兒女的婚姻、信仰、呼召，是在主面前自己負責的。"],["p","以孝為名操控成年兒女，不是第二節的孝。"],["p","可以溫柔地拒絕那一件事，卻不撤回對父母的尊敬。"],["p","然後保羅立刻轉身，對父親說話。"],["q","「你們作父親的，不要惹兒女的氣，只要照著主的教訓和警戒養育他們。」（6:4）"],["p","在羅馬法裡，父親幾乎有絕對的權柄，甚至可以賣掉兒女。"],["p","對這樣的父親說「不要惹兒女的氣」，是一句很新的話。"],["p","「惹氣」和第四章的「含怒」，是同一個字根。"],["p","這裡是叫父親，不要成為孩子怒氣的來源。"],["p","華人很熟悉「不打不成器」。保羅沒有廢掉管教。"],["p","他廢掉的是激怒：羞辱、比較、失控的打罵、永遠達不到的標準。"],["p","孩子的怒氣，有時候不是叛逆，是被惹出來的。"],["p","要問的不是「我有沒有權」，是「這是主的管教，還是我的脾氣」。"],["p","「養育」這個字，第五章用在基督保養教會身上。"],["p","肯在孩子面前認錯的爸爸，正在教孩子：家裡最大的是主。"],["q","「你們作僕人的，要懼怕戰兢，用誠實的心聽從你們肉身的主人，好像聽從基督一般。」（6:5）"],["p","以弗所城裡，大約三分之一的人是奴隸。"],["p","保羅沒有建立奴隸制，也沒有替它辯護。"],["p","他先改變了制度裡的人。"],["p","後來他說阿尼西母「不再是奴僕，乃是高過奴僕，是親愛的兄弟」（門 1:16）。"],["p","廢除奴隸制的種子，就種在這裡。"],["p","今天的職場不是奴隸制，原則卻天天用得上。"],["q","「不要只在眼前事奉，像是討人喜歡的」（6:6）"],["p","原文是一個很特別的字：眼睛，加上服事。"],["p","就是主管在的時候一個樣，主管走了另一個樣。"],["p","職場基督徒的試金石，是沒有人看見的那一個鐘頭。"],["q","「甘心事奉，好像服事主，不像服事人。」（6:7）"],["p","這一節，是職場基督徒最重要的一節。"],["p","一個奴隸洗的碗，明天還要洗。他抄的帳簿，屬於別人。"],["p","保羅沒有說不累。他說，這些事有另一位觀眾。"],["p","只做給老闆看的人，可以停止表演了。"],["p","怎樣做都得不到肯定的人，你的評分表不在老闆手上。"],["p","主看見，主記帳，主會還。"],["p","可是「好像聽從基督一般」，也是一條界線。"],["p","基督不會叫人作假帳，不會叫人違法，不會叫人說謊。"],["p","所以第五節，不包括聽老闆的話去作假，也不包括忍受霸凌或性騷擾。"],["p","向公司申訴，找人幫忙，必要時離開，都不違背這一節。"],["p","保羅也對主人說："],["q","「你們作主人的，待僕人也是一理，不要威嚇他們。因為知道，他們和你們同有一位主在天上；他並不偏待人。」（6:9）"],["p","他把剛才對奴隸說的，原封不動交給主人。"],["p","「不要威嚇」，原文是把那個恐嚇放下。"],["p","為甚麼？因為你頭上也有一位主。"],["p","保羅把主人拉下來，和奴隸站在同一排。"],["p","地上的主人頭上，有一位天上的主。"],["p","今天的老闆、主管，都在這一節裡：不威嚇，不拿飯碗當籌碼。"],["p","帶小組的、作長執的，也在這裡。"],["p","你看，兒女與父親，僕人與主人，每一組都是雙向的。"],["p","而且對握有權柄的那一方，要求得更重。"],["p","不能拿第五節叫人無條件服從，也不能拿第九節煽動對立。"],["p","細節，講義的全卷立場有整理。"],["p","可是答案的根，就在第九節那一句：同有一位主在天上。"],["p","家裡和職場，是天天開打的前線。"],["p","講完家，保羅才抬頭，看那位士兵的軍裝。"],["q","第二步：站立得住。"],["p","信的最後一段，第一個命令不是「去打」。"],["p","是「要剛強」。"],["p","原文是現在式、被動的命令：要一直被加上力量。"],["p","被動：力量不是擠出來的。現在式：每天都要。"],["p","「大能大力」，就是第一章叫基督復活的那股力量。"],["q","叫基督從死裡復活的力量，就是你今天站立的力量。"],["q","「要穿戴神所賜的全副軍裝，就能抵擋魔鬼的詭計。」（6:11）"],["p","「全副軍裝」，是重裝步兵的全套裝備。"],["p","「詭計」是複數，一整套；所以裝備也要一整套。"],["p","保羅沒有明說引用，可是以賽亞書裡，穿軍裝的是神自己："],["q","「他以公義為鎧甲，以拯救為頭盔」（賽 59:17）"],["p","這使我們想起：神把自己的軍裝，借給了我們。"],["q","「因我們並不是與屬血氣的爭戰，乃是與那些執政的、掌權的、管轄這幽暗世界的，以及天空屬靈氣的惡魔爭戰。」（6:12）"],["p","「爭戰」這個字，原文是摔跤。"],["p","不是遠遠地射箭，是貼身的扭打。"],["p","你的對手，不是傷你的同工，不是頂撞你的兒子，也不是難纏的老闆。"],["p","把人當成敵人，正好中了魔鬼的詭計。"],["p","那麼，這些執政的、掌權的，是誰？"],["p","是真實的靈界勢力，不是比喻；它們也透過人間的結構運作。"],["p","所以爭戰既在禱告裡，也在說誠實話、行公義、拒絕貪婪裡。"],["p","以弗所是一座法術之城，到處是護身符。"],["p","使徒行傳講義第十九章講過，有人拿耶穌的名當咒語，被惡鬼反問："],["q","「耶穌我認識，保羅我也知道。你們卻是誰呢？」（徒 19:15）"],["q","「平素行邪術的，也有許多人把書拿來，堆積在眾人面前焚燒。」（徒 19:19）"],["p","讀這封信的人，有些就是當年燒書的人。"],["p","他們需要的，不是更強的符咒，"],["p","是知道自己站在誰的力量裡。"],["q","「所以，要拿起神所賜的全副軍裝，好在磨難的日子抵擋仇敵，並且成就了一切，還能站立得住。」（6:13）"],["p","第十一、十三、十四節，四次「抵擋」「站立」，"],["p","原文都是同一個字根：站。"],["p","保羅沒有叫他們衝，叫他們站。"],["p","為甚麼是站，不是衝？因為勝負已經定了。"],["p","基督已經坐在一切執政掌權的之上，我們也和他一同坐在天上。"],["q","爭戰，是從得勝的位置出發，不是為了得勝。"],["p","這段沒有捆綁地域邪靈，沒有屬靈地圖，沒有點名驅趕。"],["p","保羅只說了四次：站住。"],["p","前三章坐，第四、五章行，這裡站。"],["p","先坐，才會行；會行，才站得住。"],["p","那麼，站的時候，穿甚麼？"],["q","「所以要站穩了，用真理當作帶子束腰，用公義當作護心鏡遮胸，」（6:14）"],["p","第一件是真理。說謊的人站不住。"],["p","第二件是公義，護心鏡護住要害，也護住你的心。"],["p","第三件，軍人的鞋，叫作「平安的福音」。"],["p","羅馬兵的鞋底有釘子，是為了站穩。"],["p","基督拆毀了隔斷的牆。會打屬靈仗的教會，該是最能讓不同的人坐在一起的教會。"],["p","不是最會分裂的教會。"],["q","「此外，又拿著信德當作盾牌，可以滅盡那惡者一切的火箭；」（6:16）"],["p","士兵的大盾是門形的，遮住整個人。"],["p","上陣前把皮面浸濕，火箭就熄了。"],["p","盾牌還能一面一面連起來。"],["p","旁邊弟兄姊妹的盾牌，常常比你自己的更早擋住。"],["q","「並戴上救恩的頭盔，拿著聖靈的寶劍，就是神的道；」（6:17）"],["p","「戴上」，原文是接過來。是遞給你的。"],["p","懷疑和控告都打在頭上。救恩是神給的，不靠感覺保住。"],["p","寶劍，是唯一往前刺的一件。"],["p","「神的道」，原文偏重說出口的話。"],["p","主耶穌在曠野，三次用經上的話回答。不是念咒。"],["q","所以，經文不是咒語。"],["p","經文本身沒有魔力。力量在於它是聖靈的、真的，被信的人在對的時候說出來。"],["p","六件軍裝，沒有一件是儀式，沒有一件是口訣。"],["p","全副軍裝，是品格與真理。"],["p","穿上它，是在家說真話，在職場行公義。"],["p","在家說謊的父親，禱告再大聲，腰上也沒有帶子。"],["p","家與職場，就是軍裝每天試穿的地方。"],["p","還有兩句實際的話。"],["p","基督徒不必怕鬼月、風水、廟口。"],["p","「從前你們是暗昧的，但如今在主裡面是光明的」（5:8）。"],["p","在基督裡的人，不在黑暗權勢底下。"],["p","可是也不拜、不求、不戴護身符、不擇日。"],["p","第二句，不要輕易說一個人被鬼附。"],["p","精神上的困擾，先陪他看醫生，同時為他禱告，兩者不衝突。"],["p","魔鬼的詭計是真的，可是不要把每個問題都講成鬼。"],["p","魔鬼的地步，常常是從一個帶過夜的怒氣開始。"],["q","聽完這一段，你要更平安，不是更害怕。"],["p","軍裝穿好，照理該衝鋒了。"],["p","保羅卻叫人跪下。"],["q","第三步：禱告與不朽壞的愛。"],["q","「靠著聖靈，隨時多方禱告祈求；並要在此警醒不倦，為眾聖徒祈求，」（6:18）"],["p","原文這一節，是接著軍裝說下來的。"],["q","禱告不是第七件軍裝。禱告，是穿戴每一件軍裝的方式。"],["p","四個「一切」：一切禱告、一切時候、一切恆忍、一切聖徒。"],["p","「警醒」是不睡，守夜的字。"],["p","我們也有一個夜班：為彼此禱告。"],["p","為眾聖徒，不只為自己這一隊。"],["p","站立得住的人，從來不是一個人站著的。"],["p","保羅也為自己求。"],["q","「也為我祈求，使我得著口才，能以放膽開口講明福音的奧祕，」（6:19）"],["p","他沒有求出獄。他求開口的膽量。"],["q","「我為這福音的奧祕作了帶鎖鍊的使者」（6:20）"],["p","使者本來不可碰，這一位卻戴著鎖鍊。"],["p","鎖鍊沒有取消他的身分，反而成了他的講台。"],["p","我們開頭那位士兵，就站在這個講台的第一排。"],["p","保羅最後的戰術，是禱告和傳福音。"],["p","代禱不只求處境改變，也求在處境裡能開口。"],["p","信快寫完了。保羅提到一個人。"],["q","「今有所親愛、忠心事奉主的兄弟推基古」（6:21）"],["p","最後出場的，是一位送信的弟兄。"],["p","先是親愛的弟兄，再是忠心的執事。"],["p","一封講爭戰的信，是由帶著安慰的人送到的。"],["p","他就是「百節各按各職」裡的一節。"],["p","然後，是全卷的最後兩句。"],["q","「並願所有誠心愛我們主耶穌基督的人都蒙恩惠！」（6:24）"],["p","「誠心」，原文是「在不朽壞之中」，"],["p","是整封信最後一個字。"],["p","直譯：願恩典與一切用不朽壞的愛愛主的人同在。"],["p","「不朽壞」，是一個復活的字。"],["p","「這必朽壞的總要變成不朽壞的」（林前 15:53）。"],["p","不會因時間、失望、苦難而腐爛的愛。"],["p","這使我們想起以弗所教會後來的消息。"],["p","三十年後，復活的主說："],["q","「然而有一件事我要責備你，就是你把起初的愛心離棄了。」（啟 2:4）"],["p","啟示錄沒有引用以弗所書，可是並讀，叫人心裡一沉。"],["p","教義還在，勞碌還在，分辨假使徒的本事也還在。"],["p","愛，不在了。"],["q","一間很會站立得住的教會，還愛主嗎？"],["p","全副軍裝的第一件，是真理。全信的最後一個字，是愛。"],["p","真理讓人站得住。愛讓人站得久。"],["p","我們回到那位士兵。"],["p","鎖鍊扣著兩個人，誰在看守誰？"],["p","他也許沒有想到，那個被鎖著的人，比他站得更穩。"],["p","因為保羅的力量，不在手腕上，在「靠著主」。"],["p","先是「靠著主」，倚賴叫基督復活的大能大力。"],["p","再是「站立得住」，在家、在職場、在磨難的日子。"],["p","然後是「隨時多方禱告」，為眾聖徒守夜。"],["p","最後是愛，用不朽壞的愛，愛我們的主耶穌基督。"],["p","次序不能倒過來。"],["p","是得勝的主，先把力量、軍裝、恩典給了我們。"],["p","他的愛從來不朽壞，所以我們的愛，才有可能不朽壞。"],["q","我們站得住，是因為他先站在我們這一邊。"],["p","你不必更佩服保羅，也不必更佩服今天的講員。你只要更愛這一位主。"],["p","這個禮拜，我想請你做三件很小的事。"],["p","第一件，在握有權柄的地方問：我在惹誰的氣？"],["p","記得，你頭上也有一位主。"],["p","第二件，在沒有人看見的時候，做一件事給主看。"],["p","第三件，每天叫著名字，為一位肢體禱告。"],["p","站不住的時候，記得第十節是被動的。"],["p","力量不是你擠出來的。是他一直加給你的。"],["p","最後的祝福，是給所有愛主的人。"],["p","我們一起低頭禱告。"]]}},"issues":[{"id":"ISS00_1","t":"書信的處境與原則——一封傳閱信寫給誰？今天的以弗所在哪裡？","r":"1:1；4:17--19；5:5--8；6:12","ch":[],"why":"一、原則照守、落點隨處境——沿用哥林多前書立場一（林前 ISS00_1），本卷補述傳閱信的處境：偶像、法術與族群隔閡之城裡的神的家。以弗所書和哥林多前書、加拉太書不一樣：沒有具名的對手、沒有一個要回答的問題、沒有一個人名的問安。於是有人把它讀成一篇沒有處境的神學論文，有人費力去重建一場信裡根本沒有提的危機。這封信的「處境」到底是甚麼、今天的以弗所在哪裡，必須在開卷講定，全卷每一章的落點才不會飄在半空。","pos":[["【一】經文問的是甚麼","","<p>書信的總原則，本講義沿用哥林多前書立場一，不重寫：保羅寫信給特定地區、特定年代、遇到特定問題的教會；讀信的人要先找出他的「因為」，原則照守，落點隨處境，判斷的理由一定要講出來。全卷每一章照「書信」三問來讀：以弗所人（與亞細亞眾教會）遇到甚麼？保羅從福音推出甚麼原則？今天這原則落在哪裡？</p><p>本卷要補的只有一段：<strong>以弗所書很可能是一封傳閱信。</strong>保羅在以弗所住了將近三年（〔背景〕徒 19:10；20:31），這封信卻沒有一個人名的問安——對照羅馬書第 16 章，他向一間還沒去過的教會問候了二十多個名字。信裡的口氣也像是寫給一部分不認識他的人：「因此，我既聽見你們信從主耶穌，親愛眾聖徒」（1:15），「諒必你們曾聽見神賜恩給我，將關切你們的職分託付我」（3:2）。三份最早的抄本，1:1 也沒有「在以弗所」幾個字（見 ISS00_6）。</p><p><strong>經文問的是：一封沒有回應某一場危機的信，還有「處境」可言嗎？若有，那是甚麼樣的處境？今天的讀者要把這封信放在哪一座城市裡讀？</strong></p>"],["無處境論文說（傳閱信沒有特定處境，應當當成一篇超越時空的神學綱要來讀）","","<p>認為以弗所書既然沒有對手、沒有問題、沒有問安，就是保羅（或他的門生）把一生的神學濃縮成的一篇綱要：揀選、救贖、教會、合一、成聖、爭戰，一樣一樣排好。所以讀以弗所書不必問處境，直接抽出教義就可以了。這派抓住了一件真實的事：這封信確實比保羅其他書信都更寬、更高，從「創立世界以前」（1:4）一路講到「直到世世代代，永永遠遠」（3:21），讀起來像一首頌歌，不像一封回信。</p><p><strong>難處：</strong>信裡的處境其實到處都是，只是不針對某一個人。保羅提醒收信人「你們從前按肉體是外邦人」（2:11），描寫他們從前「活在世上沒有指望，沒有神」（2:12）；他叮嚀「不要再像外邦人存虛妄的心行事」（4:17），說「有貪心的，就與拜偶像的一樣」（5:5），又把整封信收在「與那些執政的、掌權的、管轄這幽暗世界的……爭戰」（6:12）。這些不是抽象的教義，是一群剛從偶像、法術與族群敵意裡走出來的人每天要面對的事。把處境拿掉，以弗所書就從一封家書變成一份講義，讀的人也就不知道該在哪裡站。</p>"],["單一危機重建說（從信裡的蛛絲馬跡重建一場具體的危機）","","<p>認為每一封書信背後都一定有一場具體的危機，以弗所書也不例外，只是需要重建。有學者認為是猶太信徒與外邦信徒之間的裂痕（根據 2:11–22）；有學者認為是早期的諾斯底思想，所以保羅一再強調「豐盛」「奧祕」「知識」；也有學者（如阿諾德 Clinton Arnold）根據以弗所是古代著名的法術之城，認為收信人最大的問題是對靈界勢力的懼怕，所以保羅一開頭就說基督「遠超過一切執政的、掌權的、有能的、主治的」（1:21）。</p><p>這派的優點是認真找處境，而且找到的幾條線索都是真的。<strong>難處：</strong>每一種重建都只能抓住信的一部分，彼此還互相競爭；保羅自己沒有說「我聽說你們中間有……」（對照林前 1:11），若硬要把整封信掛在某一場危機上，其他的段落就會被讀歪。而且重建出來的危機若太具體，今天的讀者又會覺得「那不是我的問題」。</p>"],["共同處境說（傳閱信的處境不是某一場危機，而是每一間外邦人教會共同的處境）","","<p>沿用哥林多前書立場一的原則—應用讀法，但把「處境」放寬：傳閱信要在亞細亞許多城市被宣讀，它的處境就是這些城市共同的處境。以弗所正是典型：城裡有當時世界七大奇觀之一的亞底米神廟，銀匠靠做神龕發財，全城的人可以為她喊上兩個小時（〔背景〕徒 19:23–41）；城裡流通著有名的護身咒語，信主的人把行邪術的書拿來公開焚燒（〔背景〕徒 19:19）；猶太人與外邦人之間有一道真實的牆，保羅後來在耶路撒冷被捕，就是因為有人以為他帶了一個以弗所人進聖殿（〔背景〕徒 21:29）。</p><p>這派的優點是同時接住前面兩派的長處：它承認這封信很寬，也承認這封信有真實的落點。<strong>難處</strong>是「共同處境」容易講得太籠統，變成「任何地方都適用」，又滑回無處境的論文；所以每一章仍要照「書信」三問，把原則落到一個具體的人、一個具體的家、一個具體的城市。</p>"],["【三】本講義站在哪裡","","<p><strong>本講義的立場：沿用哥林多前書立場一——原則照守、落點隨處境，判斷的理由要講出來。本卷補一段：以弗所書很可能是一封傳閱信，它的處境不是某一場危機，而是每一間外邦人教會共同的處境——在一個充滿偶像、法術、族群隔閡的城市裡，作神的家。</strong></p><p>所以全卷的三個動詞都有地方落腳：<strong>坐</strong>——一群曾經「順服空中掌權者的首領」（2:2）的人，如今「一同坐在天上」（2:6）；<strong>行</strong>——在一座「存虛妄的心行事」（4:17）的城裡，「行事為人就當與蒙召的恩相稱」（4:1）；<strong>站</strong>——在一座法術之城裡，「穿戴神所賜的全副軍裝」（6:11）。這三件事都是在一座真實的城市裡發生的。</p><p><strong>今天的以弗所，就是每一座有廟、有算命攤、有族群分隔的華人城市</strong>：街角有香火鼎盛的廟，夜市有算命攤，手機裡有星座運勢，教會裡有國語堂、粵語堂、英語堂、新移民與老僑。全卷六章的落點，都照這一條量：<strong>「在基督裡」的人，怎樣在今天的家、教會、職場、城市裡坐、行、站？</strong></p>"],["【四】這件事該不該影響你的信心","","<p>不該——反過來說，知道這是一封傳閱信，正是一種安慰。這封信從一開始就不是寫給某一間模範教會的，是寫給一群散在許多城市、彼此可能不認識、背景各不相同的信徒，讓他們一間一間地傳下去讀。它在第一世紀就已經被傳來傳去，今天傳到你手上，也不是誤寄。</p><p>它也告訴我們：神的家不是在一座乾淨的城市裡蓋起來的。以弗所城有神廟、有咒語、有暴動、有族群的敵意，保羅卻對這城裡的人說：「這樣，你們不再作外人和客旅，是與聖徒同國，是神家裡的人了」（2:19）。<strong>你住的城市再世俗、再迷信、再分裂，也不會比以弗所更難；神的家照樣可以在那裡被建造起來。</strong></p>"]],"con":[],"say":"本講義的全卷立場：沿用哥林多前書立場一——原則照守、落點隨處境，判斷的理由要講出來。以弗所書很可能是一封傳閱信，它的處境不是某一場危機，而是每一間外邦人教會共同的處境：在偶像、法術、族群隔閡的城市裡作神的家。今天的以弗所，就是每一座有廟、有算命攤、有族群分隔的華人城市。","care":"牧養底線：講「今天的以弗所」時，不嘲笑或醜化會眾家人的民間信仰，也不點名羞辱某一個族群、方言群或世代——席上有剛信主、全家仍在拜拜的人，他回家要面對的是愛他的父母，不是講台上的漫畫。也要想到在教會裡一直覺得自己是「外人和客旅」的人：新移民、從別的族群或宗派來的人、說不同方言的人，對他們 2:19 要清楚講出來。講完，會眾帶走的應該是「神的家可以在我的城市裡被建造」，而不是更怕這座城、或更瞧不起城裡的人。"},{"id":"ISS00_2","t":"揀選與預定——神預先決定誰得救嗎？那人的選擇呢？","r":"1:4--5；1:11；1:13；2:8--10","ch":[],"why":"二、各家並陳；揀選是「在基督裡」的、動機是愛、目的是聖潔與讚美，從不攔阻傳福音——本講義的全卷立場之二（本卷新立）。以弗所書一開頭就連用「揀選」「預定」，這是教會爭了兩千年、至今各大宗派仍站在不同位置上的題目。講台上又常常落成兩種傷害：一種是宿命論，叫人不傳福音、不禱告，或對失喪者的家人說「可能他沒有被揀選」；另一種是怕這個題目而乾脆不講，讓 1:3–14 這段全本聖經最豐富的頌讚被跳過去。這一題必須在開卷講定。","pos":[["【一】經文問的是甚麼","","<p>「就如神從創立世界以前，在基督裡揀選了我們，使我們在他面前成為聖潔，無有瑕疵」（1:4）；「又因愛我們，就按著自己的意旨所喜悅的，預定我們藉著耶穌基督得兒子的名分」（1:5）；「這原是那位隨己意行、做萬事的，照著他旨意所預定的」（1:11）。經文問的是：神預先決定誰得救嗎？那人的選擇呢？沒有被揀選的人呢？</p><p>在進入各家之前，先讓經文自己說四件事。<strong>一、揀選是「在基督裡」的</strong>（1:4）——不是在基督以外一張抽象的名單；1:3–14 這一段原文一口氣兩百多個字，「在基督裡」「在他裡面」一再出現。<strong>二、揀選的動機是愛</strong>：「又因愛我們」（1:5）——不是冷冰冰的命定。<strong>三、揀選的目的是聖潔與讚美</strong>：「使我們在他面前成為聖潔，無有瑕疵」（1:4），「使他榮耀的恩典得著稱讚」（1:6）。<strong>四、揀選不取消人的回應</strong>：「你們既聽見真理的道，就是那叫你們得救的福音，也信了基督」（1:13）。</p><p>各家的爭論不在這四件事要不要信，而在它們怎樣拼在一起：神的揀選是揀選個人，還是揀選一個群體？揀選是根據神自己的旨意，還是根據神預先知道誰會相信？</p>"],["加爾文派（無條件的揀選：神照自己的旨意揀選個人）","","<p>改革宗的讀法：神在創立世界以前，單單照著「自己的意旨所喜悅的」（1:5），揀選了特定的個人得救；揀選不是因為神看見人裡面有甚麼好，連信心本身也是神所賜的（多數改革宗讀 2:8「乃是神所賜的」包括信心在內）。多特會議（1618–1619）的「無條件揀選」與威斯敏斯德信條第三章是這派的經典表述。這派最強的地方是 1:11「隨己意行、做萬事的」與 2:8–9「不是出於自己」「免得有人自誇」：它徹底拿走了人的誇口——<strong>你得救，連一點點也不是你掙來的</strong>。</p><p><strong>難處：</strong>它必須面對「那沒有被揀選的人呢」這個沉重的問題；部分加爾文派主張「雙重預定」（神也預定了人滅亡），這在經文與牧養上都很難承擔。講台上若處理不慎，容易滑成宿命論：「傳不傳都一樣」「他可能不是選民」——而這正是加爾文派自己的優秀傳道人（如司布真）也極力反對的。</p>"],["阿米念派與衛斯理宗（有條件的揀選：神預知誰會相信）","","<p>認為神的揀選是根據他的預知：神從創立世界以前就知道誰會回應福音而相信，就揀選了這些人（並見「因為他預先所知道的人，就預先定下效法他兒子的模樣」，羅 8:29）。神「願意萬人得救，明白真道」（提前 2:4），「不願有一人沉淪，乃願人人都悔改」（彼後 3:9），所以基督為萬人而死，恩典臨到每一個人，人可以回應，也可以拒絕。衛斯理約翰把這條路帶進了循道運動，今天許多聖潔運動、五旬節派與浸信會傳統都站在這一邊。</p><p>這派最強的地方是 1:13「聽見……也信了」：人的回應是真的，福音的邀請是真誠的。<strong>難處：</strong>1:5 說預定是「按著自己的意旨所喜悅的」，1:11 說是「照著他旨意所預定的」，經文強調的根據是神的旨意，不是人的反應；若揀選最後取決於人的選擇，2:9「免得有人自誇」就需要更多說明——相信的人和不相信的人之間，差別究竟在哪裡？</p>"],["群體揀選說（神揀選的是「在基督裡」的群體，個人藉信進入這個群體）","","<p>認為 1:4 的「我們」是一個群體：神在基督裡揀選了一個子民——就像舊約神揀選以色列這個民族——而個人藉著信，進入「在基督裡」這個蒙揀選的群體。基督自己是那一位蒙揀選者，人在他裡面才是蒙揀選的（巴特 Karl Barth 從另一個角度把揀選集中在基督身上，近代許多註釋也強調群體的面向）。這派的優點是緊貼以弗所書自己的重點：1–3 章講的正是神怎樣把猶太人與外邦人「造成一個新人」（2:15），揀選的結果是一個群體，「同為後嗣，同為一體，同蒙應許」（3:6）。</p><p><strong>難處：</strong>它容易把揀選講得太抽象，好像神只揀選了一個類別，卻不認識裡面的每一個人；而保羅在別處也講到個人的蒙召（加 1:15）。而且群體是由個人組成的，「誰會進入這個群體」的問題，最後仍要回到加爾文派與阿米念派的爭論。</p>"],["路德宗（單預定：得救全是神的揀選，滅亡全是人自己的責任）","","<p>路德宗的協和信條肯定神從永遠揀選了得救的人，得救全歸於神的恩典；但拒絕從這裡推論出神也預定了人滅亡——人滅亡是因為拒絕恩典，責任全在人自己。路德宗也勸人不要在基督以外去揣測「我有沒有被揀選」，而要在聽道與聖禮中抓住神的應許。這派的牧養智慧很深：它把揀選當成安慰，不當成謎題。</p><p><strong>難處：</strong>它在邏輯上留下一個不對稱的張力：若得救全在於神的揀選，滅亡又不在於神的預定，兩者怎樣同時成立？路德宗的回答是「這是神隱藏的旨意，我們不探究」，這是謙卑，卻也讓喜歡把系統講完整的人覺得沒有答完。不過這份「停在經文停的地方」，正是許多牧者認為最合乎聖經的地方。</p>"],["【三】本講義站在哪裡","","<p><strong>本講義的立場：陳列各家，不替讀者決定這個兩千年的爭論；但講台的落點一致。</strong>第 1 章的原文解經處理 προορίσας（預定）與 ἐξελέξατο（揀選）時，一律並陳各家讀法。</p><p><strong>落點一：揀選是安慰，不是恐嚇。</strong>保羅不是在辯論，是在頌讚——1:3–14 三次說「使他榮耀的恩典得著稱讚」。揀選的教義是要讓得救的人確知：這不是自己掙來的，「這並不是出於自己，乃是神所賜的」（2:8）。</p><p><strong>落點二：揀選是「在基督裡」的。</strong>想知道自己有沒有被揀選，不是去猜一張名單，是來到基督面前。在基督以外沒有揀選；在基督裡面的人，可以放心。</p><p><strong>落點三：揀選從來不攔阻傳福音。</strong>保羅越相信揀選，越放膽傳——同一封信的末了，他求眾聖徒為他禱告，「使我得著口才，能以放膽開口講明福音的奧祕」（6:19）。<strong>相信揀選的人，最有理由去傳福音：因為他知道，福音不會白傳。</strong></p>"],["【四】這件事該不該影響你的信心","","<p>不該。<strong>各派都同意：人得救全是神的恩典；凡來到基督面前的，他必不丟棄</strong>——這使我們想起耶穌的話：「到我這裡來的，我總不丟棄他」（約 6:37）。加爾文派與阿米念派爭的是揀選怎樣運作，不是神愛不愛罪人、福音是不是真心的邀請。</p><p>如果你曾因為這個題目而害怕——「萬一我不是選民呢？」——請注意保羅寫 1:4 的口氣：他不是在發一張名單，他是在跪著讚美。<strong>一個為自己有沒有被揀選而擔心的人，往往正是聖靈在他心裡工作的人</strong>；被遺棄的人不會為這件事流淚。答案不在你心裡的感覺，在基督身上：你若到他那裡去，他不丟棄。</p>"]],"con":[],"say":"本講義的全卷立場：揀選與預定的爭論，加爾文派、阿米念派、群體揀選說、路德宗並陳，不替讀者決定；但講台的落點一致——揀選是「在基督裡」的、動機是愛、目的是聖潔與讚美；揀選是安慰不是恐嚇；想知道自己有沒有被揀選，不是猜名單，是來到基督面前；揀選從來不攔阻傳福音。","care":"牧養底線：不對任何人說「你可能沒有被揀選」，也不對一位為不信主的兒女流淚的父母說「也許他不在名單上」（紅線四）。不用預定為不傳福音、不禱告、不悔改找理由。不用預定解釋悲劇——「這是神預定的」不可以對一位剛失去孩子的母親說；對正在流淚的人，先陪他哭，不急著解釋神的旨意。席上會有長期活在「萬一我不是選民」恐懼裡的人，對他們講 1:13 與約 6:37，必要時會後單獨陪談；也會有把揀選當作驕傲資本的人，對他們講 1:4 的目的是聖潔、2:9 的「免得有人自誇」。不要讓這一題變成神學派別的辯論賽，講完會眾記得的應該是「他因愛我們」。"},{"id":"ISS00_3","t":"家與職場的順服：夫妻、親子、主僕——5:21--6:9 今天怎樣讀？","r":"5:18--33；6:1--9","ch":[],"why":"三、整段在「存敬畏基督的心，彼此順服」底下，每一組都是雙向的；順服絕不包括忍受暴力——本講義的全卷立場之三（本卷新立）。5:21–6:9 是全卷最常在婚禮、家庭講座、職場團契裡被引用的一段，也是最常被拿來傷人的一段：有妻子被教導「他打你，你要更順服」，有成年兒女被要求「父母叫你嫁誰你就嫁誰」，有員工被要求「像服事基督一樣」做假帳。這一題講錯，傷的是會眾席上最沒有力量說話的人，必須在開卷講定。","pos":[["【一】經文問的是甚麼","","<p>5:21–6:9 三組關係——妻子與丈夫、兒女與父母、僕人與主人——每一組都有一方被要求順服或聽從。這在今天還適用嗎？怎樣適用？妻子遇到暴力也要順服嗎？成年兒女要聽父母安排婚姻、工作嗎？員工要聽老闆做不合理的事嗎？</p><p>先讓經文自己說五件事。<strong>一、整段的標題是 5:21</strong>：「又當存敬畏基督的心，彼此順服」（5:21）。而 5:21 是 5:18「乃要被聖靈充滿」帶出的五個分詞的最後一個；5:22 原文沒有動詞，「順服」是從 5:21 借來的。<strong>順服是聖靈充滿的人在家裡的樣子，不是一方對另一方的權利。</strong><strong>二、每一組都是雙向的，而且對「上面那一方」的要求更重</strong>：丈夫要「正如基督愛教會，為教會捨己」（5:25）；父親「不要惹兒女的氣」（6:4）；主人「不要威嚇他們。因為知道，他們和你們同有一位主在天上；他並不偏待人」（6:9）。<strong>三、每一組都有一位更高的主</strong>：「如同順服主」（5:22）、「要在主裡聽從父母」（6:1）、「好像聽從基督一般」（6:5）——基督在上面，所以任何人的權柄都不是絕對的。</p><p><strong>四、在第一世紀，這段話是革命性的</strong>：當時希臘—羅馬的家規只對妻子、兒女、奴隸下命令；保羅卻也對丈夫、父親、主人下命令，而且直接對妻子、兒女、奴隸說話——把他們當成有道德責任、能自己回應基督的人。<strong>五、保羅沒有建立奴隸制，也沒有替它辯護</strong>；他把主人和奴隸放在同一位主之下（6:9），並且對另一位主人說，要收回逃跑的奴隸「不再是奴僕，乃是高過奴僕，是親愛的兄弟」（門 1:16）。</p>"],["夫妻：互補派（夫妻在神面前平等，但有不同的角色；丈夫的帶領是捨己的帶領）","","<p>認為 5:22–33 把夫妻關係建立在基督與教會的關係上（5:32），不只是第一世紀的文化安排：丈夫是「妻子的頭」（5:23），負起帶領的責任；妻子以順服回應。但這個「頭」的定義是經文自己給的——「他又是教會全體的救主」（5:23），「為教會捨己」（5:25）；所以丈夫的帶領是保護、供應、捨己，不是發號施令。這派的優點是認真對待 5:31–32 把婚姻連到創造與基督的奧祕，也認真對待保羅全部的書信（並見西 3:18–19）。</p><p><strong>難處：</strong>它必須說明 5:21「彼此順服」怎樣落在丈夫身上，否則容易變成單向的順服；而且在實踐上，互補派教會常常有人把「頭」講成權力，把順服講成無條件——那是這一派自己的優秀學者也明確反對的。此外，同一段的主僕關係今天大家都承認是處境性的，夫妻這一組為甚麼不同，需要說明。</p>"],["夫妻：平等派（5:21 的彼此順服是原則，5:22–24 是處境性的應用）","","<p>認為 5:21「彼此順服」是整段的原則，5:22–24 是保羅在第一世紀父權家庭結構裡對這個原則的應用；既然同一段的主僕關係今天不再照字面實行，妻子順服丈夫的形式也應當隨處境調整，今天的夫妻應當彼此順服、共同決定。這派指出：5:22 原文連動詞都沒有，順服是從「彼此順服」借來的；而且保羅對丈夫說的話比對妻子多出三倍。這派的優點是把 5:21 讀活了，也看見了這段經文在當時解放的方向。</p><p><strong>難處：</strong>5:23–24 把夫妻的關係對應到基督與教會（「教會怎樣順服基督，妻子也要怎樣凡事順服丈夫」，5:24），5:31 又引創 2:24 的創造秩序，這比主僕關係更難說成只是處境；若處理不慎，容易變成「凡不合我們時代的經文都是處境」。<strong>兩派都是福音派、都敬重聖經權威</strong>（回指哥林多前書立場二、加拉太書立場四）。</p>"],["親子：「聽從」到幾歲？華人孝道的兩種極端","","<p>一端是<strong>孝道全盤接受</strong>：把 6:1 讀成「父母說的都要聽」，一生如此，連婚姻對象、職業、居住地點、要不要信耶穌都由父母決定，否則就是不孝、不屬靈。這一端的心志是尊重父母，也正確地看見 6:2 是「第一條帶應許的誡命」。<strong>難處：</strong>6:1 的「兒女」（τὰ τέκνα）是在家中受養育的孩子；5:31 說「人要離開父母，與妻子連合」；6:1 的「在主裡」也是界線——父母要求違背主的事，兒女不能聽從。</p><p>另一端是<strong>個人主義</strong>：既然成年了，父母的意見就只是參考，甚至用「在主裡」為冷淡、不奉養、不聯絡找理由。這一端的心志是要分清楚界線。<strong>難處：</strong>「孝敬父母」（6:2）沒有年齡的期限，是一生的責任；耶穌在十字架上還把母親託付給門徒。分清楚界線，不等於可以不愛。</p>"],["主僕：聖經支持奴隸制嗎？今天怎樣用在職場？","","<p><strong>一種讀法</strong>認為保羅既然吩咐「作僕人的，要懼怕戰兢……聽從你們肉身的主人」（6:5），就等於接受了奴隸制；十九世紀美國南方的奴隸主正是這樣用這段經文的。這個讀法誠實地面對了經文沒有直接下令廢除奴隸制。<strong>難處：</strong>它忽略了 6:9 把主人放在「同有一位主在天上」底下，也忽略了腓利門書與歷史上廢奴運動的基督徒（如威伯福斯）正是從這些經文得著動力的。</p><p><strong>另一種讀法</strong>認為 6:5–9 與今天毫無關係，因為今天沒有奴隸。<strong>難處：</strong>今天的僱傭關係雖然不是奴隸制，但上下權力不對等的處境到處都是；6:6–7「從心裡」「甘心事奉，好像服事主，不像服事人」，正是職場基督徒最需要的一節。保羅在一個無法立刻改變制度的世界裡，先改變了制度裡的人，也埋下了制度改變的種子。</p>"],["【三】本講義站在哪裡","","<p><strong>本講義的立場：整段在 5:21「存敬畏基督的心，彼此順服」底下；每一組都是雙向的，對上面那一方的要求更重；每一組都有一位更高的主，所以任何人的權柄都不是絕對的。</strong>講台上一定照 5:18 → 5:21 → 5:22 → 5:25 的次序讀。</p><p><strong>夫妻</strong>：互補與平等並陳，本講義不替各家庭決定分工；但兩派都必須同意的底線是：<strong>順服絕不包括忍受暴力、虐待、控制或被迫犯罪。遇到家暴，教會的第一件事是保護受害者的安全（必要時協助報警、尋求專業協助與庇護），不是勸她回家順服。</strong>丈夫若引 5:22 而不行 5:25，他已經先離開了經文。</p><p><strong>親子</strong>：「孝敬」（6:2）是一生的責任；「聽從」（6:1，ὑπακούετε）是對在家中受養育的兒女說的。成年兒女孝敬父母——尊重、照顧、奉養——但<strong>婚姻、信仰、呼召的決定，是在主面前自己負責的</strong>。6:1 的「在主裡」也是界線：父母要求違背主的事，兒女可以不聽從，但仍要孝敬。華人孝道與 6:2 相合的部分，基督徒要做得更好；不相合的部分——以孝為名的操控、祭祖、要求犧牲信仰——要溫柔而堅定地分辨。</p><p><strong>主僕</strong>：今天的僱傭關係不是奴隸制，但原則適用：員工「從心裡」「甘心」做工，像服事主（6:6–7）；雇主不威嚇、不偏待，因為自己頭上也有主（6:9）。<strong>這不包括忍受違法、霸凌、性騷擾或被要求作假。</strong>6:7「好像服事主，不像服事人」是職場基督徒最重要的一節，可與職場得勝的事工銜接。</p>"],["【四】這件事該不該影響你的信心","","<p>不該。<strong>各派都同意：基督是家庭與職場的主；愛、捨己、尊重、甘心是每一方的責任。</strong>互補派與平等派爭的是家庭分工的形式，不是丈夫可不可以傷害妻子——兩派都說不可以。</p><p>如果你曾經被這段經文傷過——被要求忍受暴力、被以孝為名操控、被以「順服」為名在職場上欺壓——請知道：傷害你的不是這段經文，是有人只讀了一半。這段經文從頭到尾在保護比較沒有力量的那一方：它對丈夫說「捨己」，對父親說「不要惹兒女的氣」，對主人說「不要威嚇他們」。<strong>在這段經文裡，每一個人頭上都有一位主，而那一位主「並不偏待人」（6:9）。</strong></p>"]],"con":[],"say":"本講義的全卷立場：5:21–6:9 整段在「存敬畏基督的心，彼此順服」底下，每一組都是雙向的，對上面那一方的要求更重；夫妻分工互補與平等並陳，但順服絕不包括忍受暴力，遇到家暴先保護安全；成年兒女孝敬父母，但婚姻、信仰、呼召在主面前自己負責；職場甘心做工，雇主不威嚇，不包括忍受違法、霸凌或作假。","care":"牧養底線：講 5:22 一定要從 5:18、5:21 開始讀，並且讀到 5:25、5:33（紅線一）。不對家暴受害者說「你要更順服」「為了孩子忍一忍」「你要饒恕他」——先安全，再談其他；不追問細節，不要求她立刻原諒或和好，會後單獨關心，必要時協助報警、尋求專業協助與庇護。不用 6:1 綁住成年兒女，也不用「在主裡」為不孝找理由；不用 6:5 叫員工無條件服從，也不用 6:9 煽動對立——講台要同時對兩方說話（紅線二）。席上可能有正在受暴卻不敢說的姊妹、被父母逼婚的青年、在職場被霸凌的弟兄：講完這一段，他們應當更願意求助，而不是更不敢開口。"},{"id":"ISS00_4","t":"屬靈爭戰：不迷信、不輕忽——執政掌權者是誰？基督徒怎樣爭戰？","r":"1:20--22；2:2；4:26--27；6:10--18","ch":[],"why":"四、勝負已定，從得勝的位置站立；軍裝是真理與品格，不是儀式；不採地域邪靈戰術，身心困擾同時尋求醫療——本講義的全卷立場之四（本卷新立）。華人教會在這一題上常常兩極：一邊凡事見鬼，把憂鬱症講成「憂鬱的靈」、把城市講成被某某邪靈轄制、在講台上點名捆綁；另一邊把魔鬼講成古人的比喻，對會眾家中的鬼月、風水、廟宇、護身符一句話也不敢說。以弗所本身就是一座法術之城，這封信從 1:21 到 6:12 一路在講執政掌權者，這一題必須在開卷講定。","pos":[["【一】經文問的是甚麼","","<p>「因我們並不是與屬血氣的爭戰，乃是與那些執政的、掌權的、管轄這幽暗世界的，以及天空屬靈氣的惡魔爭戰。」（6:12）經文問的是：這些是誰？基督徒要怎樣爭戰？基督徒會被鬼附嗎？要不要點名、捆綁、驅趕？華人的鬼月、風水、廟宇、護身符要怕嗎？</p><p>先讓經文自己說五件事。<strong>一、勝負已定</strong>：基督已經「遠超過一切執政的、掌權的、有能的、主治的」（1:21），「又將萬有服在他的腳下」（1:22）；我們與他「一同坐在天上」（2:6）。<strong>爭戰是從得勝的位置出發，不是為了得勝。</strong><strong>二、爭戰是真的</strong>：「魔鬼的詭計」（6:11）、「那惡者一切的火箭」（6:16）——保羅不是在用比喻嚇人。<strong>三、爭戰的方式是「站」，不是「衝」</strong>：「就能抵擋魔鬼的詭計」（6:11），「並且成就了一切，還能站立得住」（6:13），「所以要站穩了」（6:14）——全副軍裝只有一件攻擊的武器，而那件是「聖靈的寶劍，就是神的道」（6:17）。</p><p><strong>四、軍裝是品格與真理</strong>：真理、公義、平安的福音、信德、救恩、神的道、禱告（6:14–18）——沒有一件是儀式或口訣。<strong>五、最常見的戰場很平凡</strong>：「生氣卻不要犯罪；不可含怒到日落，也不可給魔鬼留地步」（4:26–27）——魔鬼的地盤，常常是從一個沒有處理的怒氣開始。</p>"],["傳統福音派（執政掌權者是靈界的墮落天使）","","<p>認為 1:21、3:10、6:12 的「執政的、掌權的」指的是有位格的靈界勢力，就是撒但與跟隨牠的墮落天使；6:12 明說它們是「天空屬靈氣的惡魔」，又說我們「並不是與屬血氣的爭戰」——對手不是人。2:2 的「空中掌權者的首領」就是撒但，今天仍「在悖逆之子心中運行」。這派的優點是照經文的字面認真對待靈界的真實，也與耶穌趕鬼、使徒行傳 19 章以弗所的屬靈衝突一致。</p><p><strong>難處：</strong>若只講靈界，容易讓人把一切惡都推給鬼，而忽略了人自己的罪、以及惡在社會制度、文化風氣裡的具體樣子；保羅在同一封信裡也講貪婪（5:5）、謊言（4:25）、偷竊（4:28），這些都是在人身上、在群體裡運作的。只講靈界，爭戰就很容易從生活搬進禱告室，再從禱告室搬到台上表演。</p>"],["結構說（執政掌權者也包括人間政治、經濟、文化結構中的邪惡勢力）","","<p>認為新約的「執政的、掌權的」在別處也用來指地上的官長（如路 12:11），保羅所說的勢力，是透過政權、經濟制度、文化與意識形態運作的邪惡力量；部分學者（如溫克 Walter Wink）甚至認為它們就是制度的「內在靈性」，不一定是獨立的靈體。這派的優點是讓屬靈爭戰落到地上：種族隔閡、拜金主義、剝削與謊言，都是「這幽暗世界」的具體樣子；2:14「拆毀了中間隔斷的牆」本身就是對一種社會結構的勝利。</p><p><strong>難處：</strong>若把執政掌權者完全化約成社會結構，6:12「天空屬靈氣的惡魔」與 6:11「魔鬼的詭計」就被讀淡了，滑向把魔鬼講成只是比喻——這正是紅線三另一面要擋的。而且若爭戰只在社會層面，教會就容易變成另一個政治團體，用屬血氣的方式去打一場保羅說不是屬血氣的仗。</p>"],["策略性層次屬靈爭戰（地域邪靈、屬靈地圖、點名捆綁）","","<p>1990 年代以後在部分靈恩圈流行（如華格納 C. Peter Wagner 等人的推廣）：認為每一座城市、每一個地區都有掌管它的「地域邪靈」，教會要先繪製「屬靈地圖」，找出邪靈的名字與據點，再透過集體禱告點名捆綁，城市才會開放福音。這派的心志是要認真對待屬靈爭戰，不讓教會只停在理論；它也正確地看見禱告在宣教裡的重要。</p><p><strong>難處：</strong>新約沒有任何一處教導這樣做，6:10–18 也沒有；保羅住在以弗所兩年多，沒有一次點名捆綁亞底米，他「天天辯論」（〔背景〕徒 19:9），結果是「主的道大大興旺，而且得勝」（徒 19:20）。這套做法容易把焦點從基督移到邪靈身上，讓會眾更怕、更好奇，而不是更平安；也容易發展出新的口訣與儀式，正好落回以弗所人燒掉的那一類書。</p>"],["除魅說（魔鬼與邪靈只是古人表達邪惡的比喻）","","<p>受十九、二十世紀理性主義與部分學者「除去神話」讀法的影響，認為保羅用的是第一世紀的宇宙觀語言，今天應當把「執政掌權者」「魔鬼」翻譯成心理學或社會學的語言：人內心的黑暗、群體的盲從、制度的不公。這派的心志是讓現代人能夠聽懂聖經，也提醒教會不要用「鬼」來逃避責任與醫療。</p><p><strong>難處：</strong>這是拿掉了經文自己堅持的東西。保羅說「並不是與屬血氣的爭戰」（6:12），又說「要穿戴神所賜的全副軍裝，就能抵擋魔鬼的詭計」（6:11）；耶穌的事工、使徒行傳 19:11–20 也都把邪靈當成真實的。而且在華人處境裡，這種讀法對會眾一點幫助也沒有：他回家面對的鬼月、乩童、符咒是真實的恐懼，講台若只說「那是比喻」，他就只好去找別人幫他處理。</p>"],["【三】本講義站在哪裡","","<p><strong>本講義的立場：執政掌權者主要是靈界的勢力</strong>（6:12「天空屬靈氣的惡魔」），<strong>它們也會透過人間的結構與文化運作</strong>——所以爭戰既在禱告裡，也在說誠實話、行公義、拒絕貪婪裡。勝負已定，我們從得勝的位置站立；軍裝是真理與品格，不是儀式與口訣。</p><p><strong>不採用「地域邪靈」「屬靈地圖」「點名捆綁」的戰術</strong>：新約沒有教導，6:10–18 也沒有；保羅的戰術是站住、禱告、傳福音——「為眾聖徒祈求，也為我祈求，使我得著口才，能以放膽開口講明福音的奧祕」（6:18–19）。</p><p><strong>華人處境</strong>：基督徒不必怕鬼月、風水、廟宇——「你們從前遠離神的人，如今卻在基督耶穌裡，靠著他的血，已經得親近了」（2:13），「從前你們是暗昧的，但如今在主裡面是光明的」（5:8）；<strong>但也不參與</strong>——不拜、不求、不戴護身符、不擇日，因為那是把信靠交給「空中掌權者的首領」（2:2）。以弗所城本身就是一座法術之城；那裡的信徒的做法是：「平素行邪術的，也有許多人把書拿來，堆積在眾人面前焚燒」（徒 19:19）。</p><p><strong>基督徒會被鬼附嗎</strong>：福音派之間有不同看法；本講義的牧養立場是——<strong>不輕易說人「被鬼附」</strong>；遇到情緒、精神困擾，先轉介醫療與專業協助，同時為他禱告，兩者不衝突。</p>"],["【四】這件事該不該影響你的信心","","<p>不該。<strong>各派都同意：基督已經得勝；信徒靠著主站立得住。</strong>爭論的是執政掌權者怎樣運作、教會要用甚麼方式回應，不是基督有沒有「遠超過一切執政的、掌權的」（1:21）。</p><p>如果你從小在一個充滿禁忌的環境長大——幾點不能出門、哪一個月不能搬家、哪一個方位不能放床——以弗所書要對你說的第一句話不是「要更小心」，而是：你已經與基督耶穌「一同坐在天上」（2:6）。<strong>全副軍裝不是為了讓你更緊張，是為了讓你站得住。</strong>一個知道自己坐在哪裡的人，走過廟口可以平平安安地走過去，不必繞路，也不必拿香。</p>"]],"con":[],"say":"本講義的全卷立場：執政掌權者主要是靈界勢力，也透過人間的結構與文化運作；勝負已定，信徒從得勝的位置站立，軍裝是真理、公義、福音、信德、救恩、神的道與禱告，不是儀式或口訣。不採地域邪靈、屬靈地圖、點名捆綁；不怕鬼月、風水、廟宇，但不拜、不求、不戴護身符、不擇日；不輕易說人被鬼附，先轉介醫療並同時禱告。","care":"牧養底線：不把一切問題都講成鬼的問題——憂鬱症、思覺失調、婚姻衝突、孩子叛逆——那會延誤治療，也會傷害人（紅線三）；也不把屬靈爭戰講成只是比喻，6:11「魔鬼的詭計」是真的。不在講台上表演趕鬼、不點名地域邪靈、不販賣屬靈恐懼。席上可能有正在服藥、看精神科、卻被人說「你就是信心不夠、被邪靈攪擾」的弟兄姊妹：要明說看醫生不是不信，會後單獨關心，陪他就醫，同時為他禱告。也可能有家中長輩是乩童、廟公的初信者，不要拿他的家庭當例子。果效要是平安，不是恐慌：會眾聽完 6:12，要更安穩地站在基督裡，不是回家把每一個角落都看成鬼。"},{"id":"ISS00_5","t":"五重職份與今日的使徒、先知——4:11 怎樣讀？321 的「235」怎樣用？","r":"2:20；3:5；4:7--16","ch":[],"why":"五、新約使徒的根基職分不再有，使徒性與先知性的功能仍需要；職分是為了成全聖徒、各盡其職，不是頭銜與層級——本講義的全卷立場之五（本卷新立）。4:11 是 321「235」的「5 五重職份團隊」的出處，這正是本卷最大的試探：讀到 4:11 就以為讀到了自己。華人教會近年也有人自稱「使徒」「先知」，以「遮蓋」要求絕對順服與奉獻，用「先知性的話」替人決定婚姻、工作、搬遷。今天還有沒有使徒、先知，321 怎樣使用這節經文而不越過經文，必須在開卷講定。","pos":[["【一】經文問的是甚麼","","<p>「他所賜的，有使徒，有先知，有傳福音的，有牧師和教師」（4:11）——今天還有使徒、先知嗎？誰可以自稱使徒？「五重職事」是教會組織的藍圖嗎？321 的「235」怎樣使用這節經文？</p><p>先讓經文自己說五件事。<strong>一、職分是升天的基督「賜」的</strong>：「他升上高天的時候，擄掠了仇敵，將各樣的恩賜賞給人」（4:8）——是禮物，不是頭銜；是給教會的，不是給個人的。<strong>二、職分的目的寫得很清楚</strong>：「為要成全聖徒，各盡其職，建立基督的身體」（4:12）——職分是為了讓別人上場。原文 πρὸς τὸν καταρτισμὸν τῶν ἁγίων，καταρτισμός 這個字族用在修補漁網、接回脫臼的骨頭：職分是為了把每一個聖徒「接好」，讓他自己能動。<strong>三、終點是成熟與合一</strong>：「直等到我們眾人在真道上同歸於一，認識神的兒子，得以長大成人」（4:13）。</p><p><strong>四、使徒和先知是「根基」</strong>：「被建造在使徒和先知的根基上，有基督耶穌自己為房角石」（2:20）；奧祕是「藉著聖靈啟示他的聖使徒和先知」（3:5）——根基只打一次。<strong>五、每一個人都有份</strong>：「我們各人蒙恩，都是照基督所量給各人的恩賜」（4:7）；「百節各按各職」（4:16）。</p>"],["止息論（使徒與先知的職分在新約根基完成後就停止了）","","<p>認為使徒與先知屬於教會的「根基」（2:20），他們的任務是領受並傳下新約的啟示（3:5）；根基打好、新約正典完成以後，這兩個職分就停止了，今天教會的職分是傳福音的、牧師和教師。新約的使徒有清楚的資格：見過復活的主、被他直接差遣——「我不是使徒嗎？我不是見過我們的主耶穌嗎？」（林前 9:1），補選猶大時也要求是「同作耶穌復活的見證」（徒 1:22）的人。這派的優點是守住了聖經的終極權威，擋住了一切自稱有新啟示的人。</p><p><strong>難處：</strong>4:11–13 說這些職分要持續「直等到我們眾人在真道上同歸於一……得以長大成人」，教會顯然還沒有到那一步；新約也用「使徒」一詞稱呼十二位之外的人（如巴拿巴，徒 14:14），可見這個字有較寬的用法。若一概說「已經停止」，教會可能失去開拓、差傳與造就勸勉的功能，變成只會維持、不會出去的教會。</p>"],["溫和延續論（使徒性與先知性的功能今天仍有，但不具新約使徒、先知的權威）","","<p>認為要分開「職分」與「功能」：新約十二使徒與保羅那種見證復活、奠定根基的權威不會再有；但「使徒性」的功能——被差遣、開拓、植堂、跨文化宣教——與「先知性」的功能——「但作先知講道的，是對人說，要造就、安慰、勸勉人」（林前 14:3）——今天仍然需要，教會也仍然有人有這樣的恩賜。許多福音派與靈恩派學者（並哥林多前書立場三）站在這個位置。</p><p>這派的優點是同時保住聖經的權威與教會的活力。<strong>難處</strong>是界線需要不斷守：一旦有人有了「使徒性」的果效，很容易被人尊稱為「使徒」，頭銜一出現，權威就跟著來；先知性的話也需要被察驗，「其餘的就當慎思明辨」（林前 14:29），否則功能會慢慢長成另一個階層。</p>"],["新使徒改革運動（今天有掌權的使徒與先知，領導教會、發布新啟示）","","<p>1990 年代末以後興起的 New Apostolic Reformation（新使徒改革運動）認為：教會正在恢復「使徒與先知」的職分，今天的使徒擁有治理眾教會的權柄，先知領受神對國家、城市、教會的新啟示；教會要「在使徒的遮蓋底下」，五重職事是一個由使徒在頂端的治理架構。這個運動的心志是要教會不只維持，而要擴展；它也提醒教會不要把聖靈的工作只放在過去。</p><p><strong>難處：</strong>這正是本講義要明確分辨的。4:11–16 沒有說使徒在頂端，反而說元首只有一位：「連於元首基督」（4:15）；職分的目的是「成全聖徒，各盡其職」，不是讓聖徒順服某一個人。以頭銜要求絕對順服、奉獻與忠誠，以「先知性的話」替人決定婚姻、工作、搬遷，在華人教會已經造成許多實際的傷害；任何高過聖經的「新啟示」，都動搖了 2:20 那一次打好的根基（屬靈權柄的判斷並見哥林多後書立場三）。</p>"],["【三】本講義站在
